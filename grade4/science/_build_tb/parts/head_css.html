<style>
:root{
  --bg:#e8f5fb; --paper:#fff; --ink:#15313d; --muted:#48646f; --line:#bcd9e4;
  --sky:#1c6fa8; --sky2:#a9d9f2; --sun:#ffc93c; --good:#16804a; --bad:#c2332c; --navy:#0f3b5c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0e2129;--paper:#16323c;--ink:#e7f3f5;--muted:#a6c2cb;--line:#2c4f5b;--sky2:#2b6b8f;--navy:#0a2738}
}
:root[data-theme="dark"]{--bg:#0e2129;--paper:#16323c;--ink:#e7f3f5;--muted:#a6c2cb;--line:#2c4f5b;--sky2:#2b6b8f;--navy:#0a2738}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:1rem;line-height:1.6}
h1,h2,h3,.jua,button{font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400}
h1{font-size:1.8rem;margin:0;line-height:1.25}
h2{font-size:1.35rem;margin:0 0 8px}
p{margin:0 0 10px}
.wrap{max-width:960px;margin:0 auto;padding:16px}
header{background:var(--navy);color:#fff}
header .wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding-top:20px;padding-bottom:20px}
header p{color:#cfe6f2;margin:4px 0 0}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--line)}
nav .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px}
nav a{white-space:nowrap;text-decoration:none;color:var(--ink);font-family:"Jua",sans-serif;font-size:0.95rem;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--paper)}
nav a.done{background:#bdf0cf;border-color:var(--good);color:#0d5a31}
section{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:20px;margin:18px 0;scroll-margin-top:70px}
.stage{display:inline-block;background:var(--sky);color:#fff;border-radius:999px;padding:2px 14px;font-family:"Jua",sans-serif;margin-bottom:8px}
.goal{border-left:8px solid var(--sun);background:var(--paper);padding:12px 16px;border-radius:0 12px 12px 0;margin:16px 0 0}
button{font-size:1rem;min-height:2.6rem;padding:.4em .9em;border-radius:14px;border:3px solid var(--navy);background:var(--paper);color:var(--ink);cursor:pointer}
button:hover{background:var(--sky2)}
button:focus-visible,textarea:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
button.main{background:var(--sky);border-color:var(--sky);color:#fff}
button.sel{background:var(--sun);border-color:#b58400;color:#15313d}
button.right{background:#bdf0cf;border-color:var(--good);color:#0d5a31}
button.wrong{background:#fbd0cb;border-color:var(--bad);color:#8a1f19}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.fb{margin-top:10px;padding:10px 14px;border-radius:12px}
.fb:empty{display:none}
.fb.ok{background:#dcf5e5;color:#0d5a31}.fb.no{background:#fde2df;color:#8a1f19}.fb.info{background:#e1f0fb;color:#12466b}
svg{display:block;max-width:100%;height:auto}
.scene{width:100%;border-radius:16px;border:3px solid var(--navy)}
.tip{font-size:0.85rem;color:var(--muted)}
.found{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.found span{background:#bdf0cf;color:#0d5a31;border-radius:999px;padding:4px 12px;font-size:0.9rem}
textarea{font:inherit;font-size:1rem;width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.blank{display:inline-flex;gap:6px;vertical-align:middle}
.blank span{width:2.4rem;height:2.4rem;border:3px solid var(--sky);border-radius:10px;display:grid;place-items:center;font-family:"Jua",sans-serif;font-size:1.3rem;background:var(--paper)}
table{border-collapse:collapse;width:100%}
td,th{border:2px solid var(--line);padding:8px;text-align:left;font-size:0.95rem}
td.face{text-align:center;white-space:nowrap}
td.face button{min-height:2.4rem;padding:4px 10px;font-size:1.3rem}
.hit{cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rain{from{transform:translateY(-8px);opacity:1}to{transform:translateY(34px);opacity:0}}
@keyframes wob{0%,100%{transform:rotate(0)}30%{transform:rotate(-9deg)}60%{transform:rotate(7deg)}}
@keyframes blow{from{opacity:1;transform:translate(0,0)}to{opacity:0;transform:translate(40px,16px)}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes pop{from{stroke-dashoffset:260}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

/* ===== 화면 비율 자동 맞춤 + 줄바꿈 ===== */
html{font-size:clamp(16px, 11px + 0.85vw, 26px)}
body{font-size:1rem;word-break:keep-all;overflow-wrap:break-word;line-break:strict}
p,li,td,th,.fb,label,.tip,.ds,.pl,.cm,.warn{text-wrap:pretty}
h1,h2,h3,.jua,button,.nm,summary{text-wrap:balance;word-break:keep-all}
.wrap{max-width:none!important;margin:0!important;padding:clamp(10px,2vw,40px)!important}
header .wrap,nav .wrap{padding-top:clamp(8px,1.2vw,22px)!important;padding-bottom:clamp(8px,1.2vw,22px)!important}
header svg{width:4.3rem;height:auto}
section{padding:clamp(12px,1.8vw,34px);border-radius:clamp(14px,1.6vw,28px)}
button{min-width:0}

.pick{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.player{width:min(100%,92vh);margin:0 auto}
.player .ctl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.6rem;align-items:center;margin-top:8px}
.player input[type=range]{width:100%;accent-color:var(--sky);height:2rem}
.chapters{margin-top:6px;gap:6px}.chapters button{font-size:.85rem;min-height:2.2rem;padding:.1em .6em;border-width:2px}
.chapters button.on,#glass.on{background:var(--sun);border-color:#b58400;color:#15313d}
.cap{background:#0f3b5c;color:#fff;border-radius:12px;padding:10px 14px;margin:8px 0;min-height:3.4em}
td.face{width:30%}

/* ===== 실제 사진 (위키미디어 공용) ===== */
.photo{margin:14px 0 4px;border:3px solid var(--navy);border-radius:clamp(12px,1.4vw,22px);overflow:hidden;background:var(--paper)}
.photo img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover}
.photo.wide img{aspect-ratio:16/7}
.photo figcaption{padding:.4rem .7rem;font-size:.95rem;line-height:1.45;text-wrap:pretty}
.photo .cr{display:block;font-size:.7rem;color:var(--muted);margin-top:2px}
.photo .cr a{color:inherit}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1vw,16px)}
.gallery .photo{margin:0}
@media (max-width:640px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
img.ph{display:block;width:100%;aspect-ratio:16/11;object-fit:cover;border-radius:10px}
.credits{margin-top:18px;font-size:.8rem;color:var(--muted)}
.credits summary{cursor:pointer;font-family:"Jua",sans-serif;font-size:.95rem;color:var(--ink)}
.credits li{margin:2px 0;word-break:break-all}
.credits a{color:inherit}
</style>
<style id="hj-contact-css">.hj-contact{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px 12px;margin:8px 0 0;padding:0}.hj-contact a{display:inline-flex;align-items:center;gap:6px;color:var(--ink,#1F2A44);text-decoration:none;font-size:15px;line-height:1.2;background:var(--paper,#fff);border:2px solid var(--line,#CAD6E4);border-radius:999px;padding:5px 12px;white-space:nowrap}.hj-contact a:hover,.hj-contact a:focus-visible{border-color:var(--ink,#1F2A44);outline:0}.hj-contact svg{flex:none}#ovNavMade+.hj-contact{margin:0 0 0 8px;flex:none;flex-wrap:nowrap;gap:6px}#ovNavMade+.hj-contact a{font-size:13px;padding:3px 9px}@media print{.hj-contact a{border:0;padding:0}}</style>
