<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4학년 수학 · 초등교사 홍지희</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF1F8;--paper:#fff;--ink:#1F2A44;--soft:#4F5B75;--line:#CAD6E4;--acc:#D9731A;
 --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#162034;--paper:#22304C;--ink:#F2F5FB;--soft:#B7C3DB;--line:#3A4C74}}
:root[data-theme="dark"]{--bg:#162034;--paper:#22304C;--ink:#F2F5FB;--soft:#B7C3DB;--line:#3A4C74}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:clamp(20px,2.2vw,26px);line-height:1.5}
main{max-width:1100px;margin:0 auto;padding:clamp(16px,3vw,40px)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,5vw,58px);margin:0;word-break:keep-all}
.sub{color:var(--soft);margin:6px 0 24px;word-break:keep-all}
.crumb{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.back{display:inline-block;font-family:var(--display);font-size:20px;color:var(--ink);text-decoration:none;background:var(--paper);border:3px solid var(--line);border-radius:999px;padding:4px 18px}
.back:hover,.back:focus-visible{border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.grid.g3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{display:flex;flex-direction:column;gap:6px;background:var(--paper);border:4px solid var(--line);border-radius:20px;padding:16px 20px;text-decoration:none;color:inherit}
a.card:hover,a.card:focus-visible{border-color:var(--acc)}
.tag{font-family:var(--display);font-size:18px;color:#fff;background:var(--acc);border-radius:999px;padding:2px 14px;align-self:flex-start}
.nm{font-family:var(--display);font-size:clamp(22px,2.4vw,30px);word-break:keep-all}
.room{min-height:190px;justify-content:center;align-items:flex-start;border-top-width:12px;border-top-color:var(--acc)}
.room .ico{font-size:60px;line-height:1}
.room .nm{font-size:clamp(30px,3.4vw,42px)}
.room small{color:var(--soft);font-size:clamp(18px,1.8vw,22px);word-break:keep-all}
.wait{opacity:.6}
.empty{background:var(--paper);border:4px dashed var(--line);border-radius:20px;padding:40px 24px;text-align:center;color:var(--soft);word-break:keep-all}
.empty .ico{font-size:64px;display:block}
footer{color:var(--soft);font-size:18px;margin-top:28px;word-break:keep-all}
</style><style id="hjfoot-css">.hjfoot{display:block;width:100%;flex-basis:100%;margin:40px 0 0;padding:16px 0 4px;border:0;border-top:3px solid var(--line,#CAD6E4);text-align:center;color:var(--soft,#4F5B75);font-family:var(--body,inherit);font-size:17px;line-height:1.7;word-break:keep-all;opacity:1}.hjfoot p{margin:2px 0;padding:0;border:0;background:none;font-size:inherit;color:inherit;text-align:center}</style></head><body><main>
<nav class="crumb"><a class="back" href="../../index.html">🏠 초등교사 홍지희</a><a class="back" href="../index.html">🌈 4학년</a></nav>
<h1>🔢 4학년 수학방</h1>
<p class="sub">1학기와 2학기 중 골라 보세요.</p>
<div class="grid">
<a class="card room wait" href="sem1.html"><span class="ico">🌸</span><span class="nm">1학기</span><small>곧 열려요</small></a>
<a class="card room wait" href="sem2.html"><span class="ico">🍂</span><span class="nm">2학기</span><small>곧 열려요</small></a>
</div>
<footer class="hjfoot"><p>2022 개정 교육과정, 지도서, 교과서를 바탕으로 만든 학습 자료입니다.</p><p>만든 사람: 초등교사 홍지희</p></footer>
</main></body></html>
