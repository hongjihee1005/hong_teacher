<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수리수리 수학 나라 규칙과 관계 · 4-1 수학 6. 규칙과 관계(교과서)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --night:#1F2F4A; --night2:#2C4166; --pine:#2F6B57; --pine-soft:#DDEDE5;
  --lantern:#F4C542; --tent:#E47A38; --ring:#2B7BD6; --ring-soft:#DCEAFB;
  --paper:#F5F7F4; --ink:#1D2A2A; --muted:#5B6B6B; --line:#C9D4CF;
  --ok:#2E8B57; --no:#C8472E; --white:#FFFFFF;
  --fs:clamp(16px, 0.75vw + 10px, 28px);
  --fs-s:calc(var(--fs) * .82); --fs-l:calc(var(--fs) * 1.3); --fs-xl:calc(var(--fs) * 1.8);
  --r:clamp(10px,1vw,18px); --pad:clamp(12px,1.4vw,28px);
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:var(--fs);line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,.jua{font-family:"Jua","Gowun Dodum","Malgun Gothic",sans-serif;font-weight:400;letter-spacing:.01em}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:4px solid var(--lantern);outline-offset:2px}
svg{touch-action:none;user-select:none;-webkit-user-select:none}
.hidden{display:none!important}

/* 상단 */
.top{background:var(--night);color:#fff;display:flex;align-items:center;gap:var(--pad);padding:calc(var(--pad)*.6) var(--pad);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:.5em;font-family:"Jua",sans-serif;font-size:var(--fs-l);white-space:nowrap}
.brand svg{width:1.6em;height:1.6em}
.who{margin-left:auto;display:flex;align-items:center;gap:.5em;font-size:var(--fs-s)}
.chip{white-space:nowrap;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:.25em .9em}
.chip.btn:hover{background:rgba(255,255,255,.22)}

/* 시작 화면 */
.gate{min-height:calc(100% - 4em);display:grid;place-items:center;padding:var(--pad);background:
 radial-gradient(circle at 80% 18%, rgba(244,197,66,.25) 0 6%, transparent 6.5%),
 linear-gradient(180deg,var(--night) 0,var(--night2) 55%,var(--pine) 55.2%,var(--pine) 100%)}
.gate-card{background:#fff;border-radius:calc(var(--r)*1.6);padding:calc(var(--pad)*1.4);width:min(920px,100%);box-shadow:0 18px 40px rgba(0,0,0,.25)}
.gate-card h1{font-size:var(--fs-xl);margin:0 0 .2em;color:var(--night)}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(3.1em,1fr));gap:.45em;margin:.6em 0 1em}
.nums button{padding:.5em 0;border-radius:.6em;border:2px solid var(--line);background:#fff;font-family:"Jua";font-size:var(--fs)}
.nums button.on{background:var(--ring);color:#fff;border-color:var(--ring)}
.row{display:flex;gap:.6em;align-items:center;flex-wrap:wrap}
input[type=text],input[type=password],input[type=number],textarea{font:inherit;padding:.45em .7em;border:2px solid var(--line);border-radius:.6em;background:#fff;color:var(--ink);max-width:100%}
textarea{width:100%;min-height:3.2em;resize:vertical}
.big{font-family:"Jua";font-size:var(--fs-l);padding:.45em 1.4em;border-radius:999px;border:0;background:var(--tent);color:#fff;box-shadow:0 4px 0 #B85A22}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #B85A22}
.big[disabled]{background:#B9C2BF;box-shadow:none;cursor:not-allowed}
.ghost{background:#fff;border:2px solid var(--line);color:var(--ink);border-radius:999px;padding:.35em 1em}

/* 차시 지도 */
.map{padding:var(--pad);max-width:1600px;margin:0 auto}
.map h2{font-size:var(--fs-xl);margin:.2em 0 .1em;color:var(--night)}
.story{background:#fff;border-left:8px solid var(--tent);border-radius:.6em;padding:var(--pad);margin-top:var(--pad)}
.story p{margin:.3em 0}
.scene{font-size:var(--fs-s);color:var(--pine);background:var(--pine-soft);border-radius:.5em;padding:.25em .8em;margin-bottom:.5em;display:inline-block}
.trail{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15em),1fr));gap:var(--pad);margin-top:var(--pad)}
.site{position:relative;text-align:left;background:#fff;border:3px solid var(--line);border-radius:var(--r);padding:var(--pad);display:flex;flex-direction:column;gap:.3em;min-height:9em}
.site:hover{border-color:var(--ring)}
.site .n{font-family:"Jua";font-size:var(--fs-l);color:var(--ring)}
.site .t{font-family:"Jua";font-size:var(--fs);line-height:1.3}
.site .soop{font-size:var(--fs-s);color:var(--muted)}
.site .prog{margin-top:auto;display:flex;gap:.25em}
.site .prog i{flex:1;height:.45em;border-radius:1em;background:var(--line)}
.site .prog i.on{background:var(--ok)}
.site .prog i.half{background:var(--lantern)}
.stair.passed .k{background:var(--lantern);color:var(--ink)}
.site.done{border-color:var(--ok)}
.site .star{position:absolute;right:.6em;top:.4em;font-size:var(--fs-l)}

/* 학습 화면 */
.lesson{display:grid;grid-template-columns:minmax(9em,14em) 1fr;gap:var(--pad);padding:var(--pad);max-width:1800px;margin:0 auto;min-height:calc(100% - 4em)}
.stairs{display:flex;flex-direction:column;gap:.5em;position:sticky;top:5em;align-self:start}
.stairs .title{font-family:"Jua";font-size:var(--fs-l);line-height:1.25;color:var(--night)}
.stairs .soopb{display:inline-block;background:var(--pine-soft);color:var(--pine);border-radius:.5em;padding:.1em .6em;font-size:var(--fs-s);margin:.2em 0 .4em}
.stair{display:flex;align-items:center;gap:.5em;text-align:left;border:2px solid var(--line);background:#fff;border-radius:.8em;padding:.45em .7em;color:var(--ink)}
.stair .k{flex:0 0 1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;background:var(--line);color:#fff;font-family:"Jua"}
.stair.cur{border-color:var(--ring);box-shadow:0 0 0 3px var(--ring-soft)}
.stair.cur .k{background:var(--ring)}
.stair.ok .k{background:var(--ok)}
.stair.lock{opacity:.45;cursor:not-allowed}
.stair.chal .k{background:var(--tent)}
.stairs .back{margin-top:.6em}
.work{background:#fff;border-radius:calc(var(--r)*1.3);padding:calc(var(--pad)*1.2);border:2px solid var(--line);min-width:0}
.q{background:var(--ring-soft);border-radius:var(--r);padding:.5em .9em;margin-bottom:.8em;font-family:"Jua";color:var(--night)}
.stepname{font-family:"Jua";font-size:var(--fs-xl);color:var(--night);margin:0}
.inst{margin:.2em 0 .8em;font-size:var(--fs)}
.panel{display:grid;grid-template-columns:minmax(0,1fr) minmax(12em,19em);gap:var(--pad);align-items:start}
.stage{min-width:0}
.stage svg{width:100%;height:auto;max-height:calc(100vh - 13em);display:block;background:#FBFCFB;border:2px solid var(--line);border-radius:var(--r)}
.side{min-width:0;display:flex;flex-direction:column;gap:.7em}
.readout{font-family:"Jua";font-size:var(--fs-l);color:var(--night)}
.readout small{font-family:"Gowun Dodum";font-size:var(--fs-s);color:var(--muted)}
.card{border:3px solid var(--night);border-radius:var(--r);padding:.8em 1em;background:#fff}
.card b{color:var(--ring)}
.opts{display:flex;flex-wrap:wrap;gap:.5em;margin:.4em 0}
.opt{border:2px solid var(--line);background:#fff;border-radius:.7em;padding:.4em .9em;text-align:left}
.opt.on{border-color:var(--ring);background:var(--ring-soft)}
.opt.good{border-color:var(--ok);background:#E3F4EA}
.opt.bad{border-color:var(--no);background:#FBE7E2}
.opt.good::after{content:" ○";color:var(--ok);font-weight:bold}
.opt.bad::after{content:" ×";color:var(--no);font-weight:bold}
.hintbox{margin-top:.8em;background:#FFF8E1;border-left:8px solid var(--lantern);border-radius:.5em;padding:.5em .9em}
.hintbox p{margin:.3em 0}
.wordbank{margin:.5em 0}
.wordbank .word{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:999px;padding:.1em .8em;margin:.2em .3em .2em 0}
.copybox{margin-top:.6em;background:#fff;border:3px dashed var(--tent);border-radius:.6em;padding:.6em .9em}
.copyrow{display:flex;gap:.6em;align-items:center;flex-wrap:wrap;margin:.35em 0}
.copyrow .target{font-family:"Jua",sans-serif;background:#FDF1E8;border-radius:.4em;padding:.15em .6em;min-width:9em}
.copyrow input{flex:1 1 10em;min-width:8em}
.help{border-color:var(--lantern)}
.stephead{display:flex;align-items:center;gap:.8em;flex-wrap:wrap}
.speak{font-size:var(--fs-s);padding:.2em .8em}
.sent{line-height:2.4}
.slot{display:inline-flex;gap:.3em;vertical-align:middle;flex-wrap:wrap;background:#F2F5F4;border-radius:.6em;padding:.15em .3em}
.slot .opt{padding:.1em .6em}
.qitem{border-bottom:1px dashed var(--line);padding:.6em 0}
.qitem:last-child{border-bottom:0}
.fb{min-height:1.6em;font-family:"Jua";margin-top:.4em}
.fb.good{color:var(--ok)} .fb.bad{color:var(--no)}
.actions{display:flex;gap:.6em;align-items:center;margin-top:.8em;flex-wrap:wrap;
  position:sticky;bottom:0;background:#fff;padding:.5em 0 .2em;z-index:3;border-top:1px solid transparent}
.actions.stuck{border-top-color:var(--line)}
.tools{display:flex;flex-wrap:wrap;gap:.4em;align-items:center}
.tools button{border:2px solid var(--line);background:#fff;border-radius:.6em;padding:.25em .8em}
.tools button.on{background:var(--night);color:#fff;border-color:var(--night)}
input[type=range]{width:100%;accent-color:var(--ring);height:2em}
.pill{display:inline-block;background:var(--night);color:#fff;border-radius:999px;padding:.05em .7em;font-size:var(--fs-s)}
.safe{border-left:6px solid var(--tent);background:#FDF1E8;padding:.5em .8em;border-radius:.4em;font-size:var(--fs-s)}
.seq{display:flex;gap:.5em;flex-wrap:wrap}
.seq .opt{flex:1 1 12em}
.seq .opt .no{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--ring);color:#fff;margin-right:.4em;font-family:"Jua"}

/* 완료 */
.finish{text-align:center;padding:1em}
.finish .medal{font-size:calc(var(--fs)*4)}

/* 교사 화면 */
.teacher{padding:var(--pad);max-width:1800px;margin:0 auto}
.tbl-wrap{overflow-x:auto;border:2px solid var(--line);border-radius:var(--r);background:#fff}
table.dash{border-collapse:collapse;width:100%;font-size:var(--fs-s)}
table.dash th,table.dash td{border:1px solid var(--line);padding:.35em .5em;text-align:center;white-space:nowrap}
table.dash th{background:var(--night);color:#fff;font-weight:400;font-family:"Jua"}
table.dash td.nm{text-align:left}
td.c-full{background:#DFF2E6} td.c-part{background:#FFF4D1} td.c-none{color:#aaa}
.detail{margin-top:var(--pad)}
.detail li{margin:.2em 0}
.toast{position:fixed;left:50%;bottom:1.2em;transform:translateX(-50%);background:var(--night);color:#fff;padding:.5em 1.2em;border-radius:999px;font-size:var(--fs-s);z-index:20}

@media (max-height: 820px){
  :root{--fs:clamp(15px,.62vw + 9px,22px);--pad:clamp(8px,1vw,16px)}
  .stage svg{max-height:calc(100vh - 17em)}
  .work{padding:.8em 1em}
  .q{margin-bottom:.4em;padding:.35em .8em}
  .inst{margin:.15em 0 .5em}
  .qitem{padding:.35em 0}
  .stepname{font-size:calc(var(--fs) * 1.45)}
  .stairs{gap:.3em}
  .stair{padding:.3em .6em}
  .copylink{display:none}
}
@media (max-width: 1000px){ .panel{grid-template-columns:1fr} .stage svg{max-height:none} }
@media (max-width: 820px){
  .lesson{grid-template-columns:1fr}
  .stairs{position:static;flex-direction:row;flex-wrap:wrap}
  .stairs .title,.stairs .soopb,.stairs .back{flex-basis:100%}
  .stair{flex:1 1 auto}
  .stair .lbl{display:none}
  .brand span.long{display:none}
  .who{gap:.3em} .chip{padding:.2em .6em}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.creditbar{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 16px 24px}
.tolist{display:none;align-items:center;gap:8px;font-family:"Jua",sans-serif;font-size:clamp(18px,1.8vw,24px);text-decoration:none;color:var(--ink);border:3px solid var(--line);background:#fff;border-radius:999px;padding:6px 20px}
.tolist.on{display:inline-flex}
.hjfoot{display:block;width:100%;margin:6px 0 0;padding:14px 0 4px;border-top:3px solid var(--line);text-align:center;color:var(--muted);font-size:clamp(14px,1.2vw,17px);line-height:1.7;word-break:keep-all}
.hjfoot p{margin:2px 0}
</style>

 src:local('Pretendard Bold'),local('Pretendard-Bold'),url(https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2-subset/Pretendard-Bold.subset.woff2) format('woff2'),local('Malgun Gothic Bold'),local('MalgunGothicBold'),local('AppleSDGothicNeo-Bold'),local('Noto Sans CJK KR Bold'),local('NotoSansCJKkr-Bold'),local('Noto Sans KR Bold'),local('NotoSansKR-Bold'),local('NanumGothicBold')}

@media (prefers-color-scheme:light){html:root:not([data-theme="dark"]){--bg:#F6F5F1;--paper:#FFFFFF;--ink:#141A26;--soft:#4B5465;--muted:#4B5465;--line:#E3E0D8;--warmline:#E3E0D8}}
html:root[data-theme="light"]{--bg:#F6F5F1;--paper:#FFFFFF;--ink:#141A26;--soft:#4B5465;--muted:#4B5465;--line:#E3E0D8;--warmline:#E3E0D8}
@media (prefers-color-scheme:dark){html:root:not([data-theme="light"]){--bg:#0E131B;--paper:#151C27;--ink:#E8ECF3;--soft:#A7B1C2;--muted:#A7B1C2;--line:#253042}}
html:root[data-theme="dark"]{--bg:#0E131B;--paper:#151C27;--ink:#E8ECF3;--soft:#A7B1C2;--muted:#A7B1C2;--line:#253042}
html body{-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
html h1,html h2,html h3{letter-spacing:-.025em}
html:root{--night:#1E2D4A;--night2:#4B5465;--pine:#5C9A7C;--pine-soft:#E6F3EC}
/* ── 수업 세트 공통 틀(첫 화면·진행 화면) 다듬기: 얇은 선, 부드러운 그림자, 정돈된 글자 크기 ── */
html body .title{font-size:clamp(34px,min(4.8vw,8.5vh),66px);font-weight:800;letter-spacing:-.035em;line-height:1.2}
html body .lead{font-size:clamp(17px,1.6vw,22px);font-weight:600;color:var(--soft);letter-spacing:-.01em}
html body .qbox{background:var(--hjs-soft,color-mix(in srgb,#2B4A7C 8%,var(--paper)));border:0;border-left:8px solid transparent;border-radius:20px;font-size:clamp(20px,2.1vw,30px)!important;font-weight:700;line-height:1.55;
 box-shadow:0 1px 2px rgba(80,55,30,.05),0 16px 32px -22px rgba(80,55,30,.4)}
html body .stagebar{gap:8px}
html body .st{border-width:1.5px;font-size:clamp(15px,1.35vw,19px);font-weight:600;padding:6px 14px;background:var(--paper)}
html body .st.now{font-weight:700}
html body .seg{border:1.5px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(80,55,30,.05)}
html body .seg button{font-size:clamp(17px,1.55vw,22px);font-weight:600;padding:9px 16px}
html body .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
html body .row-label{font-size:clamp(17px,1.6vw,22px);font-weight:700;color:var(--soft)}
html body .big-btn{font-size:clamp(22px,2.3vw,32px);font-weight:800;letter-spacing:-.01em;padding:14px 48px;
 box-shadow:0 2px 4px rgba(40,25,10,.12),0 14px 26px -12px rgba(40,25,10,.5)}
html body .big-btn:active{transform:translateY(2px);box-shadow:0 1px 2px rgba(40,25,10,.2)}
html body .mid-btn{font-size:clamp(18px,1.7vw,24px);font-weight:700;padding:11px 28px;box-shadow:0 2px 4px rgba(40,25,10,.12),0 10px 20px -12px rgba(40,25,10,.45)}
html body .mid-btn:active{transform:translateY(2px);box-shadow:none}
html body .ghost-btn{border:1.5px solid var(--line);background:var(--paper);font-size:clamp(17px,1.6vw,22px);font-weight:700;padding:10px 24px}
html body .tnote{border-width:1.5px;border-radius:999px;font-size:clamp(16px,1.5vw,20px);font-weight:700;padding:9px 18px}
html body .tool{border-width:1.5px;border-radius:12px;font-size:19px;padding:7px 12px}
html body .chip{border-width:1.5px;font-weight:600}
html body .tolist{border-width:1.5px;font-size:clamp(16px,1.5vw,19px);font-weight:700;padding:9px 18px}
html body .goal{font-size:clamp(16px,1.5vw,21px);font-weight:600}
html body .hd{font-weight:800;letter-spacing:-.03em;font-size:clamp(26px,2.8vw,42px);line-height:1.35}
html body .overlay{background:rgba(42,34,28,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
html body .panel{border:0;border-radius:24px;box-shadow:0 30px 60px -24px rgba(40,25,10,.5)}
html body .panel h2{font-size:clamp(30px,3.6vw,50px);font-weight:800;letter-spacing:-.03em}
html body .panel .why{font-size:clamp(20px,2.1vw,30px)}
html body :is(.card1,.book,.rec,.pw,.opt2,.oi,.mw,.mm,.wf,.ln,.lkrow,.bglog span){border-width:2px}
html body :is(.card1,.book,.rec,.sumbox,.talk .q,.fl,.promise div){box-shadow:0 1px 2px rgba(80,55,30,.05),0 12px 26px -20px rgba(80,55,30,.35)}
html body .wf :is(textarea,input){border-width:1.5px}
html body .ex{border-width:1.5px}
html body .card1 .x,html body .mw,html body .book .pg,html body .sumbox b{font-weight:700}
html body .hjfoot{border-top-width:1.5px}
html body:has(.screen.on:not(#cover)) #hj-home{display:none}
/* 선생님 버전(S.O.O.P.) 틀 */
html body .bq{border-width:2px;border-radius:20px;box-shadow:0 1px 2px rgba(80,55,30,.05),0 14px 28px -22px rgba(80,55,30,.4)}
html body .goalbox{border-width:0;border-left:8px solid transparent;background:var(--hjs-soft,color-mix(in srgb,#2B4A7C 8%,var(--paper)));border-radius:16px;font-weight:700}
html body .ghost{border-width:1.5px;font-weight:700}
html body .plan>*,html body .steps>*{border-width:1.5px}
html body .badge{font-weight:800}
html body .ask{font-weight:600}
/* 선 아이콘 */
html body .hj-i{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-.2em}
html body .hj-ic{display:inline-flex;align-items:center;justify-content:center;gap:.4em}
html body .hj-ionly{gap:0}
html body .tool.hj-hometool{border-radius:999px;padding:6px 15px 6px 12px;font-weight:700;font-size:17px;gap:6px}
/* 수업 세트 첫 화면 정리 */
html body .hj-cv{gap:clamp(12px,2vh,22px)!important}
html body .hj-cvtop{width:min(1100px,94vw);display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;min-height:0}
html body .hj-cvtop .tolist{margin:0}
html body .hj-cvpanel{width:min(1100px,94vw);background:var(--paper);border:1.5px solid var(--line);border-radius:24px;padding:clamp(16px,2vw,26px) clamp(18px,2.4vw,30px);
 display:grid;gap:clamp(12px,1.6vh,18px);box-shadow:0 1px 2px rgba(80,55,30,.05),0 18px 40px -28px rgba(80,55,30,.45);text-align:left}
html body .hj-cvpanel>.qbox,html body .hj-cvpanel>.goalbox,html body .hj-cvpanel>.bq,html body .hj-cvpanel>.map{width:auto!important;margin:0!important;box-shadow:none}
html body .hj-cvpanel>.qbox{text-align:left}
html body .hj-field{display:grid!important;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:8px 14px;justify-content:stretch!important;margin:0;
 padding-top:clamp(10px,1.4vh,16px);border-top:1.5px dashed var(--line)}
html body .hj-field>.stagebar,html body .hj-field>.plan{justify-content:flex-start!important;margin:0}
html body .hj-flabel{font-size:clamp(15px,1.35vw,18px)!important;font-weight:800;color:var(--soft);white-space:nowrap}
html body .hj-field.row>:nth-child(n+3){grid-column:2;font-size:clamp(14px,1.25vw,17px);color:var(--soft)}
html body .hj-field .seg{justify-self:start}
html body .hj-cvacts{gap:14px}
@media (max-width:720px){html body .hj-field{grid-template-columns:1fr}html body .hj-field.row>:nth-child(n+3){grid-column:1}}
html body .hj-field>*:not(.hj-flabel){justify-self:start;text-align:left;margin-left:0}
html body .hj-field>div>.seg{margin:0}
html body .hj-cvtop,html body .hj-cvpanel,html body .hj-cvacts{flex:none}
html body #cover{justify-content:safe center}
html body .hj-field #segTeam{justify-content:flex-start!important;align-items:flex-start!important;flex-direction:column;gap:6px!important}
html body .hj-field #segTeam-sub .row-label,html body .hj-field #segTeam~*{font-size:clamp(14px,1.25vw,17px)!important;font-weight:500;color:var(--soft)}
html body .hj-field .seg{justify-content:flex-start;width:auto}

html .hj-em{font-family:'HJ Emoji','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-weight:400;font-style:normal;font-synthesis:none;letter-spacing:0;-webkit-text-stroke:0;text-shadow:none}
/* 교사 안내 창 도구(인쇄·구글 문서·이메일) */
html body .hj-tbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px 0 4px;padding-top:18px;border-top:1px solid var(--line)}
html body .hj-tbar>button,html body .hj-mail button{display:inline-flex;align-items:center;gap:7px;font:700 16px/1.2 'Gowun Dodum',sans-serif;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;cursor:pointer}
html body .hj-tbar>button:hover,html body .hj-mail button:hover{background:var(--bg);border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
html body .hj-tbar .hj-i{width:18px;height:18px;flex:none}
html body .hj-mail{flex-basis:100%;display:grid;gap:8px;max-width:560px;margin:6px auto 0;text-align:left;background:var(--bg);border-radius:16px;padding:14px 16px}
html body .hj-mail[hidden]{display:none}
html body .hj-mail label{font-weight:700;font-size:16px}html body .hj-mail label small{font-weight:500;color:var(--soft);font-size:14px;margin-left:6px}
html body .hj-mail input{font:500 17px/1.4 'Gowun Dodum',sans-serif;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
html body .hj-mail div{display:flex;flex-wrap:wrap;gap:8px}html body .hj-mail p{margin:0;font-size:14px!important;color:var(--soft)}
html body .hj-toast{flex-basis:100%;margin:2px 0 0;min-height:1.3em;text-align:center;font-size:15px!important;color:var(--soft)}
@media print{
 body.hj-tprint>*:not(#tn){display:none!important}
 body.hj-tprint #tn{position:static!important;display:block!important;background:none!important;padding:0!important;inset:auto!important}
 body.hj-tprint #tn .panel{width:auto!important;max-height:none!important;overflow:visible!important;box-shadow:none!important;border:0!important;border-radius:0!important;padding:0!important;transform:none!important;animation:none!important}
 body.hj-tprint .hj-tbar,body.hj-tprint #tnClose{display:none!important}
 body.hj-tprint{background:#fff!important;color:#000}
 body.hj-tprint #tn .panel{padding:16mm!important}
}
/* 수업을 마쳤을 때 고르는 창 */
#hj-done{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:rgba(42,34,28,.38);backdrop-filter:blur(3px);animation:hjfade .2s ease}
@keyframes hjfade{from{opacity:0}to{opacity:1}}
#hj-done .hj-dp{width:min(560px,100%);background:var(--paper,#fff);color:var(--ink,#2A221C);border-radius:24px;padding:30px 28px 24px;text-align:center;box-shadow:0 30px 60px -24px rgba(40,25,10,.5);font-family:'Gowun Dodum',sans-serif;word-break:keep-all}
#hj-done .hj-dok{display:inline-grid;place-items:center;width:60px;height:60px;border-radius:18px;background:color-mix(in srgb,#7FB89A 22%,var(--paper,#fff));color:#3F7A5C}
#hj-done .hj-dok svg{width:32px;height:32px}
#hj-done h2{font-family:'Jua',sans-serif;font-size:clamp(26px,3vw,32px);margin:12px 0 4px;letter-spacing:-.03em}
#hj-done .hj-dl{margin:0 0 20px;color:var(--soft,#5C5047);font-size:17px}
#hj-done .hj-dn{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;text-align:left;text-decoration:none;color:#fff;background:var(--ink,#2A221C);border-radius:18px;padding:16px 20px}
#hj-done .hj-dn small{grid-column:1;font-size:14px;opacity:.75;font-weight:600}
#hj-done .hj-dn b{grid-column:1;font-size:clamp(18px,2vw,21px);line-height:1.4}
#hj-done .hj-dn svg{grid-column:2;grid-row:1/3;width:26px;height:26px}
#hj-done .hj-dn:hover{filter:brightness(1.15)}
#hj-done .hj-dlast{margin:0;padding:14px;border-radius:16px;background:var(--bg,#FFFCF8);color:var(--soft,#5C5047);font-size:17px}

html.hj-sc-on #hj-scover{display:block;position:fixed;left:0;right:0;bottom:0;top:var(--hj-navh,72px);z-index:40;overflow:auto;background:var(--bg);padding:clamp(16px,3vh,36px) 16px 40px}
html.hj-sc-on #ovBar{display:none!important}
#hj-scover .hj-sc-in{width:min(1100px,100%);margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,1.8vh,20px)}
#hj-scover .hj-sc-info{margin:0;font-size:clamp(15px,1.35vw,19px);font-weight:700;color:var(--soft);text-align:center}
#hj-scover .hj-sc-title{margin:0;font-size:clamp(32px,min(4.6vw,8vh),60px);font-weight:800;letter-spacing:-.035em;line-height:1.2;text-align:center;text-wrap:balance}
#hj-scover .hj-cvpanel{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,2.2vw,28px);display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(80,55,30,.04),0 14px 30px -22px rgba(80,55,30,.3)}
#hj-scover .hj-sc-goal{margin:0;text-align:left;background:var(--hjs-soft,color-mix(in srgb,#2B4A7C 8%,var(--paper)));border:0;border-left:5px solid transparent;border-radius:16px;padding:16px 22px;font-size:clamp(21px,2.1vw,30px);font-weight:700;line-height:1.4;box-shadow:none}
#hj-scover .hj-sc-goal .hj-qlab{display:block;font-size:clamp(15px,1.35vw,19px);font-weight:700;color:var(--soft);margin-bottom:4px}
#hj-scover .hj-field{border-top:1px dashed var(--line);padding-top:14px}
#hj-scover .big-btn{font:800 clamp(22px,2vw,28px)/1.2 'Gowun Dodum',sans-serif;color:var(--paper)!important;background:var(--ink)!important;border:0!important;border-radius:999px!important;padding:14px 40px;cursor:pointer;box-shadow:0 10px 24px -12px rgba(40,25,10,.55)}
/* 과학 앱 아래 막대: 작고 가볍게 */
html:has(#ovBar) #ovBar{padding:5px 8px!important;gap:6px!important}
html:has(#ovBar) #ovBar button{font-size:clamp(14px,1.1vw,16px)!important;padding:6px 13px!important;min-height:36px!important}
html:has(#ovBar) #ovBar .pos{font-size:clamp(14px,1.1vw,16px)!important}
html:has(#ovBar) #ovBar .hj-i{width:16px;height:16px}
/* 과학 앱 한 화면 보기: 기본 글자 조금 작게 */
html.hj-hasnav:has(#ovBar) body.ov main{font-size:.94em}
/* 사회·국어 진행 화면: 넓은 화면에서 글자와 카드를 더 크게 */
html body #stage #body{width:min(1560px,96vw);max-width:none}
html body #stage .hd{font-size:clamp(28px,min(3.1vw,6.2vh),54px)!important;line-height:1.3}
html body #stage .recall{width:100%;gap:clamp(12px,1.4vw,24px)}
html body #stage .rc{min-height:clamp(180px,30vh,340px)}
html body #stage .rc .front{font-size:clamp(24px,min(2.5vw,5vh),42px)!important}
html body #stage .rc .back2{font-size:clamp(20px,min(2.05vw,4.2vh),34px)!important}
html body #stage #body>.qbox{width:min(1400px,100%);font-size:clamp(22px,min(2.2vw,4.6vh),38px)!important}
html body #stage .goal{font-size:clamp(15px,1.25vw,20px)}
html body #stage #body{margin-left:auto!important;margin-right:auto!important}
html body #stage .recall{justify-content:center;margin-left:auto;margin-right:auto}
/* 과학 앱 위 탭 줄 더 얇게, 안쪽 '이전/다음 단계'는 아래 막대로 합침 */
html:has(#ovBar) body>nav{border-bottom-width:1px!important}
html:has(#ovBar) body>nav .wrap{padding-top:6px!important;padding-bottom:6px!important;gap:5px!important;min-height:0!important}
html:has(#ovBar) body>nav a{font-size:clamp(13px,.95vw,15px)!important;padding:4px 11px!important;min-height:0!important;line-height:1.35!important}
html:has(#ovBar) body>nav .hj-nav a{min-height:32px;padding:4px 11px 4px 9px}
html.hj-merge-steps section .hj-innernav{display:none!important}
/* 과학 앱 실험 화면 배치 다듬기 */
html:has(#ovBar) body .card{justify-content:center!important;text-align:center}
html:has(#ovBar) body .vs{align-items:stretch}
html:has(#ovBar) body .vs>b{align-self:center}
html:has(#ovBar) body .lab>svg{display:block;width:min(100%,980px)!important;max-height:44vh;margin-left:auto;margin-right:auto}
html:has(#ovBar) body .lab>.row{justify-content:center}
html:has(#ovBar) body .gallery{gap:10px!important}
html:has(#ovBar) body .gallery .photo{display:grid;grid-template-columns:minmax(120px,32%) 1fr;align-items:center;margin:8px 0 0}
html:has(#ovBar) body .gallery .photo img{width:100%;height:100%;max-height:150px;object-fit:cover;aspect-ratio:auto!important}
html:has(#ovBar) body .gallery .photo figcaption{padding:8px 12px!important;font-size:clamp(14px,1.1vw,17px)!important;text-align:left}
html:has(#ovBar) body .photo{border-width:1px!important;border-color:var(--line)!important}
html:has(#ovBar) body .hj-gonext{margin-left:8px}
html:has(#ovBar) body button.hj-retry{background:var(--paper)!important;color:var(--ink)!important}
html:has(#ovBar) body span.hj-rrow{display:inline-flex;gap:8px;margin:0 0 0 auto}
html:has(#ovBar) body span.hj-rrow .hj-gonext{margin-left:0}
/* 이동 단추 묶음은 위치 표시일 뿐: 앱의 nav 꾸밈(밑줄·고정)을 받지 않게 */
html body nav.hj-nav{border:0!important;position:static!important;background:none!important;box-shadow:none!important;padding:0!important;top:auto!important}
/* ===== 화면 배치(모든 교과) ===== */
/* 과학 한 화면 보기: 좌우 여백, 제목·질문은 가운데, 설명은 왼쪽 */
html body.ov main.wrap{max-width:min(1280px,100%)!important;margin-left:auto!important;margin-right:auto!important}
html body.ov section .fitbox>.stage{display:table;margin-left:auto;margin-right:auto}
html body.ov section .fitbox>:is(h2,h3){text-align:center;text-wrap:balance}
html body.ov section .fitbox>p:not(.fb){text-align:center;text-wrap:balance}
html body.ov section :is(.row,.order,.two,.vs,.gauge){justify-content:center}
html body.ov section .fb{text-align:left}
html body.ov section .pick{max-width:1100px;margin-left:auto;margin-right:auto}
/* 사진: 사진 왼쪽 크게, 설명 오른쪽 */
html body.ov .photo{display:grid!important;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:center;max-width:1100px;margin-left:auto!important;margin-right:auto!important}
html body.ov .photo img{width:100%!important;height:auto!important;max-height:min(340px,38vh)!important;aspect-ratio:auto!important;object-fit:cover}
html body.ov .photo figcaption{padding:12px 18px!important;font-size:clamp(16px,1.3vw,20px)!important;line-height:1.55;text-align:left}
html body.ov .photo .cr{font-size:clamp(12px,.9vw,14px)!important;margin-top:6px}
html body.ov .gallery{grid-template-columns:1fr!important;max-width:1100px;margin-left:auto;margin-right:auto}
html body.ov .gallery .photo img{max-height:min(220px,26vh)!important}
html:has(#ovBar) body .gallery .photo{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
/* 국어·사회 진행 화면: 너무 넓게 퍼지지 않게 */
html body #stage #body{width:min(1240px,94vw)!important}
/* 홍지희 선생님 버전 진행 화면 */
html body #lesson .body{width:min(1360px,94vw);max-width:none;margin-left:auto;margin-right:auto}
/* 수학 앱: 가운데 정렬된 넓이 */
html body main.lesson{max-width:min(1480px,100%)!important}
html body.ov section :is(#quiz,#perf,.qz)>div>p.jua,html body.ov section p.jua{text-align:center;text-wrap:balance}
html body.ov section .pick:has(>:nth-child(3):last-child){grid-template-columns:repeat(3,minmax(0,1fr))!important}
html body.ov .photo img{max-height:min(260px,28vh)!important}
html body.ov .gallery .photo img{max-height:min(190px,22vh)!important}
html body.ov main.wrap{max-width:min(1120px,100%)!important}
/* 모든 교과 같은 본문 폭: 눈이 좌우로 너무 오가지 않게 1240px 안팎 */
html body.ov main.wrap{max-width:min(1240px,100%)!important}
html body #lesson .body{width:min(1240px,94vw)!important}
html body .hj-navbar{position:relative;z-index:60}
html body .topbar>.hj-nav{margin-right:10px}
/* 본문 폭 최종: 수학 앱의 활동 칸과 비슷한 1080~1120px. 눈이 좌우로 덜 움직이게 */
html body.ov main.wrap{max-width:min(1080px,100%)!important}
html body #stage #body{width:min(1120px,94vw)!important}
html body #lesson .body{width:min(1120px,94vw)!important}
/* 국어: 자체 확대(최대 약 1.3배)가 있으므로 바탕 폭을 좁혀, 확대 뒤에도 1150px 안팎 */
html body #stage #bodyWrap>#body{width:min(1000px,94vw)!important}
html body.ov .hj-pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:1080px;margin:10px auto 0}
html body.ov .hj-pgrid .photo{display:block!important;margin:0!important}
html body.ov .hj-pgrid .photo img{width:100%!important;max-height:min(230px,26vh)!important;object-fit:cover}
html body.ov .hj-pgrid .photo figcaption{font-size:clamp(14px,1.1vw,17px)!important}
html body.ov .photo img{max-height:min(210px,22vh)!important}
html body.ov .photo{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
/* 너무 작은 글자 막기: 출처·쪽수 같은 작은 글도 13.5px 이상 */
html body :is(#lesson,#stage,#cover) small:not(.hj-contact *){font-size:max(13.5px,.8em)!important}
html body .tool .n{font-size:13px!important;min-width:20px;height:20px;line-height:20px}
/* 진행 화면 위 줄: 단계가 많아도 도구 단추와 겹치지 않게(단계 줄만 옆으로 밀기) */
html body .screen:not(#cover) .topbar{flex-wrap:nowrap}
html body .screen:not(#cover) .topbar>:is(.steps,.stagebar){flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap!important}
html body .screen:not(#cover) .topbar>:is(.steps,.stagebar)::-webkit-scrollbar{display:none}
html body .screen:not(#cover) .topbar>:is(.steps,.stagebar)>*{flex:none}
html body .screen:not(#cover) .topbar>.tools{flex:none}
/* 진행 화면 안의 넓은 블록이 본문 폭을 넘지 않게(잘림 방지) */
html body #stage #body>*{max-width:100%!important}
html body #stage #body :is(.exp,.expq,.recall,.talk,.exs,.cmp,.grid2,.grid3){width:100%!important;max-width:100%!important}
html body #lesson .cols{grid-template-columns:repeat(var(--n,3),minmax(0,1fr))!important}
html body #lesson .col{min-width:0}
html body #lesson .col :is(input,textarea){min-width:0;width:100%}
html body #lesson .col .row,html body #lesson .col form{display:flex;gap:6px;min-width:0}
html body #lesson .body{max-width:100%}
html body .wg>h2{white-space:nowrap!important;flex-wrap:nowrap!important;text-wrap:nowrap!important}
html body .wg>h2 .ed{flex:none;font-size:.88rem!important;padding:.2rem .65rem!important;min-height:1.9rem}
/* ===== 폰·패드 세로 화면 ===== */
@media (max-width:820px){
 html body .screen:not(#cover) .topbar{flex-wrap:wrap!important;row-gap:6px}
 html body .screen:not(#cover) .topbar>:is(.steps,.stagebar){flex:1 1 100%;order:2}
 html body .screen:not(#cover) .topbar>.tools{flex:1 1 100%;order:1;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px}
 html body .screen.on>.topbar>.hj-nav{order:0}
 html body header.top{flex-wrap:wrap!important;row-gap:6px;height:auto!important}
 html body header.top .brand{min-width:0;flex:1 1 auto;white-space:normal}
 html body header.top .brand .long{display:none!important}
 html body header.top>.hj-nav{flex:1 1 100%}
 html body .tools{flex-wrap:wrap}
 html body :is(h1,h2,h3,.title,.hd,.ask,.qbox,.lead,p,li,b,span,button,a,td,th,label,small){word-break:keep-all;overflow-wrap:break-word}
}
/* 수학 앱 머리줄: 단원 이름이 길면 이름표가 오른쪽 밖으로 밀려나던 것(2026-10-24). 넓은 화면에서도 줄 안에 맞추고 긴 이름은 …으로 줄임 · hj-topfit */
@media (min-width:821px){
 html[data-hjsubj="math"] body header.top{min-width:0}
 html[data-hjsubj="math"] body header.top .brand{min-width:0;flex:1 1 auto;overflow:hidden}
 html[data-hjsubj="math"] body header.top .brand>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 html[data-hjsubj="math"] body header.top .brand>span:not(.long){flex:0 1 auto}
 html[data-hjsubj="math"] body header.top .brand>span.long{flex:1 1 0}
 html[data-hjsubj="math"] body header.top .brand>svg{flex:none}
 html[data-hjsubj="math"] body header.top>.who,html[data-hjsubj="math"] body header.top>.hj-nav{flex:none}
}
@media (max-width:480px){
 html body #cover .title,html body #hj-scover .hj-sc-title{font-size:clamp(24px,7vw,32px)!important}
 html body #stage .hd,html body .screen .hd{font-size:clamp(21px,6vw,28px)!important}
 html body .hj-nav a span{font-size:13.5px}
 html body .hj-cvtools .hj-tool2{padding:6px 10px!important}
}
html body .bv i{font-size:max(13px,1em)}
@media (max-width:480px){html body #stage .rc{min-height:150px!important}html body #stage .rc .front img{max-height:90px;object-fit:cover}}
@media (max-width:600px){
 html body .labgrid,html body .lab2,html body .two{grid-template-columns:1fr!important}
 html body .pick{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))!important}
 html body.ov .photo,html:has(#ovBar) body .gallery .photo{grid-template-columns:1fr!important}
 html body.ov .hj-pgrid,html body .gallery{grid-template-columns:1fr!important}
 html body .vs{grid-template-columns:1fr!important}
 html body .vs>b{justify-self:center}
}
@media (max-width:600px){
 html body.ov .gal,html body .card2-wrap{grid-template-columns:1fr!important}
 html body.ov .card2 .pick,html body.ov section .pick.one{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))!important}
}
html body .hj-field>.hj-multi{grid-auto-flow:row!important}
html body .hj-field>.hj-multi .st,html body .hj-field .hj-multi>button{border-top:1px solid var(--line)!important}
html body .hj-field>.hj-multi .st:nth-child(-n+20){border-left:1px solid var(--line)!important}
@media (max-width:900px){html body.ov .gallery,html body.ov .hj-pgrid{grid-template-columns:1fr!important}}
/* 단계 줄이 넘치면 오른쪽 끝을 흐리게: 옆으로 밀어 더 볼 수 있다는 표시 */
html body .screen:not(#cover) .topbar>:is(.steps,.stagebar).hj-ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
html body .card2 .pick{grid-template-columns:repeat(auto-fill,minmax(124px,1fr))!important}
html body .card2 .pick button{padding:.4em .5em!important}
@media (max-width:600px){html body #lesson .cols{grid-template-columns:1fr!important}html body #lesson .col{min-height:0!important}}
html body .wg>h2 .ed{margin-left:auto!important;white-space:nowrap}
html body .wg>h2{min-width:0;overflow:hidden}
/* ===== 메뉴 단추 크기 통일(모든 교과) ===== */
/* 이동 단추 [홈·자료 목록] */
html body .hj-nav a{min-height:36px!important;font-size:clamp(14.5px,1.05vw,16px)!important}
/* 과학 아래 막대: 국어·사회 아래 단추와 같은 크기 */
html:has(#ovBar) #ovBar button{font-size:clamp(15px,1.15vw,17px)!important;min-height:40px!important;padding:7px 15px!important}
html:has(#ovBar) #ovBar .pos{font-size:clamp(15px,1.15vw,17px)!important}
/* 홍지희 버전은 화면 전체를 키우므로(zoom) 단추만 원래 크기로 */
html body #lesson .topbar .tool{font-size:calc(15.5px / var(--hjz,1))!important;min-height:calc(34px / var(--hjz,1))!important;padding:calc(5px / var(--hjz,1)) calc(10px / var(--hjz,1))!important}
html body #lesson .foot :is(.tnote,.ghost,#prev){font-size:calc(16px / var(--hjz,1))!important;min-height:calc(38px / var(--hjz,1))!important;padding:calc(7px / var(--hjz,1)) calc(14px / var(--hjz,1))!important}
html body #lesson .foot #next{font-size:calc(19px / var(--hjz,1))!important;min-height:calc(42px / var(--hjz,1))!important;padding:calc(8px / var(--hjz,1)) calc(20px / var(--hjz,1))!important}
/* 수학 앱: 확인하기·다음 계단은 알맞은 크기로 */
html body main.lesson .big{font-size:clamp(18px,1.35vw,22px)!important;padding:.5em 1.5em!important;width:auto!important;min-width:0!important;box-shadow:0 3px 0 rgba(0,0,0,.15)!important}
html body main.lesson .side>.big{align-self:flex-end}
html body main.lesson .stair{font-size:clamp(16px,1.2vw,19px)!important;min-height:48px;padding-top:6px!important;padding-bottom:6px!important}
/* 우리 반 교실: '자세히'가 칸 밖으로 나가지 않게 */
html body .wg>h2{font-size:clamp(.98rem,1.05vw,1.15rem)!important;gap:.3rem!important}
html body .wg>h2 .ed{font-size:.82rem!important;padding:.15rem .5rem!important;min-height:1.75rem!important}
/* hidden으로 숨긴 것은 정말 숨기기(돋보기 결과가 처음부터 보이던 문제) */
html body [hidden]{display:none!important}
html body #zoom:not([hidden]),html body .zoom:not([hidden]){animation:hjzoom .45s cubic-bezier(.2,.8,.3,1.2)}
@keyframes hjzoom{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
/* 과학 한 화면 보기: 내용이 길면 칸이 늘어나고, 아래 막대가 내용을 가리지 않게 */
html body.ov main section.cur{height:auto!important;overflow:visible!important}
html body.ov{padding-bottom:calc(var(--hjbar,76px) + 28px)!important}
html body.ov main.wrap{padding-bottom:calc(var(--hjbar,76px) + 12px)!important}
/* 과학: 문제(질문)는 왼쪽 정렬 */
html body.ov section :is(#quiz,#perf,.qz)>div>p.jua,html body.ov section p.jua,html body.ov section #clue,
html body.ov section:has(#quiz,#perf,.qz) .fitbox>h3{text-align:left!important;text-wrap:pretty}
/* 사진 두 장이 한 칸에만 몰리던 것: 줄 전체를 쓰고 사진을 크게 */
html body .two>.hj-pgrid:only-child{grid-column:1/-1}
html body.ov .hj-pgrid .photo img{max-height:min(380px,44vh)!important;aspect-ratio:4/3!important}
@media (max-width:900px){html body.ov .hj-pgrid .photo img{max-height:none!important}}

/* 과학 '한 화면 보기' 앱: 크롬북처럼 낮은 가로 화면에서 여백만 줄여 한 화면에 더 담기 (글자 크기는 그대로, 2026-10-02) */
@media (orientation:landscape) and (max-height:760px){
 html:has(#ovBar) body.ov main{padding-top:0!important}
 html:has(#ovBar) body.ov main>section.cur{margin-top:4px!important;padding-top:8px!important;padding-bottom:8px!important}
 html:has(#ovBar) body.ov section.cur .stage{margin-bottom:2px!important;padding-top:1px!important;padding-bottom:1px!important}
 html:has(#ovBar) body.ov section.cur h2{margin-top:2px!important;margin-bottom:6px!important}
 html:has(#ovBar) body.ov section.cur h3{margin-top:8px!important;margin-bottom:6px!important}
 html:has(#ovBar) body.ov section.cur .fitbox>p{margin-top:4px!important;margin-bottom:8px!important}
 html:has(#ovBar) body.ov section.cur .lab{margin-top:8px!important;margin-bottom:8px!important}

html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body.ov section :is(.lab,.scene,.card2,.links a){border-color:transparent!important;background-clip:padding-box;outline:1px solid var(--line);outline-offset:-3px}
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body.ov section .card2.open{outline:2px solid var(--hjs);background-color:var(--hjs-soft)!important}
/* 표 머리: 복숭아·하늘색 → 옅은 과목색, 칸 선 연하게(굵기 그대로) */
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body.ov section th{background:var(--hjs-soft)!important;color:var(--ink)!important}
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body.ov section :is(td,th){border-color:var(--line)!important}
/* 피드백: 색 바탕 → 같은 크기의 띠(안쪽 4px 그림자) */
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body.ov .fb.ok{background:var(--hj-ok-soft)!important;color:color-mix(in srgb,var(--hj-ok) 72%,var(--ink))!important;box-shadow:inset 4px 0 0 var(--hj-ok)}
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body.ov .fb.no{background:var(--hj-no-soft)!important;color:color-mix(in srgb,var(--hj-no) 72%,var(--ink))!important;box-shadow:inset 4px 0 0 var(--hj-no)}
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body.ov .fb.info{background:var(--hjs-soft)!important;color:var(--ink)!important;box-shadow:inset 4px 0 0 var(--hjs)}
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body.ov .warn{background:var(--hj-warn-soft)!important;color:var(--ink)!important;border-color:color-mix(in srgb,var(--hj-warn) 35%,var(--paper))!important}
/* 맞음·틀림 색(굵기는 content.css의 2px 그대로) */
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body.ov section button.right{background:var(--hj-ok-soft)!important;border-color:var(--hj-ok)!important;color:color-mix(in srgb,var(--hj-ok) 70%,var(--ink))!important}
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body.ov section button.wrong{background:var(--hj-no-soft)!important;border-color:var(--hj-no)!important;color:color-mix(in srgb,var(--hj-no) 70%,var(--ink))!important}
/* 안쪽 주요 단추(예상 끝!): 각진 14px·가는 글자 → 알약·굵게 */
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body.ov section button.main{border-radius:999px!important;font-weight:700!important}
/* 아래 막대 '이전·다음' 글자 굵게(막대는 고정 위치라 쪽 나눔과 무관) */
html.hj-scmenu #ovBar :is(.hj-pn button,#ovNext,#hjEnd){font-weight:700!important}
html.hj-scmenu #ovBar .hj-pn button:not(#ovNext):not(#hjEnd){border-color:var(--line)!important}
/* 놓는 칸 점선 색만 */
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body.ov section .bin{border-color:var(--hj-line-2)!important}
/* 입력 포커스: 그림자 고리(크기 그대로) */
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body.ov section :is(input[type=text],textarea,select):focus-visible{outline:0;border-color:var(--hjs)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--hjs) 22%,transparent)}
}

@media screen{
/* P2-a 흐름 = 과목색, 활동 = 잉크(국어 '읽기 방법 뽑기'와 같은 규칙). 크기 그대로 */
html[data-hjsubj]:not(#hjz):not(#hjz):not(#hjz) body #lesson .body .big-btn,
html[data-hjsubj]:not(#hjz):not(#hjz):not(#hjz) body #stage #body :is(.big-btn,.mid-btn),
html[data-hjsubj]:not(#hjz):not(#hjz):not(#hjz):has(#ovBar) body.ov section button.main{background:var(--hj-act)!important;color:var(--paper)!important;border-color:transparent!important;box-shadow:0 8px 18px -12px rgba(15,28,51,.55)!important}
/* P2-b 단추 안 이모지 숨김(선 아이콘이 없는 '🔎 생각 확인하기'·'✔️ 기록하기' 등). 너비만 줄어듦 — 과학 한 화면은 한 줄 단추라 높이 그대로이나 쪽 점검 권장 */

/* 국어 말풍선마다 되풀이되는 💬 숨김(너비만 변함) */
html[data-hjsubj] body .talk .q>.hj-em:first-child,html[data-hjsubj] body .talk .q .qt>.hj-em:first-child{display:none!important}
/* P2-c 진행 화면 나가기 자리 통일: 과학·수학도 [자료 목록][홈]을 오른쪽 끝에(국어·사회·홍지희와 같게). 순서만 바뀜, nav 높이 그대로 */
/* (2026-10-29 바꿈) 다른 쪽과 같게 [홈][자료 목록]을 왼쪽 맨 앞에 — 순서만 바뀜, nav 높이 그대로 */
html.hj-scmenu body>nav .wrap>.hj-sctools{order:2;margin-left:auto!important}
html.hj-scmenu body>nav .wrap>.hj-nav{order:-1;flex-direction:row;margin:0 10px 0 0!important}
html[data-hjsubj="math"] body header.top>.who{order:8}
html[data-hjsubj="math"] body header.top>.hj-nav{order:-1;flex-direction:row;margin:0 10px 0 0!important}
}

/* ===== 과감한 층 (2026-10-27 선생님: 투박·유치, 배치 들쭉날쭉, 이모지 조잡, 메뉴와 다름) =====
   국어·사회 덱(#stage)과 홍지희(#lesson) 진행 화면 본문을 메뉴의 흰 판 하나로, 제목·안내 글 무게와 크기를 한 규칙으로, 머리·단추의 꾸밈 이모지를 걷음. */
@media screen{
 /* 판은 '확대되지 않는 틀'에: 덱(#stage)은 #bodyWrap(앱이 그 안의 #body를 화면에 맞게 확대함), 홍지희(#lesson)는 #body를 내용 높이만큼만 */
 html[data-hjsubj] body section#stage.screen.on>#bodyWrap,html[data-hjsubj] body section#lesson.screen.on #body.body{background:var(--paper);border:1px solid var(--line);border-radius:24px;
  box-shadow:0 1px 2px rgba(15,28,51,.04),0 24px 48px -32px rgba(15,28,51,.28)}
 html[data-hjsubj] body section#stage.screen.on>#bodyWrap{padding:clamp(12px,1.6vw,22px) clamp(14px,2vw,28px)!important;margin:0 clamp(0px,1vw,12px)}
 html[data-hjsubj] body section#lesson.screen.on>.foot{margin-top:auto!important}
 html[data-hjsubj] body section#lesson.screen.on #body.body{flex:0 1 auto!important;padding:clamp(18px,2.2vw,30px) clamp(18px,2.4vw,34px)!important}
 html[data-hjsubj] body section:is(#stage,#lesson) .hd{font-weight:800!important;letter-spacing:-.03em!important;color:var(--ink)!important;font-size:clamp(26px,2.5vw,38px)!important;line-height:1.3!important;text-wrap:balance}
 html[data-hjsubj] body section:is(#stage,#lesson) :is(.ask,.inst,.lead,p.goal){color:var(--soft)!important;font-weight:600!important}
 html[data-hjsubj] body :is(.hd,.ask,.inst,.qbox,.hq .qt,.dq,#body h2,#body h3,.big-btn,.mid-btn,.howbtn,button.main,main.lesson .big,.hj-gonext,.hj-head2 h2)>.hj-em:first-child{display:none!important}
}

/* ===== 이모지 자리 선 아이콘 (2026-10-27): 메뉴 icons.js와 같은 24×24·선 1.8, 기능 이모지 111종을 정해진 자리에서만 ===== */
/* 수업 자료 선 아이콘(이모지 자리, content.js hj-eicons) — 메뉴(icons.js)와 같은 24×24·선 1.8 */
html body .hj-em.hj-ei{display:inline-block;position:relative;width:1.12em;height:1.12em;line-height:0;vertical-align:-.2em;margin-inline-end:.08em;flex:none;color:inherit;font-size:inherit}
html body .hj-ei>.hj-eis{display:block;width:100%;height:100%;overflow:visible;stroke-width:var(--hj-sw,1.8)}
html body .hj-ei>.hj-ei-t{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;pointer-events:none}
html body .hj-ei-off,html body .hj-ei-dup{display:none!important}
/* 플렉스 안(단추·막대)에서는 가운데 맞춤, 글자와 간격은 gap이 맡음 */
html body :is(.hj-ic,.seg>button,.bd-tab,.tl-btn,.mu-b,.rd-b,.ar-b,.cs-btn)>.hj-ei{align-self:center;margin-inline-end:0}
/* 굵기: 작은 글(안내·사진 설명·태그)은 조금 굵게, 큰 제목은 조금 가늘게 → 화면에서 선 두께가 비슷해 보이게 */
html body :is(.tip,.warn,.safe,.notice,figcaption,.zoomhint,.rd-tag,.rd-stat,.scores,.hj-qlab,.bq>small,[class$="-rules"]>li) .hj-ei{--hj-sw:2.05}
html body :is(h1,.title,.tl-ico,.mp-ico) .hj-ei,html body :is(.tl-ico,.mp-ico)>.hj-ei{--hj-sw:1.6}
/* 자리별 크기·색 */
html body :is(.sthead .routine,.col>h3,.pane h3,.hintt) .hj-ei,html body :is(.sthead .routine,.col>h3)>.hj-ei{width:1.05em;height:1.05em;vertical-align:-.17em;color:var(--cc,currentColor)}
html body :is(#cover h1.title,.cvin h1.title)>.hj-ei{width:.9em;height:.9em;vertical-align:-.08em;margin-inline-end:.18em;color:var(--hjs,currentColor)}
html body :is(.tl-head .tl-ico,.mp-head .mp-ico)>.hj-ei{width:1em;height:1em;vertical-align:0}
html body :is(.warn,.safe)>.hj-ei{color:var(--hj-warn,#B4530F)}
:root[data-theme="dark"]{--hj-warn:#F0A35E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hj-warn:#F0A35E}}
html body #segTeam .seg button>.hj-ei{width:20px;height:20px;vertical-align:-4px}
/* 바꾸기 전 한두 프레임 단색 이모지가 번쩍이지 않게(이름표 자리만) */
html body :is(.sthead .routine,.col>h3,.hintt,.pane h3 .pe,#segTeam .seg>button)>.hj-em:not([data-ei]){visibility:hidden}
@media print{html body .hj-ei{--hj-sw:1.8}}

/* ===== 수업 화면 새 디자인 v3 (2026-10-27 선생님: '정리 수준이 아니라 훨씬 세련되게') =====
   국어·사회 덱(#stage)·홍지희 버전(#lesson) 진행 화면. 떠 있는 유리 막대 · 진행 점 · 큰 제목 · 깊이 있는 흰 판 · 부드러운 면의 카드 · 그림 칩 · 떠 있는 아래 받침.
   과학 '한 화면'(#ovBar)은 쪽 나눔 때문에 여기 넣지 않음. */
@media screen{
 html[data-hjsubj]{--v3-fill:color-mix(in srgb,var(--ink) 4.5%,var(--paper));--v3-fill2:color-mix(in srgb,var(--ink) 8%,var(--paper));
  --v3-sh:0 1px 2px rgba(15,28,51,.05),0 10px 26px -14px rgba(15,28,51,.22);--v3-sh-lg:0 1px 2px rgba(15,28,51,.04),0 32px 64px -36px rgba(15,28,51,.38);
  --v3-glass:color-mix(in srgb,var(--paper) 78%,transparent)}
 /* 위 막대 */
 html[data-hjsubj] body section:is(#stage,#lesson).screen.on>.topbar{background:var(--v3-glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);
  border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:999px;padding:5px 6px 5px 10px!important;box-shadow:var(--v3-sh);align-items:center;margin-bottom:6px}
 html[data-hjsubj] body section:is(#stage,#lesson) .topbar :is(.steps,.stagebar){gap:4px!important;align-items:center}
 html[data-hjsubj]:not(#hjz):not(#hjz) body section:is(#stage,#lesson) .topbar .st:not(.now){min-width:30px;height:30px;padding:0 8px!important;border:0!important;border-radius:999px!important;
  background:transparent!important;color:color-mix(in srgb,var(--soft) 80%,var(--paper))!important;font-weight:700!important;box-shadow:none!important}
 html[data-hjsubj]:not(#hjz):not(#hjz) body section:is(#stage,#lesson) .topbar .st.done:not(.now){background:var(--hjs-soft)!important;color:var(--hjs-ink)!important}
 html[data-hjsubj]:not(#hjz):not(#hjz) body section:is(#stage,#lesson) .topbar .st.now{height:32px;padding:0 14px!important;border-radius:999px!important;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--hjs) 80%,transparent)!important}
 html[data-hjsubj] body section:is(#stage,#lesson) .topbar .tools{gap:2px!important}
 html[data-hjsubj]:not(#hjz) body section:is(#stage,#lesson) .topbar .tools>.tool:not(.hj-homemini){border:0!important;background:transparent!important;box-shadow:none!important;color:var(--soft)!important;border-radius:999px!important}
 html[data-hjsubj]:not(#hjz) body section:is(#stage,#lesson) .topbar .tools>.tool:not(.hj-homemini):hover{background:var(--v3-fill2)!important;color:var(--ink)!important}
 html[data-hjsubj]:not(#hjz) body section:is(#stage,#lesson) .topbar .tools>.tool.qb .n{box-shadow:none}
 /* 제목 */
 html[data-hjsubj] body section#lesson .hj-head2{margin-top:clamp(10px,2vh,22px)}
 html[data-hjsubj] body section:is(#stage,#lesson) .hd{font-size:clamp(28px,2.7vw,40px)!important;font-weight:800!important;letter-spacing:-.04em!important;line-height:1.22!important}
 html[data-hjsubj] body section#lesson #ask.ask{font-size:clamp(17px,1.45vw,20px)!important;font-weight:500!important;color:var(--soft)!important;margin-top:6px}
 /* 판 */
 html[data-hjsubj] body section#stage.screen.on>#bodyWrap,html[data-hjsubj] body section#lesson.screen.on #body.body{border-radius:28px!important;border-color:color-mix(in srgb,var(--line) 75%,transparent)!important;box-shadow:var(--v3-sh-lg)!important}
 /* 그림 카드(홍지희 .pic): 부드러운 면 + 흰 그림 칩 + 이름표 */
 html[data-hjsubj] body #lesson .pic{background:var(--v3-fill)!important;border:0!important;border-radius:22px!important;box-shadow:none!important;padding:18px 18px 16px!important;gap:8px}
 html[data-hjsubj] body #lesson .pic>.e{display:inline-grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--paper);box-shadow:var(--v3-sh);font-size:44px!important;line-height:1;margin:0 auto 4px}
 html[data-hjsubj] body #lesson .pic>.e .hj-em{font-size:44px!important;line-height:1;color:var(--hjs-ink)}
 html[data-hjsubj] body #lesson .pic>b{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:var(--hjs-soft);color:var(--hjs-ink);font-size:16px!important;font-weight:800;margin:0 auto}
 html[data-hjsubj] body #lesson .pic>small{font-size:clamp(16px,1.35vw,19px)!important;color:var(--ink)!important;line-height:1.45}
 /* 사고 칸(보여요·생각해요·궁금해요): 흰 카드 + 색 동그라미 아이콘 */
 html[data-hjsubj] body #lesson .col{background:var(--paper)!important;border:1px solid var(--line)!important;border-top:1px solid var(--line)!important;border-radius:22px!important;box-shadow:var(--v3-sh)!important;padding:16px 16px 14px!important}
 html[data-hjsubj] body #lesson .col>h3{border:0!important;margin:0 0 6px!important;align-items:center}
 html[data-hjsubj] body #lesson .col>h3 .hintt{display:inline-flex;align-items:center;gap:10px;font-size:clamp(19px,1.6vw,22px)!important;font-weight:800!important;color:var(--ink)!important;letter-spacing:-.02em}
 html[data-hjsubj] body #lesson .col>h3 .hintt>.hj-ei{width:36px!important;height:36px!important;padding:8px;border-radius:12px;background:color-mix(in srgb,var(--cc) 14%,var(--paper));color:color-mix(in srgb,var(--cc) 80%,var(--ink))!important;box-sizing:border-box;vertical-align:middle;margin:0!important}
 html[data-hjsubj] body #lesson .col p.frame{color:var(--soft)!important;font-size:clamp(15px,1.25vw,17px)!important}
 html[data-hjsubj] body #lesson .add{gap:8px!important}
 html[data-hjsubj] body #lesson .add input{background:var(--v3-fill)!important;border:1px solid transparent!important;border-radius:14px!important;padding-inline:14px!important}
 html[data-hjsubj] body #lesson .add input:focus{background:var(--paper)!important;border-color:color-mix(in srgb,var(--cc,var(--hjs)) 55%,var(--paper))!important;box-shadow:0 0 0 4px color-mix(in srgb,var(--cc,var(--hjs)) 16%,transparent)!important;outline:0}
 html[data-hjsubj] body #lesson .add button{border-radius:14px!important;box-shadow:none!important}
 /* 고르는 알약·카드(홍지희 .dc·.opt·.evi): 부드러운 면, 고르면 흰 바탕 + 과목색 고리 */
 html[data-hjsubj] body #lesson :is(.dc,.opt,.evi button){background:var(--v3-fill)!important;border-color:transparent!important;box-shadow:none!important;transition:background .15s,box-shadow .15s,transform .1s}
 html[data-hjsubj] body #lesson :is(.dc,.opt,.evi button):hover:not(:disabled){background:var(--v3-fill2)!important}
 html[data-hjsubj] body #lesson :is(.dc,.opt,.evi button):active{transform:scale(.985)}
 html[data-hjsubj] body #lesson :is(.dc,.evi button)[aria-pressed="true"],html[data-hjsubj] body #lesson .opt:is(.on,.sel){background:var(--paper)!important;border-color:var(--hjs)!important;color:var(--hjs-ink)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--hjs) 18%,transparent),var(--v3-sh)!important}
 /* 국어·사회 덱: 말풍선 줄은 부드러운 면, 되풀이 💬은 걷음 */
 /* 덱은 앱이 본문을 화면 높이에 맞춰 키우므로 큰 판 대신 바탕 위에 흰 카드(빈 판이 남지 않게) */
 html[data-hjsubj]:not(#hjz) body section#stage.screen.on>#bodyWrap{background:transparent!important;border-color:transparent!important;box-shadow:none!important}
 html[data-hjsubj] body section#stage #bodyWrap>#body{padding-inline:clamp(12px,2vw,28px)!important;box-sizing:border-box}
 html[data-hjsubj] body section#lesson.screen.on #body.body{justify-content:flex-start!important;padding:clamp(18px,2.4vw,30px)!important}
 html[data-hjsubj] body section#lesson.screen.on #body.body>:first-child{margin-top:0!important}
 html[data-hjsubj] body #stage .talk .q{background:var(--paper)!important;border:1px solid color-mix(in srgb,var(--line) 70%,transparent)!important;border-radius:22px!important;box-shadow:var(--v3-sh)!important}
 html[data-hjsubj] body #stage .talk .q>.qm{display:none!important}
 html[data-hjsubj] body #stage :is(.way,.opt2,.card1,.book){background:var(--paper)!important;border-color:color-mix(in srgb,var(--line) 70%,transparent)!important;box-shadow:var(--v3-sh)!important;border-radius:22px!important}
 html[data-hjsubj] body #stage :is(.way,.opt2):hover:not(:disabled){background:var(--paper)!important;border-color:color-mix(in srgb,var(--hjs) 40%,var(--line))!important}
 html[data-hjsubj] body #stage :is(.way[aria-pressed="true"],.opt2.on,.opt2.sel){background:var(--paper)!important;border-color:var(--hjs)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--hjs) 18%,transparent),var(--v3-sh)!important}
 /* 아래 받침: 떠 있는 유리 막대 */
 html[data-hjsubj] body section:is(#stage,#lesson).screen.on>.foot{background:var(--v3-glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);

<script>
const APP={title:"수리수리 수학 나라 규칙과 관계", unit:"4-1 수학 6. 규칙과 관계(교과서)", key:"t41-pattern-v1", welcome:"수리수리 수학 나라 규칙과 관계 교실에 온 것을 환영해요", intro:"교과서 차시 그대로, 하진이와 지혜, 현우가 수학 가상 세계의 네 섬을 탐험하며 수와 도형, 계산식의 배열에서 규칙을 찾고 크기가 같은 두 양을 등호로 나타내요."};

/* ===== 설정 ===== */
const CONFIG = {
  unit: APP.unit,
  // 구글 앱스 스크립트 웹 앱 주소(선택). 앱스 스크립트 안에서 열면 비워 두어도 자동 연결돼요.
  endpoint: "",
  localPin: "1234"   // 앱스 스크립트 없이 이 기기 기록만 볼 때 쓰는 선생님 비밀번호
};
const STEP_NAMES = ["만져 보기", "그려 보기", "말해 보기", "약속하기", "확인하기"];
const KEY = APP.key;

/* ===== 저장 ===== */
const store = {
  load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } },
  save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
};
let S = store.load();
S.student = S.student || null;     // {ban, no, name}
S.prog = S.prog || {};             // prog[`${ban}-${no}`][chasiId] = {steps:{i:{ok,tries,ans}}, chal:{...}}
S.log = S.log || [];               // 이 기기의 모든 기록
S.queue = S.queue || [];           // 보내지 못한 기록

const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
function toast(msg) { const t = h("div", { class: "toast" }, msg); document.body.append(t); setTimeout(() => t.remove(), 2200); }
const sid = () => S.student ? `${S.student.ban}-${S.student.no}` : "guest";
function myProg(cid) { const p = (S.prog[sid()] = S.prog[sid()] || {}); return (p[cid] = p[cid] || { steps: {}, chal: null }); }

/* ===== 기록 보내기 ===== */
const hasGAS = () => typeof google !== "undefined" && google.script && google.script.run;
function send(rec) {
  if (hasGAS()) {
    google.script.run.withFailureHandler(() => { S.queue.push(rec); store.save(S); }).saveRecord(rec);
  } else if (CONFIG.endpoint) {
    fetch(CONFIG.endpoint, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(rec) })
      .catch(() => { S.queue.push(rec); store.save(S); });
  }
}
function flushQueue() {
  if (!S.queue.length || (!hasGAS() && !CONFIG.endpoint)) return;
  const q = S.queue.splice(0); store.save(S); q.forEach(send);
}
function record(chasi, stepNo, stepName, ok, tries, answer, level) {
  const st = S.student || { ban: "", no: "", name: "" };
  const rec = { time: new Date().toISOString(), ban: st.ban, no: st.no, name: st.name, unit: CONFIG.unit,
    chasi: chasi.no, title: chasi.title, step: stepNo, stepName, ok: !!ok, tries, answer: String(answer || "").slice(0, 400), level: level || "기본" };
  S.log.push(rec); if (S.log.length > 3000) S.log.splice(0, S.log.length - 3000);
  store.save(S); send(rec);
}

/* ===== 화면 ===== */
const root = () => $("#app");
function topbar() {
  const st = S.student;
  return h("header", { class: "top" },
    h("div", { class: "brand" }, ringLogo(), h("span", {}, APP.title), h("span", { class: "long" }, " · " + APP.unit)),
    h("div", { class: "who" },
      st ? h("span", { class: "chip" }, `${st.ban}반 ${st.no}번 ${st.name || ""}`) : null,
      st ? h("button", { class: "chip btn", onclick: () => { S.student = null; store.save(S); showGate(); } }, "바꾸기") : null,
      h("button", { class: "chip btn", onclick: showTeacher }, "선생님")));
}
function ringLogo() {
  const s = svgEl("svg", { viewBox: "0 0 40 40", "aria-hidden": "true" });
  s.append(svgEl("circle", { cx: 20, cy: 20, r: 16, fill: "none", stroke: "#F4C542", "stroke-width": 4 }),
    svgEl("line", { x1: 20, y1: 20, x2: 34, y2: 12, stroke: "#fff", "stroke-width": 3, "stroke-linecap": "round" }),
    svgEl("circle", { cx: 20, cy: 20, r: 3.5, fill: "#fff" }));
  return s;
}
function mount(...els) { const r = root(); r.innerHTML = ""; r.append(topbar(), ...els); window.scrollTo(0, 0); }

/* 시작: 번호 고르기 */
function showGate() {
  let ban = (S.student && S.student.ban) || "2", no = null;
  const nums = h("div", { class: "nums" });
  for (let i = 1; i <= 40; i++) nums.append(h("button", { onclick: (e) => { no = i; [...nums.children].forEach(b => b.classList.remove("on")); e.currentTarget.classList.add("on"); go.disabled = false; } }, String(i)));
  const banIn = h("input", { type: "number", min: 1, max: 15, value: ban, style: "width:4.5em", "aria-label": "반" });
  const nameIn = h("input", { type: "text", placeholder: "이름 (선택)", maxlength: 10, style: "width:9em" });
  const go = h("button", { class: "big", disabled: true, onclick: () => {
    S.student = { ban: String(banIn.value || "2"), no, name: nameIn.value.trim() }; store.save(S); flushQueue(); showMap();
  } }, "입장하기");
  mount(h("main", { class: "gate" }, h("section", { class: "gate-card" },
    h("h1", {}, APP.welcome),
    h("p", { class: "inst" }, APP.intro + " 내 번호를 눌러 주세요."),
    h("div", { class: "row" }, h("span", { class: "jua" }, "4학년"), banIn, h("span", { class: "jua" }, "반"), nameIn),
    nums, go)));
}

/* 차시 지도 */
function wantedLesson() {
  const h = (location.hash || "").replace("#", "").trim();
  const q = new URLSearchParams(location.search).get("lesson");
  const key = q || h;
  if (!key) return null;
  return LESSONS.find(L => String(L.no) === key || L.id === key) || LESSONS.find(L => { const m = String(L.no).match(/^(\d+)~(\d+)$/); return m && +key >= +m[1] && +key <= +m[2]; }) || null;
}
function showMap() {
  if (!S.student) return showGate();
  const want = wantedLesson();
  if (want && !showMap._used) { showMap._used = true; return openLesson(want.id); }
  const trail = h("div", { class: "trail" });
  LESSONS.forEach(L => {
    const p = myProg(L.id), done = L.steps.filter((_, i) => p.steps[i] && p.steps[i].ok).length;
    const prog = h("div", { class: "prog" }, L.steps.map((_, i) => {
      const r = p.steps[i];
      return h("i", { class: r && r.ok ? (r.help === "넘어감" ? "half" : "on") : "" });
    }));
    trail.append(h("button", { class: "site" + (done === L.steps.length ? " done" : ""), onclick: () => openLesson(L.id) },
      p.chal && p.chal.ok ? h("span", { class: "star", title: "도전 완료" }, "★") : null,
      h("span", { class: "n" }, `${L.no}차시`), h("span", { class: "t" }, L.title),
      h("span", { class: "soop" }, `S.O.O.P. ${L.soop}`), prog));
  });
  const story = (typeof UNIT_STORY !== "undefined") ? UNIT_STORY : null;
  const storyCard = story ? h("section", { class: "story" },
    h("div", { class: "jua" }, `📖 이야기 · ${story.title}`),
    story.lines.map(t => h("p", {}, t))) : null;
  mount(h("main", { class: "map" }, h("h2", {}, "어느 차시를 탐험할까요?"),
    h("p", { class: "inst" }, "각 차시는 ‘개념 계단’ 다섯 칸으로 되어 있어요. 앞 계단을 해결해야 다음 계단이 열려요."),
    storyCard, trail));
}

/* 차시 학습 */
let CUR = null;
function openLesson(id, stepIdx) {
  const L = LESSONS.find(x => x.id === id); const p = myProg(id);
  let first = L.steps.findIndex((_, i) => !(p.steps[i] && p.steps[i].ok)); if (first < 0) first = L.steps.length - 1;
  CUR = { L, idx: stepIdx != null ? stepIdx : first };
  renderLesson();
}
function unlocked(L, i) { const p = myProg(L.id); for (let k = 0; k < i; k++) if (!(p.steps[k] && p.steps[k].ok)) return false; return true; }
function renderLesson() {
  const { L, idx } = CUR; const p = myProg(L.id);
  const stairs = h("nav", { class: "stairs", "aria-label": "개념 계단" },
    h("div", { class: "title" }, `${L.no}차시 · ${L.title}`), h("span", { class: "soopb" }, `S.O.O.P. ${L.soop}`));
  L.steps.forEach((st, i) => {
    const rec0 = p.steps[i], ok = rec0 && rec0.ok, lock = !unlocked(L, i);
    stairs.append(h("button", { class: "stair" + (i === idx ? " cur" : "") + (ok ? " ok" : "") + (lock ? " lock" : ""), disabled: lock,
      onclick: () => { CUR.idx = i; renderLesson(); } }, h("span", { class: "k" }, ok ? (rec0 && rec0.help === "넘어감" ? "△" : "✓") : String(i + 1)), h("span", { class: "lbl" }, st.name || STEP_NAMES[i])));
  });
  if (L.challenge) {
    const allOk = L.steps.every((_, i) => p.steps[i] && p.steps[i].ok);
    stairs.append(h("button", { class: "stair chal" + (idx === "chal" ? " cur" : "") + (p.chal && p.chal.ok ? " ok" : "") + (allOk ? "" : " lock"), disabled: !allOk,
      onclick: () => { CUR.idx = "chal"; renderLesson(); } }, h("span", { class: "k" }, "★"), h("span", { class: "lbl" }, "도전 계단")));
  }
  stairs.append(h("button", { class: "ghost back", onclick: showMap }, "차시 지도로"));
  stairs.append(h("button", { class: "ghost back copylink", onclick: () => {
    const url = location.origin + location.pathname + location.search.replace(/[?&]lesson=[^&]*/, "") + "#" + L.no;
    try { navigator.clipboard.writeText(url); toast("이 차시 주소를 복사했어요"); }
    catch (err) { toast(url); }
  } }, "이 차시 주소 복사"));

  const work = h("section", { class: "work" });
  const step = idx === "chal" ? L.challenge : L.steps[idx];
  const stepNo = idx === "chal" ? 6 : idx + 1;
  const name = idx === "chal" ? "도전 계단" : (step.name || STEP_NAMES[idx]);
  const speakText = () => `탐구 질문. ${L.question}. ${name}. ${step.inst || ""}`;
  const speakBtn = h("button", { class: "ghost speak", title: "문제를 읽어 줘요", onclick: () => {
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(speakText()); u.lang = "ko-KR"; u.rate = .9; speechSynthesis.speak(u); }
    catch (err) { toast("이 기기에서는 읽어 주기를 쓸 수 없어요."); }
  } }, "🔊 읽어 주기");
  if (typeof UNIT_STORY !== "undefined") work.append(h("div", { class: "scene" }, "📖 " + UNIT_STORY.one));
  work.append(h("div", { class: "q" }, "탐구 질문 · " + L.question),
    h("div", { class: "stephead" }, h("h2", { class: "stepname" }, `${idx === "chal" ? "★" : stepNo}. ${name}`), speakBtn));
  if (step.inst) work.append(h("p", { class: "inst" }, step.inst));
  const body = h("div"); work.append(body);
  const nextBtn = h("button", { class: "big", disabled: true }, "다음 계단");
  const fb = h("div", { class: "fb", role: "status", "aria-live": "polite" });
  const acts = h("div", { class: "actions" }, nextBtn, fb);
  work.append(acts);

function quiz(body, api, items, opts = {}) {

    const box = h("div", { class: "qitem" });
    if (it.q) box.append(h("div", { class: "jua" }, `${items.length > 1 ? qi + 1 + ". " : ""}${it.q}`));
    if (it.fig) box.append(it.fig());

    const row = h("div", { class: "opts" });

      if (multi) { sel.has(oi) ? sel.delete(oi) : sel.add(oi); e.currentTarget.classList.toggle("on"); state[qi] = [...sel]; }
      else { [...row.children].forEach(b => b.classList.remove("on")); e.currentTarget.classList.add("on"); state[qi] = oi; }
    } }, o)));
    box.append(row); wrap.append(box);
  });
  api.provide && api.provide({
    words: items.flatMap(it => (Array.isArray(it.a) ? it.a : [it.a]).map(i => it.o[i])),
    answers: items.map((it, qi) => `${items.length > 1 ? (qi + 1) + ") " : ""}${(Array.isArray(it.a) ? it.a : [it.a]).map(i => it.o[i]).join(", ")}`)
  });

      const good = Array.isArray(it.a) ? (Array.isArray(v) && v.length === it.a.length && it.a.every(x => v.includes(x))) : v === it.a;
      btns.forEach(b => b.classList.remove("good", "bad"));

    });
