<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 반 교실</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF7F2;--bg2:#F4ECE2;--paper:#FFFFFF;--ink:#3B332D;--soft:#7A6D63;--line:#ECE2D7;--line2:#DFD2C4;--focus:#D58A5E;
 --acc:#D68C63;--ok:#3F9A6E;--bad:#D2574B;
 --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
 --fs:clamp(17px,1.35vw,26px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#221E1A;--bg2:#2C2621;--paper:#2B2621;--ink:#F2EBE3;--soft:#C2B5A9;--line:#3D352E;--line2:#4C4239;--focus:#F0B48F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#221E1A;--bg2:#2C2621;--paper:#2B2621;--ink:#F2EBE3;--soft:#C2B5A9;--line:#3D352E;--line2:#4C4239;--focus:#F0B48F;color-scheme:dark}
html.m-tv{--fs:clamp(20px,1.55vw,34px)}
html.m-dev{--fs:17px}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.55;word-break:keep-all;overflow-wrap:break-word;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.mix{--soft-acc:color-mix(in srgb,var(--acc) 15%,var(--paper));--mid-acc:color-mix(in srgb,var(--acc) 45%,var(--paper));--ink-acc:color-mix(in srgb,var(--acc) 65%,var(--ink))}
h1,h2,h3,.disp{font-family:var(--display);font-weight:400;letter-spacing:-.01em}

/* 윗줄 */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.5rem clamp(12px,2vw,28px);
 background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--line)}
.bar .clock{font-family:var(--display);font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
.bar .date{font-family:var(--display);font-size:1.05rem;color:var(--soft);line-height:1.2}
.bar .date b{display:block;color:var(--ink);font-weight:400;font-size:1.15rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;min-height:2.3rem;padding:.25rem .8rem;border-radius:999px;background:var(--paper);border:1.5px solid var(--line);font-size:.95rem;white-space:nowrap}
button.chip:hover{border-color:var(--line2);background:var(--bg2)}
.chip.now{background:color-mix(in srgb,#E39A4E 18%,var(--paper));border-color:color-mix(in srgb,#E39A4E 40%,var(--paper));font-family:var(--display);font-size:1.05rem}
.chip.next{font-family:var(--display);font-size:1.05rem;color:var(--soft)}
.chip.next b{color:var(--ink);font-weight:800}
.chip.timer{background:#FDE7DA;border-color:#F0B48F;font-family:var(--display);font-variant-numeric:tabular-nums}
.chip.timer.end{animation:blink .6s steps(2) infinite}
@keyframes blink{50%{background:#F7C1A6}}
.bar .sp{flex:1}
.lv{display:inline-block;padding:0 .45rem;border-radius:999px;font-size:.8rem;color:#fff;font-family:var(--display)}
.lv1{background:#3D86D6}.lv2{background:#3F9A6E}.lv3{background:#E39A4E}.lv4{background:#D2574B}
body.teacher .tbtn{background:#3B332D;color:#fff;border-color:#3B332D}

/* 바탕화면 */
main{max-width:1500px;margin:0 auto;padding:clamp(12px,2vw,28px) clamp(12px,2vw,28px) 90px}
.hello{display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap;margin:.2rem 0 1rem}
.hello h1{font-size:2rem;margin:0}
.hello p{margin:0;color:var(--soft)}
.bday{display:flex;align-items:center;gap:.8rem;padding:.7rem 1.1rem;border-radius:18px;background:linear-gradient(90deg,#FDE2EA,#FFF1D6);color:#5A3A2A;margin-bottom:1rem;font-family:var(--display);font-size:1.25rem;border:0;width:100%;text-align:left}
.widgets{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;gap:.9rem;margin-bottom:1.6rem}
.wg{background:var(--paper);border:1.5px solid var(--line);border-radius:20px;padding:.9rem 1.1rem;min-width:0;display:flex;flex-direction:column;gap:.4rem;
 box-shadow:0 1px 2px rgba(80,55,30,.04),0 10px 24px -18px rgba(80,55,30,.25)}
.wg h2{margin:0;font-size:1.2rem;display:flex;align-items:center;gap:.4rem;white-space:nowrap;min-width:0}
.wg h2 .ed{margin-left:auto}
.wg .body{font-size:1rem;white-space:pre-wrap}
.wg.notice{background:linear-gradient(160deg,color-mix(in srgb,#E07A6E 12%,var(--paper)),var(--paper) 60%)}
.wg.notice .body{font-family:var(--display);font-size:1.3rem;line-height:1.5}
.wg .goal{margin-top:auto;border-top:1.5px dashed var(--line);padding-top:.5rem;font-size:.95rem;color:var(--soft)}
.wg .goal b{color:var(--ink);font-family:var(--display);font-weight:400;font-size:1.1rem}
.tt{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.2rem}
.tt li{display:flex;gap:.6rem;align-items:center;padding:.15rem .5rem;border-radius:10px}
.tt li .p{font-family:var(--display);color:var(--soft);min-width:2.8em;font-size:.9rem}
.tt li.cur{background:color-mix(in srgb,#E39A4E 20%,var(--paper));font-family:var(--display);font-size:1.12rem}
.tt li.past{opacity:.5}
.small{font-size:.85rem;color:var(--soft)}
.meal{list-style:none;margin:0;padding:0}
.meal li{padding:.05rem 0}
.meal sup{font-size:.62em;color:var(--soft);margin-left:.15em}
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.25rem}
.chk label{display:flex;gap:.5rem;align-items:flex-start;cursor:pointer}
.chk input{width:1.2em;height:1.2em;margin-top:.2em;accent-color:#3F9A6E;flex:none}
.chk .ok{text-decoration:line-through;color:var(--soft)}

.grp{margin:0 0 1.4rem}
.grp>h2{font-size:1.3rem;margin:0 0 .6rem;display:flex;align-items:center;gap:.5rem}
.grp>h2::before{content:"";width:.5rem;height:1.3rem;border-radius:4px;background:var(--acc)}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.2rem,1fr));gap:.7rem}
.ic{display:flex;flex-direction:column;align-items:center;gap:.35rem;padding:.8rem .4rem .7rem;border-radius:20px;border:1.5px solid var(--line);background:var(--paper);
 text-align:center;transition:transform .14s,border-color .14s,box-shadow .14s;position:relative;min-width:0}
.ic:hover{transform:translateY(-2px);border-color:var(--mid-acc);box-shadow:0 14px 26px -18px rgba(80,55,30,.4)}
.ic .e{display:grid;place-items:center;width:3.3rem;height:3.3rem;border-radius:16px;background:var(--soft-acc);font-size:1.9rem;line-height:1}
.ic .n{font-family:var(--display);font-size:1rem;line-height:1.25}
.ic.off{opacity:.45}
.ic.off::after{content:"꺼짐";position:absolute;top:.4rem;right:.5rem;font-size:.7rem;background:var(--bg2);border-radius:999px;padding:0 .4rem}
.ic .star{position:absolute;top:.35rem;left:.45rem;font-size:.8rem}
body:not(.teacher) .t-only{display:none!important}

footer.hjfoot{display:block;width:100%;margin:40px 0 0;padding:16px 0 4px;border-top:1.5px solid var(--line);text-align:center;color:var(--soft);font-size:15px;line-height:1.7;word-break:keep-all}
.hjfoot p{margin:2px 0}

/* 창 */
#win{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
#win[hidden]{display:none}
.wbar{display:flex;align-items:center;gap:.6rem;padding:.45rem clamp(10px,1.6vw,22px);border-bottom:1.5px solid var(--line);background:var(--soft-acc)}
.wbar h2{margin:0;font-size:1.5rem;display:flex;align-items:center;gap:.5rem;min-width:0}
.wbar .sp{flex:1}
.wbar .wclock{font-family:var(--display);color:var(--soft);font-size:1.1rem;font-variant-numeric:tabular-nums}
.wbody{flex:1;overflow:auto;padding:clamp(10px,1.8vw,26px);display:flex;flex-direction:column;gap:.9rem;min-height:0}
.wbody.fill{padding:0;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;min-height:2.6rem;padding:.3rem 1rem;border-radius:14px;border:1.5px solid var(--line2);background:var(--paper);font-family:var(--display);font-size:1.05rem;line-height:1.2}
.btn:hover{background:var(--bg2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.05)}
.btn.big{min-height:3.4rem;font-size:1.4rem;padding:.4rem 1.6rem;border-radius:18px}
.btn.sm{min-height:2.1rem;font-size:.9rem;padding:.15rem .7rem;border-radius:11px}
.btn.on{background:var(--mid-acc);border-color:var(--mid-acc)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.row.c{justify-content:center}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:20px;padding:1rem 1.2rem;min-width:0}
.huge{font-family:var(--display);font-size:clamp(3rem,12vmin,9rem);line-height:1.05;text-align:center;font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-size:clamp(1.6rem,6vmin,3.6rem);line-height:1.25;text-align:center}
.mid{font-family:var(--display);font-size:1.4rem}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;flex:1;text-align:center}
.note{font-size:.88rem;color:var(--soft);background:var(--bg2);border-radius:12px;padding:.5rem .8rem}
.inp{border:1.5px solid var(--line2);background:var(--paper);border-radius:12px;padding:.4rem .7rem;min-height:2.6rem;min-width:0}
textarea.inp{width:100%;line-height:1.5;resize:vertical}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap}
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.4rem,1fr));gap:.5rem}
.num{min-height:3.6rem;border-radius:16px;border:1.5px solid var(--line2);background:var(--paper);font-family:var(--display);font-size:1.35rem;line-height:1.1;padding:.2rem}
.num small{display:block;font-family:var(--body);font-size:.68rem;color:var(--soft)}
.num.on{background:#CFEBDC;border-color:#7CC3A0;color:#1F4D37}
.num.off{opacity:.35}
.list{display:flex;flex-direction:column;gap:.4rem;margin:0;padding:0;list-style:none}
.list li{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:.5rem .8rem;display:flex;gap:.6rem;align-items:center}
.list li .grow{flex:1;min-width:0;white-space:pre-wrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.8rem}
.bars .b{display:grid;grid-template-columns:minmax(4rem,9rem) 1fr 3rem;gap:.6rem;align-items:center;margin:.35rem 0}
.bars .track{height:1.8rem;background:var(--bg2);border-radius:999px;overflow:hidden}
.bars .fillb{height:100%;background:var(--acc);border-radius:999px;transition:width .4s}
.sticky{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.8rem}
.sticky .s{padding:.9rem 1rem;border-radius:6px 18px 18px 18px;background:#FFF3C4;color:#4A3B12;box-shadow:0 6px 14px -10px rgba(0,0,0,.4);position:relative;white-space:pre-wrap}
.sticky .s:nth-child(3n+2){background:#E2F1FF;color:#1E3A55}.sticky .s:nth-child(3n){background:#FDE2EA;color:#5A2236}
.sticky .s b{font-family:var(--display);font-weight:400;display:block;font-size:1.1rem}
.sticky .s .x{position:absolute;top:.3rem;right:.4rem}
table.t{border-collapse:collapse;width:100%}
table.t td,table.t th{border:1.5px solid var(--line);padding:.35rem .6rem;text-align:left}
table.t th{background:var(--bg2);font-family:var(--display);font-weight:400}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;background:#3B332D;color:#fff;padding:.6rem 1.2rem;border-radius:999px;font-family:var(--display);box-shadow:0 10px 26px -10px rgba(0,0,0,.5)}
#modal{position:fixed;inset:0;z-index:80;background:rgba(40,30,20,.45);display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
#modal .box{background:var(--paper);border-radius:22px;padding:1.2rem 1.4rem;width:min(720px,100%);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:.7rem;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
#modal h3{margin:0;font-size:1.4rem}
.confetti{position:fixed;top:-20px;z-index:95;width:12px;height:16px;border-radius:3px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.blk{position:fixed;inset:0;z-index:99;background:#14110F;color:#F6EDE3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;font-family:var(--display);font-size:clamp(2rem,7vw,5rem);text-align:center;cursor:pointer}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.signal{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:28px;gap:.4rem;padding:1rem;transition:background .3s}
.dice{display:inline-grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:clamp(110px,22vmin,200px);aspect-ratio:1;background:var(--paper);border:3px solid var(--line2);border-radius:22%;padding:12%;gap:4%}
.dice i{border-radius:50%;background:transparent}
.dice i.d{background:var(--ink)}
.dice.roll{animation:roll .5s ease-out}
@keyframes roll{0%{transform:rotate(0) scale(.7)}60%{transform:rotate(300deg) scale(1.1)}100%{transform:rotate(360deg) scale(1)}}
.coin{width:clamp(140px,30vmin,240px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FFE9A8,#E3B23C 70%);color:#6B4A0C;font-family:var(--display);font-size:2.6rem;border:6px solid #C99A2E}
.coin.flip{animation:flip .9s ease-out}
@keyframes flip{0%{transform:rotateY(0)}100%{transform:rotateY(1800deg)}}
.cover{position:relative;border-radius:16px;border:1.5px solid var(--line2);background:var(--paper);padding:.8rem 1rem;min-height:3.4rem;font-family:var(--display);font-size:1.5rem;cursor:pointer;text-align:left}
.cover.hid{color:transparent;background:repeating-linear-gradient(45deg,var(--bg2),var(--bg2) 10px,var(--line) 10px,var(--line) 20px)}
.cover.hid::after{content:"눌러서 열기 👆";position:absolute;inset:0;display:grid;place-items:center;color:var(--soft);font-size:1rem}
.therm{display:flex;gap:2rem;align-items:center;justify-content:center;flex-wrap:wrap}
.tube{position:relative;width:4.4rem;height:min(52vh,420px);border-radius:999px;background:var(--bg2);border:4px solid var(--line2);overflow:hidden}
.tube .lvl{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#E0564A,#F59A6B);transition:height .6s}
.seats{display:grid;gap:.5rem}
.seat{min-height:3.4rem;border-radius:12px;border:1.5px solid var(--line2);background:var(--paper);font-family:var(--display);font-size:1.15rem;line-height:1.15;padding:.2rem}
.seat.sel{outline:3px solid #E39A4E}
.seat.empty{background:transparent;border-style:dashed;color:var(--soft)}
.boardlbl{text-align:center;background:#2F4A3A;color:#E9F5EC;border-radius:10px;padding:.3rem;font-family:var(--display)}
.ws{display:grid;gap:3px;user-select:none;touch-action:manipulation;margin:0 auto}
.ws button{aspect-ratio:1;border:1.5px solid var(--line2);background:var(--paper);border-radius:8px;font-family:var(--display);font-size:clamp(1rem,3.4vmin,1.8rem);padding:0}
.ws button.a{background:#FFE2B8}.ws button.f{background:#CFEBDC}
.keypad{display:grid;grid-template-columns:repeat(3,4.2rem);gap:.4rem;justify-content:center}
.keypad button{height:3.4rem;border-radius:14px;border:1.5px solid var(--line2);background:var(--paper);font-family:var(--display);font-size:1.5rem}
.ans{font-family:var(--display);font-size:2.4rem;min-width:6rem;min-height:3.6rem;border-bottom:4px solid var(--line2);text-align:center}
.step{display:flex;gap:1rem;align-items:center}
.step .no{flex:none;width:3rem;height:3rem;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:#fff;font-family:var(--display);font-size:1.4rem}
canvas{touch-action:none;display:block}
.bd-white{background:#fff}.bd-black{background:#24302A}
.bd-grid{background:#fff linear-gradient(#DCE6F0 1px,transparent 1px) 0 0/32px 32px,#fff linear-gradient(90deg,#DCE6F0 1px,transparent 1px) 0 0/32px 32px;background-blend-mode:multiply}
.bd-line{background:#fff repeating-linear-gradient(#fff 0 47px,#BFD3E6 47px 48px)}
@media (max-width:1100px){.widgets{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.widgets{grid-template-columns:1fr}.bar .clock{font-size:1.7rem}.icons{grid-template-columns:repeat(auto-fill,minmax(6.2rem,1fr))}}
@media (max-height:720px) and (min-width:900px){.bar{padding-top:.3rem;padding-bottom:.3rem}.bar .clock{font-size:1.8rem}.wg{padding:.7rem .9rem}}
@media print{.bar,#hj-home{display:none!important}body.hj-dprint>*:not(#dws){display:none!important}html:has(body.hj-dprint),body.hj-dprint{background:#fff!important;padding:0!important;margin:0!important}body.hj-dprint #dws{display:block!important}@page{size:A4;margin:0}}
#dws{display:none}
#dws .pg{width:210mm;min-height:297mm;box-sizing:border-box;padding:15mm 16mm 13mm;background:#fff;color:#111;font-family:var(--body);page-break-after:always;break-after:page}
#dws .pg:last-child{page-break-after:auto;break-after:auto}
#dws h2{margin:0;font-size:20pt;font-family:var(--display);display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5pt solid #111;padding-bottom:3mm}
#dws h2 small{font-size:10pt;font-weight:600}
#dws .nm{display:flex;justify-content:space-between;font-size:11.5pt;margin:4mm 0 6mm}
#dws ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(10,auto);column-gap:12mm}
#dws li{display:flex;align-items:center;gap:3mm;font-size:17pt;min-height:21mm;border-bottom:.6pt dashed #bbb;font-variant-numeric:tabular-nums}
#dws li .n{font-size:10pt;color:#555;width:7mm}
#dws li .bx{flex:1;border-bottom:1pt solid #333;height:9mm;max-width:32mm;margin-left:2mm}
#dws .ans li{font-size:14pt;min-height:11mm}
#dws .ans b{color:#c22}
#dws .ft{margin-top:5mm;font-size:9pt;color:#666;text-align:right}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .1em;font-size:.85em}.fr>span:first-child{border-bottom:.08em solid currentColor;padding:0 .15em}
.dsp{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.4rem 1.2rem;width:min(1000px,100%);text-align:left}
.dsp div{font-size:1.35rem;font-family:var(--display);padding:.45rem .6rem;border-bottom:1px dashed var(--line);display:flex;gap:.6rem;align-items:center}
.dsp div small{color:var(--soft);font-size:.8rem;width:1.8rem}
.dsp.show i{color:#c2453b;font-style:normal;font-weight:800}
</style>
<style id="hj-contact-css">.hj-contact{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px 12px;margin:8px 0 0;padding:0}.hj-contact a{display:inline-flex;align-items:center;gap:6px;color:var(--ink,#1F2A44);text-decoration:none;font-size:15px;line-height:1.2;background:var(--paper,#fff);border:2px solid var(--line,#CAD6E4);border-radius:999px;padding:5px 12px;white-space:nowrap}.hj-contact a:hover,.hj-contact a:focus-visible{border-color:var(--ink,#1F2A44);outline:0}.hj-contact svg{flex:none}@media print{.hj-contact a{border:0;padding:0}}</style>
</head><body class="mix">
<header class="bar mix" id="bar">
 <div class="clock" id="clk">--:--</div>
 <div class="date" id="dt"></div>
 <span class="chip now" id="nowc"></span>
 <span class="chip next" id="nextc" hidden></span>
 <button class="chip timer" id="tmc" type="button" data-open="timer" hidden></button>
