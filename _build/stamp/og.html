<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=Song+Myung&display=swap" rel="stylesheet">
<style>html,body{margin:0}body{width:1200px;height:630px;background:#f7f1e6;font-family:'Gowun Dodum',sans-serif;display:flex;align-items:center;gap:60px;padding:0 80px;box-sizing:border-box;color:#2b2622;position:relative}
.seal{flex:none;width:270px;height:270px;border:15px solid #c63b2c;border-radius:40px;color:#c63b2c;display:grid;place-items:center;font-family:'Song Myung',serif;font-size:180px;transform:rotate(-5deg);box-sizing:border-box}
.t{font-family:'Black Han Sans',sans-serif;font-size:90px;letter-spacing:-.01em;line-height:1.1}.s{font-size:31px;color:#6b5f56;margin-top:20px;line-height:1.45;word-break:keep-all}
.chips{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}.c{font-size:23px;font-weight:700;padding:7px 15px;border-radius:999px;background:#fff;border:3px solid #c63b2c;color:#c63b2c}
.by{position:absolute;right:90px;bottom:40px;font-size:28px;color:#a52d20}
.bar{position:absolute;left:0;top:0;width:100%;height:18px;background:#c63b2c}</style></head>
<body><div class="bar"></div><div class="seal">印</div><div><div class="t">도장 프롬프트<br>만들기</div><div class="s">고르기만 하면 ChatGPT·Gemini에 넣을<br>프롬프트와 도장 이미지 파일을 만들어요</div>
<div class="chips"><span class="c">이름 도장</span><span class="c">칭찬 도장</span><span class="c">학급 도장</span><span class="c">사진으로 도장</span></div></div>
<div class="by">초등교사 홍지희</div></body></html>
