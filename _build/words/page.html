<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{NAME} · 속담·관용어·사자성어 · 공통 · 초등교사 홍지희</title>
<meta name="description" content="초등 {NAME} 150개: 익히기, 뜻 고르기, 말 고르기, 짝 맞추기, 학습지·급수표 인쇄">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{FONT}
<style>{CSS}</style>{HEADSNIP}
</head><body>
<main>
<nav class="wd-gr" aria-label="영역">{NAV}</nav>
<h1>{ICO} {NAME}</h1>
<p class="sub">{INTRO}</p>
<div class="wd-lv" id="wdLv" aria-label="급 고르기"></div>
<div class="wd-tabs" id="wdTabs" role="tablist">
<button type="button" role="tab" data-t="learn">📖 익히기</button><button type="button" role="tab" data-t="mean">✅ 뜻 고르기</button><button type="button" role="tab" data-t="expr">🔎 말 고르기</button><button type="button" role="tab" data-t="pair">🧩 짝 맞추기</button><button type="button" role="tab" data-t="print">🖨️ 인쇄</button>
</div>
<div class="wd-bar"><h2 class="wd-h" id="wdTitle"></h2></div>
<section id="t-learn"><ol class="wd-learn" id="lnList"></ol></section>
<section id="t-quiz" hidden>
<p class="wd-note" id="qzNote"></p>
<ol class="wd-quiz" id="qzList"></ol>
<div class="wd-bar ctr"><span class="wd-lab" id="qzScore"></span><button type="button" class="wd-b" id="qzAgain">🔄 다시 풀기</button><button type="button" class="wd-b go" id="qzNext">다음 급 →</button></div>
</section>
<section id="t-print" hidden>
<div class="wd-bar"><button type="button" class="wd-b go" id="prSheet">🖨️ 이 급 학습지</button><button type="button" class="wd-b" id="prKey">🖨️ 이 급 정답</button><button type="button" class="wd-b" id="prBoth">🖨️ 학습지 + 정답</button><button type="button" class="wd-b" id="prAll">🖨️ 전체 급 학습지</button><button type="button" class="wd-b" id="prAllKey">🖨️ 전체 급 정답</button><button type="button" class="wd-b" id="prList">🖨️ 150개 한눈에 보기(뜻 포함)</button></div>
<div class="wd-view" id="prView"></div>
</section>
<p class="wd-note wd-credit">{CREDIT}</p>
<div id="wdOut" aria-hidden="true"></div>
<div class="creditbar"><a class="tolist" href="index.html">📋 자료 목록으로</a>{FOOT}</div>
</main>
<script>window.WD={DATA};
{APP}</script>
{HOMEFRAG}
</body></html>
