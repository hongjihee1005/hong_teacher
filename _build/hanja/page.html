<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{NAME} 한자 · 한자 급수 · 공통 · 초등교사 홍지희</title>
<meta name="description" content="한국어문회 한자능력검정 {NAME}: 한자 익히기, 쓰기 연습지, 모의 시험 20회">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500&family=Noto+Serif+JP:wght@500&family=Noto+Serif+TC:wght@500&display=block" rel="stylesheet">
<style>{CSS}</style>{HEADSNIP}
</head><body>
<main>
<h1>🖌️ {NAME} 한자</h1>
<p class="sub">{INTRO}</p>
<div class="hz-tabs" role="tablist">
<button type="button" role="tab" data-tab="learn" aria-selected="true">📖 한자 익히기</button>
<button type="button" role="tab" data-tab="sheet" aria-selected="false">✏️ 쓰기 연습지</button>
<button type="button" role="tab" data-tab="exam" aria-selected="false">📝 모의 시험 20회</button>
</div>
<section id="tLearn">
<div class="hz-det" id="hzDet" hidden></div>
<div class="hz-find"><input type="search" id="hzFind" placeholder="한자·뜻·소리로 찾기 (예: 집, 가)" aria-label="한자 찾기"><span class="hz-note" id="hzCount"></span></div>
<div class="hz-grid" id="hzGrid"></div>
</section>
<section id="tSheet" hidden>
<p class="hz-note">한 쪽에 8자씩이에요. 위 작은 칸의 획순(빨간 획이 이번에 쓰는 획)을 보고, 첫 칸은 보고 쓰고, 연한 칸은 덧쓰고, 빈 칸은 혼자 써요.</p>
<div class="hz-bar"><h2 id="shTitle"></h2><button type="button" class="hz-btn" id="shPrint">🖨️ 이 쪽 인쇄</button><button type="button" class="hz-btn" id="shAll">🖨️ 모든 쪽 인쇄</button></div>
<div class="hz-pages" id="shPages"></div>
<div id="shView"></div>
</section>
<section id="tExam" hidden>
<div id="exPick">
<p class="hz-note" id="exInfo"></p>
<div class="hz-elist" id="exList"></div>
</div>
<div id="exView" hidden>
<div class="hz-bar"><button type="button" class="hz-btn" id="exBack">← 시험 고르기</button><h2 id="exTitle"></h2></div>
<div class="hz-bar">
<button type="button" class="hz-btn go" id="exGrade">✅ 채점하기</button>
<button type="button" class="hz-btn" id="exKey" aria-pressed="false">🔑 정답 보기</button>
<button type="button" class="hz-btn" id="exReset">🔄 처음부터</button>
<button type="button" class="hz-btn" id="exPrint">🖨️ 시험지 인쇄</button>
<button type="button" class="hz-btn" id="exPrintKey">🖨️ 정답 인쇄</button>
</div>
<div class="hz-result" id="exResult" hidden></div>
<div class="hz-paper" id="exPaper"></div>
<div class="hz-bar" style="margin-top:14px"><button type="button" class="hz-btn go" id="exGrade2">✅ 채점하기</button><button type="button" class="hz-btn" id="exPrev">← 이전 회</button><button type="button" class="hz-btn" id="exNext">다음 회 →</button></div>
</div>
</section>
<div id="hzOut" aria-hidden="true"></div>
<p class="hz-note hz-credit">자료 출처: 배정한자·훈음 — 한국어문회 · 획순 — <a href="https://kanjivg.tagaini.net" target="_blank" rel="noopener">KanjiVG</a>(Ulrich Apel, CC BY-SA 3.0), <a href="https://github.com/chanind/hanzi-writer-data" target="_blank" rel="noopener">Hanzi Writer data</a>(Arphic Public License) · 한자어 — <a href="https://github.com/libhangul/libhangul" target="_blank" rel="noopener">libhangul</a>(BSD)</p>
<div class="creditbar"><a class="tolist" href="index.html">📋 자료 목록으로</a>{FOOT}</div>
</main>
<script>window.HZ={DATA};
{APP}</script>
{HOMEFRAG}
</body></html>
