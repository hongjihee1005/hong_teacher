<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{TITLE} · 수학 마술 · 수학게임 · 기타 · 초등교사 홍지희</title>
<meta name="description" content="{DESC}">
<style>{CSS}</style>{HEADSNIP}
</head><body>
<main>
<nav class="tl-gnav" aria-label="다른 마술">{GNAV}</nav>
<header class="tl-head"><span class="tl-ico" aria-hidden="true">{ICO}</span><div><h1>{TITLE}</h1><p class="tl-desc">{DESC}</p><p class="tl-rec">{REC}</p></div></header>
<section class="tl-stage" id="tlStage" aria-label="마술 해 보기">
<div class="tl-bar"><span class="tl-bt">🎩 마술 해 보기</span><span class="tl-sp"></span><button type="button" class="tl-btn" id="tlFull">⛶ 크게 보기</button></div>
<div class="tl-host" id="tlHost"></div>
</section>
<section class="tl-ideas mj-think" id="mjThink"><h2>🤔 비밀을 생각해 봐요</h2><ol>{THINK}</ol></section>
<details class="tl-how mj-secret"><summary>🔑 비밀 풀이 보기 (먼저 생각해 본 뒤 열어요)</summary>{SECRET}</details>
<section class="tl-ideas"><h2>🎭 친구에게 해 보기</h2><ol>{FRIEND}</ol><p class="tl-row"><button type="button" class="tl-btn" id="mjPrint">🖨️ 마술 카드 인쇄</button></p></section>
<nav class="mj-pn" aria-label="이전·다음 마술">{PN}</nav>
<div class="creditbar"><a class="tolist" href="index.html">📋 자료 목록으로</a>{FOOT}</div>
</main>
<div id="mjSheet">{SHEET}</div>
<script>{TRICK}
window.TOOL = function (host, api) { api.done = function () { document.getElementById('mjThink').classList.add('mj-lit') }; window.TRICK(host, api) };
document.getElementById('mjPrint').onclick = function () { document.documentElement.classList.add('mj-printing'); setTimeout(function () { window.print(); setTimeout(function () { document.documentElement.classList.remove('mj-printing') }, 500) }, 60) };
{SHELL}</script>
{HOMEFRAG}
</body></html>
