<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{G}학년 컬러링 · 쉬는 시간 · 초등교사 홍지희</title>
<meta name="description" content="{G}학년 쉬는 시간 컬러링 도안 50개">
<style>{CSS}</style>{HEADSNIP}
</head><body>
<main>
<section id="clPick">
<h1>{ICO} {G}학년 컬러링</h1>
<p class="sub">{INTRO}</p>
<ul class="cl-rules"><li>🎨 색을 고르고 칸을 누르면 색이 칠해져요</li><li>↩️ 잘못 칠하면 되돌리기</li><li>🖨️ 종이에 인쇄해서 색연필로 칠해도 좋아요</li></ul>
<p class="cl-prog" id="clProg"></p>
<div class="cl-list" id="clList"></div>
</section>
<section id="clPlay" hidden>
<div class="cl-bar"><button type="button" class="cl-btn" id="clBack">← 도안 고르기</button><h2 id="clTitle"></h2>
<button type="button" class="cl-btn" id="clPrev" aria-label="이전 도안">← 이전</button><button type="button" class="cl-btn" id="clNext" aria-label="다음 도안">다음 →</button></div>
<div class="cl-stage">
<div class="cl-art" id="clArt"></div>
<div class="cl-side">
<div class="cl-now"><span id="clSw"></span><b id="clName">빨강</b></div>
<div class="cl-pal" id="clPal" role="radiogroup" aria-label="색 고르기"></div>
<div class="cl-tools">
<button type="button" class="cl-btn" id="clUndo">↩️ 되돌리기</button>
<button type="button" class="cl-btn" id="clClear">🔄 처음부터</button>
<button type="button" class="cl-btn" id="clSave">💾 그림 저장</button>
<button type="button" class="cl-btn" id="clPrint">🖨️ 도안 인쇄</button>
</div>
<p class="cl-msg" id="clMsg" aria-live="polite"></p>
</div>
</div>
</section>
<div id="clSheet" aria-hidden="true"></div>
<div class="creditbar"><a class="tolist" href="index.html">📋 자료 목록으로</a>{FOOT}</div>
</main>
<script>{DESIGNS}
window.CL={DATA};
{APP}</script>
{HOMEFRAG}
</body></html>
