<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{G}학년 종이접기 · 쉬는 시간 · 초등교사 홍지희</title>
<meta name="description" content="{G}학년 쉬는 시간 종이접기 — {LIST}">
<style>{CSS}</style>{HEADSNIP}
</head><body>
<main>
<section id="ogPick">
<h1>{ICO} {G}학년 종이접기</h1>
<p class="sub">{INTRO}</p>
<ul class="og-rules">{RULES}</ul>
<details class="og-legend"><summary>접기 기호 알아보기</summary><div class="og-sym" id="ogSym"></div></details>
<div class="og-grid" id="ogGrid"></div>
</section>
<section id="ogView" hidden>
<div class="og-bar"><button type="button" class="og-btn" id="ogBack">← 작품 고르기</button><h2 id="ogName"></h2>
<button type="button" class="og-btn" id="ogAll" aria-expanded="false" aria-controls="ogSheet">🗂️ 한눈에 보기</button><button type="button" class="og-btn" id="ogPrint">🖨️ 인쇄</button></div>
<div class="og-stage">
<div class="og-fig" id="ogFig"></div>
<div class="og-side">
<p class="og-num" id="ogNum"></p>
<p class="og-txt" id="ogTxt" aria-live="polite"></p>
<div class="og-dots" id="ogDots"></div>
<div class="og-nav"><button type="button" id="ogPrev">← 이전</button><button type="button" id="ogNext" class="go">다음 단계 →</button></div>
<div class="og-done" id="ogDone" hidden><b>🎉 완성했어요!</b>친구에게 접는 방법을 알려 줄 수 있나요?<div><button type="button" class="og-btn" id="ogAgain">처음부터 다시</button><span id="ogOther"></span><button type="button" class="og-btn" id="ogBack2">작품 고르기</button></div></div>
<p class="og-tip" id="ogTip"></p>
</div>
</div>
<div id="ogSheet" hidden><h3 id="ogSheetT"></h3><div class="og-all" id="ogAllList"></div></div>
</section>
<div class="creditbar"><a class="tolist" href="index.html">📋 자료 목록으로</a>{FOOT}</div>
</main>
<script>{ENGINE}
window.OG_MODELS={DATA};
window.OG_LEGEND={LEGEND};
{APP}</script>
{HOMEFRAG}
</body></html>
