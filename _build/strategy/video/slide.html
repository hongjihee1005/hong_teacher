<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<style>
@font-face{font-family:P;font-weight:400;src:url(fonts/Pretendard-Regular.woff2)}
@font-face{font-family:P;font-weight:600;src:url(fonts/Pretendard-SemiBold.woff2)}
@font-face{font-family:P;font-weight:700;src:url(fonts/Pretendard-Bold.woff2)}
@font-face{font-family:P;font-weight:800;src:url(fonts/Pretendard-ExtraBold.woff2)}
:root{--acc:#E8913A;--accs:#FCEBDA;--ink:#2A221C;--soft:#5C5047;--bg:#FFFCF8;--line:#EADFD2}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);
 font-family:P,'Noto Color Emoji',sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased}
.em{font-family:'Noto Color Emoji',P,sans-serif}
#top{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;justify-content:space-between;padding:0 72px;
 background:#fff;border-bottom:2px solid var(--line)}
#brand{font-size:32px;font-weight:800;display:flex;gap:14px;align-items:center}
#brand b{background:var(--acc);color:#fff;border-radius:12px;padding:4px 14px;font-size:26px}
#chip{font-size:28px;font-weight:700;color:color-mix(in srgb,var(--acc) 75%,#000);background:var(--accs);border-radius:999px;padding:8px 24px}
#stage{position:absolute;left:96px;right:96px;top:140px;bottom:230px;display:flex;flex-direction:column;justify-content:center}
#cap{position:absolute;left:0;right:0;bottom:14px;height:190px;display:flex;align-items:center;justify-content:center;padding:0 140px}
#cap div{background:rgba(30,24,20,.86);color:#fff;font-size:44px;font-weight:600;line-height:1.45;border-radius:22px;padding:18px 40px;text-align:center;max-width:1640px;text-wrap:balance}
#bar{position:absolute;left:0;bottom:0;height:12px;background:var(--acc)}
h1{font-size:104px;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.2}
h2{font-size:64px;font-weight:800;margin:0 0 34px;letter-spacing:-.02em;display:flex;align-items:center;gap:22px}
h2 .n{background:var(--acc);color:#fff;border-radius:50%;width:86px;height:86px;display:grid;place-items:center;font-size:46px;flex:none}
.title{align-items:flex-start}
.title .ico{font-size:150px;line-height:1;margin-bottom:24px}
.title .en{font-size:48px;color:var(--soft);font-weight:600;margin-top:14px}
.title .who{display:inline-block;margin-top:40px;font-size:38px;font-weight:700;background:var(--acc);color:#fff;border-radius:16px;padding:10px 28px}
.title .one{font-size:42px;margin-top:26px;color:var(--soft);max-width:1500px;line-height:1.5}
.cards{display:grid;gap:36px}
.card{background:#fff;border:3px solid var(--line);border-top:16px solid var(--acc);border-radius:32px;padding:34px 38px;opacity:.18;transition:none}
.card.on{opacity:1}.card.cur{border-color:var(--acc);box-shadow:0 18px 40px -18px rgba(80,55,30,.35)}
.card .no{font-size:32px;font-weight:700;color:color-mix(in srgb,var(--acc) 80%,#000)}
.card .nm{font-size:62px;font-weight:800;margin:6px 0 12px}
.card .q{font-size:38px;font-weight:600;color:var(--soft);line-height:1.4}
.step .q{font-size:72px;font-weight:800;line-height:1.3;margin-bottom:40px}
.stems{display:grid;gap:22px}
.stem{font-size:50px;font-weight:600;background:#fff;border:3px dashed var(--line);border-radius:24px;padding:20px 32px;opacity:.15}
.stem.on{opacity:1}.stem.cur{border-color:var(--acc);border-style:solid}
.note{font-size:42px;line-height:1.55;color:var(--ink);background:#fff;border-left:12px solid var(--acc);border-radius:16px;padding:26px 34px;margin-top:10px}
.list{display:grid;gap:22px}
.li{font-size:46px;font-weight:600;line-height:1.45;display:flex;gap:22px;align-items:flex-start;background:#fff;border:3px solid var(--line);border-radius:24px;padding:22px 32px;opacity:.15}
.li.on{opacity:1}.li.cur{border-color:var(--acc)}
.li .k{flex:none;font-weight:800;color:color-mix(in srgb,var(--acc) 80%,#000);min-width:150px}
.li .ck{flex:none;width:46px;height:46px;border-radius:12px;border:5px solid var(--acc);margin-top:6px}
.li.on .ck{background:var(--acc)}
.para{font-size:50px;line-height:1.6;font-weight:600;background:#fff;border-radius:28px;padding:40px 48px;border:3px solid var(--line)}
.ex .label{display:inline-block;font-size:40px;font-weight:700;background:var(--accs);border-radius:16px;padding:10px 26px;margin-bottom:28px}
.end{align-items:center;text-align:center}
.end .big{font-size:80px;font-weight:800;line-height:1.35}
.end .src{font-size:30px;color:var(--soft);margin-top:48px;line-height:1.6}
</style></head><body>
<div id="top"><div id="brand"></div><div id="chip"></div></div>
<div id="stage"></div>
<div id="cap"><div></div></div>
<div id="bar"></div>
<script>
const E = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function show(s){
  document.documentElement.style.setProperty('--acc', s.acc); document.documentElement.style.setProperty('--accs', s.accs);
  document.getElementById('brand').innerHTML = s.brand;
  document.getElementById('chip').textContent = s.chip;
  document.getElementById('bar').style.width = (s.prog * 100) + '%';
  const cap = document.querySelector('#cap div'); cap.textContent = s.cap || ''; cap.parentNode.style.visibility = s.cap ? 'visible' : 'hidden';
  const st = document.getElementById('stage'); st.className = s.t; let h = '';
  if (s.t === 'title') h = `<div class="ico em">${s.ico}</div><h1>${E(s.ko)}</h1><div class="en">${E(s.en)}</div><div class="one">${E(s.one)}</div><div class="who">${E(s.who)}</div>`;
  else if (s.t === 'cards') h = `<h2>${E(s.h)}</h2><div class="cards" style="grid-template-columns:repeat(${s.items.length},1fr)">` + s.items.map((c, i) =>
      `<div class="card${i < s.on ? ' on' : ''}${i === s.on - 1 ? ' cur' : ''}"><div class="no">${i + 1}단계</div><div class="nm">${E(c[0])}</div><div class="q">${E(c[1])}</div></div>`).join('') + '</div>';
  else if (s.t === 'step') h = `<h2><span class="n">${s.no}</span>${E(s.h)}</h2><div class="q">“${E(s.q)}”</div>` +
      (s.stems ? '<div class="stems">' + s.stems.map((x, i) => `<div class="stem${i < s.on ? ' on' : ''}${i === s.on - 1 ? ' cur' : ''}"><span class="em">💬</span> ${E(x)}</div>`).join('') + '</div>' : '') +
      (s.note ? `<div class="note">${E(s.note)}</div>` : '');
  else if (s.t === 'list') h = `<h2><span class="em">${s.ico || ''}</span>${E(s.h)}</h2><div class="list">` + s.items.map((x, i) => {
      const k = Array.isArray(x) ? `<span class="k">${E(x[0])}</span><span>${E(x[1])}</span>` : `<span>${E(x)}</span>`;
      return `<div class="li${i < s.on ? ' on' : ''}${i === s.on - 1 ? ' cur' : ''}">${s.check ? '<span class="ck"></span>' : ''}${k}</div>`; }).join('') + '</div>';
  else if (s.t === 'para') h = `<h2><span class="em">${s.ico || ''}</span>${E(s.h)}</h2><div class="para">${E(s.text)}</div>`;
  else if (s.t === 'ex') h = `<h2><span class="em">📝</span>${E(s.h)}</h2>` + (s.label ? `<div><span class="label">${E(s.label)}</span></div>` : '') +
      '<div class="list">' + s.items.map((x, i) => `<div class="li${i < s.on ? ' on' : ''}${i === s.on - 1 ? ' cur' : ''}"><span class="k">${E(x[0])}</span><span>${E(x[1])}</span></div>`).join('') + '</div>';
  else if (s.t === 'end') h = `<div class="big">${s.big}</div><div class="src">${s.src}</div>`;
  st.innerHTML = h;
  // 넘치면 글자를 줄여 맞춤
  let z = 1; st.style.zoom = 1;
  while (st.scrollHeight > st.clientHeight + 2 && z > .55) { z -= .04; st.style.zoom = z; }
}
</script></body></html>
