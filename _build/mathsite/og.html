<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>html,body{margin:0}body{width:1200px;height:630px;background:#FFF8F0;font-family:'Pretendard Variable',sans-serif;display:flex;flex-direction:column;justify-content:center;padding:0 90px;box-sizing:border-box;color:#2B2522}
.t{font-size:104px;font-weight:800;letter-spacing:-.02em}.s{font-size:40px;color:#6B5F56;margin-top:22px;font-weight:500}
.chips{display:flex;gap:12px;margin-top:46px;flex-wrap:wrap}.c{font-size:27px;font-weight:700;padding:10px 20px;border-radius:999px;background:#fff;border:3px solid var(--a);color:var(--a)}
.by{position:absolute;right:90px;bottom:60px;font-size:34px;font-weight:700;color:#B4610F}
.bar{position:absolute;left:0;top:0;width:100%;height:18px;background:linear-gradient(90deg,#F2C46D,#C9DDA0,#9BD3C2,#A9D2EE,#C9B6EA,#F2B5C8)}</style></head>
<body><div class="bar"></div><div class="t">초등 수학 게임</div><div class="s">생각하는 힘을 기르는 퍼즐 · 1~6학년 계산 게임</div>
<div class="chips"><span class="c" style="--a:#C2571A">마방진</span><span class="c" style="--a:#2F74E0">칠교놀이</span><span class="c" style="--a:#1F8060">계산 스도쿠</span><span class="c" style="--a:#7B4FB0">하노이 탑</span><span class="c" style="--a:#C9463B">네모 로직</span><span class="c" style="--a:#E8663D">교과수학</span></div>
<div class="by">초등교사 홍지희</div></body></html>
