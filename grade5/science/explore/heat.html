<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>탐구 실험관 · 열과 우리 생활 · 5학년 과학 · 초등교사 홍지희</title>
<meta name="description" content="5학년 2학기 과학 3단원 열과 우리 생활: 여러 가지 온도계로 온도 재기, 온도가 다른 두 물체의 접촉, 구리판·물·공기에서 열의 이동, 햇빛과 검은색 판의 온도를 한 단계씩 직접 해 보는 탐구 실험관">
<style>
/* 탐구 실험관 · 생물의 한살이 — 실물 실험대(시안 1) 디자인. 색 변수는 공통 덮개와 겹치지 않게 --lb-·--w- 앞글자 */
:root{
 --lb-bg:#F6F5F1;--lb-paper:#FFFFFF;--lb-ink:#141A26;--lb-sub:#4B5465;--lb-line:#E3E0D8;--lb-line2:#C9C3B6;
 --lb-navy:#0F1C33;--lb-navy2:#1B2A45;--lb-onnavy:#E9EEF6;--lb-onnavy2:#B4C0D3;

 --lb-onab:#FFFFFF;--lb-a:#2F68B0;--lb-a-soft:#E7EFF9;--lb-a-ink:#24548F;
 --lb-b:#A9541A;--lb-b-soft:#F9ECE1;--lb-b-ink:#8C4514;

 --lb-why:#EEF5F1;--lb-bad:#B3261E;--lb-bad-soft:#FBE9E7;
 --lb-shadow:0 1px 2px rgba(20,26,38,.06),0 6px 20px rgba(20,26,38,.07);
 --w-wall:#F2ECE1;--w-wall2:#ECE4D6;--w-rail:#E2D8C6;--w-top:#DDBF92;--w-edge:#C9A574;--w-front:#B98E5E;--w-grain:#A97E50;
 --w-win:#C8A77A;--w-sky1:#CFE6F3;--w-sky2:#EEF6FA;--w-glass:rgba(214,232,242,.42);--w-glass-s:#7F9BAB;--w-rim:#93ADBB;
 --w-felt:#F4F0E6;--w-felt-s:#BDB4A2;--w-feltw:#C9DEEA;--w-feltw-s:#8FB3C6;--w-water:#8DC8E8;--w-water-s:#5E9CC0;
 --w-seed:#7A4A2C;--w-seed2:#9B6644;--w-hl:#C99A72;--w-root:#F3EFDF;--w-leaf:#8BC45A;--w-leaf2:#6DB04A;--w-leafs:#3F7A27;
 --w-paper:#FFFDF8;--w-kraft:#E7D3AC;--w-kraft-s:#B99E6E;--w-shadow:rgba(60,40,20,.14);--w-label:#FFFFFF;--w-labeltx:#141A26;
 --w-box:#8A6239;--w-box2:#6E4D2C;--w-boxtx:#FFF7EA;--w-fr:#EEF3F6;--w-fr2:#DCE8F0;--w-fr-s:#90A6B4;
 --w-pot:#C7764B;--w-pot2:#A95E37;--w-soil:#6B4A33;--w-soilw:#4B3221;--w-soild:#9C7B5E;--w-shade:#FAFBFC;--w-shade-s:#A9B4BE;
 --w-lens:#FFFFFF;--w-lens-s:#2A3342;
 color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --lb-bg:#0E131B;--lb-paper:#161D28;--lb-ink:#E8ECF2;--lb-sub:#AEB8C7;--lb-line:#2A3342;--lb-line2:#455064;
 --lb-navy:#0A1322;--lb-navy2:#1B2A42;--lb-onnavy:#E9EEF6;--lb-onnavy2:#AAB6CA;
 --lb-sci:#5CC499;--lb-sci-ink:#7BD6AE;--lb-sci-soft:#15302A;--lb-onsci:#06231A;
 --lb-onab:#0B1320;--lb-a:#7DB0F0;--lb-a-soft:#18273D;--lb-a-ink:#A4C8F5;
 --lb-b:#F0A26A;--lb-b-soft:#33231A;--lb-b-ink:#F4B88C;
 --lb-warn:#2F2614;--lb-warn-ink:#F2C677;--lb-warn-line:#5A4720;--lb-why:#14261F;--lb-bad:#FF9C92;--lb-bad-soft:#3A1E1C;
 --lb-shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
 --w-wall:#202833;--w-wall2:#1C232D;--w-rail:#2A3340;--w-top:#6E5638;--w-edge:#5B462D;--w-front:#4A3925;--w-grain:#3E2F1F;
 --w-win:#5B4A35;--w-sky1:#2B4258;--w-sky2:#3A5670;--w-glass:rgba(160,190,210,.18);--w-glass-s:#7C98AA;--w-rim:#8AA4B4;

 --w-pot:#A9643F;--w-pot2:#8A4F30;--w-soil:#5A3E2B;--w-soilw:#3B271A;--w-soild:#8A6D52;--w-shade:#D9DEE3;--w-shade-s:#8A96A1;
 --w-lens:#1E2632;--w-lens-s:#C9D3E3;
 color-scheme:dark}}
:root[data-theme="dark"]{
 --lb-bg:#0E131B;--lb-paper:#161D28;--lb-ink:#E8ECF2;--lb-sub:#AEB8C7;--lb-line:#2A3342;--lb-line2:#455064;
 --lb-navy:#0A1322;--lb-navy2:#1B2A42;--lb-onnavy:#E9EEF6;--lb-onnavy2:#AAB6CA;
 --lb-sci:#5CC499;--lb-sci-ink:#7BD6AE;--lb-sci-soft:#15302A;--lb-onsci:#06231A;
 --lb-onab:#0B1320;--lb-a:#7DB0F0;--lb-a-soft:#18273D;--lb-a-ink:#A4C8F5;
 --lb-b:#F0A26A;--lb-b-soft:#33231A;--lb-b-ink:#F4B88C;
 --lb-warn:#2F2614;--lb-warn-ink:#F2C677;--lb-warn-line:#5A4720;--lb-why:#14261F;--lb-bad:#FF9C92;--lb-bad-soft:#3A1E1C;
 --lb-shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
 --w-wall:#202833;--w-wall2:#1C232D;--w-rail:#2A3340;--w-top:#6E5638;--w-edge:#5B462D;--w-front:#4A3925;--w-grain:#3E2F1F;
 --w-win:#5B4A35;--w-sky1:#2B4258;--w-sky2:#3A5670;--w-glass:rgba(160,190,210,.18);--w-glass-s:#7C98AA;--w-rim:#8AA4B4;
 --w-felt:#E6E2D8;--w-felt-s:#ABA394;--w-feltw:#B9D4E2;--w-feltw-s:#8FB3C6;--w-water:#5E9CC0;--w-water-s:#8CC0DD;
 --w-paper:#EDE8DC;--w-kraft:#BFA57A;--w-kraft-s:#9C845C;--w-shadow:rgba(0,0,0,.35);--w-label:#1E2632;--w-labeltx:#E8ECF2;
 --w-box:#6E4D2C;--w-box2:#583C21;--w-boxtx:#FFF2DD;--w-fr:#C9D3DA;--w-fr2:#AFC0CC;--w-fr-s:#7F95A4;
 --w-pot:#A9643F;--w-pot2:#8A4F30;--w-soil:#5A3E2B;--w-soilw:#3B271A;--w-soild:#8A6D52;--w-shade:#D9DEE3;--w-shade-s:#8A96A1;
 --w-lens:#1E2632;--w-lens-s:#C9D3E3;

/* 글자 크기: 1280×800 → 16.5px, 1920×1080 → 21px */
html{font-size:clamp(14px,min(calc(.82vw + 6px),calc(1.6vh + 4px)),22px)}
html.lb-big{font-size:clamp(15px,min(calc(.92vw + 6.5px),calc(1.78vh + 4.5px)),25px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--lb-bg)}
body{color:var(--lb-ink);font-family:Pretendard,"Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:break-word;line-height:1.45;-webkit-font-smoothing:antialiased}
.lb-app button{font:inherit;color:inherit;cursor:pointer}
.lb-app button:disabled{cursor:not-allowed}
.lb-app :is(button,a,input):focus-visible{outline:3px solid var(--lb-sci);outline-offset:2px}
.lb-ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lb-sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#hj-player{display:none!important}

/* 앱 틀 */
.lb-app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.lb-bar{display:flex;align-items:center;gap:.6rem;height:3.5rem;padding:0 1rem;background:var(--lb-navy);color:var(--lb-onnavy);position:relative;z-index:30}
.lb-bar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--lb-sci)}
.lb-hb{display:inline-flex;align-items:center;gap:.4rem;height:2.25rem;padding:0 .85rem;border-radius:999px;background:var(--lb-navy2);color:var(--lb-onnavy);text-decoration:none;font-size:.88rem;font-weight:600;border:1px solid rgba(255,255,255,.14);white-space:nowrap}
.lb-hb:hover{background:#26385A}
html.hj-hasnav .lb-own{display:none!important}
html body .lb-bar .hj-nav{margin:0!important}
html body .lb-bar .hj-nav a{background:var(--lb-navy2)!important;border:1px solid rgba(255,255,255,.14)!important;color:var(--lb-onnavy)!important;box-shadow:none!important}
html body .lb-bar .hj-nav a:hover{background:#26385A!important}
.lb-ttl{display:flex;align-items:baseline;gap:.7rem;margin-left:.4rem;min-width:0}
.lb-ttl b{font-size:1.12rem;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.lb-ttl span{font-size:.9rem;color:var(--lb-onnavy2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-bar-r{margin-left:auto;display:flex;gap:.5rem;align-items:center;position:relative}
.lb-hb[aria-expanded="true"]{background:var(--lb-onnavy);color:var(--lb-navy)}
.lb-menu{position:absolute;right:0;top:calc(100% + .5rem);width:17rem;background:var(--lb-paper);color:var(--lb-ink);border:1px solid var(--lb-line);border-radius:1rem;box-shadow:0 12px 36px rgba(0,0,0,.22);padding:.5rem;z-index:40;display:flex;flex-direction:column;gap:.15rem}
.lb-menu[hidden]{display:none}
.lb-menu h2{font-size:.78rem;color:var(--lb-sub);margin:.35rem .6rem .25rem;font-weight:700}
.lb-mi{display:flex;align-items:center;gap:.6rem;width:100%;min-height:2.6rem;padding:.4rem .7rem;border:0;border-radius:.65rem;background:none;text-align:left;font-size:.92rem;font-weight:600}
.lb-mi:hover{background:var(--lb-bg)}
.lb-mi .lb-sw{display:block!important;margin-left:auto;width:2.4rem;height:1.4rem;border-radius:999px;background:var(--lb-line2);position:relative;flex:none;transition:background .2s}
.lb-mi .lb-sw::after{content:"";position:absolute;left:.18rem;top:.18rem;width:1.04rem;height:1.04rem;border-radius:50%;background:#fff;transition:transform .2s}
.lb-mi[aria-pressed="true"] .lb-sw{background:var(--lb-sci)}
.lb-mi[aria-pressed="true"] .lb-sw::after{transform:translateX(1rem)}
.lb-mi.lb-danger{color:var(--lb-bad)}

/* 진행 화면 */
.lb-run{display:grid;grid-template-columns:15rem minmax(0,1fr);min-height:0}
.lb-rail{background:var(--lb-paper);border-right:1px solid var(--lb-line);padding:.9rem .7rem .8rem;overflow:auto;display:flex;flex-direction:column;min-height:0}
.lb-rail h2{font-size:.9rem;font-weight:800;color:var(--lb-ink);margin:0 .5rem .2rem;line-height:1.35;text-wrap:balance}
.lb-rk{margin:.1rem .5rem 0;font-size:.74rem;font-weight:700;color:var(--lb-sci-ink)}
.lb-rwrap{display:flex;flex-direction:column;min-height:100%}
.lb-rail .lb-rq{font-size:.78rem;color:var(--lb-sub);margin:.15rem .5rem .3rem;line-height:1.4}
.lb-grp{font-size:.72rem;font-weight:700;color:var(--lb-sub);margin:.4rem .55rem .1rem;display:flex;align-items:center;gap:.4rem}
.lb-grp::after{content:"";flex:1;height:1px;background:var(--lb-line)}
.lb-rs{display:flex;align-items:center;gap:.55rem;width:100%;border:0;background:none;text-align:left;padding:.22rem .5rem;border-radius:.6rem;font-size:.86rem;color:var(--lb-ink);min-height:2rem;line-height:1.25}
.lb-rs:not(:disabled):hover{background:var(--lb-bg)}
.lb-rs i{width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.74rem;font-weight:700;border:1.5px solid var(--lb-line2);color:var(--lb-sub);flex:none}
.lb-rs i .lb-ic{width:.9rem;height:.9rem;stroke-width:3}
.lb-rs.lb-done i{background:var(--lb-sci-soft);border-color:transparent;color:var(--lb-sci-ink)}
.lb-rs.lb-now{background:var(--lb-sci-soft);font-weight:700}
.lb-rs.lb-now i{background:var(--lb-sci);border-color:var(--lb-sci);color:var(--lb-onsci)}
.lb-rs:disabled{color:var(--lb-sub);opacity:1}
.lb-rs small{margin-left:auto;font-size:.72rem;color:var(--lb-sci-ink);font-weight:700;white-space:nowrap}
.lb-rail-note{margin-top:auto;padding:.7rem .55rem 0;font-size:.74rem;color:var(--lb-sub);line-height:1.5;border-top:1px solid var(--lb-line)}
.lb-rail-note p{margin:0 0 .35rem}
.lb-mtop{display:none}

.lb-stage{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;min-width:0}
.lb-head{display:flex;align-items:flex-end;gap:1rem;padding:.85rem 1.5rem .6rem}
.lb-kick{display:inline-flex;align-items:center;gap:.45rem;font-size:.82rem;font-weight:700;color:var(--lb-sci-ink)}
.lb-kick em{font-style:normal;background:var(--lb-sci);color:var(--lb-onsci);border-radius:.4rem;padding:.08rem .45rem;font-size:.76rem}
.lb-head h1{margin:.2rem 0 0;font-size:1.6rem;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.lb-say{margin-left:auto;display:inline-flex;align-items:center;gap:.4rem;height:2.3rem;padding:0 .85rem;border-radius:999px;border:1.5px solid var(--lb-line2);background:var(--lb-paper);font-size:.85rem;font-weight:600;color:var(--lb-sub);flex:none}
.lb-say[aria-pressed="true"]{border-color:var(--lb-sci);color:var(--lb-sci-ink);background:var(--lb-sci-soft)}

.lb-body{display:flex;gap:1rem;padding:0 1.5rem;min-height:0}
.lb-col{flex:1;display:flex;flex-direction:column;gap:.65rem;min-width:0;min-height:0}
.lb-scene{position:relative;flex:1;min-height:0;border-radius:1.1rem;overflow:hidden;background:var(--w-wall);box-shadow:var(--lb-shadow);border:1px solid var(--lb-line)}
.lb-scene>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}
.lb-notes{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
.lb-note{display:flex;gap:.6rem;align-items:flex-start;border-radius:.85rem;padding:.6rem .85rem;font-size:.95rem;line-height:1.4}
.lb-note b{display:block;font-size:.76rem;letter-spacing:.02em;margin-bottom:.1rem}
.lb-note .lb-ic{margin-top:.15rem;width:1.3em;height:1.3em}
.lb-why{background:var(--lb-why);border:1px solid color-mix(in srgb,var(--lb-sci) 24%,transparent)}
.lb-why b,.lb-why .lb-ic{color:var(--lb-sci-ink)}
.lb-care{background:var(--lb-warn);border:1px solid var(--lb-warn-line)}
.lb-care b,.lb-care .lb-ic{color:var(--lb-warn-ink)}
.lb-know{background:var(--lb-paper);border:1px solid var(--lb-line)}
.lb-know b,.lb-know .lb-ic{color:var(--lb-a-ink)}

.lb-replay{position:absolute;left:.75rem;top:.75rem;z-index:3;display:inline-flex;align-items:center;gap:.35rem;height:2.2rem;padding:0 .8rem;border-radius:999px;border:1px solid var(--lb-line2);background:var(--lb-paper);font-size:.82rem;font-weight:700;color:var(--lb-ink)}
.lb-days{position:absolute;left:.75rem;right:.75rem;top:.7rem;z-index:3;display:flex;gap:.35rem;flex-wrap:wrap;justify-content:center;pointer-events:none}
.lb-day{display:inline-flex;align-items:center;gap:.25rem;height:2rem;padding:0 .7rem;border-radius:999px;font-size:.82rem;font-weight:700;background:var(--lb-paper);color:var(--lb-sub);border:1.5px solid var(--lb-line2)}
.lb-day.lb-rec{color:var(--lb-sci-ink);border-color:color-mix(in srgb,var(--lb-sci) 45%,transparent);background:var(--lb-sci-soft)}
.lb-day.lb-today{background:var(--lb-sci);color:var(--lb-onsci);border-color:var(--lb-sci)}
.lb-day .lb-ic{width:.85rem;height:.85rem;stroke-width:3}
.lb-toast{position:absolute;left:50%;bottom:.8rem;transform:translateX(-50%);z-index:4;background:var(--lb-navy);color:var(--lb-onnavy);padding:.45rem 1rem;border-radius:999px;font-size:.88rem;font-weight:700;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.lb-hit{cursor:pointer}
.lb-hit:focus{outline:none}
.lb-hit:focus-visible .lb-hitc{stroke:var(--lb-sci);stroke-width:3}

/* 오른쪽 기록 카드 */
.lb-card{width:21.5rem;flex:none;background:var(--lb-paper);border-radius:1.1rem;box-shadow:var(--lb-shadow);border:1px solid var(--lb-line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.lb-card[hidden]{display:none}
.lb-card-h{padding:.65rem 1rem .55rem;border-bottom:1px solid var(--lb-line);display:flex;align-items:center;gap:.6rem}
.lb-clip{width:2.1rem;height:2.1rem;border-radius:.6rem;background:var(--lb-sci-soft);color:var(--lb-sci-ink);display:flex;align-items:center;justify-content:center;flex:none}.lb-clip .lb-ic{width:1.2rem;height:1.2rem}
.lb-card-h b{font-size:1.02rem;display:block}
.lb-card-h span{display:block;font-size:.78rem;color:var(--lb-sub)}
.lb-card-b{padding:.7rem 1rem .8rem;overflow:auto;min-height:0}
.lb-fit{display:flex;flex-direction:column;gap:.55rem}
.lb-q{font-size:.98rem;font-weight:700;margin:0}
.lb-hint{font-size:.8rem;color:var(--lb-sub);margin:-.35rem 0 0}

/* 계획: 조건 줄 */
.lb-crow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.25rem .5rem;padding:.4rem 0;border-bottom:1px dashed var(--lb-line)}
.lb-crow:last-of-type{border-bottom:0}
.lb-crow>span{font-size:.9rem;font-weight:600;display:flex;align-items:center;gap:.45rem}
.lb-crow>span .lb-ic{color:var(--lb-sub)}
.lb-crow>p{grid-column:1/3;margin:0;font-size:.78rem;font-weight:600;display:flex;gap:.3rem;align-items:flex-start}
.lb-crow>p .lb-ic{width:1rem;height:1rem;margin-top:.1rem}
.lb-crow.lb-ok>p{color:var(--lb-sci-ink)}
.lb-crow.lb-no>p{color:var(--lb-bad)}
.lb-crow.lb-no{background:var(--lb-bad-soft);border-radius:.5rem;padding:.4rem .4rem;border-bottom-color:transparent}
.lb-seg{display:inline-flex;border:1.5px solid var(--lb-line2);border-radius:.6rem;overflow:hidden}
.lb-seg button{border:0;background:var(--lb-paper);padding:0 .7rem;height:2.3rem;font-size:.84rem;font-weight:700;color:var(--lb-sub);min-width:3.8rem}
.lb-seg button+button{border-left:1.5px solid var(--lb-line2)}
.lb-seg button[aria-pressed="true"].lb-d{background:var(--lb-b);color:var(--lb-onab)}
.lb-seg button[aria-pressed="true"].lb-s{background:var(--lb-sci);color:var(--lb-onsci)}
.lb-msg{border-radius:.8rem;padding:.6rem .8rem;font-size:.88rem;display:flex;gap:.5rem;align-items:flex-start;line-height:1.4}
.lb-msg .lb-ic{margin-top:.12rem}
.lb-msg.lb-good{background:var(--lb-sci-soft);color:var(--lb-ink)}
.lb-msg.lb-good .lb-ic{color:var(--lb-sci-ink)}
.lb-msg.lb-try{background:var(--lb-bad-soft);color:var(--lb-ink)}
.lb-msg.lb-try .lb-ic{color:var(--lb-bad)}
.lb-msg.lb-plain{background:var(--lb-bg);color:var(--lb-ink)}

/* 예상 */
.lb-opts{display:flex;flex-direction:column;gap:.45rem}
.lb-opt{display:flex;align-items:center;gap:.6rem;width:100%;min-height:2.9rem;padding:.45rem .75rem;border-radius:.75rem;border:1.5px solid var(--lb-line2);background:var(--lb-paper);text-align:left;font-size:.9rem;font-weight:600}
.lb-opt i{font-style:normal;width:1.4rem;height:1.4rem;border-radius:50%;border:1.5px solid var(--lb-line2);flex:none;display:grid;place-items:center}
.lb-opt[aria-pressed="true"]{border-color:var(--lb-sci);background:var(--lb-sci-soft);box-shadow:inset 0 0 0 1px var(--lb-sci)}
.lb-opt[aria-pressed="true"] i{background:var(--lb-sci);border-color:var(--lb-sci);color:var(--lb-onsci)}
.lb-opt i .lb-ic{width:.85rem;height:.85rem;stroke-width:3}
.lb-label{font-size:.82rem;font-weight:700;color:var(--lb-sub);display:block;margin-bottom:.3rem}
.lb-input{width:100%;min-height:2.6rem;border-radius:.7rem;border:1.5px solid var(--lb-line2);background:var(--lb-paper);color:var(--lb-ink);font:inherit;font-size:.9rem;padding:.45rem .75rem}
.lb-input::placeholder{color:var(--lb-sub);opacity:1}

/* 관찰 */
.lb-todo{display:flex;flex-wrap:wrap;gap:.3rem;margin:0;padding:0;list-style:none}
.lb-todo li{border-radius:999px!important;display:flex;align-items:center;gap:.35rem;font-size:.78rem;padding:.2rem .5rem .2rem .25rem;border-radius:.65rem;background:var(--lb-bg)}
.lb-todo li i{font-style:normal;width:1.25rem;height:1.25rem;border-radius:50%;display:grid;place-items:center;font-size:.74rem;font-weight:800;border:1.5px solid var(--lb-line2);color:var(--lb-sub);flex:none}
.lb-todo li i .lb-ic{width:.85rem;height:.85rem;stroke-width:3}
.lb-todo li.lb-ok i{background:var(--lb-sci);border-color:var(--lb-sci);color:var(--lb-onsci)}
.lb-todo li.lb-ok{color:var(--lb-sub)}
.lb-todo li.lb-cur{background:var(--lb-sci-soft);font-weight:700}
.lb-todo li.lb-cur i{border-color:var(--lb-sci);color:var(--lb-sci-ink)}
.lb-count{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.3rem .6rem;padding:.4rem .6rem;border-radius:.8rem}
.lb-count.lb-a{background:var(--lb-a-soft)} .lb-count.lb-b{background:var(--lb-b-soft)}
.lb-pin{font-style:normal;width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;color:var(--lb-onab);font-weight:800;font-size:.8rem;flex:none}
.lb-a>.lb-pin,.lb-pin.lb-a{background:var(--lb-a)} .lb-b>.lb-pin,.lb-pin.lb-b{background:var(--lb-b)}
.lb-count>span{font-size:.86rem;font-weight:600}
.lb-step{display:inline-flex;align-items:center;border:1.5px solid var(--lb-line2);border-radius:.65rem;background:var(--lb-paper);overflow:hidden}
.lb-step button{border:0;background:none;width:2.6rem;height:2.45rem;display:grid;place-items:center;color:var(--lb-ink)}
.lb-step button:disabled{color:var(--lb-line2)}
.lb-step output{min-width:2.2rem;text-align:center;font-size:1.2rem;font-weight:800}
.lb-looks{grid-column:1/4;display:flex;gap:.35rem}
.lb-look{flex:1;min-height:2.3rem;padding:.25rem .3rem;border-radius:.6rem;border:1.5px solid var(--lb-line2);background:var(--lb-paper);font-size:.78rem;white-space:nowrap;font-weight:700;line-height:1.25}
.lb-look[aria-pressed="true"]{border-color:var(--lb-sci);background:var(--lb-sci);color:var(--lb-onsci)}
.lb-rec-btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:2.7rem;border-radius:.75rem;border:2px solid var(--lb-sci);background:var(--lb-paper);color:var(--lb-sci-ink);font-weight:800;font-size:.95rem}
.lb-rec-btn:disabled{border-color:var(--lb-line);color:var(--lb-sub);background:var(--lb-bg)}
.lb-tbl{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:.8rem;text-align:center}
.lb-tbl th,.lb-tbl td{padding:.28rem .1rem;border-bottom:1px solid var(--lb-line)}
.lb-tbl th{font-weight:700;color:var(--lb-sub);font-size:.74rem}
.lb-tbl td:first-child,.lb-tbl th:first-child{text-align:left;padding-left:.2rem;white-space:nowrap}
.lb-tbl td.lb-now{background:var(--lb-sci-soft);font-weight:800}
.lb-tbl th.lb-now{color:var(--lb-sci-ink)}
.lb-tbl .lb-na{color:var(--lb-sub)}
.lb-dot{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;margin-right:.3rem;vertical-align:.05rem}
.lb-dot.lb-a{background:var(--lb-a)} .lb-dot.lb-b{background:var(--lb-b)}

/* 결론 */
.lb-mine{font-size:.82rem;color:var(--lb-sub);background:var(--lb-bg);border-radius:.65rem;padding:.45rem .65rem;line-height:1.4}
.lb-mine b{color:var(--lb-ink)}
.lb-frame{font-size:1rem;line-height:2.35;margin:0}
.lb-blank{display:inline-flex;align-items:center;justify-content:center;min-width:5.2rem;height:2.15rem;line-height:1;padding:0 .6rem;margin:0 .12rem;border-radius:.55rem;border:1.5px dashed var(--lb-line2);vertical-align:middle;font-weight:800;background:var(--lb-paper);color:var(--lb-ink)}
.lb-blank.lb-fill{border-style:solid;border-color:var(--lb-sci);background:var(--lb-sci-soft);color:var(--lb-sci-ink)}
.lb-blank.lb-focus{border-style:solid;border-color:var(--lb-ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--lb-ink) 18%,transparent)}
.lb-blank.lb-wrong{border-color:var(--lb-bad);background:var(--lb-bad-soft);color:var(--lb-bad)}
.lb-chips{display:flex;flex-wrap:wrap;gap:.4rem}
.lb-chip{display:inline-flex;align-items:center;min-height:2.5rem;padding:.25rem .9rem;border-radius:.7rem;border:1.5px solid var(--lb-line2);background:var(--lb-paper);font-size:.92rem;font-weight:700}
.lb-chip:hover{border-color:var(--lb-sci)}
.lb-cmp{border-radius:.85rem;background:var(--lb-sci-soft);padding:.6rem .8rem;font-size:.9rem}
.lb-cmp b{display:flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--lb-sci-ink);margin-bottom:.15rem}

/* 아래 막대 */
.lb-foot{display:flex;align-items:center;gap:1rem;padding:.65rem 1.5rem .9rem}
.lb-btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;height:3rem;padding:0 1.25rem;border-radius:.85rem;font-weight:700;font-size:1rem;border:1.5px solid var(--lb-line2);background:var(--lb-paper);color:var(--lb-ink);text-decoration:none;white-space:nowrap}
.lb-btn:disabled{color:var(--lb-sub);background:var(--lb-bg)}
.lb-btn.lb-pri{background:var(--lb-sci);border-color:var(--lb-sci);color:var(--lb-onsci);min-width:11rem;box-shadow:0 4px 12px color-mix(in srgb,var(--lb-sci) 30%,transparent)}
.lb-btn.lb-pri:disabled{background:var(--lb-line);border-color:var(--lb-line);color:var(--lb-sub);box-shadow:none}
.lb-fmid{flex:1;display:flex;align-items:center;justify-content:center;gap:.7rem;font-size:.9rem;color:var(--lb-sub);min-width:0;text-align:center}
.lb-fmid b{color:var(--lb-ink)}
.lb-prog{display:flex;gap:.3rem;align-items:center}
.lb-prog i{width:.55rem;height:.55rem;border-radius:50%;background:var(--lb-line2)}
.lb-prog i.lb-d{background:var(--lb-sci)} .lb-prog i.lb-n{width:1.4rem;border-radius:999px;background:var(--lb-sci)}
.lb-doit{position:relative;display:inline-flex;align-items:center;gap:.5rem;height:3rem;padding:0 1.2rem 0 1rem;border-radius:.85rem;border:2px solid var(--lb-sci);background:var(--lb-sci-soft);color:var(--lb-sci-ink);font-weight:800;font-size:1rem;white-space:nowrap}
.lb-doit .lb-ic{width:1.3em;height:1.3em}
.lb-doit:not(:disabled)::before{content:"";position:absolute;inset:-2px;border-radius:.85rem;animation:lb-ping 2s ease-out infinite;pointer-events:none}
.lb-doit:disabled{border-color:var(--lb-line);background:var(--lb-bg);color:var(--lb-sub)}
@keyframes lb-ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--lb-sci) 45%,transparent)}80%,100%{box-shadow:0 0 0 9px transparent}}

/* 실험 고르기 */
.lb-homewrap{overflow:auto;min-height:0}
.lb-home{padding:1.4rem 2.5rem 1rem;display:flex;flex-direction:column;gap:1rem;max-width:84rem;margin:0 auto}
.lb-home-h h1{margin:.15rem 0 0;font-size:2rem;letter-spacing:-.025em;font-weight:800}
.lb-home-h p{margin:.3rem 0 0;font-size:1.02rem;color:var(--lb-sub)}
.lb-ex{display:grid;grid-template-columns:1fr 1fr;gap:1.3rem}
.lb-exc{background:var(--lb-paper);border:1px solid var(--lb-line);border-radius:1.25rem;box-shadow:var(--lb-shadow);overflow:hidden;display:flex;flex-direction:column}
.lb-exc-art{position:relative;overflow:hidden;height:12.5rem;background:var(--w-wall);border-bottom:1px solid var(--lb-line)}
.lb-exc-art svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lb-exc-b{padding:1rem 1.3rem 1.2rem;display:flex;flex-direction:column;gap:.65rem}
.lb-exc-b h2{margin:0;font-size:1.3rem;letter-spacing:-.015em;font-weight:800;display:flex;gap:.5rem;align-items:center}
.lb-exc-b h2 em{font-style:normal;font-size:.78rem;background:var(--lb-sci);color:var(--lb-onsci);border-radius:.4rem;padding:.08rem .45rem}
.lb-exp{margin:0;font-size:.9rem;color:var(--lb-sub)}
.lb-pick{display:grid;gap:.5rem}
.lb-pickb{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.7rem;width:100%;min-height:3.3rem;padding:.45rem .8rem;border-radius:.85rem;border:1.5px solid var(--lb-line2);background:var(--lb-paper);text-align:left}
.lb-pickb:hover{border-color:var(--lb-sci);background:var(--lb-sci-soft)}
.lb-pickb>i{width:2.2rem;height:2.2rem;border-radius:.6rem;display:grid;place-items:center;background:var(--lb-sci-soft);color:var(--lb-sci-ink)}
.lb-pickb b{display:block;font-size:1rem}
.lb-pickb span{display:block;font-size:.8rem;color:var(--lb-sub)}
.lb-pickb small{font-size:.78rem;font-weight:700;color:var(--lb-sci-ink);white-space:nowrap;display:inline-flex;align-items:center;gap:.25rem}
.lb-model{display:flex;gap:.7rem;align-items:center;font-size:.88rem;color:var(--lb-sub);padding:.75rem 1rem;border-radius:.9rem;border:1px dashed var(--lb-line2)}
.lb-footer{padding:.8rem 1rem 1.4rem;text-align:center;color:var(--lb-sub);font-size:.85rem}
.lb-footer p{margin:.2rem 0}
.lb-footer .tolist{display:inline-flex;margin-bottom:.6rem}
#hj-home{display:none}
html.lb-inrun .lb-footer{display:none}
html:not(.lb-inrun) .lb-app{height:auto;min-height:100vh;overflow:visible}
html:not(.lb-inrun) .lb-homewrap{overflow:visible}
html:not(.lb-inrun) .lb-bar{position:sticky;top:0}

/* 결과 한 장 */
.lb-sheetwrap{flex:1;min-height:0;display:flex;gap:1rem}
.lb-sheetside{width:15rem;flex:none;display:flex;flex-direction:column;gap:.7rem}
.lb-sheet{flex:1;min-width:0;background:#FFFDF8;color:#141A26;border-radius:.6rem;box-shadow:0 2px 3px rgba(0,0,0,.08),0 14px 34px rgba(40,30,10,.16);padding:.9rem 1.3rem .8rem;display:flex;flex-direction:column;gap:.45rem;overflow:auto;min-height:0;font-size:.86rem}
.lb-sh-h{display:flex;align-items:flex-end;gap:1rem;border-bottom:2px solid #141A26;padding-bottom:.45rem}
.lb-sh-h h2{margin:0;font-size:1.15rem;letter-spacing:-.015em}
.lb-sh-h span{font-size:.76rem;color:#4B5465}
.lb-sh-name{margin-left:auto;display:flex;gap:.5rem;align-items:center;font-size:.85rem;font-weight:700;white-space:nowrap}
.lb-sh-name u{text-decoration:none;display:inline-block;min-width:8rem;border-bottom:1.5px solid #141A26;font-weight:700;text-align:center;padding:0 .3rem}
.lb-sh-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:.6rem 1.3rem;flex:none}
.lb-sheet .lb-sh-po{display:none}
.lb-sheet .lb-chart{max-height:8.6rem}
.lb-sheet .lb-tbl th,.lb-sheet .lb-tbl td{padding:.22rem .1rem}
.lb-sh-sec{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.lb-sh-sec h3{margin:0;font-size:.78rem;color:#1A6E52;display:flex;align-items:center;gap:.4rem}
.lb-sh-sec h3 i{font-style:normal;width:1.2rem;height:1.2rem;border-radius:50%;background:#1A6E52;color:#fff;display:grid;place-items:center;font-size:.68rem}
.lb-sh-sec p{margin:0;line-height:1.45}
.lb-sh-tags{display:flex;flex-wrap:wrap;gap:.3rem}
.lb-sh-tag{display:inline-block;padding:.05rem .5rem;border-radius:999px;font-size:.76rem;font-weight:700;border:1px solid #D3CEC3;background:#fff;color:#141A26}
.lb-sh-tag.lb-d{background:#F9ECE1;border-color:#E2BFA2;color:#7A3B10}
.lb-sh .lb-tbl th,.lb-sheet .lb-tbl th{color:#4B5465}
.lb-sheet .lb-tbl th,.lb-sheet .lb-tbl td{border-color:#E3E0D8;color:#141A26}
.lb-sheet .lb-tbl{font-size:.78rem;background:#fff}
.lb-sheet .lb-tbl td.lb-ca{color:#24548F;font-weight:700}.lb-sheet .lb-tbl td.lb-cb{color:#8C4514;font-weight:700}
.lb-sh-box{border:1.5px solid #D3CEC3;border-radius:.6rem;padding:.45rem .65rem;background:#fff}
.lb-sh-concl{font-size:.92rem;line-height:1.75}
.lb-frame mark{background:var(--lb-sci-soft,#E3F1EA);color:var(--lb-sci-ink,#1A6E52);font-weight:800;padding:.05rem .35rem;border-radius:.3rem;border:1.5px solid var(--lb-sci)}
.lb-sh-concl mark{background:#E3F1EA;color:#1A6E52;font-weight:800;padding:0 .25rem;border-radius:.25rem}
.lb-sh-book{font-size:.82rem;color:#1A6E52;font-weight:700}
.lb-sh-lines{display:flex;flex-direction:column;justify-content:space-evenly;min-height:4.2rem;flex:1}
.lb-sh-lines .lb-ln{display:block;border-bottom:1px solid #9E968A;flex:1;min-height:1.6rem}
.lb-sh-steps{display:flex;flex-direction:column;gap:.1rem;line-height:1.4}.lb-sh-steps b{color:#1A6E52}
.lb-sh-f{font-size:.72rem;color:#4B5465;border-top:1px solid #E3E0D8;padding-top:.4rem;display:flex;justify-content:space-between;gap:1rem}
.lb-chart{width:100%;height:auto;display:block}
.lb-sheetside .lb-btn{width:100%}
.lb-sideinfo{background:var(--lb-paper);border:1px solid var(--lb-line);border-radius:1rem;padding:.8rem .9rem;font-size:.85rem;color:var(--lb-sub);display:flex;flex-direction:column;gap:.5rem}
.lb-sideinfo b{color:var(--lb-ink)}

/* 그림 움직임 */
.lb-a{transform-box:fill-box;animation-fill-mode:both;animation-timing-function:cubic-bezier(.3,.7,.4,1)}
.lb-a-pop{transform-origin:center;animation-name:lb-pop;animation-duration:.55s}
@keyframes lb-pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.lb-a-fade{animation-name:lb-fade;animation-duration:.6s}
@keyframes lb-fade{from{opacity:0}to{opacity:1}}
.lb-a-out{animation-name:lb-out;animation-duration:.6s}
@keyframes lb-out{from{opacity:1}to{opacity:0}}
.lb-a-down{animation-name:lb-down;animation-duration:1.1s}
@keyframes lb-down{from{transform:translateY(var(--from,-160px));opacity:.2}30%{opacity:1}to{transform:translateY(0)}}
.lb-a-up{animation-name:lb-up;animation-duration:1s}
@keyframes lb-up{from{transform:translateY(var(--from,70px));opacity:0}35%{opacity:1}to{transform:translateY(0)}}
.lb-a-slide{animation-name:lb-slide;animation-duration:1.2s}
@keyframes lb-slide{from{transform:translateX(var(--dx,-60px))}to{transform:translateX(0)}}
.lb-a-rise{transform-origin:50% 100%;animation-name:lb-rise;animation-duration:1.4s;animation-timing-function:ease-out}
.lb-a-rise.lb-a-rise2{animation-name:lb-rise2}
@keyframes lb-rise2{from{transform:scaleY(var(--s0,0))}to{transform:scaleY(1)}}
@keyframes lb-rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.lb-a-tilt{transform-origin:80% 80%;animation-name:lb-tilt;animation-duration:2s;animation-timing-function:ease-in-out}
@keyframes lb-tilt{0%{transform:rotate(0deg);opacity:0}12%{opacity:1}30%,75%{transform:rotate(var(--rot,-38deg))}100%{transform:rotate(0deg);opacity:0}}
.lb-a-stream{animation-name:lb-stream;animation-duration:2s;animation-timing-function:linear}
@keyframes lb-stream{0%,26%{opacity:0;stroke-dashoffset:0}30%{opacity:1}74%{opacity:1;stroke-dashoffset:-90}80%,100%{opacity:0;stroke-dashoffset:-110}}
.lb-a-shake{transform-origin:50% 90%;animation-name:lb-shake;animation-duration:2.2s;animation-timing-function:ease-in-out}
@keyframes lb-shake{0%{transform:rotate(0);opacity:0}10%{opacity:1}25%{transform:rotate(-140deg)}35%{transform:rotate(-125deg)}45%{transform:rotate(-140deg)}55%{transform:rotate(-125deg)}75%{transform:rotate(-140deg);opacity:1}100%{transform:rotate(-140deg);opacity:0}}
.lb-a-drop{animation-name:lb-sdrop;animation-duration:.7s;animation-timing-function:cubic-bezier(.5,0,.8,.6)}
@keyframes lb-sdrop{from{transform:translateY(-120px);opacity:0}20%{opacity:1}to{transform:translateY(0)}}
.lb-a-drip{animation-name:lb-drip;animation-duration:1.3s;animation-timing-function:ease-in}
@keyframes lb-drip{0%{transform:translateY(-60px);opacity:0}20%{opacity:1}80%{transform:translateY(40px);opacity:1}100%{transform:translateY(46px);opacity:0}}
.lb-a-grow{transform-origin:50% 100%;animation-name:lb-grow;animation-duration:.9s}
@keyframes lb-grow{from{transform:scale(.3);opacity:.2}to{transform:scale(1);opacity:1}}
.lb-a-doorA{animation-name:lb-doorA;animation-duration:2.8s;animation-timing-function:linear}
@keyframes lb-doorA{0%{opacity:1}12%,78%{opacity:0}90%,100%{opacity:1}}
.lb-a-doorB{animation-name:lb-doorB;animation-duration:2.8s;animation-timing-function:linear}
@keyframes lb-doorB{0%{opacity:0}12%,78%{opacity:1}90%,100%{opacity:0}}
.lb-a-move{animation-name:lb-move;animation-duration:2.8s;animation-timing-function:ease-in-out}
@keyframes lb-move{0%,16%{transform:translate(var(--dx,-270px),0)}30%{transform:translate(calc(var(--dx,-270px)*.75),-40px)}60%{transform:translate(0,-40px)}72%,100%{transform:translate(0,0)}}
.lb-a-wet{animation-name:lb-wet;animation-duration:1.6s;animation-timing-function:ease-out}
@keyframes lb-wet{0%{opacity:0}100%{opacity:1}}
.lb-a-pulse{animation:lb-pulse 1.6s ease-in-out infinite}
@keyframes lb-pulse{0%,100%{opacity:.35}50%{opacity:.75}}
@media (prefers-reduced-motion:reduce){.lb-a,.lb-a-pulse,.lb-doit::before{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important}}

/* 좁은 화면 */
@media (max-width:1100px){.lb-run{grid-template-columns:12.5rem minmax(0,1fr)}.lb-card{width:18.5rem}.lb-sheetside{width:12rem}}
@media (max-width:820px){
 html{font-size:15px}
 .lb-app{height:auto;min-height:100vh;overflow:visible;grid-template-rows:auto auto;align-content:start}
 .lb-bar{height:3.25rem;padding:0 .75rem;position:sticky;top:0}
 .lb-ttl span{display:none}
 .lb-hb span{display:none}.lb-hb{width:2.4rem;padding:0;justify-content:center}
 html body .lb-bar .hj-nav a span{display:none}
 .lb-run{grid-template-columns:1fr;grid-template-rows:auto auto}
 .lb-rail{border-right:0;border-bottom:1px solid var(--lb-line);padding:.55rem .9rem;overflow:visible}
 .lb-rail>:not(.lb-mtop):not(.lb-rlist){display:none}
 .lb-mtop{display:flex;align-items:center;gap:.6rem}
 .lb-mtop b{font-size:.9rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .lb-mbar{display:flex;gap:2px;flex:1;max-width:8rem}
 .lb-mbar i{flex:1;height:.35rem;border-radius:2px;background:var(--lb-line2)}
 .lb-mbar i.lb-d{background:var(--lb-sci)}
 .lb-mlist{display:inline-flex;align-items:center;gap:.3rem;height:2.4rem;padding:0 .7rem;border-radius:.6rem;border:1.5px solid var(--lb-line2);background:var(--lb-paper);font-size:.82rem;font-weight:700;color:var(--lb-ink)}
 .lb-rlist{display:none}
 .lb-rail.lb-open .lb-rlist{display:block;padding-top:.4rem}
 .lb-head{padding:.8rem 1rem .5rem}.lb-head h1{font-size:1.32rem}
 .lb-say span{display:none}.lb-say{width:2.4rem;padding:0;justify-content:center}
 .lb-body{flex-direction:column;padding:0 1rem;gap:.75rem}
 .lb-col{display:contents}
 .lb-scene{flex:none;height:min(66vw,290px);order:1}
 .lb-card{width:100%;order:2;overflow:visible}
 .lb-card-b{overflow:visible}
 .lb-notes{grid-template-columns:1fr;order:3}
 .lb-foot{position:sticky;bottom:0;background:var(--lb-bg);padding:.6rem 1rem;border-top:1px solid var(--lb-line);z-index:5;gap:.5rem;flex-wrap:wrap}

 .lb-shimg,.lb-flash,#lbFlash,.lb-toast{display:none!important}
 .lb-sheet{background:#fff!important}
 .lb-sheet{width:auto!important;max-width:100%!important;box-sizing:border-box!important;padding:7mm 8mm 6mm!important;height:262mm!important;overflow:hidden!important;margin:0!important;gap:2.6mm!important}
 .lb-sheet *{max-width:100%}
 .lb-sh-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}
 .lb-sh-name u{min-width:32mm!important}
 .lb-sh-pics{grid-template-columns:repeat(var(--n,4),minmax(0,1fr))!important;gap:2.5mm!important}
 .lb-sh-pic svg{height:25mm!important}
 .lb-sh-pic figcaption{font-size:8.5pt!important;padding:.6mm 1mm!important}
 .lb-sh-lines{min-height:30mm!important}
 .lb-sh-lines .lb-ln{min-height:7mm!important}
 .lb-sh-lines .lb-ln:nth-child(n+8){display:none!important}
}

/* ───────── 2026-11-01 '뭐하는지 모르겠어' 고침: 오늘의 실험 · 할 일 카드(① 해 보기 ② 살펴보기 ③ 기록하기) · 확대 렌즈 ───────── */
:root{--lb-lens:#C2410C;--lb-lens-soft:#FDF3EE}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lb-lens:#FFA45C;--lb-lens-soft:#2A1E17}}
:root[data-theme="dark"]{--lb-lens:#FFA45C;--lb-lens-soft:#2A1E17}
/* 오늘의 실험 */
.lb-body:has(>.lb-intro){display:block;overflow:auto}
.lb-intro{display:flex;flex-direction:column;gap:.8rem;height:100%;min-height:0;padding-bottom:.2rem}
.lb-iq{display:flex;align-items:center;gap:.9rem;background:var(--lb-paper);border:2px solid var(--lb-sci);border-radius:1rem;padding:.75rem 1.1rem;box-shadow:var(--lb-shadow)}
.lb-iq p{margin:0;font-size:1.35rem;font-weight:800;line-height:1.35}
.lb-itag{display:inline-flex;align-items:center;gap:.35rem;flex:none;background:var(--lb-sci);color:var(--lb-onsci);border-radius:.6rem;padding:.3rem .65rem;font-weight:800;font-size:.9rem}
.lb-isec{background:var(--lb-paper);border:1px solid var(--lb-line);border-radius:1rem;padding:.7rem 1rem .8rem;box-shadow:var(--lb-shadow);min-height:0}
.lb-isec h2{margin:0 0 .55rem;font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:.4rem;color:var(--lb-sci-ink)}
.lb-isteps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem}
.lb-isteps li{display:flex;flex-direction:column;gap:.45rem;min-width:0}
.lb-ipic{background:var(--w-wall);border:1px solid var(--lb-line);border-radius:.8rem;height:clamp(6rem,29vh,15rem);overflow:hidden}
.lb-ipic svg{display:block;width:100%;height:100%}
.lb-ipic *{animation:none!important}
.lb-isteps p{margin:0;display:flex;gap:.5rem;align-items:flex-start;font-size:1.02rem;font-weight:700;line-height:1.4}
.lb-isteps p b{flex:none;width:1.75rem;height:1.75rem;border-radius:50%;display:grid;place-items:center;background:var(--lb-sci);color:var(--lb-onsci);font-size:.95rem}
.lb-ilook{border:2px solid var(--lb-lens);background:var(--lb-lens-soft)}
.lb-ilook h2{color:var(--lb-ink)}.lb-ilook h2 .lb-ic{color:var(--lb-lens)}
.lb-ilook ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.4rem 1.6rem}
.lb-ilook li{display:flex;gap:.45rem;align-items:center;font-size:1.08rem;font-weight:700}
.lb-ilook li .lb-ic{color:var(--lb-lens);stroke-width:3}
/* 할 일 카드 */
.lb-stat{margin:0;display:flex;gap:.5rem;align-items:flex-start;background:var(--lb-navy);color:var(--lb-onnavy);border-radius:.75rem;padding:.55rem .75rem;font-size:.98rem;font-weight:700;line-height:1.4}
.lb-stat .lb-ic{margin-top:.15rem;flex:none}
.lb-stat.lb-statok{background:var(--lb-sci-soft);color:var(--lb-ink)}.lb-stat.lb-statok .lb-ic{color:var(--lb-sci-ink)}
.lb-guide{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5rem}
.lb-gp{border:1.5px solid var(--lb-line);border-radius:.9rem;padding:.5rem .65rem .6rem;display:flex;flex-direction:column;gap:.45rem;background:var(--lb-paper)}
.lb-gp.lb-cur{border:2.5px solid var(--lb-sci);box-shadow:0 0 0 3px color-mix(in srgb,var(--lb-sci) 16%,transparent)}
.lb-gp.lb-ok{background:var(--lb-bg)}
.lb-gp.lb-wait{opacity:.5;border-style:dashed}
.lb-gh{display:flex;align-items:center;gap:.5rem}
.lb-gh i{width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.95rem;background:var(--lb-line);color:var(--lb-ink);flex:none}
.lb-gh i .lb-ic{width:1rem;height:1rem;stroke-width:3}
.lb-cur>.lb-gh i{background:var(--lb-sci);color:var(--lb-onsci)}
.lb-ok>.lb-gh i{background:var(--lb-sci-soft);color:var(--lb-sci-ink)}
.lb-gh b{font-size:1rem}
.lb-gb{display:flex;flex-direction:column;gap:.45rem;min-width:0}
.lb-gb>p{margin:0;font-size:.95rem;font-weight:600;line-height:1.4}
.lb-acts{display:flex;flex-direction:column;gap:.4rem}
.lb-app .lb-act{position:relative;display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;min-height:3.1rem;padding:.35rem .8rem;border-radius:.85rem;border:2px solid var(--lb-sci);background:var(--lb-sci);color:var(--lb-onsci);font-weight:800;font-size:1.02rem;line-height:1.25;text-align:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.lb-app .lb-act .lb-ic{width:1.3em;height:1.3em}
.lb-app .lb-act.lb-act2{background:var(--lb-sci-soft);color:var(--lb-sci-ink)}
.lb-app .lb-act.lb-act3{background:var(--lb-paper);color:var(--lb-sci-ink);border-color:var(--lb-line2);min-height:2.6rem;font-size:.9rem}
.lb-app .lb-act[aria-pressed="true"]{background:var(--lb-sci-soft);color:var(--lb-sci-ink)}
.lb-app .lb-act:disabled{background:var(--lb-bg);border-color:var(--lb-line);color:var(--lb-sub)}
.lb-cur .lb-act:not(:disabled):not(.lb-act2):not(.lb-act3)::before{content:"";position:absolute;inset:-2px;border-radius:.85rem;animation:lb-ping 2s ease-out infinite;pointer-events:none}
.lb-app .lb-act.lb-hold:active,.lb-app .lb-act.lb-hold.lb-on{background:var(--lb-sci-ink);border-color:var(--lb-sci-ink)}
.lb-gp .lb-mrow{padding:.45rem .5rem}
.lb-mdone .lb-mrh{flex-wrap:wrap;gap:.2rem .5rem}
.lb-mdone .lb-okt{font-weight:800}
.lb-card>.lb-card-b .lb-act{margin-top:.1rem}
/* 장면 위: 소리 남/멈춤 · 천천히 보기 */
.lb-cap{position:absolute;left:.75rem;top:.75rem;z-index:3;display:inline-flex;align-items:center;gap:.4rem;background:var(--lb-navy);color:var(--lb-onnavy);border-radius:999px;padding:.4rem 1rem;font-size:1.05rem;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.lb-cap.lb-capon{background:var(--lb-sci);color:var(--lb-onsci)}
.lb-slowb{position:absolute;right:.75rem;bottom:.75rem;z-index:3;display:inline-flex;align-items:center;gap:.35rem;height:2.4rem;padding:0 .9rem;border-radius:999px;border:1.5px solid var(--lb-line2);background:var(--lb-paper);color:var(--lb-ink);font-weight:800;font-size:.88rem}
.lb-slowb[aria-pressed="true"]{background:var(--lb-sci);border-color:var(--lb-sci);color:var(--lb-onsci)}
.lb-slowmo .lb-buzz{animation-duration:1.1s}
.lb-slowmo .lb-splash{animation-duration:2.2s}
.lb-slowmo .lb-ripple{animation-duration:3s}
.lb-lens{pointer-events:none}
/* 아래 막대: 이전 · 진행 · 이어서 */
.lb-pgn{font-weight:800;color:var(--lb-ink);font-size:.95rem;white-space:nowrap}
.lb-btn.lb-pri.lb-go{animation:lb-attn 1.6s ease-in-out 2}
@media (prefers-reduced-motion:reduce){.lb-act::before,.lb-btn.lb-go{animation:none!important}}
@media (max-width:1100px) and (min-width:821px){.lb-isteps p{font-size:.95rem}}
@media (max-width:820px){
 .lb-iq{flex-direction:column;align-items:flex-start;gap:.4rem}.lb-iq p{font-size:1.15rem}
 .lb-isteps{grid-template-columns:repeat(2,minmax(0,1fr))}
 .lb-ipic{height:7rem}
 .lb-intro{height:auto}
 .lb-fmid{display:flex!important;flex:0 1 auto;order:0}.lb-fmid .lb-prog{display:none}
 .lb-cap{font-size:.9rem;padding:.3rem .7rem;left:.5rem;top:.5rem}
 .lb-slowb{height:2.75rem;right:.5rem;bottom:.5rem}
}

/* 알림은 제목을 가리지 않게 아래 막대 바로 위에(검토 고침) */
.lb-flash{left:50%;right:auto;top:auto;bottom:5.6rem;transform:translateX(-50%);max-width:min(30rem,calc(100% - 2rem));text-align:center}
@media (min-width:821px){.lb-flash{bottom:.95rem}html.lb-inrun .lb-flash{left:calc(50% + 7.5rem)}}
.lb-fmid>.lb-pgn{display:inline!important}

/* 인쇄 고침(2026-11-01): 높이를 정해 넘치는 것을 숨기던 방식 → 꼬리말('만든 사람')이 잘렸음. 높이는 내용대로, 쓰는 줄 수로 한 쪽에 맞춤 */
@media print{
 html,body{zoom:1!important;transform:none!important;width:auto!important;min-width:0!important}
 .lb-sheet{height:auto!important;min-height:0!important;overflow:visible!important;width:100%!important;max-width:100%!important;box-sizing:border-box!important;padding:8mm 8mm 6mm!important}
 .lb-sheet,.lb-sheet *{box-sizing:border-box;min-width:0}
 .lb-sh-in{zoom:1!important}
 .lb-sheet table{table-layout:fixed!important;width:100%!important}
 .lb-sheet th,.lb-sheet td{white-space:normal!important;overflow-wrap:anywhere}
 .lb-sh-fill{flex:none!important}
 .lb-sh-lines{display:block!important;flex:none!important;min-height:0!important}
 .lb-sh-lines .lb-ln{display:block;flex:none!important;height:8mm!important;min-height:0!important}
 .lb-sh-lines .lb-ln:nth-child(n+6){display:none!important}
 .lb-sh-f{break-inside:avoid}
}
.lb-shimg .lb-sheet{background:#fff!important}

/* ───────── 힘 실험관에서 더한 것 ───────── */
.lb-a-mv{animation-name:lb-mv;animation-duration:2s;animation-timing-function:cubic-bezier(.45,.05,.4,1)}
@keyframes lb-mv{0%,12%{transform:translateX(0)}100%{transform:translateX(var(--dx,200px))}}
.lb-a-liftup{animation-name:lb-liftup;animation-duration:1.7s;animation-timing-function:ease-in-out}
@keyframes lb-liftup{0%{transform:translateY(0)}35%,70%{transform:translateY(-46px)}100%{transform:translateY(0)}}
.lb-a.lb-a-rot{transform-box:view-box;transform-origin:var(--ox,480px) var(--oy,330px);animation-name:lb-rot;animation-duration:.9s;animation-timing-function:cubic-bezier(.3,.7,.4,1)}
@keyframes lb-rot{from{transform:rotate(var(--a0))}to{transform:rotate(var(--a1))}}
.lb-a-bob{animation-name:lb-bob;animation-duration:1.5s;animation-timing-function:ease-out}
@keyframes lb-bob{0%{transform:translateY(var(--dy,0))}45%{transform:translateY(calc(var(--dy,0px) * -0.18))}70%{transform:translateY(calc(var(--dy,0px) * 0.06))}100%{transform:translateY(0)}}
.lb-a-raise{animation-name:lb-raise;animation-duration:1.8s;animation-timing-function:ease-in-out}
@keyframes lb-raise{0%,20%{transform:translateY(var(--from,40px))}100%{transform:translateY(0)}}
.lb-a-slope{animation-name:lb-slope;animation-duration:2.2s;animation-timing-function:ease-in-out}
@keyframes lb-slope{0%,10%{transform:translate(var(--dx,0),var(--dy,0))}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){.lb-a-mv,.lb-a-liftup,.lb-a-rot,.lb-a-bob,.lb-a-raise,.lb-a-slope{animation-duration:1ms!important}}
.lb-kseg.lb-kwrap{flex-wrap:wrap;overflow:visible;border:0;gap:.3rem}
.lb-kseg.lb-kwrap button{flex:1 1 auto;white-space:normal;height:auto;min-height:2.4rem;padding:.3rem .5rem;border:1.5px solid var(--lb-line2)!important;border-radius:.55rem;font-size:.8rem;line-height:1.25}
.lb-kseg.lb-kwrap.lb-wrongc{box-shadow:none}
.lb-kseg.lb-kwrap.lb-wrongc button{border-color:var(--lb-bad)!important}
.lb-kseg button[aria-pressed="true"].lb-s{background:var(--lb-sci);color:var(--lb-onsci)}
.lb-cellrow{display:flex;flex-direction:column;gap:.35rem}
.lb-cellrow>div{display:grid;grid-template-columns:repeat(5,1fr);gap:.35rem}
.lb-cellb{min-height:2.8rem;border-radius:.65rem;border:2px solid var(--lb-sci);background:var(--lb-paper);color:var(--lb-sci-ink);font:inherit;font-weight:800;font-size:1rem}
.lb-cellb[aria-pressed="true"]{background:var(--lb-sci);color:var(--lb-onsci)}
.lb-cellb:disabled{opacity:.55}
.lb-cellb.lb-attn{animation:lb-attn 1.2s ease-in-out infinite}
.lb-ordb{display:flex;flex-wrap:wrap;gap:.35rem;border-radius:.6rem}
.lb-ordb.lb-wrongc{box-shadow:0 0 0 2px var(--lb-bad)}
.lb-ordb .lb-chip b{display:inline-grid;place-items:center;width:1.3rem;height:1.3rem;border-radius:50%;background:var(--lb-sci);color:var(--lb-onsci);font-size:.78rem}
.lb-num.lb-numw{width:5rem}
.lb-acts .lb-act[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--lb-sci)}
.lb-sheet .lb-chart{max-height:9rem!important;width:auto;max-width:100%;margin:0 auto}
@media print{.lb-sheet .lb-chart{max-height:34mm!important}}

/* ───────── 물체와 물질 실험관에서 더한 것 ───────── */
.lb-ex4{grid-template-columns:repeat(2,1fr);gap:1rem}
.lb-ex4 .lb-exc-art{height:9rem}
.lb-ex4 .lb-exc-b{padding:.8rem 1rem 1rem;gap:.45rem}
.lb-ex4 .lb-exc-b h2{font-size:1.08rem}
.lb-ex4 .lb-pickb{min-height:3rem}
@media (min-width:1200px){.lb-ex4{grid-template-columns:repeat(4,1fr)}.lb-ex4 .lb-exc-art{height:8.5rem}}
@media (max-width:820px){.lb-ex4{grid-template-columns:1fr}}
.lb-a-rub{animation-name:lb-rub;animation-duration:.48s;animation-iteration-count:5;animation-timing-function:ease-in-out}
@keyframes lb-rub{0%,100%{transform:translateX(0)}50%{transform:translateX(-90px)}}
@media (prefers-reduced-motion:reduce){.lb-a-rub{animation-duration:1ms!important;animation-iteration-count:1!important}}
.lb-nrow{display:grid;grid-template-columns:6.2rem 1fr;align-items:center;gap:.5rem;font-weight:700;font-size:.9rem}
.lb-nrow .lb-input{min-width:0;width:100%}
.lb-recsum{margin:.2rem 0 0;font-size:.86rem;color:var(--lb-sub);line-height:1.45;word-break:keep-all}
.lb-cellb{display:inline-flex;align-items:center;justify-content:center;gap:.25rem;white-space:nowrap;padding:0 .3rem;font-size:.95rem}
.lb-cellb .lb-ic{width:1rem;height:1rem;flex:none}
.lb-cellb.lb-seen:not([aria-pressed="true"]){background:color-mix(in srgb,var(--lb-sci) 10%,var(--lb-paper))}
.lb-acts .lb-act[aria-pressed="true"]:disabled{opacity:.7}
.lb-exc-b h2 em{white-space:nowrap}
/* 독립 검토(2026-11-09): 짧은 이름표는 칸 단추와 한 줄에(카드 글자가 줄지 않게), 옮겨 담기 차례 줄 */
.lb-cells.lb-c1.lb-c2{grid-template-columns:4.8rem 1fr;gap:.3rem .45rem}
.lb-cells.lb-c2 .lb-cl{white-space:normal;line-height:1.2;word-break:keep-all}
.lb-seq{list-style:none;margin:0 0 .45rem;padding:0;display:grid;gap:.2rem}
.lb-seq li{display:flex;align-items:center;gap:.4rem;font-size:.84rem;color:var(--lb-sub);line-height:1.3}
.lb-seq li b,.lb-seq li .lb-ic{flex:none;width:1.25rem;height:1.25rem;border-radius:50%;display:inline-grid;place-items:center;font-size:.72rem;border:1.5px solid var(--lb-line2)}
.lb-seq li .lb-ic{border:0;color:var(--lb-sci-ink)}
.lb-seq li.lb-d{color:var(--lb-ink)}
.lb-seq li.lb-n{color:var(--lb-ink);font-weight:800}
.lb-seq li.lb-n b{background:var(--lb-sci);color:var(--lb-onsci);border-color:var(--lb-sci)}
/* 실험 1은 기록 줄이 많아 쓰는 줄을 둘로(인쇄 한 쪽, 잎 모양 글을 길게 써도) */
@media print{.lb-sh-e1 .lb-sh-lines .lb-ln:nth-child(n+3){display:none!important}}
/* 결과 한 장 관찰 기록: 이름 칸은 좁게, 기록은 왼쪽 정렬(긴 기록이 여러 줄로 늘어나 2쪽이 되던 것) */
.lb-sheet .lb-tbl:not(:has(th:nth-child(3))) thead th:first-child{width:34%}
.lb-sheet .lb-tbl tbody th{white-space:normal;word-break:keep-all;vertical-align:top}
.lb-sheet .lb-tbl td{text-align:left;padding-left:.35rem;line-height:1.35}
.lb-cells.lb-c2 .lb-kseg button{font-size:.8rem;white-space:normal;line-height:1.15;height:auto;min-height:2.3rem;padding:.15rem .2rem}
/* 짧은 보기가 넷 이상이면 두 칸으로(예상 카드가 줄어들지 않게) */
.lb-opts.lb-opts2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem}
/* 결론 쓰기의 왼쪽: 내 기록 · 내 예상 */
.lb-recpanel{position:absolute;inset:0;overflow:auto;background:var(--lb-paper);padding:1rem 1.2rem;display:flex;flex-direction:column;gap:.9rem}
.lb-recpanel h2{display:flex;align-items:center;gap:.4rem;margin:0 0 .4rem;font-size:1rem;color:var(--lb-sci-ink)}
.lb-recpanel h2 .lb-ic{width:1.15rem;height:1.15rem}
.lb-rtbl{width:100%;border-collapse:collapse;font-size:.95rem;line-height:1.4}
.lb-rtbl th,.lb-rtbl td{border-bottom:1px solid var(--lb-line);padding:.42rem .4rem;vertical-align:top;text-align:left;color:var(--lb-ink)}
.lb-rtbl th{width:34%;font-weight:800;word-break:keep-all}
.lb-rtbl td{display:flex;flex-wrap:wrap;gap:.15rem .9rem}
.lb-rtbl td span{white-space:nowrap}
.lb-rtbl td b{color:var(--lb-sub);font-weight:700}
.lb-rpred ul{margin:0;padding:0 0 0 1.1rem;font-size:.9rem;line-height:1.5;color:var(--lb-sub)}
.lb-rpred b{color:var(--lb-ink)}
@media (max-width:820px){.lb-recpanel{padding:.7rem .8rem}.lb-rtbl{font-size:.88rem}.lb-rtbl td span{white-space:normal}}
/* 잘못된 방법 알림은 그림 아래쪽(실험대 앞)에 — 위쪽 확대 렌즈·컵을 가리지 않게 */
.lb-scene .lb-toast2,.lb-scene .lb-toast3{top:auto;bottom:.8rem}
/* ───────── 3학년 실험관에서 더한 것 ───────── */
.lb-vein{opacity:.38}
.lb-lensin .lb-vein{opacity:1}
.lb-a-squish{transform-box:fill-box;transform-origin:50% 50%;animation-name:lb-squish;animation-duration:1.2s;animation-timing-function:ease-in-out}
@keyframes lb-squish{0%,100%{transform:scale(1,1)}35%,65%{transform:scale(1.12,.66)}}
@media (prefers-reduced-motion:reduce){.lb-a-squish{animation-duration:1ms!important}}
.lb-cellb.lb-cellw{white-space:normal;line-height:1.2;height:auto;min-height:2.6rem;padding:.25rem .45rem;word-break:keep-all;text-align:center}
.lb-cellrow>div:has(.lb-cellw){align-items:stretch}
.lb-cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.35rem .55rem}
.lb-cgrid .lb-cells.lb-c1.lb-c2{grid-template-columns:2.2rem minmax(0,1fr);gap:.25rem}
.lb-cgrid .lb-cl{font-size:.82rem}
/* 독립 검토: 실험 1은 기록 줄이 일곱이라 잎 모양 글을 길게 쓰면 2쪽이 되던 것 → 인쇄에서 관찰 기록 글자를 조금 작게 */
@media print{.lb-sh-e1 .lb-tbl{font-size:9.6pt!important;line-height:1.3!important}.lb-sh-e1 .lb-tbl th,.lb-sh-e1 .lb-tbl td{padding-top:.6mm!important;padding-bottom:.6mm!important}}

html .hj-em{font-family:'HJ Emoji','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-weight:400;font-style:normal;font-synthesis:none;letter-spacing:0;-webkit-text-stroke:0;text-shadow:none}
/* 교사 안내 창 도구(인쇄·구글 문서·이메일) */
html body .hj-tbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px 0 4px;padding-top:18px;border-top:1px solid var(--line)}
html body .hj-tbar>button,html body .hj-mail button{display:inline-flex;align-items:center;gap:7px;font:700 16px/1.2 'Gowun Dodum',sans-serif;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;cursor:pointer}
html body .hj-tbar>button:hover,html body .hj-mail button:hover{background:var(--bg);border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
html body .hj-tbar .hj-i{width:18px;height:18px;flex:none}
html body .hj-mail{flex-basis:100%;display:grid;gap:8px;max-width:560px;margin:6px auto 0;text-align:left;background:var(--bg);border-radius:16px;padding:14px 16px}
html body .hj-mail[hidden]{display:none}
html body .hj-mail label{font-weight:700;font-size:16px}html body .hj-mail label small{font-weight:500;color:var(--soft);font-size:14px;margin-left:6px}
html body .hj-mail input{font:500 17px/1.4 'Gowun Dodum',sans-serif;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
html body .hj-mail div{display:flex;flex-wrap:wrap;gap:8px}html body .hj-mail p{margin:0;font-size:14px!important;color:var(--soft)}
html body .hj-toast{flex-basis:100%;margin:2px 0 0;min-height:1.3em;text-align:center;font-size:15px!important;color:var(--soft)}
@media print{
 body.hj-tprint>*:not(#tn){display:none!important}
 body.hj-tprint #tn{position:static!important;display:block!important;background:none!important;padding:0!important;inset:auto!important}
 body.hj-tprint #tn .panel{width:auto!important;max-height:none!important;overflow:visible!important;box-shadow:none!important;border:0!important;border-radius:0!important;padding:0!important;transform:none!important;animation:none!important}
 body.hj-tprint .hj-tbar,body.hj-tprint #tnClose{display:none!important}
 body.hj-tprint{background:#fff!important;color:#000}
 body.hj-tprint #tn .panel{padding:16mm!important}
}
/* 수업을 마쳤을 때 고르는 창 */
#hj-done{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:rgba(42,34,28,.38);backdrop-filter:blur(3px);animation:hjfade .2s ease}
@keyframes hjfade{from{opacity:0}to{opacity:1}}
#hj-done .hj-dp{width:min(560px,100%);background:var(--paper,#fff);color:var(--ink,#2A221C);border-radius:24px;padding:30px 28px 24px;text-align:center;box-shadow:0 30px 60px -24px rgba(40,25,10,.5);font-family:'Gowun Dodum',sans-serif;word-break:keep-all}
#hj-done .hj-dok{display:inline-grid;place-items:center;width:60px;height:60px;border-radius:18px;background:color-mix(in srgb,#7FB89A 22%,var(--paper,#fff));color:#3F7A5C}
#hj-done .hj-dok svg{width:32px;height:32px}
#hj-done h2{font-family:'Jua',sans-serif;font-size:clamp(26px,3vw,32px);margin:12px 0 4px;letter-spacing:-.03em}
#hj-done .hj-dl{margin:0 0 20px;color:var(--soft,#5C5047);font-size:17px}
#hj-done .hj-dn{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;text-align:left;text-decoration:none;color:#fff;background:var(--ink,#2A221C);border-radius:18px;padding:16px 20px}
#hj-done .hj-dn small{grid-column:1;font-size:14px;opacity:.75;font-weight:600}
#hj-done .hj-dn b{grid-column:1;font-size:clamp(18px,2vw,21px);line-height:1.4}
#hj-done .hj-dn svg{grid-column:2;grid-row:1/3;width:26px;height:26px}
#hj-done .hj-dn:hover{filter:brightness(1.15)}
#hj-done .hj-dlast{margin:0;padding:14px;border-radius:16px;background:var(--bg,#FFFCF8);color:var(--soft,#5C5047);font-size:17px}
#hj-done .hj-drow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
#hj-done .hj-db{flex:1 1 200px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 17px/1.2 'Gowun Dodum',sans-serif;color:var(--ink,#2A221C);background:var(--paper,#fff);border:1.5px solid var(--line,#EFE3D6);border-radius:999px;padding:12px 16px;text-decoration:none;cursor:pointer}
#hj-done .hj-db:hover{background:var(--bg,#FFFCF8)}
#hj-done .hj-db svg{width:20px;height:20px}
#hj-done :focus-visible{outline:3px solid #E0A458;outline-offset:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #hj-done .hj-dn{background:#F2EBE3;color:#221E1A}}
:root[data-theme="dark"] #hj-done .hj-dn{background:#F2EBE3;color:#221E1A}
html body .hj-pl{display:none}
@media print{body.hj-tprint .hj-pl{display:block;text-align:center;font-size:14px!important;color:#555;margin:0 0 4px}}
/* 사진 출처 줄이 화면 밖으로 넘치지 않게 */
html body #phc{white-space:normal!important;overflow-wrap:anywhere;max-width:min(1100px,100%);text-align:center;line-height:1.6;opacity:.85}
/* 홍지희 선생님 버전(SOOP) 첫 화면: 차분하고 읽기 쉽게 */
html body #cBadge{background:color-mix(in srgb,var(--sc) 14%,var(--paper));color:color-mix(in srgb,var(--sc) 78%,var(--ink));font-weight:700;font-size:clamp(15px,1.3vw,18px);padding:5px 14px;letter-spacing:-.01em}
html body #cover:has(#cBadge) .title{font-size:clamp(30px,min(4vw,7vh),52px);line-height:1.25}
html body #cBq{border:0;border-left:5px solid color-mix(in srgb,var(--sc) 55%,var(--paper));background:color-mix(in srgb,var(--sc) 6%,var(--paper));border-radius:16px;padding:14px 22px;text-align:left;box-shadow:none}
html body #cBq>*:first-child:not(b){font-size:15px!important;font-weight:700;color:var(--soft)}
html body #cBq b{display:block;font-weight:700;font-size:clamp(20px,2vw,27px);line-height:1.4;margin-top:2px}
html body #cGoal{border:0;border-left:5px solid transparent;background:var(--hjs-soft,color-mix(in srgb,#2B4A7C 8%,var(--paper)));color:var(--ink);border-radius:16px;padding:12px 22px;font-weight:700;font-size:clamp(18px,1.7vw,23px);text-align:left;box-shadow:none}
html body #cMap{gap:10px}
html body #cMap .mcol{border:1px solid var(--line);border-top:3px solid color-mix(in srgb,var(--mc) 60%,var(--paper));border-radius:14px;padding:12px 12px 10px;box-shadow:none}
html body #cMap .mcol h3{font-size:clamp(15px,1.3vw,17px);font-weight:800;color:color-mix(in srgb,var(--mc) 80%,var(--ink));margin:0 0 4px}
html body #cMap .mcol a,html body #cMap .mcol .cur{font-size:clamp(14px,1.2vw,16px);line-height:1.45;padding:5px 8px;border-radius:8px}
html body #cMap .mcol a{color:var(--soft)}html body #cMap .mcol a:hover{background:var(--bg);color:var(--ink)}
html body #cMap .mcol .cur{background:color-mix(in srgb,var(--mc) 13%,var(--paper));color:color-mix(in srgb,var(--mc) 70%,var(--ink))!important;font-weight:700}
/* 듣기 재생 막대 */
#hj-player{position:fixed;left:50%;bottom:clamp(84px,11vh,110px);transform:translateX(-50%);z-index:9000;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;
 max-width:calc(100vw - 24px);background:var(--paper,#fff);color:var(--ink,#2A221C);border:1px solid var(--line,#EFE3D6);border-radius:999px;padding:6px 6px 6px 16px;
 box-shadow:0 14px 34px -14px rgba(40,25,10,.4);font-family:'Gowun Dodum',sans-serif;word-break:keep-all}
#hj-player[hidden]{display:none}
#hj-player .hj-pl-l{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--soft,#5C5047);margin-right:4px}

html body .frameline{display:flex!important;flex-wrap:wrap;justify-content:center;align-items:baseline;column-gap:.3em;row-gap:.2em}html body .frameline input{max-width:100%;text-align:center}

:where(button,input,select,textarea){font-family:inherit}
@media screen{
 /* 과목 선: 화면 맨 위 3px(자리를 차지하지 않고 누르기도 통과, 겹창(9000대) 아래) */

 /* 단계 번호: 지금 단계만 과목 색, 나머지는 테두리·바탕 없이 번호만(굵기는 그대로라 크기 변화 없음) */
 html body .screen:not(#cover) .topbar .st:not(.now),html body .hj-sttabs>a[data-hjst]:not(.hj-cur){border-color:transparent!important;background:transparent!important;box-shadow:none!important;color:var(--soft)!important}
