<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2학년 틀린 그림 찾기 · 쉬는 시간 · 초등교사 홍지희</title>
<meta name="description" content="2학년 쉬는 시간 틀린 그림 찾기 90개(쉬움·보통·도전)">
<style>:root{--bg:#FFF8F0;--paper:#fff;--ink:#2A221C;--soft:#5C5047;--line:#EADCCB;--acc:#3A8F3A;
 --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1A17;--paper:#2A2420;--ink:#F4ECE3;--soft:#CDBFB1;--line:#4A3F37}}
:root[data-theme="dark"]{--bg:#1E1A17;--paper:#2A2420;--ink:#F4ECE3;--soft:#CDBFB1;--line:#4A3F37}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:clamp(18px,2vw,22px);line-height:1.55;overflow-x:hidden}
body,h1,h2,h3,p,li,span,div,button,a,b{word-break:keep-all;overflow-wrap:break-word}
main{max-width:1180px;margin:0 auto;padding:clamp(14px,3vw,36px)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,4.6vw,52px);margin:4px 0 0;line-height:1.2}
.sub{color:var(--soft);margin:6px 0 14px}
button{font:inherit;color:inherit;cursor:pointer}
.sd-rules{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;padding:0;list-style:none}
.sd-rules li{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:clamp(15px,1.5vw,18px)}
.sd-prog{font-family:var(--display);color:var(--acc);margin:0 0 6px;font-size:clamp(18px,1.8vw,22px)}
#sdList h3{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.4vw,28px);margin:18px 0 8px}
#sdList h3 small{font-family:var(--body);font-size:15px;color:var(--soft);margin-left:8px}
.sd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.sd-q{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:8px 12px}
.sd-q:hover,.sd-q:focus-visible{border-color:var(--acc);outline:0}
.sd-q b{font-family:var(--display);font-weight:400;font-size:clamp(20px,2vw,24px);line-height:1.1}
.sd-q span{font-size:14px;line-height:1.35;color:var(--soft)}
.sd-q.done{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--paper))}
.sd-q.done::after{content:"✓";position:absolute;top:6px;right:10px;color:var(--acc);font-weight:700}
#sdPlay[hidden],#sdPick[hidden],[hidden]{display:none!important}
.sd-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 6px}
.sd-bar h2{flex:1 1 auto;margin:0;font-family:var(--display);font-weight:400;font-size:clamp(24px,2.8vw,34px)}
.sd-time{font-family:var(--display);font-size:clamp(20px,2vw,26px);color:var(--soft);font-variant-numeric:tabular-nums}
.sd-ask{margin:0 0 12px;font-size:clamp(20px,2.3vw,28px);font-weight:700;line-height:1.45}
.sd-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-size:clamp(15px,1.5vw,18px);font-weight:700}
.sd-btn:hover,.sd-btn:focus-visible{border-color:var(--ink);outline:0}
.sd-btn:disabled{opacity:.4;cursor:default}
.sd-btn[aria-pressed="true"],.sd-btn.go{background:var(--acc);border-color:var(--acc);color:#fff}
.sd-stage{display:flex;flex-direction:column;gap:14px}
.sd-pics{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.4vw,18px)}
.sd-pic{position:relative;border:3px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.sd-pic svg{display:block;width:100%;height:auto;cursor:crosshair;touch-action:manipulation}
.sd-pic b{position:absolute;left:8px;top:6px;font-size:13px;background:rgba(255,255,255,.88);color:#2A221C;border-radius:999px;padding:1px 9px}
.sd-board svg{width:100%;height:100%;display:block}
.sd-board .sd-c{cursor:pointer}
.sd-board.shake{animation:hpshake .35s}
@keyframes hpshake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sd-side{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}@media (max-width:760px){.sd-side{grid-template-columns:1fr}}
.sd-right{display:flex;flex-direction:column;gap:12px}
.sd-tools,.sd-nav{display:flex;flex-wrap:wrap;gap:8px}
.sd-msg{margin:0;min-height:1.5em;font-weight:700;color:var(--soft)}
.sd-msg.bad{color:#C6392F}
.sd-done{background:var(--paper);border:3px solid var(--acc);border-radius:20px;padding:14px 16px;text-align:center}
.sd-done b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(26px,2.8vw,34px);color:var(--acc)}
.sd-done div{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}
#sdSheet{display:none}
.creditbar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;margin-top:26px}
.tolist{display:none;align-items:center;gap:8px;font-family:var(--display,sans-serif);font-size:clamp(18px,1.8vw,22px);text-decoration:none;color:inherit;border:3px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 22px}
.tolist.on{display:inline-flex}
@media (max-width:820px){.sd-stage{--bw:min(100vw - 32px,600px);grid-template-columns:1fr}}
@media print{
 @page{margin:10mm}
 body{background:#fff}
 main>*:not(#sdSheet),.hj-nav,.hj-navbar,#hj-home{display:none!important}
 #sdSheet{display:block!important}
 #sdSheet svg{display:block;width:180mm;height:135mm;margin:3mm auto 0}
 #sdSheet p{font:13pt sans-serif;margin:0 0 3mm}
}
.sd-find{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:10px 12px}
.sd-find h3{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:clamp(19px,1.9vw,23px)}
.sd-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.sd-it{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;font-weight:700;border-radius:12px;padding:4px 2px;background:#fff;color:#2A221C;border:2px solid transparent}
.sd-it svg{width:48px;height:48px}
.sd-it.ok{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,#fff);opacity:.75}
.sd-it.ok::after{content:"✓ 찾음";font-size:12px;color:var(--acc)}
.sd-board svg{cursor:crosshair}
#sdSheet .sd-items{grid-template-columns:repeat(6,1fr);margin-top:4mm}
.sd-found{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:10px 14px}
.sd-found h3{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:clamp(19px,1.9vw,23px)}
.sd-dots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.sd-dots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.sd-dots i.on{background:var(--acc);border-color:var(--acc)}
.sd-what{margin:0;padding-left:1.2em;font-size:clamp(15px,1.5vw,18px)}

html .hj-em{font-family:'HJ Emoji','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-weight:400;font-style:normal;font-synthesis:none;letter-spacing:0;-webkit-text-stroke:0;text-shadow:none}
/* 교사 안내 창 도구(인쇄·구글 문서·이메일) */
html body .hj-tbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px 0 4px;padding-top:18px;border-top:1px solid var(--line)}
html body .hj-tbar>button,html body .hj-mail button{display:inline-flex;align-items:center;gap:7px;font:700 16px/1.2 'Gowun Dodum',sans-serif;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;cursor:pointer}
html body .hj-tbar>button:hover,html body .hj-mail button:hover{background:var(--bg);border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
html body .hj-tbar .hj-i{width:18px;height:18px;flex:none}
html body .hj-mail{flex-basis:100%;display:grid;gap:8px;max-width:560px;margin:6px auto 0;text-align:left;background:var(--bg);border-radius:16px;padding:14px 16px}
html body .hj-mail[hidden]{display:none}
html body .hj-mail label{font-weight:700;font-size:16px}html body .hj-mail label small{font-weight:500;color:var(--soft);font-size:14px;margin-left:6px}
html body .hj-mail input{font:500 17px/1.4 'Gowun Dodum',sans-serif;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
html body .hj-mail div{display:flex;flex-wrap:wrap;gap:8px}html body .hj-mail p{margin:0;font-size:14px!important;color:var(--soft)}
html body .hj-toast{flex-basis:100%;margin:2px 0 0;min-height:1.3em;text-align:center;font-size:15px!important;color:var(--soft)}
@media print{
 body.hj-tprint>*:not(#tn){display:none!important}
 body.hj-tprint #tn{position:static!important;display:block!important;background:none!important;padding:0!important;inset:auto!important}
 body.hj-tprint #tn .panel{width:auto!important;max-height:none!important;overflow:visible!important;box-shadow:none!important;border:0!important;border-radius:0!important;padding:0!important;transform:none!important;animation:none!important}
 body.hj-tprint .hj-tbar,body.hj-tprint #tnClose{display:none!important}
 body.hj-tprint{background:#fff!important;color:#000}
 body.hj-tprint #tn .panel{padding:16mm!important}
}
/* 수업을 마쳤을 때 고르는 창 */
#hj-done{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:rgba(42,34,28,.38);backdrop-filter:blur(3px);animation:hjfade .2s ease}
@keyframes hjfade{from{opacity:0}to{opacity:1}}
#hj-done .hj-dp{width:min(560px,100%);background:var(--paper,#fff);color:var(--ink,#2A221C);border-radius:24px;padding:30px 28px 24px;text-align:center;box-shadow:0 30px 60px -24px rgba(40,25,10,.5);font-family:'Gowun Dodum',sans-serif;word-break:keep-all}
#hj-done .hj-dok{display:inline-grid;place-items:center;width:60px;height:60px;border-radius:18px;background:color-mix(in srgb,#7FB89A 22%,var(--paper,#fff));color:#3F7A5C}
#hj-done .hj-dok svg{width:32px;height:32px}
#hj-done h2{font-family:'Jua',sans-serif;font-size:clamp(26px,3vw,32px);margin:12px 0 4px;letter-spacing:-.03em}
#hj-done .hj-dl{margin:0 0 20px;color:var(--soft,#5C5047);font-size:17px}
#hj-done .hj-dn{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;text-align:left;text-decoration:none;color:#fff;background:var(--ink,#2A221C);border-radius:18px;padding:16px 20px}
#hj-done .hj-dn small{grid-column:1;font-size:14px;opacity:.75;font-weight:600}
#hj-done .hj-dn b{grid-column:1;font-size:clamp(18px,2vw,21px);line-height:1.4}
#hj-done .hj-dn svg{grid-column:2;grid-row:1/3;width:26px;height:26px}
#hj-done .hj-dn:hover{filter:brightness(1.15)}
#hj-done .hj-dlast{margin:0;padding:14px;border-radius:16px;background:var(--bg,#FFFCF8);color:var(--soft,#5C5047);font-size:17px}
#hj-done .hj-drow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
#hj-done .hj-db{flex:1 1 200px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 17px/1.2 'Gowun Dodum',sans-serif;color:var(--ink,#2A221C);background:var(--paper,#fff);border:1.5px solid var(--line,#EFE3D6);border-radius:999px;padding:12px 16px;text-decoration:none;cursor:pointer}
#hj-done .hj-db:hover{background:var(--bg,#FFFCF8)}
#hj-done .hj-db svg{width:20px;height:20px}
#hj-done :focus-visible{outline:3px solid #E0A458;outline-offset:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #hj-done .hj-dn{background:#F2EBE3;color:#221E1A}}
:root[data-theme="dark"] #hj-done .hj-dn{background:#F2EBE3;color:#221E1A}
html body .hj-pl{display:none}
@media print{body.hj-tprint .hj-pl{display:block;text-align:center;font-size:14px!important;color:#555;margin:0 0 4px}}
/* 사진 출처 줄이 화면 밖으로 넘치지 않게 */
html body #phc{white-space:normal!important;overflow-wrap:anywhere;max-width:min(1100px,100%);text-align:center;line-height:1.6;opacity:.85}
/* 홍지희 선생님 버전(SOOP) 첫 화면: 차분하고 읽기 쉽게 */
html body #cBadge{background:color-mix(in srgb,var(--sc) 14%,var(--paper));color:color-mix(in srgb,var(--sc) 78%,var(--ink));font-weight:700;font-size:clamp(15px,1.3vw,18px);padding:5px 14px;letter-spacing:-.01em}
html body #cover:has(#cBadge) .title{font-size:clamp(30px,min(4vw,7vh),52px);line-height:1.25}
html body #cBq{border:0;border-left:5px solid color-mix(in srgb,var(--sc) 55%,var(--paper));background:color-mix(in srgb,var(--sc) 6%,var(--paper));border-radius:16px;padding:14px 22px;text-align:left;box-shadow:none}
html body #cBq>*:first-child:not(b){font-size:15px!important;font-weight:700;color:var(--soft)}
html body #cBq b{display:block;font-weight:700;font-size:clamp(20px,2vw,27px);line-height:1.4;margin-top:2px}
html body #cGoal{border:0;border-left:5px solid #E8B36A;background:#FFF6E8;color:var(--ink);border-radius:16px;padding:12px 22px;font-weight:700;font-size:clamp(18px,1.7vw,23px);text-align:left;box-shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #cGoal{background:#3A3024}}
:root[data-theme="dark"] #cGoal{background:#3A3024}
html body #cMap{gap:10px}
html body #cMap .mcol{border:1px solid var(--line);border-top:3px solid color-mix(in srgb,var(--mc) 60%,var(--paper));border-radius:14px;padding:12px 12px 10px;box-shadow:none}
html body #cMap .mcol h3{font-size:clamp(15px,1.3vw,17px);font-weight:800;color:color-mix(in srgb,var(--mc) 80%,var(--ink));margin:0 0 4px}
html body #cMap .mcol a,html body #cMap .mcol .cur{font-size:clamp(14px,1.2vw,16px);line-height:1.45;padding:5px 8px;border-radius:8px}
html body #cMap .mcol a{color:var(--soft)}html body #cMap .mcol a:hover{background:var(--bg);color:var(--ink)}

/* 듣기 재생 막대 */
