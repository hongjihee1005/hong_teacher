<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5학년 미로찾기 · 쉬는 시간 · 초등교사 홍지희</title>
<meta name="description" content="5학년 쉬는 시간 미로찾기 300개(쉬움·보통·도전 100개씩)">
<style>:root{--bg:#FFF8F0;--paper:#fff;--ink:#2A221C;--soft:#5C5047;--line:#EADCCB;--acc:#C9661A;
 --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1A17;--paper:#2A2420;--ink:#F4ECE3;--soft:#CDBFB1;--line:#4A3F37}}
:root[data-theme="dark"]{--bg:#1E1A17;--paper:#2A2420;--ink:#F4ECE3;--soft:#CDBFB1;--line:#4A3F37}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:clamp(18px,2vw,22px);line-height:1.55;overflow-x:hidden}
body,h1,h2,h3,p,li,span,div,button,a,b{word-break:keep-all;overflow-wrap:break-word}
main{max-width:1180px;margin:0 auto;padding:clamp(14px,3vw,36px)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,4.6vw,52px);margin:4px 0 0;line-height:1.2}
.sub{color:var(--soft);margin:6px 0 14px}
button{font:inherit;color:inherit;cursor:pointer}
.mz-rules{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;padding:0;list-style:none}
.mz-rules li{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:clamp(15px,1.5vw,18px)}
.mz-prog{font-family:var(--display);color:var(--acc);margin:0 0 6px;font-size:clamp(18px,1.8vw,22px)}
#mzList h3{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.4vw,28px);margin:18px 0 8px}
#mzList h3 small{font-family:var(--body);font-size:15px;color:var(--soft);margin-left:8px}
.mz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.mz-q{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:8px 12px}
.mz-q:hover,.mz-q:focus-visible{border-color:var(--acc);outline:0}
.mz-q b{font-family:var(--display);font-weight:400;font-size:clamp(20px,2vw,24px);line-height:1.1}
.mz-q span{font-size:14px;line-height:1.35;color:var(--soft)}
.mz-q.done{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--paper))}
.mz-q.done::after{content:"✓";position:absolute;top:6px;right:10px;color:var(--acc);font-weight:700}
#mzPlay[hidden],#mzPick[hidden],[hidden]{display:none!important}
.mz-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 6px}
.mz-bar h2{flex:1 1 auto;margin:0;font-family:var(--display);font-weight:400;font-size:clamp(24px,2.8vw,34px)}
.mz-time{font-family:var(--display);font-size:clamp(20px,2vw,26px);color:var(--soft);font-variant-numeric:tabular-nums}
.mz-ask{margin:0 0 12px;font-size:clamp(20px,2.3vw,28px);font-weight:700;line-height:1.45}
.mz-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-size:clamp(15px,1.5vw,18px);font-weight:700}
.mz-btn:hover,.mz-btn:focus-visible{border-color:var(--ink);outline:0}
.mz-btn:disabled{opacity:.4;cursor:default}
.mz-btn[aria-pressed="true"],.mz-btn.go{background:var(--acc);border-color:var(--acc);color:#fff}
.mz-stage{--bw:min(680px,72vh,64vw);display:grid;grid-template-columns:var(--bw) minmax(0,1fr);gap:clamp(14px,2.4vw,30px);align-items:start}
.mz-board{width:var(--bw);height:var(--bw);background:#fff;border:3px solid var(--line);border-radius:18px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.mz-board svg{width:100%;height:100%;display:block}
.mz-board .mz-c{cursor:pointer}
.mz-board.shake{animation:mzshake .35s}
@keyframes mzshake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mz-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.mz-tools,.mz-nav{display:flex;flex-wrap:wrap;gap:8px}
.mz-msg{margin:0;min-height:1.5em;font-weight:700;color:var(--soft)}
.mz-msg.bad{color:#C6392F}
.mz-done{background:var(--paper);border:3px solid var(--acc);border-radius:20px;padding:14px 16px;text-align:center}
.mz-done b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(26px,2.8vw,34px);color:var(--acc)}
.mz-done div{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}
#mzSheet{display:none}
.creditbar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;margin-top:26px}
.tolist{display:none;align-items:center;gap:8px;font-family:var(--display,sans-serif);font-size:clamp(18px,1.8vw,22px);text-decoration:none;color:inherit;border:3px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 22px}
.tolist.on{display:inline-flex}
@media (max-width:820px){.mz-stage{--bw:min(100vw - 32px,600px);grid-template-columns:1fr}.mz-board{margin:0 auto}}
@media print{
 @page{margin:10mm}
 body{background:#fff}
 main>*:not(#mzSheet),.hj-nav,.hj-navbar,#hj-home{display:none!important}
 #mzSheet{display:block!important}
 #mzSheet svg{display:block;width:175mm;height:175mm;margin:4mm auto 0}
 #mzSheet p{font:13pt sans-serif;margin:0 0 3mm}
}

@media (prefers-color-scheme:light){html:root:not([data-theme="dark"]){--bg:#F6F5F1;--paper:#FFFFFF;--ink:#141A26;--soft:#4B5465;--muted:#4B5465;--line:#E3E0D8;--warmline:#E3E0D8}}
html:root[data-theme="light"]{--bg:#F6F5F1;--paper:#FFFFFF;--ink:#141A26;--soft:#4B5465;--muted:#4B5465;--line:#E3E0D8;--warmline:#E3E0D8}
@media (prefers-color-scheme:dark){html:root:not([data-theme="light"]){--bg:#0E131B;--paper:#151C27;--ink:#E8ECF3;--soft:#A7B1C2;--muted:#A7B1C2;--line:#253042}}
html:root[data-theme="dark"]{--bg:#0E131B;--paper:#151C27;--ink:#E8ECF3;--soft:#A7B1C2;--muted:#A7B1C2;--line:#253042}
html body{-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
html h1,html h2,html h3{letter-spacing:-.025em}
html:root{--night:#1E2D4A;--night2:#4B5465;--pine:#5C9A7C;--pine-soft:#E6F3EC}
/* ── 수업 세트 공통 틀(첫 화면·진행 화면) 다듬기: 얇은 선, 부드러운 그림자, 정돈된 글자 크기 ── */
html body .title{font-size:clamp(34px,min(4.8vw,8.5vh),66px);font-weight:800;letter-spacing:-.035em;line-height:1.2}
html body .lead{font-size:clamp(17px,1.6vw,22px);font-weight:600;color:var(--soft);letter-spacing:-.01em}
html body .qbox{background:var(--hjs-soft,color-mix(in srgb,#2B4A7C 8%,var(--paper)));border:0;border-left:8px solid transparent;border-radius:20px;font-size:clamp(20px,2.1vw,30px)!important;font-weight:700;line-height:1.55;
 box-shadow:0 1px 2px rgba(80,55,30,.05),0 16px 32px -22px rgba(80,55,30,.4)}
html body .stagebar{gap:8px}
html body .st{border-width:1.5px;font-size:clamp(15px,1.35vw,19px);font-weight:600;padding:6px 14px;background:var(--paper)}
html body .st.now{font-weight:700}
html body .seg{border:1.5px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(80,55,30,.05)}
html body .seg button{font-size:clamp(17px,1.55vw,22px);font-weight:600;padding:9px 16px}
html body .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
html body .row-label{font-size:clamp(17px,1.6vw,22px);font-weight:700;color:var(--soft)}
html body .big-btn{font-size:clamp(22px,2.3vw,32px);font-weight:800;letter-spacing:-.01em;padding:14px 48px;
 box-shadow:0 2px 4px rgba(40,25,10,.12),0 14px 26px -12px rgba(40,25,10,.5)}
html body .big-btn:active{transform:translateY(2px);box-shadow:0 1px 2px rgba(40,25,10,.2)}
html body .mid-btn{font-size:clamp(18px,1.7vw,24px);font-weight:700;padding:11px 28px;box-shadow:0 2px 4px rgba(40,25,10,.12),0 10px 20px -12px rgba(40,25,10,.45)}
html body .mid-btn:active{transform:translateY(2px);box-shadow:none}
html body .ghost-btn{border:1.5px solid var(--line);background:var(--paper);font-size:clamp(17px,1.6vw,22px);font-weight:700;padding:10px 24px}
html body .tnote{border-width:1.5px;border-radius:999px;font-size:clamp(16px,1.5vw,20px);font-weight:700;padding:9px 18px}
html body .tool{border-width:1.5px;border-radius:12px;font-size:19px;padding:7px 12px}
html body .chip{border-width:1.5px;font-weight:600}
html body .tolist{border-width:1.5px;font-size:clamp(16px,1.5vw,19px);font-weight:700;padding:9px 18px}
html body .goal{font-size:clamp(16px,1.5vw,21px);font-weight:600}
html body .hd{font-weight:800;letter-spacing:-.03em;font-size:clamp(26px,2.8vw,42px);line-height:1.35}
html body .overlay{background:rgba(42,34,28,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
html body .panel{border:0;border-radius:24px;box-shadow:0 30px 60px -24px rgba(40,25,10,.5)}
html body .panel h2{font-size:clamp(30px,3.6vw,50px);font-weight:800;letter-spacing:-.03em}
html body .panel .why{font-size:clamp(20px,2.1vw,30px)}
html body :is(.card1,.book,.rec,.pw,.opt2,.oi,.mw,.mm,.wf,.ln,.lkrow,.bglog span){border-width:2px}
html body :is(.card1,.book,.rec,.sumbox,.talk .q,.fl,.promise div){box-shadow:0 1px 2px rgba(80,55,30,.05),0 12px 26px -20px rgba(80,55,30,.35)}
html body .wf :is(textarea,input){border-width:1.5px}
html body .ex{border-width:1.5px}
html body .card1 .x,html body .mw,html body .book .pg,html body .sumbox b{font-weight:700}
html body .hjfoot{border-top-width:1.5px}
html body:has(.screen.on:not(#cover)) #hj-home{display:none}
/* 선생님 버전(S.O.O.P.) 틀 */

html body .goalbox{border-width:0;border-left:8px solid transparent;background:var(--hjs-soft,color-mix(in srgb,#2B4A7C 8%,var(--paper)));border-radius:16px;font-weight:700}
html body .ghost{border-width:1.5px;font-weight:700}
html body .plan>*,html body .steps>*{border-width:1.5px}
html body .badge{font-weight:800}
html body .ask{font-weight:600}

html body .hj-ic{display:inline-flex;align-items:center;justify-content:center;gap:.4em}
html body .hj-ionly{gap:0}
html body .tool.hj-hometool{border-radius:999px;padding:6px 15px 6px 12px;font-weight:700;font-size:17px;gap:6px}

html body .hj-cvtop .tolist{margin:0}
html body .hj-cvpanel{width:min(1100px,94vw);background:var(--paper);border:1.5px solid var(--line);border-radius:24px;padding:clamp(16px,2vw,26px) clamp(18px,2.4vw,30px);

html .hj-em{font-family:'HJ Emoji','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-weight:400;font-style:normal;font-synthesis:none;letter-spacing:0;-webkit-text-stroke:0;text-shadow:none}
/* 교사 안내 창 도구(인쇄·구글 문서·이메일) */
html body .hj-tbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px 0 4px;padding-top:18px;border-top:1px solid var(--line)}
html body .hj-tbar>button,html body .hj-mail button{display:inline-flex;align-items:center;gap:7px;font:700 16px/1.2 'Gowun Dodum',sans-serif;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;cursor:pointer}
html body .hj-tbar>button:hover,html body .hj-mail button:hover{background:var(--bg);border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
html body .hj-tbar .hj-i{width:18px;height:18px;flex:none}
html body .hj-mail{flex-basis:100%;display:grid;gap:8px;max-width:560px;margin:6px auto 0;text-align:left;background:var(--bg);border-radius:16px;padding:14px 16px}
html body .hj-mail[hidden]{display:none}
html body .hj-mail label{font-weight:700;font-size:16px}html body .hj-mail label small{font-weight:500;color:var(--soft);font-size:14px;margin-left:6px}
html body .hj-mail input{font:500 17px/1.4 'Gowun Dodum',sans-serif;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
html body .hj-mail div{display:flex;flex-wrap:wrap;gap:8px}html body .hj-mail p{margin:0;font-size:14px!important;color:var(--soft)}
html body .hj-toast{flex-basis:100%;margin:2px 0 0;min-height:1.3em;text-align:center;font-size:15px!important;color:var(--soft)}
@media print{
 body.hj-tprint>*:not(#tn){display:none!important}
 body.hj-tprint #tn{position:static!important;display:block!important;background:none!important;padding:0!important;inset:auto!important}
 body.hj-tprint #tn .panel{width:auto!important;max-height:none!important;overflow:visible!important;box-shadow:none!important;border:0!important;border-radius:0!important;padding:0!important;transform:none!important;animation:none!important}
 body.hj-tprint .hj-tbar,body.hj-tprint #tnClose{display:none!important}
 body.hj-tprint{background:#fff!important;color:#000}
 body.hj-tprint #tn .panel{padding:16mm!important}
}
/* 수업을 마쳤을 때 고르는 창 */
#hj-done{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:rgba(42,34,28,.38);backdrop-filter:blur(3px);animation:hjfade .2s ease}
@keyframes hjfade{from{opacity:0}to{opacity:1}}
#hj-done .hj-dp{width:min(560px,100%);background:var(--paper,#fff);color:var(--ink,#2A221C);border-radius:24px;padding:30px 28px 24px;text-align:center;box-shadow:0 30px 60px -24px rgba(40,25,10,.5);font-family:'Gowun Dodum',sans-serif;word-break:keep-all}
#hj-done .hj-dok{display:inline-grid;place-items:center;width:60px;height:60px;border-radius:18px;background:color-mix(in srgb,#7FB89A 22%,var(--paper,#fff));color:#3F7A5C}
#hj-done .hj-dok svg{width:32px;height:32px}
#hj-done h2{font-family:'Jua',sans-serif;font-size:clamp(26px,3vw,32px);margin:12px 0 4px;letter-spacing:-.03em}
#hj-done .hj-dl{margin:0 0 20px;color:var(--soft,#5C5047);font-size:17px}
#hj-done .hj-dn{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;text-align:left;text-decoration:none;color:#fff;background:var(--ink,#2A221C);border-radius:18px;padding:16px 20px}
#hj-done .hj-dn small{grid-column:1;font-size:14px;opacity:.75;font-weight:600}
#hj-done .hj-dn b{grid-column:1;font-size:clamp(18px,2vw,21px);line-height:1.4}
#hj-done .hj-dn svg{grid-column:2;grid-row:1/3;width:26px;height:26px}
#hj-done .hj-dn:hover{filter:brightness(1.15)}
#hj-done .hj-dlast{margin:0;padding:14px;border-radius:16px;background:var(--bg,#FFFCF8);color:var(--soft,#5C5047);font-size:17px}
#hj-done .hj-drow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
#hj-done .hj-db{flex:1 1 200px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 17px/1.2 'Gowun Dodum',sans-serif;color:var(--ink,#2A221C);background:var(--paper,#fff);border:1.5px solid var(--line,#EFE3D6);border-radius:999px;padding:12px 16px;text-decoration:none;cursor:pointer}
#hj-done .hj-db:hover{background:var(--bg,#FFFCF8)}
#hj-done .hj-db svg{width:20px;height:20px}
#hj-done :focus-visible{outline:3px solid #E0A458;outline-offset:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #hj-done .hj-dn{background:#F2EBE3;color:#221E1A}}
:root[data-theme="dark"] #hj-done .hj-dn{background:#F2EBE3;color:#221E1A}
html body .hj-pl{display:none}
@media print{body.hj-tprint .hj-pl{display:block;text-align:center;font-size:14px!important;color:#555;margin:0 0 4px}}
/* 사진 출처 줄이 화면 밖으로 넘치지 않게 */
html body #phc{white-space:normal!important;overflow-wrap:anywhere;max-width:min(1100px,100%);text-align:center;line-height:1.6;opacity:.85}
/* 홍지희 선생님 버전(SOOP) 첫 화면: 차분하고 읽기 쉽게 */
html body #cBadge{background:color-mix(in srgb,var(--sc) 14%,var(--paper));color:color-mix(in srgb,var(--sc) 78%,var(--ink));font-weight:700;font-size:clamp(15px,1.3vw,18px);padding:5px 14px;letter-spacing:-.01em}
html body #cover:has(#cBadge) .title{font-size:clamp(30px,min(4vw,7vh),52px);line-height:1.25}
html body #cBq{border:0;border-left:5px solid color-mix(in srgb,var(--sc) 55%,var(--paper));background:color-mix(in srgb,var(--sc) 6%,var(--paper));border-radius:16px;padding:14px 22px;text-align:left;box-shadow:none}
html body #cBq>*:first-child:not(b){font-size:15px!important;font-weight:700;color:var(--soft)}
html body #cBq b{display:block;font-weight:700;font-size:clamp(20px,2vw,27px);line-height:1.4;margin-top:2px}
html body #cGoal{border:0;border-left:5px solid transparent;background:var(--hjs-soft,color-mix(in srgb,#2B4A7C 8%,var(--paper)));color:var(--ink);border-radius:16px;padding:12px 22px;font-weight:700;font-size:clamp(18px,1.7vw,23px);text-align:left;box-shadow:none}
html body #cMap{gap:10px}
html body #cMap .mcol{border:1px solid var(--line);border-top:3px solid color-mix(in srgb,var(--mc) 60%,var(--paper));border-radius:14px;padding:12px 12px 10px;box-shadow:none}
html body #cMap .mcol h3{font-size:clamp(15px,1.3vw,17px);font-weight:800;color:color-mix(in srgb,var(--mc) 80%,var(--ink));margin:0 0 4px}
html body #cMap .mcol a,html body #cMap .mcol .cur{font-size:clamp(14px,1.2vw,16px);line-height:1.45;padding:5px 8px;border-radius:8px}
html body #cMap .mcol a{color:var(--soft)}html body #cMap .mcol a:hover{background:var(--bg);color:var(--ink)}
html body #cMap .mcol .cur{background:color-mix(in srgb,var(--mc) 13%,var(--paper));color:color-mix(in srgb,var(--mc) 70%,var(--ink))!important;font-weight:700}
/* 듣기 재생 막대 */
#hj-player{position:fixed;left:50%;bottom:clamp(84px,11vh,110px);transform:translateX(-50%);z-index:9000;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;
 max-width:calc(100vw - 24px);background:var(--paper,#fff);color:var(--ink,#2A221C);border:1px solid var(--line,#EFE3D6);border-radius:999px;padding:6px 6px 6px 16px;
 box-shadow:0 14px 34px -14px rgba(40,25,10,.4);font-family:'Gowun Dodum',sans-serif;word-break:keep-all}
#hj-player[hidden]{display:none}
#hj-player .hj-pl-l{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--soft,#5C5047);margin-right:4px}

#hj-player button{display:inline-flex;align-items:center;gap:6px;font:700 16px/1.2 'Gowun Dodum',sans-serif;color:var(--ink,#2A221C);background:var(--bg,#FFFCF8);border:1px solid var(--line,#EFE3D6);border-radius:999px;padding:9px 14px;cursor:pointer;min-height:42px}

#hj-player [data-k=pp]{background:var(--ink,#2A221C);color:var(--paper,#fff);border-color:transparent}
#hj-player .hj-pl-x{padding:9px;background:none;border-color:transparent}
#hj-player[data-st=play] .hj-pl-l .hj-i{animation:hjpulse 1.2s ease-in-out infinite}

@media print{#hj-player{display:none!important}}
/* 첫 화면 단추 배치: 교사용 도구는 위 오른편, 수업 시작은 가운데 홀로 */

}

/* 자료 출처 한 줄 */
html body .hj-src{font-size:13.5px!important;line-height:1.5;color:var(--muted);text-align:center;margin:10px auto 0;max-width:60em;word-break:keep-all}
/* 과학 한 화면 보기: 글의 위계 — 이름표·제목 한 줄, 활동 제목 크게, 안내 글 작게, 할 일 문장은 크게 */
html body.ov section .hj-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 12px;margin:0 0 6px}
html body.ov section .hj-head>.stage{display:inline-block!important;margin:0!important}
html body.ov section .hj-head>h2{margin:0!important}
html body.ov section .fitbox:has(> h3:not(.ovhide)) .hj-head>h2{font-size:clamp(17px,1.35vw,20px)!important;color:var(--soft)!important;font-weight:700!important}
html body.ov section .fitbox>h3{font-size:clamp(22px,1.9vw,28px)!important;font-weight:800!important;color:var(--ink)!important;margin:6px 0 4px!important}
html body.ov section .fitbox>p.hj-guide{font-size:clamp(16px,1.25vw,19px)!important;line-height:1.6;color:var(--soft)!important;max-width:52em;margin:2px auto 6px!important}
html body.ov section .fitbox>p.hj-guide b{color:var(--ink)}
html body.ov section .fitbox>p.hj-task{font-size:clamp(19px,1.6vw,24px)!important;font-weight:700!important;line-height:1.5;color:var(--ink)!important;text-align:left!important;
 background:var(--hjs-soft,#F3EEE6);border-left:6px solid var(--hjs,#8a7a66);border-radius:12px;padding:10px 16px!important;margin:6px 0 10px!important;text-wrap:pretty}
html body.ov section .fitbox>p.hj-task b{color:var(--hjs,var(--ink))}
/* 스스로 평가 표: 얼굴 칸은 좁게, 글 칸은 넓게 */
html body.ov section table td:has(> button){width:1%;white-space:nowrap}
/* 문제 보기(모든 교과): ①②③④ 번호, 보기가 모두 짧으면 가운데 정렬 / 문장이면 왼쪽 정렬 (content.js가 hj-short·hj-long을 붙임) */
@counter-style hjcirc{system:fixed;symbols:'①' '②' '③' '④' '⑤' '⑥' '⑦' '⑧' '⑨' '⑩';suffix:' '}
html body .hj-optg{counter-reset:hjo}
html body .hj-optg>button{counter-increment:hjo;display:flex!important;align-items:center;gap:.45em}
html body .hj-optg>button::before{content:counter(hjo,hjcirc);font-weight:800;color:var(--hjs,var(--ink));flex:none}
html body .hj-optg.hj-long>button{text-align:left!important;justify-content:flex-start!important;align-items:baseline!important;padding-left:18px!important;padding-right:16px!important}
html body .hj-optg.hj-short>button{text-align:center!important;justify-content:center!important}

/* 홍지희 버전: 활동 이름표 + 질문 제목 한 줄 */
html body #lesson .hj-head2{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 14px;margin:0 auto}
html body #lesson .hj-head2>.sthead{margin:0!important;flex:none}
html body #lesson .hj-head2>#hd{margin:0!important}
/* 홍지희 버전 첫 화면: 주제 프로젝트 지도 이름표, 오늘 표시 */
html body .hj-maplab{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:12px 0 6px;font-size:15px;color:var(--soft)}
html body .hj-maplab b{font-size:16.5px;color:var(--ink)}
html body .hj-maplab em{font-style:normal;font-weight:800;color:var(--hjs,var(--ink))}
html body #cMap .cur .hj-today{font-style:normal;display:inline-block;font-size:12.5px;font-weight:800;color:#fff;background:var(--hjs,#555);border-radius:999px;padding:1px 8px;margin-right:6px;vertical-align:1px}
/* 과학 앱 메뉴 자리 통일 (국어·사회와 같게) */
html.hj-scmenu body>nav .wrap{max-width:none!important;display:flex!important;align-items:center;gap:8px;flex-wrap:nowrap}
html.hj-scmenu body>nav .hj-sctools{margin-left:auto;display:flex;gap:6px;flex:none;padding-left:8px}
html.hj-scmenu body>nav .hj-sctools button{font-size:clamp(13.5px,1vw,15px)!important;min-height:34px!important;padding:5px 11px!important;border-radius:999px!important;background:var(--paper)!important;color:var(--ink)!important;border:1px solid var(--line)!important;white-space:nowrap}
html.hj-scmenu:has(#ovBar) #ovBar{position:fixed!important;left:0!important;right:0!important;bottom:0!important;width:auto!important;max-width:none!important;margin:0!important;transform:none!important;
 display:grid!important;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 22px 14px!important;background:linear-gradient(to top,var(--bg) 70%,transparent)!important;border:0!important;box-shadow:none!important;border-radius:0!important;pointer-events:none}
html.hj-scmenu #ovBar>*{pointer-events:auto}
html.hj-scmenu #ovBar #ovPos{grid-column:2;font-size:14px!important;color:var(--soft)}
html.hj-scmenu #ovBar .hj-pn{grid-column:3;justify-self:end;display:flex;gap:8px}
html.hj-scmenu #ovBar .hj-pn button{min-height:42px!important;font-size:clamp(15px,1.15vw,17px)!important;padding:8px 18px!important;border-radius:999px!important}
@media (max-width:820px){html.hj-scmenu body>nav .hj-sctools{position:fixed;left:10px;bottom:14px;z-index:30;padding:0;gap:4px}html.hj-scmenu body>nav .hj-sctools button{font-size:0!important;padding:8px 10px!important;min-height:40px!important}html.hj-scmenu body>nav .hj-sctools button .hj-i{width:18px;height:18px;margin:0}}
/* 번호 붙은 줄 내어쓰기 */
html body .hj-hang{display:flex!important;align-items:flex-start;gap:.35em}
html body .hj-hang>input{flex:none;margin-top:.15em}
html body .hj-hang>.hj-cn{flex:none;font-weight:700}
html body .hj-hang>.hj-ct{flex:1 1 auto;min-width:0}
html body .hj-hang .hj-paren{display:block;font-size:.92em;color:var(--soft)}
html body .hd>small.hj-sub2{display:block;margin-top:4px}
/* 사이트 '홈': 채운 집 모양 + 과목 색으로 눈에 띄게 (차시 처음 단추와 구분) */
html body .hj-nav a.hj-nh{background:#0F1C33!important;color:#fff!important;border-color:transparent!important}
html body .hj-nav a.hj-nh svg path{fill:currentColor;fill-opacity:.25}
/* 홍지희 버전: 위 메뉴줄과 본문 사이 여유 */
html body #lesson .topbar{margin-bottom:16px!important}
/* 홍지희 버전: 활동 내용이 아래로 처지지 않게 위쪽(질문 바로 아래)에 붙이고, 남는 공간은 아래로 */
html body #lesson .body{justify-content:flex-start!important}
html body #lesson .body>:first-child{margin-top:clamp(8px,3vh,36px)!important}
html body a.hj-homemini{display:inline-flex!important;align-items:center;gap:5px;text-decoration:none!important;background:#0F1C33!important;color:#fff!important;border:0!important;border-radius:999px;padding:5px 12px!important;min-height:34px;font:700 clamp(13.5px,1vw,15px)/1 Pretendard,sans-serif!important;white-space:nowrap}
html body a.hj-homemini .hj-i{width:16px;height:16px}
/* 보기에 긴 문장이 있으면 한 줄에 하나씩(가운데 폭에 맞춰) 보여 읽기 쉽게 */

/* 홍지희 버전 자료 카드: 제목 칸 · 가운데 사진 · 설명 · 출처 */
html body .mini .m.hj-v{flex-direction:column!important;align-items:stretch!important;gap:6px!important;padding:0 0 8px!important;overflow:hidden;text-align:center}
html body .mini .m.hj-v .hj-mh{background:color-mix(in srgb,var(--hjs,#888) 10%,var(--paper,#fff));border-bottom:2px solid color-mix(in srgb,var(--hjs,#888) 22%,var(--paper,#fff));padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
html body .mini .m.hj-v .hj-mh b{display:inline!important;font-size:clamp(15px,calc(var(--vw,1vw)*1.35),20px)!important}
html body .mini .m.hj-v .hj-mp{display:flex;justify-content:center;align-items:center;padding:2px 10px 0}
html body .mini .m.hj-v .hj-mp img{width:100%!important;height:clamp(84px,calc(var(--vh,1vh)*15),160px)!important;object-fit:cover;border-radius:10px}
html body .mini .m.hj-v .hj-mp .e{font-size:clamp(48px,calc(var(--vh,1vh)*9),84px)!important;width:auto!important;display:block!important;line-height:1.15}
html body .mini .m.hj-v .d{padding:0 10px;line-height:1.4}
html body :is(#lesson,#stage,#cover,main,body) .mini .m.hj-v small.hj-msrc{display:block;padding:0 10px;font-size:12.5px!important;line-height:1.3;color:var(--muted,var(--soft))}
html body .mini:has(.hj-v){grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))!important}
/* ===== 모든 교과 공통: 분류 카드(.card1)·분류 단추(.bins)·피드백(.fb) 너비와 색 통일 (2026-10-03) ===== */
html body .deck{width:min(1100px,94vw)!important;margin-left:auto;margin-right:auto;display:flex;flex-direction:column;align-items:stretch;gap:12px}
html body .deck>.card1,html body .deck>.bins,html body .deck>.fb{width:100%!important;max-width:none!important;box-sizing:border-box;margin-left:0!important;margin-right:0!important}
html body .card1,html body .bins{width:min(1100px,94vw)!important;box-sizing:border-box}
html body .deck>.ask{margin:0;text-align:center}
/* 분류 단추: 원색을 톤 다운, 모서리·그림자 통일 */
html body .bin{background:color-mix(in srgb,var(--cc,#888) 72%,#6d655d)!important;color:#fff!important;border:0!important;border-radius:18px!important;box-shadow:0 4px 0 color-mix(in srgb,var(--cc,#888) 55%,#3d3631)!important}
/* 분류 단추 이름은 가로·세로 모두 가운데 (2026-10-09, bin 가운데) */
html body .bin{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important}
html body .self .seg button{justify-content:center!important;text-align:center}
html body .bin:hover:not(:disabled){filter:brightness(1.05)}
html body .bin:disabled{opacity:.55;box-shadow:none!important;transform:translateY(3px)}
html body .bin.lit{opacity:1!important;outline:4px solid color-mix(in srgb,var(--cc,#888) 40%,#fff);outline-offset:2px}
/* 국어 기억 카드 앞면도 같은 톤 */
html body .rc .front{background:color-mix(in srgb,var(--cc,#888) 72%,#6d655d)!important}
/* 피드백 띠: 카드와 같은 흰 바탕 + 왼쪽 색 줄 + 오른쪽 '다음' 단추 */
html body .fb.on{display:flex!important;align-items:center;gap:10px 14px;flex-wrap:wrap;background:var(--paper,#fff)!important;border:2px solid var(--line,#e8dccb)!important;border-left:8px solid var(--ok,#1F9E63)!important;border-radius:16px!important;padding:12px 16px 12px 18px!important;box-shadow:0 1px 2px rgba(80,55,30,.05),0 12px 26px -20px rgba(80,55,30,.35);font-size:clamp(17px,1.6vw,22px);line-height:1.5;text-align:left;color:var(--ink)}
html body .fb.on.no{border-left-color:var(--no,#D64C5A)!important}
html body .fb.on.open{border-left-color:#C9862A!important}
html body .fb.on b{color:var(--ok,#1F9E63)}html body .fb.on.no b{color:var(--no,#D64C5A)}html body .fb.on.open b{color:#B07020}
html body .fb.on #nx,html body .fb.on button{margin-left:auto!important;background:var(--hjs,#555)!important;color:#fff!important;border:0!important;border-radius:999px!important;padding:8px 20px!important;font-weight:800!important;font-size:clamp(16px,1.5vw,20px)!important;box-shadow:0 3px 0 color-mix(in srgb,var(--hjs,#555) 60%,#000)!important;white-space:nowrap}
/* ===== 수학: 머리줄을 밝게(오른쪽 위 글자가 보이게), 계단 이동 단추 한 줄 (2026-10-03) ===== */
html[data-hjsubj="math"] body header.top{background:var(--paper)!important;color:var(--ink)!important;border-bottom:2px solid var(--line)!important;box-shadow:none!important}
html[data-hjsubj="math"] body header.top .brand,html[data-hjsubj="math"] body header.top .who{color:var(--ink)!important}
html[data-hjsubj="math"] body header.top .chip{background:var(--paper)!important;color:var(--ink)!important;border:1.5px solid var(--line)!important;font-weight:700}
html[data-hjsubj="math"] body header.top .chip.btn:hover{background:var(--bg)!important}
html[data-hjsubj="math"] body header.top .hj-nav .hj-lbtn{color:var(--ink)!important;background:var(--paper)!important;border-color:var(--line)!important}
html body main .actions:has(.hj-nextst){display:flex!important;flex-wrap:wrap;align-items:center;gap:.6em}
html body main .actions:has(.hj-nextst)>*{order:5}
html body main .actions:has(.hj-nextst)>button.big:not(.hj-prevst):not(.hj-nextst){order:1}
html body main.lesson .actions:has(.hj-nextst)>button.big.hj-prevst,html body main .actions:has(.hj-nextst)>.hj-prevst{order:2;margin-left:auto!important;background:#fff!important;color:#3A2E25!important;border:2px solid var(--line,#e8dccb)!important;box-shadow:none!important}
html body main .actions:has(.hj-nextst)>.hj-nextst{order:3}
html body main .actions:has(.hj-nextst)>.hj-prevst::before{content:'← ';}
html body main .actions:has(.hj-nextst)>.hj-nextst::after{content:' →';}
/* 단계 표시 통일: 동그라미 번호 + 지금 단계만 이름 */
html body .screen:not(#cover) .topbar .st[data-hjst]:not(.now) .hj-stt{display:none}
html body .screen:not(#cover) .topbar .st[data-hjst]:not(.now){padding-left:9px!important;padding-right:9px!important;min-width:32px}
html body .st[data-hjst] .hj-stt,html body .hj-sttabs>a[data-hjst] .hj-stt{margin-left:.35em}
html body .hj-sttabs>a[data-hjst]:not(.hj-cur) .hj-stt{display:none}
html body .hj-sttabs>a[data-hjst]{min-width:30px;text-align:center}
html body .hj-sttabs>a[data-hjst].hj-cur{background:var(--hjs,#1F8060)!important;color:#fff!important;outline:0!important;border-color:transparent!important;font-weight:700}
/* 수업 진행 화면에서는 이메일·유튜브 줄을 숨김(첫 화면에만) — 과학 앱 한 화면 보기 */
html body.ov>.hj-contact,html body.ov>p.made,html body.ov>.made{display:none!important}

/* 2026-10-03 선생님 요청: 수업 앱(첫 화면·진행 화면)에는 이메일·유튜브 줄을 숨김. 메뉴 페이지(첫 화면~학기 목록)에는 그대로 보임(메뉴는 이 덮개를 쓰지 않음). 우리 반 교실(class)은 제외 */
html body:not(.mix) .hj-contact,html body:not(.mix) .hj-contact.hj-cvc{display:none!important}
html body .frameline{display:flex!important;flex-wrap:wrap;justify-content:center;align-items:baseline;column-gap:.3em;row-gap:.2em}html body .frameline input{max-width:100%;text-align:center}

/* ===== 메뉴와 한 제품으로 (2026-10-27, 디자이너 셋 토의 결론) =====
   크기·높이·테두리 굵기·간격은 바꾸지 않음(과학 한 화면 196개 앱의 쪽 나눔·--hj-navh 보호). 색·선·그림자만. 인쇄에는 적용하지 않음. */
:where(button,input,select,textarea){font-family:inherit}
@media screen{
 /* 과목 선: 화면 맨 위 3px(자리를 차지하지 않고 누르기도 통과, 겹창(9000대) 아래) */
 html[data-hjsubj]::before{content:"";position:fixed;left:0;right:0;top:0;height:3px;background:var(--hjs);z-index:60;pointer-events:none}
 /* 과학 위 막대: 흰 바탕 + 가는 중립 선(굵기 그대로) */
 html:has(#ovBar) body>nav{background:var(--paper)!important;border-bottom-color:var(--line)!important}
 /* 수학 앱 아래 흰 띠: 바탕을 메뉴 바탕으로 */
 html[data-hjsubj="math"]:has(header.top) body{background:var(--bg)!important}
 /* 단계 번호: 지금 단계만 과목 색, 나머지는 테두리·바탕 없이 번호만(굵기는 그대로라 크기 변화 없음) */
 html body .screen:not(#cover) .topbar .st:not(.now),html body .hj-sttabs>a[data-hjst]:not(.hj-cur){border-color:transparent!important;background:transparent!important;box-shadow:none!important;color:var(--soft)!important}

<script>/* 미로 생성기 — 같은 학년·번호면 언제나 같은 미로. 화면 400×400.

   벽 미로: 벽을 허문 통로로만 이동 / 조건 미로: 벽 없이 조건에 맞는 칸만(set) 또는 정해진 순서대로(seq) 이동 */
var MZ = (function () {
  var PI = Math.PI;
  function rng(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; var t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
  function ri(r, a, b) { return a + Math.floor(r() * (b - a + 1)) }
  function pick(r, a) { return a[Math.floor(r() * a.length)] }
  function shuf(r, a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t } return a }
  function f(n) { return Math.round(n * 10) / 10 }

  /* ── 모양 틀(마스크): u,v ∈ [-1,1] ── */
  function inPoly(u, v, P) { var c = false; for (var i = 0, j = P.length - 1; i < P.length; j = i++) { if ((P[i][1] > v) !== (P[j][1] > v) && u < (P[j][0] - P[i][0]) * (v - P[i][1]) / (P[j][1] - P[i][1]) + P[i][0]) c = !c } return c }
  var STAR = []; for (var k = 0; k < 10; k++) { var a = -PI / 2 + k * PI / 5, rr = k % 2 ? .42 : 1; STAR.push([rr * Math.cos(a), rr * Math.sin(a) + .08]) }
  var MASKS = {
    circle: ['동그라미', function (u, v) { return u * u + v * v <= .97 }],
    heart: ['하트', function (u, v) { var x = u * 1.15, y = -v * 1.15 + .25; return Math.pow(x * x + y * y - 1, 3) - x * x * y * y * y <= 0 }],

    diamond: ['다이아몬드', function (u, v) { return Math.abs(u) + Math.abs(v) <= 1.02 }],
    cross: ['십자', function (u, v) { return (Math.abs(u) < .38 || Math.abs(v) < .38) && Math.abs(u) <= 1 && Math.abs(v) <= 1 }],

  function tile(kind, n, mask) {

/* ===== 수학 앱(교과서·이야기 버전, #app) — 같은 껍데기 (2026-10-27) =====

   · 오른쪽 '이 계단 안내'(계단 이름 · S.O.O.P. · 탐구 질문 · 이야기 · 차시 지도로/주소 복사 · 도움 · 다음 계단 · 맞음/틀림 알림). */
(function(){
 var D=document,H=D.documentElement,app=D.getElementById('app');

 function ico(k){var s=D.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('class','hs-ico');s.setAttribute('aria-hidden','true');var p=D.createElementNS(NS,'path');p.setAttribute('d',P[k]);s.appendChild(p);return s}
 function el(t,c,txt){var e=D.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
 function clean(t){return (t||'').replace(/[\u{1F000}-\u{1FAFF}☀-➿⬀-⯿⌀-⏿️‍]/gu,'').replace(/\s+/g,' ').trim()}

 function arrange(){var M=app.querySelector('main.lesson');if(!M||M.classList.contains('hs-ml'))return;

  var n=path.children.length,cur=[].findIndex.call(path.children,function(b){return b.classList.contains('cur')});

  var sc=work.querySelector(':scope>.scene');if(sc){sc.classList.add('hs-mscene');pan.appendChild(sc)}

  /* v6 왼쪽 '수업 길'(2026-10-29): 탐구 질문·개념 정리·이 차시 + 세로 계단 목록(실제 계단 단추), 아래 막대 = 도구 · 이전/다음 계단 */
  var rail=el('aside','hs-rail hs-mrail'),fold=el('button','hs-fold');fold.type='button';fold.onclick=function(){setR(!H.classList.contains('hs-rc'),true)};rail.appendChild(fold);

 function setR(c,save){H.classList.toggle('hs-rc',c);[].forEach.call(D.querySelectorAll('.hs-fold'),function(f){f.setAttribute('aria-expanded',c?'false':'true');f.title=c?'수업 길 펼치기':'수업 길 접기';

 /* 큰 화면: 앱 막대·단계 길·머리띠·오른쪽 판을 1280 기준으로 비례해 키움(활동은 앱이 스스로 맞춤) */

(function(){var D=document,H=D.documentElement;if(!D.getElementById('ovBar')||H.classList.contains('hs'))return;H.classList.add('hs-sci');
 /* v6 왼쪽 '수업 길'(2026-10-29 선생님: 과학 교과서도 같은 배치) — 쪽 나눔이 바뀌지 않게 본문 폭(1080px)을 줄이지 않는 자리에서만:
    넓은 화면(1340px~)은 펼치거나 접기(기기에 기억 hj-rail), 1150~1339px은 접힌 64px(펼치면 본문 위에 떠서 열림), 그보다 좁으면 없음(위 단계 탭 그대로).
    단계는 위 막대의 단계 탭을 그대로 누름(탭은 높이를 지키려고 감추기만 함) */
 var tabs=[].slice.call(D.querySelectorAll('body>nav .wrap>a[href^="#s"]'));if(!tabs.length)return;
 var NS='http://www.w3.org/2000/svg';function ico(d){var v=D.createElementNS(NS,'svg');v.setAttribute('viewBox','0 0 24 24');v.setAttribute('class','hs-ico');v.setAttribute('aria-hidden','true');var q=D.createElementNS(NS,'path');q.setAttribute('d',d);v.appendChild(q);return v}
 function el(t,c,x){var e=D.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
 var rail=el('aside','hs-srail'),fold=el('button','hs-fold');fold.type='button';rail.setAttribute('aria-label','수업 길');
 var goal=D.querySelector('main p.goal'),gt='';if(goal){var tmp=el('div');tmp.innerHTML=goal.innerHTML.replace(/<br\s*\/?>/gi,' ');gt=tmp.textContent.replace(/\s+/g,' ').replace(/^\s*🎯?\s*학습 목표\s*/,'').trim()}
 rail.appendChild(fold);
 if(gt){var g=el('div','hs-sgoal');g.appendChild(el('small','','학습 목표'));g.appendChild(el('p','',gt));rail.appendChild(g)}
 var list=el('ol','hs-slist'),items=tabs.map(function(a,i){var li=el('li'),b=el('button','hs-sst');b.type='button';b.title=(a.title||a.textContent).trim();

 function sync(){var cur=tabs.findIndex(function(a){return a.classList.contains('hj-cur')});items.forEach(function(b,i){b.classList.toggle('now',i===cur);b.classList.toggle('done',cur>-1&&i<cur);if(i===cur)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')})}

 function setR(c,save){H.classList.toggle('hs-rc',c);fold.setAttribute('aria-expanded',c?'false':'true');fold.title=c?'수업 길 펼치기':'수업 길 접기';fold.innerHTML='';fold.appendChild(ico(c?'M9 6l6 6-6 6':'M15 6l-6 6 6 6'));fold.appendChild(el('span','',c?'수업 길 펼치기':'수업 길 접기'));if(save)try{localStorage.setItem('hj-rail',c?'c':'')}catch(e){}}

 /* 위 막대 제목(2026-10-29: 다른 교과처럼 막대 왼쪽에 수업 제목 + 학년·단원 한 줄) — 숨긴 단계 탭 자리에 겹쳐 놓아 막대 높이·쪽 나눔은 그대로 */
 var nav=D.querySelector('body>nav'),tt=(D.title||'').split(/\s+·\s+/)[0].replace(/^\d+\.\s*/,'').trim();

  var room=function(){var r=nav.getBoundingClientRect().right,t=nav.querySelector('.hj-sctools')||nav.querySelector('.hj-nav');ttl.style.maxWidth=Math.max(120,(t?t.getBoundingClientRect().left:r)-24-16)+'px'};

/* 그 밖의 앱: 덮개가 본문 맨 위에 둔 [홈 · 자료 목록](.hj-navbar)을 남색 앱 막대로(맨 위 전체 폭) + 제목 */
(function(){var H=document.documentElement,D=document;
 var SKIP=/^(초등교사 홍지희|기타|프로젝트|공통|수학게임|특색교육)$/;
