<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4학년 일일수학 · 일일수학 · 수학게임 · 기타 · 초등교사 홍지희</title>
<meta name="description" content="초등 4학년 일일수학: 날마다 계산 10문제, 채점·도장 달력·학습지 인쇄">
<style>:root{--bg:#FFF8F0;--paper:#fff;--ink:#2A221C;--soft:#5C5047;--line:#EADCCB;--acc:#D9731A;--acc2:color-mix(in srgb,var(--acc) 14%,#fff);
 --okc:#1F8A55;--noc:#C8402F;--keyc:#C8402F;
 --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1A17;--paper:#2A2420;--ink:#F4ECE3;--soft:#CDBFB1;--line:#4A3F37;--acc2:color-mix(in srgb,var(--acc) 26%,#2A2420);--okc:#5CC98F;--noc:#F08A7A;--keyc:#F08A7A}}
:root[data-theme="dark"]{--bg:#1E1A17;--paper:#2A2420;--ink:#F4ECE3;--soft:#CDBFB1;--line:#4A3F37;--acc2:color-mix(in srgb,var(--acc) 26%,#2A2420);--okc:#5CC98F;--noc:#F08A7A;--keyc:#F08A7A}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:clamp(17px,1.9vw,20px);line-height:1.6;overflow-x:hidden}
body,h1,h2,h3,p,li,span,div,button,a,small,b{word-break:keep-all;overflow-wrap:break-word}
main{max-width:1100px;margin:0 auto;padding:clamp(14px,3vw,36px)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,4.6vw,50px);margin:10px 0 0;line-height:1.2}
.sub{color:var(--soft);margin:6px 0 14px}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
section{margin:14px 0}
/* 영역 이동 */
.ar-nav{display:flex;flex-wrap:wrap;gap:6px}
.ar-nav a{text-decoration:none;color:inherit;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 13px;font-size:15px;font-weight:700}
.ar-nav a[aria-current]{background:var(--acc);border-color:var(--acc);color:#fff}
.ar-nav a.rk{margin-left:auto}
.ar-note{color:var(--soft);font-size:clamp(15px,1.5vw,18px);margin:6px 0 10px}
/* 단추 */
.ar-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.ar-bar.ctr{justify-content:center}
.ar-sp{flex:1}
.ar-lab{font-weight:700;color:var(--soft)}
.ar-grp{display:inline-flex;gap:6px;flex-wrap:wrap}
.ar-b{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:7px 16px;font-size:clamp(15px,1.5vw,18px);font-weight:700;min-height:44px}
.ar-b:hover,.ar-b:focus-visible{border-color:var(--ink);outline:0}
.ar-b.go{background:var(--acc);border-color:var(--acc);color:#fff}
.ar-b[aria-pressed="true"]{background:var(--acc2);border-color:var(--acc)}
.ar-b:disabled{opacity:.4;cursor:default}
/* 단계 목록 */
.ar-gh{font-family:var(--display);font-weight:400;font-size:clamp(24px,2.8vw,32px);margin:22px 0 8px;border-bottom:3px solid var(--line);padding-bottom:2px}
.ar-sl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.ar-sk{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px 14px;min-width:0}
.ar-sk:hover,.ar-sk:focus-visible{border-color:var(--acc);outline:0}
.ar-sk .no{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--acc2);color:var(--acc);font-weight:800;font-size:18px}
.ar-sk .tx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.ar-sk b{font-size:clamp(18px,1.9vw,21px);line-height:1.35}
.ar-sk small{color:var(--soft);font-size:15px;line-height:1.4}
.ar-sk .eg{margin-top:4px;font-size:15px;color:var(--soft);overflow:hidden}
.ar-sk .eg .ar-q{font-size:19px;min-height:0;gap:3px;justify-content:flex-start;color:var(--ink)}
.ar-sk .eg .ar-vt{font-size:15px}
.ar-sk .eg .ar-box{min-width:28px;height:24px}
.ar-sk .rec{font-style:normal;font-size:14px;color:var(--okc);font-weight:700}
/* 단계 보기 */
.ar-skno{margin:12px 0 0;color:var(--acc);font-weight:700}
.ar-skt{font-family:var(--display);font-weight:400;font-size:clamp(26px,3.2vw,38px);margin:0;line-height:1.25}
.ar-skt.sm{font-size:clamp(22px,2.6vw,30px)}
.ar-tabs{display:flex;gap:6px;margin:12px 0 4px;border-bottom:3px solid var(--line)}
.ar-tabs button{background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-3px;padding:8px 14px;font-weight:700;font-size:clamp(17px,1.7vw,20px);color:var(--soft)}
.ar-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
/* 연습 */
.ar-play{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:14px clamp(12px,3vw,28px) 18px}
.ar-prog{height:10px;border-radius:99px;background:var(--acc2);overflow:hidden}
.ar-prog i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.ar-stat{display:flex;gap:16px;justify-content:space-between;font-weight:700;color:var(--soft);margin:6px 0 0;font-size:16px}
.ar-ask{text-align:center;color:var(--soft);margin:10px 0 0;font-size:clamp(15px,1.5vw,18px)}
.ar-stage{display:flex;justify-content:center;align-items:center;min-height:clamp(150px,26vh,250px);padding:10px 0;font-size:clamp(34px,6vw,60px)}
.ar-stage .ar-q{font-size:inherit}
.ar-stage .ar-q.vt{font-size:.82em}
.ar-stage .ar-vt tr.va .ar-in{height:1.25em}
body.sk-open main>h1,body.sk-open main>.sub{display:none}
body.sk-open .ar-nav{margin-bottom:6px}
.ar-stage.shake{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.ar-msg{text-align:center;min-height:1.6em;font-weight:700;font-size:clamp(18px,2vw,24px);margin:0}
.ar-msg.ok{color:var(--okc)}.ar-msg.no{color:var(--noc)}.ar-msg.near{color:#B07020}
.ar-res{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:16px 20px;text-align:center}
.ar-res .big{font-family:var(--display);font-size:clamp(26px,3.4vw,38px);margin:4px 0}
.ar-res.pass{border-color:var(--okc)}.ar-res.fail{border-color:var(--noc)}
.ar-res h3{margin:14px 0 6px}
.ar-wr{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:center;padding:0;margin:0;list-style:none}
.ar-wr .ar-q{font-size:24px}
/* 문제 모양 */
.ar-q{display:inline-flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.22em;line-height:1.2;font-variant-numeric:tabular-nums}
.ar-q.tx{font-size:.62em;gap:0}
.ar-q.tx .ar-op{margin:0 .3em}
.ar-hint{display:inline-block;font-size:.55em;font-weight:700;color:var(--acc);border:1.5px solid currentColor;border-radius:999px;padding:0 .55em;line-height:1.5;white-space:nowrap}
.sh-ps .ar-hint{color:#5C5047}
.ar-nm{font-weight:700;white-space:nowrap}
.ar-op,.ar-pa{color:var(--soft);font-weight:700;padding:0 .04em}
.ar-pa{margin:0 -.12em}
.ar-tx{font-weight:600}
.ar-dots{color:var(--soft)}
.ar-fr{display:inline-flex;align-items:center;gap:.12em;font-weight:700;vertical-align:middle}
.ar-fd{display:inline-flex;flex-direction:column;align-items:center;font-size:.72em;line-height:1.1}
.ar-fd>span{padding:0 .18em}
.ar-fd>span:first-child{border-bottom:.08em solid currentColor}
.ar-key{color:var(--keyc);font-weight:800}
.ar-key .ar-fd>span:first-child{border-color:var(--keyc)}
.ar-box{display:inline-block;min-width:2.2em;height:1.15em;border:.06em solid var(--soft);border-radius:.14em;vertical-align:middle}
.ar-box.fbx{min-width:3.4em;height:1.9em}
.ar-circ{display:inline-grid;place-items:center;width:1.2em;height:1.2em;border:.06em solid var(--soft);border-radius:50%;font-weight:800;color:var(--acc);line-height:1}
.ar-line{display:inline-block;min-width:8em;border-bottom:.05em solid var(--soft);height:1em}
/* 입력 */
.ar-in{font:inherit;font-weight:800;color:var(--ink);background:var(--acc2);border:3px solid var(--acc);border-radius:.18em;text-align:center;padding:0 .1em;height:1.3em;width:3ch;max-width:100%;font-variant-numeric:tabular-nums}
.ar-in:focus{outline:3px solid color-mix(in srgb,var(--acc) 45%,transparent);outline-offset:2px;background:var(--paper)}
.ar-in:disabled{opacity:1;background:var(--paper)}
.ar-in.wide{width:12ch;font-size:.8em}
.ar-qr{display:inline-flex;align-items:center;gap:.15em}
.ar-fin{display:inline-flex;align-items:center;gap:.1em}
.ar-fin .fw{width:1.6em!important;height:1.5em}
.ar-fin.imp .fw{display:none}
.ar-fdi{display:inline-flex;flex-direction:column;align-items:center;gap:.06em}
.ar-fdi .ar-in{width:2.1em!important;height:1.05em;font-size:.7em}
.ar-fdi i{display:block;width:100%;border-top:.07em solid var(--ink)}
.ar-cmp{display:inline-flex;flex-direction:column;align-items:center;gap:.15em;vertical-align:middle}
.ar-cmpb{display:inline-flex;gap:.15em}
.ar-cb{font-size:.5em;font-weight:800;min-width:2.1em;min-height:1.6em;border:3px solid var(--line);background:var(--paper);border-radius:.35em}
.ar-cb:hover,.ar-cb:focus-visible{border-color:var(--acc);outline:0}
.ar-cb[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
/* 세로셈 */
.ar-q.vt{display:inline-block}
.ar-vt{border-collapse:collapse;font-weight:700;font-variant-numeric:tabular-nums;margin:0 auto}
.ar-vt td{width:.78em;text-align:center;padding:0 .04em;height:1.2em;line-height:1.2}
.ar-vt td.o{color:var(--soft);width:.9em}
.ar-vt td.pt{width:.3em}
.ar-vt tr.vl td{border-bottom:.07em solid var(--ink)}
.ar-vt tr.va td{padding-top:.12em;text-align:right}
.ar-vt tr.va .ar-in{width:100%!important;text-align:right;padding-right:.1em}
.ar-vt tr.vk td{color:var(--keyc)}
.ar-vt tr.vp td{height:1.5em}
.ar-vt tr.vp.tall td{height:3.4em}
/* 학습지 */
.ar-nos{display:flex;flex-wrap:wrap;gap:5px}
.ar-nos button{min-width:44px;min-height:40px;border:2px solid var(--line);background:var(--paper);border-radius:10px;font-weight:700}
.ar-nos button[aria-current="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.ar-wsv{overflow-x:auto}
.ar-wsv .ar-sheet{background:#fff;color:#2A221C;border:2px solid var(--line);border-radius:14px;padding:18px clamp(12px,3vw,30px);max-width:820px;margin:0 auto}
.ar-sheet{--soft:#5C5047;--keyc:#C8402F;--ink:#2A221C}
.sh-hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:6px 16px;border-bottom:2px solid #2A221C;padding-bottom:6px}
.sh-hd b{display:block;font-size:clamp(18px,2vw,22px)}
.sh-hd span{color:#5C5047;font-size:14px}
.sh-nm{font-size:15px}
.sh-nm i{display:inline-block;width:6.5em;border-bottom:1px solid #2A221C;margin-right:8px}
.sh-nm i.s{width:2.5em}
.sh-ask{margin:8px 0 4px;font-size:15px;color:#5C5047}
.sh-ps{display:grid;gap:4px 18px;padding:0;margin:0;list-style:none;counter-reset:q}
.sh-ps.c1{grid-template-columns:1fr}.sh-ps.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.sh-ps.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.sh-ps li{counter-increment:q;display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed #E2D6C8;font-size:clamp(19px,2.2vw,24px);min-width:0}
.sh-ps li::before{content:"(" counter(q) ")";font-size:.62em;color:#8A7D72;flex:none;min-width:2.1em}
.sh-ps.c3 li{align-items:flex-start;padding:10px 0 14px}
.sh-ps .ar-q{justify-content:flex-start}
.sh-ps .ar-q.tx{font-size:.8em}
.sh-ft{margin:10px 0 0;text-align:right;font-size:12px;color:#8A7D72}
@media (max-width:620px){.ar-nav a{font-size:13px;padding:3px 9px}#skBack,#skPrev,#skNext,#lvBack,#exBack{padding:5px 10px;font-size:14px;min-height:40px}.ar-bar{gap:6px}.ar-stage{font-size:clamp(28px,8.5vw,44px)}}
@media (max-width:620px){.sh-ps.c2,.sh-ps.c3{grid-template-columns:1fr}.ar-sl{grid-template-columns:1fr}}
/* 급수 시험 */
.ar-lvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ar-lv{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:14px 16px;border-top:8px solid var(--acc)}
.ar-lv:hover,.ar-lv:focus-visible{border-color:var(--acc);outline:0}
.ar-lv b{font-family:var(--display);font-weight:400;font-size:clamp(28px,3vw,36px);line-height:1.1}
.ar-lv .lv{font-weight:700;color:var(--acc)}
.ar-lv small{color:var(--soft);font-size:14px;line-height:1.4}
.ar-lv .rec{font-style:normal;font-size:14px;color:var(--okc);font-weight:700}
.ar-kinds{display:flex;flex-wrap:wrap;gap:6px}
.ar-kinds a{text-decoration:none;color:inherit;font-size:15px;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 11px}
.ar-kinds a:hover{border-color:var(--acc)}
.ar-h3{margin:20px 0 8px;font-size:clamp(20px,2.1vw,24px)}
.ar-rds{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.ar-rd{display:flex;flex-direction:column;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 6px}
.ar-rd b{font-size:20px}.ar-rd span{font-size:13px;color:var(--soft)}
.ar-rd.done{border-color:var(--noc)}
.ar-rd.pass{border-color:var(--okc);background:color-mix(in srgb,var(--okc) 10%,var(--paper))}
.ar-rd:hover,.ar-rd:focus-visible{border-color:var(--acc);outline:0}
.ar-time{font-weight:700;color:var(--soft)}
.ar-paper{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:10px clamp(10px,2.5vw,24px)}
.ex-ps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px;padding:0;margin:0;list-style:none;counter-reset:q}
.ex-ps li{counter-increment:q;position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:12px 0 12px 2.6em;border-bottom:1px dashed var(--line);font-size:clamp(22px,2.6vw,30px);min-width:0}
.ex-ps li::before{content:counter(q);position:absolute;left:0;top:14px;font-size:15px;font-weight:800;color:var(--soft);background:var(--acc2);border-radius:8px;min-width:1.9em;text-align:center}
.ex-ps .ar-q{justify-content:flex-start}
.ex-ps .ar-q.vt{font-size:.85em}
.ex-mk{position:absolute;left:-.1em;top:.9em;font-size:1.2em;pointer-events:none}
.ex-mk:empty{display:none}
.ex-ps li.ok::before,.ex-ps li.no::before{visibility:hidden}
.ex-ans,.ex-k{flex-basis:100%;font-size:.62em}
@media (max-width:700px){.ex-ps{grid-template-columns:1fr}}
/* 숫자판 */
.ar-kp{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:50;display:grid;grid-template-columns:repeat(3,62px);gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 12px 30px -12px rgba(40,25,10,.4)}
.ar-kp button{height:54px;border:2px solid var(--line);background:var(--bg);border-radius:12px;font-size:24px;font-weight:800;touch-action:manipulation}
.ar-kp button:active{background:var(--acc2)}
.ar-kp button.w{grid-column:span 3;height:46px;font-size:18px}
.ar-kp button.go{background:var(--acc);border-color:var(--acc);color:#fff}
body.kp-on main{padding-bottom:440px}
@media (min-width:1000px){body.kp-on main{padding-bottom:40px;padding-right:250px}}
/* 맨 아래 */
.creditbar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;margin-top:26px}
.tolist{display:none;align-items:center;gap:8px;font-family:var(--display,sans-serif);font-size:clamp(18px,1.8vw,22px);text-decoration:none;color:inherit;border:3px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 22px}
.tolist.on{display:inline-flex}
/* 일일수학 달력 (2026-10-07) */
.dy-dbar{align-items:center}.dy-date input{font:inherit;font-size:17px;border:2px solid var(--line);border-radius:10px;padding:4px 8px;background:var(--paper);color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.dy-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:560px}
.dy-wd{text-align:center;font-weight:700;color:var(--soft);font-size:14px}
.dy-day{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:52px;border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:2px;font-size:15px;line-height:1.15}
.dy-day small{font-size:12px;min-height:1.1em}
.dy-day.dy-done{background:color-mix(in srgb,var(--acc) 12%,var(--paper))}
.dy-day.dy-star{background:color-mix(in srgb,#E0A21A 26%,var(--paper));border-color:#E0A21A}
.dy-day.dy-td b{color:var(--acc);text-decoration:underline}
.dy-day.dy-cur{outline:3px solid var(--acc);outline-offset:1px}
#arOut{display:none}
@media print{
 @page{size:A4;margin:12mm}
 body{background:#fff;color:#000;font-size:11pt}
 main{padding:0;max-width:none}
 body>*:not(main),main>*:not(#arOut),.hj-nav,.hj-navbar,#hj-home,.ar-kp{display:none!important}
 #arOut{display:block!important}
 .ar-sheet{border:0;padding:0;break-after:page}
 .ar-sheet:last-child{break-after:auto}
 .sh-ps li{font-size:17pt;padding:2.6mm 0;break-inside:avoid}
 .sh-ps.c1 li{padding:4mm 0}
 .sh-ps.c3 li{padding:3mm 0 6mm}
 .sh-ps.exm li{font-size:15pt;padding:2mm 0}
 .sh-ps li .ar-q.vt{font-size:19pt}
 .ar-box{border-color:#555}
 /* 한 장을 꽉 채움: 문제 줄이 같은 높이로 늘어나 문제 아래에 계산할 자리가 생김(2026-10-07) */
 .ar-sheet{display:flex;flex-direction:column;min-height:268mm}
 .ar-sheet .sh-ps{flex:1 1 auto;grid-auto-rows:auto;align-content:stretch}
 .sh-ps li,.sh-ps.c3 li,.sh-ps.exm li{align-items:flex-start;padding-top:3mm}
 .sh-ps .ar-box{min-width:2.8em;height:1.45em;border-width:1.2pt}
 .sh-ps .ar-box.fbx{min-width:3.6em;height:2.1em}
}

@media (prefers-color-scheme:light){html:root:not([data-theme="dark"]){--bg:#FFFCF8;--paper:#FFFFFF;--ink:#2A221C;--soft:#5C5047;--muted:#5C5047;--line:#EFE3D6;--warmline:#EFE3D6}}
html:root[data-theme="light"]{--bg:#FFFCF8;--paper:#FFFFFF;--ink:#2A221C;--soft:#5C5047;--muted:#5C5047;--line:#EFE3D6;--warmline:#EFE3D6}
@media (prefers-color-scheme:dark){html:root:not([data-theme="light"]){--bg:#221E1A;--paper:#2B2621;--ink:#F2EBE3;--soft:#C9BCB0;--muted:#C9BCB0;--line:#43392F}}

html body{-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
html h1,html h2,html h3{letter-spacing:-.025em}

/* ── 수업 세트 공통 틀(첫 화면·진행 화면) 다듬기: 얇은 선, 부드러운 그림자, 정돈된 글자 크기 ── */
html body .title{font-size:clamp(34px,min(4.8vw,8.5vh),66px);font-weight:800;letter-spacing:-.035em;line-height:1.2}

html body .qbox{background:#FFF5E6;border:0;border-left:8px solid #F2B872;border-radius:20px;font-size:clamp(20px,2.1vw,30px)!important;font-weight:700;line-height:1.55;
 box-shadow:0 1px 2px rgba(80,55,30,.05),0 16px 32px -22px rgba(80,55,30,.4)}
@media (prefers-color-scheme:dark){html:root:not([data-theme="light"]) body .qbox{background:#3A3024;border-left-color:#C98A2A}}
html:root[data-theme="dark"] body .qbox{background:#3A3024;border-left-color:#C98A2A}
html body .stagebar{gap:8px}
html body .st{border-width:1.5px;font-size:clamp(15px,1.35vw,19px);font-weight:600;padding:6px 14px;background:var(--paper)}
html body .st.now{font-weight:700}
html body .seg{border:1.5px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(80,55,30,.05)}

html body .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
html body .row-label{font-size:clamp(17px,1.6vw,22px);font-weight:700;color:var(--soft)}
html body .big-btn{font-size:clamp(22px,2.3vw,32px);font-weight:800;letter-spacing:-.01em;padding:14px 48px;
 box-shadow:0 2px 4px rgba(40,25,10,.12),0 14px 26px -12px rgba(40,25,10,.5)}
html body .big-btn:active{transform:translateY(2px);box-shadow:0 1px 2px rgba(40,25,10,.2)}
html body .mid-btn{font-size:clamp(18px,1.7vw,24px);font-weight:700;padding:11px 28px;box-shadow:0 2px 4px rgba(40,25,10,.12),0 10px 20px -12px rgba(40,25,10,.45)}
html body .mid-btn:active{transform:translateY(2px);box-shadow:none}
html body .ghost-btn{border:1.5px solid var(--line);background:var(--paper);font-size:clamp(17px,1.6vw,22px);font-weight:700;padding:10px 24px}

html body .tool{border-width:1.5px;border-radius:12px;font-size:19px;padding:7px 12px}
html body .chip{border-width:1.5px;font-weight:600}
html body .tolist{border-width:1.5px;font-size:clamp(16px,1.5vw,19px);font-weight:700;padding:9px 18px}
html body .goal{font-size:clamp(16px,1.5vw,21px);font-weight:600}
html body .hd{font-weight:800;letter-spacing:-.03em;font-size:clamp(26px,2.8vw,42px);line-height:1.35}
html body .overlay{background:rgba(42,34,28,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}

html body .panel .why{font-size:clamp(20px,2.1vw,30px)}

html body .wf :is(textarea,input){border-width:1.5px}
html body .ex{border-width:1.5px}
html body .card1 .x,html body .mw,html body .book .pg,html body .sumbox b{font-weight:700}

html body .goalbox{border-width:0;border-left:8px solid #F2B872;background:#FFF5E6;border-radius:16px;font-weight:700}
@media (prefers-color-scheme:dark){html:root:not([data-theme="light"]) body .goalbox{background:#3A3024;border-left-color:#C98A2A}}

html body .ghost{border-width:1.5px;font-weight:700}
html body .plan>*,html body .steps>*{border-width:1.5px}
html body .badge{font-weight:800}
html body .ask{font-weight:600}

html body .hj-i{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-.2em}
html body .hj-ic{display:inline-flex;align-items:center;justify-content:center;gap:.4em}
html body .hj-ionly{gap:0}
html body .tool.hj-hometool{border-radius:999px;padding:6px 15px 6px 12px;font-weight:700;font-size:17px;gap:6px}

html body .hj-cv{gap:clamp(12px,2vh,22px)!important}
html body .hj-cvtop{width:min(1100px,94vw);display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;min-height:0}
html body .hj-cvtop .tolist{margin:0}
html body .hj-cvpanel{width:min(1100px,94vw);background:var(--paper);border:1.5px solid var(--line);border-radius:24px;padding:clamp(16px,2vw,26px) clamp(18px,2.4vw,30px);
 display:grid;gap:clamp(12px,1.6vh,18px);box-shadow:0 1px 2px rgba(80,55,30,.05),0 18px 40px -28px rgba(80,55,30,.45);text-align:left}
html body .hj-cvpanel>.qbox,html body .hj-cvpanel>.goalbox,html body .hj-cvpanel>.bq,html body .hj-cvpanel>.map{width:auto!important;margin:0!important;box-shadow:none}
html body .hj-cvpanel>.qbox{text-align:left}
html body .hj-field{display:grid!important;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:8px 14px;justify-content:stretch!important;margin:0;
 padding-top:clamp(10px,1.4vh,16px);border-top:1.5px dashed var(--line)}
html body .hj-field>.stagebar,html body .hj-field>.plan{justify-content:flex-start!important;margin:0}
html body .hj-flabel{font-size:clamp(15px,1.35vw,18px)!important;font-weight:800;color:var(--soft);white-space:nowrap}
html body .hj-field.row>:nth-child(n+3){grid-column:2;font-size:clamp(14px,1.25vw,17px);color:var(--soft)}
html body .hj-field .seg{justify-self:start}
html body .hj-cvacts{gap:14px}
@media (max-width:720px){html body .hj-field{grid-template-columns:1fr}html body .hj-field.row>:nth-child(n+3){grid-column:1}}

html body .hj-cvtop,html body .hj-cvpanel,html body .hj-cvacts{flex:none}
html body #cover{justify-content:safe center}

/* 교사 안내 창 도구(인쇄·구글 문서·이메일) */
html body .hj-tbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px 0 4px;padding-top:18px;border-top:1px solid var(--line)}
html body .hj-tbar>button,html body .hj-mail button{display:inline-flex;align-items:center;gap:7px;font:700 16px/1.2 'Gowun Dodum',sans-serif;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;cursor:pointer}
html body .hj-tbar>button:hover,html body .hj-mail button:hover{background:var(--bg);border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
html body .hj-tbar .hj-i{width:18px;height:18px;flex:none}
html body .hj-mail{flex-basis:100%;display:grid;gap:8px;max-width:560px;margin:6px auto 0;text-align:left;background:var(--bg);border-radius:16px;padding:14px 16px}
html body .hj-mail[hidden]{display:none}
html body .hj-mail label{font-weight:700;font-size:16px}html body .hj-mail label small{font-weight:500;color:var(--soft);font-size:14px;margin-left:6px}
html body .hj-mail input{font:500 17px/1.4 'Gowun Dodum',sans-serif;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
html body .hj-mail div{display:flex;flex-wrap:wrap;gap:8px}html body .hj-mail p{margin:0;font-size:14px!important;color:var(--soft)}
html body .hj-toast{flex-basis:100%;margin:2px 0 0;min-height:1.3em;text-align:center;font-size:15px!important;color:var(--soft)}
@media print{
 body.hj-tprint>*:not(#tn){display:none!important}
 body.hj-tprint #tn{position:static!important;display:block!important;background:none!important;padding:0!important;inset:auto!important}
 body.hj-tprint #tn .panel{width:auto!important;max-height:none!important;overflow:visible!important;box-shadow:none!important;border:0!important;border-radius:0!important;padding:0!important;transform:none!important;animation:none!important}
 body.hj-tprint .hj-tbar,body.hj-tprint #tnClose{display:none!important}
 body.hj-tprint{background:#fff!important;color:#000}
 body.hj-tprint #tn .panel{padding:16mm!important}
}
/* 수업을 마쳤을 때 고르는 창 */
#hj-done{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:rgba(42,34,28,.38);backdrop-filter:blur(3px);animation:hjfade .2s ease}
@keyframes hjfade{from{opacity:0}to{opacity:1}}
#hj-done .hj-dp{width:min(560px,100%);background:var(--paper,#fff);color:var(--ink,#2A221C);border-radius:24px;padding:30px 28px 24px;text-align:center;box-shadow:0 30px 60px -24px rgba(40,25,10,.5);font-family:'Gowun Dodum',sans-serif;word-break:keep-all}
#hj-done .hj-dok{display:inline-grid;place-items:center;width:60px;height:60px;border-radius:18px;background:color-mix(in srgb,#7FB89A 22%,var(--paper,#fff));color:#3F7A5C}
#hj-done .hj-dok svg{width:32px;height:32px}
#hj-done h2{font-family:'Jua',sans-serif;font-size:clamp(26px,3vw,32px);margin:12px 0 4px;letter-spacing:-.03em}
#hj-done .hj-dl{margin:0 0 20px;color:var(--soft,#5C5047);font-size:17px}
#hj-done .hj-dn{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;text-align:left;text-decoration:none;color:#fff;background:var(--ink,#2A221C);border-radius:18px;padding:16px 20px}
#hj-done .hj-dn small{grid-column:1;font-size:14px;opacity:.75;font-weight:600}
#hj-done .hj-dn b{grid-column:1;font-size:clamp(18px,2vw,21px);line-height:1.4}
#hj-done .hj-dn svg{grid-column:2;grid-row:1/3;width:26px;height:26px}
#hj-done .hj-dn:hover{filter:brightness(1.15)}
#hj-done .hj-dlast{margin:0;padding:14px;border-radius:16px;background:var(--bg,#FFFCF8);color:var(--soft,#5C5047);font-size:17px}
#hj-done .hj-drow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
#hj-done .hj-db{flex:1 1 200px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 17px/1.2 'Gowun Dodum',sans-serif;color:var(--ink,#2A221C);background:var(--paper,#fff);border:1.5px solid var(--line,#EFE3D6);border-radius:999px;padding:12px 16px;text-decoration:none;cursor:pointer}
#hj-done .hj-db:hover{background:var(--bg,#FFFCF8)}
#hj-done .hj-db svg{width:20px;height:20px}
#hj-done :focus-visible{outline:3px solid #E0A458;outline-offset:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #hj-done .hj-dn{background:#F2EBE3;color:#221E1A}}
:root[data-theme="dark"] #hj-done .hj-dn{background:#F2EBE3;color:#221E1A}
html body .hj-pl{display:none}
@media print{body.hj-tprint .hj-pl{display:block;text-align:center;font-size:14px!important;color:#555;margin:0 0 4px}}
/* 사진 출처 줄이 화면 밖으로 넘치지 않게 */
html body #phc{white-space:normal!important;overflow-wrap:anywhere;max-width:min(1100px,100%);text-align:center;line-height:1.6;opacity:.85}
/* 홍지희 선생님 버전(SOOP) 첫 화면: 차분하고 읽기 쉽게 */
html body #cBadge{background:color-mix(in srgb,var(--sc) 14%,var(--paper));color:color-mix(in srgb,var(--sc) 78%,var(--ink));font-weight:700;font-size:clamp(15px,1.3vw,18px);padding:5px 14px;letter-spacing:-.01em}
html body #cover:has(#cBadge) .title{font-size:clamp(30px,min(4vw,7vh),52px);line-height:1.25}
html body #cBq{border:0;border-left:5px solid color-mix(in srgb,var(--sc) 55%,var(--paper));background:color-mix(in srgb,var(--sc) 6%,var(--paper));border-radius:16px;padding:14px 22px;text-align:left;box-shadow:none}
html body #cBq>*:first-child:not(b){font-size:15px!important;font-weight:700;color:var(--soft)}

html body #cGoal{border:0;border-left:5px solid #E8B36A;background:#FFF6E8;color:var(--ink);border-radius:16px;padding:12px 22px;font-weight:700;font-size:clamp(18px,1.7vw,23px);text-align:left;box-shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #cGoal{background:#3A3024}}
:root[data-theme="dark"] #cGoal{background:#3A3024}
html body #cMap{gap:10px}
html body #cMap .mcol{border:1px solid var(--line);border-top:3px solid color-mix(in srgb,var(--mc) 60%,var(--paper));border-radius:14px;padding:12px 12px 10px;box-shadow:none}

html body #cMap .mcol a,html body #cMap .mcol .cur{font-size:clamp(14px,1.2vw,16px);line-height:1.45;padding:5px 8px;border-radius:8px}

html body #cMap .mcol .cur{background:color-mix(in srgb,var(--mc) 13%,var(--paper));color:color-mix(in srgb,var(--mc) 70%,var(--ink))!important;font-weight:700}
/* 듣기 재생 막대 */
#hj-player{position:fixed;left:50%;bottom:clamp(84px,11vh,110px);transform:translateX(-50%);z-index:9000;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;
 max-width:calc(100vw - 24px);background:var(--paper,#fff);color:var(--ink,#2A221C);border:1px solid var(--line,#EFE3D6);border-radius:999px;padding:6px 6px 6px 16px;
 box-shadow:0 14px 34px -14px rgba(40,25,10,.4);font-family:'Gowun Dodum',sans-serif;word-break:keep-all}
#hj-player[hidden]{display:none}
#hj-player .hj-pl-l{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--soft,#5C5047);margin-right:4px}
#hj-player .hj-pl-l b{font-weight:700}
#hj-player .hj-i{width:18px;height:18px;flex:none}
#hj-player button{display:inline-flex;align-items:center;gap:6px;font:700 16px/1.2 'Gowun Dodum',sans-serif;color:var(--ink,#2A221C);background:var(--bg,#FFFCF8);border:1px solid var(--line,#EFE3D6);border-radius:999px;padding:9px 14px;cursor:pointer;min-height:42px}
#hj-player button:hover:not(:disabled){border-color:color-mix(in srgb,var(--ink,#2A221C) 30%,var(--line,#EFE3D6))}

#hj-player [data-k=pp]{background:var(--ink,#2A221C);color:var(--paper,#fff);border-color:transparent}
#hj-player .hj-pl-x{padding:9px;background:none;border-color:transparent}
#hj-player[data-st=play] .hj-pl-l .hj-i{animation:hjpulse 1.2s ease-in-out infinite}
@keyframes hjpulse{50%{opacity:.35}}
@media print{#hj-player{display:none!important}}

html body #stage #body :is(.exp,.expq,.recall,.talk,.exs,.cmp,.grid2,.grid3){width:100%!important;max-width:100%!important}
html body #lesson .cols{grid-template-columns:repeat(var(--n,3),minmax(0,1fr))!important}
html body #lesson .col{min-width:0}
html body #lesson .col :is(input,textarea){min-width:0;width:100%}
html body #lesson .col .row,html body #lesson .col form{display:flex;gap:6px;min-width:0}
html body #lesson .body{max-width:100%}
html body .wg>h2{white-space:nowrap!important;flex-wrap:nowrap!important;text-wrap:nowrap!important}
html body .wg>h2 .ed{flex:none;font-size:.88rem!important;padding:.2rem .65rem!important;min-height:1.9rem}
/* ===== 폰·패드 세로 화면 ===== */
@media (max-width:820px){
 html body .screen:not(#cover) .topbar{flex-wrap:wrap!important;row-gap:6px}
 html body .screen:not(#cover) .topbar>:is(.steps,.stagebar){flex:1 1 100%;order:2}
 html body .screen:not(#cover) .topbar>.tools{flex:1 1 100%;order:1;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px}
 html body .screen.on>.topbar>.hj-nav{order:0}
 html body header.top{flex-wrap:wrap!important;row-gap:6px;height:auto!important}
 html body header.top .brand{min-width:0;flex:1 1 auto;white-space:normal}
 html body header.top .brand .long{display:none!important}
 html body header.top>.hj-nav{flex:1 1 100%}
 html body .tools{flex-wrap:wrap}
 html body :is(h1,h2,h3,.title,.hd,.ask,.qbox,.lead,p,li,b,span,button,a,td,th,label,small){word-break:keep-all;overflow-wrap:break-word}
}
@media (max-width:480px){
 html body #cover .title,html body #hj-scover .hj-sc-title{font-size:clamp(24px,7vw,32px)!important}
 html body #stage .hd,html body .screen .hd{font-size:clamp(21px,6vw,28px)!important}
 html body .hj-nav a span{font-size:13.5px}
 html body .hj-cvtools .hj-tool2{padding:6px 10px!important}
}
html body .bv i{font-size:max(13px,1em)}
@media (max-width:480px){html body #stage .rc{min-height:150px!important}html body #stage .rc .front img{max-height:90px;object-fit:cover}}
@media (max-width:600px){
 html body .labgrid,html body .lab2,html body .two{grid-template-columns:1fr!important}
 html body .pick{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))!important}
 html body.ov .photo,html:has(#ovBar) body .gallery .photo{grid-template-columns:1fr!important}
 html body.ov .hj-pgrid,html body .gallery{grid-template-columns:1fr!important}
 html body .vs{grid-template-columns:1fr!important}
 html body .vs>b{justify-self:center}
}
@media (max-width:600px){
 html body.ov .gal,html body .card2-wrap{grid-template-columns:1fr!important}
 html body.ov .card2 .pick,html body.ov section .pick.one{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))!important}
}
html body .hj-field>.hj-multi{grid-auto-flow:row!important}
html body .hj-field>.hj-multi .st,html body .hj-field .hj-multi>button{border-top:1px solid var(--line)!important}
html body .hj-field>.hj-multi .st:nth-child(-n+20){border-left:1px solid var(--line)!important}
@media (max-width:900px){html body.ov .gallery,html body.ov .hj-pgrid{grid-template-columns:1fr!important}}
/* 단계 줄이 넘치면 오른쪽 끝을 흐리게: 옆으로 밀어 더 볼 수 있다는 표시 */
html body .screen:not(#cover) .topbar>:is(.steps,.stagebar).hj-ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
html body .card2 .pick{grid-template-columns:repeat(auto-fill,minmax(124px,1fr))!important}
html body .card2 .pick button{padding:.4em .5em!important}
@media (max-width:600px){html body #lesson .cols{grid-template-columns:1fr!important}html body #lesson .col{min-height:0!important}}
html body .wg>h2 .ed{margin-left:auto!important;white-space:nowrap}
html body .wg>h2{min-width:0;overflow:hidden}
/* ===== 메뉴 단추 크기 통일(모든 교과) ===== */
/* 이동 단추 [홈·자료 목록] */
html body .hj-nav a{min-height:36px!important;font-size:clamp(14.5px,1.05vw,16px)!important}
/* 과학 아래 막대: 국어·사회 아래 단추와 같은 크기 */
html:has(#ovBar) #ovBar button{font-size:clamp(15px,1.15vw,17px)!important;min-height:40px!important;padding:7px 15px!important}
html:has(#ovBar) #ovBar .pos{font-size:clamp(15px,1.15vw,17px)!important}
/* 홍지희 버전은 화면 전체를 키우므로(zoom) 단추만 원래 크기로 */
html body #lesson .topbar .tool{font-size:calc(15.5px / var(--hjz,1))!important;min-height:calc(34px / var(--hjz,1))!important;padding:calc(5px / var(--hjz,1)) calc(10px / var(--hjz,1))!important}
html body #lesson .foot :is(.tnote,.ghost,#prev){font-size:calc(16px / var(--hjz,1))!important;min-height:calc(38px / var(--hjz,1))!important;padding:calc(7px / var(--hjz,1)) calc(14px / var(--hjz,1))!important}
html body #lesson .foot #next{font-size:calc(19px / var(--hjz,1))!important;min-height:calc(42px / var(--hjz,1))!important;padding:calc(8px / var(--hjz,1)) calc(20px / var(--hjz,1))!important}
/* 수학 앱: 확인하기·다음 계단은 알맞은 크기로 */
html body main.lesson .big{font-size:clamp(18px,1.35vw,22px)!important;padding:.5em 1.5em!important;width:auto!important;min-width:0!important;box-shadow:0 3px 0 rgba(0,0,0,.15)!important}
html body main.lesson .side>.big{align-self:flex-end}
html body main.lesson .stair{font-size:clamp(16px,1.2vw,19px)!important;min-height:48px;padding-top:6px!important;padding-bottom:6px!important}
/* 우리 반 교실: '자세히'가 칸 밖으로 나가지 않게 */
html body .wg>h2{font-size:clamp(.98rem,1.05vw,1.15rem)!important;gap:.3rem!important}
html body .wg>h2 .ed{font-size:.82rem!important;padding:.15rem .5rem!important;min-height:1.75rem!important}
/* hidden으로 숨긴 것은 정말 숨기기(돋보기 결과가 처음부터 보이던 문제) */
html body [hidden]{display:none!important}
html body #zoom:not([hidden]),html body .zoom:not([hidden]){animation:hjzoom .45s cubic-bezier(.2,.8,.3,1.2)}
@keyframes hjzoom{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
/* 과학 한 화면 보기: 내용이 길면 칸이 늘어나고, 아래 막대가 내용을 가리지 않게 */
html body.ov main section.cur{height:auto!important;overflow:visible!important}
html body.ov{padding-bottom:calc(var(--hjbar,76px) + 28px)!important}
html body.ov main.wrap{padding-bottom:calc(var(--hjbar,76px) + 12px)!important}
/* 과학: 문제(질문)는 왼쪽 정렬 */
html body.ov section :is(#quiz,#perf,.qz)>div>p.jua,html body.ov section p.jua,html body.ov section #clue,
html body.ov section:has(#quiz,#perf,.qz) .fitbox>h3{text-align:left!important;text-wrap:pretty}
/* 사진 두 장이 한 칸에만 몰리던 것: 줄 전체를 쓰고 사진을 크게 */
html body .two>.hj-pgrid:only-child{grid-column:1/-1}
html body.ov .hj-pgrid .photo img{max-height:min(380px,44vh)!important;aspect-ratio:4/3!important}
@media (max-width:900px){html body.ov .hj-pgrid .photo img{max-height:none!important}}

/* 과학 '한 화면 보기' 앱: 크롬북처럼 낮은 가로 화면에서 여백만 줄여 한 화면에 더 담기 (글자 크기는 그대로, 2026-10-02) */
@media (orientation:landscape) and (max-height:760px){
 html:has(#ovBar) body.ov main{padding-top:0!important}
 html:has(#ovBar) body.ov main>section.cur{margin-top:4px!important;padding-top:8px!important;padding-bottom:8px!important}
 html:has(#ovBar) body.ov section.cur .stage{margin-bottom:2px!important;padding-top:1px!important;padding-bottom:1px!important}
 html:has(#ovBar) body.ov section.cur h2{margin-top:2px!important;margin-bottom:6px!important}
 html:has(#ovBar) body.ov section.cur h3{margin-top:8px!important;margin-bottom:6px!important}
 html:has(#ovBar) body.ov section.cur .fitbox>p{margin-top:4px!important;margin-bottom:8px!important}
 html:has(#ovBar) body.ov section.cur .lab{margin-top:8px!important;margin-bottom:8px!important}
 html:has(#ovBar) body.ov section.cur .tip,html:has(#ovBar) body.ov section.cur .fb{margin-top:6px!important}
 html:has(#ovBar) body.ov #ovBar{margin-top:4px!important;padding-top:4px!important;padding-bottom:4px!important}
}
/* 과학 앱 사진 모음(3장 이상): 낮은 가로 화면에서는 세 칸 카드로 */
@media (orientation:landscape) and (max-height:760px) and (min-width:1000px){
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3)){grid-template-columns:repeat(3,minmax(0,1fr))!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3))>.photo{grid-template-columns:1fr!important;align-items:start;margin:0!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3))>.photo img{height:auto;max-height:min(150px,21vh)!important;aspect-ratio:3/2!important}
}
/* 과학: 재료 고르기 탭(나무 막대·물 등)은 가운데 정렬 */
html body.ov section .tabs{justify-content:center}
/* 갤럭시탭 같은 세로 태블릿(가로 600~900px): 사진을 두 칸으로 놓아 한 화면에 담기 (2026-10-02) */
@media (min-width:600px) and (max-width:900px) and (orientation:portrait){
 html:has(#ovBar) body.ov .hj-pgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
 html:has(#ovBar) body.ov .hj-pgrid .photo img{max-height:min(320px,26vh)!important;aspect-ratio:4/3!important;object-fit:cover}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3)){grid-template-columns:repeat(2,minmax(0,1fr))!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3))>.photo{grid-template-columns:1fr!important;align-items:start;margin:0!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3))>.photo img{height:auto;max-height:min(180px,15vh)!important;aspect-ratio:3/2!important}
 html:has(#ovBar) body.ov section.cur figure.photo:not(.hj-pgrid *):not(.gallery *):not(.gal *) img{max-height:min(280px,22vh)!important;object-fit:cover;width:auto!important;max-width:100%;margin-left:auto;margin-right:auto;display:block}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(7)){grid-template-columns:repeat(3,minmax(0,1fr))!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(7))>.photo img{max-height:min(130px,11vh)!important}
 html:has(#ovBar) body.ov .lab>svg{max-height:24vh!important}
}
/* 크롬북처럼 낮은 가로 화면: 사진 많은 모음은 네 칸, 따로 놓인 사진은 낮게 (2026-10-02) */
@media (orientation:landscape) and (max-height:760px) and (min-width:1000px){
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(7)){grid-template-columns:repeat(4,minmax(0,1fr))!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(7))>.photo img{max-height:min(110px,15vh)!important}
 html:has(#ovBar) body.ov section.cur figure.photo:not(.hj-pgrid *):not(.gallery *):not(.gal *) img{max-height:min(200px,27vh)!important;object-fit:cover}
 html:has(#ovBar) body.ov .lab>svg{max-height:34vh!important}
}
/* ===== 과목 색 (2026-10-02): 다음·주요 단추, 지금 단계, 고른 것, 활동 이름표, 학습 문제 상자 =====
   html[data-hjsubj]는 content.js가 주소(/korean/ /math/ /social/ /science/)를 보고 붙인다 */
html[data-hjsubj="korean"]{--hjs:#C9463B}
html[data-hjsubj="math"]{--hjs:#B4610F}
html[data-hjsubj="social"]{--hjs:#2B6FB8}
html[data-hjsubj="science"]{--hjs:#1F8060}
html[data-hjsubj]{--hjs-soft:color-mix(in srgb,var(--hjs) 14%,#fff)}
html[data-hjsubj]:not(#hjz):not(#hjz) body #ovBar #ovNext#ovNext,html[data-hjsubj]:not(#hjz):not(#hjz) body button.main.main,html[data-hjsubj]:not(#hjz):not(#hjz) body button[id^=btnNext][id^=btnNext],
html[data-hjsubj]:not(#hjz):not(#hjz) body #btnGo#btnGo,html[data-hjsubj]:not(#hjz):not(#hjz) body .hj-sc-go.hj-sc-go,html[data-hjsubj]:not(#hjz):not(#hjz) body #hjEnd#hjEnd,
html[data-hjsubj]:not(#hjz):not(#hjz) body #lesson .foot #next#next,html[data-hjsubj]:not(#hjz):not(#hjz) body #cover .big-btn.big-btn,html[data-hjsubj]:not(#hjz):not(#hjz) body .big-btn.big-btn:not(.ghost){background:var(--hjs)!important;color:#fff!important;border-color:transparent!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body :is(button.main,#ovNext,#hjEnd,.big-btn,[id^=btnNext],#next):disabled{background:color-mix(in srgb,var(--hjs) 35%,#fff)!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body nav a[style*="outline"]{outline:none!important;background:var(--hjs-soft)!important;color:var(--hjs)!important;box-shadow:inset 0 0 0 2px var(--hjs)!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body .st.now.now{background:var(--hjs)!important;color:#fff!important;border-color:transparent!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body .seg button[aria-pressed="true"][aria-pressed="true"]{background:var(--hjs)!important;color:#fff!important;border-color:transparent!important}
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body button.on.on:not(.right):not(.wrong),html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body button.sel.sel:not(.right):not(.wrong){background:var(--hjs-soft)!important;border-color:var(--hjs)!important;color:var(--hjs)!important}
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body .stage.stage.stage{background:var(--hjs-soft)!important;color:var(--hjs)!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body :is(#cover .qbox,#cover .bq,#cover .goalbox,#hj-scover .hj-sc-goal){background:var(--hjs-soft)!important;border-left-color:var(--hjs)!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body main.lesson .big:not(:disabled){background:var(--hjs)!important;color:#fff!important;border-color:transparent!important}
/* 자료 출처 한 줄 */
html body .hj-src{font-size:13.5px!important;line-height:1.5;color:var(--muted);text-align:center;margin:10px auto 0;max-width:60em;word-break:keep-all}
/* 과학 한 화면 보기: 글의 위계 — 이름표·제목 한 줄, 활동 제목 크게, 안내 글 작게, 할 일 문장은 크게 */
html body.ov section .hj-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 12px;margin:0 0 6px}
html body.ov section .hj-head>.stage{display:inline-block!important;margin:0!important}
html body.ov section .hj-head>h2{margin:0!important}
html body.ov section .fitbox:has(> h3:not(.ovhide)) .hj-head>h2{font-size:clamp(17px,1.35vw,20px)!important;color:var(--soft)!important;font-weight:700!important}
html body.ov section .fitbox>h3{font-size:clamp(22px,1.9vw,28px)!important;font-weight:800!important;color:var(--ink)!important;margin:6px 0 4px!important}
html body.ov section .fitbox>p.hj-guide{font-size:clamp(16px,1.25vw,19px)!important;line-height:1.6;color:var(--soft)!important;max-width:52em;margin:2px auto 6px!important}
html body.ov section .fitbox>p.hj-guide b{color:var(--ink)}
html body.ov section .fitbox>p.hj-task{font-size:clamp(19px,1.6vw,24px)!important;font-weight:700!important;line-height:1.5;color:var(--ink)!important;text-align:left!important;
 background:var(--hjs-soft,#F3EEE6);border-left:6px solid var(--hjs,#8a7a66);border-radius:12px;padding:10px 16px!important;margin:6px 0 10px!important;text-wrap:pretty}
html body.ov section .fitbox>p.hj-task b{color:var(--hjs,var(--ink))}
/* 스스로 평가 표: 얼굴 칸은 좁게, 글 칸은 넓게 */
html body.ov section table td:has(> button){width:1%;white-space:nowrap}
/* 문제 보기(모든 교과): ①②③④ 번호, 보기가 모두 짧으면 가운데 정렬 / 문장이면 왼쪽 정렬 (content.js가 hj-short·hj-long을 붙임) */
@counter-style hjcirc{system:fixed;symbols:'①' '②' '③' '④' '⑤' '⑥' '⑦' '⑧' '⑨' '⑩';suffix:' '}
html body .hj-optg{counter-reset:hjo}
html body .hj-optg>button{counter-increment:hjo;display:flex!important;align-items:center;gap:.45em}
html body .hj-optg>button::before{content:counter(hjo,hjcirc);font-weight:800;color:var(--hjs,var(--ink));flex:none}
html body .hj-optg.hj-long>button{text-align:left!important;justify-content:flex-start!important;align-items:baseline!important;padding-left:18px!important;padding-right:16px!important}
html body .hj-optg.hj-short>button{text-align:center!important;justify-content:center!important}

/* 홍지희 버전: 활동 이름표 + 질문 제목 한 줄 */
html body #lesson .hj-head2{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 14px;margin:0 auto}
html body #lesson .hj-head2>.sthead{margin:0!important;flex:none}
html body #lesson .hj-head2>#hd{margin:0!important}
/* 홍지희 버전 첫 화면: 주제 프로젝트 지도 이름표, 오늘 표시 */
html body .hj-maplab{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:12px 0 6px;font-size:15px;color:var(--soft)}
html body .hj-maplab b{font-size:16.5px;color:var(--ink)}
html body .hj-maplab em{font-style:normal;font-weight:800;color:var(--hjs,var(--ink))}
html body #cMap .cur .hj-today{font-style:normal;display:inline-block;font-size:12.5px;font-weight:800;color:#fff;background:var(--hjs,#555);border-radius:999px;padding:1px 8px;margin-right:6px;vertical-align:1px}
/* 과학 앱 메뉴 자리 통일 (국어·사회와 같게) */
html.hj-scmenu body>nav .wrap{max-width:none!important;display:flex!important;align-items:center;gap:8px;flex-wrap:nowrap}
html.hj-scmenu body>nav .hj-sctools{margin-left:auto;display:flex;gap:6px;flex:none;padding-left:8px}
html.hj-scmenu body>nav .hj-sctools button{font-size:clamp(13.5px,1vw,15px)!important;min-height:34px!important;padding:5px 11px!important;border-radius:999px!important;background:var(--paper)!important;color:var(--ink)!important;border:1px solid var(--line)!important;white-space:nowrap}
html.hj-scmenu:has(#ovBar) #ovBar{position:fixed!important;left:0!important;right:0!important;bottom:0!important;width:auto!important;max-width:none!important;margin:0!important;transform:none!important;
 display:grid!important;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 22px 14px!important;background:linear-gradient(to top,var(--bg) 70%,transparent)!important;border:0!important;box-shadow:none!important;border-radius:0!important;pointer-events:none}
html.hj-scmenu #ovBar>*{pointer-events:auto}
html.hj-scmenu #ovBar #ovPos{grid-column:2;font-size:14px!important;color:var(--soft)}
html.hj-scmenu #ovBar .hj-pn{grid-column:3;justify-self:end;display:flex;gap:8px}
html.hj-scmenu #ovBar .hj-pn button{min-height:42px!important;font-size:clamp(15px,1.15vw,17px)!important;padding:8px 18px!important;border-radius:999px!important}
