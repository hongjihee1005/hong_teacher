# 유튜브 영상 가져오기 — 하루에 한 번, 유튜브 채널 @hongjihee1005의 새 영상·재생목록을 사이트에 반영합니다.
#   youtube/index.html(📺 유튜브 영상)과 3~6학년 수학 영상 메뉴(gradeN/math/videos)의 영상 주소.
# 손으로 돌리려면 Actions 탭 → 유튜브 영상 가져오기 → Run workflow. 바뀐 것이 없으면 아무것도 올리지 않습니다.
name: 유튜브 영상 가져오기
on:
  schedule:
    - cron: '17 21 * * *'   # 한국 시각 매일 아침 6시 17분
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auto-fix
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 채널에서 받기
        run: python3 _build/youtube/fetch.py
      - name: 페이지 다시 만들기
        run: |
          python3 _build/video3/build.py
          python3 _build/youtube/build.py
      - name: 바뀐 것 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _build/youtube youtube grade3/math/videos grade4/math/videos grade5/math/videos grade6/math/videos
          if git diff --cached --quiet; then echo "새 영상 없음 — 그대로입니다."; exit 0; fi
          git commit -q -m "유튜브 영상 가져오기: 새 영상·재생목록 반영"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main || exit 1
            sleep $((i * 4))
          done
          exit 1
