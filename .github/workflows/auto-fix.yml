# 자동 보완 — 하루에 한 번(한국 시각 새벽 2시 47분) 사이트를 '지금 상태'로 맞춥니다(2026-10-11 선생님 요청: 올릴 때마다 → 하루 한 번).
# 바로 돌리려면 GitHub Actions 탭 → 자동 보완 → Run workflow.
# 하는 일은 _build/auto/run_all.py 맨 위 설명을 보세요. 바뀐 것이 있으면 '자동 보완' 커밋을 main에 올립니다.
name: 자동 보완
on:
  schedule:
    - cron: '47 17 * * *'   # UTC 17:47 = 한국 02:47
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auto-fix
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 준비
        run: pip install pillow
      - name: 모두 다시 적용
        id: run
        continue-on-error: true
        run: |
          # 지난번 자동 보완 뒤(약 하루)에 올라온 변경을 기준으로 점검
          SINCE=$(git rev-list -1 --before="25 hours ago" HEAD)
          python3 _build/auto/run_all.py --since "${SINCE:-0}"
      - name: 바뀐 것 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "바뀐 것 없음 — 이미 맞습니다."; exit 0; fi
          git diff --cached --stat | tail -20
          git commit -q -m "자동 보완: 예시·도움·답·그림·홈 단추·덮개 다시 적용"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main || exit 1
            sleep $((i * 4))
          done
          exit 1
      - name: 문제가 있으면 알림(실패 메일)
        if: steps.run.outcome == 'failure'
        run: |
          echo "자동 점검에서 문제가 나왔습니다. 위 '모두 다시 적용' 단계의 [문제] 줄을 보세요."
          exit 1
