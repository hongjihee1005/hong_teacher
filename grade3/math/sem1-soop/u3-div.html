<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모둠 활동 준비단 · 3-1 수학 3. 나눗셈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --night:#1F2F4A; --night2:#2C4166; --pine:#2F6B57; --pine-soft:#DDEDE5;
  --lantern:#F4C542; --tent:#E47A38; --ring:#2B7BD6; --ring-soft:#DCEAFB;
  --paper:#F5F7F4; --ink:#1D2A2A; --muted:#5B6B6B; --line:#C9D4CF;
  --ok:#2E8B57; --no:#C8472E; --white:#FFFFFF;
  --fs:clamp(16px, 0.75vw + 10px, 28px);
  --fs-s:calc(var(--fs) * .82); --fs-l:calc(var(--fs) * 1.3); --fs-xl:calc(var(--fs) * 1.8);
  --r:clamp(10px,1vw,18px); --pad:clamp(12px,1.4vw,28px);
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:var(--fs);line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,.jua{font-family:"Jua","Gowun Dodum","Malgun Gothic",sans-serif;font-weight:400;letter-spacing:.01em}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:4px solid var(--lantern);outline-offset:2px}
svg{touch-action:none;user-select:none;-webkit-user-select:none}
.hidden{display:none!important}

/* 상단 */
.top{background:var(--night);color:#fff;display:flex;align-items:center;gap:var(--pad);padding:calc(var(--pad)*.6) var(--pad);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:.5em;font-family:"Jua",sans-serif;font-size:var(--fs-l);white-space:nowrap}
.brand svg{width:1.6em;height:1.6em}
.who{margin-left:auto;display:flex;align-items:center;gap:.5em;font-size:var(--fs-s)}
.chip{white-space:nowrap;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:.25em .9em}
.chip.btn:hover{background:rgba(255,255,255,.22)}

/* 시작 화면 */
/* 시작 화면: 다른 교과와 같은 밝고 따뜻한 바탕 (2026-10-03) */
.gate{min-height:calc(100% - 4em);display:grid;place-items:center;padding:var(--pad);
 background:linear-gradient(180deg,#FFFCF8 0,#FCF3E9 100%)}
.gate-card{background:#fff;border:3px solid #F0E5D9;border-radius:calc(var(--r)*1.6);padding:calc(var(--pad)*1.4);width:min(920px,100%);box-shadow:0 10px 28px rgba(140,110,80,.10)}
.gate-card h1{color:var(--ink)}
.gate-card h1{font-size:var(--fs-xl);margin:0 0 .2em;color:var(--night)}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(3.1em,1fr));gap:.45em;margin:.6em 0 1em}
.nums button{padding:.5em 0;border-radius:.6em;border:2px solid var(--line);background:#fff;font-family:"Jua";font-size:var(--fs)}
.nums button.on{background:var(--ring);color:#fff;border-color:var(--ring)}
.row{display:flex;gap:.6em;align-items:center;flex-wrap:wrap}
input[type=text],input[type=password],input[type=number],textarea{font:inherit;padding:.45em .7em;border:2px solid var(--line);border-radius:.6em;background:#fff;color:var(--ink);max-width:100%}
textarea{width:100%;min-height:3.2em;resize:vertical}
.big{font-family:"Jua";font-size:var(--fs-l);padding:.45em 1.4em;border-radius:999px;border:0;background:var(--tent);color:#fff;box-shadow:0 4px 0 #B85A22}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #B85A22}
.big[disabled]{background:#B9C2BF;box-shadow:none;cursor:not-allowed}
.ghost{background:#fff;border:2px solid var(--line);color:var(--ink);border-radius:999px;padding:.35em 1em}

/* 차시 지도 */
.map{padding:var(--pad);max-width:1600px;margin:0 auto}
.map h2{font-size:var(--fs-xl);margin:.2em 0 .1em;color:var(--night)}
.story{background:#fff;border-left:8px solid var(--tent);border-radius:.6em;padding:var(--pad);margin-top:var(--pad)}
.story p{margin:.3em 0}
.scene{font-size:var(--fs-s);color:var(--pine);background:var(--pine-soft);border-radius:.5em;padding:.25em .8em;margin-bottom:.5em;display:inline-block}
.trail{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15em),1fr));gap:var(--pad);margin-top:var(--pad)}
.site{position:relative;text-align:left;background:#fff;border:3px solid var(--line);border-radius:var(--r);padding:var(--pad);display:flex;flex-direction:column;gap:.3em;min-height:9em}
.site:hover{border-color:var(--ring)}
.site .n{font-family:"Jua";font-size:var(--fs-l);color:var(--ring)}
.site .t{font-family:"Jua";font-size:var(--fs);line-height:1.3}
.site .soop{font-size:var(--fs-s);color:var(--muted)}
.site .prog{margin-top:auto;display:flex;gap:.25em}
.site .prog i{flex:1;height:.45em;border-radius:1em;background:var(--line)}
.site .prog i.on{background:var(--ok)}
.site .prog i.half{background:var(--lantern)}
.stair.passed .k{background:var(--lantern);color:var(--ink)}
.site.done{border-color:var(--ok)}
.site .star{position:absolute;right:.6em;top:.4em;font-size:var(--fs-l)}

/* 학습 화면 */
.lesson{display:grid;grid-template-columns:minmax(9em,14em) 1fr;gap:var(--pad);padding:var(--pad);max-width:1800px;margin:0 auto;min-height:calc(100% - 4em)}
.stairs{display:flex;flex-direction:column;gap:.5em;position:sticky;top:5em;align-self:start}
.stairs .title{font-family:"Jua";font-size:var(--fs-l);line-height:1.25;color:var(--night)}
.stairs .soopb{display:inline-block;background:var(--pine-soft);color:var(--pine);border-radius:.5em;padding:.1em .6em;font-size:var(--fs-s);margin:.2em 0 .4em}
.stair{display:flex;align-items:center;gap:.5em;text-align:left;border:2px solid var(--line);background:#fff;border-radius:.8em;padding:.45em .7em;color:var(--ink)}
.stair .k{flex:0 0 1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;background:var(--line);color:#fff;font-family:"Jua"}
.stair.cur{border-color:var(--ring);box-shadow:0 0 0 3px var(--ring-soft)}
.stair.cur .k{background:var(--ring)}
.stair.ok .k{background:var(--ok)}
.stair.lock{opacity:.45;cursor:not-allowed}
.stair.chal .k{background:var(--tent)}
.stairs .back{margin-top:.6em}
.work{background:#fff;border-radius:calc(var(--r)*1.3);padding:calc(var(--pad)*1.2);border:2px solid var(--line);min-width:0}
.q{background:var(--ring-soft);border-radius:var(--r);padding:.5em .9em;margin-bottom:.8em;font-family:"Jua";color:var(--night)}
.stepname{font-family:"Jua";font-size:var(--fs-xl);color:var(--night);margin:0}
.inst{margin:.2em 0 .8em;font-size:var(--fs)}
.panel{display:grid;grid-template-columns:minmax(0,1fr) minmax(12em,19em);gap:var(--pad);align-items:start}
.stage{min-width:0}
.stage svg{width:100%;height:auto;max-height:calc(100vh - 13em);display:block;background:#FBFCFB;border:2px solid var(--line);border-radius:var(--r)}
.side{min-width:0;display:flex;flex-direction:column;gap:.7em}
.readout{font-family:"Jua";font-size:var(--fs-l);color:var(--night)}
.readout small{font-family:"Gowun Dodum";font-size:var(--fs-s);color:var(--muted)}
.card{border:3px solid var(--night);border-radius:var(--r);padding:.8em 1em;background:#fff}
.card b{color:var(--ring)}
.opts{display:flex;flex-wrap:wrap;gap:.5em;margin:.4em 0}
.opt{border:2px solid var(--line);background:#fff;border-radius:.7em;padding:.4em .9em;text-align:left}
.opt.on{border-color:var(--ring);background:var(--ring-soft)}
.opt.good{border-color:var(--ok);background:#E3F4EA}
.opt.bad{border-color:var(--no);background:#FBE7E2}
.opt.good::after{content:" ○";color:var(--ok);font-weight:bold}
.opt.bad::after{content:" ×";color:var(--no);font-weight:bold}
.hintbox{margin-top:.8em;background:#FFF8E1;border-left:8px solid var(--lantern);border-radius:.5em;padding:.5em .9em}
.hintbox p{margin:.3em 0}
.wordbank{margin:.5em 0}
.wordbank .word{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:999px;padding:.1em .8em;margin:.2em .3em .2em 0}
.copybox{margin-top:.6em;background:#fff;border:3px dashed var(--tent);border-radius:.6em;padding:.6em .9em}
.copyrow{display:flex;gap:.6em;align-items:center;flex-wrap:wrap;margin:.35em 0}
.copyrow .target{font-family:"Jua",sans-serif;background:#FDF1E8;border-radius:.4em;padding:.15em .6em;min-width:9em}
.copyrow input{flex:1 1 10em;min-width:8em}
.help{border-color:var(--lantern)}
.stephead{display:flex;align-items:center;gap:.8em;flex-wrap:wrap}
.speak{font-size:var(--fs-s);padding:.2em .8em}
.sent{line-height:2.4}
.slot{display:inline-flex;gap:.3em;vertical-align:middle;flex-wrap:wrap;background:#F2F5F4;border-radius:.6em;padding:.15em .3em}
.slot .opt{padding:.1em .6em}
.qitem{border-bottom:1px dashed var(--line);padding:.6em 0}
.qitem:last-child{border-bottom:0}
.fb{min-height:1.6em;font-family:"Jua";margin-top:.4em}
.fb.good{color:var(--ok)} .fb.bad{color:var(--no)}
.actions{display:flex;gap:.6em;align-items:center;margin-top:.8em;flex-wrap:wrap;
  position:sticky;bottom:0;background:#fff;padding:.5em 0 .2em;z-index:3;border-top:1px solid transparent}
.actions.stuck{border-top-color:var(--line)}
.tools{display:flex;flex-wrap:wrap;gap:.4em;align-items:center}
.tools button{border:2px solid var(--line);background:#fff;border-radius:.6em;padding:.25em .8em}
.tools button.on{background:var(--night);color:#fff;border-color:var(--night)}
input[type=range]{width:100%;accent-color:var(--ring);height:2em}
.pill{display:inline-block;background:var(--night);color:#fff;border-radius:999px;padding:.05em .7em;font-size:var(--fs-s)}
.safe{border-left:6px solid var(--tent);background:#FDF1E8;padding:.5em .8em;border-radius:.4em;font-size:var(--fs-s)}
.seq{display:flex;gap:.5em;flex-wrap:wrap}
.seq .opt{flex:1 1 12em}
.seq .opt .no{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--ring);color:#fff;margin-right:.4em;font-family:"Jua"}

/* 완료 */
.finish{text-align:center;padding:1em}
.finish .medal{font-size:calc(var(--fs)*4)}

/* 교사 화면 */
.teacher{padding:var(--pad);max-width:1800px;margin:0 auto}
.tbl-wrap{overflow-x:auto;border:2px solid var(--line);border-radius:var(--r);background:#fff}
table.dash{border-collapse:collapse;width:100%;font-size:var(--fs-s)}
table.dash th,table.dash td{border:1px solid var(--line);padding:.35em .5em;text-align:center;white-space:nowrap}
table.dash th{background:var(--night);color:#fff;font-weight:400;font-family:"Jua"}
table.dash td.nm{text-align:left}
td.c-full{background:#DFF2E6} td.c-part{background:#FFF4D1} td.c-none{color:#aaa}
.detail{margin-top:var(--pad)}
.detail li{margin:.2em 0}
.toast{position:fixed;left:50%;bottom:1.2em;transform:translateX(-50%);background:var(--night);color:#fff;padding:.5em 1.2em;border-radius:999px;font-size:var(--fs-s);z-index:20}

@media (max-height: 820px){
  :root{--fs:clamp(15px,.62vw + 9px,22px);--pad:clamp(8px,1vw,16px)}
  .stage svg{max-height:calc(100vh - 17em)}
  .work{padding:.8em 1em}
  .q{margin-bottom:.4em;padding:.35em .8em}
  .inst{margin:.15em 0 .5em}
  .qitem{padding:.35em 0}
  .stepname{font-size:calc(var(--fs) * 1.45)}
  .stairs{gap:.3em}
  .stair{padding:.3em .6em}
  .copylink{display:none}
}
@media (max-width: 1000px){ .panel{grid-template-columns:1fr} .stage svg{max-height:none} }
@media (max-width: 820px){
  .lesson{grid-template-columns:1fr}
  .stairs{position:static;flex-direction:row;flex-wrap:wrap}
  .stairs .title,.stairs .soopb,.stairs .back{flex-basis:100%}
  .stair{flex:1 1 auto}
  .stair .lbl{display:none}
  .brand span.long{display:none}
  .who{gap:.3em} .chip{padding:.2em .6em}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.creditbar{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 16px 24px}
.tolist{display:none;align-items:center;gap:8px;font-family:"Jua",sans-serif;font-size:clamp(18px,1.8vw,24px);text-decoration:none;color:var(--ink);border:3px solid var(--line);background:#fff;border-radius:999px;padding:6px 20px}
.tolist.on{display:inline-flex}
.hjfoot{display:block;width:100%;margin:6px 0 0;padding:14px 0 4px;border-top:3px solid var(--line);text-align:center;color:var(--muted);font-size:clamp(14px,1.2vw,17px);line-height:1.7;word-break:keep-all}
.hjfoot p{margin:2px 0}
/* 사고 전략 칸 (Project Zero 사고 루틴) */
.panes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15em),1fr));gap:.7em;margin:.5em 0}
.pane{border:3px solid var(--line);border-radius:.7em;padding:.6em .7em;background:#fff;display:flex;flex-direction:column;min-height:9em}
.pane h3{margin:0 0 .3em;font-family:"Jua";font-size:var(--fs-l);font-weight:400;display:flex;align-items:center;gap:.3em;
  border-bottom:3px solid currentColor;padding-bottom:.25em}
.pane .pe{font-size:1.1em}
.pane0{border-color:#2B7BD6}.pane0 h3{color:#2B7BD6}
.pane1{border-color:#6A4FC9}.pane1 h3{color:#6A4FC9}
.pane2{border-color:#D9731A}.pane2 h3{color:#D9731A}
.pane3{border-color:#2F6B57}.pane3 h3{color:#2F6B57}
.phint{margin:.1em 0 .3em;font-size:.88em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:.35em;margin-bottom:.4em;flex:1;align-content:flex-start}
.chip{background:var(--pine-soft,#DDEDE5);border:2px solid var(--line);border-radius:.5em;padding:.15em .6em;
  font-family:inherit;font-size:.95em;color:inherit;cursor:pointer;text-align:left;max-width:100%;word-break:keep-all}
.chip:hover{background:#FBEDE3;text-decoration:line-through}
.prow{display:flex;gap:.4em;align-items:center;margin-top:auto}
.prow input{flex:1;min-width:4em;font:inherit;padding:.3em .5em;border:2px solid var(--line);border-radius:.45em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pane{background:#1E2A28}
  :root:not([data-theme="light"]) .chip{background:#2A3A36}}
:root[data-theme="dark"] .pane{background:#1E2A28}
:root[data-theme="dark"] .chip{background:#2A3A36}
/* 선택 문제 상자 */
.optbox{margin-top:1em;border:3px dashed var(--line);border-radius:.7em;padding:.5em .8em;background:#fff}
.optbox>summary{cursor:pointer;font-family:"Jua";font-size:var(--fs-l);color:var(--night,#1F2F4A);list-style:none}
.optbox>summary::-webkit-details-marker{display:none}
.optbox[open]>summary{margin-bottom:.4em;border-bottom:2px solid var(--line);padding-bottom:.3em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .optbox{background:#1E2A28}}
:root[data-theme="dark"] .optbox{background:#1E2A28}
</style>
<!--hj-ctheme--><style id="hj-ctheme">/* hj-ctheme · 수업 자료 페이지 공통: 글꼴을 Pretendard로, 바탕·글자색을 메뉴와 같은 밝고 따뜻한 톤으로 */
@font-face{font-family:'Jua';font-style:normal;font-weight:100 900;font-display:swap;
 src:url(https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2-subset/Pretendard-Bold.subset.woff2) format('woff2')}

 src:url(https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2-subset/Pretendard-Regular.subset.woff2) format('woff2')}
@font-face{font-family:'Gowun Dodum';font-style:normal;font-weight:551 900;font-display:swap;
 src:url(https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2-subset/Pretendard-Bold.subset.woff2) format('woff2')}
@media (prefers-color-scheme:light){html:root:not([data-theme="dark"]){--bg:#FFFCF8;--paper:#FFFFFF;--ink:#2A221C;--soft:#5C5047;--muted:#5C5047;--line:#EFE3D6;--warmline:#EFE3D6}}
html:root[data-theme="light"]{--bg:#FFFCF8;--paper:#FFFFFF;--ink:#2A221C;--soft:#5C5047;--muted:#5C5047;--line:#EFE3D6;--warmline:#EFE3D6}
@media (prefers-color-scheme:dark){html:root:not([data-theme="light"]){--bg:#221E1A;--paper:#2B2621;--ink:#F2EBE3;--soft:#C9BCB0;--muted:#C9BCB0;--line:#43392F}}

html body{-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
html h1,html h2,html h3{letter-spacing:-.025em}
html:root{--night:#4A3A2E;--night2:#8A6A52;--pine:#5C9A7C;--pine-soft:#E6F3EC}
/* ── 수업 세트 공통 틀(첫 화면·진행 화면) 다듬기: 얇은 선, 부드러운 그림자, 정돈된 글자 크기 ── */
html body .title{font-size:clamp(34px,min(4.8vw,8.5vh),66px);font-weight:800;letter-spacing:-.035em;line-height:1.2}
html body .lead{font-size:clamp(17px,1.6vw,22px);font-weight:600;color:var(--soft);letter-spacing:-.01em}
html body .qbox{background:#FFF5E6;border:0;border-left:8px solid #F2B872;border-radius:20px;font-size:clamp(20px,2.1vw,30px)!important;font-weight:700;line-height:1.55;
 box-shadow:0 1px 2px rgba(80,55,30,.05),0 16px 32px -22px rgba(80,55,30,.4)}
@media (prefers-color-scheme:dark){html:root:not([data-theme="light"]) body .qbox{background:#3A3024;border-left-color:#C98A2A}}
html:root[data-theme="dark"] body .qbox{background:#3A3024;border-left-color:#C98A2A}
html body .stagebar{gap:8px}
html body .st{border-width:1.5px;font-size:clamp(15px,1.35vw,19px);font-weight:600;padding:6px 14px;background:var(--paper)}
html body .st.now{font-weight:700}
html body .seg{border:1.5px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(80,55,30,.05)}
html body .seg button{font-size:clamp(17px,1.55vw,22px);font-weight:600;padding:9px 16px}
html body .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
html body .row-label{font-size:clamp(17px,1.6vw,22px);font-weight:700;color:var(--soft)}
html body .big-btn{font-size:clamp(22px,2.3vw,32px);font-weight:800;letter-spacing:-.01em;padding:14px 48px;
 box-shadow:0 2px 4px rgba(40,25,10,.12),0 14px 26px -12px rgba(40,25,10,.5)}
html body .big-btn:active{transform:translateY(2px);box-shadow:0 1px 2px rgba(40,25,10,.2)}
html body .mid-btn{font-size:clamp(18px,1.7vw,24px);font-weight:700;padding:11px 28px;box-shadow:0 2px 4px rgba(40,25,10,.12),0 10px 20px -12px rgba(40,25,10,.45)}
html body .mid-btn:active{transform:translateY(2px);box-shadow:none}
html body .ghost-btn{border:1.5px solid var(--line);background:var(--paper);font-size:clamp(17px,1.6vw,22px);font-weight:700;padding:10px 24px}
html body .tnote{border-width:1.5px;border-radius:999px;font-size:clamp(16px,1.5vw,20px);font-weight:700;padding:9px 18px}
html body .tool{border-width:1.5px;border-radius:12px;font-size:19px;padding:7px 12px}
html body .chip{border-width:1.5px;font-weight:600}
html body .tolist{border-width:1.5px;font-size:clamp(16px,1.5vw,19px);font-weight:700;padding:9px 18px}
html body .goal{font-size:clamp(16px,1.5vw,21px);font-weight:600}
html body .hd{font-weight:800;letter-spacing:-.03em;font-size:clamp(26px,2.8vw,42px);line-height:1.35}
html body .overlay{background:rgba(42,34,28,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
html body .panel{border:0;border-radius:24px;box-shadow:0 30px 60px -24px rgba(40,25,10,.5)}
html body .panel h2{font-size:clamp(30px,3.6vw,50px);font-weight:800;letter-spacing:-.03em}
html body .panel .why{font-size:clamp(20px,2.1vw,30px)}
html body :is(.card1,.book,.rec,.pw,.opt2,.oi,.mw,.mm,.wf,.ln,.lkrow,.bglog span){border-width:2px}
html body :is(.card1,.book,.rec,.sumbox,.talk .q,.fl,.promise div){box-shadow:0 1px 2px rgba(80,55,30,.05),0 12px 26px -20px rgba(80,55,30,.35)}
html body .wf :is(textarea,input){border-width:1.5px}
html body .ex{border-width:1.5px}
html body .card1 .x,html body .mw,html body .book .pg,html body .sumbox b{font-weight:700}
html body .hjfoot{border-top-width:1.5px}
html body:has(.screen.on:not(#cover)) #hj-home{display:none}
/* 선생님 버전(S.O.O.P.) 틀 */
html body .bq{border-width:2px;border-radius:20px;box-shadow:0 1px 2px rgba(80,55,30,.05),0 14px 28px -22px rgba(80,55,30,.4)}
html body .goalbox{border-width:0;border-left:8px solid #F2B872;background:#FFF5E6;border-radius:16px;font-weight:700}
@media (prefers-color-scheme:dark){html:root:not([data-theme="light"]) body .goalbox{background:#3A3024;border-left-color:#C98A2A}}
html:root[data-theme="dark"] body .goalbox{background:#3A3024;border-left-color:#C98A2A}
html body .ghost{border-width:1.5px;font-weight:700}
html body .plan>*,html body .steps>*{border-width:1.5px}
html body .badge{font-weight:800}
html body .ask{font-weight:600}
/* 선 아이콘 */
html body .hj-i{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-.2em}
html body .hj-ic{display:inline-flex;align-items:center;justify-content:center;gap:.4em}
html body .hj-ionly{gap:0}
html body .tool.hj-hometool{border-radius:999px;padding:6px 15px 6px 12px;font-weight:700;font-size:17px;gap:6px}
/* 수업 세트 첫 화면 정리 */
html body .hj-cv{gap:clamp(12px,2vh,22px)!important}
html body .hj-cvtop{width:min(1100px,94vw);display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;min-height:0}
html body .hj-cvtop .tolist{margin:0}
html body .hj-cvpanel{width:min(1100px,94vw);background:var(--paper);border:1.5px solid var(--line);border-radius:24px;padding:clamp(16px,2vw,26px) clamp(18px,2.4vw,30px);
 display:grid;gap:clamp(12px,1.6vh,18px);box-shadow:0 1px 2px rgba(80,55,30,.05),0 18px 40px -28px rgba(80,55,30,.45);text-align:left}
html body .hj-cvpanel>.qbox,html body .hj-cvpanel>.goalbox,html body .hj-cvpanel>.bq,html body .hj-cvpanel>.map{width:auto!important;margin:0!important;box-shadow:none}
html body .hj-cvpanel>.qbox{text-align:left}
html body .hj-field{display:grid!important;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:8px 14px;justify-content:stretch!important;margin:0;
 padding-top:clamp(10px,1.4vh,16px);border-top:1.5px dashed var(--line)}
html body .hj-field>.stagebar,html body .hj-field>.plan{justify-content:flex-start!important;margin:0}
html body .hj-flabel{font-size:clamp(15px,1.35vw,18px)!important;font-weight:800;color:var(--soft);white-space:nowrap}
html body .hj-field.row>:nth-child(n+3){grid-column:2;font-size:clamp(14px,1.25vw,17px);color:var(--soft)}
html body .hj-field .seg{justify-self:start}
html body .hj-cvacts{gap:14px}
@media (max-width:720px){html body .hj-field{grid-template-columns:1fr}html body .hj-field.row>:nth-child(n+3){grid-column:1}}
html body .hj-field>*:not(.hj-flabel){justify-self:start;text-align:left;margin-left:0}
html body .hj-field>div>.seg{margin:0}
html body .hj-cvtop,html body .hj-cvpanel,html body .hj-cvacts{flex:none}
html body #cover{justify-content:safe center}
html body .hj-field #segTeam{justify-content:flex-start!important;align-items:flex-start!important;flex-direction:column;gap:6px!important}
html body .hj-field #segTeam-sub .row-label,html body .hj-field #segTeam~*{font-size:clamp(14px,1.25vw,17px)!important;font-weight:500;color:var(--soft)}
html body .hj-field .seg{justify-content:flex-start;width:auto}

html .hj-em{font-family:'HJ Emoji','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-weight:400;font-style:normal;font-synthesis:none;letter-spacing:0;-webkit-text-stroke:0;text-shadow:none}
/* 교사 안내 창 도구(인쇄·구글 문서·이메일) */
html body .hj-tbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px 0 4px;padding-top:18px;border-top:1px solid var(--line)}
html body .hj-tbar>button,html body .hj-mail button{display:inline-flex;align-items:center;gap:7px;font:700 16px/1.2 'Gowun Dodum',sans-serif;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;cursor:pointer}
html body .hj-tbar>button:hover,html body .hj-mail button:hover{background:var(--bg);border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
html body .hj-tbar .hj-i{width:18px;height:18px;flex:none}
html body .hj-mail{flex-basis:100%;display:grid;gap:8px;max-width:560px;margin:6px auto 0;text-align:left;background:var(--bg);border-radius:16px;padding:14px 16px}
html body .hj-mail[hidden]{display:none}
html body .hj-mail label{font-weight:700;font-size:16px}html body .hj-mail label small{font-weight:500;color:var(--soft);font-size:14px;margin-left:6px}
html body .hj-mail input{font:500 17px/1.4 'Gowun Dodum',sans-serif;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
html body .hj-mail div{display:flex;flex-wrap:wrap;gap:8px}html body .hj-mail p{margin:0;font-size:14px!important;color:var(--soft)}
html body .hj-toast{flex-basis:100%;margin:2px 0 0;min-height:1.3em;text-align:center;font-size:15px!important;color:var(--soft)}
@media print{
 body.hj-tprint>*:not(#tn){display:none!important}
 body.hj-tprint #tn{position:static!important;display:block!important;background:none!important;padding:0!important;inset:auto!important}
 body.hj-tprint #tn .panel{width:auto!important;max-height:none!important;overflow:visible!important;box-shadow:none!important;border:0!important;border-radius:0!important;padding:0!important;transform:none!important;animation:none!important}
 body.hj-tprint .hj-tbar,body.hj-tprint #tnClose{display:none!important}
 body.hj-tprint{background:#fff!important;color:#000}
 body.hj-tprint #tn .panel{padding:16mm!important}
}
/* 수업을 마쳤을 때 고르는 창 */
#hj-done{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:rgba(42,34,28,.38);backdrop-filter:blur(3px);animation:hjfade .2s ease}
@keyframes hjfade{from{opacity:0}to{opacity:1}}
#hj-done .hj-dp{width:min(560px,100%);background:var(--paper,#fff);color:var(--ink,#2A221C);border-radius:24px;padding:30px 28px 24px;text-align:center;box-shadow:0 30px 60px -24px rgba(40,25,10,.5);font-family:'Gowun Dodum',sans-serif;word-break:keep-all}

/* 과학 '한 화면 보기' 앱: 크롬북처럼 낮은 가로 화면에서 여백만 줄여 한 화면에 더 담기 (글자 크기는 그대로, 2026-10-02) */
@media (orientation:landscape) and (max-height:760px){
 html:has(#ovBar) body.ov main{padding-top:0!important}
 html:has(#ovBar) body.ov main>section.cur{margin-top:4px!important;padding-top:8px!important;padding-bottom:8px!important}
 html:has(#ovBar) body.ov section.cur .stage{margin-bottom:2px!important;padding-top:1px!important;padding-bottom:1px!important}
 html:has(#ovBar) body.ov section.cur h2{margin-top:2px!important;margin-bottom:6px!important}
 html:has(#ovBar) body.ov section.cur h3{margin-top:8px!important;margin-bottom:6px!important}
 html:has(#ovBar) body.ov section.cur .fitbox>p{margin-top:4px!important;margin-bottom:8px!important}
 html:has(#ovBar) body.ov section.cur .lab{margin-top:8px!important;margin-bottom:8px!important}
 html:has(#ovBar) body.ov section.cur .tip,html:has(#ovBar) body.ov section.cur .fb{margin-top:6px!important}
 html:has(#ovBar) body.ov #ovBar{margin-top:4px!important;padding-top:4px!important;padding-bottom:4px!important}
}
/* 과학 앱 사진 모음(3장 이상): 낮은 가로 화면에서는 세 칸 카드로 */
@media (orientation:landscape) and (max-height:760px) and (min-width:1000px){
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3)){grid-template-columns:repeat(3,minmax(0,1fr))!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3))>.photo{grid-template-columns:1fr!important;align-items:start;margin:0!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3))>.photo img{height:auto;max-height:min(150px,21vh)!important;aspect-ratio:3/2!important}
}
/* 과학: 재료 고르기 탭(나무 막대·물 등)은 가운데 정렬 */
html body.ov section .tabs{justify-content:center}
/* 갤럭시탭 같은 세로 태블릿(가로 600~900px): 사진을 두 칸으로 놓아 한 화면에 담기 (2026-10-02) */
@media (min-width:600px) and (max-width:900px) and (orientation:portrait){
 html:has(#ovBar) body.ov .hj-pgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
 html:has(#ovBar) body.ov .hj-pgrid .photo img{max-height:min(320px,26vh)!important;aspect-ratio:4/3!important;object-fit:cover}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3)){grid-template-columns:repeat(2,minmax(0,1fr))!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3))>.photo{grid-template-columns:1fr!important;align-items:start;margin:0!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3))>.photo img{height:auto;max-height:min(180px,15vh)!important;aspect-ratio:3/2!important}
 html:has(#ovBar) body.ov section.cur figure.photo:not(.hj-pgrid *):not(.gallery *):not(.gal *) img{max-height:min(280px,22vh)!important;object-fit:cover;width:auto!important;max-width:100%;margin-left:auto;margin-right:auto;display:block}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(7)){grid-template-columns:repeat(3,minmax(0,1fr))!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(7))>.photo img{max-height:min(130px,11vh)!important}
 html:has(#ovBar) body.ov .lab>svg{max-height:24vh!important}
}
/* 크롬북처럼 낮은 가로 화면: 사진 많은 모음은 네 칸, 따로 놓인 사진은 낮게 (2026-10-02) */
@media (orientation:landscape) and (max-height:760px) and (min-width:1000px){
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(7)){grid-template-columns:repeat(4,minmax(0,1fr))!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(7))>.photo img{max-height:min(110px,15vh)!important}
 html:has(#ovBar) body.ov section.cur figure.photo:not(.hj-pgrid *):not(.gallery *):not(.gal *) img{max-height:min(200px,27vh)!important;object-fit:cover}
 html:has(#ovBar) body.ov .lab>svg{max-height:34vh!important}
}
/* ===== 과목 색 (2026-10-02): 다음·주요 단추, 지금 단계, 고른 것, 활동 이름표, 학습 문제 상자 =====
   html[data-hjsubj]는 content.js가 주소(/korean/ /math/ /social/ /science/)를 보고 붙인다 */
html[data-hjsubj="korean"]{--hjs:#C9463B}
html[data-hjsubj="math"]{--hjs:#B4610F}
html[data-hjsubj="social"]{--hjs:#2B6FB8}
html[data-hjsubj="science"]{--hjs:#1F8060}
html[data-hjsubj]{--hjs-soft:color-mix(in srgb,var(--hjs) 14%,#fff)}
html[data-hjsubj]:not(#hjz):not(#hjz) body #ovBar #ovNext#ovNext,html[data-hjsubj]:not(#hjz):not(#hjz) body button.main.main,html[data-hjsubj]:not(#hjz):not(#hjz) body button[id^=btnNext][id^=btnNext],
html[data-hjsubj]:not(#hjz):not(#hjz) body #btnGo#btnGo,html[data-hjsubj]:not(#hjz):not(#hjz) body .hj-sc-go.hj-sc-go,html[data-hjsubj]:not(#hjz):not(#hjz) body #hjEnd#hjEnd,
html[data-hjsubj]:not(#hjz):not(#hjz) body #lesson .foot #next#next,html[data-hjsubj]:not(#hjz):not(#hjz) body #cover .big-btn.big-btn,html[data-hjsubj]:not(#hjz):not(#hjz) body .big-btn.big-btn:not(.ghost){background:var(--hjs)!important;color:#fff!important;border-color:transparent!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body :is(button.main,#ovNext,#hjEnd,.big-btn,[id^=btnNext],#next):disabled{background:color-mix(in srgb,var(--hjs) 35%,#fff)!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body nav a[style*="outline"]{outline:none!important;background:var(--hjs-soft)!important;color:var(--hjs)!important;box-shadow:inset 0 0 0 2px var(--hjs)!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body .st.now.now{background:var(--hjs)!important;color:#fff!important;border-color:transparent!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body .seg button[aria-pressed="true"][aria-pressed="true"]{background:var(--hjs)!important;color:#fff!important;border-color:transparent!important}
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body button.on.on:not(.right):not(.wrong),html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body button.sel.sel:not(.right):not(.wrong){background:var(--hjs-soft)!important;border-color:var(--hjs)!important;color:var(--hjs)!important}
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body .stage.stage.stage{background:var(--hjs-soft)!important;color:var(--hjs)!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body :is(#cover .qbox,#cover .bq,#cover .goalbox,#hj-scover .hj-sc-goal){background:var(--hjs-soft)!important;border-left-color:var(--hjs)!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body main.lesson .big:not(:disabled){background:var(--hjs)!important;color:#fff!important;border-color:transparent!important}
/* 자료 출처 한 줄 */
html body .hj-src{font-size:13.5px!important;line-height:1.5;color:var(--muted);text-align:center;margin:10px auto 0;max-width:60em;word-break:keep-all}
/* 과학 한 화면 보기: 글의 위계 — 이름표·제목 한 줄, 활동 제목 크게, 안내 글 작게, 할 일 문장은 크게 */
html body.ov section .hj-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 12px;margin:0 0 6px}
html body.ov section .hj-head>.stage{display:inline-block!important;margin:0!important}
html body.ov section .hj-head>h2{margin:0!important}
html body.ov section .fitbox:has(> h3:not(.ovhide)) .hj-head>h2{font-size:clamp(17px,1.35vw,20px)!important;color:var(--soft)!important;font-weight:700!important}
html body.ov section .fitbox>h3{font-size:clamp(22px,1.9vw,28px)!important;font-weight:800!important;color:var(--ink)!important;margin:6px 0 4px!important}
html body.ov section .fitbox>p.hj-guide{font-size:clamp(16px,1.25vw,19px)!important;line-height:1.6;color:var(--soft)!important;max-width:52em;margin:2px auto 6px!important}
html body.ov section .fitbox>p.hj-guide b{color:var(--ink)}
html body.ov section .fitbox>p.hj-task{font-size:clamp(19px,1.6vw,24px)!important;font-weight:700!important;line-height:1.5;color:var(--ink)!important;text-align:left!important;
 background:var(--hjs-soft,#F3EEE6);border-left:6px solid var(--hjs,#8a7a66);border-radius:12px;padding:10px 16px!important;margin:6px 0 10px!important;text-wrap:pretty}
html body.ov section .fitbox>p.hj-task b{color:var(--hjs,var(--ink))}
/* 스스로 평가 표: 얼굴 칸은 좁게, 글 칸은 넓게 */
html body.ov section table td:has(> button){width:1%;white-space:nowrap}
/* 문제 보기(모든 교과): ①②③④ 번호, 보기가 모두 짧으면 가운데 정렬 / 문장이면 왼쪽 정렬 (content.js가 hj-short·hj-long을 붙임) */
@counter-style hjcirc{system:fixed;symbols:'①' '②' '③' '④' '⑤' '⑥' '⑦' '⑧' '⑨' '⑩';suffix:' '}
html body .hj-optg{counter-reset:hjo}
html body .hj-optg>button{counter-increment:hjo;display:flex!important;align-items:center;gap:.45em}
html body .hj-optg>button::before{content:counter(hjo,hjcirc);font-weight:800;color:var(--hjs,var(--ink));flex:none}
html body .hj-optg.hj-long>button{text-align:left!important;justify-content:flex-start!important;align-items:baseline!important;padding-left:18px!important;padding-right:16px!important}
html body .hj-optg.hj-short>button{text-align:center!important;justify-content:center!important}

/* 홍지희 버전: 활동 이름표 + 질문 제목 한 줄 */
html body #lesson .hj-head2{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 14px;margin:0 auto}
html body #lesson .hj-head2>.sthead{margin:0!important;flex:none}
html body #lesson .hj-head2>#hd{margin:0!important}
/* 홍지희 버전 첫 화면: 주제 프로젝트 지도 이름표, 오늘 표시 */
html body .hj-maplab{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:12px 0 6px;font-size:15px;color:var(--soft)}
html body .hj-maplab b{font-size:16.5px;color:var(--ink)}
html body .hj-maplab em{font-style:normal;font-weight:800;color:var(--hjs,var(--ink))}
html body #cMap .cur .hj-today{font-style:normal;display:inline-block;font-size:12.5px;font-weight:800;color:#fff;background:var(--hjs,#555);border-radius:999px;padding:1px 8px;margin-right:6px;vertical-align:1px}
/* 과학 앱 메뉴 자리 통일 (국어·사회와 같게) */
html.hj-scmenu body>nav .wrap{max-width:none!important;display:flex!important;align-items:center;gap:8px;flex-wrap:nowrap}
html.hj-scmenu body>nav .hj-sctools{margin-left:auto;display:flex;gap:6px;flex:none;padding-left:8px}
html.hj-scmenu body>nav .hj-sctools button{font-size:clamp(13.5px,1vw,15px)!important;min-height:34px!important;padding:5px 11px!important;border-radius:999px!important;background:var(--paper)!important;color:var(--ink)!important;border:1px solid var(--line)!important;white-space:nowrap}
html.hj-scmenu:has(#ovBar) #ovBar{position:fixed!important;left:0!important;right:0!important;bottom:0!important;width:auto!important;max-width:none!important;margin:0!important;transform:none!important;
 display:grid!important;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 22px 14px!important;background:linear-gradient(to top,var(--bg) 70%,transparent)!important;border:0!important;box-shadow:none!important;border-radius:0!important;pointer-events:none}
html.hj-scmenu #ovBar>*{pointer-events:auto}
html.hj-scmenu #ovBar #ovPos{grid-column:2;font-size:14px!important;color:var(--soft)}
html.hj-scmenu #ovBar .hj-pn{grid-column:3;justify-self:end;display:flex;gap:8px}
html.hj-scmenu #ovBar .hj-pn button{min-height:42px!important;font-size:clamp(15px,1.15vw,17px)!important;padding:8px 18px!important;border-radius:999px!important}
@media (max-width:820px){html.hj-scmenu body>nav .hj-sctools{position:fixed;left:10px;bottom:14px;z-index:30;padding:0;gap:4px}html.hj-scmenu body>nav .hj-sctools button{font-size:0!important;padding:8px 10px!important;min-height:40px!important}html.hj-scmenu body>nav .hj-sctools button .hj-i{width:18px;height:18px;margin:0}}
/* 번호 붙은 줄 내어쓰기 */
html body .hj-hang{display:flex!important;align-items:flex-start;gap:.35em}
html body .hj-hang>input{flex:none;margin-top:.15em}
html body .hj-hang>.hj-cn{flex:none;font-weight:700}
html body .hj-hang>.hj-ct{flex:1 1 auto;min-width:0}
html body .hj-hang .hj-paren{display:block;font-size:.92em;color:var(--soft)}
html body .hd>small.hj-sub2{display:block;margin-top:4px}
/* 사이트 '홈': 채운 집 모양 + 과목 색으로 눈에 띄게 (차시 처음 단추와 구분) */
html body .hj-nav a.hj-nh{background:var(--hjs,#2A221C)!important;color:#fff!important;border-color:transparent!important}
html body .hj-nav a.hj-nh svg path{fill:currentColor;fill-opacity:.25}
/* 홍지희 버전: 위 메뉴줄과 본문 사이 여유 */
html body #lesson .topbar{margin-bottom:16px!important}
/* 홍지희 버전: 활동 내용이 아래로 처지지 않게 위쪽(질문 바로 아래)에 붙이고, 남는 공간은 아래로 */
html body #lesson .body{justify-content:flex-start!important}
html body #lesson .body>:first-child{margin-top:clamp(8px,3vh,36px)!important}
html body a.hj-homemini{display:inline-flex!important;align-items:center;gap:5px;text-decoration:none!important;background:var(--hjs,#2A221C)!important;color:#fff!important;border:0!important;border-radius:999px;padding:5px 12px!important;min-height:34px;font:700 clamp(13.5px,1vw,15px)/1 Pretendard,sans-serif!important;white-space:nowrap}
html body a.hj-homemini .hj-i{width:16px;height:16px}
/* 보기에 긴 문장이 있으면 한 줄에 하나씩(가운데 폭에 맞춰) 보여 읽기 쉽게 */

/* 홍지희 버전 자료 카드: 제목 칸 · 가운데 사진 · 설명 · 출처 */
html body .mini .m.hj-v{flex-direction:column!important;align-items:stretch!important;gap:6px!important;padding:0 0 8px!important;overflow:hidden;text-align:center}
html body .mini .m.hj-v .hj-mh{background:color-mix(in srgb,var(--hjs,#888) 10%,var(--paper,#fff));border-bottom:2px solid color-mix(in srgb,var(--hjs,#888) 22%,var(--paper,#fff));padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
html body .mini .m.hj-v .hj-mh b{display:inline!important;font-size:clamp(15px,calc(var(--vw,1vw)*1.35),20px)!important}
html body .mini .m.hj-v .hj-mp{display:flex;justify-content:center;align-items:center;padding:2px 10px 0}
html body .mini .m.hj-v .hj-mp img{width:100%!important;height:clamp(84px,calc(var(--vh,1vh)*15),160px)!important;object-fit:cover;border-radius:10px}
html body .mini .m.hj-v .hj-mp .e{font-size:clamp(48px,calc(var(--vh,1vh)*9),84px)!important;width:auto!important;display:block!important;line-height:1.15}
html body .mini .m.hj-v .d{padding:0 10px;line-height:1.4}
html body :is(#lesson,#stage,#cover,main,body) .mini .m.hj-v small.hj-msrc{display:block;padding:0 10px;font-size:12.5px!important;line-height:1.3;color:var(--muted,var(--soft))}
html body .mini:has(.hj-v){grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))!important}
/* ===== 모든 교과 공통: 분류 카드(.card1)·분류 단추(.bins)·피드백(.fb) 너비와 색 통일 (2026-10-03) ===== */
html body .deck{width:min(1100px,94vw)!important;margin-left:auto;margin-right:auto;display:flex;flex-direction:column;align-items:stretch;gap:12px}
html body .deck>.card1,html body .deck>.bins,html body .deck>.fb{width:100%!important;max-width:none!important;box-sizing:border-box;margin-left:0!important;margin-right:0!important}
html body .card1,html body .bins{width:min(1100px,94vw)!important;box-sizing:border-box}
html body .deck>.ask{margin:0;text-align:center}
/* 분류 단추: 원색을 톤 다운, 모서리·그림자 통일 */
html body .bin{background:color-mix(in srgb,var(--cc,#888) 72%,#6d655d)!important;color:#fff!important;border:0!important;border-radius:18px!important;box-shadow:0 4px 0 color-mix(in srgb,var(--cc,#888) 55%,#3d3631)!important}
html body .bin:hover:not(:disabled){filter:brightness(1.05)}
html body .bin:disabled{opacity:.55;box-shadow:none!important;transform:translateY(3px)}
html body .bin.lit{opacity:1!important;outline:4px solid color-mix(in srgb,var(--cc,#888) 40%,#fff);outline-offset:2px}
/* 국어 기억 카드 앞면도 같은 톤 */
html body .rc .front{background:color-mix(in srgb,var(--cc,#888) 72%,#6d655d)!important}
/* 피드백 띠: 카드와 같은 흰 바탕 + 왼쪽 색 줄 + 오른쪽 '다음' 단추 */
html body .fb.on{display:flex!important;align-items:center;gap:10px 14px;flex-wrap:wrap;background:var(--paper,#fff)!important;border:2px solid var(--line,#e8dccb)!important;border-left:8px solid var(--ok,#1F9E63)!important;border-radius:16px!important;padding:12px 16px 12px 18px!important;box-shadow:0 1px 2px rgba(80,55,30,.05),0 12px 26px -20px rgba(80,55,30,.35);font-size:clamp(17px,1.6vw,22px);line-height:1.5;text-align:left;color:var(--ink)}
html body .fb.on.no{border-left-color:var(--no,#D64C5A)!important}
html body .fb.on.open{border-left-color:#C9862A!important}
html body .fb.on b{color:var(--ok,#1F9E63)}html body .fb.on.no b{color:var(--no,#D64C5A)}html body .fb.on.open b{color:#B07020}
html body .fb.on #nx,html body .fb.on button{margin-left:auto!important;background:var(--hjs,#555)!important;color:#fff!important;border:0!important;border-radius:999px!important;padding:8px 20px!important;font-weight:800!important;font-size:clamp(16px,1.5vw,20px)!important;box-shadow:0 3px 0 color-mix(in srgb,var(--hjs,#555) 60%,#000)!important;white-space:nowrap}
/* ===== 수학: 머리줄을 밝게(오른쪽 위 글자가 보이게), 계단 이동 단추 한 줄 (2026-10-03) ===== */
html[data-hjsubj="math"] body header.top{background:color-mix(in srgb,#B4610F 7%,#FFFBF4)!important;color:#3A2E25!important;border-bottom:2px solid color-mix(in srgb,#B4610F 22%,#FFFBF4)!important;box-shadow:none!important}
html[data-hjsubj="math"] body header.top .brand,html[data-hjsubj="math"] body header.top .who{color:#3A2E25!important}
html[data-hjsubj="math"] body header.top .chip{background:#fff!important;color:#3A2E25!important;border:1.5px solid color-mix(in srgb,#B4610F 25%,#e8dccb)!important;font-weight:700}
html[data-hjsubj="math"] body header.top .chip.btn:hover{background:color-mix(in srgb,#B4610F 8%,#fff)!important}
html[data-hjsubj="math"] body header.top .hj-nav .hj-lbtn{color:#3A2E25!important;background:#fff!important;border-color:color-mix(in srgb,#B4610F 25%,#e8dccb)!important}
html body main .actions:has(.hj-nextst){display:flex!important;flex-wrap:wrap;align-items:center;gap:.6em}
html body main .actions:has(.hj-nextst)>*{order:5}
html body main .actions:has(.hj-nextst)>button.big:not(.hj-prevst):not(.hj-nextst){order:1}
html body main.lesson .actions:has(.hj-nextst)>button.big.hj-prevst,html body main .actions:has(.hj-nextst)>.hj-prevst{order:2;margin-left:auto!important;background:#fff!important;color:#3A2E25!important;border:2px solid var(--line,#e8dccb)!important;box-shadow:none!important}

</style><meta name="hj-list" content="[[&quot;u1-addsub.html&quot;, &quot;봄 운동회 점수판&quot;, &quot;웹앱&quot;], [&quot;u2-plane.html&quot;, &quot;우리 반 교실 꾸미기&quot;, &quot;웹앱&quot;], [&quot;u3-div.html&quot;, &quot;모둠 활동 준비단&quot;, &quot;웹앱&quot;], [&quot;u4-mul.html&quot;, &quot;학교 텃밭 가꾸기&quot;, &quot;웹앱&quot;], [&quot;u5-lentime.html&quot;, &quot;봄 소풍 탐험대&quot;, &quot;웹앱&quot;], [&quot;u6-fracdec.html&quot;, &quot;교실 미술 작업실&quot;, &quot;웹앱&quot;]]"><!--/hj-ctheme--></head>
<body>
<div id="app"></div>
<div class="creditbar"><a class="tolist" id="tolist" href="index.html">📋 자료 목록으로</a><footer class="hjfoot"><p>2022 개정 교육과정, 지도서, 교과서를 바탕으로 만든 학습 자료입니다.</p><p>만든 사람: 초등교사 홍지희</p></footer></div>
<script>
const APP={title:"모둠 활동 준비단", unit:"3-1 수학 3. 나눗셈", key:"s31-div-v1", welcome:"모둠 활동 준비단에 온 것을 환영해요", intro:"우리 반 25명이 모둠 활동을 준비하며 친구와 준비물을 똑같이 나누고, 나눗셈을 한 계단씩 배워요."};
/* ===== 설정 ===== */
const CONFIG = {
  unit: APP.unit,
  // 구글 앱스 스크립트 웹 앱 주소(선택). 앱스 스크립트 안에서 열면 비워 두어도 자동 연결돼요.
  endpoint: "",
  localPin: "1234"   // 앱스 스크립트 없이 이 기기 기록만 볼 때 쓰는 선생님 비밀번호
};
const STEP_NAMES = ["만져 보기", "그려 보기", "말해 보기", "약속하기", "확인하기"];
const KEY = APP.key;

/* ===== 저장 ===== */
const store = {
  load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } },
  save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
};
let S = store.load();
S.student = S.student || null;     // {ban, no, name}
S.prog = S.prog || {};             // prog[`${ban}-${no}`][chasiId] = {steps:{i:{ok,tries,ans}}, chal:{...}}
S.log = S.log || [];               // 이 기기의 모든 기록
S.queue = S.queue || [];           // 보내지 못한 기록

const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
function toast(msg) { const t = h("div", { class: "toast" }, msg); document.body.append(t); setTimeout(() => t.remove(), 2200); }
const sid = () => S.student ? `${S.student.ban}-${S.student.no}` : "guest";
function myProg(cid) { const p = (S.prog[sid()] = S.prog[sid()] || {}); return (p[cid] = p[cid] || { steps: {}, chal: null }); }

/* ===== 기록 보내기 ===== */
const hasGAS = () => typeof google !== "undefined" && google.script && google.script.run;
function send(rec) {
  if (hasGAS()) {
    google.script.run.withFailureHandler(() => { S.queue.push(rec); store.save(S); }).saveRecord(rec);
  } else if (CONFIG.endpoint) {
    fetch(CONFIG.endpoint, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(rec) })
      .catch(() => { S.queue.push(rec); store.save(S); });
  }
}
function flushQueue() {
  if (!S.queue.length || (!hasGAS() && !CONFIG.endpoint)) return;
  const q = S.queue.splice(0); store.save(S); q.forEach(send);
}
function record(chasi, stepNo, stepName, ok, tries, answer, level) {
  const st = S.student || { ban: "", no: "", name: "" };
  const rec = { time: new Date().toISOString(), ban: st.ban, no: st.no, name: st.name, unit: CONFIG.unit,
    chasi: chasi.no, title: chasi.title, step: stepNo, stepName, ok: !!ok, tries, answer: String(answer || "").slice(0, 400), level: level || "기본" };
  S.log.push(rec); if (S.log.length > 3000) S.log.splice(0, S.log.length - 3000);
  store.save(S); send(rec);
}

/* ===== 화면 ===== */
const root = () => $("#app");
function topbar() {
  const st = S.student;
  return h("header", { class: "top" },
    h("div", { class: "brand" }, ringLogo(), h("span", {}, APP.title), h("span", { class: "long" }, " · " + APP.unit)),
    h("div", { class: "who" },
      st ? h("span", { class: "chip" }, `${st.ban}반 ${st.no}번${st.name ? " " + st.name : ""}`) : null,
      st ? h("button", { class: "chip btn", onclick: () => { S.student = null; store.save(S); showGate(); } }, "바꾸기") : null,
      h("button", { class: "chip btn", onclick: showTeacher }, "선생님")));
}
function ringLogo() {
  const s = svgEl("svg", { viewBox: "0 0 40 40", "aria-hidden": "true" });
  s.append(svgEl("circle", { cx: 20, cy: 20, r: 16, fill: "none", stroke: "#F4C542", "stroke-width": 4 }),
    svgEl("line", { x1: 20, y1: 20, x2: 34, y2: 12, stroke: "#fff", "stroke-width": 3, "stroke-linecap": "round" }),
    svgEl("circle", { cx: 20, cy: 20, r: 3.5, fill: "#fff" }));
  return s;
}
function mount(...els) { const r = root(); r.innerHTML = ""; r.append(topbar(), ...els); window.scrollTo(0, 0); }

/* 시작: 번호 고르기 */
function showGate() {
  const last = S.last || {};
  let ban = (S.student && S.student.ban) || last.ban || "2";
  let no = last.no || null;
  const nums = h("div", { class: "nums" });
  for (let i = 1; i <= 40; i++) {
    const on = (i === no);
    nums.append(h("button", { class: on ? "on" : "", onclick: (e) => {
      no = i; [...nums.children].forEach(b => b.classList.remove("on"));
      e.currentTarget.classList.add("on"); go.disabled = false;
    } }, String(i)));
  }
  const banIn = h("input", { type: "number", min: 1, max: 15, value: ban, style: "width:4.5em", "aria-label": "반" });
  const go = h("button", { class: "big", disabled: !no, onclick: () => {
    S.student = { ban: String(banIn.value || "2"), no, name: "" };
    S.last = { ban: S.student.ban, no };
    store.save(S); flushQueue(); showMap();
  } }, "들어가기");
  mount(h("main", { class: "gate" }, h("section", { class: "gate-card" },
    h("h1", {}, APP.welcome),
    h("p", { class: "inst" }, APP.intro + " 내 번호를 눌러 주세요."),
    h("div", { class: "row" }, h("span", { class: "jua" }, "3학년"), banIn, h("span", { class: "jua" }, "반")),
    nums, go)));
}

/* 차시 지도 */
function wantedLesson() {
  const h = (location.hash || "").replace("#", "").trim();
  const q = new URLSearchParams(location.search).get("lesson");
  const key = q || h;
  if (!key) return null;
  return LESSONS.find(L => String(L.no) === key || L.id === key) || null;
}
function showMap() {
  if (!S.student) return showGate();
  const want = wantedLesson();
  if (want && !showMap._used) { showMap._used = true; return openLesson(want.id); }
  const trail = h("div", { class: "trail" });
  LESSONS.forEach(L => {
    const p = myProg(L.id), done = L.steps.filter((_, i) => p.steps[i] && p.steps[i].ok).length;
    const prog = h("div", { class: "prog" }, L.steps.map((_, i) => {
      const r = p.steps[i];
      return h("i", { class: r && r.ok ? (r.help === "넘어감" ? "half" : "on") : "" });
    }));
    trail.append(h("button", { class: "site" + (done === L.steps.length ? " done" : ""), onclick: () => openLesson(L.id) },
      p.chal && p.chal.ok ? h("span", { class: "star", title: "도전 완료" }, "★") : null,
      h("span", { class: "n" }, `${L.no}차시`), h("span", { class: "t" }, L.title),
      h("span", { class: "soop" }, `S.O.O.P. ${L.soop}`), prog));
  });
  const story = (typeof UNIT_STORY !== "undefined") ? UNIT_STORY : null;
  const storyCard = story ? h("section", { class: "story" },
    h("div", { class: "jua" }, `📖 이야기 · ${story.title}`),
    story.lines.map(t => h("p", {}, t))) : null;
  mount(h("main", { class: "map" }, h("h2", {}, "어느 차시를 탐험할까요?"),
    h("p", { class: "inst" }, "각 차시는 ‘개념 계단’ 다섯 칸으로 되어 있어요. 앞 계단을 해결해야 다음 계단이 열려요."),
    storyCard, trail));
}

/* 차시 학습 */
let CUR = null;
function openLesson(id, stepIdx) {
  const L = LESSONS.find(x => x.id === id); const p = myProg(id);
  let first = L.steps.findIndex((_, i) => !(p.steps[i] && p.steps[i].ok)); if (first < 0) first = L.steps.length - 1;
  CUR = { L, idx: stepIdx != null ? stepIdx : first };
  renderLesson();
}
function unlocked(L, i) { const p = myProg(L.id); for (let k = 0; k < i; k++) if (!(p.steps[k] && p.steps[k].ok)) return false; return true; }
function renderLesson() {
  const { L, idx } = CUR; const p = myProg(L.id);
  const stairs = h("nav", { class: "stairs", "aria-label": "개념 계단" },
    h("div", { class: "title" }, `${L.no}차시 · ${L.title}`), h("span", { class: "soopb" }, `S.O.O.P. ${L.soop}`));
  L.steps.forEach((st, i) => {
    const rec0 = p.steps[i], ok = rec0 && rec0.ok, lock = !unlocked(L, i);
    stairs.append(h("button", { class: "stair" + (i === idx ? " cur" : "") + (ok ? " ok" : "") + (lock ? " lock" : ""), disabled: lock,
      onclick: () => { CUR.idx = i; renderLesson(); } }, h("span", { class: "k" }, ok ? (rec0 && rec0.help === "넘어감" ? "△" : "✓") : String(i + 1)), h("span", { class: "lbl" }, st.name || STEP_NAMES[i])));
  });
  if (L.challenge) {
    const allOk = L.steps.every((_, i) => p.steps[i] && p.steps[i].ok);
    stairs.append(h("button", { class: "stair chal" + (idx === "chal" ? " cur" : "") + (p.chal && p.chal.ok ? " ok" : "") + (allOk ? "" : " lock"), disabled: !allOk,
      onclick: () => { CUR.idx = "chal"; renderLesson(); } }, h("span", { class: "k" }, "★"), h("span", { class: "lbl" }, "도전 계단")));
  }
  stairs.append(h("button", { class: "ghost back", onclick: showMap }, "차시 지도로"));
  stairs.append(h("button", { class: "ghost back copylink", onclick: () => {
    const url = location.origin + location.pathname + location.search.replace(/[?&]lesson=[^&]*/, "") + "#" + L.no;
    try { navigator.clipboard.writeText(url); toast("이 차시 주소를 복사했어요"); }
    catch (err) { toast(url); }
  } }, "이 차시 주소 복사"));

  const work = h("section", { class: "work" });
  const step = idx === "chal" ? L.challenge : L.steps[idx];
  const stepNo = idx === "chal" ? 6 : idx + 1;
  const name = idx === "chal" ? "도전 계단" : (step.name || STEP_NAMES[idx]);
  const speakText = () => `탐구 질문. ${L.question}. ${name}. ${step.inst || ""}`;
  const speakBtn = h("button", { class: "ghost speak", title: "문제를 읽어 줘요", onclick: () => {
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(speakText()); u.lang = "ko-KR"; u.rate = .9; speechSynthesis.speak(u); }
    catch (err) { toast("이 기기에서는 읽어 주기를 쓸 수 없어요."); }
  } }, "🔊 읽어 주기");
  if (typeof UNIT_STORY !== "undefined") work.append(h("div", { class: "scene" }, "📖 " + UNIT_STORY.one));
  work.append(h("div", { class: "q" }, "탐구 질문 · " + L.question),
    h("div", { class: "stephead" }, h("h2", { class: "stepname" }, `${idx === "chal" ? "★" : stepNo}. ${name}`), speakBtn));
  if (step.inst) work.append(h("p", { class: "inst" }, step.inst));
  const body = h("div"); work.append(body);
  const nextBtn = h("button", { class: "big", disabled: true }, "다음 계단");
  const fb = h("div", { class: "fb", role: "status", "aria-live": "polite" });
  const acts = h("div", { class: "actions" }, nextBtn, fb);
  work.append(acts);

  let tries = 0, finished = false, fails = 0;
  const helpBox = h("div", { class: "hintbox hidden" });
  const h1 = h("button", { class: "ghost help hidden", onclick: () => help1() }, "도움 1단계 · 단서 보기");
  const h2 = h("button", { class: "ghost help hidden", onclick: () => help2() }, "도움 2단계 · 중요한 낱말 보기");
  const h3 = h("button", { class: "ghost help hidden", onclick: () => help3() }, "도움 3단계 · 답 보고 따라 쓰기");
  const easyBtn = h("button", { class: "ghost hidden", onclick: () => openEasy() }, "조금 쉬운 문제로");
  acts.append(h1, h2, h3, easyBtn);
  work.append(helpBox);
  let given = { words: [], answers: [] };          // 도우미가 알려 주는 낱말·정답
  const hintList = (step.hints && step.hints.length ? step.hints.slice() : []).concat([L.summary]);
  let hintShown = 0;
  function help1() {
    if (hintShown >= hintList.length) { h1.disabled = true; return; }
    helpBox.classList.remove("hidden");
    helpBox.append(h("p", {}, h("b", {}, `단서 ${hintShown + 1}. `), hintList[hintShown]));
    hintShown++;
    h1.textContent = hintShown >= hintList.length ? "단서를 모두 봤어요" : "도움 1단계 · 단서 더 보기";
    if (hintShown >= hintList.length) h1.disabled = true;
  }
  function help2() {
    h2.disabled = true; helpBox.classList.remove("hidden");
    const words = (step.words && step.words.length ? step.words
      : (given.words && given.words.length ? given.words
      : (L.keywords || (typeof UNIT_KEYWORDS !== "undefined" ? UNIT_KEYWORDS : []))));
    helpBox.append(h("div", { class: "wordbank" },
      h("b", {}, "중요한 낱말 상자 "),
      words.length ? words.map(w => h("span", { class: "word" }, w)) : h("span", {}, "이 계단의 핵심 개념: " + L.summary)));
  }
  function passOver() {
    if (finished) return;
    api.done("[도움 3단계까지 보고 넘어감]", "괜찮아요. 다음 계단으로 가요. 시간이 있을 때 이 계단에 다시 와서 한 번 더 해 봐요.", "넘어감");
  }
  function help3() {
    h3.disabled = true; helpBox.classList.remove("hidden");
    nextBtn.disabled = false;   // 여기까지 왔으면 다음 계단으로 갈 수 있어요
    const ans = (step.answer ? [step.answer] : given.answers).filter(Boolean);
    if (!ans.length) {
      helpBox.append(h("p", {}, h("b", {}, "답 보기 · "), "이 계단은 직접 해 보는 활동이에요. 위 단서를 보고 한 번 더 해 보고, 어려우면 선생님이나 짝에게 도움을 청해요."),
        h("p", { class: "inst" }, "지금 어려우면 아래 ‘다음 계단’을 눌러 넘어가도 괜찮아요."));
      return;
    }
    const box = h("div", { class: "copybox" }, h("p", {}, h("b", {}, "답을 보고 그대로 따라 써요")));
    const rows = ans.map(t => {
      const inp = h("input", { type: "text", "aria-label": "따라 쓰기" });
      box.append(h("div", { class: "copyrow" }, h("span", { class: "target" }, t), inp));
      return { t, inp };
    });
    box.append(h("p", { class: "inst" }, "쓰면서 왜 그렇게 되는지 소리 내어 말해 봐요."));
    box.append(h("p", { class: "inst" }, "따라 쓰기가 어려우면 아래 ‘다음 계단’을 눌러 넘어가도 괜찮아요."));
    const norm = s => String(s).replace(/\s+/g, "").replace(/[，,]/g, "");
    box.append(h("div", { class: "actions" }, h("button", { class: "big", onclick: () => {
      let allOk = true;
      rows.forEach(r => { const good = norm(r.inp.value) === norm(r.t); r.inp.style.borderColor = good ? "var(--ok)" : "var(--no)"; if (!good) allOk = false; });
      if (!allOk) return api.hint("위의 답과 똑같이 써 보세요.");
      api.done("[따라 쓰기] " + ans.join(" / "), "잘 따라 썼어요. 다음에는 단서만 보고도 할 수 있을 거예요.", "도움");
    } }, "다 썼어요")));
    helpBox.append(box);
  }
  function openEasy() {
    if (!step.easy) return;
    easyBtn.classList.add("hidden");
    body.innerHTML = "";
    body.append(h("p", { class: "inst" }, "수를 작게 바꾼 문제예요. 이것부터 해 봐요."));
    step.easy(body, Object.assign({}, api, { done: (ans, msg) => api.done("[쉬운 문제] " + (ans || ""), msg || "좋아요! 같은 방법으로 큰 수도 할 수 있어요.") }));
  }
  const prevOk = idx === "chal" ? (p.chal && p.chal.ok) : (p.steps[idx] && p.steps[idx].ok);
  if (prevOk) { nextBtn.disabled = false; fb.className = "fb good"; fb.textContent = "이미 해결한 계단이에요. 다시 해 볼 수도 있어요."; }
  const api = {
    tryOnce() { tries++; },
    provide(info) { given = { words: (info && info.words) || [], answers: (info && info.answers) || [] }; },
    fail(msg, answer) {
      tries++; fails++;
      fb.className = "fb bad"; fb.textContent = "× " + (msg || "다시 생각해 봐요.");
      record(L, stepNo, name, false, tries, answer, idx === "chal" ? "도전" : "기본");
      if (fails >= 2) h1.classList.remove("hidden");

/* ── 자동 확인 ────────────────────────────────────────────────────────────
   '확인하기' 단추 없이, 칸을 다 채우거나 보기를 다 고르면 스스로 확인한다.
   · ready()가 참일 때만 확인한다(빈 칸이 있으면 기다린다).
   · 같은 답으로는 다시 세지 않는다(숫자를 고쳐 쓰는 동안 '틀림'이 쌓이지 않게).
   · 숫자 입력은 다 쓸 때까지 잠깐 기다렸다가 본다.                        */
function autoRun(ready, sign, run, wait) {
  let last = null, timer = null, done = false;
  const fire = () => {
    if (done || !ready()) return;
    const sg = sign();
    if (sg === last) return;
    last = sg;
    if (run() === true) done = true;
  };
  return () => { clearTimeout(timer); timer = setTimeout(fire, wait || 0); };
}

function quiz(body, api, items, opts = {}) {

      else { [...row.children].forEach(b => b.classList.remove("on")); e.currentTarget.classList.add("on"); state[qi] = oi; }
    } }, o)));

      btns.forEach(b => b.classList.remove("good", "bad"));

      (hit ? "예상이 맞았어요! " : "예상과 달랐네요. 그래서 어림이 재미있어요. ") +

  };
  const autoP = autoRun(() => String(inp.value).trim() !== "", () => inp.value, judge, 900);
  inp.addEventListener("input", autoP); inp.addEventListener("change", autoP);
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); inp.blur(); } });

/* ── 선택 문제 (★도전 계단 아래, 마인드맵을 다 붙이면 열림) ──────────────────
   render: withOptional((b, a) => panes(...), (b, a) => numbers(b, a, [...]), { title, inst })
   · 본 활동(main)만 해도 계단은 통과합니다. 선택 문제는 통과 여부와 상관없어요.
   · 선택 문제에서 쓴 답은 선생님 기록에 '선택'(6. 선택 문제)으로 남아요.          */
function withOptional(main, extra, opts = {}) {
  return (body, api) => {
    const L = CUR && CUR.L;
    const box = h("details", { class: "optbox hidden" },
      h("summary", {}, "➕ " + (opts.title || "더 해 보고 싶다면 — 선택 문제")));
    const inner = h("div", { class: "optin" });
    const ofb = h("div", { class: "fb", role: "status", "aria-live": "polite" });
    let tries = 0, solved = false;
    const sub = {
      tryOnce() { tries++; },
      provide() {},
      hint(m) { ofb.className = "fb"; ofb.textContent = m; },
      fail(m, ans) { tries++; ofb.className = "fb bad"; ofb.textContent = "× " + (m || "다시 생각해 봐요.");
        if (L) record(L, 6, "선택 문제", false, tries, ans, "선택"); },
      done(ans, m) { if (solved) return; solved = true; tries = Math.max(tries, 1);
        ofb.className = "fb good"; ofb.textContent = "○ " + (m || "선택 문제까지 해냈어요!");
        if (L) record(L, 6, "선택 문제", true, tries, ans, "선택"); }
    };
    let built = false;
    box.addEventListener("toggle", () => { if (box.open && !built) { built = true; extra(inner, sub); } });
    if (opts.inst) box.append(h("p", { class: "inst" }, opts.inst));
    box.append(inner, ofb);
    const open = () => box.classList.remove("hidden");
    const wrapped = Object.assign({}, api, { done: (a1, a2, a3) => { api.done(a1, a2, a3); open(); } });
    main(body, wrapped);
    body.append(box);
    if (L) { const p = myProg(L.id); if (p.chal && p.chal.ok) open(); }
  };
}

/* 순서 맞추기 */
function sequence(body, api, cards, order, opts = {}) {
  const picked = [];
  const row = h("div", { class: "seq" });
  const show = h("div", { class: "readout" }, "순서: ");
  cards.forEach((c, i) => row.append(h("button", { class: "opt", onclick: (e) => {
    if (picked.includes(i)) return; picked.push(i); e.currentTarget.classList.add("on");
    e.currentTarget.prepend(h("span", { class: "no" }, String(picked.length))); show.textContent = "순서: " + picked.map(k => c0(k)).join(" → ");
    if (picked.length === cards.length) {
      api.tryOnce();
      if (picked.every((v, k) => v === order[k])) api.done(picked.map(c0).join("→"), opts.ok);
      else { api.fail("순서가 달라요. ‘다시’를 누르고 한 번 더 해 봐요.", picked.map(c0).join("→")); }
    }

  const c0 = k => cards[k].slice(0, 1);
  body.append(row, show, h("div", { class: "actions" }, h("button", { class: "ghost", onclick: () => { picked.length = 0; [...row.children].forEach(b => { b.classList.remove("on"); const n = b.querySelector(".no"); n && n.remove(); }); show.textContent = "순서: "; } }, "다시")));

  svg.addEventListener("pointermove", e => { if (active) onMove(svgPt(svg, e), e); });

/* ===== 곱셈 단원 조작 부품 ===== */
function numbers(body, api, items, opts = {}) {
  const ins = [];
  const wrap = h("div");
  items.forEach(it => {
    const inp = h("input", { type: "number", inputmode: "numeric", style: "width:6em;font-size:1.2em", "aria-label": it.q });
    ins.push({ inp, a: it.a });
    wrap.append(h("div", { class: "qitem" }, h("span", { class: "jua" }, it.q + " "), inp, it.unit ? h("span", {}, " " + it.unit) : null));
  });
  api.provide && api.provide({
    words: opts.words || [],
    answers: items.map(it => `${it.q} ${it.a}${it.unit ? " " + it.unit : ""}`)
  });
  const judge = () => {
    api.tryOnce(); let ok = true;
    ins.forEach(({ inp, a }) => { const v = Number(inp.value); const good = v === a; inp.style.borderColor = good ? "var(--ok)" : "var(--no)"; if (!good) ok = false; });
    const given = ins.map(x => x.inp.value).join(", ");
    if (ok) { api.done(given, opts.ok); return true; }
    const bad = ins.find(({ inp, a }) => Number(inp.value) !== a);
    const item = items[ins.indexOf(bad)];
    const why = item && item.why && item.why[String(Number(bad.inp.value))];
    api.fail(why || opts.bad || "빨간 칸을 다시 계산해 봐요.", given);
    return false;
  };
  const auto = autoRun(() => ins.every(x => String(x.inp.value).trim() !== ""),
                       () => ins.map(x => x.inp.value).join("\u0001"), judge, 900);
  ins.forEach(({ inp }) => { inp.addEventListener("input", auto); inp.addEventListener("change", auto);
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); inp.blur(); } }); });
  body.append(wrap);
}

   공통 opt: item(물건 이름), unit(단위, 기본 "개"), kind(그림 종류), tip(안내), ok(칭찬), ask(확인 문항 [{q,a,unit,why}])
   kind: arrow(투호 화살) stone(바둑돌) fish(물고기) cookie(진저브레드) disc(원반) block(나무 도막) pebble(공깃돌)

/* 받침에 따라 조사 붙이기: u3J("화살","이","가") → "화살이" */
function u3J(w, a, b) {

/* 숫자·낱말 뒤 '으로/로': u3Ro(3) → "3으로", u3Ro(7) → "7로" */
function u3Ro(w) {
  const s = String(w), c = s.charCodeAt(s.length - 1);
  if (c >= 0xAC00 && c <= 0xD7A3) { const j = (c - 0xAC00) % 28; return s + (j === 0 || j === 8 ? "로" : "으로"); }

/* 입력 문항 줄(부품 안에서 함께 채점할 때) */
function u3AskRows(items) {
  const wrap = h("div");
  const rows = items.map(it => {
    const inp = h("input", { type: "number", inputmode: "numeric", style: "width:4.5em;font-size:1.15em", "aria-label": it.q });
    wrap.append(h("div", { class: "qitem" }, h("span", { class: "jua" }, it.q + " "), inp, it.unit ? h("span", {}, " " + it.unit) : null));

      r.inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); r.inp.blur(); } }); }); },
    values: () => rows.map(r => r.inp.value).join(", "),
    check() {   // 틀린 첫 문항 또는 null

      rows.forEach(r => { const good = r.inp.value !== "" && Number(r.inp.value) === r.it.a; r.inp.style.borderColor = good ? "var(--ok)" : "var(--no)"; if (!good && !bad) bad = r; });

/* ---------------------------------------------------------------
   1) 똑같이 나누어 담기 — 하나씩 번갈아 나누어 주기 (등분제)
   opt: n(전체), g(나누는 곳 수), item, unit, kind, box("명"|"접시"|"어항"|"바구니"…),
        labels([이름…]), ask([{q,a,unit,why}]), eq(true면 "n ÷ g =" 칸 추가), size(그림 크기)
   조작: 물건을 끌어 원하는 곳에 놓기 / 누르면 차례대로 한 곳씩 / 버튼 '하나씩 번갈아 주기'·'한 바퀴 나누어 주기'
--------------------------------------------------------------- */
function u3ShareOut(body, api, opt) {
  let autoShare = () => {};
  const n = opt.n, g = opt.g, q = n / g, item = opt.item || "물건", unit = opt.unit || "개", kind = opt.kind || "dot";
  const box = opt.box || "명";
  const labels = opt.labels || Array.from({ length: g }, (_, k) => box === "명" ? `${k + 1}번 친구` : `${box} ${k + 1}`);
  const W = 860, H = 460, s = opt.size || 44, step = s + 10;
  const svg = makeSvg(W, H);
  const perRow = Math.min(n, Math.floor((W - 40) / step));
  const poolRows = Math.ceil(n / perRow);
  const poolX0 = (W - perRow * step) / 2;
  const slot = i => ({ x: poolX0 + (i % perRow) * step + step / 2, y: 48 + Math.floor(i / perRow) * step + s / 2 });
  const poolBottom = 48 + poolRows * step + 4;
  const boxTop = poolBottom + 22, boxH = H - boxTop - 42;
  const bw = Math.min(260, (W - 40 - (g - 1) * 16) / g), x0 = (W - (g * bw + (g - 1) * 16)) / 2;
  const boxX = k => x0 + k * (bw + 16);
  const bcols = Math.max(1, Math.floor((bw - 12) / (s + 6)));
  const inBox = (k, j) => ({ x: boxX(k) + 6 + (j % bcols) * (s + 6) + (s + 6) / 2, y: boxTop + 10 + Math.floor(j / bcols) * (s + 6) + s / 2 + 2 });
  const loc = Array(n).fill(-1), boxes = Array.from({ length: g }, () => []);
  let turn = 0;
  const bg = svgEl("g"), layer = svgEl("g");
  bg.append(svgEl("rect", { x: 10, y: 10, width: W - 20, height: poolBottom - 4, rx: 14, fill: U3_SOFT.blue, stroke: BLUE, "stroke-width": 2 }),
    txt(W / 2, 30, `나누어 줄 ${item}`, 20, { fill: BLUE }));
  for (let k = 0; k < g; k++) {
    bg.append(svgEl("rect", { x: boxX(k), y: boxTop, width: bw, height: boxH, rx: 14, fill: "#fff", stroke: PINE, "stroke-width": 3, "stroke-dasharray": "9 7" }),
      txt(boxX(k) + bw / 2, boxTop + boxH + 22, labels[k], 22));
  }
  svg.append(bg, layer);
  const posOf = i => loc[i] < 0 ? slot(i) : inBox(loc[i], boxes[loc[i]].indexOf(i));
  const out = h("div", { class: "readout" });
  const draw = () => {
    layer.innerHTML = "";
    for (let i = 0; i < n; i++) { const p = posOf(i); const e = u3Icon(kind, p.x, p.y, s); e.dataset.i = i; layer.append(e); }
    const left = loc.filter(v => v < 0).length;
    out.innerHTML = `남은 ${item} <span class="pill">${left}${unit}</span>`;
    autoShare();
  };
  const moveTo = (i, k) => {
    if (loc[i] >= 0) boxes[loc[i]].splice(boxes[loc[i]].indexOf(i), 1);
    loc[i] = k; if (k >= 0) boxes[k].push(i);
  };
  const firstPool = () => loc.findIndex(v => v < 0);
  const giveNext = () => { const i = firstPool(); if (i < 0) return api.hint(`${u3J(item, "을", "를")} 모두 나누어 주었어요.`); moveTo(i, turn); turn = (turn + 1) % g; draw(); };
  const giveRound = () => {
    const left = loc.filter(v => v < 0).length;
    if (left === 0) return api.hint(`${u3J(item, "을", "를")} 모두 나누어 주었어요.`);

  const judge = () => {
    const counts = boxes.map(b => b.length), left = loc.filter(v => v < 0).length;
    const ans = `나눔 [${counts.join(",")}] / 답 ${ask.values()}`;
    api.tryOnce();
    if (counts.some(c => c !== counts[0])) { api.fail(`${labels.join(", ")}에 있는 ${item} 수가 서로 달라요. 똑같이 나누어 보세요.`, ans); return false; }
    const bad = ask.check();

/* ---------------------------------------------------------------
   2) 몇씩 묶어 덜어 내기 (포함제) — 덜어 낼 때마다 뺄셈식이 이어져요 12-3-3-3-3=0
   opt: n, per, item, unit, kind, mode("sub" 뺄셈식 / "group" 묶기), who(묶음 이름 "명"|"묶음"…),
        groupLabel(k→문자열), ask, eq(true면 "n ÷ per =" 칸 추가), size
   조작: 물건을 누르거나 아래로 끌면 지금 만드는 묶음에 들어가요 / 버튼 'per개씩 덜어 내기' / '하나 되돌리기'
--------------------------------------------------------------- */
function u3TakeAway(body, api, opt) {
  let autoTake = () => {};
  const n = opt.n, per = opt.per, cnt = n / per, item = opt.item || "물건", unit = opt.unit || "개", kind = opt.kind || "dot";
  const mode = opt.mode || "sub", verb = mode === "sub" ? "덜어 내기" : "묶기";
  const W = 880, H = 470, s = opt.size || 42, step = s + 10;
  const svg = makeSvg(W, H);
  const perRow = Math.min(n, 10);
  const poolRows = Math.ceil(n / perRow), poolX0 = (W - perRow * step) / 2;
  const slot = i => ({ x: poolX0 + (i % perRow) * step + step / 2, y: 48 + Math.floor(i / perRow) * step + s / 2 });
  const poolBottom = 48 + poolRows * step + 4;
  const gcols = Math.min(per, 5), grows = Math.ceil(per / gcols);
  const gw = gcols * (s + 6) + 14, gh = grows * (s + 6) + 12, gap = 16, labH = 34;
  const perLine = Math.max(1, Math.floor((W - 20 + gap) / (gw + gap)));
  const gTop = poolBottom + 20;
  const gX = k => { const inLine = Math.min(perLine, cnt); return (W - (inLine * gw + (inLine - 1) * gap)) / 2 + (k % perLine) * (gw + gap); };
  const gY = k => gTop + Math.floor(k / perLine) * (gh + labH + 8);
  const inGroup = (k, j) => ({ x: gX(k) + 7 + (j % gcols) * (s + 6) + (s + 6) / 2, y: gY(k) + 6 + Math.floor(j / gcols) * (s + 6) + (s + 6) / 2 });
  const taken = [];                     // 덜어 낸 순서
  const bg = svgEl("g"), layer = svgEl("g");
  bg.append(svgEl("rect", { x: 10, y: 10, width: W - 20, height: poolBottom - 4, rx: 14, fill: U3_SOFT.blue, stroke: BLUE, "stroke-width": 2 }),
    txt(W / 2, 30, opt.poolLabel || `${item} ${n}${unit}`, 20, { fill: BLUE }));
  svg.append(bg, layer);
  const label = k => opt.groupLabel ? opt.groupLabel(k) : (mode === "sub" ? `${n - k * per} - ${per} = ${n - (k + 1) * per}` : `${k + 1}묶음`);
  const posOf = i => { const t = taken.indexOf(i); return t < 0 ? slot(i) : inGroup(Math.floor(t / per), t % per); };
  const out = h("div", { class: "readout" });
  const draw = () => {
    layer.innerHTML = "";
    const full = Math.floor(taken.length / per), open = taken.length % per ? full + 1 : full;
    for (let k = 0; k < Math.min(cnt, open + (taken.length < n ? (taken.length % per ? 0 : 1) : 0)); k++) {
      const done = k < full;
      layer.append(svgEl("rect", { x: gX(k), y: gY(k), width: gw, height: gh, rx: 12, fill: done ? U3_SOFT.pine : "#fff", stroke: done ? PINE : TENT, "stroke-width": 3, "stroke-dasharray": done ? "" : "9 7" }));
      if (done) layer.append(txt(gX(k) + gw / 2, gY(k) + gh + 18, label(k), 20));
    }
    for (let i = 0; i < n; i++) { const p = posOf(i); const e = u3Icon(kind, p.x, p.y, s); e.dataset.i = i; layer.append(e); }
    const left = n - taken.length;
    if (mode === "sub") {

    } else out.innerHTML = `남은 ${item} <span class="pill">${left}${unit}</span>`;
    autoTake();
  };
  const takeOne = i => { if (taken.includes(i)) return; taken.push(i); };
  const takeGroup = () => {
    const pool = [...Array(n).keys()].filter(i => !taken.includes(i));
    if (!pool.length) return api.hint(`${u3J(item, "을", "를")} 모두 ${verb === "묶기" ? "묶었" : "덜어 냈"}어요.`);
    const need = per - taken.length % per;
    if (pool.length < need) return api.hint(`남은 ${u3J(item, "이", "가")} ${per}${unit}보다 적어요.`);
    pool.slice(0, need).forEach(takeOne); draw();
  };
  let drag = null;
  dragOn(svg, p => {
    let best = -1, bd = s * .62;
    for (let i = 0; i < n; i++) { if (taken.includes(i)) continue; const d = dist(slot(i), p); if (d < bd) { bd = d; best = i; } }
    if (best < 0) return false;
    const ghost = u3Icon(kind, p.x, p.y, s * 1.1); ghost.setAttribute("opacity", .85); svg.append(ghost);
    drag = { i: best, start: p, moved: false, ghost };
  }, p => {
    if (!drag) return;
    if (dist(p, drag.start) > 8) drag.moved = true;
    drag.ghost.setAttribute("transform", `translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`);
  }, p => {
    if (!drag) return;
    const { i, moved, ghost } = drag; ghost.remove(); drag = null;
    if (!moved || p.y > poolBottom) takeOne(i);
    draw();
  });
  const askItems = (opt.ask || [{ q: `${per}${unit}씩 몇 번 ${verb === "묶기" ? "묶었나요" : "덜어 냈나요"}?`, a: cnt, unit: "번" }])
    .concat(opt.eq ? [{ q: `${n} ÷ ${per} =`, a: cnt }] : []);
  const ask = u3AskRows(askItems);
  api.provide({ words: (mode === "sub" ? ["덜어 내기", "뺄셈식", "뺀 횟수", "몫"] : ["묶음", "묶음 수", "몫"]).concat(opt.words || []), answers: ask.answers() });
  const judge = () => {
    const left = n - taken.length, full = Math.floor(taken.length / per);
    const ans = `${verb} ${full}번(남은 ${left}) / 답 ${ask.values()}`;
    api.tryOnce();
    const bad = ask.check();
    if (bad) { api.fail(ask.whyOf(bad) || opt.bad || (mode === "sub" ? "뺄셈식에서 빼는 수가 몇 번 나오는지 세어 봐요." : "묶음이 몇 개인지 다시 세어 봐요."), ans); return false; }
    api.done(ans, opt.ok || `${n} ÷ ${per} = ${cnt}. ${per}${unit}씩 ${cnt}번이에요!`);
    return true;

  const auto = autoRun(() => taken.length >= n && ask.filled(),
                       () => taken.length + "|" + ask.sign(), judge, 1200);
  ask.wire(auto);

    h("p", {}, opt.tip || `${u3J(item, "을", "를")} 누르거나 아래로 끌어 ${per}${unit}씩 ${verb === "묶기" ? "묶어" : "덜어 내어"} 보세요.`),
    h("div", { class: "row" },
      h("button", { class: "ghost", onclick: takeGroup }, `${per}${unit}씩 ${verb}`),
      h("button", { class: "ghost", onclick: () => { taken.pop(); draw(); } }, "하나 되돌리기"),
      h("button", { class: "ghost", onclick: () => { taken.length = 0; draw(); } }, "처음부터")),
    out, ask.wrap)));
}

/* ---------------------------------------------------------------
   3) 배열 그림으로 곱셈식 ↔ 나눗셈식 (곱셈식 1개 → 나눗셈식 2개)
   opt: rows, cols, item, unit, kind, eqs([{t:"3 × 7 =", a:21, show:"col"|"row"}]), start("col"|"row"|null)
   세로 묶음(col): 한 묶음에 rows개씩 cols묶음 / 가로 묶음(row): 한 묶음에 cols개씩 rows묶음
--------------------------------------------------------------- */
function u3MulDiv(body, api, opt) {
  const R = opt.rows, C = opt.cols, item = opt.item || "물건", kind = opt.kind || "dot", unit = opt.unit || "개";
  const cell = Math.min(64, 760 / C, 330 / R), s = cell * .72;
  const W = Math.max(700, C * cell + 140), H = R * cell + 150;
  const X0 = (W - C * cell) / 2, Y0 = 70;
  const svg = makeSvg(W, H);
  const grp = svgEl("g"), items = svgEl("g");
  svg.append(grp, items);
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) items.append(u3Icon(kind, X0 + c * cell + cell / 2, Y0 + r * cell + cell / 2, s));
  let mode = null;
  const show = m => {
    mode = m; grp.innerHTML = "";
    if (m === "col") for (let c = 0; c < C; c++) {
      grp.append(svgEl("rect", { x: X0 + c * cell + 4, y: Y0 - 4, width: cell - 8, height: R * cell + 8, rx: 14, fill: U3_SOFT.pine, stroke: PINE, "stroke-width": 3 }),
        txt(X0 + c * cell + cell / 2, Y0 + R * cell + 26, String(c + 1), 20, { fill: PINE }));
    }
    if (m === "row") for (let r = 0; r < R; r++) {
      grp.append(svgEl("rect", { x: X0 - 6, y: Y0 + r * cell + 4, width: C * cell + 12, height: cell - 8, rx: 14, fill: U3_SOFT.tent, stroke: TENT, "stroke-width": 3 }),
        txt(X0 - 28, Y0 + r * cell + cell / 2, String(r + 1), 20, { fill: TENT }));
    }
    svg.querySelectorAll(".u3cap").forEach(e => e.remove());
    const cap = txt(W / 2, 32, m === "col" ? `세로로 ${R}${unit}씩 묶었어요. 묶음은 몇 개일까요?` : m === "row" ? `가로로 ${C}${unit}씩 묶었어요. 묶음은 몇 개일까요?` : `${item} 그림을 여러 가지로 묶어 보세요.`, 22);
    cap.setAttribute("class", "u3cap"); svg.append(cap);
  };
  show(opt.start || null);
  const ask = u3AskRows(opt.eqs.map(e => ({ q: e.t, a: e.a, why: e.why })));
  ask.rows.forEach((r, k) => r.inp.addEventListener("focus", () => { if (opt.eqs[k].show) show(opt.eqs[k].show); }));
  api.provide({ words: ["곱셈식", "나눗셈식", "묶음", "곱셈식 1개 → 나눗셈식 2개"], answers: ask.answers() });
  const judge = () => {
    api.tryOnce();
    const bad = ask.check(), ans = ask.values();
    if (bad) {
      const e = opt.eqs[ask.rows.indexOf(bad)]; if (e.show) show(e.show);
      api.fail(ask.whyOf(bad) || opt.bad || "빨간 칸의 식에 맞게 그림을 묶어 보고 다시 세어 봐요.", ans);
      return false;
    }
    api.done(ans, opt.ok || "곱셈식 하나로 나눗셈식 두 개를 만들 수 있어요!");
    return true;
  };
  ask.wire(autoRun(() => ask.filled(), () => ask.sign(), judge, 900));
  body.append(stageWrap(svg, h("div", { class: "side" },
    h("p", {}, opt.tip || "버튼을 눌러 묶어 보고, 식의 빈칸을 채워요. 칸을 누르면 알맞은 묶음이 보여요."),
    h("div", { class: "row" },
      h("button", { class: "ghost", onclick: () => show("col") }, `세로로 ${R}${unit}씩 묶기`),
      h("button", { class: "ghost", onclick: () => show("row") }, `가로로 ${C}${unit}씩 묶기`),
      h("button", { class: "ghost", onclick: () => show(null) }, "묶음 지우기")),
    ask.wrap)));
