<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🔢 글과 그림을 활용하여 설명하는 방법 알기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>:root{
  --bg:#F6EFE6; --paper:#FFFFFF; --ink:#2A2236; --soft:#5E5670; --line:#E2D6C6;
  --ok:#1F9E63; --no:#D2453A; --acc:#D64C5A; --tn:#6A4FC9; --warm:#FFF4D6; --warmline:#E8961E;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1D1A28;--paper:#2B2640;--ink:#F4F1FA;--soft:#C3BBD6;--line:#453E60;--tn:#A792F0;--warm:#3A3222;--warmline:#C98A2A}
}
:root[data-theme="dark"]{--bg:#1D1A28;--paper:#2B2640;--ink:#F4F1FA;--soft:#C3BBD6;--line:#453E60;--tn:#A792F0;--warm:#3A3222;--warmline:#C98A2A}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:26px;overflow:hidden}
button,input,textarea{font-family:var(--display);color:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:5px solid var(--acc);outline-offset:3px}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:clamp(12px,1.8vw,26px)}
.screen.on{display:flex}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0}
.title{font-size:clamp(40px,min(6.2vw,10.5vh),92px);line-height:1.12;text-align:center}
.lead{font-size:clamp(22px,2.3vw,32px);color:var(--soft);margin:0;text-align:center}
.center-col{align-items:center;overflow-y:auto}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.row-label{font-family:var(--display);font-size:clamp(22px,2.1vw,30px)}
.seg{display:flex;flex-wrap:wrap;border:3px solid var(--line);border-radius:18px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;font-size:clamp(20px,1.9vw,28px);padding:9px 16px;min-width:64px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.big-btn{font-size:clamp(28px,2.9vw,44px);padding:12px 44px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);box-shadow:0 6px 0 rgba(0,0,0,.25)}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.big-btn[disabled]{opacity:.35}
.mid-btn{font-size:clamp(22px,2.1vw,30px);padding:10px 28px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);box-shadow:0 5px 0 rgba(0,0,0,.22)}
.ghost-btn{font-size:clamp(20px,1.9vw,28px);padding:9px 24px;border-radius:999px;border:3px solid var(--ink);background:transparent}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tool{font-size:22px;border:3px solid var(--line);background:var(--paper);border-radius:14px;padding:6px 12px}
.chip{font-family:var(--display);font-size:clamp(20px,1.9vw,28px);padding:4px 16px;border-radius:999px;background:var(--paper);border:3px solid var(--line)}
.chip.now{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip.win{border-color:#E8961E;background:#E8961E;color:#fff}
.scores{display:flex;gap:8px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(20,14,30,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay.on{display:flex}
.panel{background:var(--paper);border-radius:26px;padding:clamp(20px,2.8vw,44px);width:min(1100px,94vw);max-height:92vh;overflow-y:auto;text-align:center;border-top:18px solid var(--pc,var(--ink))}
.panel h2{font-size:clamp(38px,4.6vw,66px);margin:0 0 10px}
.panel .why{font-size:clamp(25px,2.5vw,36px);line-height:1.55;margin:0 auto 20px;max-width:36em}
.stagebar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.st{font-family:var(--display);cursor:pointer;font-size:clamp(17px,1.65vw,24px);padding:5px 12px;border-radius:999px;border:3px solid var(--line);background:var(--paper);color:var(--soft)}
.st.now{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.st.done{border-color:var(--ok);color:var(--ok)}
.st.brk{border-style:dashed}
#bar .st:not(.now) .nm{display:none}
#bar .st{padding:5px 10px}
.goal{font-family:var(--display);font-size:clamp(18px,1.75vw,26px);color:var(--soft);text-align:center;margin:3px 0 0}
.body p{margin:0}
.ttsmsg:empty{display:none}
.bodywrap{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;padding:4px 2px}
.body{transform-origin:top center;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.4vh,18px);margin:auto 0;width:100%}
.hd{font-family:var(--display);font-size:clamp(28px,3.1vw,46px);text-align:center;line-height:1.3;max-width:28em}
.stepno{font-family:var(--display);font-size:clamp(16px,1.5vw,21px);color:var(--soft)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:6px;flex-wrap:wrap}
.tnote{border:3px solid var(--tn);color:var(--tn);background:var(--paper);border-radius:16px;padding:7px 16px;font-size:clamp(18px,1.7vw,24px)}
.qbox{background:var(--warm);border:5px solid var(--warmline);border-radius:24px;padding:clamp(14px,2vw,26px);width:min(1100px,94vw);text-align:center;font-family:var(--display);font-size:clamp(26px,2.9vw,42px);line-height:1.4}
.card1{width:min(1100px,94vw);background:var(--paper);border-radius:24px;border:4px solid var(--line);padding:clamp(14px,2vw,28px);display:flex;gap:clamp(14px,2.6vw,32px);align-items:center;justify-content:center}
.card1 .e{font-size:clamp(54px,6.4vw,100px);line-height:1;flex:none}
.card1 .x{font-family:var(--display);font-size:clamp(26px,3vw,44px);line-height:1.38}
/* flip cards */
.recall{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:14px;width:min(1200px,96vw)}
.rc{position:relative;min-height:clamp(160px,22vh,240px);border:0;background:none;perspective:1200px;font-family:var(--body);padding:0}
.rc .in{position:absolute;inset:0;transition:transform .5s;transform-style:preserve-3d}
.rc.open .in{transform:rotateY(180deg)}
.rc .f{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.rc .front{background:var(--cc);color:#fff;font-family:var(--display);font-size:clamp(23px,2.4vw,34px)}
.rc .front span{font-size:clamp(42px,4.4vw,64px)}
.rc .back2{background:var(--paper);border:5px solid var(--cc);transform:rotateY(180deg);font-size:clamp(20px,2vw,28px);line-height:1.45;color:var(--ink)}
/* talk */
.talk{width:min(1150px,95vw);display:grid;gap:10px}
.talk .q{background:var(--paper);border-radius:18px;border-left:14px solid var(--cc,var(--acc));padding:12px 20px;font-size:clamp(23px,2.4vw,34px);line-height:1.45;text-align:left}
.talk .q small{display:block;color:var(--soft);font-size:.7em;margin-top:4px}
.exs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:min(1150px,95vw)}
.ex{background:var(--paper);border:3px dashed var(--line);border-radius:999px;padding:6px 18px;font-size:clamp(19px,1.9vw,26px)}
.timer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.timer .t{font-family:var(--display);font-size:clamp(30px,3vw,44px);min-width:3.2em;text-align:center}
/* book */
.book{width:min(1150px,95vw);background:var(--paper);border-radius:24px;border:4px solid var(--line);padding:clamp(14px,2vw,26px);display:grid;grid-template-columns:auto 1fr;gap:clamp(12px,2vw,26px);align-items:center}
.book .e{font-size:clamp(60px,7vw,110px);line-height:1}
.book .pg{font-family:var(--display);font-size:clamp(28px,3vw,44px);color:var(--acc)}
.book ol,.book ul{margin:6px 0 0;padding-left:1.2em;font-size:clamp(22px,2.2vw,31px);line-height:1.5;text-align:left}
.pickways{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:12px;width:min(1150px,95vw)}
.pw{border:4px solid var(--line);background:var(--paper);border-radius:20px;padding:12px;font-size:clamp(20px,2vw,28px);display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--body)}
.pw span{font-size:clamp(34px,3.4vw,50px)}
.pw.lit{border-color:var(--acc);box-shadow:inset 0 0 0 4px var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--paper))}
/* multiple choice */
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(1100px,95vw)}
.opt2{border:4px solid var(--line);background:var(--paper);border-radius:18px;padding:12px 18px;font-family:var(--body);font-size:clamp(22px,2.3vw,32px);line-height:1.4;text-align:left}
.opt2.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--paper))}
.opt2.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 14%,var(--paper))}
/* sort */
.bins{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:clamp(8px,1.4vw,18px);width:min(1200px,96vw)}
.bin{position:relative;border:0;background:var(--cc);color:#fff;border-radius:36px 36px 18px 18px;padding:clamp(10px,1.8vh,20px) 8px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 7px 0 rgba(0,0,0,.22)}
.bin .e{font-size:clamp(34px,4vw,60px);line-height:1}
.bin .n{font-size:clamp(21px,2.3vw,34px);text-align:center;line-height:1.25}
.bin:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.22)}
.bin.lit{outline:6px solid var(--ink);outline-offset:4px}
.bin[disabled]{opacity:.75}
/* order */
.olist{width:min(1100px,95vw);display:grid;gap:10px}
.oi{display:flex;align-items:center;gap:12px;border:4px solid var(--line);background:var(--paper);border-radius:18px;padding:8px 14px;font-family:var(--body);font-size:clamp(20px,2vw,28px);line-height:1.35;text-align:left}
@media (min-width:1000px){.olist.two{grid-template-columns:1fr 1fr}.lsn.two{grid-auto-flow:column;grid-template-columns:1fr 1fr;grid-template-rows:repeat(var(--r),auto)}.talk.two{grid-template-columns:1fr 1fr}.mgrid.wide{grid-template-columns:1fr 1fr}}
.oi .no{flex:none;width:1.9em;height:1.9em;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--line);color:var(--ink);font-family:var(--display)}
.oi.got .no{background:var(--acc);color:#fff}
.oi.got{border-color:var(--acc)}
.oi.right{border-color:var(--ok)}.oi.right .no{background:var(--ok)}
.oi.miss{border-color:var(--no)}.oi.miss .no{background:var(--no)}
/* match */
.mgrid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr);gap:12px 18px;width:min(1150px,96vw)}
.mcol{display:grid;gap:10px;align-content:start}
.mw,.mm{border:4px solid var(--line);background:var(--paper);border-radius:18px;padding:10px 16px;font-size:clamp(21px,2.2vw,31px);line-height:1.35;text-align:left}
.mw{font-family:var(--display);text-align:center;font-size:clamp(26px,2.8vw,40px)}
.mm{font-family:var(--body)}
.mw.sel{border-color:var(--acc);box-shadow:inset 0 0 0 4px var(--acc)}
.mw.done,.mm.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper));opacity:.8}
.mm.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* fill blanks */
.fillbox{width:min(1100px,95vw);display:grid;gap:12px}
.fl{background:var(--paper);border-radius:18px;padding:12px 18px;font-size:clamp(22px,2.3vw,32px);line-height:1.9;text-align:left;border-left:12px solid var(--cc,var(--acc))}
.fl input{font-family:var(--display);font-size:1em;width:calc(var(--w,4) * 1.15em + 1em);border:0;border-bottom:4px solid var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--paper));border-radius:8px 8px 0 0;padding:0 6px;text-align:center;color:var(--ink)}
.fl input::placeholder{color:color-mix(in srgb,var(--soft) 55%,transparent)}
.fl input.ok{border-bottom-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--paper))}
.fl input.bad{border-bottom-color:var(--no)}
/* listen */
.lsn{width:min(1100px,95vw);display:grid;gap:8px}
.ln{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border-radius:14px;padding:6px 14px;border:3px solid var(--line);text-align:left;font-size:clamp(20px,2vw,28px);line-height:1.45}
.ln b{font-family:var(--display);font-weight:400;flex:none;color:var(--cc,var(--acc));min-width:4.2em}
.ln.now{border-color:var(--acc);box-shadow:inset 0 0 0 3px var(--acc)}
.lsn.hide .ln span{filter:blur(9px);user-select:none}
/* write */
.wr{width:min(1150px,96vw);display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.wf.full{grid-column:1/-1}
.wf{background:var(--paper);border-radius:18px;padding:10px 16px;border:3px solid var(--line);text-align:left}
.wf label{display:block;font-family:var(--display);font-size:clamp(21px,2.1vw,30px);margin-bottom:4px}
.wf label small{color:var(--soft);font-family:var(--body);font-size:.75em}
.wf textarea,.wf input{width:100%;font-family:var(--body);font-size:clamp(22px,2.3vw,32px);line-height:1.6;border:3px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--bg);color:var(--ink);resize:vertical}
.wbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.wbar .tool{font-family:var(--display)}
.wcount{font-family:var(--display);font-size:clamp(18px,1.7vw,24px);color:var(--soft)}
.wcheck{width:min(1150px,96vw);background:var(--paper);border-radius:18px;border:4px solid var(--ok);padding:12px 18px;text-align:left;display:none}
.wcheck.on{display:block}
.wcheck h3{font-size:clamp(22px,2.2vw,30px);margin-bottom:6px}
.wcheck li{font-size:clamp(19px,1.9vw,27px);line-height:1.5;margin-bottom:6px}
.auto-ok{color:var(--ok)}.auto-no{color:var(--no)}
.self{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-top:2px dashed var(--line);padding:8px 0}
.self>span:first-child{font-size:clamp(19px,1.9vw,27px);flex:1 1 12em}
.self>.seg{flex:none}
.recgrid .self>span:first-child{font-size:clamp(17px,1.6vw,23px)}
.recgrid .wcheck{padding:8px 14px}
.recgrid .wcheck h3{font-size:clamp(19px,1.8vw,25px)}
.self .seg button{font-size:clamp(16px,1.5vw,21px);padding:6px 10px;min-width:0}
.ex-model{width:min(1150px,96vw);background:var(--warm);color:var(--ink);border:3px dashed var(--warmline);border-radius:16px;padding:10px 16px;font-size:clamp(19px,1.9vw,26px);text-align:left;display:none}
.ex-model.on{display:block}
/* record */
.recgrid{width:min(1200px,96vw);display:grid;gap:12px;align-items:start}
.recgrid>*{width:auto!important;min-width:0}
@media (min-width:1000px){.recgrid{grid-template-columns:1.5fr 1fr}.recgrid.bm{grid-template-columns:1fr 1.25fr}}
.recgrid .book{grid-template-columns:1fr}.recgrid .book .e{display:none}.recgrid .book ol{font-size:clamp(19px,1.9vw,26px)}
.rec{width:min(1150px,96vw);background:var(--paper);border:4px solid var(--line);border-radius:22px;padding:clamp(12px,1.8vw,24px);text-align:left;font-size:clamp(22px,2.3vw,34px);line-height:1.7;font-family:var(--body)}
.rec .p1,.rec .p2{color:var(--acc);font-family:var(--display);font-size:.8em;padding:0 .12em}
.rec.nomark .p1,.rec.nomark .p2{display:none}
.rec .src{display:block;font-size:14px;color:var(--soft);text-align:right}
.recbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.recbar .tool{font-family:var(--display)}
.recbar .on{background:var(--no);color:#fff;border-color:var(--no)}
.recmsg{font-family:var(--display);font-size:clamp(17px,1.6vw,22px);color:var(--soft);text-align:center;min-height:1.3em}
.recmsg.err{color:var(--no)}
/* summary */
.sum{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:14px;width:min(1150px,95vw)}
.sumbox{background:var(--paper);border-radius:22px;border-top:14px solid var(--cc);padding:14px 20px;text-align:left}
.sumbox b{font-family:var(--display);font-weight:400;font-size:clamp(23px,2.4vw,34px);display:block;margin-bottom:6px}
.sumbox li{font-size:clamp(20px,2vw,28px);line-height:1.5;margin-bottom:4px}
.promise{width:min(1100px,94vw);display:grid;gap:10px}
.promise div{background:var(--paper);border-radius:16px;padding:12px 20px;font-size:clamp(22px,2.2vw,31px);border-left:14px solid var(--ok);text-align:left}
/* bingo */
.bgcall{width:min(1100px,95vw);background:var(--paper);border:6px solid var(--acc);border-radius:26px;padding:clamp(16px,2.4vw,32px);text-align:center;font-family:var(--display);font-size:clamp(28px,3.4vw,50px);line-height:1.35;min-height:4em;display:flex;align-items:center;justify-content:center}
.bglog{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(1150px,96vw)}
.bglog span{background:var(--paper);border:3px solid var(--line);border-radius:12px;padding:4px 12px;font-size:clamp(16px,1.5vw,21px)}
/* teacher panel */
.tpanel{text-align:left}
.tpanel h3{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.1vw,30px);margin:14px 0 6px;color:var(--tn)}
.tpanel li,.tpanel p{font-size:clamp(19px,1.8vw,25px);line-height:1.55}
.tpanel .src{display:inline-block;font-size:.8em;color:var(--soft);background:var(--bg);border-radius:8px;padding:0 8px}
.lklist{display:grid;gap:12px;text-align:left;margin-bottom:18px}
.lkrow{display:flex;gap:14px;align-items:center;background:var(--bg);border-radius:16px;padding:12px 18px;text-decoration:none;color:inherit;border:3px solid var(--line)}
.lkrow .e{font-size:clamp(28px,2.8vw,40px)}
.lkrow b{font-family:var(--display);font-weight:400;font-size:clamp(21px,2.1vw,29px);display:block}
.lkrow small{color:var(--soft);font-size:clamp(16px,1.6vw,21px)}
.ttsbar{display:flex;gap:6px;align-items:center}
.ttsmsg{font-size:16px;color:var(--no);text-align:center}
@media (max-width:860px){.recall,.bins,.pickways{grid-template-columns:1fr 1fr}.opts2,.sum{grid-template-columns:1fr}.mgrid{grid-template-columns:minmax(0,.75fr) minmax(0,1.5fr)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
body,h1,h2,h3,p,li,span,div,button,a,label,small,b{word-break:keep-all;overflow-wrap:break-word;line-break:strict}
h1,h2,h3,.title,.hd,.x,.n,.lead{text-wrap:balance}
p,li,small,.why,.opt2,.oi,.mm,.q{text-wrap:pretty}
.creditbar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;margin-top:10px}
.tolist{display:none;align-items:center;gap:8px;font-family:var(--display);font-size:clamp(19px,1.9vw,25px);text-decoration:none;color:inherit;border:3px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 20px}
.tolist.on{display:inline-flex}

<script>
const C={"id": "u2-l7", "title": "🔢 글과 그림을 활용하여 설명하는 방법 알기", "sub": "3학년 2학기 국어 2단원 · 유창하게 읽고 발표해요 · 7차시", "goal": "글과 그림을 활용하여 설명하는 방법을 알아봅시다.", "note0": ["수업 준비 · 7차시", "<h3>학습 목표<\/h3><p>글과 그림을 활용하여 설명하는 방법을 안다. <span class=\"src\">『국어』 90~93쪽 · 『국어활동』 24~25쪽<\/span><\/p><h3>이 차시의 목적 <span class=\"src\">지도서 148쪽<\/span><\/h3><ul><li>글과 그림을 모두 활용해 대상을 설명하는 제재를 읽고, 글과 그림을 연결해 내용을 이해하는 방법을 배웁니다.<\/li><li>내용을 전달할 때 글과 그림의 역할을 파악하고, 글과 그림을 <b>색, 크기, 모양<\/b>으로 표현하는 까닭을 탐색합니다.<\/li><\/ul><h3>주민 등록 번호<\/h3><p>교과서가 주민 등록 번호를 설명하지만, 학생에게 자기 번호를 쓰거나 말하게 하지 않도록 해 주세요. 화면에서도 묻지 않습니다.<\/p><h3>성취 기준<\/h3><p><b>[4국01-05]<\/b> 목적과 주제에 알맞게 자료를 정리하여 자신감 있게 발표한다.<\/p><p><b>[4국06-02]<\/b> 매체를 활용하여 간단한 발표 자료를 만든다.<\/p><h3>단원 지도 유의 사항 <span class=\"src\">지도서 129쪽<\/span><\/h3><ul><li>글과 그림을 활용해 설명하는 방법을 지도할 때 <b>글이 하는 역할과 그림이 하는 역할<\/b>을 이해하고, 글과 그림을 연결해 읽었을 때의 효과를 파악하게 합니다.<\/li><li>발표 자료를 만들 때 더 알아보고 싶은 내용을 조사할 <b>충분한 시간<\/b>을 줍니다. 만든 자료를 공유하며 협력적인 태도로 서로 의견을 나누게 합니다.<\/li><\/ul><h3>교과서 작품<\/h3><p>교과서 글(「나무」, 「신기한 구슬」, 「박에스더」, 「이름처럼 쓰는 숫자」, 태권도 글)은 저작권이 있어 화면에 싣지 않았습니다. 교과서를 함께 펴 주세요. 녹음 연습용 글과 일기 예보 예시는 이 자료를 위해 새로 지은 글입니다.<\/p>"], "stages": [{"name": "동기 유발", "min": 5, "steps": [{"t": "cards", "hd": "이 그림은 무엇을 나타낼까요?", "cards": [{"e": "🏹", "c": "#D64C5A", "t": "?", "d": "양궁"}, {"e": "🏸", "c": "#2F74E0", "t": "?", "d": "배드민턴"}, {"e": "🥋", "c": "#1F9E63", "t": "?", "d": "태권도"}, {"e": "🏓", "c": "#E8961E", "t": "?", "d": "탁구"}], "q": "글자가 없어도 무엇인지 알 수 있었나요? 설명할 때 글과 그림을 함께 쓰는 까닭은 무엇일까요?"}], "note": ["① 동기 유발 (5분)", "<h3>진행 <span class=\"src\">지도서 148~149쪽<\/span><\/h3><ul><li>양궁, 배드민턴, 태권도, 탁구처럼 운동 종목을 나타내는 픽토그램을 보고 무엇인지 알아맞히게 합니다. 화면의 그림은 픽토그램 대신 쓴 그림 문자입니다. 지도서 149쪽 픽토그램(국제올림픽위원회)을 함께 보여 주어도 됩니다.<\/li><li>설명할 때 글과 그림을 활용하는 까닭을 생각해 보게 합니다.<\/li><\/ul><h3>대안 활동<\/h3><p>교실 안내 문구, 학급 알림판, 시간표, 학교 게시판 포스터에서 글과 그림을 활용한 사례를 찾아보기.<\/p><h3>학습 문제<\/h3><p>글과 그림을 활용하여 설명하는 방법을 알아봅시다.<\/p>"]}, {"name": "내용 파악하기", "min": 12, "steps": [{"t": "book", "page": "『국어』 90~91쪽 「이름처럼 쓰는 숫자」", "e": "🔢", "do const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

function fitNow(){const w=$('bodyWrap'),b=$('body');if(!w||!$('stage').classList.contains('on'))return;
  const isWrite=!!b.querySelector('.wr');const min=isWrite?0.86:0.78;
  b.style.transform='';b.style.marginTop='0px';b.style.marginBottom='0px';b.style.width='';b.style.marginLeft='';b.style.marginRight='';
  const H=b.offsetHeight,A=w.clientHeight-8;let g=1;
  if(H>A)g=Math.max(min,A/H);
  else if(!isWrite&&H<A*0.7){const Wc=Math.max(1,...[...b.children].filter(c=>!c.matches('p,.hd,.lead,.stepno,.ttsmsg')).map(c=>c.offsetWidth));g=Math.min(1.3,A*0.85/H,(w.clientWidth-8)/Wc);if(g<1.03)g=1;}
  if(g!==1){b.style.transform=`scale(${g})`;if(g>1){b.style.width=`${100/g}%`;b.style.marginLeft='auto';b.style.marginRight='auto';}}
  if(g>1){const H2=b.offsetHeight;if(H2*g>A){g=Math.max(1,A/H2);if(g<1.03){g=1;b.style.transform='';b.style.width='';}else b.style.transform=`scale(${g})`;}}
  const H3=b.offsetHeight,V=H3*g,free=Math.max(0,A-V);const Hh=H3;
  b.style.marginTop=`${Math.min(free*0.15,40)}px`;b.style.marginBottom=`${V-Hh+free-Math.min(free*0.15,40)}px`;}

   ${X.model?`<div class="ex-model" id="exModel"><b>💡 예시</b> — 그대로 베끼지 말고 내 경험으로 바꾸어 써요.<br>${X.model}</div>`:''}
   <div class="wcheck" id="wBox"></div>`;
  const tas=X.fields.map((f,i)=>$('w'+i));
  tas.forEach((t,i)=>{t.value=saved['f'+i]||'';t.oninput=()=>{saved['f'+i]=t.value;store.set(key,saved);count();};});
  const all=()=>tas.map(t=>t.value.trim()).filter(Boolean);
  const count=()=>{const n=all().join('').replace(/\s/g,'').length;$('wCount').textContent=`글자 수 ${n}${X.min?` / ${X.min}자 넘게`:''}`;};count();
  $('wSpeak').onclick=()=>{const t=all();if(!t.length){$('wCount').textContent='먼저 글을 써 보세요 ✏️';return;}speak(t.map(x=>({text:x})));};
  $('wStop').onclick=stopSpeak;
  if(X.model)$('wModel').onclick=()=>$('exModel').classList.toggle('on');
  let clr=0;$('wClear').onclick=()=>{if(!clr){clr=1;$('wClear').textContent='🧽 한 번 더 누르면 지워져요';setTimeout(()=>{clr=0;$('wClear').textContent='🧽 지우기';},2500);return;}
    tas.forEach((t,i)=>{t.value='';saved['f'+i]='';});store.set(key,saved);count();clr=0;$('wClear').textContent='🧽 지우기';};
  $('wCopy').onclick=()=>{const txt=`[${C.sub} · ${X.hd.replace(/<[^>]+>/g,'')}]\n`+X.fields.map((f,i)=>`${f.l.replace(/<[^>]+>/g,'')}: ${tas[i].value.trim()}`).join('\n');
    const ok=()=>{$('wCopy').textContent='📋 복사했어요';setTimeout(()=>$('wCopy').textContent='📋 복사하기',1800);};
    try{navigator.clipboard.writeText(txt).then(ok,()=>{});}catch(e){}};
  $('wCheck').onclick=()=>{
    const text=all().join('\n');const n=text.replace(/\s/g,'').length;const auto=[];
    if(X.min)auto.push(n>=X.min?[1,`글자 수가 ${n}자예요. 충분히 썼어요.`]:[0,`글자 수가 ${n}자예요. ${X.min}자가 넘도록 조금 더 써 볼까요?`]);
    tas.forEach((t,i)=>{if(X.fields[i].need&&!t.value.trim())auto.push([0,`‘${X.fields[i].l.replace(/<[^>]+>/g,'')}’ 칸이 비어 있어요.`]);});
    if(X.punct!==false){const sents=text.split(/\n+/).map(s=>s.trim()).filter(s=>s.length>=6);const miss=sents.filter(s=>!/[.?!。…~)"'’”]$/.test(s));
      auto.push(miss.length?[0,`문장 끝에 마침표(.)나 물음표(?)가 없는 줄이 ${miss.length}개 있어요: “${esc(miss[0].slice(-12))}”`]:[1,'문장 끝에 문장 부호를 잘 썼어요.']);}
    const sv=saved.self||{};
    $('wBox').innerHTML=`<h3>🤖 자동 점검</h3><ul>${auto.map(a=>`<li class="${a[0]?'auto-ok':'auto-no'}">${a[0]?'✅':'✏️'} ${a[1]}</li>`).join('')}</ul>
      <h3>🙋 스스로 점검 <small style="font-family:var(--body);font-size:.7em;color:var(--soft)">매우 잘함 ●●● · 잘함 ●● · 보통임 ●</small></h3>${X.check.map((c,i)=>`<div class="self"><span>${c}</span><span class="seg">${['●●●','●●','●'].map((d,k)=>`<button data-c="${i}" data-v="${k}" aria-pressed="${sv[i]===k}">${d}</button>`).join('')}</span></div>`).join('')}`;
    $('wBox').classList.add('on');beep('tick');
    $('wBox').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{sv[+b.dataset.c]=+b.dataset.v;saved.self=sv;store.set(key,saved);
      $('wBox').querySelectorAll(`[data-c="${b.dataset.c}"]`).forEach(z=>z.setAttribute('aria-pressed',z===b));});
    $('wBox').scrollIntoView({behavior:'smooth',block:'nearest'});
  };
};
/* 녹음하고 다시 듣기 (지도서: 녹음해 들어 보며 스스로 점검) */
let REC=null;
function stopRec(){try{if(REC&&REC.state==='recording')REC.stop();}catch(e){}}
R.record=X=>{
  const key='hj-kor-'+C.id+'-'+X.id;const saved=store.get(key)||{};const sv=saved.self||{};
  const txt=X.text?X.text.replace(/\/\//g,'\u0001').replace(/\//g,'\u0002').replace(/\u0001/g,'<span class="p2">∨∨</span>').replace(/\u0002/g,'<span class="p1">∨</span>'):'';
  $('body').innerHTML=hd(X)+`<div class="recbar">${X.text?'<button class="tool" id="rModel">🔈 본보기 듣기</button><button class="tool" id="rMark">∨ 띄어 읽기 표시 끄기</button>':''}<button class="tool" id="rGo">🎙️ 녹음하기</button><button class="tool" id="rPlay" disabled>▶ 내 목소리 듣기</button></div>
   <p class="recmsg" id="rMsg">🎙️를 누르고 소리 내어 읽은 뒤 ⏹로 멈춰요. 녹음은 이 화면을 떠나면 지워져요.</p><audio id="rAud" hidden></audio>
   <div class="recgrid ${X.text?'':'bm'}">`+(X.text?`<div class="rec" id="recTxt">${txt}${X.src?`<span class="src">${X.src}</span>`:''}</div>`:`<div class="book"><div class="e">📖</div><div><div class="pg">${X.page||'교과서를 펴요'}</div>${X.do?`<ol>${X.do.map(d=>`<li>${d}</li>`).join('')}</ol>`:''}</div></div>`)
   +`<div class="wcheck on" style="border-color:var(--acc)"><h3>🙋 스스로 점검 <small style="font-family:var(--body);font-size:.7em;color:var(--soft)">매우 잘함 ●●● · 잘함 ●● · 보통임 ●</small></h3>${X.check.map((c,i)=>`<div class="self"><span>${c}</span><span class="seg">${['●●●','●●','●'].map((d,k)=>`<button data-c="${i}" data-v="${k}" aria-pressed="${sv[i]===k}">${d}</button>`).join('')}</span></div>`).join('')}</div></div>`;
  const msg=(t,e)=>{$('rMsg').textContent=t;$('rMsg').className='recmsg'+(e?' err':'');};
  if(X.text){$('rModel').onclick=()=>speak(X.text.split('//').map(t=>({text:t.replace(/\//g,' ').trim()})).filter(p=>p.text));
    $('rMark').onclick=()=>{const r=$('recTxt');r.classList.toggle('nomark');$('rMark').textContent=r.classList.contains('nomark')?'∨ 띄어 읽기 표시 켜기':'∨ 띄어 읽기 표시 끄기';};}
  let url=null,t0=0,tick=null;
  $('rGo').onclick=async()=>{
    if(REC&&REC.state==='recording'){stopRec();return;}
    stopSpeak();
    if(!navigator.mediaDevices||!window.MediaRecorder){msg('이 기기에서는 녹음 기능을 쓸 수 없어요. 친구가 들어 주는 방법으로 점검해요.',1);return;}
    try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const ch=[];REC=new MediaRecorder(st);
      REC.ondataavailable=e=>{if(e.data.size)ch.push(e.data);};
      REC.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearInterval(tick);if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob(ch,{type:REC.mimeType||'audio/webm'}));
        $('rAud').src=url;$('rPlay').disabled=false;$('rGo').textContent='🎙️ 다시 녹음하기';$('rGo').classList.remove('on');msg('녹음했어요. ▶를 눌러 내 목소리를 들어 보고, 아래에서 스스로 점검해요.');beep('ok');};
      REC.start();t0=Date.now();$('rGo').textContent='⏹ 멈추기';$('rGo').classList.add('on');$('rPlay').disabled=true;
      tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);msg(`🔴 녹음하는 중… ${s}초`);if(s>=120)stopRec();},250);
    }catch(e){msg('마이크를 쓸 수 없어요. 마이크 사용을 허용했는지 선생님께 여쭤보세요.',1);}
  };
  $('rPlay').onclick=()=>{const a=$('rAud');a.currentTime=0;a.play().catch(()=>{});};
  $('body').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{sv[+b.dataset.c]=+b.dataset.v;saved.self=sv;store.set(key,saved);
    $('body').querySelectorAll(`[data-c="${b.dataset.c}"]`).forEach(z=>z.setAttribute('aria-pressed',z===b));});
};

  $('body').innerHTML=hd(X)+`<div class="bgcall" id="bgC">🎲 ‘뽑기’를 누르면 사건이 나와요</div><div class="row"><button class="mid-btn" id="bgGo">🎲 사건 뽑기</button><button class="ghost-btn" id="bgRe">처음부터</button></div><div class="bglog" id="bgL"></div>`;
  const draw=()=>{$('bgL').innerHTML=said.map((s,i)=>`<span>${i+1}. ${s}</span>`).join('');};
  $('bgGo').onclick=()=>{if(!left.length){$('bgC').textContent='사건을 모두 뽑았어요! 빙고를 확인해 봐요.';beep('win');return;}const s=left.pop();said.push(s);$('bgC').textContent=s;beep('tick');draw();speak([{text:s}]);};
  $('bgRe').onclick=()=>{left=shuffle(X.calls);said=[];$('bgC').textContent='🎲 ‘뽑기’를 누르면 사건이 나와요';draw();};
};
