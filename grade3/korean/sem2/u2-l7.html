<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🔢 글과 그림을 활용하여 설명하는 방법 알기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>:root{
  --bg:#F6EFE6; --paper:#FFFFFF; --ink:#2A2236; --soft:#5E5670; --line:#E2D6C6;
  --ok:#1F9E63; --no:#D2453A; --acc:#D64C5A; --tn:#6A4FC9; --warm:#FFF4D6; --warmline:#E8961E;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1D1A28;--paper:#2B2640;--ink:#F4F1FA;--soft:#C3BBD6;--line:#453E60;--tn:#A792F0;--warm:#3A3222;--warmline:#C98A2A}
}
:root[data-theme="dark"]{--bg:#1D1A28;--paper:#2B2640;--ink:#F4F1FA;--soft:#C3BBD6;--line:#453E60;--tn:#A792F0;--warm:#3A3222;--warmline:#C98A2A}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:26px;overflow:hidden}
button,input,textarea{font-family:var(--display);color:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:5px solid var(--acc);outline-offset:3px}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:clamp(12px,1.8vw,26px)}
.screen.on{display:flex}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0}
.title{font-size:clamp(40px,min(6.2vw,10.5vh),92px);line-height:1.12;text-align:center}
.lead{font-size:clamp(22px,2.3vw,32px);color:var(--soft);margin:0;text-align:center}
.center-col{align-items:center;overflow-y:auto}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.row-label{font-family:var(--display);font-size:clamp(22px,2.1vw,30px)}
.seg{display:flex;flex-wrap:wrap;border:3px solid var(--line);border-radius:18px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;font-size:clamp(20px,1.9vw,28px);padding:9px 16px;min-width:64px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.big-btn{font-size:clamp(28px,2.9vw,44px);padding:12px 44px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);box-shadow:0 6px 0 rgba(0,0,0,.25)}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.big-btn[disabled]{opacity:.35}
.mid-btn{font-size:clamp(22px,2.1vw,30px);padding:10px 28px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);box-shadow:0 5px 0 rgba(0,0,0,.22)}
.ghost-btn{font-size:clamp(20px,1.9vw,28px);padding:9px 24px;border-radius:999px;border:3px solid var(--ink);background:transparent}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tool{font-size:22px;border:3px solid var(--line);background:var(--paper);border-radius:14px;padding:6px 12px}
.chip{font-family:var(--display);font-size:clamp(20px,1.9vw,28px);padding:4px 16px;border-radius:999px;background:var(--paper);border:3px solid var(--line)}
.chip.now{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip.win{border-color:#E8961E;background:#E8961E;color:#fff}
.scores{display:flex;gap:8px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(20,14,30,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay.on{display:flex}
.panel{background:var(--paper);border-radius:26px;padding:clamp(20px,2.8vw,44px);width:min(1100px,94vw);max-height:92vh;overflow-y:auto;text-align:center;border-top:18px solid var(--pc,var(--ink))}
.panel h2{font-size:clamp(38px,4.6vw,66px);margin:0 0 10px}
.panel .why{font-size:clamp(25px,2.5vw,36px);line-height:1.55;margin:0 auto 20px;max-width:36em}
.stagebar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.st{font-family:var(--display);cursor:pointer;font-size:clamp(17px,1.65vw,24px);padding:5px 12px;border-radius:999px;border:3px solid var(--line);background:var(--paper);color:var(--soft)}
.st.now{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.st.done{border-color:var(--ok);color:var(--ok)}
.st.brk{border-style:dashed}
#bar .st:not(.now) .nm{display:none}
#bar .st{padding:5px 10px}
.goal{font-family:var(--display);font-size:clamp(18px,1.75vw,26px);color:var(--soft);text-align:center;margin:3px 0 0}
.body p{margin:0}
.ttsmsg:empty{display:none}
.bodywrap{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;padding:4px 2px}
.body{transform-origin:top center;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.4vh,18px);margin:auto 0;width:100%}
.hd{font-family:var(--display);font-size:clamp(28px,3.1vw,46px);text-align:center;line-height:1.3;max-width:34em}
.stepno{font-family:var(--display);font-size:clamp(16px,1.5vw,21px);color:var(--soft)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:6px;flex-wrap:wrap}
.tnote{border:3px solid var(--tn);color:var(--tn);background:var(--paper);border-radius:16px;padding:7px 16px;font-size:clamp(18px,1.7vw,24px)}
.qbox{background:var(--warm);border:5px solid var(--warmline);border-radius:24px;padding:clamp(14px,2vw,26px);width:min(1100px,94vw);text-align:center;font-family:var(--display);font-size:clamp(26px,2.9vw,42px);line-height:1.4}
.card1{width:min(1100px,94vw);background:var(--paper);border-radius:24px;border:4px solid var(--line);padding:clamp(14px,2vw,28px);display:flex;gap:clamp(14px,2.6vw,32px);align-items:center;justify-content:center}
.card1 .e{font-size:clamp(54px,6.4vw,100px);line-height:1;flex:none}
.card1 .x{font-family:var(--display);font-size:clamp(26px,3vw,44px);line-height:1.38}
/* flip cards */
.recall{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:14px;width:min(1200px,96vw)}
.recall.q4{width:min(720px,90vw)}
.recall.q4 .rc{min-height:0;aspect-ratio:2.1/1}
.rc{position:relative;min-height:clamp(160px,22vh,240px);border:0;background:none;perspective:1200px;font-family:var(--body);padding:0}
.rc .in{position:absolute;inset:0;transition:transform .5s;transform-style:preserve-3d}
.rc.open .in{transform:rotateY(180deg)}
.rc .f{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.rc .front{background:var(--cc);color:#fff;font-family:var(--display);font-size:clamp(23px,2.4vw,34px)}
.rc .front span{font-size:clamp(42px,4.4vw,64px)}
.rc .back2{background:var(--paper);border:5px solid var(--cc);transform:rotateY(180deg);font-size:clamp(20px,2vw,28px);line-height:1.45;color:var(--ink)}
/* talk */
.talk{width:min(1150px,95vw);display:grid;gap:10px}
.talk .q{background:var(--paper);border-radius:18px;border-left:14px solid var(--cc,var(--acc));padding:12px 20px;font-size:clamp(23px,2.4vw,34px);line-height:1.45;text-align:left}
.hq{display:flex!important;gap:.4em;align-items:flex-start}.hq>.qm{flex:none}.hq>.qt{flex:1 1 auto;min-width:0}
.talk .q.lq{padding:0;overflow:hidden;align-items:stretch!important;gap:0!important}.lq>.ql{flex:none;width:9.6em;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:10px 12px;font-weight:700;background:color-mix(in srgb,var(--cc) 9%,var(--paper));border-right:2px solid color-mix(in srgb,var(--cc) 25%,var(--paper))}.lq>.ql small{white-space:nowrap;margin-top:2px!important;font-weight:400;font-size:.62em!important;line-height:1.3}.lq>.qt{display:flex;align-items:center;padding:12px 20px;white-space:nowrap}
.talk .q small{display:block;color:var(--soft);font-size:.7em;margin-top:4px}
.exs{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(1150px,95vw)}
.exbox{width:100%;background:var(--warm,#FFF8EC);border:3px dashed var(--warmline,#EBD9B0);border-radius:18px;padding:12px 18px;text-align:left}
.exbox[hidden]{display:none}
.exh{font-size:clamp(15px,1.3vw,18px);font-weight:800;color:var(--soft);margin-bottom:6px}
.exbox ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px}
.exbox li{background:var(--paper);border-radius:12px;padding:8px 12px;font-size:clamp(18px,1.8vw,24px);line-height:1.4;display:flex;gap:.4em}
.exbox li::before{content:'•';color:var(--acc);font-weight:800}
@media (max-width:820px){.exbox ul{grid-template-columns:1fr}}
.hd .pgref{display:block;font-size:.66em;font-weight:500;color:var(--soft);margin-top:6px;letter-spacing:0}
.ex{background:var(--paper);border:3px dashed var(--line);border-radius:999px;padding:6px 18px;font-size:clamp(19px,1.9vw,26px)}
.timer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.timer .t{font-family:var(--display);font-size:clamp(30px,3vw,44px);min-width:3.2em;text-align:center}
/* book */
.book{width:min(1150px,95vw);background:var(--paper);border-radius:24px;border:4px solid var(--line);padding:clamp(14px,2vw,26px);display:grid;grid-template-columns:auto 1fr;gap:clamp(12px,2vw,26px);align-items:center}
.book .e{font-size:clamp(60px,7vw,110px);line-height:1}
.book .pg{font-family:var(--display);font-size:clamp(28px,3vw,44px);color:var(--acc)}
.book ol,.book ul{margin:6px 0 0;padding-left:1.2em;font-size:clamp(22px,2.2vw,31px);line-height:1.5;text-align:left}
.pickways{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:12px;width:min(1150px,95vw)}
.pw{border:4px solid var(--line);background:var(--paper);border-radius:20px;padding:12px;font-size:clamp(20px,2vw,28px);display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--body);text-align:center}
.pw span{font-size:clamp(34px,3.4vw,50px)}
.pw.lit{border-color:var(--acc);box-shadow:inset 0 0 0 4px var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--paper))}
/* multiple choice */
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(1100px,95vw)}
.card1:has(>.stepno){flex-wrap:wrap}.card1:has(>.stepno)>.x{flex:1 1 100%;text-align:center;text-wrap:pretty}.card1 .x.lx{font-size:clamp(22px,2.3vw,34px)}.card1>.stepno{flex:1 1 100%!important;text-align:center;margin-bottom:-6px}

.opt2{border:4px solid var(--line);background:var(--paper);border-radius:18px;padding:12px 18px;font-family:var(--body);font-size:clamp(22px,2.3vw,32px);line-height:1.4;text-align:left}
.opt2.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--paper))}
.opt2.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 14%,var(--paper))}
/* sort */
.bins{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:clamp(8px,1.4vw,18px);width:min(1200px,96vw)}
.bin{position:relative;border:0;background:var(--cc);color:#fff;border-radius:36px 36px 18px 18px;padding:clamp(10px,1.8vh,20px) 8px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 7px 0 rgba(0,0,0,.22)}
.bin .e{font-size:clamp(34px,4vw,60px);line-height:1}
.bin .n{font-size:clamp(21px,2.3vw,34px);text-align:center;line-height:1.25}
.bin:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.22)}
.bin.lit{outline:6px solid var(--ink);outline-offset:4px}
.bin[disabled]{opacity:.75}
/* order */
.olist{width:min(1100px,95vw);display:grid;gap:10px}
.oi{display:flex;align-items:center;gap:12px;border:4px solid var(--line);background:var(--paper);border-radius:18px;padding:8px 14px;font-family:var(--body);font-size:clamp(20px,2vw,28px);line-height:1.35;text-align:left}
@media (min-width:1000px){.olist.two{grid-template-columns:1fr 1fr}.lsn.two{grid-auto-flow:column;grid-template-columns:1fr 1fr;grid-template-rows:repeat(var(--r),auto)}.talk.two{grid-template-columns:1fr 1fr}.mgrid.wide{grid-template-columns:1fr 1fr}}
.oi .no{flex:none;width:1.9em;height:1.9em;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--line);color:var(--ink);font-family:var(--display)}
.oi.got .no{background:var(--acc);color:#fff}
.oi.got{border-color:var(--acc)}
.oi.right{border-color:var(--ok)}.oi.right .no{background:var(--ok)}
.oi.miss{border-color:var(--no)}.oi.miss .no{background:var(--no)}
.bogi{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 10px;width:fit-content;max-width:min(1100px,96%);margin:2px auto 12px;padding:10px 18px;border:3px solid color-mix(in srgb,var(--acc) 45%,var(--line));border-radius:18px;background:var(--paper);font-size:clamp(20px,2vw,28px);line-height:1.4}
.bogi .bl{flex:none;background:var(--acc);color:#fff;border-radius:999px;padding:2px 14px;font-weight:800;font-size:.85em}
.bogi .bw{border:2px solid var(--line);background:color-mix(in srgb,var(--acc) 8%,var(--paper));border-radius:12px;padding:2px 14px;font-weight:700;white-space:nowrap}
.bogi .bt{text-align:left;flex:1 1 300px}
.tipnote{width:min(1100px,94vw);margin-top:12px;padding:10px 18px;border-radius:14px;background:color-mix(in srgb,var(--acc) 5%,var(--paper));border:1px dashed color-mix(in srgb,var(--acc) 30%,var(--line));font-family:var(--body);font-weight:400;font-size:clamp(17px,1.6vw,22px);line-height:1.5;color:var(--soft);text-align:left;text-wrap:pretty}
.hk{display:inline-flex;gap:.3em;vertical-align:top;max-width:100%}.hkl{flex:none}.hkt{flex:1 1 auto;min-width:0}
.kw{font-weight:900;color:var(--acc);text-decoration:underline;text-decoration-thickness:.1em;text-underline-offset:.2em}
.exl{display:block;margin-top:.5em;font-size:.72em;line-height:1.45;color:var(--soft)}
.ye{display:inline-flex;align-items:center;justify-content:center;width:1.55em;height:1.55em;border-radius:50%;border:2px solid currentColor;font-size:.82em;font-weight:700;margin-right:.35em;vertical-align:.08em}
/* match */
.mgrid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr);gap:10px 18px;width:min(1150px,96vw);align-items:stretch}
.mgrid>.mw,.mgrid>.mm{min-height:100%;display:flex;align-items:center}
.mgrid>.mw{justify-content:center}
.mcol{display:grid;gap:10px;align-content:start}
.mw,.mm{border:4px solid var(--line);background:var(--paper);border-radius:18px;padding:10px 16px;font-size:clamp(21px,2.2vw,31px);line-height:1.35;text-align:left}
.mw{font-family:var(--display);text-align:center;font-size:clamp(26px,2.8vw,40px)}
.mm{font-family:var(--body)}
.mw.sel{border-color:var(--acc);box-shadow:inset 0 0 0 4px var(--acc)}
.mw.done,.mm.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper));opacity:.8}
.mm.shake{animation:sh .35s}
/* match: 점 잇기 모드(dots=True) */
.mgrid.dots{position:relative;user-select:none;-webkit-user-select:none;column-gap:clamp(84px,8vw,120px);grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}
.mgrid.dots>.mm{padding:10px 12px}
.mgrid.dots.short{width:min(860px,92vw);column-gap:clamp(140px,20vw,280px)}
.mgrid.dots.short>.mw,.mgrid.dots.short>.mm{font-family:var(--display);font-weight:700;font-size:clamp(26px,2.8vw,40px)}
.mgrid.dots>.mw,.mgrid.dots>.mm{position:relative;overflow:visible;touch-action:none}
.mgrid.dots .dot{position:absolute;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--paper);border:5px solid var(--ink);box-sizing:border-box;z-index:2;cursor:pointer}
.mgrid.dots .dot::before{content:'';position:absolute;inset:-14px;border-radius:50%}
.mgrid.dots>.mm{justify-content:center;text-align:center}
.mgrid.dots .mw .dot{right:-30px}.mgrid.dots .mm .dot{left:-30px}
.mgrid.dots .sel .dot{background:var(--acc);border-color:var(--acc);transform:scale(1.25)}
.mgrid.dots .done .dot{background:var(--ok);border-color:var(--ok)}
.mgrid.dots>svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:1}
.mgrid.dots line{stroke-width:6;stroke-linecap:round}
.mgrid.dots line.ok{stroke:var(--ok)}.mgrid.dots line.tmp{stroke:var(--acc);stroke-dasharray:2 12}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* fill blanks */
.fillbox{width:min(1100px,95vw);display:grid;gap:12px}
.fl{background:var(--paper);border-radius:18px;padding:12px 18px;font-size:clamp(22px,2.3vw,32px);line-height:1.9;text-align:left;border-left:12px solid var(--cc,var(--acc))}
.fl input{font-family:var(--display);font-size:1em;width:calc(var(--w,4) * 1.15em + 1em);border:0;border-bottom:4px solid var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--paper));border-radius:8px 8px 0 0;padding:0 6px;text-align:center;color:var(--ink)}
.fl input::placeholder{color:color-mix(in srgb,var(--soft) 55%,transparent)}
.fl input.ok{border-bottom-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--paper))}
.fl input.bad{border-bottom-color:var(--no)}
/* listen */
.lsn{width:min(1100px,95vw);display:grid;gap:8px}
.ln{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border-radius:14px;padding:6px 14px;border:3px solid var(--line);text-align:left;font-size:clamp(20px,2vw,28px);line-height:1.45}
.ln b{font-family:var(--display);font-weight:400;flex:none;color:var(--cc,var(--acc));min-width:4.2em}
.lsn.emo .ln b{min-width:0}
.ln.now{border-color:var(--acc);box-shadow:inset 0 0 0 3px var(--acc)}
.lsn.hide .ln span{filter:blur(9px);user-select:none}
/* write */
.wr{width:min(1150px,96vw);display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.wf.full{grid-column:1/-1}
.wf{background:var(--paper);border-radius:18px;padding:10px 16px;border:3px solid var(--line);text-align:left}
.wf label{display:block;font-family:var(--display);font-size:clamp(21px,2.1vw,30px);margin-bottom:4px}
.wf label small{color:var(--soft);font-family:var(--body);font-size:.75em}
.wf textarea,.wf input{width:100%;font-family:var(--body);font-size:clamp(22px,2.3vw,32px);line-height:1.6;border:3px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--bg);color:var(--ink);resize:vertical}
.wbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.wbar .tool{font-family:var(--display)}
.wcount{font-family:var(--display);font-size:clamp(18px,1.7vw,24px);color:var(--soft)}
.wf label .lsub{display:block;font-size:.78em;font-weight:500;color:var(--soft);margin-top:2px}
.wcheck{width:min(1150px,96vw);background:var(--paper);border-radius:18px;border:4px solid var(--ok);padding:12px 18px;text-align:left;display:none}
.wcheck.on{display:block}
.wcheck h3{font-size:clamp(22px,2.2vw,30px);margin-bottom:6px}
.wcheck li{font-size:clamp(19px,1.9vw,27px);line-height:1.5;margin-bottom:6px}
.auto-ok{color:var(--ok)}.auto-no{color:var(--no)}
.self{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-top:2px dashed var(--line);padding:8px 0}
.self>span:first-child{font-size:clamp(19px,1.9vw,27px);flex:1 1 12em}
.self>.seg{flex:none}
.recgrid .self>span:first-child{font-size:clamp(17px,1.6vw,23px)}
.recgrid .wcheck{padding:8px 14px}

html .hj-em{font-family:'HJ Emoji','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-weight:400;font-style:normal;font-synthesis:none;letter-spacing:0;-webkit-text-stroke:0;text-shadow:none}
/* 교사 안내 창 도구(인쇄·구글 문서·이메일) */
html body .hj-tbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px 0 4px;padding-top:18px;border-top:1px solid var(--line)}
html body .hj-tbar>button,html body .hj-mail button{display:inline-flex;align-items:center;gap:7px;font:700 16px/1.2 'Gowun Dodum',sans-serif;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;cursor:pointer}
html body .hj-tbar>button:hover,html body .hj-mail button:hover{background:var(--bg);border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
html body .hj-tbar .hj-i{width:18px;height:18px;flex:none}
html body .hj-mail{flex-basis:100%;display:grid;gap:8px;max-width:560px;margin:6px auto 0;text-align:left;background:var(--bg);border-radius:16px;padding:14px 16px}
html body .hj-mail[hidden]{display:none}
html body .hj-mail label{font-weight:700;font-size:16px}html body .hj-mail label small{font-weight:500;color:var(--soft);font-size:14px;margin-left:6px}
html body .hj-mail input{font:500 17px/1.4 'Gowun Dodum',sans-serif;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
html body .hj-mail div{display:flex;flex-wrap:wrap;gap:8px}html body .hj-mail p{margin:0;font-size:14px!important;color:var(--soft)}
html body .hj-toast{flex-basis:100%;margin:2px 0 0;min-height:1.3em;text-align:center;font-size:15px!important;color:var(--soft)}
@media print{
 body.hj-tprint>*:not(#tn){display:none!important}
 body.hj-tprint #tn{position:static!important;display:block!important;background:none!important;padding:0!important;inset:auto!important}
 body.hj-tprint #tn .panel{width:auto!important;max-height:none!important;overflow:visible!important;box-shadow:none!important;border:0!important;border-radius:0!important;padding:0!important;transform:none!important;animation:none!important}
 body.hj-tprint .hj-tbar,body.hj-tprint #tnClose{display:none!important}
 body.hj-tprint{background:#fff!important;color:#000}
 body.hj-tprint #tn .panel{padding:16mm!important}
}
/* 수업을 마쳤을 때 고르는 창 */
#hj-done{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:rgba(42,34,28,.38);backdrop-filter:blur(3px);animation:hjfade .2s ease}
@keyframes hjfade{from{opacity:0}to{opacity:1}}
#hj-done .hj-dp{width:min(560px,100%);background:var(--paper,#fff);color:var(--ink,#2A221C);border-radius:24px;padding:30px 28px 24px;text-align:center;box-shadow:0 30px 60px -24px rgba(40,25,10,.5);font-family:'Gowun Dodum',sans-serif;word-break:keep-all}
#hj-done .hj-dok{display:inline-grid;place-items:center;width:60px;height:60px;border-radius:18px;background:color-mix(in srgb,#7FB89A 22%,var(--paper,#fff));color:#3F7A5C}
#hj-done .hj-dok svg{width:32px;height:32px}
#hj-done h2{font-family:'Jua',sans-serif;font-size:clamp(26px,3vw,32px);margin:12px 0 4px;letter-spacing:-.03em}
#hj-done .hj-dl{margin:0 0 20px;color:var(--soft,#5C5047);font-size:17px}
#hj-done .hj-dn{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;text-align:left;text-decoration:none;color:#fff;background:var(--ink,#2A221C);border-radius:18px;padding:16px 20px}
#hj-done .hj-dn small{grid-column:1;font-size:14px;opacity:.75;font-weight:600}
#hj-done .hj-dn b{grid-column:1;font-size:clamp(18px,2vw,21px);line-height:1.4}
#hj-done .hj-dn svg{grid-column:2;grid-row:1/3;width:26px;height:26px}
#hj-done .hj-dn:hover{filter:brightness(1.15)}
#hj-done .hj-dlast{margin:0;padding:14px;border-radius:16px;background:var(--bg,#FFFCF8);color:var(--soft,#5C5047);font-size:17px}
#hj-done .hj-drow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
#hj-done .hj-db{flex:1 1 200px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 17px/1.2 'Gowun Dodum',sans-serif;color:var(--ink,#2A221C);background:var(--paper,#fff);border:1.5px solid var(--line,#EFE3D6);border-radius:999px;padding:12px 16px;text-decoration:none;cursor:pointer}
#hj-done .hj-db:hover{background:var(--bg,#FFFCF8)}
#hj-done .hj-db svg{width:20px;height:20px}
#hj-done :focus-visible{outline:3px solid #E0A458;outline-offset:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #hj-done .hj-dn{background:#F2EBE3;color:#221E1A}}
:root[data-theme="dark"] #hj-done .hj-dn{background:#F2EBE3;color:#221E1A}
html body .hj-pl{display:none}
@media print{body.hj-tprint .hj-pl{display:block;text-align:center;font-size:14px!important;color:#555;margin:0 0 4px}}
/* 사진 출처 줄이 화면 밖으로 넘치지 않게 */
html body #phc{white-space:normal!important;overflow-wrap:anywhere;max-width:min(1100px,100%);text-align:center;line-height:1.6;opacity:.85}
/* 홍지희 선생님 버전(SOOP) 첫 화면: 차분하고 읽기 쉽게 */
html body #cBadge{background:color-mix(in srgb,var(--sc) 14%,var(--paper));color:color-mix(in srgb,var(--sc) 78%,var(--ink));font-weight:700;font-size:clamp(15px,1.3vw,18px);padding:5px 14px;letter-spacing:-.01em}
html body #cover:has(#cBadge) .title{font-size:clamp(30px,min(4vw,7vh),52px);line-height:1.25}
html body #cBq{border:0;border-left:5px solid color-mix(in srgb,var(--sc) 55%,var(--paper));background:color-mix(in srgb,var(--sc) 6%,var(--paper));border-radius:16px;padding:14px 22px;text-align:left;box-shadow:none}
html body #cBq>*:first-child:not(b){font-size:15px!important;font-weight:700;color:var(--soft)}
html body #cBq b{display:block;font-weight:700;font-size:clamp(20px,2vw,27px);line-height:1.4;margin-top:2px}
html body #cGoal{border:0;border-left:5px solid #E8B36A;background:#FFF6E8;color:var(--ink);border-radius:16px;padding:12px 22px;font-weight:700;font-size:clamp(18px,1.7vw,23px);text-align:left;box-shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #cGoal{background:#3A3024}}
:root[data-theme="dark"] #cGoal{background:#3A3024}
html body #cMap{gap:10px}
html body #cMap .mcol{border:1px solid var(--line);border-top:3px solid color-mix(in srgb,var(--mc) 60%,var(--paper));border-radius:14px;padding:12px 12px 10px;box-shadow:none}
html body #cMap .mcol h3{font-size:clamp(15px,1.3vw,17px);font-weight:800;color:color-mix(in srgb,var(--mc) 80%,var(--ink));margin:0 0 4px}
html body #cMap .mcol a,html body #cMap .mcol .cur{font-size:clamp(14px,1.2vw,16px);line-height:1.45;padding:5px 8px;border-radius:8px}
html body #cMap .mcol a{color:var(--soft)}html body #cMap .mcol a:hover{background:var(--bg);color:var(--ink)}
html body #cMap .mcol .cur{background:color-mix(in srgb,var(--mc) 13%,var(--paper));color:color-mix(in srgb,var(--mc) 70%,var(--ink))!important;font-weight:700}
/* 듣기 재생 막대 */
#hj-player{position:fixed;left:50%;bottom:clamp(84px,11vh,110px);transform:translateX(-50%);z-index:9000;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;
 max-width:calc(100vw - 24px);background:var(--paper,#fff);color:var(--ink,#2A221C);border:1px solid var(--line,#EFE3D6);border-radius:999px;padding:6px 6px 6px 16px;
 box-shadow:0 14px 34px -14px rgba(40,25,10,.4);font-family:'Gowun Dodum',sans-serif;word-break:keep-all}
#hj-player[hidden]{display:none}
#hj-player .hj-pl-l{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--soft,#5C5047);margin-right:4px}
#hj-player .hj-pl-l b{font-weight:700}
#hj-player .hj-i{width:18px;height:18px;flex:none}
#hj-player button{display:inline-flex;align-items:center;gap:6px;font:700 16px/1.2 'Gowun Dodum',sans-serif;color:var(--ink,#2A221C);background:var(--bg,#FFFCF8);border:1px solid var(--line,#EFE3D6);border-radius:999px;padding:9px 14px;cursor:pointer;min-height:42px}
#hj-player button:hover:not(:disabled){border-color:color-mix(in srgb,var(--ink,#2A221C) 30%,var(--line,#EFE3D6))}
#hj-player button:disabled{opacity:.4;cursor:default}
#hj-player [data-k=pp]{background:var(--ink,#2A221C);color:var(--paper,#fff);border-color:transparent}
#hj-player .hj-pl-x{padding:9px;background:none;border-color:transparent}
#hj-player[data-st=play] .hj-pl-l .hj-i{animation:hjpulse 1.2s ease-in-out infinite}
@keyframes hjpulse{50%{opacity:.35}}
@media print{#hj-player{display:none!important}}
/* 첫 화면 단추 배치: 교사용 도구는 위 오른편, 수업 시작은 가운데 홀로 */
html body .hj-cvtop{align-items:center}
html body .hj-cvtools{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
html body .hj-cvtools .hj-tool2{font-size:clamp(15px,1.25vw,17px)!important;padding:8px 14px!important;min-height:40px;border-width:1.5px!important;border-radius:999px!important;margin:0!important;box-shadow:none!important}
html body .hj-goRow{justify-content:center;margin-top:clamp(8px,1.5vh,18px)}
/* 크롬북처럼 낮은 화면에서도 '수업 시작'이 첫 화면 아래에 늘 보이게 (2026-10-02) */
html body #cover .hj-goRow{position:sticky;bottom:0;z-index:6;align-self:stretch;width:auto;margin-top:0;padding:14px 0 clamp(10px,2vh,18px);
 background:linear-gradient(to top,var(--bg) 62%,color-mix(in srgb,var(--bg) 0%,transparent))}
@media (max-height:760px) and (min-width:900px){
 html body #cover{padding-top:10px!important;padding-bottom:0!important}
 html body #cover .hj-cv{gap:10px!important}
 html body #cover .hj-cvpanel{padding:14px 22px!important;gap:10px!important}
 html body #cover .hj-cvpanel .qbox,html body #cover .hj-cvpanel .goalbox{padding-top:12px!important;padding-bottom:12px!important}
 html body #cover .hj-goRow .big-btn{padding-top:10px!important;padding-bottom:10px!important}
}
@media (max-width:640px){html body .hj-cvtools{margin-left:0;justify-content:flex-start}}
/* 첫 화면: 수업 흐름은 한 줄 이어진 막대, 활동 단위는 같은 폭의 막대로 */
html body .hj-field>*:not(.hj-flabel){justify-self:stretch!important;width:100%}
html body .hj-field>#plan,html body .hj-field>#cPlan,html body .hj-field>.stagebar,html body .hj-field>.plan{display:grid!important;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0!important;
 border:1.5px solid var(--line);border-radius:16px;background:var(--paper);overflow:hidden;box-shadow:0 1px 2px rgba(80,55,30,.05)}
html body .hj-field>#plan .st,html body .hj-field>#cPlan .st,html body .hj-field>.stagebar .st,html body .hj-field>.plan .st{
 display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;min-height:62px;margin:0!important;
 border:0!important;border-left:1px solid var(--line)!important;border-radius:0!important;background:none!important;box-shadow:none!important;padding:8px 6px!important;
 color:var(--ink)!important;text-align:center;line-height:1.3;font-size:clamp(15px,1.3vw,17px)!important;font-weight:700;cursor:pointer}
html body .hj-field>* .st:first-child{border-left:0!important}
html body .hj-field>* .st.brk{border-left:2px dashed color-mix(in srgb,var(--ink) 30%,var(--line))!important}
html body .hj-field>* .st:hover{background:var(--bg)!important}
html body .hj-field .st .hj-sn{font-size:13px;font-weight:800;color:var(--soft);letter-spacing:0}
html body .hj-field .st .hj-st{display:block;max-width:100%;word-break:keep-all;overflow-wrap:anywhere}
html body .hj-field .st small{font-size:12.5px;font-weight:600;color:var(--soft)}
html body .hj-field #segTeam{width:100%!important}
html body .hj-field #segTeam>.seg{display:grid!important;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);width:100%!important;border-radius:16px;overflow:hidden;background:var(--paper)}
html body .hj-field #segTeam>.seg button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;min-width:0;padding:8px 4px!important;
 font-size:clamp(15px,1.3vw,17px)!important;border-radius:0!important;border-left:1px solid var(--line)!important;line-height:1.2;white-space:nowrap}
html body .hj-field #segTeam>.seg button:first-child{border-left:0!important}
html body .hj-field #segTeam>.seg button .hj-em,html body .hj-field #segTeam>.seg button .hj-i{font-size:20px;width:20px;height:20px;line-height:1}
@media (max-width:720px){
 html body .hj-field>#plan,html body .hj-field>#cPlan,html body .hj-field>.stagebar,html body .hj-field>.plan,html body .hj-field #segTeam>.seg{grid-auto-flow:row;grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
 html body .hj-field>* .st,html body .hj-field #segTeam>.seg button{border-top:1px solid var(--line)!important}}
/* 과학 앱: 마지막 단계의 '수업 마치기' */
html body #hjEnd{display:none}
html body #hjEnd.on{display:inline-flex;align-items:center;gap:6px;background:var(--ink,#2A221C);color:var(--paper,#fff);border-color:transparent}
/* 진행 화면: 메뉴(위 단계·도구, 아래 단추)는 작고 가볍게, 수업 내용이 주인공 */
html body .screen:not(#cover) .topbar{gap:8px;padding-top:2px;padding-bottom:2px;min-height:0}
html body .screen:not(#cover) .topbar :is(.steps,.stagebar){gap:5px}
html body .screen:not(#cover) .topbar :is(.steps,.stagebar)>*{font-size:clamp(13px,1.05vw,15.5px)!important;padding:5px 11px!important;min-height:32px;border-width:1px!important;line-height:1.25}
html body .screen:not(#cover) .topbar .tools{gap:5px}
html body .screen:not(#cover) .topbar .tool{font-size:clamp(13px,1.05vw,15.5px)!important;padding:5px 10px!important;min-height:34px;border-width:1px!important;border-radius:999px!important}
html body .screen:not(#cover) .topbar .tool .hj-i{width:16px;height:16px}
html body .screen:not(#cover) .topbar .tool .n{font-size:12px;min-width:18px;height:18px;line-height:18px}
html body .screen:not(#cover) :is(.sthead .routine,.badge){font-size:clamp(13px,1.05vw,15px)!important;padding:3px 12px!important}
html body .screen:not(#cover) .foot{padding-top:6px;padding-bottom:6px;min-height:0}
html body .screen:not(#cover) .foot :is(.tnote,.ghost,.ghost-btn,#prev,#btnPrev){font-size:clamp(14px,1.15vw,16px)!important;padding:7px 14px!important;min-height:38px;border-width:1.5px!important}
html body .screen:not(#cover) .foot :is(#next,#btnNext,#btnNext2,.mid-btn,.big-btn){font-size:clamp(16px,1.4vw,19px)!important;padding:8px 20px!important;min-height:42px;box-shadow:0 6px 16px -10px rgba(40,25,10,.5)!important}
html body .screen:not(#cover) .foot .hj-i{width:17px;height:17px}
html body .screen:not(#cover) .stepno{font-size:13px}
/* 왼쪽 위 이동 단추 [홈 · 자료 목록] — 떠 있는 홈 단추 대신 */
html.hj-hasnav #hj-home{display:none!important}
html body .hj-nav{display:inline-flex;align-items:center;gap:6px;flex:none;margin:0}
html body .hj-nav a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font:700 clamp(14px,1.1vw,16px)/1.2 'Gowun Dodum',sans-serif;color:var(--ink,#2A221C);
 background:var(--paper,#fff);border:1.5px solid var(--line,#EFE3D6);border-radius:999px;padding:7px 14px 7px 11px;min-height:38px;white-space:nowrap}
html body .hj-nav a:hover{background:var(--bg,#FFFCF8);border-color:color-mix(in srgb,var(--ink,#2A221C) 25%,var(--line,#EFE3D6))}
html body .hj-nav .hj-i{width:17px;height:17px;flex:none}
html body .hj-nav.hj-dark{margin-right:14px}
html body .hj-nav.hj-dark a{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
html body .hj-nav.hj-dark a:hover{background:rgba(255,255,255,.22)}
html body .hj-navbar{display:flex;justify-content:flex-start;max-width:min(1200px,100%);margin:0 auto 10px;padding:10px 0 0}
body>nav .wrap>.hj-nav{margin-right:10px}
@media print{html body .hj-nav,html body .hj-navbar{display:none!important}}
/* 수학 앱 긴 문장 카드 */
html body .opts.hj-wide{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:12px}
html body .opts.hj-wide>.opt{max-width:none!important;width:auto!important;word-break:keep-all;text-wrap:pretty}
/* 학습 문제 안내 글자 */
html body #cover .hj-qlab{display:block;font-size:clamp(15px,1.35vw,19px)!important;font-weight:700;color:var(--soft);letter-spacing:-.01em;margin:0 0 4px;line-height:1.4}
html body #cover .hj-qlab .hj-em{font-size:.95em}
html body #cover .hj-qtxt{display:block}
html body #cGoal .hj-qtxt{font-size:clamp(20px,1.9vw,26px)}
/* 활동 단위 '기타' 입력칸은 다른 글자와 같은 크기로 */
html body .hj-field #segTeam input,html body .hj-field #segTeam textarea{font-size:clamp(15px,1.25vw,17px)!important;padding:8px 12px!important;min-height:0!important;height:auto!important;border-width:1.5px!important;border-radius:12px!important}
html body .hj-field #segTeam :is(span,small,p):not(.seg):not(.hj-em){font-size:clamp(14px,1.15vw,16px)!important}
/* 교사용 단추는 이동 단추와 같은 차분한 색 */
html body .hj-cvtools .hj-tool2{color:var(--ink)!important;background:var(--paper)!important;border:1.5px solid var(--line)!important;font-weight:700!important}
html body .hj-cvtools .hj-tool2:hover{background:var(--bg)!important;border-color:color-mix(in srgb,var(--ink) 25%,var(--line))!important}
html body .hj-cvtools .hj-tool2 .hj-i{color:var(--soft)}
html body .hj-cvtop .tolist{color:var(--ink);background:var(--paper);border:1.5px solid var(--line);font-size:clamp(14px,1.1vw,16px)!important;padding:7px 14px!important;min-height:38px}
/* 결과 화면 단추 */
html body .hj-retry{background:var(--paper)!important;color:var(--ink)!important;border:1.5px solid var(--line)!important;box-shadow:none!important;font-size:clamp(16px,1.4vw,19px)!important;padding:10px 20px!important}
html body .hj-rrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:6px auto 0}
html body .hj-rrow>*{margin:0!important}
html body .hj-gonext{display:inline-flex;align-items:center;gap:8px;font:700 clamp(17px,1.5vw,21px)/1.2 'Gowun Dodum',sans-serif;color:var(--paper,#fff);background:var(--ink,#2A221C);border:0;border-radius:999px;padding:12px 24px;cursor:pointer;box-shadow:0 8px 20px -12px rgba(40,25,10,.55)}
html body .hj-gonext .hj-i{width:20px;height:20px}
html body .hj-gonext:hover{filter:brightness(1.15)}
/* 진행 화면 아래 '교사 안내'도 차분한 색으로 */
html body .screen:not(#cover) .foot .tnote{color:var(--ink)!important;background:var(--paper)!important;border-color:var(--line)!important}
html body .screen:not(#cover) .foot .tnote .hj-i{color:var(--soft)}
html body #cover .row .tnote{color:var(--ink)!important;border-color:var(--line)!important}
/* 과학 앱(한 화면 보기): 메인과 같은 차분한 선·색 */
html:has(#ovBar){--navy:color-mix(in srgb,var(--ink) 22%,var(--line))}
html:has(#ovBar) body section{border:1px solid var(--line)!important;border-radius:20px;box-shadow:0 1px 2px rgba(80,55,30,.04),0 12px 28px -20px rgba(80,55,30,.25)}
html:has(#ovBar) body button:not(.right):not(.wrong):not(.sel):not(.on):not(.ok):not(.no){border-width:1.5px!important;border-color:var(--line)!important;border-radius:14px}
html:has(#ovBar) body button:is(.right,.wrong,.ok,.no){border-width:2px!important}
html:has(#ovBar) body button:hover:not(:disabled):not(.right):not(.wrong):not(.sel):not(.on){border-color:color-mix(in srgb,var(--ink) 28%,var(--line))!important}
html:has(#ovBar) body button.main,html:has(#ovBar) #ovNext,html:has(#ovBar) #hjEnd{background:var(--ink)!important;color:var(--paper)!important;border-color:transparent!important}
html:has(#ovBar) body .stage{background:color-mix(in srgb,var(--sea) 14%,var(--paper))!important;color:color-mix(in srgb,var(--sea) 72%,var(--ink))!important;font-weight:700;font-size:clamp(15px,1.3vw,18px)}
html:has(#ovBar) body nav a{border-width:1px!important;font-weight:600}
html:has(#ovBar) body nav a.done{background:color-mix(in srgb,#4DB283 16%,var(--paper))!important;border-color:color-mix(in srgb,#4DB283 40%,var(--paper))!important;color:var(--ink)!important}
html:has(#ovBar) #ovBar{border:1px solid var(--line)!important;box-shadow:0 10px 26px -16px rgba(40,25,10,.35)!important;background:var(--paper)!important}
html:has(#ovBar) body .chip{border-width:1px!important}
html:has(#ovBar) body button.sel:not(.right):not(.wrong),html:has(#ovBar) body button.on:not(.right):not(.wrong){background:color-mix(in srgb,var(--sea) 12%,var(--paper))!important;border-color:color-mix(in srgb,var(--sea) 45%,var(--paper))!important;color:var(--ink)!important}
/* 뒤집기 카드 글자 정돈, 문장은 자연스럽게 줄바꿈 */
html body .rc .f{padding:16px 18px!important;word-break:keep-all;text-wrap:balance;overflow-wrap:break-word}
html body .rc .back2{font-size:clamp(18px,1.7vw,25px)!important;line-height:1.5!important;border-width:3px!important}
html body :is(.qbox,.goal,.hd,.ask,.title,h1,h2,h3,.lead,.big,.sit,.qtext){text-wrap:balance;word-break:keep-all}
html body :is(p,li,.de,.why){text-wrap:pretty;word-break:keep-all}
html body header#bar>.hj-nav{margin-right:14px}
html body .icons>.ic .e{background:color-mix(in srgb,var(--acc) 16%,var(--paper))!important;color:color-mix(in srgb,var(--acc) 70%,var(--ink))!important}
/* 글쓰기 도구 막대 */
html body .wbar{display:flex!important;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:6px auto 4px}
html body .wbar .hj-wg{display:inline-flex;align-items:center;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:3px;box-shadow:0 1px 2px rgba(80,55,30,.05)}
html body .wbar .hj-wg .tool{border:0!important;background:none!important;box-shadow:none!important;border-radius:10px!important;font-size:clamp(14px,1.15vw,16px)!important;padding:7px 12px!important;min-height:36px}
html body .wbar .hj-wg .tool:hover{background:var(--bg)!important}
html body .wbar .hj-wg .tool+.tool{border-left:1px solid var(--line)!important;border-radius:0 10px 10px 0!important}
html body .wbar .wcount{font-size:clamp(14px,1.15vw,16px)!important;font-weight:700;color:var(--soft);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}
/* 과학 앱 첫 화면 머리 + 위 탭 줄 정리 */
html body .hj-lhead{text-align:center;margin:0 0 10px}
html body .hj-linfo{margin:0;font-size:clamp(15px,1.3vw,18px);font-weight:700;color:var(--soft)}
html body .hj-ltitle{margin:4px 0 0;font-size:clamp(28px,3vw,42px);font-weight:800;letter-spacing:-.03em;line-height:1.25;color:var(--ink)}
html:has(#ovBar) body>nav #ovNavMade,html:has(#ovBar) body>nav .wrap>.hj-contact{display:none!important}
html:has(#ovBar) body>nav a{font-size:clamp(14px,1.05vw,16px)!important;padding:5px 12px!important}
html:has(#ovBar) body .steps span{font-size:clamp(14px,1.1vw,16px)!important;padding:4px 12px!important;border-width:1px!important}
/* 과학 앱 첫 화면 */
#hj-scover{display:none}
html.hj-sc-on #hj-scover{display:block;position:fixed;left:0;right:0;bottom:0;top:var(--hj-navh,72px);z-index:40;overflow:auto;background:var(--bg);padding:clamp(16px,3vh,36px) 16px 40px}
html.hj-sc-on #ovBar{display:none!important}
#hj-scover .hj-sc-in{width:min(1100px,100%);margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,1.8vh,20px)}
#hj-scover .hj-sc-info{margin:0;font-size:clamp(15px,1.35vw,19px);font-weight:700;color:var(--soft);text-align:center}
#hj-scover .hj-sc-title{margin:0;font-size:clamp(32px,min(4.6vw,8vh),60px);font-weight:800;letter-spacing:-.035em;line-height:1.2;text-align:center;text-wrap:balance}
#hj-scover .hj-cvpanel{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,2.2vw,28px);display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(80,55,30,.04),0 14px 30px -22px rgba(80,55,30,.3)}
#hj-scover .hj-sc-goal{margin:0;text-align:left;background:#FFF6E8;border:0;border-left:5px solid #E8B36A;border-radius:16px;padding:16px 22px;font-size:clamp(21px,2.1vw,30px);font-weight:700;line-height:1.4;box-shadow:none}
#hj-scover .hj-sc-goal .hj-qlab{display:block;font-size:clamp(15px,1.35vw,19px);font-weight:700;color:var(--soft);margin-bottom:4px}
#hj-scover .hj-field{border-top:1px dashed var(--line);padding-top:14px}
#hj-scover .big-btn{font:800 clamp(22px,2vw,28px)/1.2 'Gowun Dodum',sans-serif;color:var(--paper)!important;background:var(--ink)!important;border:0!important;border-radius:999px!important;padding:14px 40px;cursor:pointer;box-shadow:0 10px 24px -12px rgba(40,25,10,.55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #hj-scover .hj-sc-goal{background:#3A3024}}
/* 과학 앱 아래 막대: 작고 가볍게 */
html:has(#ovBar) #ovBar{padding:5px 8px!important;gap:6px!important}
html:has(#ovBar) #ovBar button{font-size:clamp(14px,1.1vw,16px)!important;padding:6px 13px!important;min-height:36px!important}
html:has(#ovBar) #ovBar .pos{font-size:clamp(14px,1.1vw,16px)!important}
html:has(#ovBar) #ovBar .hj-i{width:16px;height:16px}
/* 과학 앱 한 화면 보기: 기본 글자 조금 작게 */
html.hj-hasnav:has(#ovBar) body.ov main{font-size:.94em}
/* 사회·국어 진행 화면: 넓은 화면에서 글자와 카드를 더 크게 */
html body #stage #body{width:min(1560px,96vw);max-width:none}
html body #stage .hd{font-size:clamp(28px,min(3.1vw,6.2vh),54px)!important;line-height:1.3}
html body #stage .recall{width:100%;gap:clamp(12px,1.4vw,24px)}
html body #stage .rc{min-height:clamp(180px,30vh,340px)}
html body #stage .rc .front{font-size:clamp(24px,min(2.5vw,5vh),42px)!important}
html body #stage .rc .back2{font-size:clamp(20px,min(2.05vw,4.2vh),34px)!important}
html body #stage #body>.qbox{width:min(1400px,100%);font-size:clamp(22px,min(2.2vw,4.6vh),38px)!important}
html body #stage .goal{font-size:clamp(15px,1.25vw,20px)}

const C={"id": "u2-l7", "title": "🔢 글과 그림을 활용하여 설명하는 방법 알기", "sub": "3학년 2학기 국어 2단원 · 유창하게 읽고 발표해요 · 7차시", "goal": "글과 그림을 활용하여 설명하는 방법을 알아봅시다.", "note0": ["수업 준비 · 7차시", "<h3>학습 목표<\/h3><p>글과 그림을 활용하여 설명하는 방법을 안다. <span class=\"src\">「국어」 90~93쪽 · 「국어활동」 24~25쪽<\/span><\/p><h3>이 차시의 목적 <span class=\"src\">지도서 148쪽<\/span><\/h3><ul><li>글과 그림을 모두 활용해 대상을 설명하는 제재를 읽고, 글과 그림을 연결해 내용을 이해하는 방법을 배웁니다.<\/li><li>내용을 전달할 때 글과 그림의 역할을 파악하고, 글과 그림을 <b>색, 크기, 모양<\/b>으로 표현하는 까닭을 탐색합니다.<\/li><\/ul><h3>주민 등록 번호<\/h3><p>교과서가 주민 등록 번호를 설명하지만, 학생에게 자기 번호를 쓰거나 말하게 하지 않도록 해 주세요. 화면에서도 묻지 않습니다.<\/p><h3>성취 기준<\/h3><p><b>[4국01-05]<\/b> 목적과 주제에 알맞게 자료를 정리하여 자신감 있게 발표한다.<\/p><p><b>[4국06-02]<\/b> 매체를 활용하여 간단한 발표 자료를 만든다.<\/p><h3>단원 지도 유의 사항 <span class=\"src\">지도서 129쪽<\/span><\/h3><ul><li>글과 그림을 활용해 설명하는 방법을 지도할 때 <b>글이 하는 역할과 그림이 하는 역할<\/b>을 이해하고, 글과 그림을 연결해 읽었을 때의 효과를 파악하게 합니다.<\/li><li>발표 자료를 만들 때 더 알아보고 싶은 내용을 조사할 <b>충분한 시간<\/b>을 줍니다. 만든 자료를 공유하며 협력적인 태도로 서로 의견을 나누게 합니다.<\/li><\/ul><h3>교과서 작품<\/h3><p>교과서 글(「나무」, 「신기한 구슬」, 「박에스더」, 「이름처럼 쓰는 숫자」, 태권도 글)은 저작권이 있어 화면에 싣지 않았습니다. 교과서를 함께 펴 주세요. 녹음 연습용 글과 일기 예보 예시는 이 자료를 위해 새로 지은 글입니다.<\/p>"], "stages": [{"name": "동기 유발", "min": 5, "steps": [{"t": "cards", "hd": "이 그림은 무엇을 나타낼까요?", "cards": [{"e": "🏹", "c": "#D64C5A", "t": "?", "d": "양궁"}, {"e": "🏸", "c": "#2F74E0", "t": "?", "d": "배드민턴"}, {"e": "🥋", "c": "#1F9E63", "t": "?", "d": "태권도"}, {"e": "🏓", "c": "#E8961E", "t": "?", "d": "탁구"}], "q": "글자가 없어도 무엇인지 알 수 있었나요? 설명할 때 글과 그림을 함께 쓰는 까닭은 무엇일까요?"}], "note": ["① 동기 유발 (5분)", "<h3>진행 <span class=\"src\">지도서 148~149쪽<\/span><\/h3><ul><li>양궁, 배드민턴, 태권도, 탁구처럼 운동 종목을 나타내는 픽토그램을 보고 무엇인지 알아맞히게 합니다. 화면의 그림은 픽토그램 대신 쓴 그림 문자입니다. 지도서 149쪽 픽토그램(국제올림픽위원회)을 함께 보여 주어도 됩니다.<\/li><li>설명할 때 글과 그림을 활용하는 까닭을 생각해 보게 합니다.<\/li><\/ul><h3>대안 활동<\/h3><p>교실 안내 문구, 학급 알림판, 시간표, 학교 게시판 포스터에서 글과 그림을 활용한 사례를 찾아보기.<\/p><h3>학습 문제<\/h3><p>글과 그림을 활용하여 설명하는 방법을 알아봅시다.<\/p>"]}, {"name": "내용 파악하기", "min": 12, "steps": [{"t": "book", "page": "「국어」 90~91쪽 「이름처럼 쓰는 숫자」", "e": "🔢", "do": ["생활 속에서 이름이 하는 역할을 생각하며 제목을 보고 내용을 예상해요.", "글과 그림에서 알 수 있는 내용이 무엇인지 생각하며 읽어요.", "그림을 보고 글을 읽거나, 글을 읽고 그림을 다시 보며 연결해요."]}, {"t": "mc", "hd": "「이름처럼 쓰는 숫자」를 읽고 답해 봐요.", "items": [{"q": "자동차마다 번호판이 다른 까닭은 무엇인가요?", "o": ["자동차 주인이 누구인지 알기 위해서", "자동차를 예쁘게 꾸미려고", "자동차의 빠르기를 알려 주려고", "자동차의 색을 알려 주려고"], "a": 0, "w": "자동차 주인이 누구인지 알기 위해 자동차마다 번호판이 달라요. (「국어」 92쪽)"}, {"q": "유선 전화번호의 맨 앞자리는 무엇을 뜻하나요?", "o": ["지역 번호", "사람의 나이", "전화기의 색", "전화를 건 시간"], "a": 0, "w": "유선 전화번호의 맨 앞자리는 지역 번호예요."}, {"q": "주민 등록 번호에서는 어떤 정보를 알 수 있나요?", "o": ["태어난 연도와 날짜, 남자인지 여자인지", "사는 집의 주소", "다니는 학교 이름", "좋아하는 음식"], "a": 0, "w": "태어난 연도, 날짜, 남자인지 여자인지를 알 수 있어요. 그래서 소중히 지켜야 하는 정보예요."}]}], "note": ["② 내용 파악하기 (12분)", "<h3>진행 <span class=\"src\">지도서 149쪽<\/span><\/h3><ul><li>글과 그림에서 알 수 있는 내용을 생각하며 읽습니다. 글과 그림을 연결하며 볼 수 있게 합니다.<\/li><li>자동차 번호판, 버스 번호, 전화번호, 주민 등록 번호 설명은 차례대로 읽어도 되고, 흥미나 수준에 따라 순서를 바꾸어 읽어도 됩니다.<\/li><li>92쪽 2번 질문에 답하고(답은 「국어」 92쪽 예시 답안), 숫자의 쓰임에 대해 안 점이나 더 알고 싶은 점을 말해 봅니다.<\/li><\/ul>"]}, {"name": "좋은 점 알기", "min": 12, "steps": [{"t": "talk", "hd": "다니는 곳에 따라 다른 버스 번호를 보고 이야기해 봐요. (「국어」 92쪽 3번)", "qs": ["(1) 글과 그림에서 가장 눈에 띄는 부분은 어디인가요? 왜 그렇게 생각했나요?", "(3) 글과 그림을 모두 활용하면 좋은 점을 말해 보세요."]}, {"t": "sort", "hd": "(2) ‘다니는 곳에 따라 다른 버스 번호’에서 무엇으로 알 수 있을까요? (「국어」 92쪽 3번)", "bins": [{"k": "t", "n": "글에서 알 수 있어요", "e": "📝", "c": "#2F74E0"}, {"k": "b", "n": "글과 그림 모두에서", "e": "🤝", "c": "#1F9E63"}, {"k": "p", "n": "그림에서 더 알 수 있어요", "e": "🖼️", "c": "#E8961E"}], "items": [{"k": "t", "e": "🚌", "x": "버스는 출발지와 도착지에 따라 번호판이 달라진다.", "w": "글에서 설명하는 내용이에요."}, {"k": "b", "e": "1️⃣", "x": "첫 번째 번호는 출발지, 두 번째 번호는 도착지를 가리킨다.", "w": "글에서 알려 주고(「국어」 92쪽 예시 답안), 그림 속 말풍선 ‘1번 지역에서 출발해서 2번 지역에 도착하는 버스예요.’에도 나와요."}, {"k": "p", "e": "🗺️", "x": "버스 번호가 가리키는 지역이 어디에 있는지", "w": "지도 그림이 지역의 위치를 한눈에 보여 줘요. (「국어」 92쪽 예시 답안)"}, {"k": "p", "e": "🚍", "x": "버스가 어떤 모양인지", "w": "버스 그림을 보면 한눈에 알 수 있어요."}], "after": "글과 그림을 연결해서 보면 버스 번호의 뜻과 버스가 어디로 가는지를 더 쉽게 알 수 있어요."}, {"t": "sum", "hd": "글과 그림을 모두 활용하면 좋은 점", "boxes": [{"t": "📝 글은", "c": "#2F74E0", "items": ["중요한 내용을 간략하게 제시해요.", "그림만으로는 알 수 없는 내용을 설명해요."]}, {"t": "🖼️ 그림은", "c": "#E8961E", "items": ["중요한 내용을 한눈에 파악할 수 있게 나타내요.", "글로 설명되지 않는 부분을 보여 줘요."]}]}], "note": ["③ 글과 그림을 활용하여 설명하면 좋은 점 (12분)", "<h3>진행 <span class=\"src\">지도서 149~150쪽<\/span><\/h3><ul><li>92쪽 3번: ‘다니는 곳에 따라 다른 버스 번호’에서 글에서 알 수 있는 내용과 그림에서 더 알 수 있는 점을 이야기합니다.<\/li><li>글은 그림만으로 알 수 없는 내용을 설명하고, 그림은 글로 설명되지 않는 부분을 나타내거나 한눈에 파악하도록 나타낸다는 점을 알게 합니다.<\/li><li>자동차 번호판, 전화번호, 주민 등록 번호에서 글에만 있거나 그림에만 있거나 둘 다에 있는 내용을 찾아보며 좋은 점을 이야기합니다.<\/li><li>유의점: 글과 그림을 <b>연결해서 읽어야<\/b> 내용을 효과적으로 이해할 수 있음을 지도합니다.<\/li><li>지도서가 ‘글에만 있는 내용, 그림에만 있는 내용, 글과 그림에 모두 있는 내용’을 찾게 하므로 분류 칸을 세 개로 두었습니다.<\/li><\/ul><p>분류 카드 가운데 ‘버스가 어떤 모양인지’는 교과서 예시 답안이 아니라 그림의 역할을 보여 주려고 더한 카드입니다.<\/p>"]}, {"name": "설명하는 방법", "min": 8, "steps": [{"t": "fill", "hd": "「이름처럼 쓰는 숫자」에서 색, 크기, 모양을 어떻게 활용했을까요? 빈칸을 채워 봐요. (「국어」 93쪽 4번)", "lines": ["크기 · 글: ( [제목] )의 글자를 다른 글자보다 ( [크게] ) 표현했다.", "모양 · 그림: 지역마다 맨 앞자리 번호가 다르다는 것을 알려 주려고 ( [지도] )을/를 사용했다."]}, {"t": "talk", "hd": "교과서 93쪽 표를 보며 이야기해 봐요.", "qs": ["색, 크기, 모양을 왜 그렇게 활용했을까요?", "나라면 어떻게 표현했을지 말해 봐요."]}, {"t": "write", "id": "change", "hd": "✏️ 「이름처럼 쓰는 숫자」에서 색, 크기, 모양을 바꾸어 표현하고 싶은 부분과<br>까닭을 써 봐요. (선택)", "fields": [{"l": "바꾸어 표현하고 싶은 부분", "rows": 2, "need": true}, {"l": "그 까닭", "rows": 2, "need": true}], "model": "‘자동차마다 다른 자동차 번호판’이라는 제목에서 색이 다른 부분을 크기도 크게 표현하고 싶다. — 설명하려는 내용에 주목하도록 할 수 있기 때문이다. <small>(지도서 151쪽 활동지 예)<\/small>", "check": ["바꾸고 싶은 부분을 정확히 썼나요?", "색, 크기, 모양을 바꾸는 까닭을 썼나요?"]}], "note": ["④ 글과 그림을 활용하여 설명하는 방법 (8분)", "<h3>진행 <span class=\"src\">지도서 150쪽<\/span><\/h3><ul><li>93쪽 4번: 표의 나머지 칸은 교과서에 인쇄되어 있어 학생이 채우는 두 빈칸만 화면에 두었습니다(지도서 150쪽 예시 답안: 제목, 크게 / 지도). 글과 그림을 살펴보며 인상 깊은 표현 방법을 찾아 말합니다. 색을 어떻게 쓰고 크기나 모양을 어떻게 활용해 어떤 내용을 전달하려 했는지, 왜 그렇게 표현했는지 생각하게 합니다.<\/li><li>색, 크기, 모양을 활용한 까닭을 질문으로 만들어 이야기 나눕니다(예: 지역마다 다른 색 → 지역 구별 / 번호판 숫자를 크게 → 중요한 정보 강조).<\/li><li>자신이라면 어떻게 표현했을지 이야기 나누게 합니다.<\/li><\/ul><h3>활동의 유의점<\/h3><p>그림은 색·크기·모양 활용이 분명히 드러나지만, 글은 잘 드러나지 않을 수 있습니다. 핵심 내용을 크게 하거나 글자 모양을 다르게 하거나 색으로 강조하는 경우가 있음을 안내합니다. 분류 카드는 「국어」 93쪽 4번 예시 답안입니다.<\/p>"]}, {"name": "정리", "min": 3, "steps": [{"t": "final", "hd": "🔢 오늘의 정리", "lines": ["글은 중요한 내용을 간략하게, 그림은 한눈에 보이게 나타내요.", "글과 그림을 연결해서 읽으면 내용을 더 잘 이해할 수 있어요.", "색, 크기, 모양을 활용하면 중요한 내용이 눈에 잘 띄어요.", "다음 시간에는 글과 그림을 활용해 발표 자료를 만들어요."]}], "note": ["⑤ 정리 (3분)", "<h3>진행 <span class=\"src\">지도서 150쪽<\/span><\/h3><p>학생들이 스스로 공부한 내용을 확인하고 정리하게 합니다.<\/p><h3>「국어활동」 24~25쪽 <span class=\"src\">지도서 153쪽<\/span><\/h3><p>소단원 2가 끝난 뒤 그림을 보고 어울리는 문장 쓰기, 인물을 글과 그림으로 표현할 계획 세우기로 점검합니다.<\/p>"]}]};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
let SOUND=true,actx=null;
function beep(kind){
  if(!SOUND)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const map={ok:[[660,'triangle'],[880,'triangle']],no:[[300,'square'],[220,'square']],tick:[[520,'sine']],win:[[523,'triangle'],[659,'triangle'],[784,'triangle'],[1047,'triangle']]};
    (map[kind]||map.tick).forEach(([f,t],i)=>{const o=actx.createOscillator(),g=actx.createGain(),s=actx.currentTime+i*.13;
      o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.16,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.22);
      o.connect(g).connect(actx.destination);o.start(s);o.stop(s+.24);});
  }catch(e){}
}
/* ---------- 읽어 주기 (브라우저 음성) ---------- */
const TTS={rate:1,rates:[[0.8,'🐢 느리게'],[1,'🐢 보통'],[1.15,'🐇 빠르게']],ri:1,voice:null,ok:'speechSynthesis' in window};
function pickVoice(){if(!TTS.ok)return;const v=speechSynthesis.getVoices();TTS.voice=v.find(x=>/^ko/i.test(x.lang))||null;}
if(TTS.ok){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function stopSpeak(){if(TTS.ok)speechSynthesis.cancel();}
function speak(parts,onEach,onEnd){
  // parts: [{text,pitch}] 순서대로 읽기
  if(!TTS.ok){ttsMsg();return;}
  stopSpeak();if(!TTS.voice)pickVoice();
