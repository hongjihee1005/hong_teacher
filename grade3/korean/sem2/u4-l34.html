<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🎁 높임 표현을 바르게 사용하는 방법 알기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>:root{
  --bg:#F6EFE6; --paper:#FFFFFF; --ink:#2A2236; --soft:#5E5670; --line:#E2D6C6;
  --ok:#1F9E63; --no:#D2453A; --acc:#D64C5A; --tn:#6A4FC9; --warm:#FFF4D6; --warmline:#E8961E;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1D1A28;--paper:#2B2640;--ink:#F4F1FA;--soft:#C3BBD6;--line:#453E60;--tn:#A792F0;--warm:#3A3222;--warmline:#C98A2A}
}
:root[data-theme="dark"]{--bg:#1D1A28;--paper:#2B2640;--ink:#F4F1FA;--soft:#C3BBD6;--line:#453E60;--tn:#A792F0;--warm:#3A3222;--warmline:#C98A2A}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:26px;overflow:hidden}
button,input,textarea{font-family:var(--display);color:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:5px solid var(--acc);outline-offset:3px}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:clamp(12px,1.8vw,26px)}
.screen.on{display:flex}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0}
.title{font-size:clamp(40px,min(6.2vw,10.5vh),92px);line-height:1.12;text-align:center}
.lead{font-size:clamp(22px,2.3vw,32px);color:var(--soft);margin:0;text-align:center}
.center-col{align-items:center;overflow-y:auto}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.row-label{font-family:var(--display);font-size:clamp(22px,2.1vw,30px)}
.seg{display:flex;flex-wrap:wrap;border:3px solid var(--line);border-radius:18px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;font-size:clamp(20px,1.9vw,28px);padding:9px 16px;min-width:64px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.big-btn{font-size:clamp(28px,2.9vw,44px);padding:12px 44px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);box-shadow:0 6px 0 rgba(0,0,0,.25)}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.big-btn[disabled]{opacity:.35}
.mid-btn{font-size:clamp(22px,2.1vw,30px);padding:10px 28px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);box-shadow:0 5px 0 rgba(0,0,0,.22)}
.ghost-btn{font-size:clamp(20px,1.9vw,28px);padding:9px 24px;border-radius:999px;border:3px solid var(--ink);background:transparent}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tool{font-size:22px;border:3px solid var(--line);background:var(--paper);border-radius:14px;padding:6px 12px}
.chip{font-family:var(--display);font-size:clamp(20px,1.9vw,28px);padding:4px 16px;border-radius:999px;background:var(--paper);border:3px solid var(--line)}
.chip.now{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip.win{border-color:#E8961E;background:#E8961E;color:#fff}
.scores{display:flex;gap:8px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(20,14,30,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay.on{display:flex}
.panel{background:var(--paper);border-radius:26px;padding:clamp(20px,2.8vw,44px);width:min(1100px,94vw);max-height:92vh;overflow-y:auto;text-align:center;border-top:18px solid var(--pc,var(--ink))}
.panel h2{font-size:clamp(38px,4.6vw,66px);margin:0 0 10px}
.panel .why{font-size:clamp(25px,2.5vw,36px);line-height:1.55;margin:0 auto 20px;max-width:36em}
.stagebar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.st{font-family:var(--display);cursor:pointer;font-size:clamp(17px,1.65vw,24px);padding:5px 12px;border-radius:999px;border:3px solid var(--line);background:var(--paper);color:var(--soft)}
.st.now{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.st.done{border-color:var(--ok);color:var(--ok)}
.st.brk{border-style:dashed}
#bar .st:not(.now) .nm{display:none}
#bar .st{padding:5px 10px}
.goal{font-family:var(--display);font-size:clamp(18px,1.75vw,26px);color:var(--soft);text-align:center;margin:3px 0 0}
.body p{margin:0}
.ttsmsg:empty{display:none}
.bodywrap{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;padding:4px 2px}
.body{transform-origin:top center;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.4vh,18px);margin:auto 0;width:100%}
.hd{font-family:var(--display);font-size:clamp(28px,3.1vw,46px);text-align:center;line-height:1.3;max-width:34em}
.stepno{font-family:var(--display);font-size:clamp(16px,1.5vw,21px);color:var(--soft)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:6px;flex-wrap:wrap}
.tnote{border:3px solid var(--tn);color:var(--tn);background:var(--paper);border-radius:16px;padding:7px 16px;font-size:clamp(18px,1.7vw,24px)}
.qbox{background:var(--warm);border:5px solid var(--warmline);border-radius:24px;padding:clamp(14px,2vw,26px);width:min(1100px,94vw);text-align:center;font-family:var(--display);font-size:clamp(26px,2.9vw,42px);line-height:1.4}
.card1{width:min(1100px,94vw);background:var(--paper);border-radius:24px;border:4px solid var(--line);padding:clamp(14px,2vw,28px);display:flex;gap:clamp(14px,2.6vw,32px);align-items:center;justify-content:center}
.card1 .e{font-size:clamp(54px,6.4vw,100px);line-height:1;flex:none}
.card1 .x{font-family:var(--display);font-size:clamp(26px,3vw,44px);line-height:1.38}
/* flip cards */
.recall{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:14px;width:min(1200px,96vw)}
.recall.q4{width:min(720px,90vw)}
.recall.q4 .rc{min-height:0;aspect-ratio:2.1/1}
.rc{position:relative;min-height:clamp(160px,22vh,240px);border:0;background:none;perspective:1200px;font-family:var(--body);padding:0}
.rc .in{position:absolute;inset:0;transition:transform .5s;transform-style:preserve-3d}
.rc.open .in{transform:rotateY(180deg)}
.rc .f{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.rc .front{background:var(--cc);color:#fff;font-family:var(--display);font-size:clamp(23px,2.4vw,34px)}
.rc .front span{font-size:clamp(42px,4.4vw,64px)}
.rc .back2{background:var(--paper);border:5px solid var(--cc);transform:rotateY(180deg);font-size:clamp(20px,2vw,28px);line-height:1.45;color:var(--ink)}
/* talk */
.talk{width:min(1150px,95vw);display:grid;gap:10px}
.talk .q{background:var(--paper);border-radius:18px;border-left:14px solid var(--cc,var(--acc));padding:12px 20px;font-size:clamp(23px,2.4vw,34px);line-height:1.45;text-align:left}
.hq{display:flex!important;gap:.4em;align-items:flex-start}.hq>.qm{flex:none}.hq>.qt{flex:1 1 auto;min-width:0}
.talk .q.lq{padding:0;overflow:hidden;align-items:stretch!important;gap:0!important}.lq>.ql{flex:none;width:9.6em;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:10px 12px;font-weight:700;background:color-mix(in srgb,var(--cc) 9%,var(--paper));border-right:2px solid color-mix(in srgb,var(--cc) 25%,var(--paper))}.lq>.ql small{white-space:nowrap;margin-top:2px!important;font-weight:400;font-size:.62em!important;line-height:1.3}.lq>.qt{display:flex;align-items:center;padding:12px 20px;white-space:nowrap}
.talk .q small{display:block;color:var(--soft);font-size:.7em;margin-top:4px}
.exs{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(1150px,95vw)}
.exbox{width:100%;background:var(--warm,#FFF8EC);border:3px dashed var(--warmline,#EBD9B0);border-radius:18px;padding:12px 18px;text-align:left}
.exbox[hidden]{display:none}
.exh{font-size:clamp(15px,1.3vw,18px);font-weight:800;color:var(--soft);margin-bottom:6px}
.exbox ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px}
.exbox li{background:var(--paper);border-radius:12px;padding:8px 12px;font-size:clamp(18px,1.8vw,24px);line-height:1.4;display:flex;gap:.4em}
.exbox li::before{content:'•';color:var(--acc);font-weight:800}
@media (max-width:820px){.exbox ul{grid-template-columns:1fr}}
.hd .pgref{display:block;font-size:.66em;font-weight:500;color:var(--soft);margin-top:6px;letter-spacing:0}
.ex{background:var(--paper);border:3px dashed var(--line);border-radius:999px;padding:6px 18px;font-size:clamp(19px,1.9vw,26px)}
.timer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.timer .t{font-family:var(--display);font-size:clamp(30px,3vw,44px);min-width:3.2em;text-align:center}
/* book */
.book{width:min(1150px,95vw);background:var(--paper);border-radius:24px;border:4px solid var(--line);padding:clamp(14px,2vw,26px);display:grid;grid-template-columns:auto 1fr;gap:clamp(12px,2vw,26px);align-items:center}
.book .e{font-size:clamp(60px,7vw,110px);line-height:1}
.book .pg{font-family:var(--display);font-size:clamp(28px,3vw,44px);color:var(--acc)}
.book ol,.book ul{margin:6px 0 0;padding-left:1.2em;font-size:clamp(22px,2.2vw,31px);line-height:1.5;text-align:left}
.pickways{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:12px;width:min(1150px,95vw)}
.pw{border:4px solid var(--line);background:var(--paper);border-radius:20px;padding:12px;font-size:clamp(20px,2vw,28px);display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--body);text-align:center}
.pw span{font-size:clamp(34px,3.4vw,50px)}
.pw.lit{border-color:var(--acc);box-shadow:inset 0 0 0 4px var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--paper))}
/* multiple choice */
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(1100px,95vw)}
.card1:has(>.stepno){flex-wrap:wrap}.card1:has(>.stepno)>.x{flex:1 1 100%;text-align:center;text-wrap:pretty}.card1 .x.lx{font-size:clamp(22px,2.3vw,34px)}.card1>.stepno{flex:1 1 100%!important;text-align:center;margin-bottom:-6px}

.opt2{border:4px solid var(--line);background:var(--paper);border-radius:18px;padding:12px 18px;font-family:var(--body);font-size:clamp(22px,2.3vw,32px);line-height:1.4;text-align:left}
.opt2.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--paper))}
.opt2.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 14%,var(--paper))}
/* sort */
.bins{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:clamp(8px,1.4vw,18px);width:min(1200px,96vw)}
.bin{position:relative;border:0;background:var(--cc);color:#fff;border-radius:36px 36px 18px 18px;padding:clamp(10px,1.8vh,20px) 8px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 7px 0 rgba(0,0,0,.22)}
.bin .e{font-size:clamp(34px,4vw,60px);line-height:1}
.bin .n{font-size:clamp(21px,2.3vw,34px);text-align:center;line-height:1.25}
.bin:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.22)}
.bin.lit{outline:6px solid var(--ink);outline-offset:4px}
.bin[disabled]{opacity:.75}
/* order */
.olist{width:min(1100px,95vw);display:grid;gap:10px}
.oi{display:flex;align-items:center;gap:12px;border:4px solid var(--line);background:var(--paper);border-radius:18px;padding:8px 14px;font-family:var(--body);font-size:clamp(20px,2vw,28px);line-height:1.35;text-align:left}
@media (min-width:1000px){.olist.two{grid-template-columns:1fr 1fr}.lsn.two{grid-auto-flow:column;grid-template-columns:1fr 1fr;grid-template-rows:repeat(var(--r),auto)}.talk.two{grid-template-columns:1fr 1fr}.mgrid.wide{grid-template-columns:1fr 1fr}}
.oi .no{flex:none;width:1.9em;height:1.9em;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--line);color:var(--ink);font-family:var(--display)}
.oi.got .no{background:var(--acc);color:#fff}
.oi.got{border-color:var(--acc)}
.oi.right{border-color:var(--ok)}.oi.right .no{background:var(--ok)}
.oi.miss{border-color:var(--no)}.oi.miss .no{background:var(--no)}
.bogi{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 10px;width:fit-content;max-width:min(1100px,96%);margin:2px auto 12px;padding:10px 18px;border:3px solid color-mix(in srgb,var(--acc) 45%,var(--line));border-radius:18px;background:var(--paper);font-size:clamp(20px,2vw,28px);line-height:1.4}
.bogi .bl{flex:none;background:var(--acc);color:#fff;border-radius:999px;padding:2px 14px;font-weight:800;font-size:.85em}
.bogi .bw{border:2px solid var(--line);background:color-mix(in srgb,var(--acc) 8%,var(--paper));border-radius:12px;padding:2px 14px;font-weight:700;white-space:nowrap}
.bogi .bt{text-align:left;flex:1 1 300px}
.tipnote{width:min(1100px,94vw);margin-top:12px;padding:10px 18px;border-radius:14px;background:color-mix(in srgb,var(--acc) 5%,var(--paper));border:1px dashed color-mix(in srgb,var(--acc) 30%,var(--line));font-family:var(--body);font-weight:400;font-size:clamp(17px,1.6vw,22px);line-height:1.5;color:var(--soft);text-align:left;text-wrap:pretty}
.hk{display:inline-flex;gap:.3em;vertical-align:top;max-width:100%}.hkl{flex:none}.hkt{flex:1 1 auto;min-width:0}
.kw{font-weight:900;color:var(--acc);text-decoration:underline;text-decoration-thickness:.1em;text-underline-offset:.2em}
.exl{display:block;margin-top:.5em;font-size:.72em;line-height:1.45;color:var(--soft)}
.ye{display:inline-flex;align-items:center;justify-content:center;width:1.55em;height:1.55em;border-radius:50%;border:2px solid currentColor;font-size:.82em;font-weight:700;margin-right:.35em;vertical-align:.08em}
.kpic{margin:0 auto 10px;text-align:center}.kpic img{display:block;margin:0 auto;max-height:clamp(150px,24vh,260px);max-width:min(560px,90vw);border-radius:14px;object-fit:contain}.kpic figcaption{font-size:clamp(12px,1vw,14px);color:var(--muted,var(--soft));margin-top:4px}
.hkb{display:inline-block;vertical-align:top}.hkb b{font-weight:800}
.pgref2{font-size:.72em;color:var(--soft);white-space:nowrap}
.bogi .brows{display:flex;flex-direction:column;gap:8px;align-items:center}.bogi .brow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 10px}
.bw.dz{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .12s,opacity .2s}.bw.dz:hover{transform:translateY(-2px)}
.bw.sel{outline:3px solid var(--acc);outline-offset:2px;transform:translateY(-2px)}.bw.used{opacity:.3;cursor:default;transform:none}.bw.lift{opacity:.35}
.bw.ghost{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-60%) scale(1.08);box-shadow:0 10px 24px rgba(0,0,0,.18);border:2px solid var(--acc);background:var(--paper);border-radius:12px;padding:2px 14px;font-weight:700;font-size:clamp(20px,2vw,28px)}
.fl input.dzhover{outline:3px dashed var(--acc);outline-offset:2px}
.bins2{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:12px;width:min(1150px,95vw);margin-top:6px}
.bin2{background:var(--paper);border:3px dashed color-mix(in srgb,var(--acc) 30%,var(--line));border-radius:18px;overflow:hidden;min-height:clamp(120px,20vh,200px);display:flex;flex-direction:column;cursor:pointer}
.bin2.dzhover{border-style:solid;border-color:var(--acc);background:color-mix(in srgb,var(--acc) 5%,var(--paper))}
.bin2 .bh{text-align:center;font-weight:800;font-size:clamp(16px,1.55vw,22px);white-space:nowrap;padding:8px 10px;background:color-mix(in srgb,var(--acc) 7%,var(--paper));border-bottom:2px solid color-mix(in srgb,var(--acc) 18%,var(--paper))}
.bin2 .bb{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:8px;padding:10px}
.bw.placed{cursor:pointer;font-size:clamp(20px,2vw,28px);border:2px solid var(--line);background:color-mix(in srgb,var(--acc) 8%,var(--paper));border-radius:12px;padding:2px 14px;font-weight:700;white-space:nowrap}.bw.placed.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper));cursor:default}.bw.placed.bad{border-color:var(--no);background:color-mix(in srgb,var(--no) 14%,var(--paper));animation:sh .35s}
/* match */
.mgrid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr);gap:10px 18px;width:min(1150px,96vw);align-items:stretch}
.mgrid>.mw,.mgrid>.mm{min-height:100%;display:flex;align-items:center}
.mgrid>.mw{justify-content:center}
.mcol{display:grid;gap:10px;align-content:start}
.mw,.mm{border:4px solid var(--line);background:var(--paper);border-radius:18px;padding:10px 16px;font-size:clamp(21px,2.2vw,31px);line-height:1.35;text-align:left}
.mw{font-family:var(--display);text-align:center;font-size:clamp(26px,2.8vw,40px)}
.mm{font-family:var(--body)}
.mw small{display:block;font-size:.55em;font-weight:500;color:var(--soft);margin-top:2px}
.mw.sel{border-color:var(--acc);box-shadow:inset 0 0 0 4px var(--acc)}
.mw.done,.mm.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper));opacity:.8}
.mm.shake{animation:sh .35s}
/* match: 점 잇기 모드(dots=True) */
.mgrid.dots{position:relative;user-select:none;-webkit-user-select:none;column-gap:clamp(84px,8vw,120px);grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}
.mgrid.dots>.mm{padding:10px 12px}
.mgrid.dots.short{width:min(860px,92vw);column-gap:clamp(140px,20vw,280px)}
.mgrid.dots.short>.mw,.mgrid.dots.short>.mm{font-family:var(--display);font-weight:700;font-size:clamp(26px,2.8vw,40px)}
.mgrid.dots>.mw,.mgrid.dots>.mm{position:relative;overflow:visible;touch-action:none}
.mgrid.dots .dot{position:absolute;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--paper);border:5px solid var(--ink);box-sizing:border-box;z-index:2;cursor:pointer}
.mgrid.dots .dot::before{content:'';position:absolute;inset:-14px;border-radius:50%}
.mgrid.dots>.mm{justify-content:center;text-align:center}
.mgrid.dots .mw .dot{right:-30px}.mgrid.dots .mm .dot{left:-30px}
.mgrid.dots .sel .dot{background:var(--acc);border-color:var(--acc);transform:scale(1.25)}
.mgrid.dots .done .dot{background:var(--ok);border-color:var(--ok)}
.mgrid.dots>svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:1}
.mgrid.dots line{stroke-width:6;stroke-linecap:round}
.mgrid.dots line.ok{stroke:var(--ok)}.mgrid.dots line.tmp{stroke:var(--acc);stroke-dasharray:2 12}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* fill blanks */
.fillbox{width:min(1100px,95vw);display:grid;gap:12px}
.fl{background:var(--paper);border-radius:18px;padding:12px 18px;font-size:clamp(22px,2.3vw,32px);line-height:1.9;text-align:left;border-left:12px solid var(--cc,var(--acc))}
.fl input{font-family:var(--display);font-size:1em;width:calc(var(--w,4) * 1.15em + 1em);border:0;border-bottom:4px solid var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--paper));border-radius:8px 8px 0 0;padding:0 6px;text-align:center;color:var(--ink)}
.fl input::placeholder{color:color-mix(in srgb,var(--soft) 55%,transparent)}

html .hj-em{font-family:'HJ Emoji','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-weight:400;font-style:normal;font-synthesis:none;letter-spacing:0;-webkit-text-stroke:0;text-shadow:none}
/* 교사 안내 창 도구(인쇄·구글 문서·이메일) */
html body .hj-tbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px 0 4px;padding-top:18px;border-top:1px solid var(--line)}
html body .hj-tbar>button,html body .hj-mail button{display:inline-flex;align-items:center;gap:7px;font:700 16px/1.2 'Gowun Dodum',sans-serif;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;cursor:pointer}
html body .hj-tbar>button:hover,html body .hj-mail button:hover{background:var(--bg);border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
html body .hj-tbar .hj-i{width:18px;height:18px;flex:none}
html body .hj-mail{flex-basis:100%;display:grid;gap:8px;max-width:560px;margin:6px auto 0;text-align:left;background:var(--bg);border-radius:16px;padding:14px 16px}
html body .hj-mail[hidden]{display:none}
html body .hj-mail label{font-weight:700;font-size:16px}html body .hj-mail label small{font-weight:500;color:var(--soft);font-size:14px;margin-left:6px}
html body .hj-mail input{font:500 17px/1.4 'Gowun Dodum',sans-serif;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
html body .hj-mail div{display:flex;flex-wrap:wrap;gap:8px}html body .hj-mail p{margin:0;font-size:14px!important;color:var(--soft)}
html body .hj-toast{flex-basis:100%;margin:2px 0 0;min-height:1.3em;text-align:center;font-size:15px!important;color:var(--soft)}
@media print{
 body.hj-tprint>*:not(#tn){display:none!important}
 body.hj-tprint #tn{position:static!important;display:block!important;background:none!important;padding:0!important;inset:auto!important}
 body.hj-tprint #tn .panel{width:auto!important;max-height:none!important;overflow:visible!important;box-shadow:none!important;border:0!important;border-radius:0!important;padding:0!important;transform:none!important;animation:none!important}
 body.hj-tprint .hj-tbar,body.hj-tprint #tnClose{display:none!important}
 body.hj-tprint{background:#fff!important;color:#000}
 body.hj-tprint #tn .panel{padding:16mm!important}
}
/* 수업을 마쳤을 때 고르는 창 */
#hj-done{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:rgba(42,34,28,.38);backdrop-filter:blur(3px);animation:hjfade .2s ease}
@keyframes hjfade{from{opacity:0}to{opacity:1}}
#hj-done .hj-dp{width:min(560px,100%);background:var(--paper,#fff);color:var(--ink,#2A221C);border-radius:24px;padding:30px 28px 24px;text-align:center;box-shadow:0 30px 60px -24px rgba(40,25,10,.5);font-family:'Gowun Dodum',sans-serif;word-break:keep-all}
#hj-done .hj-dok{display:inline-grid;place-items:center;width:60px;height:60px;border-radius:18px;background:color-mix(in srgb,#7FB89A 22%,var(--paper,#fff));color:#3F7A5C}
#hj-done .hj-dok svg{width:32px;height:32px}
#hj-done h2{font-family:'Jua',sans-serif;font-size:clamp(26px,3vw,32px);margin:12px 0 4px;letter-spacing:-.03em}
#hj-done .hj-dl{margin:0 0 20px;color:var(--soft,#5C5047);font-size:17px}
#hj-done .hj-dn{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;text-align:left;text-decoration:none;color:#fff;background:var(--ink,#2A221C);border-radius:18px;padding:16px 20px}
#hj-done .hj-dn small{grid-column:1;font-size:14px;opacity:.75;font-weight:600}
#hj-done .hj-dn b{grid-column:1;font-size:clamp(18px,2vw,21px);line-height:1.4}
#hj-done .hj-dn svg{grid-column:2;grid-row:1/3;width:26px;height:26px}
#hj-done .hj-dn:hover{filter:brightness(1.15)}
#hj-done .hj-dlast{margin:0;padding:14px;border-radius:16px;background:var(--bg,#FFFCF8);color:var(--soft,#5C5047);font-size:17px}
#hj-done .hj-drow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
#hj-done .hj-db{flex:1 1 200px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 17px/1.2 'Gowun Dodum',sans-serif;color:var(--ink,#2A221C);background:var(--paper,#fff);border:1.5px solid var(--line,#EFE3D6);border-radius:999px;padding:12px 16px;text-decoration:none;cursor:pointer}
#hj-done .hj-db:hover{background:var(--bg,#FFFCF8)}
#hj-done .hj-db svg{width:20px;height:20px}
#hj-done :focus-visible{outline:3px solid #E0A458;outline-offset:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #hj-done .hj-dn{background:#F2EBE3;color:#221E1A}}
:root[data-theme="dark"] #hj-done .hj-dn{background:#F2EBE3;color:#221E1A}
html body .hj-pl{display:none}
@media print{body.hj-tprint .hj-pl{display:block;text-align:center;font-size:14px!important;color:#555;margin:0 0 4px}}
/* 사진 출처 줄이 화면 밖으로 넘치지 않게 */
html body #phc{white-space:normal!important;overflow-wrap:anywhere;max-width:min(1100px,100%);text-align:center;line-height:1.6;opacity:.85}
/* 홍지희 선생님 버전(SOOP) 첫 화면: 차분하고 읽기 쉽게 */
html body #cBadge{background:color-mix(in srgb,var(--sc) 14%,var(--paper));color:color-mix(in srgb,var(--sc) 78%,var(--ink));font-weight:700;font-size:clamp(15px,1.3vw,18px);padding:5px 14px;letter-spacing:-.01em}
html body #cover:has(#cBadge) .title{font-size:clamp(30px,min(4vw,7vh),52px);line-height:1.25}
html body #cBq{border:0;border-left:5px solid color-mix(in srgb,var(--sc) 55%,var(--paper));background:color-mix(in srgb,var(--sc) 6%,var(--paper));border-radius:16px;padding:14px 22px;text-align:left;box-shadow:none}
html body #cBq>*:first-child:not(b){font-size:15px!important;font-weight:700;color:var(--soft)}
html body #cBq b{display:block;font-weight:700;font-size:clamp(20px,2vw,27px);line-height:1.4;margin-top:2px}
html body #cGoal{border:0;border-left:5px solid transparent;background:var(--hjs-soft,color-mix(in srgb,#2B4A7C 8%,var(--paper)));color:var(--ink);border-radius:16px;padding:12px 22px;font-weight:700;font-size:clamp(18px,1.7vw,23px);text-align:left;box-shadow:none}

html body #stage .hd{font-size:clamp(28px,min(3.1vw,6.2vh),54px)!important;line-height:1.3}
html body #stage .recall{width:100%;gap:clamp(12px,1.4vw,24px)}
html body #stage .rc{min-height:clamp(180px,30vh,340px)}
html body #stage .rc .front{font-size:clamp(24px,min(2.5vw,5vh),42px)!important}
html body #stage .rc .back2{font-size:clamp(20px,min(2.05vw,4.2vh),34px)!important}
html body #stage #body>.qbox{width:min(1400px,100%);font-size:clamp(22px,min(2.2vw,4.6vh),38px)!important}
html body #stage .goal{font-size:clamp(15px,1.25vw,20px)}
html body #stage #body{margin-left:auto!important;margin-right:auto!important}
html body #stage .recall{justify-content:center;margin-left:auto;margin-right:auto}
/* 과학 앱 위 탭 줄 더 얇게, 안쪽 '이전/다음 단계'는 아래 막대로 합침 */
html:has(#ovBar) body>nav{border-bottom-width:1px!important}
html:has(#ovBar) body>nav .wrap{padding-top:6px!important;padding-bottom:6px!important;gap:5px!important;min-height:0!important}
html:has(#ovBar) body>nav a{font-size:clamp(13px,.95vw,15px)!important;padding:4px 11px!important;min-height:0!important;line-height:1.35!important}
html:has(#ovBar) body>nav .hj-nav a{min-height:32px;padding:4px 11px 4px 9px}
html.hj-merge-steps section .hj-innernav{display:none!important}
/* 과학 앱 실험 화면 배치 다듬기 */
html:has(#ovBar) body .card{justify-content:center!important;text-align:center}
html:has(#ovBar) body .vs{align-items:stretch}
html:has(#ovBar) body .vs>b{align-self:center}
html:has(#ovBar) body .lab>svg{display:block;width:min(100%,980px)!important;max-height:44vh;margin-left:auto;margin-right:auto}
html:has(#ovBar) body .lab>.row{justify-content:center}
html:has(#ovBar) body .gallery{gap:10px!important}
html:has(#ovBar) body .gallery .photo{display:grid;grid-template-columns:minmax(120px,32%) 1fr;align-items:center;margin:8px 0 0}
html:has(#ovBar) body .gallery .photo img{width:100%;height:100%;max-height:150px;object-fit:cover;aspect-ratio:auto!important}
html:has(#ovBar) body .gallery .photo figcaption{padding:8px 12px!important;font-size:clamp(14px,1.1vw,17px)!important;text-align:left}
html:has(#ovBar) body .photo{border-width:1px!important;border-color:var(--line)!important}
html:has(#ovBar) body .hj-gonext{margin-left:8px}
html:has(#ovBar) body button.hj-retry{background:var(--paper)!important;color:var(--ink)!important}
html:has(#ovBar) body span.hj-rrow{display:inline-flex;gap:8px;margin:0 0 0 auto}
html:has(#ovBar) body span.hj-rrow .hj-gonext{margin-left:0}
/* 이동 단추 묶음은 위치 표시일 뿐: 앱의 nav 꾸밈(밑줄·고정)을 받지 않게 */
html body nav.hj-nav{border:0!important;position:static!important;background:none!important;box-shadow:none!important;padding:0!important;top:auto!important}
/* ===== 화면 배치(모든 교과) ===== */
/* 과학 한 화면 보기: 좌우 여백, 제목·질문은 가운데, 설명은 왼쪽 */
html body.ov main.wrap{max-width:min(1280px,100%)!important;margin-left:auto!important;margin-right:auto!important}
html body.ov section .fitbox>.stage{display:table;margin-left:auto;margin-right:auto}
html body.ov section .fitbox>:is(h2,h3){text-align:center;text-wrap:balance}
html body.ov section .fitbox>p:not(.fb){text-align:center;text-wrap:balance}
html body.ov section :is(.row,.order,.two,.vs,.gauge){justify-content:center}
html body.ov section .fb{text-align:left}
html body.ov section .pick{max-width:1100px;margin-left:auto;margin-right:auto}
/* 사진: 사진 왼쪽 크게, 설명 오른쪽 */
html body.ov .photo{display:grid!important;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:center;max-width:1100px;margin-left:auto!important;margin-right:auto!important}
html body.ov .photo img{width:100%!important;height:auto!important;max-height:min(340px,38vh)!important;aspect-ratio:auto!important;object-fit:cover}
html body.ov .photo figcaption{padding:12px 18px!important;font-size:clamp(16px,1.3vw,20px)!important;line-height:1.55;text-align:left}
html body.ov .photo .cr{font-size:clamp(12px,.9vw,14px)!important;margin-top:6px}
html body.ov .gallery{grid-template-columns:1fr!important;max-width:1100px;margin-left:auto;margin-right:auto}
html body.ov .gallery .photo img{max-height:min(220px,26vh)!important}
html:has(#ovBar) body .gallery .photo{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
/* 국어·사회 진행 화면: 너무 넓게 퍼지지 않게 */
html body #stage #body{width:min(1240px,94vw)!important}
/* 홍지희 선생님 버전 진행 화면 */
html body #lesson .body{width:min(1360px,94vw);max-width:none;margin-left:auto;margin-right:auto}
/* 수학 앱: 가운데 정렬된 넓이 */
html body main.lesson{max-width:min(1480px,100%)!important}
html body.ov section :is(#quiz,#perf,.qz)>div>p.jua,html body.ov section p.jua{text-align:center;text-wrap:balance}
html body.ov section .pick:has(>:nth-child(3):last-child){grid-template-columns:repeat(3,minmax(0,1fr))!important}
html body.ov .photo img{max-height:min(260px,28vh)!important}
html body.ov .gallery .photo img{max-height:min(190px,22vh)!important}
html body.ov main.wrap{max-width:min(1120px,100%)!important}
/* 모든 교과 같은 본문 폭: 눈이 좌우로 너무 오가지 않게 1240px 안팎 */
html body.ov main.wrap{max-width:min(1240px,100%)!important}
html body #lesson .body{width:min(1240px,94vw)!important}
html body .hj-navbar{position:relative;z-index:60}
html body .topbar>.hj-nav{margin-right:10px}
/* 본문 폭 최종: 수학 앱의 활동 칸과 비슷한 1080~1120px. 눈이 좌우로 덜 움직이게 */
html body.ov main.wrap{max-width:min(1080px,100%)!important}
html body #stage #body{width:min(1120px,94vw)!important}
html body #lesson .body{width:min(1120px,94vw)!important}
/* 국어: 자체 확대(최대 약 1.3배)가 있으므로 바탕 폭을 좁혀, 확대 뒤에도 1150px 안팎 */
html body #stage #bodyWrap>#body{width:min(1000px,94vw)!important}
html body.ov .hj-pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:1080px;margin:10px auto 0}
html body.ov .hj-pgrid .photo{display:block!important;margin:0!important}
html body.ov .hj-pgrid .photo img{width:100%!important;max-height:min(230px,26vh)!important;object-fit:cover}
html body.ov .hj-pgrid .photo figcaption{font-size:clamp(14px,1.1vw,17px)!important}
html body.ov .photo img{max-height:min(210px,22vh)!important}
html body.ov .photo{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
/* 너무 작은 글자 막기: 출처·쪽수 같은 작은 글도 13.5px 이상 */
html body :is(#lesson,#stage,#cover) small:not(.hj-contact *){font-size:max(13.5px,.8em)!important}
html body .tool .n{font-size:13px!important;min-width:20px;height:20px;line-height:20px}
/* 진행 화면 위 줄: 단계가 많아도 도구 단추와 겹치지 않게(단계 줄만 옆으로 밀기) */
html body .screen:not(#cover) .topbar{flex-wrap:nowrap}
html body .screen:not(#cover) .topbar>:is(.steps,.stagebar){flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap!important}
html body .screen:not(#cover) .topbar>:is(.steps,.stagebar)::-webkit-scrollbar{display:none}
html body .screen:not(#cover) .topbar>:is(.steps,.stagebar)>*{flex:none}
html body .screen:not(#cover) .topbar>.tools{flex:none}
/* 진행 화면 안의 넓은 블록이 본문 폭을 넘지 않게(잘림 방지) */
html body #stage #body>*{max-width:100%!important}
html body #stage #body :is(.exp,.expq,.recall,.talk,.exs,.cmp,.grid2,.grid3){width:100%!important;max-width:100%!important}
html body #lesson .cols{grid-template-columns:repeat(var(--n,3),minmax(0,1fr))!important}
html body #lesson .col{min-width:0}
html body #lesson .col :is(input,textarea){min-width:0;width:100%}
html body #lesson .col .row,html body #lesson .col form{display:flex;gap:6px;min-width:0}
html body #lesson .body{max-width:100%}
html body .wg>h2{white-space:nowrap!important;flex-wrap:nowrap!important;text-wrap:nowrap!important}
html body .wg>h2 .ed{flex:none;font-size:.88rem!important;padding:.2rem .65rem!important;min-height:1.9rem}
/* ===== 폰·패드 세로 화면 ===== */
@media (max-width:820px){
 html body .screen:not(#cover) .topbar{flex-wrap:wrap!important;row-gap:6px}
 html body .screen:not(#cover) .topbar>:is(.steps,.stagebar){flex:1 1 100%;order:2}
 html body .screen:not(#cover) .topbar>.tools{flex:1 1 100%;order:1;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px}
 html body .screen.on>.topbar>.hj-nav{order:0}
 html body header.top{flex-wrap:wrap!important;row-gap:6px;height:auto!important}
 html body header.top .brand{min-width:0;flex:1 1 auto;white-space:normal}
 html body header.top .brand .long{display:none!important}
 html body header.top>.hj-nav{flex:1 1 100%}
 html body .tools{flex-wrap:wrap}
 html body :is(h1,h2,h3,.title,.hd,.ask,.qbox,.lead,p,li,b,span,button,a,td,th,label,small){word-break:keep-all;overflow-wrap:break-word}
}
/* 수학 앱 머리줄: 단원 이름이 길면 이름표가 오른쪽 밖으로 밀려나던 것(2026-10-24). 넓은 화면에서도 줄 안에 맞추고 긴 이름은 …으로 줄임 · hj-topfit */
@media (min-width:821px){
 html[data-hjsubj="math"] body header.top{min-width:0}
 html[data-hjsubj="math"] body header.top .brand{min-width:0;flex:1 1 auto;overflow:hidden}
 html[data-hjsubj="math"] body header.top .brand>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 html[data-hjsubj="math"] body header.top .brand>span:not(.long){flex:0 1 auto}
 html[data-hjsubj="math"] body header.top .brand>span.long{flex:1 1 0}
 html[data-hjsubj="math"] body header.top .brand>svg{flex:none}
 html[data-hjsubj="math"] body header.top>.who,html[data-hjsubj="math"] body header.top>.hj-nav{flex:none}
}
@media (max-width:480px){
 html body #cover .title,html body #hj-scover .hj-sc-title{font-size:clamp(24px,7vw,32px)!important}
 html body #stage .hd,html body .screen .hd{font-size:clamp(21px,6vw,28px)!important}
 html body .hj-nav a span{font-size:13.5px}
 html body .hj-cvtools .hj-tool2{padding:6px 10px!important}
}
html body .bv i{font-size:max(13px,1em)}
@media (max-width:480px){html body #stage .rc{min-height:150px!important}html body #stage .rc .front img{max-height:90px;object-fit:cover}}
@media (max-width:600px){
 html body .labgrid,html body .lab2,html body .two{grid-template-columns:1fr!important}
 html body .pick{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))!important}
 html body.ov .photo,html:has(#ovBar) body .gallery .photo{grid-template-columns:1fr!important}
 html body.ov .hj-pgrid,html body .gallery{grid-template-columns:1fr!important}
 html body .vs{grid-template-columns:1fr!important}
 html body .vs>b{justify-self:center}
}
@media (max-width:600px){
 html body.ov .gal,html body .card2-wrap{grid-template-columns:1fr!important}
 html body.ov .card2 .pick,html body.ov section .pick.one{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))!important}
}
html body .hj-field>.hj-multi{grid-auto-flow:row!important}
html body .hj-field>.hj-multi .st,html body .hj-field .hj-multi>button{border-top:1px solid var(--line)!important}
html body .hj-field>.hj-multi .st:nth-child(-n+20){border-left:1px solid var(--line)!important}
@media (max-width:900px){html body.ov .gallery,html body.ov .hj-pgrid{grid-template-columns:1fr!important}}
/* 단계 줄이 넘치면 오른쪽 끝을 흐리게: 옆으로 밀어 더 볼 수 있다는 표시 */
html body .screen:not(#cover) .topbar>:is(.steps,.stagebar).hj-ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
html body .card2 .pick{grid-template-columns:repeat(auto-fill,minmax(124px,1fr))!important}
html body .card2 .pick button{padding:.4em .5em!important}
@media (max-width:600px){html body #lesson .cols{grid-template-columns:1fr!important}html body #lesson .col{min-height:0!important}}
html body .wg>h2 .ed{margin-left:auto!important;white-space:nowrap}
html body .wg>h2{min-width:0;overflow:hidden}
/* ===== 메뉴 단추 크기 통일(모든 교과) ===== */
/* 이동 단추 [홈·자료 목록] */
html body .hj-nav a{min-height:36px!important;font-size:clamp(14.5px,1.05vw,16px)!important}
/* 과학 아래 막대: 국어·사회 아래 단추와 같은 크기 */
html:has(#ovBar) #ovBar button{font-size:clamp(15px,1.15vw,17px)!important;min-height:40px!important;padding:7px 15px!important}
html:has(#ovBar) #ovBar .pos{font-size:clamp(15px,1.15vw,17px)!important}
/* 홍지희 버전은 화면 전체를 키우므로(zoom) 단추만 원래 크기로 */
html body #lesson .topbar .tool{font-size:calc(15.5px / var(--hjz,1))!important;min-height:calc(34px / var(--hjz,1))!important;padding:calc(5px / var(--hjz,1)) calc(10px / var(--hjz,1))!important}
html body #lesson .foot :is(.tnote,.ghost,#prev){font-size:calc(16px / var(--hjz,1))!important;min-height:calc(38px / var(--hjz,1))!important;padding:calc(7px / var(--hjz,1)) calc(14px / var(--hjz,1))!important}
html body #lesson .foot #next{font-size:calc(19px / var(--hjz,1))!important;min-height:calc(42px / var(--hjz,1))!important;padding:calc(8px / var(--hjz,1)) calc(20px / var(--hjz,1))!important}
/* 수학 앱: 확인하기·다음 계단은 알맞은 크기로 */
html body main.lesson .big{font-size:clamp(18px,1.35vw,22px)!important;padding:.5em 1.5em!important;width:auto!important;min-width:0!important;box-shadow:0 3px 0 rgba(0,0,0,.15)!important}
html body main.lesson .side>.big{align-self:flex-end}
html body main.lesson .stair{font-size:clamp(16px,1.2vw,19px)!important;min-height:48px;padding-top:6px!important;padding-bottom:6px!important}
/* 우리 반 교실: '자세히'가 칸 밖으로 나가지 않게 */
html body .wg>h2{font-size:clamp(.98rem,1.05vw,1.15rem)!important;gap:.3rem!important}
html body .wg>h2 .ed{font-size:.82rem!important;padding:.15rem .5rem!important;min-height:1.75rem!important}
/* hidden으로 숨긴 것은 정말 숨기기(돋보기 결과가 처음부터 보이던 문제) */
html body [hidden]{display:none!important}
html body #zoom:not([hidden]),html body .zoom:not([hidden]){animation:hjzoom .45s cubic-bezier(.2,.8,.3,1.2)}
@keyframes hjzoom{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
/* 과학 한 화면 보기: 내용이 길면 칸이 늘어나고, 아래 막대가 내용을 가리지 않게 */
html body.ov main section.cur{height:auto!important;overflow:visible!important}
html body.ov{padding-bottom:calc(var(--hjbar,76px) + 28px)!important}
html body.ov main.wrap{padding-bottom:calc(var(--hjbar,76px) + 12px)!important}
/* 과학: 문제(질문)는 왼쪽 정렬 */
html body.ov section :is(#quiz,#perf,.qz)>div>p.jua,html body.ov section p.jua,html body.ov section #clue,
html body.ov section:has(#quiz,#perf,.qz) .fitbox>h3{text-align:left!important;text-wrap:pretty}
/* 사진 두 장이 한 칸에만 몰리던 것: 줄 전체를 쓰고 사진을 크게 */
html body .two>.hj-pgrid:only-child{grid-column:1/-1}
html body.ov .hj-pgrid .photo img{max-height:min(380px,44vh)!important;aspect-ratio:4/3!important}
@media (max-width:900px){html body.ov .hj-pgrid .photo img{max-height:none!important}}

/* 과학 '한 화면 보기' 앱: 크롬북처럼 낮은 가로 화면에서 여백만 줄여 한 화면에 더 담기 (글자 크기는 그대로, 2026-10-02) */
@media (orientation:landscape) and (max-height:760px){
 html:has(#ovBar) body.ov main{padding-top:0!important}
 html:has(#ovBar) body.ov main>section.cur{margin-top:4px!important;padding-top:8px!important;padding-bottom:8px!important}
 html:has(#ovBar) body.ov section.cur .stage{margin-bottom:2px!important;padding-top:1px!important;padding-bottom:1px!important}
 html:has(#ovBar) body.ov section.cur h2{margin-top:2px!important;margin-bottom:6px!important}
 html:has(#ovBar) body.ov section.cur h3{margin-top:8px!important;margin-bottom:6px!important}
 html:has(#ovBar) body.ov section.cur .fitbox>p{margin-top:4px!important;margin-bottom:8px!important}
 html:has(#ovBar) body.ov section.cur .lab{margin-top:8px!important;margin-bottom:8px!important}
 html:has(#ovBar) body.ov section.cur .tip,html:has(#ovBar) body.ov section.cur .fb{margin-top:6px!important}
 html:has(#ovBar) body.ov #ovBar{margin-top:4px!important;padding-top:4px!important;padding-bottom:4px!important}
}
/* 과학 앱 사진 모음(3장 이상): 낮은 가로 화면에서는 세 칸 카드로 */
@media (orientation:landscape) and (max-height:760px) and (min-width:1000px){
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3)){grid-template-columns:repeat(3,minmax(0,1fr))!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3))>.photo{grid-template-columns:1fr!important;align-items:start;margin:0!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3))>.photo img{height:auto;max-height:min(150px,21vh)!important;aspect-ratio:3/2!important}
}
/* 과학: 재료 고르기 탭(나무 막대·물 등)은 가운데 정렬 */
html body.ov section .tabs{justify-content:center}
/* 갤럭시탭 같은 세로 태블릿(가로 600~900px): 사진을 두 칸으로 놓아 한 화면에 담기 (2026-10-02) */
@media (min-width:600px) and (max-width:900px) and (orientation:portrait){
 html:has(#ovBar) body.ov .hj-pgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
 html:has(#ovBar) body.ov .hj-pgrid .photo img{max-height:min(320px,26vh)!important;aspect-ratio:4/3!important;object-fit:cover}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3)){grid-template-columns:repeat(2,minmax(0,1fr))!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3))>.photo{grid-template-columns:1fr!important;align-items:start;margin:0!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3))>.photo img{height:auto;max-height:min(180px,15vh)!important;aspect-ratio:3/2!important}
 html:has(#ovBar) body.ov section.cur figure.photo:not(.hj-pgrid *):not(.gallery *):not(.gal *) img{max-height:min(280px,22vh)!important;object-fit:cover;width:auto!important;max-width:100%;margin-left:auto;margin-right:auto;display:block}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(7)){grid-template-columns:repeat(3,minmax(0,1fr))!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(7))>.photo img{max-height:min(130px,11vh)!important}
 html:has(#ovBar) body.ov .lab>svg{max-height:24vh!important}
}
/* 크롬북처럼 낮은 가로 화면: 사진 많은 모음은 네 칸, 따로 놓인 사진은 낮게 (2026-10-02) */
@media (orientation:landscape) and (max-height:760px) and (min-width:1000px){

/* ===== 과목 색 (2026-10-02): 다음·주요 단추, 지금 단계, 고른 것, 활동 이름표, 학습 문제 상자 =====
   html[data-hjsubj]는 content.js가 주소(/korean/ /math/ /social/ /science/)를 보고 붙인다 */
html[data-hjsubj="korean"]{--hjs:#C9463B}

html[data-hjsubj="korean"]{--hjs-ink:#B23A30}html[data-hjsubj="math"]{--hjs-ink:#9A520C}html[data-hjsubj="social"]{--hjs-ink:#24609F}html[data-hjsubj="science"]{--hjs-ink:#1A6E52}
@media (prefers-color-scheme:dark){html[data-hjsubj]:not([data-theme="light"]){--hjs-soft:color-mix(in srgb,var(--hjs) 24%,var(--paper));--hjs-ink:color-mix(in srgb,var(--hjs) 50%,#fff)}}

html[data-hjsubj]:not(#hjz):not(#hjz) body #btnGo#btnGo,html[data-hjsubj]:not(#hjz):not(#hjz) body .hj-sc-go.hj-sc-go,html[data-hjsubj]:not(#hjz):not(#hjz) body #hjEnd#hjEnd,
html[data-hjsubj]:not(#hjz):not(#hjz) body #lesson .foot #next#next,html[data-hjsubj]:not(#hjz):not(#hjz) body #cover .big-btn.big-btn,html[data-hjsubj]:not(#hjz):not(#hjz) body .big-btn.big-btn:not(.ghost){background:var(--hjs)!important;color:#fff!important;border-color:transparent!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body :is(button.main,#ovNext,#hjEnd,.big-btn,[id^=btnNext],#next):disabled{background:color-mix(in srgb,var(--hjs) 35%,#fff)!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body nav a[style*="outline"]{outline:none!important;background:var(--hjs-soft)!important;color:var(--hjs-ink)!important;box-shadow:inset 0 0 0 2px var(--hjs)!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body .st.now.now{background:var(--hjs)!important;color:#fff!important;border-color:transparent!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body .seg button[aria-pressed="true"][aria-pressed="true"]{background:var(--hjs)!important;color:#fff!important;border-color:transparent!important}
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body button.on.on:not(.right):not(.wrong),html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body button.sel.sel:not(.right):not(.wrong){background:var(--hjs-soft)!important;border-color:var(--hjs)!important;color:var(--hjs-ink)!important}
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body .stage.stage.stage{background:var(--hjs-soft)!important;color:var(--hjs-ink)!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body :is(#cover .qbox,#cover .bq,#cover .goalbox,#hj-scover .hj-sc-goal){background:var(--hjs-soft)!important;border-left-color:transparent!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body main.lesson .big:not(:disabled){background:var(--hjs)!important;color:#fff!important;border-color:transparent!important}
/* 자료 출처 한 줄 */
html body .hj-src{font-size:13.5px!important;line-height:1.5;color:var(--muted);text-align:center;margin:10px auto 0;max-width:60em;word-break:keep-all}
/* 과학 한 화면 보기: 글의 위계 — 이름표·제목 한 줄, 활동 제목 크게, 안내 글 작게, 할 일 문장은 크게 */
html body.ov section .hj-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 12px;margin:0 0 6px}

html body.ov section .fitbox>h3{font-size:clamp(22px,1.9vw,28px)!important;font-weight:800!important;color:var(--ink)!important;margin:6px 0 4px!important}
html body.ov section .fitbox>p.hj-guide{font-size:clamp(16px,1.25vw,19px)!important;line-height:1.6;color:var(--soft)!important;max-width:52em;margin:2px auto 6px!important}
html body.ov section .fitbox>p.hj-guide b{color:var(--ink)}
html body.ov section .fitbox>p.hj-task{font-size:clamp(19px,1.6vw,24px)!important;font-weight:700!important;line-height:1.5;color:var(--ink)!important;text-align:left!important;
 background:var(--hjs-soft,#F3EEE6);border-left:6px solid var(--hjs,#8a7a66);border-radius:12px;padding:10px 16px!important;margin:6px 0 10px!important;text-wrap:pretty}
html body.ov section .fitbox>p.hj-task b{color:var(--hjs,var(--ink))}
/* 스스로 평가 표: 얼굴 칸은 좁게, 글 칸은 넓게 */
html body.ov section table td:has(> button){width:1%;white-space:nowrap}
/* 문제 보기(모든 교과): ①②③④ 번호, 보기가 모두 짧으면 가운데 정렬 / 문장이면 왼쪽 정렬 (content.js가 hj-short·hj-long을 붙임) */
@counter-style hjcirc{system:fixed;symbols:'①' '②' '③' '④' '⑤' '⑥' '⑦' '⑧' '⑨' '⑩';suffix:' '}
html body .hj-optg{counter-reset:hjo}
html body .hj-optg>button{counter-increment:hjo;display:flex!important;align-items:center;gap:.45em}
html body .hj-optg>button::before{content:counter(hjo,hjcirc);font-weight:800;color:var(--hjs,var(--ink));flex:none}
html body .hj-optg.hj-long>button{text-align:left!important;justify-content:flex-start!important;align-items:baseline!important;padding-left:18px!important;padding-right:16px!important}
html body .hj-optg.hj-short>button{text-align:center!important;justify-content:center!important}

/* 홍지희 버전: 활동 이름표 + 질문 제목 한 줄 */
html body #lesson .hj-head2{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 14px;margin:0 auto}
html body #lesson .hj-head2>.sthead{margin:0!important;flex:none}
html body #lesson .hj-head2>#hd{margin:0!important}
/* 홍지희 버전 첫 화면: 주제 프로젝트 지도 이름표, 오늘 표시 */
html body .hj-maplab{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:12px 0 6px;font-size:15px;color:var(--soft)}
html body .hj-maplab b{font-size:16.5px;color:var(--ink)}
html body .hj-maplab em{font-style:normal;font-weight:800;color:var(--hjs,var(--ink))}
html body #cMap .cur .hj-today{font-style:normal;display:inline-block;font-size:12.5px;font-weight:800;color:#fff;background:var(--hjs,#555);border-radius:999px;padding:1px 8px;margin-right:6px;vertical-align:1px}
/* 과학 앱 메뉴 자리 통일 (국어·사회와 같게) */
html.hj-scmenu body>nav .wrap{max-width:none!important;display:flex!important;align-items:center;gap:8px;flex-wrap:nowrap}
html.hj-scmenu body>nav .hj-sctools{margin-left:auto;display:flex;gap:6px;flex:none;padding-left:8px}
html.hj-scmenu body>nav .hj-sctools button{font-size:clamp(13.5px,1vw,15px)!important;min-height:34px!important;padding:5px 11px!important;border-radius:999px!important;background:var(--paper)!important;color:var(--ink)!important;border:1px solid var(--line)!important;white-space:nowrap}
html.hj-scmenu:has(#ovBar) #ovBar{position:fixed!important;left:0!important;right:0!important;bottom:0!important;width:auto!important;max-width:none!important;margin:0!important;transform:none!important;
 display:grid!important;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 22px 14px!important;background:linear-gradient(to top,var(--bg) 70%,transparent)!important;border:0!important;box-shadow:none!important;border-radius:0!important;pointer-events:none}
html.hj-scmenu #ovBar>*{pointer-events:auto}
html.hj-scmenu #ovBar #ovPos{grid-column:2;font-size:14px!important;color:var(--soft)}
html.hj-scmenu #ovBar .hj-pn{grid-column:3;justify-self:end;display:flex;gap:8px}
html.hj-scmenu #ovBar .hj-pn button{min-height:42px!important;font-size:clamp(15px,1.15vw,17px)!important;padding:8px 18px!important;border-radius:999px!important}
@media (max-width:820px){html.hj-scmenu body>nav .hj-sctools{position:fixed;left:10px;bottom:14px;z-index:30;padding:0;gap:4px}html.hj-scmenu body>nav .hj-sctools button{font-size:0!important;padding:8px 10px!important;min-height:40px!important}html.hj-scmenu body>nav .hj-sctools button .hj-i{width:18px;height:18px;margin:0}}
/* 번호 붙은 줄 내어쓰기 */
html body .hj-hang{display:flex!important;align-items:flex-start;gap:.35em}
html body .hj-hang>input{flex:none;margin-top:.15em}
html body .hj-hang>.hj-cn{flex:none;font-weight:700}
html body .hj-hang>.hj-ct{flex:1 1 auto;min-width:0}
html body .hj-hang .hj-paren{display:block;font-size:.92em;color:var(--soft)}
html body .hd>small.hj-sub2{display:block;margin-top:4px}
/* 사이트 '홈': 채운 집 모양 + 과목 색으로 눈에 띄게 (차시 처음 단추와 구분) */
html body .hj-nav a.hj-nh{background:#0F1C33!important;color:#fff!important;border-color:transparent!important}
html body .hj-nav a.hj-nh svg path{fill:currentColor;fill-opacity:.25}
/* 홍지희 버전: 위 메뉴줄과 본문 사이 여유 */
html body #lesson .topbar{margin-bottom:16px!important}
/* 홍지희 버전: 활동 내용이 아래로 처지지 않게 위쪽(질문 바로 아래)에 붙이고, 남는 공간은 아래로 */
html body #lesson .body{justify-content:flex-start!important}
html body #lesson .body>:first-child{margin-top:clamp(8px,3vh,36px)!important}
html body a.hj-homemini{display:inline-flex!important;align-items:center;gap:5px;text-decoration:none!important;background:#0F1C33!important;color:#fff!important;border:0!important;border-radius:999px;padding:5px 12px!important;min-height:34px;font:700 clamp(13.5px,1vw,15px)/1 Pretendard,sans-serif!important;white-space:nowrap}
html body a.hj-homemini .hj-i{width:16px;height:16px}
/* 보기에 긴 문장이 있으면 한 줄에 하나씩(가운데 폭에 맞춰) 보여 읽기 쉽게 */

/* 홍지희 버전 자료 카드: 제목 칸 · 가운데 사진 · 설명 · 출처 */
html body .mini .m.hj-v{flex-direction:column!important;align-items:stretch!important;gap:6px!important;padding:0 0 8px!important;overflow:hidden;text-align:center}
html body .mini .m.hj-v .hj-mh{background:color-mix(in srgb,var(--hjs,#888) 10%,var(--paper,#fff));border-bottom:2px solid color-mix(in srgb,var(--hjs,#888) 22%,var(--paper,#fff));padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
html body .mini .m.hj-v .hj-mh b{display:inline!important;font-size:clamp(15px,calc(var(--vw,1vw)*1.35),20px)!important}
html body .mini .m.hj-v .hj-mp{display:flex;justify-content:center;align-items:center;padding:2px 10px 0}
html body .mini .m.hj-v .hj-mp img{width:100%!important;height:clamp(84px,calc(var(--vh,1vh)*15),160px)!important;object-fit:cover;border-radius:10px}
html body .mini .m.hj-v .hj-mp .e{font-size:clamp(48px,calc(var(--vh,1vh)*9),84px)!important;width:auto!important;display:block!important;line-height:1.15}

html body :is(#lesson,#stage,#cover,main,body) .mini .m.hj-v small.hj-msrc{display:block;padding:0 10px;font-size:12.5px!important;line-height:1.3;color:var(--muted,var(--soft))}
html body .mini:has(.hj-v){grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))!important}
/* ===== 모든 교과 공통: 분류 카드(.card1)·분류 단추(.bins)·피드백(.fb) 너비와 색 통일 (2026-10-03) ===== */
html body .deck{width:min(1100px,94vw)!important;margin-left:auto;margin-right:auto;display:flex;flex-direction:column;align-items:stretch;gap:12px}
html body .deck>.card1,html body .deck>.bins,html body .deck>.fb{width:100%!important;max-width:none!important;box-sizing:border-box;margin-left:0!important;margin-right:0!important}
html body .card1,html body .bins{width:min(1100px,94vw)!important;max-width:100%!important;box-sizing:border-box}
html body .deck>.ask{margin:0;text-align:center}
/* 분류 단추: 원색을 톤 다운, 모서리·그림자 통일 */
html body .bin{background:color-mix(in srgb,var(--cc,#888) 72%,#6d655d)!important;color:#fff!important;border:0!important;border-radius:18px!important;box-shadow:0 4px 0 color-mix(in srgb,var(--cc,#888) 55%,#3d3631)!important}
/* 분류 단추 이름은 가로·세로 모두 가운데 (2026-10-09, bin 가운데) */
html body .bin{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important}
html body .self .seg button{justify-content:center!important;text-align:center}
html body .bin:hover:not(:disabled){filter:brightness(1.05)}
html body .bin:disabled{opacity:.55;box-shadow:none!important;transform:translateY(3px)}
html body .bin.lit{opacity:1!important;outline:4px solid color-mix(in srgb,var(--cc,#888) 40%,#fff);outline-offset:2px}
/* 국어 기억 카드 앞면도 같은 톤 */
html body .rc .front{background:color-mix(in srgb,var(--cc,#888) 72%,#6d655d)!important}
/* 피드백 띠: 카드와 같은 흰 바탕 + 왼쪽 색 줄 + 오른쪽 '다음' 단추 */
html body .fb.on{display:flex!important;align-items:center;gap:10px 14px;flex-wrap:wrap;background:var(--paper,#fff)!important;border:2px solid var(--line,#e8dccb)!important;border-left:8px solid var(--ok,#1F9E63)!important;border-radius:16px!important;padding:12px 16px 12px 18px!important;box-shadow:0 1px 2px rgba(80,55,30,.05),0 12px 26px -20px rgba(80,55,30,.35);font-size:clamp(17px,1.6vw,22px);line-height:1.5;text-align:left;color:var(--ink)}
html body .fb.on.no{border-left-color:var(--no,#D64C5A)!important}
html body .fb.on.open{border-left-color:#C9862A!important}
html body .fb.on b{color:var(--ok,#1F9E63)}html body .fb.on.no b{color:var(--no,#D64C5A)}html body .fb.on.open b{color:#B07020}
html body .fb.on #nx,html body .fb.on button{margin-left:auto!important;background:var(--hjs,#555)!important;color:#fff!important;border:0!important;border-radius:999px!important;padding:8px 20px!important;font-weight:800!important;font-size:clamp(16px,1.5vw,20px)!important;box-shadow:0 3px 0 color-mix(in srgb,var(--hjs,#555) 60%,#000)!important;white-space:nowrap}
/* ===== 수학: 머리줄을 밝게(오른쪽 위 글자가 보이게), 계단 이동 단추 한 줄 (2026-10-03) ===== */
html[data-hjsubj="math"] body header.top{background:var(--paper)!important;color:var(--ink)!important;border-bottom:2px solid var(--line)!important;box-shadow:none!important}
html[data-hjsubj="math"] body header.top .brand,html[data-hjsubj="math"] body header.top .who{color:var(--ink)!important}
html[data-hjsubj="math"] body header.top .chip{background:var(--paper)!important;color:var(--ink)!important;border:1.5px solid var(--line)!important;font-weight:700}
html[data-hjsubj="math"] body header.top .chip.btn:hover{background:var(--bg)!important}
html[data-hjsubj="math"] body header.top .hj-nav .hj-lbtn{color:var(--ink)!important;background:var(--paper)!important;border-color:var(--line)!important}
html body main .actions:has(.hj-nextst){display:flex!important;flex-wrap:wrap;align-items:center;gap:.6em}
html body main .actions:has(.hj-nextst)>*{order:5}
html body main .actions:has(.hj-nextst)>button.big:not(.hj-prevst):not(.hj-nextst){order:1}
html body main.lesson .actions:has(.hj-nextst)>button.big.hj-prevst,html body main .actions:has(.hj-nextst)>.hj-prevst{order:2;margin-left:auto!important;background:#fff!important;color:#3A2E25!important;border:2px solid var(--line,#e8dccb)!important;box-shadow:none!important}
html body main .actions:has(.hj-nextst)>.hj-nextst{order:3}
html body main .actions:has(.hj-nextst)>.hj-prevst::before{content:'← ';}
html body main .actions:has(.hj-nextst)>.hj-nextst::after{content:' →';}
/* 단계 표시 통일: 동그라미 번호 + 지금 단계만 이름 */
html body .screen:not(#cover) .topbar .st[data-hjst]:not(.now) .hj-stt{display:none}

html body .hj-sttabs>a[data-hjst]{min-width:30px;text-align:center}
html body .hj-sttabs>a[data-hjst].hj-cur{background:var(--hjs,#1F8060)!important;color:#fff!important;outline:0!important;border-color:transparent!important;font-weight:700}
/* 수업 진행 화면에서는 이메일·유튜브 줄을 숨김(첫 화면에만) — 과학 앱 한 화면 보기 */
html body.ov>.hj-contact,html body.ov>p.made,html body.ov>.made{display:none!important}

/* 2026-10-03 선생님 요청: 수업 앱(첫 화면·진행 화면)에는 이메일·유튜브 줄을 숨김. 메뉴 페이지(첫 화면~학기 목록)에는 그대로 보임(메뉴는 이 덮개를 쓰지 않음). 우리 반 교실(class)은 제외 */
html body:not(.mix) .hj-contact,html body:not(.mix) .hj-contact.hj-cvc{display:none!important}
html body .frameline{display:flex!important;flex-wrap:wrap;justify-content:center;align-items:baseline;column-gap:.3em;row-gap:.2em}html body .frameline input{max-width:100%;text-align:center}

/* ===== 메뉴와 한 제품으로 (2026-10-27, 디자이너 셋 토의 결론) =====
   크기·높이·테두리 굵기·간격은 바꾸지 않음(과학 한 화면 196개 앱의 쪽 나눔·--hj-navh 보호). 색·선·그림자만. 인쇄에는 적용하지 않음. */
:where(button,input,select,textarea){font-family:inherit}
@media screen{
 /* 과목 선: 화면 맨 위 3px(자리를 차지하지 않고 누르기도 통과, 겹창(9000대) 아래) */
 html[data-hjsubj]::before{content:"";position:fixed;left:0;right:0;top:0;height:3px;background:var(--hjs);z-index:60;pointer-events:none}
 /* 과학 위 막대: 흰 바탕 + 가는 중립 선(굵기 그대로) */
 html:has(#ovBar) body>nav{background:var(--paper)!important;border-bottom-color:var(--line)!important}
 /* 수학 앱 아래 흰 띠: 바탕을 메뉴 바탕으로 */
 html[data-hjsubj="math"]:has(header.top) body{background:var(--bg)!important}
 /* 단계 번호: 지금 단계만 과목 색, 나머지는 테두리·바탕 없이 번호만(굵기는 그대로라 크기 변화 없음) */
 html body .screen:not(#cover) .topbar .st:not(.now),html body .hj-sttabs>a[data-hjst]:not(.hj-cur){border-color:transparent!important;background:transparent!important;box-shadow:none!important;color:var(--soft)!important}
 html body .screen:not(#cover) .topbar .st:not(.now):hover,html body .hj-sttabs>a[data-hjst]:not(.hj-cur):hover{background:color-mix(in srgb,var(--ink) 6%,transparent)!important;color:var(--ink)!important}
 /* 주요 단추: 둥근 알약 + 부드러운 과목 색 그림자(크기 그대로) */
 html[data-hjsubj]:not(#hjz):not(#hjz):not(#hjz) body :is(main.lesson .big:not(:disabled),#cover .big-btn,#hj-scover .big-btn,#lesson .foot #next,#ovNext,[id^=btnNext],.hj-sc-go){
  box-shadow:0 8px 18px -10px color-mix(in srgb,var(--hjs) 75%,transparent)!important}
 /* 판: 메뉴와 같은 남색 계열의 가벼운 그림자 */
 html body #hj-scover .hj-cvpanel{box-shadow:0 1px 2px rgba(15,28,51,.05),0 2px 6px -2px rgba(15,28,51,.05)}
 html body .bq{box-shadow:0 1px 2px rgba(15,28,51,.05),0 14px 28px -22px rgba(15,28,51,.3)}
 html body .qbox{box-shadow:none}
 /* 수학 앱 첫 화면(.gate): 엔진에 박힌 크림색 그러데이션·갈색 테두리 → 메뉴 바탕·중립 선(굵기 그대로) */
 html body main.gate{background:transparent!important}
 html body .gate-card{border-color:var(--line)!important;box-shadow:0 1px 2px rgba(15,28,51,.05),0 16px 36px -28px rgba(15,28,51,.3)!important}
 /* 홈·자료 목록이 두 번 나오는 앱(왼쪽 이동 막대 + 오른쪽 엔진 도구 줄): 홈은 왼쪽 위 하나, 자료 목록은 오른쪽 펼침 하나 */
 html body :is(.topbar,.hj-navbar):has(.hj-nav) a.hj-homemini,html:has(.hj-navbar .hj-nav) body a.hj-homemini{display:none!important}
 html body .topbar:has([data-hjfirst]) .hj-nav .hj-nl{display:none!important}
}

/* ===== 수업 앱 안쪽 통일 규격 (2026-10-27, 구성 검토 반영): 선 1/1.5/2px, 둥글기 12·16·20·999, 그림자 둘, 흐름=과목색·활동=잉크 ===== */
@media screen{
html[data-hjsubj]{
 --hj-line-2:color-mix(in srgb,var(--ink) 24%,var(--line));
 --hj-sh-1:0 1px 2px rgba(15,28,51,.05);
 --hj-sh-2:0 1px 2px rgba(15,28,51,.05),0 12px 28px -22px rgba(15,28,51,.28);
 --hj-ok:#1F8A5B;--hj-no:#C8463B;--hj-warn:#B7791F;
 --hj-ok-soft:color-mix(in srgb,var(--hj-ok) 11%,var(--paper));
 --hj-no-soft:color-mix(in srgb,var(--hj-no) 9%,var(--paper));
 --hj-warn-soft:color-mix(in srgb,var(--hj-warn) 9%,var(--paper));
 --hj-act:#141A26;
}
@media (prefers-color-scheme:dark){html[data-hjsubj]:not([data-theme="light"]){--hj-act:#E8ECF3}}
html[data-hjsubj][data-theme="dark"]{--hj-act:#E8ECF3}
}

@media screen{
/* 분류 단추: 원색 덩어리 → 그 색 옅은 바탕 + 진한 글자. 테두리 대신 안쪽 선(크기 그대로) */
html[data-hjsubj]:not(:has(#ovBar)) body .bin{background:color-mix(in srgb,var(--cc,#888) 14%,var(--paper))!important;color:color-mix(in srgb,var(--cc,#888) 62%,var(--ink))!important;
 box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--cc,#888) 38%,var(--paper)),var(--hj-sh-1)!important;border-radius:20px!important}
html[data-hjsubj]:not(:has(#ovBar)) body .bin:hover:not(:disabled){background:color-mix(in srgb,var(--cc,#888) 22%,var(--paper))!important;filter:none!important}
html[data-hjsubj]:not(:has(#ovBar)) body .bin:active{transform:translateY(1px)!important}
html[data-hjsubj]:not(:has(#ovBar)) body .bin:disabled{transform:none!important;opacity:.45}
html[data-hjsubj]:not(:has(#ovBar)) body .bin.lit{outline:3px solid var(--cc,#888)!important;outline-offset:3px!important}
/* 기억 카드 앞면 같은 톤 */
html[data-hjsubj] body .rc .front{background:color-mix(in srgb,var(--cc,#888) 14%,var(--paper))!important;color:color-mix(in srgb,var(--cc,#888) 62%,var(--ink))!important;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--cc,#888) 35%,var(--paper))}
/* 피드백 띠 안 '다음': 단단한 그림자 → 퍼짐 */
html[data-hjsubj] body .fb.on :is(#nx,button){box-shadow:0 8px 18px -10px color-mix(in srgb,var(--hjs) 75%,transparent)!important}
/* 점수: 검정 큰 알약 → 과목색 옅은 알약 */
html[data-hjsubj] body .scores .chip{background:var(--paper)!important;color:var(--soft)!important;border:1px solid var(--line)!important;box-shadow:none!important}
html[data-hjsubj] body .scores .chip:is(.now,.win){background:var(--hjs-soft)!important;color:var(--hjs-ink)!important;border-color:transparent!important;font-weight:800}
}

@media screen{
html[data-hjsubj] body :is(.card1,.book,.pw,.oi,.mw,.mm,.way,.opt2,.choose button,.rec,.lkrow){border-width:1.5px!important;border-color:var(--line)!important;box-shadow:var(--hj-sh-1)!important}
html[data-hjsubj] body :is(.card1,.book,.prob){box-shadow:var(--hj-sh-2)!important}
html[data-hjsubj] body :is(.way,.opt2,.choose button):hover:not(:disabled){border-color:var(--hj-line-2)!important}
/* 상태(뜻 그대로) */
html[data-hjsubj] body :is(.way[aria-pressed="true"],.pw.lit){border-color:var(--hjs)!important;background:var(--hjs-soft)!important;box-shadow:inset 0 0 0 1px var(--hjs)!important}
html[data-hjsubj] body :is(.way,.opt2).right{border-color:var(--hj-ok)!important;background:var(--hj-ok-soft)!important}
html[data-hjsubj] body :is(.way.miss,.opt2.wrong){border-color:var(--hj-no)!important;background:var(--hj-no-soft)!important}
/* 말풍선 줄: 14px 무지개 띠 → 6px */
html[data-hjsubj] body .talk .q{border-left-width:6px!important}
/* 사진 카드 위 12px 띠 → 4px, 사진 테두리 1px */
html[data-hjsubj] body .ec{border-top-width:4px!important;box-shadow:var(--hj-sh-2)}
html[data-hjsubj] body :is(.ec img,.card1 img.cphoto){border-width:1px!important;border-color:var(--line)!important}
/* 이야기 상자(노랑 4px) → 흰 바탕 + 왼쪽 띠 */
html[data-hjsubj] body .expq{background:var(--paper)!important;color:var(--ink)!important;border:1px solid var(--line)!important;box-shadow:inset 5px 0 0 var(--hj-warn),var(--hj-sh-2)!important}
html[data-hjsubj] body .expq>b{color:var(--hj-warn)}
/* '이렇게 해 봐요'(보라 3px) → 보조 단추 */
html[data-hjsubj] body .howbtn{border:1.5px solid var(--line)!important;color:var(--ink)!important;background:var(--paper)!important;border-radius:999px!important;font-weight:700;box-shadow:var(--hj-sh-1)}
html[data-hjsubj] body .howbtn .hj-i{color:var(--soft)}
/* 문제 상자 5px → 1.5px */
html[data-hjsubj] body .prob{border-width:1.5px!important;border-color:color-mix(in srgb,var(--pc2,var(--hjs)) 40%,var(--paper))!important}
html[data-hjsubj] body .rc .back2{border-width:2px!important}
/* 예시 상자 점선 3px → 1.5px */
html[data-hjsubj] body :is(.exbox,.ex-model,.ex){border-width:1.5px!important}
html[data-hjsubj] body .bin2{border-width:2px!important}
/* 피드백 띠: 2px+8px → 1px+5px */
html[data-hjsubj] body .fb.on{border-width:1px!important;border-left-width:5px!important;box-shadow:var(--hj-sh-2)!important}
}

@media screen{
html[data-hjsubj] body #lesson :is(.pic,.task label,.evi button,.evbox,.opt,.dc,.mini .m){border-width:1.5px!important;border-color:var(--line)!important}
html[data-hjsubj] body #lesson :is(.pic,.mini .m){box-shadow:var(--hj-sh-1)}
/* 사고 칸: 위 10px 띠 → 4px, 제목은 칸색을 잉크 쪽으로 */
html[data-hjsubj] body #lesson .col{border:1px solid var(--line);border-top:4px solid var(--cc)!important;box-shadow:var(--hj-sh-1)}
html[data-hjsubj] body #lesson .col h3{color:color-mix(in srgb,var(--cc) 78%,var(--ink))!important}
/* 입력 + 붙이기: 회색 3px 칸 → 흰 1.5px, 붙이기는 연한 칸색 */
html[data-hjsubj] body #lesson :is(.add input,.claim textarea,.qpick select,.qadd select,.qadd input,.qi){background:var(--paper)!important;border:1.5px solid var(--line)!important;border-radius:12px!important}
html[data-hjsubj] body #lesson .add button{background:color-mix(in srgb,var(--cc) 13%,var(--paper))!important;color:color-mix(in srgb,var(--cc) 72%,var(--ink))!important;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--cc) 35%,var(--paper));border-radius:12px!important;font-weight:700}
/* 예시 단추: 원색 테두리 → 중립 */
html[data-hjsubj] body .hintbtn{border:1px solid var(--line)!important;color:var(--soft)!important;background:var(--paper)!important}
html[data-hjsubj] body .hintbtn[aria-expanded="true"]{background:color-mix(in srgb,var(--cc) 14%,var(--paper))!important;color:color-mix(in srgb,var(--cc) 72%,var(--ink))!important;border-color:transparent!important}
html[data-hjsubj] body .hintpop{border-width:1.5px!important;box-shadow:var(--hj-sh-2),0 18px 40px -20px rgba(15,28,51,.35)!important}
/* 함께 답할 질문(주황 4px) → 질문 상자 */
html[data-hjsubj] body #lesson .qpick{border:0!important;background:var(--hjs-soft)!important}
/* 안전 */
html[data-hjsubj] body #lesson .safe{background:var(--hj-no-soft)!important;color:var(--ink)!important;border:1px solid color-mix(in srgb,var(--hj-no) 25%,var(--paper))!important;box-shadow:inset 5px 0 0 var(--hj-no)}
/* 기록 표: 단계색 원색 머리 → 옅은 과목색 */
html[data-hjsubj] body #lesson table.rec :is(th,td){border-width:1px!important}
html[data-hjsubj] body #lesson table.rec thead th{background:var(--hjs-soft)!important;color:var(--hjs-ink)!important;font-weight:800}
html[data-hjsubj] body #lesson table.rec input{border-width:1.5px!important}
/* 상태 */
html[data-hjsubj] body #lesson :is(.dc[aria-pressed="true"],.evi button[aria-pressed="true"]){border-color:var(--hjs)!important;background:var(--hjs-soft)!important;color:var(--hjs-ink)!important}
html[data-hjsubj] body #lesson .opt.right{border-color:var(--hj-ok)!important;background:var(--hj-ok-soft)!important}
html[data-hjsubj] body #lesson .opt.wrong{border-color:var(--hj-no)!important;background:var(--hj-no-soft)!important}
html[data-hjsubj] body #lesson .task label.done{border-color:var(--hj-ok)!important}
/* 위 도구·아래 이전: 원색·진한 선 → 중립 */
html[data-hjsubj] body #lesson .topbar .tool.qb{border-color:var(--line)!important;color:var(--ink)!important}
html[data-hjsubj] body #lesson .topbar .tool .n{background:var(--hjs)!important;color:#fff!important}
html[data-hjsubj] body #lesson .foot #prev{border-color:var(--line)!important;color:var(--ink)!important;background:var(--paper)!important}
/* 첫 화면 지도: 위 띠 3px 유지, 판이 덜 붐비게 */
html[data-hjsubj] body #cMap .mcol{box-shadow:none}
}

@media screen{
html[data-hjsubj="math"]{--ring:var(--hjs);--ring-soft:var(--hjs-soft);--tent:var(--hjs)}
/* 로고: 흰 바늘이 흰 머리줄에서 사라짐 → 과목색 */
html[data-hjsubj="math"] body header.top .brand>svg circle:first-child{stroke:var(--hjs)!important}
html[data-hjsubj="math"] body header.top .brand>svg line{stroke:var(--hjs)!important}
html[data-hjsubj="math"] body header.top .brand>svg circle:last-child{fill:var(--hjs)!important}
/* 첫 화면 */
html[data-hjsubj="math"] body .gate-card{border-width:1px!important;border-radius:24px!important}
html[data-hjsubj="math"] body .gate-card h1{font-weight:800!important;letter-spacing:-.03em}
/* 엔진의 font-family:"Jua"(일반 글꼴 없음) — 글꼴을 못 받으면 명조로 보임(번호판·차시 카드 '1차시' 등) */
html[data-hjsubj="math"] body :is(.nums button,.site .n,.site .t,.stair .k,.seq .opt .no,.stepname,.q,.fb,.big,.optbox>summary,.pane h3,.ansbox .anh,.hlpop .exh){font-family:"Jua","Malgun Gothic","Apple SD Gothic Neo",sans-serif!important}
html[data-hjsubj="math"] body .nums button{border-width:1.5px!important;border-radius:12px!important;box-shadow:var(--hj-sh-1)}
html[data-hjsubj="math"] body .nums button:hover:not(.on){border-color:var(--hj-line-2)!important}
html[data-hjsubj="math"] body main.gate .big{background:var(--hjs)!important;box-shadow:0 8px 18px -10px color-mix(in srgb,var(--hjs) 75%,transparent)!important}
html[data-hjsubj="math"] body main.gate .big[disabled]{background:color-mix(in srgb,var(--hjs) 35%,#fff)!important;box-shadow:none!important}
html[data-hjsubj="math"] body :is(.big,.ghost)[disabled]:active{transform:none}
/* 계단: 회색 동그라미 대비 고침, 지금 계단 과목색 */
html[data-hjsubj="math"] body .stair{border-width:1px!important;box-shadow:none}
html[data-hjsubj="math"] body .stair:not(.cur):not(.ok):not(.chal):not(.passed) .k{background:var(--bg)!important;color:var(--soft)!important;box-shadow:inset 0 0 0 1px var(--line)}
html[data-hjsubj="math"] body .stair.cur{background:var(--hjs-soft)!important;border-color:var(--hjs)!important;box-shadow:none!important}
/* 판·질문·보기 */
html[data-hjsubj="math"] body :is(.work,.tbl-wrap){border-width:1px!important;box-shadow:var(--hj-sh-2)}
html[data-hjsubj="math"] body .stage svg{border-width:1px!important}
html[data-hjsubj="math"] body .q{background:var(--hjs-soft)!important;color:var(--ink)!important}
html[data-hjsubj="math"] body .opt{border-width:1.5px!important;border-radius:14px!important;box-shadow:var(--hj-sh-1)}
html[data-hjsubj="math"] body .opt:hover:not(.on):not(.good):not(.bad){border-color:var(--hj-line-2)!important}
html[data-hjsubj="math"] body .opt.good{border-color:var(--hj-ok)!important;background:var(--hj-ok-soft)!important}
html[data-hjsubj="math"] body .opt.bad{border-color:var(--hj-no)!important;background:var(--hj-no-soft)!important}
html[data-hjsubj="math"] body :is(.site,.wordbank .word,.tools button,.ghost){border-width:1.5px!important}
html[data-hjsubj="math"] body .story{border-left-width:5px!important}
html[data-hjsubj="math"] body .hintbox{border-left-width:5px!important}
html[data-hjsubj="math"] body :is(.copybox,.optbox){border-width:1.5px!important}
/* 사고 칸: 3px 칸색 테두리 → 1px + 위 4px 띠(안쪽 그림자), 제목 밑줄 1px */
html[data-hjsubj="math"] body .pane0{--hjpc:#2B7BD6}html[data-hjsubj="math"] body .pane1{--hjpc:#6A4FC9}
html[data-hjsubj="math"] body .pane2{--hjpc:#D9731A}html[data-hjsubj="math"] body .pane3{--hjpc:#2F6B57}
html[data-hjsubj="math"] body .pane{border:1px solid var(--line)!important;border-radius:16px!important;box-shadow:inset 0 4px 0 var(--hjpc,var(--hjs)),var(--hj-sh-1)!important}
html[data-hjsubj="math"] body .pane h3{border-bottom:1px solid var(--line)!important;color:color-mix(in srgb,var(--hjpc,var(--hjs)) 78%,var(--ink))!important}
html[data-hjsubj="math"] body :is(.pane .exb,.hlpb){border:1px solid var(--line)!important;color:var(--soft)!important;background:var(--paper)!important}
html[data-hjsubj="math"] body :is(.pane .exb,.hlpb)[aria-expanded="true"]{background:color-mix(in srgb,var(--hjpc,var(--hjs)) 14%,var(--paper))!important;color:color-mix(in srgb,var(--hjpc,var(--hjs)) 72%,var(--ink))!important;border-color:transparent!important}
html[data-hjsubj="math"] body :is(.pane .expop,.hlpop,.ansbox){border-width:1.5px!important}
html[data-hjsubj="math"] body :is(input[type=text],input[type=number],textarea,.prow input){border-width:1.5px!important;border-radius:12px!important}
}

@media screen{
/* 3px 회색 테두리 → 겉보기 1px: 테두리는 투명(자리 그대로), 안쪽 선은 outline */
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body.ov section :is(.lab,.scene,.card2,.links a){border-color:transparent!important;background-clip:padding-box;outline:1px solid var(--line);outline-offset:-3px}
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body.ov section .card2.open{outline:2px solid var(--hjs);background-color:var(--hjs-soft)!important}
/* 표 머리: 복숭아·하늘색 → 옅은 과목색, 칸 선 연하게(굵기 그대로) */
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body.ov section th{background:var(--hjs-soft)!important;color:var(--ink)!important}
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body.ov section :is(td,th){border-color:var(--line)!important}
/* 피드백: 색 바탕 → 같은 크기의 띠(안쪽 4px 그림자) */
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body.ov .fb.ok{background:var(--hj-ok-soft)!important;color:color-mix(in srgb,var(--hj-ok) 72%,var(--ink))!important;box-shadow:inset 4px 0 0 var(--hj-ok)}
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body.ov .fb.no{background:var(--hj-no-soft)!important;color:color-mix(in srgb,var(--hj-no) 72%,var(--ink))!important;box-shadow:inset 4px 0 0 var(--hj-no)}
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body.ov .fb.info{background:var(--hjs-soft)!important;color:var(--ink)!important;box-shadow:inset 4px 0 0 var(--hjs)}
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body.ov .warn{background:var(--hj-warn-soft)!important;color:var(--ink)!important;border-color:color-mix(in srgb,var(--hj-warn) 35%,var(--paper))!important}
/* 맞음·틀림 색(굵기는 content.css의 2px 그대로) */
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body.ov section button.right{background:var(--hj-ok-soft)!important;border-color:var(--hj-ok)!important;color:color-mix(in srgb,var(--hj-ok) 70%,var(--ink))!important}

/* 메뉴바 머리 이름표('악보 읽기 · 02')도 본문 맨 위 작은 글과 같아 숨김 — 막대에 방 이름, 본문에 영역·제목 */
html.hs-trailon .hs-trail>.hs-trh{display:none!important}
/* 쉬는 시간: 메뉴바에서 고른 묶음 하나만, 작은 칸으로 한 화면에(hs-brone, shell.js) */
html.hs-brone main .hs-broff{display:none!important}
html.hs-brone main :is(.mz-grid,.sd-grid){grid-template-columns:repeat(auto-fill,minmax(78px,1fr))!important;gap:6px!important}
html.hs-brone main :is(.mz-q,.sd-q){min-height:0!important;padding:8px 6px!important;text-align:center!important;display:flex!important;flex-direction:column;align-items:center;justify-content:center}
html.hs-brone main :is(.mz-q,.sd-q)>b{font-size:20px!important;line-height:1.1!important}
html.hs-brone main :is(.mz-q,.sd-q)>span{display:none!important}
html.hs-brone main .cl-list{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))!important;gap:8px!important}
html.hs-brone main .cl-d{padding:6px!important}
html.hs-brone main .cl-d small{display:none!important}
html.hs-brone main .cl-d b{font-size:13px!important}
/* 종이접기 작품 목록: 메뉴바가 있으면 작은 카드로 한 화면에(설명·준비물은 숨기고 이름·난이도만) */
html.hs-trailon main .og-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))!important;gap:10px!important}
html.hs-trailon main .og-card{padding:8px!important}
html.hs-trailon main .og-card .og-th{aspect-ratio:auto!important;height:120px!important;padding:6px!important}
html.hs-trailon main .og-card .og-th svg{max-height:100%!important;width:auto!important;margin:auto;display:block}
html.hs-trailon main .og-card .nm{font-size:17px!important;margin:6px 0 2px!important}
html.hs-trailon main .og-card .de,html.hs-trailon main .og-card .og-meta+.og-meta{display:none!important}
html.hs-trailon main .og-card .og-meta{font-size:12px!important;gap:4px!important}
/* 종이접기는 작품 카드가 한 화면에 다 보여 메뉴바의 작품 목록은 같은 것의 반복 — 숨기고 다른 학년만 */
.hs-br-origami .hs-brlist{display:none!important}
/* ===== 과학 '한 화면' 앱을 다른 교과와 같게(2026-10-30 선생님: 크기·배치·색 모두) =====
   위 막대 56px·제목 크기, 수업 길 1150px부터 펼침, 단계 머리를 흰 줄(왼쪽 과목색 띠 + 이름표 + 왼쪽 정렬 제목)로, 아래 이전/다음 단추를 다른 교과 크기로.
   쪽 나눔이 바뀌므로 옛 판과 data-part 경계를 견줘 활동이 갈라지지 않았는지 확인함 */
@media screen{
 html.hs-sci:not(#hsz):not(#hsz):not(#hsz) body>nav{min-height:56px!important;box-sizing:border-box}
 html.hs-sci:not(#hsz):not(#hsz):not(#hsz) body>nav .wrap{min-height:56px;align-items:center}
 html.hs-sci:not(#hsz):not(#hsz):not(#hsz) body>nav :is(.hj-nav>a,.hj-sctools>button,.hj-sctools>a){height:34px!important;min-height:34px!important;font:700 14px/1 'Pretendard',sans-serif!important;padding:0 12px!important;border-radius:999px!important}
 html.hs-sci .hs-stitle b{font-size:20px!important}
 html.hs-sci .hs-stitle small{font-size:13.5px!important}
 html.hs-sci .hs-srail{top:var(--hj-navh,56px)}
 /* 단계 머리: 초록 띠 → 흰 줄 */
 html.hs-sci:not(#hsz):not(#hsz):not(#hsz) body.ov section.cur .hj-head{background:var(--hs-paper)!important;box-shadow:inset 6px 0 0 var(--hs-a),0 1px 0 var(--hs-line)!important;color:var(--hs-ink)!important;justify-content:flex-start!important;text-align:left!important;padding:10px 16px 10px 22px!important;border-radius:0!important}
 html.hs-sci:not(#hsz):not(#hsz):not(#hsz) body.ov section.cur .hj-head h2{color:var(--hs-ink)!important;text-align:left!important}
 html.hs-sci:not(#hsz):not(#hsz):not(#hsz) body.ov section.cur .hj-head .stage{background:var(--hs-as)!important;color:var(--hs-ai)!important;border-color:transparent!important;font-family:'Pretendard',sans-serif!important;font-weight:800!important}
 /* 아래 막대 단추: 다른 교과처럼 크게, 다음은 넓게 */
 html.hs-sci:not(#hsz):not(#hsz):not(#hsz):not(#hsz) #ovBar :is(#ovNext,#ovPrev,#hjEnd){height:42px!important;min-height:42px!important;font:800 16px/1 'Pretendard',sans-serif!important;padding:0 18px!important;border-radius:12px!important}
 html.hs-sci:not(#hsz):not(#hsz):not(#hsz):not(#hsz) #ovBar #ovNext{min-width:140px}
}

const C={"id": "u4-l34", "title": "🎁 높임 표현을 바르게 사용하는 방법 알기", "sub": "3학년 2학기 국어 4단원 · 서로 존중하며 대화해요 · 3~4차시", "goal": "높임 표현을 바르게 사용하는 방법을 알아봅시다.", "note0": ["수업 준비 · 3~4차시", "<h3>학습 목표<\/h3><p>높임 표현을 바르게 사용하는 방법을 안다. <span class=\"src\">「국어」 184~187쪽<\/span><\/p><h3>이 차시의 목적 <span class=\"src\">지도서 256쪽<\/span><\/h3><ul><li>높임을 표현하는 다양한 방법을 이해합니다. 주체·객체·상대 높임법의 <b>문법 체계나 문법 용어를 가르치지 않고<\/b>, 실생활 사례에서 높임 표현의 대상을 찾고 바르게 썼는지 판단해 보게 합니다.<\/li><li>주목할 말: ‘-시-’, ‘-습니다’, ‘요’, ‘께’, ‘께서’, 높임의 뜻이 있는 낱말. 학생들이 실생활에서 헷갈릴 만한 사례를 중심으로 지도합니다.<\/li><\/ul><h3>두 차시로 나눌 때<\/h3><p>점선 단추(③ 높임 표현 바르게 고치기)가 둘째 시간 시작입니다. 지도서에 나누는 지점이 따로 있지는 않습니다.<\/p><h3>과정 중심 평가 1 <span class=\"src\">지도서 259, 292~293쪽<\/span><\/h3><p>이 차시는 소단원 1 과정 중심 평가와 연계합니다. ④단계에 평가 예시와 같은 형식(대화에서 잘못된 높임 표현을 찾아 고쳐 쓰기)을 넣었습니다. 지도서는 제시 글을 교사가 재구성해도 된다고 하여, 화면의 대화는 새로 지었습니다. 지도서 293쪽 평가 대화를 나누어 주셔도 됩니다.<\/p><h3>성취 기준<\/h3><p><b>[4국04-04]<\/b> 글과 담화에 쓰인 높임 표현과 지시·접속 표현을 이해하고 상황에 맞게 표현한다.<\/p><h3>단원 지도 유의 사항 <span class=\"src\">지도서 249쪽<\/span><\/h3><ul><li>대화 상황, 말하는 이, 듣는 이, 그들의 관계 등을 고려해 높임 표현을 사용하는 상황을 이해하고 다양한 높임 표현 방법을 파악하게 합니다.<\/li><li>높임 표현을 사용해야 하는 까닭을 알고 바르게 사용해 대화하면서 높임 표현 사용의 <b>가치와 필요성을 내면화<\/b>하게 합니다.<\/li><\/ul><h3>교과서 작품·듣기 자료<\/h3><p>교과서 글(「아드님, 진지 드세요」 등)과 듣기 자료(「효진이와 소영이의 부탁」, 「주현이와 지환이의 대화」, 「태수의 대화」), 동영상은 저작권이 있어 화면에 싣지 않았습니다. 교과서와 디지털 교과서 자료를 함께 써 주세요. 화면의 답은 교과서·지도서 예시 답안이고, 새로 지은 연습 글에는 그렇다고 적어 두었습니다.<\/p>"], "stages": [{"name": "동기 유발", "min": 8, "steps": [{"t": "listen", "hd": "📓 일기를 듣고, 어색하게 느껴지는 문장을 찾아봐요. <small>(새로 지은 연습 글)<\/small>", "who": {"📓": {"c": "#6A4FC9"}}, "lines": [["📓", "오늘은 할머니가 우리 집에 왔다."], ["📓", "나는 할머니에게 사과를 깎아 줬다."], ["📓", "할머니가 사과를 맛있게 먹었다."], ["📓", "할머니가 기뻐하는 모습을 보니 나도 기뻤다."]]}, {"t": "talk", "hd": "어떤 문장이 어색하게 느껴지나요?", "qs": [{"q": "어색한 문장을 찾아 말해 봐요."}, {"q": "왜 어색하게 느껴졌나요?", "s": "아직 고치지 않아도 괜찮아요. 느낌과 까닭을 말해 봐요."}]}], "note": ["① 동기 유발 (8분)", "<h3>진행 <span class=\"src\">지도서 256쪽<\/span><\/h3><ul><li>일기에서 높임 표현을 적절하게 쓰지 못한 문장을 찾아봅니다.<\/li><li>아직 높임을 나타내는 방법을 정확하게 배우기 전이므로 < const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
let SOUND=true,actx=null;
function beep(kind){
  if(!SOUND)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const map={ok:[[660,'triangle'],[880,'triangle']],no:[[300,'square'],[220,'square']],tick:[[520,'sine']],win:[[523,'triangle'],[659,'triangle'],[784,'triangle'],[1047,'triangle']]};
    (map[kind]||map.tick).forEach(([f,t],i)=>{const o=actx.createOscillator(),g=actx.createGain(),s=actx.currentTime+i*.13;
      o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.16,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.22);
      o.connect(g).connect(actx.destination);o.start(s);o.stop(s+.24);});
  }catch(e){}
