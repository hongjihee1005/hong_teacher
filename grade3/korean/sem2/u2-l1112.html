<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🎤 배운 내용 실천하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>:root{
  --bg:#F6EFE6; --paper:#FFFFFF; --ink:#2A2236; --soft:#5E5670; --line:#E2D6C6;
  --ok:#1F9E63; --no:#D2453A; --acc:#D64C5A; --tn:#6A4FC9; --warm:#FFF4D6; --warmline:#E8961E;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1D1A28;--paper:#2B2640;--ink:#F4F1FA;--soft:#C3BBD6;--line:#453E60;--tn:#A792F0;--warm:#3A3222;--warmline:#C98A2A}
}
:root[data-theme="dark"]{--bg:#1D1A28;--paper:#2B2640;--ink:#F4F1FA;--soft:#C3BBD6;--line:#453E60;--tn:#A792F0;--warm:#3A3222;--warmline:#C98A2A}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:26px;overflow:hidden}
button,input,textarea{font-family:var(--display);color:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:5px solid var(--acc);outline-offset:3px}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:clamp(12px,1.8vw,26px)}
.screen.on{display:flex}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0}
.title{font-size:clamp(40px,min(6.2vw,10.5vh),92px);line-height:1.12;text-align:center}
.lead{font-size:clamp(22px,2.3vw,32px);color:var(--soft);margin:0;text-align:center}
.center-col{align-items:center;overflow-y:auto}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.row-label{font-family:var(--display);font-size:clamp(22px,2.1vw,30px)}
.seg{display:flex;flex-wrap:wrap;border:3px solid var(--line);border-radius:18px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;font-size:clamp(20px,1.9vw,28px);padding:9px 16px;min-width:64px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.big-btn{font-size:clamp(28px,2.9vw,44px);padding:12px 44px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);box-shadow:0 6px 0 rgba(0,0,0,.25)}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.big-btn[disabled]{opacity:.35}
.mid-btn{font-size:clamp(22px,2.1vw,30px);padding:10px 28px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);box-shadow:0 5px 0 rgba(0,0,0,.22)}
.ghost-btn{font-size:clamp(20px,1.9vw,28px);padding:9px 24px;border-radius:999px;border:3px solid var(--ink);background:transparent}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tool{font-size:22px;border:3px solid var(--line);background:var(--paper);border-radius:14px;padding:6px 12px}
.chip{font-family:var(--display);font-size:clamp(20px,1.9vw,28px);padding:4px 16px;border-radius:999px;background:var(--paper);border:3px solid var(--line)}
.chip.now{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip.win{border-color:#E8961E;background:#E8961E;color:#fff}
.scores{display:flex;gap:8px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(20,14,30,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay.on{display:flex}
.panel{background:var(--paper);border-radius:26px;padding:clamp(20px,2.8vw,44px);width:min(1100px,94vw);max-height:92vh;overflow-y:auto;text-align:center;border-top:18px solid var(--pc,var(--ink))}
.panel h2{font-size:clamp(38px,4.6vw,66px);margin:0 0 10px}
.panel .why{font-size:clamp(25px,2.5vw,36px);line-height:1.55;margin:0 auto 20px;max-width:36em}
.stagebar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.st{font-family:var(--display);cursor:pointer;font-size:clamp(17px,1.65vw,24px);padding:5px 12px;border-radius:999px;border:3px solid var(--line);background:var(--paper);color:var(--soft)}
.st.now{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.st.done{border-color:var(--ok);color:var(--ok)}
.st.brk{border-style:dashed}
#bar .st:not(.now) .nm{display:none}
#bar .st{padding:5px 10px}
.goal{font-family:var(--display);font-size:clamp(18px,1.75vw,26px);color:var(--soft);text-align:center;margin:3px 0 0}
.body p{margin:0}
.ttsmsg:empty{display:none}
.bodywrap{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;padding:4px 2px}
.body{transform-origin:top center;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.4vh,18px);margin:auto 0;width:100%}
.hd{font-family:var(--display);font-size:clamp(28px,3.1vw,46px);text-align:center;line-height:1.3;max-width:34em}
.stepno{font-family:var(--display);font-size:clamp(16px,1.5vw,21px);color:var(--soft)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:6px;flex-wrap:wrap}
.tnote{border:3px solid var(--tn);color:var(--tn);background:var(--paper);border-radius:16px;padding:7px 16px;font-size:clamp(18px,1.7vw,24px)}
.qbox{background:var(--warm);border:5px solid var(--warmline);border-radius:24px;padding:clamp(14px,2vw,26px);width:min(1100px,94vw);text-align:center;font-family:var(--display);font-size:clamp(26px,2.9vw,42px);line-height:1.4}
.card1{width:min(1100px,94vw);background:var(--paper);border-radius:24px;border:4px solid var(--line);padding:clamp(14px,2vw,28px);display:flex;gap:clamp(14px,2.6vw,32px);align-items:center;justify-content:center}
.card1 .e{font-size:clamp(54px,6.4vw,100px);line-height:1;flex:none}
.card1 .x{font-family:var(--display);font-size:clamp(26px,3vw,44px);line-height:1.38}
/* flip cards */
.recall{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:14px;width:min(1200px,96vw)}
.recall.q4{width:min(720px,90vw)}
.recall.q4 .rc{min-height:0;aspect-ratio:2.1/1}
.rc{position:relative;min-height:clamp(160px,22vh,240px);border:0;background:none;perspective:1200px;font-family:var(--body);padding:0}
.rc .in{position:absolute;inset:0;transition:transform .5s;transform-style:preserve-3d}
.rc.open .in{transform:rotateY(180deg)}
.rc .f{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.rc .front{background:var(--cc);color:#fff;font-family:var(--display);font-size:clamp(23px,2.4vw,34px)}
.rc .front span{font-size:clamp(42px,4.4vw,64px)}
.rc .back2{background:var(--paper);border:5px solid var(--cc);transform:rotateY(180deg);font-size:clamp(20px,2vw,28px);line-height:1.45;color:var(--ink)}
/* talk */
.talk{width:min(1150px,95vw);display:grid;gap:10px}
.talk .q{background:var(--paper);border-radius:18px;border-left:14px solid var(--cc,var(--acc));padding:12px 20px;font-size:clamp(23px,2.4vw,34px);line-height:1.45;text-align:left}
.talk .q small{display:block;color:var(--soft);font-size:.7em;margin-top:4px}
.exs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:min(1150px,95vw)}
.hd .pgref{display:block;font-size:.66em;font-weight:500;color:var(--soft);margin-top:6px;letter-spacing:0}
.ex{background:var(--paper);border:3px dashed var(--line);border-radius:999px;padding:6px 18px;font-size:clamp(19px,1.9vw,26px)}
.timer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.timer .t{font-family:var(--display);font-size:clamp(30px,3vw,44px);min-width:3.2em;text-align:center}
/* book */
.book{width:min(1150px,95vw);background:var(--paper);border-radius:24px;border:4px solid var(--line);padding:clamp(14px,2vw,26px);display:grid;grid-template-columns:auto 1fr;gap:clamp(12px,2vw,26px);align-items:center}
.book .e{font-size:clamp(60px,7vw,110px);line-height:1}
.book .pg{font-family:var(--display);font-size:clamp(28px,3vw,44px);color:var(--acc)}
.book ol,.book ul{margin:6px 0 0;padding-left:1.2em;font-size:clamp(22px,2.2vw,31px);line-height:1.5;text-align:left}
.pickways{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:12px;width:min(1150px,95vw)}
.pw{border:4px solid var(--line);background:var(--paper);border-radius:20px;padding:12px;font-size:clamp(20px,2vw,28px);display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--body)}
.pw span{font-size:clamp(34px,3.4vw,50px)}
.pw.lit{border-color:var(--acc);box-shadow:inset 0 0 0 4px var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--paper))}
/* multiple choice */
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(1100px,95vw)}
.opt2{border:4px solid var(--line);background:var(--paper);border-radius:18px;padding:12px 18px;font-family:var(--body);font-size:clamp(22px,2.3vw,32px);line-height:1.4;text-align:left}
.opt2.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--paper))}
.opt2.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 14%,var(--paper))}
/* sort */
.bins{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:clamp(8px,1.4vw,18px);width:min(1200px,96vw)}
.bin{position:relative;border:0;background:var(--cc);color:#fff;border-radius:36px 36px 18px 18px;padding:clamp(10px,1.8vh,20px) 8px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 7px 0 rgba(0,0,0,.22)}
.bin .e{font-size:clamp(34px,4vw,60px);line-height:1}
.bin .n{font-size:clamp(21px,2.3vw,34px);text-align:center;line-height:1.25}
.bin:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.22)}
.bin.lit{outline:6px solid var(--ink);outline-offset:4px}
.bin[disabled]{opacity:.75}
/* order */
.olist{width:min(1100px,95vw);display:grid;gap:10px}
.oi{display:flex;align-items:center;gap:12px;border:4px solid var(--line);background:var(--paper);border-radius:18px;padding:8px 14px;font-family:var(--body);font-size:clamp(20px,2vw,28px);line-height:1.35;text-align:left}
@media (min-width:1000px){.olist.two{grid-template-columns:1fr 1fr}.lsn.two{grid-auto-flow:column;grid-template-columns:1fr 1fr;grid-template-rows:repeat(var(--r),auto)}.talk.two{grid-template-columns:1fr 1fr}.mgrid.wide{grid-template-columns:1fr 1fr}}
.oi .no{flex:none;width:1.9em;height:1.9em;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--line);color:var(--ink);font-family:var(--display)}
.oi.got .no{background:var(--acc);color:#fff}
.oi.got{border-color:var(--acc)}
.oi.right{border-color:var(--ok)}.oi.right .no{background:var(--ok)}
.oi.miss{border-color:var(--no)}.oi.miss .no{background:var(--no)}
/* match */
.mgrid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr);gap:10px 18px;width:min(1150px,96vw);align-items:stretch}
.mgrid>.mw,.mgrid>.mm{min-height:100%;display:flex;align-items:center}
.mgrid>.mw{justify-content:center}
.mcol{display:grid;gap:10px;align-content:start}
.mw,.mm{border:4px solid var(--line);background:var(--paper);border-radius:18px;padding:10px 16px;font-size:clamp(21px,2.2vw,31px);line-height:1.35;text-align:left}
.mw{font-family:var(--display);text-align:center;font-size:clamp(26px,2.8vw,40px)}
.mm{font-family:var(--body)}
.mw.sel{border-color:var(--acc);box-shadow:inset 0 0 0 4px var(--acc)}
.mw.done,.mm.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper));opacity:.8}
.mm.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* fill blanks */
.fillbox{width:min(1100px,95vw);display:grid;gap:12px}
.fl{background:var(--paper);border-radius:18px;padding:12px 18px;font-size:clamp(22px,2.3vw,32px);line-height:1.9;text-align:left;border-left:12px solid var(--cc,var(--acc))}
.fl input{font-family:var(--display);font-size:1em;width:calc(var(--w,4) * 1.15em + 1em);border:0;border-bottom:4px solid var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--paper));border-radius:8px 8px 0 0;padding:0 6px;text-align:center;color:var(--ink)}
.fl input::placeholder{color:color-mix(in srgb,var(--soft) 55%,transparent)}
.fl input.ok{border-bottom-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--paper))}
.fl input.bad{border-bottom-color:var(--no)}
/* listen */
.lsn{width:min(1100px,95vw);display:grid;gap:8px}
.ln{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border-radius:14px;padding:6px 14px;border:3px solid var(--line);text-align:left;font-size:clamp(20px,2vw,28px);line-height:1.45}
.ln b{font-family:var(--display);font-weight:400;flex:none;color:var(--cc,var(--acc));min-width:4.2em}
.ln.now{border-color:var(--acc);box-shadow:inset 0 0 0 3px var(--acc)}
.lsn.hide .ln span{filter:blur(9px);user-select:none}
/* write */
.wr{width:min(1150px,96vw);display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.wf.full{grid-column:1/-1}
.wf{background:var(--paper);border-radius:18px;padding:10px 16px;border:3px solid var(--line);text-align:left}
.wf label{display:block;font-family:var(--display);font-size:clamp(21px,2.1vw,30px);margin-bottom:4px}
.wf label small{color:var(--soft);font-family:var(--body);font-size:.75em}
.wf textarea,.wf input{width:100%;font-family:var(--body);font-size:clamp(22px,2.3vw,32px);line-height:1.6;border:3px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--bg);color:var(--ink);resize:vertical}
.wbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.wbar .tool{font-family:var(--display)}
.wcount{font-family:var(--display);font-size:clamp(18px,1.7vw,24px);color:var(--soft)}
.wcheck{width:min(1150px,96vw);background:var(--paper);border-radius:18px;border:4px solid var(--ok);padding:12px 18px;text-align:left;display:none}
.wcheck.on{display:block}
.wcheck h3{font-size:clamp(22px,2.2vw,30px);margin-bottom:6px}
.wcheck li{font-size:clamp(19px,1.9vw,27px);line-height:1.5;margin-bottom:6px}
.auto-ok{color:var(--ok)}.auto-no{color:var(--no)}
.self{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-top:2px dashed var(--line);padding:8px 0}
.self>span:first-child{font-size:clamp(19px,1.9vw,27px);flex:1 1 12em}
.self>.seg{flex:none}
.recgrid .self>span:first-child{font-size:clamp(17px,1.6vw,23px)}
.recgrid .wcheck{padding:8px 14px}
.recgrid .wcheck h3{font-size:clamp(19px,1.8vw,25px)}
.sclegend{display:flex;flex-wrap:nowrap;gap:.2em .9em;white-space:nowrap;font-size:clamp(13.5px,1.2vw,17px);color:var(--soft);margin:0 0 6px}
.self .seg button{font-size:clamp(16px,1.5vw,21px);padding:6px 10px;min-width:0}
.ex-model{width:min(1150px,96vw);background:var(--warm);color:var(--ink);border:3px dashed var(--warmline);border-radius:16px;padding:10px 16px;font-size:clamp(19px,1.9vw,26px);text-align:left;display:none}
.ex-model.on{display:block}
/* record */
.recgrid{width:min(1200px,96vw);display:grid;gap:12px;align-items:start}
.recgrid>*{width:auto!important;min-width:0}
@media (min-width:1000px){.recgrid{grid-template-columns:1.35fr 1fr}.recgrid.bm{grid-template-columns:1fr 1.25fr}}
.recgrid .book{grid-template-columns:1fr}.recgrid .book .e{display:none}.recgrid .book ol{font-size:clamp(19px,1.9vw,26px)}
.rec{width:min(1150px,96vw);background:var(--paper);border:4px solid var(--line);border-radius:22px;padding:clamp(12px,1.8vw,24px);text-align:left;font-size:clamp(22px,2.3vw,34px);line-height:1.7;font-family:var(--body)}
.rec .p1,.rec .p2{color:var(--acc);font-family:var(--display);font-size:.8em;padding:0 .12em}
.rec .p2{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;vertical-align:middle;line-height:.55;margin:0 .1em}
.rec .p2 i{font-style:normal;display:block}
.rec.nomark .p1,.rec.nomark .p2{display:none}
.rec .src{display:block;font-size:14px;color:var(--soft);text-align:right}
.recbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.recbar .tool{font-family:var(--display)}
.recbar .on{background:var(--no);color:#fff;border-color:var(--no)}
.recmsg{font-family:var(--display);font-size:clamp(17px,1.6vw,22px);color:var(--soft);text-align:center;min-height:1.3em}
.recmsg.err{color:var(--no)}
/* summary */
.sum{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:14px;width:min(1150px,95vw)}
.sumbox{background:var(--paper);border-radius:22px;border-top:14px solid var(--cc);padding:14px 20px;text-align:left}
.sumbox b{font-family:var(--display);font-weight:400;font-size:clamp(23px,2.4vw,34px);display:block;margin-bottom:6px}
.sumbox li{font-size:clamp(20px,2vw,28px);line-height:1.5;margin-bottom:4px}
.promise{width:min(1100px,94vw);display:grid;gap:10px}
.promise div{background:var(--paper);border-radius:16px;padding:12px 20px;font-size:clamp(22px,2.2vw,31px);border-left:14px solid var(--ok);text-align:left}
/* bingo */
.bgcall{width:min(1100px,95vw);background:var(--paper);border:6px solid var(--acc);border-radius:26px;padding:clamp(16px,2.4vw,32px);text-align:center;font-family:var(--display);font-size:clamp(28px,3.4vw,50px);line-height:1.35;min-height:4em;display:flex;align-items:center;justify-content:center}
.bglog{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(1150px,96vw)}
.bglog span{background:var(--paper);border:3px solid var(--line);border-radius:12px;padding:4px 12px;font-size:clamp(16px,1.5vw,21px)}
/* teacher panel */
.tpanel{text-align:left}
.tpanel h3{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.1vw,30px);margin:14px 0 6px;color:var(--tn)}
.tpanel li,.tpanel p{font-size:clamp(19px,1.8vw,25px);line-height:1.55}
.tpanel .src{display:inline-block;font-size:.8em;color:var(--soft);background:var(--bg);border-radius:8px;padding:0 8px}
.lklist{display:grid;gap:12px;text-align:left;margin-bottom:18px}
.lkrow{display:flex;gap:14px;align-items:center;background:var(--bg);border-radius:16px;padding:12px 18px;text-decoration:none;color:inherit;border:3px solid var(--line)}
.lkrow .e{font-size:clamp(28px,2.8vw,40px)}
.lkrow b{font-family:var(--display);font-weight:400;font-size:clamp(21px,2.1vw,29px);display:block}
.lkrow small{color:var(--soft);font-size:clamp(16px,1.6vw,21px)}
.ttsbar{display:flex;gap:6px;align-items:center}
.ttsmsg{font-size:16px;color:var(--no);text-align:center}
@media (max-width:860px){.recall,.bins,.pickways{grid-template-columns:1fr 1fr}.opts2,.sum{grid-template-columns:1fr}.mgrid{grid-template-columns:minmax(0,.75fr) minmax(0,1.5fr)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
body,h1,h2,h3,p,li,span,div,button,a,label,small,b{word-break:keep-all;overflow-wrap:break-word;line-break:strict}
h1,h2,h3,.title,.hd,.x,.n,.lead{text-wrap:balance}
p,li,small,.why,.opt2,.oi,.mm,.q{text-wrap:pretty}
.creditbar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;margin-top:10px}
.tolist{display:none;align-items:center;gap:8px;font-family:var(--display);font-size:clamp(19px,1.9vw,25px);text-decoration:none;color:inherit;border:3px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 20px}
.tolist.on{display:inline-flex}
.hjfoot{display:block;width:100%;flex-basis:100%;margin:24px 0 0;padding:14px 0 4px;border-top:3px solid var(--line);text-align:center;color:var(--soft);font-family:var(--body);font-size:17px;line-height:1.7}
.hjfoot p{margin:2px 0}

@media (prefers-color-scheme:light){html:root:not([data-theme="dark"]){--bg:#FFFCF8;--paper:#FFFFFF;--ink:#2A221C;--soft:#5C5047;--muted:#5C5047;--line:#EFE3D6;--warmline:#EFE3D6}}
html:root[data-theme="light"]{--bg:#FFFCF8;--paper:#FFFFFF;--ink:#2A221C;--soft:#5C5047;--muted:#5C5047;--line:#EFE3D6;--warmline:#EFE3D6}
@media (prefers-color-scheme:dark){html:root:not([data-theme="light"]){--bg:#221E1A;--paper:#2B2621;--ink:#F2EBE3;--soft:#C9BCB0;--muted:#C9BCB0;--line:#43392F}}
html:root[data-theme="dark"]{--bg:#221E1A;--paper:#2B2621;--ink:#F2EBE3;--soft:#C9BCB0;--muted:#C9BCB0;--line:#43392F}
html body{-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
html h1,html h2,html h3{letter-spacing:-.025em}
html:root{--night:#4A3A2E;--night2:#8A6A52;--pine:#5C9A7C;--pine-soft:#E6F3EC}
/* ── 수업 세트 공통 틀(첫 화면·진행 화면) 다듬기: 얇은 선, 부드러운 그림자, 정돈된 글자 크기 ── */
html body .title{font-size:clamp(34px,min(4.8vw,8.5vh),66px);font-weight:800;letter-spacing:-.035em;line-height:1.2}
html body .lead{font-size:clamp(17px,1.6vw,22px);font-weight:600;color:var(--soft);letter-spacing:-.01em}
html body .qbox{background:#FFF5E6;border:0;border-left:8px solid #F2B872;border-radius:20px;font-size:clamp(20px,2.1vw,30px)!important;font-weight:700;line-height:1.55;
 box-shadow:0 1px 2px rgba(80,55,30,.05),0 16px 32px -22px rgba(80,55,30,.4)}
@media (prefers-color-scheme:dark){html:root:not([data-theme="light"]) body .qbox{background:#3A3024;border-left-color:#C98A2A}}
html:root[data-theme="dark"] body .qbox{background:#3A3024;border-left-color:#C98A2A}
html body .stagebar{gap:8px}
html body .st{border-width:1.5px;font-size:clamp(15px,1.35vw,19px);font-weight:600;padding:6px 14px;background:var(--paper)}
html body .st.now{font-weight:700}
html body .seg{border:1.5px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(80,55,30,.05)}
html body .seg button{font-size:clamp(17px,1.55vw,22px);font-weight:600;padding:9px 16px}
html body .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
html body .row-label{font-size:clamp(17px,1.6vw,22px);font-weight:700;color:var(--soft)}
html body .big-btn{font-size:clamp(22px,2.3vw,32px);font-weight:800;letter-spacing:-.01em;padding:14px 48px;
 box-shadow:0 2px 4px rgba(40,25,10,.12),0 14px 26px -12px rgba(40,25,10,.5)}
html body .big-btn:active{transform:translateY(2px);box-shadow:0 1px 2px rgba(40,25,10,.2)}
html body .mid-btn{font-size:clamp(18px,1.7vw,24px);font-weight:700;padding:11px 28px;box-shadow:0 2px 4px rgba(40,25,10,.12),0 10px 20px -12px rgba(40,25,10,.45)}
html body .mid-btn:active{transform:translateY(2px);box-shadow:none}
html body .ghost-btn{border:1.5px solid var(--line);background:var(--paper);font-size:clamp(17px,1.6vw,22px);font-weight:700;padding:10px 24px}
html body .tnote{border-width:1.5px;border-radius:999px;font-size:clamp(16px,1.5vw,20px);font-weight:700;padding:9px 18px}
html body .tool{border-width:1.5px;border-radius:12px;font-size:19px;padding:7px 12px}
html body .chip{border-width:1.5px;font-weight:600}
html body .tolist{border-width:1.5px;font-size:clamp(16px,1.5vw,19px);font-weight:700;padding:9px 18px}
html body .goal{font-size:clamp(16px,1.5vw,21px);font-weight:600}
html body .hd{font-weight:800;letter-spacing:-.03em;font-size:clamp(26px,2.8vw,42px);line-height:1.35}
html body .overlay{background:rgba(42,34,28,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
html body .panel{border:0;border-radius:24px;box-shadow:0 30px 60px -24px rgba(40,25,10,.5)}
html body .panel h2{font-size:clamp(30px,3.6vw,50px);font-weight:800;letter-spacing:-.03em}
html body .panel .why{font-size:clamp(20px,2.1vw,30px)}
html body :is(.card1,.book,.rec,.pw,.opt2,.oi,.mw,.mm,.wf,.ln,.lkrow,.bglog span){border-width:2px}
html body :is(.card1,.book,.rec,.sumbox,.talk .q,.fl,.promise div){box-shadow:0 1px 2px rgba(80,55,30,.05),0 12px 26px -20px rgba(80,55,30,.35)}
html body .wf :is(textarea,input){border-width:1.5px}
html body .ex{border-width:1.5px}
html body .card1 .x,html body .mw,html body .book .pg,html body .sumbox b{font-weight:700}
html body .hjfoot{border-top-width:1.5px}
html body:has(.screen.on:not(#cover)) #hj-home{display:none}
/* 선생님 버전(S.O.O.P.) 틀 */
html body .bq{border-width:2px;border-radius:20px;box-shadow:0 1px 2px rgba(80,55,30,.05),0 14px 28px -22px rgba(80,55,30,.4)}
html body .goalbox{border-width:0;border-left:8px solid #F2B872;background:#FFF5E6;border-radius:16px;font-weight:700}
@media (prefers-color-scheme:dark){html:root:not([data-theme="light"]) body .goalbox{background:#3A3024;border-left-color:#C98A2A}}
html:root[data-theme="dark"] body .goalbox{background:#3A3024;border-left-color:#C98A2A}
html body .ghost{border-width:1.5px;font-weight:700}
html body .plan>*,html body .steps>*{border-width:1.5px}
html body .badge{font-weight:800}
html body .ask{font-weight:600}
/* 선 아이콘 */
html body .hj-i{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-.2em}
html body .hj-ic{display:inline-flex;align-items:center;justify-content:center;gap:.4em}
html body .hj-ionly{gap:0}
html body .tool.hj-hometool{border-radius:999px;padding:6px 15px 6px 12px;font-weight:700;font-size:17px;gap:6px}
/* 수업 세트 첫 화면 정리 */
html body .hj-cv{gap:clamp(12px,2vh,22px)!important}
html body .hj-cvtop{width:min(1100px,94vw);display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;min-height:0}
html body .hj-cvtop .tolist{margin:0}
html body .hj-cvpanel{width:min(1100px,94vw);background:var(--paper);border:1.5px solid var(--line);border-radius:24px;padding:clamp(16px,2vw,26px) clamp(18px,2.4vw,30px);
 display:grid;gap:clamp(12px,1.6vh,18px);box-shadow:0 1px 2px rgba(80,55,30,.05),0 18px 40px -28px rgba(80,55,30,.45);text-align:left}
html body .hj-cvpanel>.qbox,html body .hj-cvpanel>.goalbox,html body .hj-cvpanel>.bq,html body .hj-cvpanel>.map{width:auto!important;margin:0!important;box-shadow:none}
html body .hj-cvpanel>.qbox{text-align:left}
html body .hj-field{display:grid!important;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:8px 14px;justify-content:stretch!important;margin:0;
 padding-top:clamp(10px,1.4vh,16px);border-top:1.5px dashed var(--line)}
html body .hj-field>.stagebar,html body .hj-field>.plan{justify-content:flex-start!important;margin:0}
html body .hj-flabel{font-size:clamp(15px,1.35vw,18px)!important;font-weight:800;color:var(--soft);white-space:nowrap}
html body .hj-field.row>:nth-child(n+3){grid-column:2;font-size:clamp(14px,1.25vw,17px);color:var(--soft)}
html body .hj-field .seg{justify-self:start}
html body .hj-cvacts{gap:14px}
@media (max-width:720px){html body .hj-field{grid-template-columns:1fr}html body .hj-field.row>:nth-child(n+3){grid-column:1}}
html body .hj-field>*:not(.hj-flabel){justify-self:start;text-align:left;margin-left:0}
html body .hj-field>div>.seg{margin:0}
html body .hj-cvtop,html body .hj-cvpanel,html body .hj-cvacts{flex:none}
html body #cover{justify-content:safe center}
html body .hj-field #segTeam{justify-content:flex-start!important;align-items:flex-start!important;flex-direction:column;gap:6px!important}
html body .hj-field #segTeam-sub .row-label,html body .hj-field #segTeam~*{font-size:clamp(14px,1.25vw,17px)!important;font-weight:500;color:var(--soft)}
html body .hj-field .seg{justify-content:flex-start;width:auto}

/* 교사 안내 창 도구(인쇄·구글 문서·이메일) */
html body .hj-tbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px 0 4px;padding-top:18px;border-top:1px solid var(--line)}
html body .hj-tbar>button,html body .hj-mail button{display:inline-flex;align-items:center;gap:7px;font:700 16px/1.2 'Gowun Dodum',sans-serif;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;cursor:pointer}
html body .hj-tbar>button:hover,html body .hj-mail button:hover{background:var(--bg);border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
html body .hj-tbar .hj-i{width:18px;height:18px;flex:none}
html body .hj-mail{flex-basis:100%;display:grid;gap:8px;max-width:560px;margin:6px auto 0;text-align:left;background:var(--bg);border-radius:16px;padding:14px 16px}
html body .hj-mail[hidden]{display:none}
html body .hj-mail label{font-weight:700;font-size:16px}html body .hj-mail label small{font-weight:500;color:var(--soft);font-size:14px;margin-left:6px}
html body .hj-mail input{font:500 17px/1.4 'Gowun Dodum',sans-serif;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
html body .hj-mail div{display:flex;flex-wrap:wrap;gap:8px}html body .hj-mail p{margin:0;font-size:14px!important;color:var(--soft)}
html body .hj-toast{flex-basis:100%;margin:2px 0 0;min-height:1.3em;text-align:center;font-size:15px!important;color:var(--soft)}
@media print{
 body.hj-tprint>*:not(#tn){display:none!important}
 body.hj-tprint #tn{position:static!important;display:block!important;background:none!important;padding:0!important;inset:auto!important}
 body.hj-tprint #tn .panel{width:auto!important;max-height:none!important;overflow:visible!important;box-shadow:none!important;border:0!important;border-radius:0!important;padding:0!important;transform:none!important;animation:none!important}
 body.hj-tprint .hj-tbar,body.hj-tprint #tnClose{display:none!important}
 body.hj-tprint{background:#fff!important;color:#000}
 body.hj-tprint #tn .panel{padding:16mm!important}
}
/* 수업을 마쳤을 때 고르는 창 */
#hj-done{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:rgba(42,34,28,.38);backdrop-filter:blur(3px);animation:hjfade .2s ease}
@keyframes hjfade{from{opacity:0}to{opacity:1}}
#hj-done .hj-dp{width:min(560px,100%);background:var(--paper,#fff);color:var(--ink,#2A221C);border-radius:24px;padding:30px 28px 24px;text-align:center;box-shadow:0 30px 60px -24px rgba(40,25,10,.5);font-family:'Gowun Dodum',sans-serif;word-break:keep-all}
#hj-done .hj-dok{display:inline-grid;place-items:center;width:60px;height:60px;border-radius:18px;background:color-mix(in srgb,#7FB89A 22%,var(--paper,#fff));color:#3F7A5C}
#hj-done .hj-dok svg{width:32px;height:32px}
#hj-done h2{font-family:'Jua',sans-serif;font-size:clamp(26px,3vw,32px);margin:12px 0 4px;letter-spacing:-.03em}
#hj-done .hj-dl{margin:0 0 20px;color:var(--soft,#5C5047);font-size:17px}
#hj-done .hj-dn{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;text-align:left;text-decoration:none;color:#fff;background:var(--ink,#2A221C);border-radius:18px;padding:16px 20px}
#hj-done .hj-dn small{grid-column:1;font-size:14px;opacity:.75;font-weight:600}
#hj-done .hj-dn b{grid-column:1;font-size:clamp(18px,2vw,21px);line-height:1.4}
#hj-done .hj-dn svg{grid-column:2;grid-row:1/3;width:26px;height:26px}
#hj-done .hj-dn:hover{filter:brightness(1.15)}
#hj-done .hj-dlast{margin:0;padding:14px;border-radius:16px;background:var(--bg,#FFFCF8);color:var(--soft,#5C5047);font-size:17px}
#hj-done .hj-drow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
#hj-done .hj-db{flex:1 1 200px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 17px/1.2 'Gowun Dodum',sans-serif;color:var(--ink,#2A221C);background:var(--paper,#fff);border:1.5px solid var(--line,#EFE3D6);border-radius:999px;padding:12px 16px;text-decoration:none;cursor:pointer}
#hj-done .hj-db:hover{background:var(--bg,#FFFCF8)}
#hj-done .hj-db svg{width:20px;height:20px}
#hj-done :focus-visible{outline:3px solid #E0A458;outline-offset:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #hj-done .hj-dn{background:#F2EBE3;color:#221E1A}}
:root[data-theme="dark"] #hj-done .hj-dn{background:#F2EBE3;color:#221E1A}
html body .hj-pl{display:none}
@media print{body.hj-tprint .hj-pl{display:block;text-align:center;font-size:14px!important;color:#555;margin:0 0 4px}}
/* 사진 출처 줄이 화면 밖으로 넘치지 않게 */
html body #phc{white-space:normal!important;overflow-wrap:anywhere;max-width:min(1100px,100%);text-align:center;line-height:1.6;opacity:.85}
/* 홍지희 선생님 버전(SOOP) 첫 화면: 차분하고 읽기 쉽게 */
html body #cBadge{background:color-mix(in srgb,var(--sc) 14%,var(--paper));color:color-mix(in srgb,var(--sc) 78%,var(--ink));font-weight:700;font-size:clamp(15px,1.3vw,18px);padding:5px 14px;letter-spacing:-.01em}
html body #cover:has(#cBadge) .title{font-size:clamp(30px,min(4vw,7vh),52px);line-height:1.25}
html body #cBq{border:0;border-left:5px solid color-mix(in srgb,var(--sc) 55%,var(--paper));background:color-mix(in srgb,var(--sc) 6%,var(--paper));border-radius:16px;padding:14px 22px;text-align:left;box-shadow:none}
html body #cBq>*:first-child:not(b){font-size:15px!important;font-weight:700;color:var(--soft)}
html body #cBq b{display:block;font-weight:700;font-size:clamp(20px,2vw,27px);line-height:1.4;margin-top:2px}
html body #cGoal{border:0;border-left:5px solid #E8B36A;background:#FFF6E8;color:var(--ink);border-radius:16px;padding:12px 22px;font-weight:700;font-size:clamp(18px,1.7vw,23px);text-align:left;box-shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #cGoal{background:#3A3024}}
:root[data-theme="dark"] #cGoal{background:#3A3024}
html body #cMap{gap:10px}
html body #cMap .mcol{border:1px solid var(--line);border-top:3px solid color-mix(in srgb,var(--mc) 60%,var(--paper));border-radius:14px;padding:12px 12px 10px;box-shadow:none}
html body #cMap .mcol h3{font-size:clamp(15px,1.3vw,17px);font-weight:800;color:color-mix(in srgb,var(--mc) 80%,var(--ink));margin:0 0 4px}
html body #cMap .mcol a,html body #cMap .mcol .cur{font-size:clamp(14px,1.2vw,16px);line-height:1.45;padding:5px 8px;border-radius:8px}
html body #cMap .mcol a{color:var(--soft)}html body #cMap .mcol a:hover{background:var(--bg);color:var(--ink)}
html body #cMap .mcol .cur{background:color-mix(in srgb,var(--mc) 13%,var(--paper));color:color-mix(in srgb,var(--mc) 70%,var(--ink))!important;font-weight:700}
/* 듣기 재생 막대 */
#hj-player{position:fixed;left:50%;bottom:clamp(84px,11vh,110px);transform:translateX(-50%);z-index:9000;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;
 max-width:calc(100vw - 24px);background:var(--paper,#fff);color:var(--ink,#2A221C);border:1px solid var(--line,#EFE3D6);border-radius:999px;padding:6px 6px 6px 16px;
 box-shadow:0 14px 34px -14px rgba(40,25,10,.4);font-family:'Gowun Dodum',sans-serif;word-break:keep-all}
#hj-player[hidden]{display:none}
#hj-player .hj-pl-l{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--soft,#5C5047);margin-right:4px}
#hj-player .hj-pl-l b{font-weight:700}
#hj-player .hj-i{width:18px;height:18px;flex:none}
#hj-player button{display:inline-flex;align-items:center;gap:6px;font:700 16px/1.2 'Gowun Dodum',sans-serif;color:var(--ink,#2A221C);background:var(--bg,#FFFCF8);border:1px solid var(--line,#EFE3D6);border-radius:999px;padding:9px 14px;cursor:pointer;min-height:42px}
#hj-player button:hover:not(:disabled){border-color:color-mix(in srgb,var(--ink,#2A221C) 30%,var(--line,#EFE3D6))}
#hj-player button:disabled{opacity:.4;cursor:default}
#hj-player [data-k=pp]{background:var(--ink,#2A221C);color:var(--paper,#fff);border-color:transparent}
#hj-player .hj-pl-x{padding:9px;background:none;border-color:transparent}
#hj-player[data-st=play] .hj-pl-l .hj-i{animation:hjpulse 1.2s ease-in-out infinite}
@keyframes hjpulse{50%{opacity:.35}}
@media print{#hj-player{display:none!important}}
/* 첫 화면 단추 배치: 교사용 도구는 위 오른편, 수업 시작은 가운데 홀로 */

}

<script>
const C={"id": "u2-l1112", "title": "🎤 배운 내용 실천하기", "sub": "3학년 2학기 국어 2단원 · 유창하게 읽고 발표해요 · 11~12차시", "goal": "배운 내용을 실천해 봅시다.", "note0": ["수업 준비 · 11~12차시 (실천)", "<h3>학습 목표<\/h3><p>배운 내용을 실천할 수 있다. <span class=\"src\">『국어』 100~102쪽<\/span><\/p><h3>이 차시의 성격 <span class=\"src\">지도서 158쪽<\/span><\/h3><ul><li>배운 내용을 생활 속에서 실천하는 학습으로, 글을 유창하게 읽거나 글과 그림을 활용해 발표하는 것이 목적입니다.<\/li><li>교과서 활동 외에 학급에서 다른 활동을 재구성할 수 있습니다. 이때 성취기준(“글의 의미를 파악하며 유창하게 글을 읽는다.”, “목적과 주제에 알맞게 자료를 정리하여 자신감 있게 발표한다.”, “매체를 활용하여 간단한 발표 자료를 만든다.”)과 관련 있는 활동인지 확인합니다.<\/li><\/ul><h3>화면 구성<\/h3><p>지도서 수업 흐름(활동하기 두 가지 → 활동 정하기 → 정리하기)을 따랐고, ④는 지도서 160쪽 ‘우리 반에서 정한 활동’ 예시 1을 활용한 <b>선택 단계<\/b>입니다. 필요한 단계만 골라 써도 됩니다.<\/p><h3>성취 기준<\/h3><p><b>[4국02-01]<\/b> 글의 의미를 파악하며 유창하게 글을 읽는다.<\/p><p><b>[4국01-05]<\/b> 목적과 주제에 알맞게 자료를 정리하여 자신감 있게 발표한다.<\/p><p><b>[4국06-02]<\/b> 매체를 활용하여 간단한 발표 자료를 만든다.<\/p><h3>🎙️ 녹음하고 다시 듣기<\/h3><p>지도서가 권하는 ‘녹음하고 다시 듣기’(지도서 134쪽)를 화면에서 바로 할 수 있게 했습니다. 녹음은 그 기기의 브라우저 안에만 잠깐 있고, 화면을 넘기면 지워집니다(어디로도 보내지 않음). 처음 누르면 마이크 허용을 묻습니다. 활동 전에 기기의 마이크가 작동하는지 점검해 주세요(지도서 135쪽 활동의 유의점). 스마트 기기는 학습 활동 용도로만 쓰도록 안내합니다.<\/p>"], "stages": [{"name": "짧은 이야기 소개하기", "min": 20, "steps": [{"t": "write", "id": "story", "hd": "📚 글과 그림을 활용해 소개하고 싶은 짧은 이야기를 정리해 봐요.", "fields": [{"l": "① 소개하고 싶은 짧은 이야기 제목", "one": true, "need": true, "ph": "예: 「전우치전」"}, {"l": "소개하고 싶은 까닭", "rows": 2, "need": true}, {"l": "② 활용할 그림 (중요한 장면이나 감동적인 장면)", "rows": 2, "need": true}, {"l": "어떤 차례로 글과 그림을 보여 줄까요?", "rows": 2}], "punct": false, "check": ["감명 깊거나 인상 깊은 이야기를 골랐나요?", "이야기의 중요한 장면이나 감동적인 장면을 그림으로 골랐나요?", "글과 그림을 보여 줄 차례를 정했나요?"]}, {"t": "record", "id": "storyrec", "hd": "🎙️ ③ 소개하기 전에 유창하게 말하는 연습을 해요.", "page": "내가 정리한 소개 글", "do": ["정리한 내용을 보며 소개하는 말을 소리 내어 해 봐요.", "녹음해 듣고 고칠 점을 찾아 다시 해 봐요."], "check": ["알맞은 부분에서 적절히 띄어 말했나요?", "정확한 발음으로 또박또박 말했나요?", "자신감 있는 목소리로 말했나요?"]}, {"t": "talk", "hd": "③ 글과 그림을 활용해 친구들에게 짧은 이야기를 소개해 봐요.", "qs": ["친구의 소개를 듣고 그 이야기에 대해 새롭게 안 점은 무엇인가요?", "친구가 고른 그림은 이야기의 어떤 장면을 잘 보여 주었나요?"]}], "note": ["① 활동하기: 글과 그림을 활용해 짧은 이야기 소개하기 (20분)", "<h3>진행 <span class=\"src\">지도서 158쪽<\/span><\/h3><ol><li>소개하고 싶은 짧은 이야기 정하기: 감명 깊게 읽었거나 인상 깊은 짧은 이야기, 소개하고 싶은 까닭을 생각합니다.<\/li><li>활용할 그림 선택하기: 감동적인 장면, 이야기 흐름에서 중요한 장면을 나타낼 그림을 생각합니다.<\/li><li>친구들에게 소개하기: 글과 그림을 활용해 유창하게 발표하고, 다른 친구들의 발표를 듣고 새롭게 안 점을 이야기합니다.<\/li><\/ol><p>녹음 화면의 세 번째 점검 항목(자신감 있는 목소리)은 성취기준 [4국01-05] ‘자신감 있게 발표한다’에서 가져왔습니다.<\/p>"]}, {"name": "관심 있는 직업 발표하기", "min": 20, "steps": [{"t": "write", "id": "job", "hd": "👩‍🚒 관심 있는 직업을 소개하는 발표 자료를 준비해 봐요.", "fields": [{"l": "① 관심 있는 직업", "one": true, "need": true, "ph": "예: 가수"}, {"l": "그 직업에 관심이 생긴 까닭 (나의 흥미, 적성)", "rows": 2}, {"l": "② 글로 자세히 쓸 내용 (그 직업이 하는 일)", "rows": 3, "need": true}, {"l": "그림으로 나타낼 것", "rows": 2, "need": true, "ph": "예: 노래할 때의 모습을 마이크와 음표로"}], "punct": false, "model": "가수가 하는 일을 글로 자세히 써 볼 거야. 노래할 때의 모습을 마이크와 음표로 나타낼 거야. <small>(『국어』 101쪽)<\/small>", "check": ["관심 있는 직업을 정했나요?", "그 직업이 하는 일을 글로 정리했나요?", "글과 그림으로 나눌 내용을 정했나요?"]}, {"t": "talk", "hd": "③ 글과 그림을 활용해 친구들 앞에서 발표해 봐요.", "qs": ["친구의 발표를 듣고 친구에 대해 새롭게 안 점은 무엇인가요?", "친구의 발표에서 잘한 점을 칭찬해 봐요."]}], "note": ["② 활동하기: 관심 있는 직업 발표하기 (20분)", "<h3>진행 <span class=\"src\">지도서 159쪽<\/span><\/h3><ol><li>관심 있는 직업 생각하기: 관련 있는 책을 읽어 보고, 자신의 적성과 흥미, 자신에게 맞는 직업을 생각합니다.<\/li><li>발표 자료 만들기: 글과 그림을 활용합니다. 컴퓨터 등 다양한 매체를 활용할 수 있음을 안내합니다.<\/li><li>발표하기: 친구들 앞에서 소개하고, 다른 친구의 발표를 듣고 친구에 대해 새롭게 안 점을 이야기합니다.<\/li><\/ol><p style=\"text-align:center\"><b>— 1차시는 여기까지입니다(지도서에 따로 없음, 제안) —<\/b><\/p>"]}, {"name": "활동 정하기", "min": 8, "brk": true, "steps": [{"t": "cards", "hd": "우리 반은 어떤 활동을 더 해 볼까요?", "cards": [{"e": "🧸", "c": "#6A4FC9", "t": "물건을 유창하게 설명하기", "d": "소개하고 싶은 물건을 설명하는 글을 쓰고, 유창하게 읽는 연습을 한 뒤 친구들 앞에서 읽어요. (지도서 예시 1)"}, {"e": "⚽", "c": "#1F9E63", "t": "올림픽 종목 표현하기", "d": "운동을 설명하는 글에서 글로 표현할 부분과 그림으로 표현할 부분을 찾아 자료를 만들어요. (지도서 예시 2)"}, {"e": "✏️", "c": "#E8961E", "t": "우리 반이 새로 만든 활동", "d": "이 단원에서 배운 ‘유창하게 읽기’나 ‘글과 그림으로 발표하기’를 쓰는 활동이면 좋아요."}], "q": "이 단원에서 공부한 내용을 떠올리고 우리 반 활동을 정해 봐요."}], "note": ["③ 활동 정하기 (8분)", "<h3>진행 <span class=\"src\">지도서 159쪽<\/span><\/h3><ul><li>실천 학습의 주제를 정하기 전에 이 단원에서 공부한 내용을 떠올립니다.<\/li><li>『국어』 100~101쪽 ‘이런 활동 어때요’를 참고해 우리 반에서 할 활동을 구성합니다(『국어』 102쪽 ‘우리가 활동을 정해요’).<\/li><li>카드의 두 예시는 지도서 160~161쪽 ‘우리 반에서 정한 활동’입니다. 다음 단계는 예시 1로 만들었습니다.<\/li><\/ul>"]}, {"name": "우리 반 활동", "min": 25, "steps": [{"t": "write", "id": "thing", "hd": "🧸 소개하고 싶은 물건을 설명하는 글을 써 봐요.", "fields": [{"l": "소개하고 싶은 물건", "one": true, "need": true}, {"l": "소개하고 싶은 까닭", "rows": 2, "need": true}, {"l": "물건을 설명하는 글", "rows": 5, "need": true}], "min": 60, "model": "소개하고 싶은 물건: 호랑이 모양의 지우개 · 까닭: 제 생일 선물로 받은 물건이기 때문입니다. · 설명하는 글: 제가 소개하고 싶은 물건은 호랑이 모양의 지우개입니다. … <small>(지도서 160쪽 글쓰기 활동지 예시)<\/small>", "check": ["소개하고 싶은 물건과 까닭을 썼나요?", "물건을 설명하는 글을 썼나요?", "내 글을 들어 보고 어색한 곳을 고쳤나요?"]}, {"t": "record", "id": "thingrec", "hd": "🎙️ 쓴 글을 유창하게 읽는 연습을 해요.", "page": "앞 화면에서 쓴 설명하는 글", "do": ["쓴 글을 소리 내어 읽고 녹음해요.", "녹음을 들으며 띄어 읽기와 발음을 점검해요.", "친구들 앞에서 읽어요."], "check": ["‘누가/무엇이’ 다음에 조금 띄어 읽을 수 있나요?", "문장과 문장 사이는 조금 더 길게 띄어 읽을 수 있나요?", "정확한 발음과 적절한 속도로 읽을 수 있나요?"]}], "note": ["④ 우리 반에서 정한 활동: 물건을 유창하게 설명하기 (25분)", "<h3>진행 <span class=\"src\">지도서 160쪽 · 예시 1<\/span><\/h3><ol><li>소개하고 싶은 물건을 설명하는 글 쓰기(소개하고 싶은 물건, 까닭, 설명하는 글)<\/li><li>설명하는 글을 유창하게 읽는 연습하기<\/li><li>친구들 앞에서 읽기<\/li><\/ol><p>녹음 화면의 스스로 점검은 2차시 『국어』 73쪽 점검표를 다시 썼습니다.<\/p><h3>예시 2 <span class=\"src\">지도서 161쪽<\/span><\/h3><p>「공을 가지고 하는 운동 – 축구」에서 글로 표현할 부분과 그림으로 표현할 부분을 찾아 설명 자료 만들기.<\/p>"]}, {"name": "정리", "min": 7, "steps": [{"t": "sum", "hd": "2단원에서 배운 내용을 실천했어요", "boxes": [{"t": "📖 유창하게 읽기", "c": "#2F74E0", "items": ["알맞게 띄어 읽고 정확한 발음과 속도로 읽어요.", "장면의 분위기를 살려 실감 나게 읽어요."]}, {"t": "🖼️ 글과 그림으로 발표하기", "c": "#E8961E", "items": ["얼개를 짜서 글과 그림을 계획해요.", "색, 크기, 모양으로 중요한 내용을 강조해요."]}]}, {"t": "final", "hd": "🎤 오늘의 정리", "lines": ["생활 속에서 글을 찾아 유창하게 읽어 봐요.", "글과 그림을 활용하면 자신감 있게 발표할 수 있어요.", "친구의 발표에 긍정적인 반응을 해 줘요.", "다음 시간에는 단원을 마무리해요."]}], "note": ["⑤ 정리 (7분)", "<h3>진행 <span class=\"src\">지도서 159쪽<\/span><\/h3><ul><li>학습 결과를 공유하고 친구들끼리 긍정적인 반응을 주고받게 합니다.<\/li><li>생활 속에서 글을 찾아 유창하게 읽기를 실천하고, 글과 그림을 활용해 자신감 있게 발표하는 태도를 기르게 합니다.<\/li><\/ul>"]}]};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
let SOUND=true,actx=null;
function beep(kind){
  if(!SOUND)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const map={ok:[[660,'triangle'],[880,'triangle']],no:[[300,'square'],[220,'square']],tick:[[520,'sine']],win:[[523,'triangle'],[659,'triangle'],[784,'triangle'],[1047,'triangle']]};
    (map[kind]||map.tick).forEach(([f,t],i)=>{const o=actx.createOscillator(),g=actx.createGain(),s=actx.currentTime+i*.13;
      o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.16,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.22);
      o.connect(g).connect(actx.destination);o.start(s);o.stop(s+.24);});
  }catch(e){}
}
/* ---------- 읽어 주기 (브라우저 음성) ---------- */
const TTS={rate:1,rates:[[0.8,'🐢 느리게'],[1,'🐢 보통'],[1.15,'🐇 빠르게']],ri:1,voice:null,ok:'speechSynthesis' in window};
function pickVoice(){if(!TTS.ok)return;const v=speechSynthesis.getVoices();TTS.voice=v.find(x=>/^ko/i.test(x.lang))||null;}
if(TTS.ok){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function stopSpeak(){if(TTS.ok)speechSynthesis.cancel();}
function speak(parts,onEach,onEnd){
