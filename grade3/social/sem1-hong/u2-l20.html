<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🎞️ 여러 가지 자료로 지역 사람들의 옛 생활 모습을 살펴볼까요</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#EAF1F8;--paper:#FFFFFF;--ink:#1F2A44;--soft:#4F5B75;--line:#CAD6E4;
  --ok:#1F9E63;--no:#D2453A;--acc:#2F74E0;--note:#FFF4C2;--note-ink:#3B3200;
  --S:#E0506B;--O1:#2F74E0;--O2:#6A4FC9;--P:#1F9E63;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#162034;--paper:#22304C;--ink:#F2F5FB;--soft:#B7C3DB;--line:#3A4C74;--note:#4A4420;--note-ink:#FFF6CC}}
:root[data-theme="dark"]{--bg:#162034;--paper:#22304C;--ink:#F2F5FB;--soft:#B7C3DB;--line:#3A4C74;--note:#4A4420;--note-ink:#FFF6CC}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:clamp(19px,calc(var(--vw,1vw)*1.9),24px);line-height:1.45;overflow:hidden}
body,h1,h2,h3,p,li,span,div,button,a,small,b,label{word-break:keep-all;overflow-wrap:break-word;line-break:strict}
h1,h2,h3,.hd,.ttl{text-wrap:balance} p,li,small{text-wrap:pretty}
button{font-family:var(--display);color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:4px solid var(--acc);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:clamp(10px,calc(var(--vw,1vw)*1.6),24px)}
.screen.on{display:flex}
/* 표지 */
#cover{overflow-y:auto;align-items:center;gap:14px}
#cover .inner{width:min(1100px,100%);display:flex;flex-direction:column;gap:14px;align-items:center;margin:auto 0}
.badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);color:#fff;border-radius:999px;padding:4px 16px;font-size:clamp(17px,calc(var(--vw,1vw)*1.6),22px);background:var(--sc)}
.title{font-size:clamp(34px,calc(var(--vw,1vw)*4.6),64px);text-align:center;line-height:1.15}
.lead{color:var(--soft);text-align:center;margin:0;font-size:clamp(18px,calc(var(--vw,1vw)*1.7),23px)}
.bq{width:100%;background:var(--paper);border:4px solid var(--sc);border-radius:22px;padding:12px 20px;text-align:center}
.bq small{display:block;color:var(--soft);font-size:clamp(15px,calc(var(--vw,1vw)*1.4),19px)}
.bq b{font-family:var(--display);font-weight:400;font-size:clamp(24px,calc(var(--vw,1vw)*2.6),36px)}
.goalbox{background:#FFF4D6;color:#1F2A44;border:4px solid #E8961E;border-radius:18px;padding:8px 20px;font-family:var(--display);font-size:clamp(21px,calc(var(--vw,1vw)*2.1),30px);text-align:center}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.mcol{background:var(--paper);border-radius:16px;border-top:10px solid var(--mc);padding:8px 10px}
.mcol h3{font-size:clamp(17px,calc(var(--vw,1vw)*1.6),21px);color:var(--mc)}
.mcol a,.mcol span.cur{display:block;font-size:clamp(15px,calc(var(--vw,1vw)*1.35),18px);color:var(--ink);text-decoration:none;padding:3px 6px;border-radius:8px;margin-top:3px}
.mcol a:hover{background:var(--bg)}
.mcol .cur{background:var(--mc);color:#fff!important;font-family:var(--display)}
.plan{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.big-btn{font-size:clamp(24px,calc(var(--vw,1vw)*2.4),34px);padding:10px 40px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);box-shadow:0 5px 0 rgba(0,0,0,.25)}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.ghost{font-size:clamp(17px,calc(var(--vw,1vw)*1.6),22px);padding:8px 18px;border-radius:999px;border:3px solid var(--ink);background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
/* 수업 화면 */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.steps{display:flex;gap:5px;align-items:center;flex:1;min-width:0;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.st{flex:none;font-family:var(--display);font-size:clamp(14px,calc(var(--vw,1vw)*1.2),18px);padding:4px 10px;border-radius:999px;border:3px solid var(--line);background:var(--paper);color:var(--soft)}
.st.now{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.st.done{border-color:var(--ok);color:var(--ok)}
.tools{display:flex;gap:5px;align-items:center;flex:none}
.tool{font-size:clamp(15px,calc(var(--vw,1vw)*1.3),19px);border:3px solid var(--line);background:var(--paper);border-radius:14px;padding:4px 9px;white-space:nowrap}
.tool.qb{border-color:#E8961E}
.tool .n{display:inline-block;min-width:1.5em;border-radius:999px;background:#E8961E;color:#fff;font-size:.8em;padding:0 5px;margin-left:4px}
.sthead{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.routine{font-family:var(--display);font-size:clamp(15px,calc(var(--vw,1vw)*1.35),19px);background:var(--sc);color:#fff;border-radius:999px;padding:3px 12px}
.hd{font-family:var(--display);font-size:clamp(26px,calc(var(--vw,1vw)*2.8),40px);text-align:center;margin:0}
.ask{color:var(--soft);text-align:center;margin:0;font-size:clamp(17px,calc(var(--vw,1vw)*1.6),22px)}
.body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;padding:6px 2px}
.wrap{width:min(1240px,100%)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:6px}
.tnote{border:3px solid #6A4FC9;color:#6A4FC9;background:var(--paper);border-radius:14px;padding:6px 14px;font-size:clamp(16px,calc(var(--vw,1vw)*1.5),21px)}
/* 붙임쪽지 칸 */
.cols{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:10px;width:100%}
.col{background:var(--paper);border-radius:18px;border-top:10px solid var(--cc);padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-height:170px}
.col h3{font-size:clamp(20px,calc(var(--vw,1vw)*2),27px);color:var(--cc);display:flex;align-items:center;gap:6px}
.col .frame{font-size:clamp(14px,calc(var(--vw,1vw)*1.3),17px);color:var(--soft);margin:0}
.notes{display:flex;flex-direction:column;gap:6px;max-height:calc(var(--vh,1vh)*34);overflow-y:auto;flex:1}
.note{background:var(--note);color:var(--note-ink);border-radius:10px;padding:6px 10px;font-size:clamp(17px,calc(var(--vw,1vw)*1.6),22px);display:flex;gap:6px;align-items:flex-start;justify-content:space-between}
.note .x{border:0;background:none;font-size:15px;opacity:.6;padding:0 2px}
.note .up{border:0;background:#E8961E;color:#fff;border-radius:8px;font-size:13px;padding:2px 6px;white-space:nowrap}
.add{display:flex;gap:6px}
.add input{flex:1;min-width:0;font-family:var(--body);font-size:clamp(17px,calc(var(--vw,1vw)*1.6),21px);padding:6px 10px;border:3px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.add button{border:0;border-radius:10px;background:var(--cc);color:#fff;font-size:clamp(16px,calc(var(--vw,1vw)*1.5),20px);padding:4px 12px}
/* 보기 자료 */
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px;width:100%}
.pic{background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--body)}
.pic img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px}
.pic .e{font-size:clamp(46px,calc(var(--vw,1vw)*5),70px);line-height:1.2}
.pic b{font-family:var(--display);font-weight:400;font-size:clamp(18px,calc(var(--vw,1vw)*1.7),23px)}
.pic small{color:var(--soft);font-size:clamp(14px,calc(var(--vw,1vw)*1.3),17px)}
.pic .num{font-family:var(--display);background:var(--ink);color:var(--bg);border-radius:999px;padding:0 10px;font-size:15px;align-self:flex-start}
.chart+.cols .col,.chart+* .col{min-height:110px}
.chart{width:100%;background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:8px 14px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.chart .ct{font-family:var(--display);font-size:clamp(19px,calc(var(--vw,1vw)*1.9),26px)}
.chart small{color:var(--soft);font-size:clamp(13px,calc(var(--vw,1vw)*1.2),16px);align-self:flex-end}
.bars{display:flex;align-items:stretch;gap:clamp(6px,calc(var(--vw,1vw)*1.2),18px);width:100%;height:var(--bh)}
.bc{flex:1;display:flex;flex-direction:column;min-width:0}
.bw{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-top:1.7em;font-size:clamp(17px,calc(var(--vw,1vw)*1.7),24px)}
.bb{position:relative;width:min(72%,110px);background:var(--acc);border-radius:10px 10px 0 0;min-height:4px}
.bb.fx{background:repeating-linear-gradient(45deg,var(--acc) 0 10px,#8DB3EE 10px 20px)}
.bv{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--display);padding-bottom:2px}
.bv i{font-style:normal;font-size:.7em;color:var(--soft)}
.sm{width:100%}.mb .sm .bw{padding-top:1.3em}.mini .mb{padding-top:6px;padding-bottom:4px}.mb b{line-height:1.2}.mb small{display:block;line-height:1.25;margin-top:2px}.sm .bars{gap:4px}.sm .bw{font-size:clamp(14px,calc(var(--vw,1vw)*1.3),19px)}.sm .bl{font-size:clamp(13px,calc(var(--vw,1vw)*1.15),17px)}
.bl{border-top:3px solid var(--ink);text-align:center;font-family:var(--display);font-size:clamp(16px,calc(var(--vw,1vw)*1.5),21px);padding-top:2px;white-space:nowrap}
.split{display:flex;flex-direction:column;gap:10px;width:100%}
.split .gal{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.split .pic img{aspect-ratio:16/9;max-height:calc(var(--vh,1vh)*17)}.split .pic .e{font-size:clamp(40px,calc(var(--vw,1vw)*4),56px)}
@media (min-width:1000px){.mini.m5{grid-template-columns:repeat(5,1fr)}.mini.m5 .m .e{display:none}.mini.m5 .m span.d{font-size:clamp(14px,calc(var(--vw,1vw)*1.15),17px)}.mini.m5 .m{padding:5px 8px;flex-direction:column;align-items:stretch;gap:4px}.mini.m5 .m img{width:100%;height:calc(var(--vh,1vh)*9);object-fit:cover;flex:none}.mini.m5 .m>div{line-height:1.25}.mini.m5 .m b{font-size:clamp(16px,calc(var(--vw,1vw)*1.35),20px)}.mini.m5 .m img{height:calc(var(--vh,1vh)*7)}.mini.m5 .bars{--bh:clamp(78px,calc(var(--vh,1vh)*12),140px)!important}}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:8px;width:100%}
.mini .m{display:flex;gap:10px;align-items:center;background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:6px 10px;text-align:left}
.mini .m img{width:96px;height:72px;object-fit:cover;border-radius:10px;flex:none;cursor:zoom-in}
.mini .m .e{font-size:40px;flex:none;width:60px;text-align:center}
.mini .m b{font-family:var(--display);font-weight:400;font-size:clamp(17px,calc(var(--vw,1vw)*1.6),21px);display:block}
.mini .m span.d{font-size:clamp(14px,calc(var(--vw,1vw)*1.3),17px);display:block}
.mini .m small{font-size:12px;color:var(--soft)}
.mini .num{font-family:var(--display);background:var(--ink);color:var(--bg);border-radius:999px;padding:0 8px;font-size:14px}
.col.cmp{min-height:0}.col.cmp .notes{max-height:calc(var(--vh,1vh)*14)}
/* 분류 */
.deck{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.card1{width:min(900px,100%);background:var(--paper);border:4px solid var(--line);border-radius:22px;padding:12px 20px;display:flex;gap:16px;align-items:center;justify-content:center}
.card1 .e{font-size:clamp(50px,calc(var(--vw,1vw)*5),80px);line-height:1}
.card1 img{width:clamp(130px,calc(var(--vw,1vw)*16),220px);aspect-ratio:4/3;object-fit:cover;border-radius:12px}
.card1 .x{font-family:var(--display);font-size:clamp(24px,calc(var(--vw,1vw)*2.6),38px)}
.bins{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:10px;width:min(1000px,100%)}
.bin{border:0;background:var(--cc);color:#fff;border-radius:30px 30px 14px 14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 rgba(0,0,0,.2);font-size:clamp(21px,calc(var(--vw,1vw)*2.2),31px)}
.bin .e{font-size:clamp(30px,calc(var(--vw,1vw)*3.2),46px)}
.bin .c{font-family:var(--body);font-size:15px;opacity:.9}
.fb{width:min(900px,100%);border-radius:16px;padding:8px 16px;font-size:clamp(18px,calc(var(--vw,1vw)*1.7),23px);display:none}
.fb.on{display:block}.fb.ok{background:color-mix(in srgb,var(--ok) 18%,var(--paper));border:3px solid var(--ok)}
.fb.no{background:color-mix(in srgb,var(--no) 12%,var(--paper));border:3px solid var(--no)}
.fb.open{background:color-mix(in srgb,#E8961E 16%,var(--paper));border:3px solid #E8961E}
.sorted{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:10px;width:min(1000px,100%)}
.sorted div{background:var(--paper);border-radius:14px;border-top:8px solid var(--cc);padding:6px 10px;font-size:clamp(15px,calc(var(--vw,1vw)*1.4),19px)}
.after{background:#FFF4D6;color:#1F2A44;border:4px solid #E8961E;border-radius:18px;padding:8px 16px;width:min(1000px,100%);font-size:clamp(19px,calc(var(--vw,1vw)*1.8),25px)}
/* 뜻 만들기 */
.frameline{font-family:var(--display);font-size:clamp(24px,calc(var(--vw,1vw)*2.6),36px);text-align:center;background:var(--paper);border-radius:18px;padding:10px 16px;width:min(1100px,100%)}
.frameline input{font-family:var(--display);font-size:inherit;width:min(26ch,70%);border:0;border-bottom:4px dashed var(--acc);background:transparent;color:var(--acc);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-family:var(--body);font-size:clamp(16px,calc(var(--vw,1vw)*1.5),20px);border:3px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px}
.chip[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,var(--paper))}
.book{display:none;width:min(1100px,100%);border:4px solid var(--ok);border-radius:18px;background:var(--paper);padding:10px 16px;text-align:center}
.book.on{display:block}
.book b{font-family:var(--display);font-weight:400;font-size:clamp(22px,calc(var(--vw,1vw)*2.3),32px)}
.book mark{background:color-mix(in srgb,var(--ok) 25%,transparent);color:inherit;border-radius:6px;padding:0 3px}
/* 주장-근거-질문 */
.csq{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%}
.evi{display:flex;flex-wrap:wrap;gap:6px}
.evi button{font-family:var(--display);font-size:clamp(16px,calc(var(--vw,1vw)*1.5),20px);border:3px solid var(--line);background:var(--paper);border-radius:12px;padding:4px 10px}
.evi button[aria-pressed="true"]{border-color:#1F9E63;background:color-mix(in srgb,#1F9E63 18%,var(--paper))}
.qpick{width:min(1100px,100%);background:var(--paper);border:4px solid #E8961E;border-radius:18px;padding:4px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qpick select{flex:1;min-width:220px;font-family:var(--body);font-size:clamp(17px,calc(var(--vw,1vw)*1.6),21px);padding:6px;border-radius:10px;border:3px solid var(--line);background:var(--bg);color:var(--ink)}
.log{width:100%;display:grid;gap:6px}
.log div{background:var(--paper);border-left:10px solid #1F9E63;border-radius:10px;padding:6px 12px;font-size:clamp(16px,calc(var(--vw,1vw)*1.5),20px)}
/* 활동 안내 */
.task{width:min(1100px,100%);display:grid;gap:8px}
.task label{display:flex;gap:10px;align-items:center;background:var(--paper);border-radius:14px;padding:8px 14px;font-size:clamp(19px,calc(var(--vw,1vw)*1.8),25px);border:3px solid var(--line)}
.task input{width:26px;height:26px;accent-color:var(--ok)}
.task label.done{border-color:var(--ok);opacity:.8}
.tip{background:#FFF4D6;color:#1F2A44;border-radius:14px;padding:8px 14px;width:min(1100px,100%);font-size:clamp(17px,calc(var(--vw,1vw)*1.6),21px)}
/* 확인 */
.qz{width:min(1000px,100%);display:flex;flex-direction:column;gap:8px;align-items:center}
.qt{font-family:var(--display);font-size:clamp(23px,calc(var(--vw,1vw)*2.4),34px);text-align:center;background:var(--paper);border-radius:18px;padding:10px 16px;width:100%}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.opt{font-family:var(--body);font-size:clamp(19px,calc(var(--vw,1vw)*1.9),26px);border:4px solid var(--line);background:var(--paper);border-radius:16px;padding:8px 12px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--paper))}
.opt.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,var(--paper))}
/* 겹침 창 */
.overlay{position:fixed;inset:0;background:rgba(15,22,40,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.overlay.on{display:flex}
.panel{background:var(--paper);border-radius:24px;padding:clamp(14px,calc(var(--vw,1vw)*2),28px);width:min(1150px,calc(var(--vw,1vw)*96));max-height:calc(var(--vh,1vh)*92);overflow-y:auto;border-top:16px solid var(--pc,var(--ink))}
.panel h2{font-size:clamp(28px,calc(var(--vw,1vw)*3),42px);margin-bottom:6px}
.tpanel h3{font-size:clamp(20px,calc(var(--vw,1vw)*1.9),26px);color:#6A4FC9;margin:12px 0 4px}
.tpanel li,.tpanel p{font-size:clamp(17px,calc(var(--vw,1vw)*1.6),21px);line-height:1.55}
.qadd{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.qadd select,.qadd input{font-family:var(--body);font-size:clamp(17px,calc(var(--vw,1vw)*1.6),21px);padding:6px 10px;border:3px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.qadd input{flex:1;min-width:240px}
.qadd button{border:0;border-radius:10px;background:#E8961E;color:#fff;font-size:clamp(17px,calc(var(--vw,1vw)*1.6),21px);padding:4px 14px}
.stems{display:flex;flex-wrap:wrap;gap:6px}
.stems button{font-family:var(--body);font-size:clamp(15px,calc(var(--vw,1vw)*1.4),18px);border:2px dashed #E8961E;background:transparent;border-radius:999px;padding:2px 10px}
.qlist{display:grid;gap:8px;margin-top:10px}
.qi{border:3px solid var(--line);border-radius:14px;padding:8px 12px;display:grid;gap:4px;background:var(--bg)}
.qi.s1{border-color:#2F74E0}.qi.s2{border-color:var(--ok)}
.qi .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qi .ty{font-family:var(--display);font-size:14px;background:#E8961E;color:#fff;border-radius:999px;padding:1px 9px}
.qi .from{font-size:13px;color:var(--soft)}

html .hj-em{font-family:'HJ Emoji','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-weight:400;font-style:normal;font-synthesis:none;letter-spacing:0;-webkit-text-stroke:0;text-shadow:none}
/* 교사 안내 창 도구(인쇄·구글 문서·이메일) */
html body .hj-tbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px 0 4px;padding-top:18px;border-top:1px solid var(--line)}
html body .hj-tbar>button,html body .hj-mail button{display:inline-flex;align-items:center;gap:7px;font:700 16px/1.2 'Gowun Dodum',sans-serif;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;cursor:pointer}
html body .hj-tbar>button:hover,html body .hj-mail button:hover{background:var(--bg);border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
html body .hj-tbar .hj-i{width:18px;height:18px;flex:none}
html body .hj-mail{flex-basis:100%;display:grid;gap:8px;max-width:560px;margin:6px auto 0;text-align:left;background:var(--bg);border-radius:16px;padding:14px 16px}
html body .hj-mail[hidden]{display:none}
html body .hj-mail label{font-weight:700;font-size:16px}html body .hj-mail label small{font-weight:500;color:var(--soft);font-size:14px;margin-left:6px}
html body .hj-mail input{font:500 17px/1.4 'Gowun Dodum',sans-serif;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
html body .hj-mail div{display:flex;flex-wrap:wrap;gap:8px}html body .hj-mail p{margin:0;font-size:14px!important;color:var(--soft)}
html body .hj-toast{flex-basis:100%;margin:2px 0 0;min-height:1.3em;text-align:center;font-size:15px!important;color:var(--soft)}
@media print{
 body.hj-tprint>*:not(#tn){display:none!important}
 body.hj-tprint #tn{position:static!important;display:block!important;background:none!important;padding:0!important;inset:auto!important}
 body.hj-tprint #tn .panel{width:auto!important;max-height:none!important;overflow:visible!important;box-shadow:none!important;border:0!important;border-radius:0!important;padding:0!important;transform:none!important;animation:none!important}
 body.hj-tprint .hj-tbar,body.hj-tprint #tnClose{display:none!important}
 body.hj-tprint{background:#fff!important;color:#000}
 body.hj-tprint #tn .panel{padding:16mm!important}
}
/* 수업을 마쳤을 때 고르는 창 */
#hj-done{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:rgba(42,34,28,.38);backdrop-filter:blur(3px);animation:hjfade .2s ease}
@keyframes hjfade{from{opacity:0}to{opacity:1}}
#hj-done .hj-dp{width:min(560px,100%);background:var(--paper,#fff);color:var(--ink,#2A221C);border-radius:24px;padding:30px 28px 24px;text-align:center;box-shadow:0 30px 60px -24px rgba(40,25,10,.5);font-family:'Gowun Dodum',sans-serif;word-break:keep-all}
#hj-done .hj-dok{display:inline-grid;place-items:center;width:60px;height:60px;border-radius:18px;background:color-mix(in srgb,#7FB89A 22%,var(--paper,#fff));color:#3F7A5C}
#hj-done .hj-dok svg{width:32px;height:32px}
#hj-done h2{font-family:'Jua',sans-serif;font-size:clamp(26px,3vw,32px);margin:12px 0 4px;letter-spacing:-.03em}
#hj-done .hj-dl{margin:0 0 20px;color:var(--soft,#5C5047);font-size:17px}
#hj-done .hj-dn{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;text-align:left;text-decoration:none;color:#fff;background:var(--ink,#2A221C);border-radius:18px;padding:16px 20px}
#hj-done .hj-dn small{grid-column:1;font-size:14px;opacity:.75;font-weight:600}
#hj-done .hj-dn b{grid-column:1;font-size:clamp(18px,2vw,21px);line-height:1.4}
#hj-done .hj-dn svg{grid-column:2;grid-row:1/3;width:26px;height:26px}
#hj-done .hj-dn:hover{filter:brightness(1.15)}
#hj-done .hj-dlast{margin:0;padding:14px;border-radius:16px;background:var(--bg,#FFFCF8);color:var(--soft,#5C5047);font-size:17px}
#hj-done .hj-drow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
#hj-done .hj-db{flex:1 1 200px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 17px/1.2 'Gowun Dodum',sans-serif;color:var(--ink,#2A221C);background:var(--paper,#fff);border:1.5px solid var(--line,#EFE3D6);border-radius:999px;padding:12px 16px;text-decoration:none;cursor:pointer}
#hj-done .hj-db:hover{background:var(--bg,#FFFCF8)}
#hj-done .hj-db svg{width:20px;height:20px}
#hj-done :focus-visible{outline:3px solid #E0A458;outline-offset:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #hj-done .hj-dn{background:#F2EBE3;color:#221E1A}}
:root[data-theme="dark"] #hj-done .hj-dn{background:#F2EBE3;color:#221E1A}
html body .hj-pl{display:none}
@media print{body.hj-tprint .hj-pl{display:block;text-align:center;font-size:14px!important;color:#555;margin:0 0 4px}}
/* 사진 출처 줄이 화면 밖으로 넘치지 않게 */
html body #phc{white-space:normal!important;overflow-wrap:anywhere;max-width:min(1100px,100%);text-align:center;line-height:1.6;opacity:.85}
/* 홍지희 선생님 버전(SOOP) 첫 화면: 차분하고 읽기 쉽게 */
html body #cBadge{background:color-mix(in srgb,var(--sc) 14%,var(--paper));color:color-mix(in srgb,var(--sc) 78%,var(--ink));font-weight:700;font-size:clamp(15px,1.3vw,18px);padding:5px 14px;letter-spacing:-.01em}
html body #cover:has(#cBadge) .title{font-size:clamp(30px,min(4vw,7vh),52px);line-height:1.25}
html body #cBq{border:0;border-left:5px solid color-mix(in srgb,var(--sc) 55%,var(--paper));background:color-mix(in srgb,var(--sc) 6%,var(--paper));border-radius:16px;padding:14px 22px;text-align:left;box-shadow:none}
html body #cBq>*:first-child:not(b){font-size:15px!important;font-weight:700;color:var(--soft)}
html body #cBq b{display:block;font-weight:700;font-size:clamp(20px,2vw,27px);line-height:1.4;margin-top:2px}
html body #cGoal{border:0;border-left:5px solid #E8B36A;background:#FFF6E8;color:var(--ink);border-radius:16px;padding:12px 22px;font-weight:700;font-size:clamp(18px,1.7vw,23px);text-align:left;box-shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #cGoal{background:#3A3024}}
:root[data-theme="dark"] #cGoal{background:#3A3024}
html body #cMap{gap:10px}
html body #cMap .mcol{border:1px solid var(--line);border-top:3px solid color-mix(in srgb,var(--mc) 60%,var(--paper));border-radius:14px;padding:12px 12px 10px;box-shadow:none}
html body #cMap .mcol h3{font-size:clamp(15px,1.3vw,17px);font-weight:800;color:color-mix(in srgb,var(--mc) 80%,var(--ink));margin:0 0 4px}
html body #cMap .mcol a,html body #cMap .mcol .cur{font-size:clamp(14px,1.2vw,16px);line-height:1.45;padding:5px 8px;border-radius:8px}
html body #cMap .mcol a{color:var(--soft)}html body #cMap .mcol a:hover{background:var(--bg);color:var(--ink)}
html body #cMap .mcol .cur{background:color-mix(in srgb,var(--mc) 13%,var(--paper));color:color-mix(in srgb,var(--mc) 70%,var(--ink))!important;font-weight:700}
/* 듣기 재생 막대 */
#hj-player{position:fixed;left:50%;bottom:clamp(84px,11vh,110px);transform:translateX(-50%);z-index:9000;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;
 max-width:calc(100vw - 24px);background:var(--paper,#fff);color:var(--ink,#2A221C);border:1px solid var(--line,#EFE3D6);border-radius:999px;padding:6px 6px 6px 16px;
 box-shadow:0 14px 34px -14px rgba(40,25,10,.4);font-family:'Gowun Dodum',sans-serif;word-break:keep-all}
#hj-player[hidden]{display:none}
#hj-player .hj-pl-l{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--soft,#5C5047);margin-right:4px}
#hj-player .hj-pl-l b{font-weight:700}
#hj-player .hj-i{width:18px;height:18px;flex:none}
#hj-player button{display:inline-flex;align-items:center;gap:6px;font:700 16px/1.2 'Gowun Dodum',sans-serif;color:var(--ink,#2A221C);background:var(--bg,#FFFCF8);border:1px solid var(--line,#EFE3D6);border-radius:999px;padding:9px 14px;cursor:pointer;min-height:42px}
#hj-player button:hover:not(:disabled){border-color:color-mix(in srgb,var(--ink,#2A221C) 30%,var(--line,#EFE3D6))}
#hj-player button:disabled{opacity:.4;cursor:default}
#hj-player [data-k=pp]{background:var(--ink,#2A221C);color:var(--paper,#fff);border-color:transparent}
#hj-player .hj-pl-x{padding:9px;background:none;border-color:transparent}
#hj-player[data-st=play] .hj-pl-l .hj-i{animation:hjpulse 1.2s ease-in-out infinite}
@keyframes hjpulse{50%{opacity:.35}}
@media print{#hj-player{display:none!important}}
/* 첫 화면 단추 배치: 교사용 도구는 위 오른편, 수업 시작은 가운데 홀로 */
html body .hj-cvtop{align-items:center}
html body .hj-cvtools{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
html body .hj-cvtools .hj-tool2{font-size:clamp(15px,1.25vw,17px)!important;padding:8px 14px!important;min-height:40px;border-width:1.5px!important;border-radius:999px!important;margin:0!important;box-shadow:none!important}
html body .hj-goRow{justify-content:center;margin-top:clamp(8px,1.5vh,18px)}
@media (max-width:640px){html body .hj-cvtools{margin-left:0;justify-content:flex-start}}
/* 첫 화면: 수업 흐름은 한 줄 이어진 막대, 활동 단위는 같은 폭의 막대로 */
html body .hj-field>*:not(.hj-flabel){justify-self:stretch!important;width:100%}
html body .hj-field>#plan,html body .hj-field>#cPlan,html body .hj-field>.stagebar,html body .hj-field>.plan{display:grid!important;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0!important;
 border:1.5px solid var(--line);border-radius:16px;background:var(--paper);overflow:hidden;box-shadow:0 1px 2px rgba(80,55,30,.05)}

집과 너와집을 비교<\/b>하며 ‘왜 그렇게 살았을까’를 자연환경에서 찾게 했습니다.<\/li><li>교과서 활동(125쪽 스스로 활동 사진 보기, 126쪽 영상과 증언, 127쪽 미디어 활동 신문 기사 1)~3))은 그대로 합니다. 바뀐 것은 자료를 먼저 보고 <b>아이들이 짐작하고 근거를 대는 순서<\/b>입니다.<\/li><li>질문 판 연결: “옛날 사람들은 무슨 일을 하며 살았을까?” → 1단계에서 답하고 3단계(너와집)까지 보고 ‘✅ 답 찾음’. 마지막 단계에서 <b>우리 지역<\/b>에 관한 질문을 올려 21~22차시 조사 주제로 넘깁니다.<\/li><li><b>채점하지 않는 것<\/b>: 사진·기사를 보고 짐작한 생활 모습(합리적인 근거가 있으면 모두 인정). 화면에서 채점하는 것은 자료의 종류와 교과서에 나온 사실뿐입니다.<\/li><li>흐름: 주장-근거-질문 10분 → 신문 기사 읽기 7분 → 초가집·너와집 비교 8분 → 어떤 자료로 알았을까(분류) 6분 → 개념 확인 4분 → 우리 지역 질문 5분<\/li><li>교과서 125~127쪽 · 지도서 247~253쪽<\/li><\/ul><h3>지도서 대조 검증 (작성 때 자체 점검)<\/h3><ul><li>차시명·학습 문제(지도서 247쪽), 창녕 1971년 사진, 대전 영상과 할아버지 말씀, 『한국 일보』(2019. 7. 9.) 「너와 지붕 사이로 켜켜이 쌓인 삶」 문장, 꼭! 기억해요(127쪽) 대조<\/li><li>화면 사진 세 장은 모두 자유 이용 사진입니다. 너와집 사진은 교과서 기사와 같은 강원도 삼척의 너와집, 모내기 사진은 교과서 창녕 사진이 아니라 충북 증평에서 모내기를 재현한 모습이라 카드에 ‘재현한 모내기’라고 밝힘<\/li><li>(독립 검토) 1단계 사진 카드 제목 “사진: 경상남도 창녕군(1971년)” + 설명 “장구와 북도 쳐요” 아래에 증평 재현 사진(장구·북이 보이지 않음)이 붙어 1971년 창녕 사진처럼 보임 → 제목 “사진: 모내기하는 사람들”, 설명 앞에 “교과서 125쪽 창녕군(1971년) 사진:”, 출처 “화면 사진은 오늘날 증평에서 재현한 모내기”, 근거 교과서 125쪽<\/li><li>(독립 검토) ‘어떤 자료로?’ 카드 “지금과 조금 다른 옛날 대전역의 모습”(할아버지 증언 “지금 모습과는 조금 다르지?”와 같은 말이라 증언 통도 맞을 수 있음) → “화면에 움직이며 나오는 옛날 대전역의 모습”(영상), 근거 교과서 126쪽<\/li><li>(독립 검토) 같은 단계 통 아래 지역 이름(창녕·대전·대전·삼척)이 답을 알려 주어 자료 종류를 생각하지 않고 맞힐 수 있음 → 지역 이름 뺌<\/li><\/ul><h3>학습 목표<\/h3><p>여러 가지 자료를 분석하여 지역 사람들의 옛 생활 모습을 설명할 수 있다. (지도서 247쪽)<\/p><p>학습 문제: 여러 가지 자료로 지역 사람들의 옛 생활 모습을 살펴봅시다.<\/p><h3>준비물<\/h3><ul><li>교과서 126쪽 QR(대전광역시의 옛 모습을 찍은 영상, 문화 포털), 127쪽 QR(너와집을 소개하는 영상, 국가유산 채널)<\/li><li>활동지 「여러 가지 자료로 지역 사람들의 옛 생활 모습 살펴보기」(지도서 252쪽, 풀이 253쪽) — 제주도 감귤 신문 기사 두 편<\/li><\/ul><h3>성취 기준<\/h3><p>[4사02-03] 지역의 변화상을 보여 주는 역사 자료를 분석하여 지역 사람들의 달라진 생활 모습을 파악한다.<\/p><h3>성취 수준<\/h3><ul><li><b>A<\/b> 지역의 변화상을 보여 주는 다양한 역사 자료를 선정하고 분석하여 지역 사람들의 달라진 생활 모습을 유추할 수 있다.<\/li><li><b>B<\/b> 지역의 변화상을 보여 주는 역사 자료를 조사하여 지역 사람들의 달라진 생활 모습을 비교할 수 있다.<\/li><li><b>C<\/b> 지역의 변화상을 보여 주는 역사 자료를 통해 지역 사람들의 달라진 생활 모습을 찾을 수 있다.<\/li><\/ul><h3>주제 「지도상의 유의점」 (지도서 233쪽)<\/h3><ul><li>우리 지역의 역사가 담긴 다양한 자료를 탐색해 볼 수 있도록 한다.<\/li><li>역사 자료를 활용하여 지역과 지역 사람들의 변화상을 합리적으로 추론할 수 있도록 한다.<\/li><li>적절한 자료를 직접 조사해 지역과 지역 사람들의 변화상을 이해해 보는 경험을 제공한다.<\/li><\/ul><h3>과정 중심 평가 연계 Tip (지도서 253쪽)<\/h3><ul><li>평가 관점: 자료를 분석해 지역 사람들의 옛 생활 모습을 찾아낼 수 있는가?<\/li><li>평가 방법: 관찰·서술 평가<\/li><li>활동지 예시 답안: 옛 생활 모습 — 감귤 농사를 지은 사람이 많았다. / 까닭 — 이 지역에 오래전부터 감귤 나무가 있었다는 사실이 밝혀졌다는 신문 기사의 내용으로 보아 옛날부터 감귤을 재배하는 사람들이 있었을 것 같다.<\/li><\/ul>", "steps": [{"k": "csq", "t": "사진·영상·증언", "min": 10, "hd": "옛날 사람들은 무슨 일을 하며 살았을까요?", "ask": "사진, 영상, 증언을 근거로 주장하고, 친구에게 되물어요.", "qs": ["옛날 사람들은 무슨 일을 하며 살았을까?", "사진 속 지역 사람들은 어떤 생활을 하였을까?"], "cards": [{"p": "monaegi", "t": "사진: 모내기하는 사람들", "d": "교과서 125쪽 창녕군(1971년) 사진: 넓은 논에서 모를 심고, 장구와 북도 쳐요.", "s": "화면 사진은 오늘날 증평에서 재현한 모내기"}, {"e": "🎬", "t": "영상: 대전광역시의 옛 모습", "d": "지금과 조금 다른 대전역, 대전천에 모여 빨래하는 사람들", "s": "교과서 126쪽"}, {"e": "👴", "t": "증언: 대전에 오래 사신 할아버지", "d": "“지금 모습과는 조금 다르지? 이때도 대전역을 이용하는 사람들이 많았단다.”", "s": "교과서 126쪽"}], "note": "<h3>도입 (2분)<\/h3><ul><li>지난 시간에 지역 사람들의 옛 생활 모습은 무엇으로 알 수 있었나요? → 옛이야기로 알 수 있었습니다.<\/li><li>옛이야기 외에 알고 있는 자료의 종류는? → 사진과 영상입니다. 지역 사람들의 증언입니다. (지도서 247쪽)<\/li><li>학습 문제: 여러 가지 자료로 지역 사람들의 옛 생활 모습을 살펴봅시다.<\/li><\/ul><h3>주장-근거-질문 (8분)<\/h3><ul><li>교과서 125쪽 사진과 126쪽 영상(QR, 문화 포털)을 먼저 봅니다. 18차시 질문 판의 <b>“옛날 사람들은 무슨 일을 하며 살았을까?”<\/b>를 골라 답합니다.<\/li><li>주장 예: 창녕 사람들은 농사를 지으며 살았을 것 같아요. 근거: 자료 1(논이 넓게 펼쳐져 있고 모내기하는 모습이 보여요).<\/li><li>주장 예: 옛날 대전 사람들은 대전천에서 빨래를 했어요. 대전역은 옛날에도 사람들이 많이 이용했어요. 근거: 자료 2, 3.<\/li><li>되묻기 예: 왜 냇가에서 빨래를 했을까? 우리 지역 사람들은 옛날에 무슨 일을 했을까? → 질문 판에 올라갑니다.<\/li><\/ul><h3>발문과 예상 반응 (지도서 247~248쪽)<\/h3><ul><li>사진에 나타난 모습은? → 넓은 들판입니다. 논입니다. 허리를 숙이고 일하는 사람들의 모습입니다.<\/li><li><b>핵심 질문<\/b> 사진 속 지역 사람들은 어떤 생활을 하였을까요? → 쌀을 얻으려고 농사를 지으며 생활했을 것 같습니다.<\/li><li>교과서 125쪽 예시 답안: 1) 논, 농사짓는 사람, 풍물놀이를 하는 사람 등 2) 농사짓는 사람이 많았다. / 까닭: 논이 넓게 펼쳐져 있고 모내기하는 모습이 보이기 때문이다.<\/li><li>이 지역에 오래 사신 할아버지의 말씀은 자료의 종류 중 무엇입니까? → 증언입니다. / 증언으로 알 수 있는 점은? → 옛날에도 대전역을 이용하는 사람이 많았다는 점입니다.<\/li><li><b>핵심 질문<\/b> 영상으로 알 수 있는 이 지역의 옛 모습은? → 대전역의 모습은 지금과는 다르지만, 대전역을 이용하는 사람은 옛날부터 많았다는 것을 알 수 있습니다. 옛날에는 사람들이 하천에 모여 빨래를 하기도 했다는 것을 알았습니다.<\/li><\/ul><h3>유의할 점<\/h3><ul><li>“농악(풍물놀이)을 처음 접하는 학생들이 있다면 농촌에서 특별한 날이나 일을 할 때 흥을 돋우기 위해 농악을 연주하였음을 먼저 설명한다.” (지도서 248쪽)<\/li><li>대전 영상 장면 해설: 당시 여느 지역처럼 세탁기가 귀해 물이 풍부한 하천에서 손빨래하였음을 추론할 수 있다. (지도서 248쪽 사진 해설) — ‘왜 냇가에서 빨래를?’ 되묻기가 나오면 이것으로 답해 주세요.<\/li><li>대전 할아버지 말씀은 ‘달라진 것(대전역 모습)’과 ‘이어진 것(대전역을 이용하는 사람이 많음)’을 함께 보여 줍니다. 19차시 온천리 비교와 이어 짚어 주세요.<\/li><\/ul><h3>화면 사진<\/h3><p>자료 1 사진은 교과서 창녕 사진이 아니라 충북 증평에서 모내기를 재현한 자유 이용 사진입니다. 1971년 창녕 모습은 교과서 125쪽 사진으로 보여 주세요.<\/p>"}, {"k": "cards", "t": "신문 기사", "min": 7, "hd": "신문 기사로 삼척 사람들의 옛 생활을 알아봐요", "ask": "교과서 127쪽 기사 「너와 지붕 사이로 켜켜이 쌓인 삶」을 읽어요.", "cards": [{"p": "neowajip", "t": "너와집 (강원도 삼척)", "d": "나무 판자를 기와처럼 지붕에 얹고, 큰 돌멩이도 얹었어요.", "s": "교과서 127쪽 기사 · 자유 이용 사진", "c": "#6A4FC9"}, {"p": "chogajip", "t": "초가집", "d": "볏짚을 이용해 만드는 집이에요.", "s": "지도서 249쪽 · 자유 이용 사진", "c": "#E8961E"}, {"e": "🗣️", "t": "기사 속 증언", "d": "옛날 이곳 사람들은 대부분 너와집에서 살았대요.", "s": "『한국 일보』, 2019. 7. 9.", "c": "#1F9E63"}, {"e": "⛰️", "t": "삼척의 자연환경", "d": "산이 많아 벼농사 지을 곳이 적고, 깊은 산속이라 재료를 들여오기 힘들었대요.", "s": "교과서 127쪽 기사", "c": "#2F74E0"}], "qs": ["옛날 이 지역 사람들이 주로 살았던 집의 이름은 무엇인가요?", "그 집을 지은 까닭은 무엇일까요? 기사에서 찾아요."], "note": "<h3>교과서 활동<\/h3><p>교과서 127쪽 「미디어 활동」: 신문 기사를 읽고, 강원특별자치도 삼척시 사람들의 옛 생활 모습을 알아봅시다. 1) 옛날 이 지역 사람들이 주로 살았던 집의 이름을 찾아 ◯표 2) 그 집을 지은 까닭 3) 옛날 이 지역 사람들의 생활 모습 짐작하기. QR로 너와집을 소개하는 영상(국가유산 채널)을 볼 수 있습니다. 3)은 다음 단계 비교 뒤에 씁니다.<\/p><h3>예시 답안 (지도서 249쪽)<\/h3><ul><li>1) 너와집<\/li><li>2) 주변에서 손쉽게 나무를 얻을 수 있었기 때문이다.<\/li><li>3) 산속에서 나무를 베거나 약초를 캐며 살았을 것 같다.<\/li><\/ul><h3>발문과 예상 반응 (지도서 248~249쪽)<\/h3><ul><li>신문 기사에서 다루고 있는 지역의 자연환경은 어떻습니까? → 높은 산으로 둘러싸여 있습니다.<\/li><li>너와집을 만들어 산 까닭은? → 산이 많은 지역이라 벼농사를 짓기 어려워 볏짚을 이용해 만드는 초가집을 지을 수 없었기 때문입니다. 깊은 산속에 있어 외부에서 집을 짓는 재료를 들여오는 것이 힘들었기 때문입니다. 주변에서 쉽게 구할 수 있는 재료로 나무나 돌이 많았기 때문입니다.<\/li><\/ul><h3>카드 근거<\/h3><p>카드 문장은 교과서 127쪽 기사 본문(“삼척에 오래 산 사람의 증언에 따르면 옛날에 이곳에 사는 사람들은 대부분 너와집에서 살았다고 한다. … 나무 기둥을 판자 모양으로 잘라 기와처럼 지붕에 얹었다. 또 지붕이 바람에 날아가지 않도록 가로대를 덧대고 큰 돌멩이도 얹었다.”)을 짧게 옮긴 것입니다. 너와집 사진은 교과서 기사와 같은 강원도 삼척의 너와집을 찍은 자유 이용 사진입니다. 초가집 카드는 다음 단계 비교를 위해 넣은 것으로, 설명은 지도서 249쪽 “볏짚을 이용해 만드는 초가집”에서 가져왔습니다(교과서 기사에는 “초가집은 지을 수 없었고”만 나옴).<\/p><h3>지역 탐구 수업 꿀 Tip (지도서 249쪽)<\/h3><p>학생이 사는 지역의 옛 모습을 다룬 신문 기사가 있다면 해당 기사를 활용해 옛 생활 모습을 살펴볼 수 있도록 이끕니다.<\/p>"}, {"k": "venn", "t": "초가집·너와집", "min": 8, "hd": "초가집과 너와집, 무엇이 같고 무엇이 다를까요?", "ask": "기사와 사진을 보고 두 집을 비교해요. 다른 까닭은 사는 곳의 자연환경에서 찾아봐요.", "a": "🌾 초가집", "b": "🪵 너와집", "fa": "초가집만의 특징은?", "fs": "두 집 모두 그런 점은?", "fb": "너와집만의 특징은?", "after": "삼척 사람들은 왜 초가집 대신 너와집을 지었을까요? 옛날 이 지역 사람들은 어떻게 살았을까요?", "note": "<h3>재구성한 활동<\/h3><p>교과서 127쪽 2)(너와집을 지은 까닭)를 <b>같은 점·다른 점 비교<\/b>로 바꾼 단계입니다. 기사에 나온 “벼농사를 지을 수 있는 곳이 많지 않아 초가집은 지을 수 없었고”를 근거로, 두 집을 비교하면 ‘사는 곳의 자연환경에 따라 집 짓는 재료가 달라졌다’는 것을 아이들이 스스로 찾게 됩니다.<\/p><h3>예상 반응<\/h3><ul><li>초가집만: 볏짚으로 지붕을 만들어요. 벼농사를 짓는 곳에서 지었을 것 같아요. (지도서 249쪽 “볏짚을 이용해 만드는 초가집”)<\/li><li>둘 다: 사람이 사는 집이에요. 옛날 집이에요. 주변에서 구한 재료로 지었어요.<\/li><li>너와집만: 나무 판자를 지붕에 얹고 큰 돌멩이를 올렸어요. 산이 많은 곳에서 지었어요. (교과서 127쪽)<\/li><\/ul><h3>발문과 예상 반응 (지도서 249쪽)<\/h3><ul><li><b>핵심 질문<\/b> 이 지역 사람들은 옛날에 어떻게 살았을까요? → 주변에 많이 있는 나무, 돌멩이 등을 이용하여 집을 만들어 살았습니다. 벼농사를 짓기보다는 산에서 나무를 자르며 살았을 것 같습니다. 약초나 나물 등 산에서 얻을 수 있는 것을 캐거나 키우며 살았을 것 같습니다.<\/li><\/ul><h3>지도 꿀 Tip (지도서 249쪽)<\/h3><p>“너와집을 아는 데 중점을 두기보다는 이 지역 사람들이 주변 환경에 어떻게 적응하며 살았는지 생각해 보도록 한다.” — 초가집의 구조를 자세히 가르치지 말고, ‘왜 다를까’에 초점을 두세요.<\/p><h3>질문 판 정리<\/h3><p>“옛날 사람들은 무슨 일을 하며 살았을까?” → ‘✅ 답 찾음’(창녕: 농사, 대전: 대전천 빨래·대전역 이용, 삼척: 나무와 돌로 집 짓기, 산에서 나무 베기·약초 캐기 — 사진·영상·증언·신문 기사로 알 수 있었다).<\/p>"}, {"k": "sort", "t": "어떤 자료로?", "min": 6, "hd": "이 모습은 어떤 자료로 알 수 있었을까요?", "ask": "오늘 본 모습이 사진, 영상, 증언, 신문 기사 가운데 어디에서 나왔는지 나누어요.", "routine": "자료 종류 나누기", "bins": [{"k": "photo", "n": "사진", "e": "📷", "c": "#1F9E63"}, {"k": "video", "n": "영상", "e": "🎬", "c": "#2F74E0"}, {"k": "voice", "n": "증언", "e": "🗣️", "c": "#E8961E"}, {"k": "news", "n": "신문 기사", "e": "📰", "c": "#6A4FC9"}], "items": [{"k": "photo", "e": "🌾", "x": "허리를 숙이고 논에 모를 심는 사람들(1971년)" (function(){var bar=document.getElementById('ovBar');if(!bar||document.getElementById('hj-scover'))return;
 var hd=document.querySelector('header .wrap h1'),hp=document.querySelector('header .wrap p'),goal=document.querySelector('main p.goal');
 var tabs=[].slice.call(document.querySelectorAll('body>nav .wrap>a[href^="#s"]'));
 var cv=document.createElement('div');cv.id='hj-scover';cv.setAttribute('aria-label','수업 첫 화면');
 var gt=goal?goal.textContent.replace(/^\s*🎯?\s*학습 목표\s*/,'').trim():'';

  '<div class="hj-field"><span class="hj-flabel">수업 흐름</span><div class="plan" id="hjScPlan"></div></div></div>'+
  '<div class="hj-goRow"><button type="button" class="big-btn hj-sc-go">수업 시작</button></div></div>';
 cv.querySelector('.hj-sc-info').textContent=hp?hp.textContent.replace(/\s*·\s*만든 사람.*$/,''):'';
 cv.querySelector('.hj-sc-title').textContent=hd?hd.textContent.replace(/^\s*\d+\.\s*/,''):document.title;
 cv.querySelector('.hj-qtxt').textContent=gt;if(!gt)cv.querySelector('.hj-sc-goal').remove();
 var pl=cv.querySelector('#hjScPlan');tabs.forEach(function(a,i){var b=document.createElement('button');b.type='button';b.className='st';b.innerHTML='<span class="hj-sn">'+(i+1)+'</span><span class="hj-st"></span>';b.querySelector('.hj-st').textContent=a.textContent.trim();b.onclick=function(){hide();a.click()};pl.appendChild(b)});
 document.body.appendChild(cv);document.documentElement.classList.add('hj-sc-on');
 function hide(){document.documentElement.classList.remove('hj-sc-on')}
 function showC(){document.documentElement.classList.add('hj-sc-on');window.scrollTo(0,0)}
 cv.querySelector('.hj-sc-go').onclick=function(){hide();var f=tabs[0];if(f)f.click()};
 var hb=document.createElement('button');hb.type='button';hb.id='hjScHome';hb.className='hj-ic';hb.innerHTML='<svg class="hj-i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.8l8.5 6.7M5.5 9.2V20h13V9.2M10 20v-5.5h4V20"/></svg>첫 화면';hb.onclick=showC;bar.insertBefore(hb,bar.firstChild);
})();
(function(){var n=document.querySelector('body>nav');if(!n||!document.getElementById('ovBar'))return;function m(){document.documentElement.style.setProperty('--hj-navh',n.offsetHeight+'px')}m();addEventListener('resize',m)})();
/* 과학 앱: 실험 안쪽의 '이전 단계/다음 단계'를 아래 막대의 이전/다음으로 합치기 */
(function(){var ovN=document.getElementById('ovNext'),ovP=document.getElementById('ovPrev');if(!ovN||!ovP)return;
 var inN=document.querySelector('section #next'),inP=document.querySelector('section #prev');if(!inN||!inP)return;
 var row=inN.parentElement;if(row===inP.parentElement){row.classList.add('hj-innernav');document.documentElement.classList.add('hj-merge-steps')}else return;
 var sec=inN.closest('section');
 function vis(){return sec.classList.contains('cur')&&sec.getBoundingClientRect().height>0&&document.body.classList.contains('ov')&&[].some.call(sec.querySelectorAll('.lab'),function(l){return !l.hidden&&l.offsetParent})}
 function pos(){var sp=sec.querySelectorAll('.steps span'),i=-1;sp.forEach(function(s,k){if(s.classList.contains('now'))i=k});return {i:i,n:sp.length}}
 function hint(){var f=sec.querySelector('.lab:not([hidden]) .fb');var t='먼저 이 단계 활동을 해 봐요.';if(f){f.textContent=t;f.className='fb info'}else alert(t)}
 ovN.addEventListener('click',function(e){if(!vis())return;var p=pos();if(p.i<0||p.i>=p.n-1)return;e.stopImmediatePropagation();e.preventDefault();if(inN.disabled)hint();else inN.click()},true);
 ovP.addEventListener('click',function(e){if(!vis())return;var p=pos();if(p.i<=0)return;e.stopImmediatePropagation();e.preventDefault();inP.click()},true);
 /* 실험 단계 중에는 아래 '다음'이 잠긴 것처럼 보이지 않게 */
 new MutationObserver(function(){if(vis()){var p=pos();if(p.i>=0&&p.i<p.n-1)ovN.disabled=false}}).observe(document.getElementById('ovPos'),{childList:true,subtree:true,characterData:true});
})();
/* 헷갈리는 이름 정리: 같은 말이 다른 일을 하지 않게 */
(function(){var R=[['#btnLinks',/^\s*자료\s*$/,'자료 보기'],['#ovHome',/^\s*목록\s*$/,'단계 목록'],['#ovFull',/^\s*전체\s*$/,'전체 보기'],['#ovFull',/^\s*한 화면\s*$/,'한 화면 보기']];
 function fix(){R.forEach(function(r){var el=document.querySelector(r[0]);if(!el)return;[].forEach.call(el.childNodes,function(n){if(n.nodeType===3&&r[1].test(n.nodeValue))n.nodeValue=r[2]})})}
 fix();R.forEach(function(r){var el=document.querySelector(r[0]);if(el)new MutationObserver(fix).observe(el,{childList:true,characterData:true,subtree:true})})})();
/* 과학 앱: 놀이·문제를 다 풀어 '다시 하기'가 나오면 옆에 '다음으로'도 함께 */
(function(){var ov=document.getElementById('ovNext');if(!ov)return;var RX=/^\s*(🔄\s*)?다시\s*(하기|풀기)\s*$/;
 function go(){var e=document.getElementById('hjEnd');if(e&&e.classList.contains('on'))e.click();else ov.click()}
 function fix(){document.querySelectorAll('main section button').forEach(function(b){if(b.classList.contains('hj-gonext'))return;var m=RX.test(b.textContent),n=b.nextElementSibling,has=n&&n.classList.contains('hj-gonext');
  if(m&&!has){var g=document.createElement('button');g.type='button';g.className='hj-gonext';g.innerHTML='다음으로 <svg class="hj-i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';g.onclick=go;var w=b.parentElement.classList.contains('hj-rrow')?b.parentElement:null;if(!w){w=document.createElement('span');w.className='hj-rrow';b.before(w);w.appendChild(b)}w.appendChild(g);b.classList.add('hj-retry')}
  else if(!m&&has){n.remove();b.classList.remove('hj-retry')}})}
 fix();var raf=0;new MutationObserver(function(){if(!raf)raf=requestAnimationFrame(function(){raf=0;fix()})}).observe(document.querySelector('main')||document.body,{childList:true,subtree:true,characterData:true})})();
/* 국어·사회 진행 화면: 내용이 적으면 화면에 맞춰 알맞게 키우기(최대 1.35배), 많으면 그대로 */
(function(){var st=document.getElementById('stage'),bd=st&&st.querySelector('#body');if(!bd||!('zoom' in document.body.style))return;
 function fit(){if(!st.classList.contains('on'))return;bd.style.zoom='';bd.style.width='';
  var vw=window.innerWidth,target=Math.min(1120,vw*0.94),foot=st.querySelector('.foot'),top=bd.getBoundingClientRect().top;
  var availH=window.innerHeight-top-(foot?foot.offsetHeight:60)-28;var ks=[].filter.call(bd.children,function(c){return c.offsetParent});if(!ks.length)return;var h=ks[ks.length-1].getBoundingClientRect().bottom-ks[0].getBoundingClientRect().top+16;if(h<40||availH<200)return;
  var w=Math.max.apply(null,[].map.call(bd.children,function(c){return c.getBoundingClientRect().width}).concat([1]));
  var k=Math.min(1.2,availH/h,(target*0.98)/w);if(k<1.04)return;k=Math.floor(k*100)/100;
  bd.style.width=(target/k)+'px';bd.style.zoom=k;
  var h2=(ks[ks.length-1].getBoundingClientRect().bottom-ks[0].getBoundingClientRect().top+16);if(h2>availH+4){k=Math.max(1,Math.floor(k*availH/h2*100)/100);bd.style.width=(target/k)+'px';bd.style.zoom=k}}
 var raf=0;function q(){cancelAnimationFrame(raf);raf=requestAnimationFrame(function(){setTimeout(fit,30)})}
 new MutationObserver(q).observe(bd,{childList:true});new MutationObserver(q).observe(st,{attributes:true,attributeFilter:['class']});addEventListener('resize',q);if(document.fonts)document.fonts.ready.then(q)})();
/* 과학 앱: 사진이 두 장 이상 이어지면 나란히(사진 위, 설명 아래) 놓아 한 화면에 들어오게 */
(function(){if(!document.getElementById('ovBar'))return;
 document.querySelectorAll('main section').forEach(function(sec){var kids=[].slice.call(sec.querySelectorAll('figure.photo'));var done=new Set();
  kids.forEach(function(f){if(done.has(f)||f.parentElement.classList.contains('gallery')||f.parentElement.classList.contains('hj-pgrid'))return;var run=[f],n=f.nextElementSibling;while(n&&n.matches('figure.photo')){run.push(n);n=n.nextElementSibling}
   if(run.length<2)return;var g=document.createElement('div');g.className='hj-pgrid';f.before(g);run.forEach(function(x){done.add(x);g.appendChild(x)})})})})();
