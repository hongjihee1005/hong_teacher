<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🌈 생각을 펼쳐요 / 재미있게 확인해요</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF1F8;--paper:#FFFFFF;--ink:#1F2A44;--soft:#4F5B75;--line:#CAD6E4;
  --ok:#1F9E63;--no:#D2453A;--acc:#2F74E0;--note:#FFF4C2;--note-ink:#3B3200;
  --S:#E0506B;--O1:#2F74E0;--O2:#6A4FC9;--P:#1F9E63;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#162034;--paper:#22304C;--ink:#F2F5FB;--soft:#B7C3DB;--line:#3A4C74;--note:#4A4420;--note-ink:#FFF6CC}}
:root[data-theme="dark"]{--bg:#162034;--paper:#22304C;--ink:#F2F5FB;--soft:#B7C3DB;--line:#3A4C74;--note:#4A4420;--note-ink:#FFF6CC}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:clamp(19px,calc(var(--vw,1vw)*1.9),24px);line-height:1.45;overflow:hidden}
body,h1,h2,h3,p,li,span,div,button,a,small,b,label{word-break:keep-all;overflow-wrap:break-word;line-break:strict}
h1,h2,h3,.hd,.ttl{text-wrap:balance} p,li,small{text-wrap:pretty}
button{font-family:var(--display);color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:4px solid var(--acc);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:clamp(10px,calc(var(--vw,1vw)*1.6),24px)}
.screen.on{display:flex}
/* 표지 */
#cover{overflow-y:auto;align-items:center;gap:14px}
#cover .inner{width:min(1100px,100%);display:flex;flex-direction:column;gap:14px;align-items:center;margin:auto 0}
.badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);color:#fff;border-radius:999px;padding:4px 16px;font-size:clamp(17px,calc(var(--vw,1vw)*1.6),22px);background:var(--sc)}
.title{font-size:clamp(34px,calc(var(--vw,1vw)*4.6),64px);text-align:center;line-height:1.15}
.lead{color:var(--soft);text-align:center;margin:0;font-size:clamp(18px,calc(var(--vw,1vw)*1.7),23px)}
.bq{width:100%;background:var(--paper);border:4px solid var(--sc);border-radius:22px;padding:12px 20px;text-align:center}
.bq small{display:block;color:var(--soft);font-size:clamp(15px,calc(var(--vw,1vw)*1.4),19px)}
.bq b{font-family:var(--display);font-weight:400;font-size:clamp(24px,calc(var(--vw,1vw)*2.6),36px)}
.goalbox{background:#FFF4D6;color:#1F2A44;border:4px solid #E8961E;border-radius:18px;padding:8px 20px;font-family:var(--display);font-size:clamp(21px,calc(var(--vw,1vw)*2.1),30px);text-align:center}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.mcol{background:var(--paper);border-radius:16px;border-top:10px solid var(--mc);padding:8px 10px}
.mcol h3{font-size:clamp(17px,calc(var(--vw,1vw)*1.6),21px);color:var(--mc)}
.mcol a,.mcol span.cur{display:block;font-size:clamp(15px,calc(var(--vw,1vw)*1.35),18px);color:var(--ink);text-decoration:none;padding:3px 6px;border-radius:8px;margin-top:3px}
.mcol a:hover{background:var(--bg)}
.mcol .cur{background:var(--mc);color:#fff!important;font-family:var(--display)}
.plan{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.big-btn{font-size:clamp(24px,calc(var(--vw,1vw)*2.4),34px);padding:10px 40px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);box-shadow:0 5px 0 rgba(0,0,0,.25)}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.ghost{font-size:clamp(17px,calc(var(--vw,1vw)*1.6),22px);padding:8px 18px;border-radius:999px;border:3px solid var(--ink);background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
/* 수업 화면 */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.steps{display:flex;gap:5px;align-items:center;flex:1;min-width:0;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.st{flex:none;font-family:var(--display);font-size:clamp(14px,calc(var(--vw,1vw)*1.2),18px);padding:4px 10px;border-radius:999px;border:3px solid var(--line);background:var(--paper);color:var(--soft)}
.st.now{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.st.done{border-color:var(--ok);color:var(--ok)}
.tools{display:flex;gap:5px;align-items:center;flex:none}
.tool{font-size:clamp(15px,calc(var(--vw,1vw)*1.3),19px);border:3px solid var(--line);background:var(--paper);border-radius:14px;padding:4px 9px;white-space:nowrap}
.tool.qb{border-color:#E8961E}
.tool .n{display:inline-block;min-width:1.5em;border-radius:999px;background:#E8961E;color:#fff;font-size:.8em;padding:0 5px;margin-left:4px}
.sthead{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.routine{font-family:var(--display);font-size:clamp(15px,calc(var(--vw,1vw)*1.35),19px);background:var(--sc);color:#fff;border-radius:999px;padding:3px 12px}
.hd{font-family:var(--display);font-size:clamp(26px,calc(var(--vw,1vw)*2.8),40px);text-align:center;margin:0}
.ask{color:var(--soft);text-align:center;margin:0;font-size:clamp(17px,calc(var(--vw,1vw)*1.6),22px)}
.body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;padding:6px 2px}
.wrap{width:min(1240px,100%)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:6px}
.tnote{border:3px solid #6A4FC9;color:#6A4FC9;background:var(--paper);border-radius:14px;padding:6px 14px;font-size:clamp(16px,calc(var(--vw,1vw)*1.5),21px)}
/* 붙임쪽지 칸 */
.cols{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:10px;width:100%}
.col{background:var(--paper);border-radius:18px;border-top:10px solid var(--cc);padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-height:170px}
.col h3{font-size:clamp(20px,calc(var(--vw,1vw)*2),27px);color:var(--cc);display:flex;align-items:center;gap:6px}
.col .frame{font-size:clamp(14px,calc(var(--vw,1vw)*1.3),17px);color:var(--soft);margin:0}
.notes{display:flex;flex-direction:column;gap:6px;max-height:calc(var(--vh,1vh)*34);overflow-y:auto;flex:1}
.note{background:var(--note);color:var(--note-ink);border-radius:10px;padding:6px 10px;font-size:clamp(17px,calc(var(--vw,1vw)*1.6),22px);display:flex;gap:6px;align-items:flex-start;justify-content:space-between}
.note .x{border:0;background:none;font-size:15px;opacity:.6;padding:0 2px}
.note .up{border:0;background:#E8961E;color:#fff;border-radius:8px;font-size:13px;padding:2px 6px;white-space:nowrap}
.add{display:flex;gap:6px}
.add input{flex:1;min-width:0;font-family:var(--body);font-size:clamp(17px,calc(var(--vw,1vw)*1.6),21px);padding:6px 10px;border:3px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.add button{border:0;border-radius:10px;background:var(--cc);color:#fff;font-size:clamp(16px,calc(var(--vw,1vw)*1.5),20px);padding:4px 12px}
/* 보기 자료 */
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px;width:100%}
.pic{background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--body)}
.pic img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px}
.pic .e{font-size:clamp(46px,calc(var(--vw,1vw)*5),70px);line-height:1.2}
.pic b{font-family:var(--display);font-weight:400;font-size:clamp(18px,calc(var(--vw,1vw)*1.7),23px)}
.pic small{color:var(--soft);font-size:clamp(14px,calc(var(--vw,1vw)*1.3),17px)}
.pic .num{font-family:var(--display);background:var(--ink);color:var(--bg);border-radius:999px;padding:0 10px;font-size:15px;align-self:flex-start}
.chart+.cols .col,.chart+* .col{min-height:110px}
.chart{width:100%;background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:8px 14px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.chart .ct{font-family:var(--display);font-size:clamp(19px,calc(var(--vw,1vw)*1.9),26px)}
.chart small{color:var(--soft);font-size:clamp(13px,calc(var(--vw,1vw)*1.2),16px);align-self:flex-end}
.bars{display:flex;align-items:stretch;gap:clamp(6px,calc(var(--vw,1vw)*1.2),18px);width:100%;height:var(--bh)}
.bc{flex:1;display:flex;flex-direction:column;min-width:0}
.bw{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-top:1.7em;font-size:clamp(17px,calc(var(--vw,1vw)*1.7),24px)}
.bb{position:relative;width:min(72%,110px);background:var(--acc);border-radius:10px 10px 0 0;min-height:4px}
.bb.fx{background:repeating-linear-gradient(45deg,var(--acc) 0 10px,#8DB3EE 10px 20px)}
.bv{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--display);padding-bottom:2px}
.bv i{font-style:normal;font-size:.7em;color:var(--soft)}
.sm{width:100%}.mb .sm .bw{padding-top:1.3em}.mini .mb{padding-top:6px;padding-bottom:4px}.mb b{line-height:1.2}.mb small{display:block;line-height:1.25;margin-top:2px}.sm .bars{gap:4px}.sm .bw{font-size:clamp(14px,calc(var(--vw,1vw)*1.3),19px)}.sm .bl{font-size:clamp(13px,calc(var(--vw,1vw)*1.15),17px)}
.bl{border-top:3px solid var(--ink);text-align:center;font-family:var(--display);font-size:clamp(16px,calc(var(--vw,1vw)*1.5),21px);padding-top:2px;white-space:nowrap}
.split{display:flex;flex-direction:column;gap:10px;width:100%}
.split .gal{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.split .pic img{aspect-ratio:16/9;max-height:calc(var(--vh,1vh)*17)}.split .pic .e{font-size:clamp(40px,calc(var(--vw,1vw)*4),56px)}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:8px;width:100%}
.mini .m{display:flex;gap:10px;align-items:center;background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:6px 10px;text-align:left}
.mini .m img{width:96px;height:72px;object-fit:cover;border-radius:10px;flex:none;cursor:zoom-in}
.mini .m .e{font-size:40px;flex:none;width:60px;text-align:center}
.mini .m b{font-family:var(--display);font-weight:400;font-size:clamp(17px,calc(var(--vw,1vw)*1.6),21px);display:block}
.mini .m span.d{font-size:clamp(14px,calc(var(--vw,1vw)*1.3),17px);display:block}
.mini .m small{font-size:12px;color:var(--soft)}
.mini .num{font-family:var(--display);background:var(--ink);color:var(--bg);border-radius:999px;padding:0 8px;font-size:14px}
.col.cmp{min-height:0}.col.cmp .notes{max-height:calc(var(--vh,1vh)*14)}
/* 분류 */
.deck{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.card1{width:min(900px,100%);background:var(--paper);border:4px solid var(--line);border-radius:22px;padding:12px 20px;display:flex;gap:16px;align-items:center;justify-content:center}
.card1 .e{font-size:clamp(50px,calc(var(--vw,1vw)*5),80px);line-height:1}
.card1 img{width:clamp(130px,calc(var(--vw,1vw)*16),220px);aspect-ratio:4/3;object-fit:cover;border-radius:12px}
.card1 .x{font-family:var(--display);font-size:clamp(24px,calc(var(--vw,1vw)*2.6),38px)}
.bins{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:10px;width:min(1000px,100%)}
.bin{border:0;background:var(--cc);color:#fff;border-radius:30px 30px 14px 14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 rgba(0,0,0,.2);font-size:clamp(21px,calc(var(--vw,1vw)*2.2),31px)}
.bin .e{font-size:clamp(30px,calc(var(--vw,1vw)*3.2),46px)}
.bin .c{font-family:var(--body);font-size:15px;opacity:.9}
.fb{width:min(900px,100%);border-radius:16px;padding:8px 16px;font-size:clamp(18px,calc(var(--vw,1vw)*1.7),23px);display:none}
.fb.on{display:block}.fb.ok{background:color-mix(in srgb,var(--ok) 18%,var(--paper));border:3px solid var(--ok)}
.fb.no{background:color-mix(in srgb,var(--no) 12%,var(--paper));border:3px solid var(--no)}
.fb.open{background:color-mix(in srgb,#E8961E 16%,var(--paper));border:3px solid #E8961E}
.sorted{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:10px;width:min(1000px,100%)}
.sorted div{background:var(--paper);border-radius:14px;border-top:8px solid var(--cc);padding:6px 10px;font-size:clamp(15px,calc(var(--vw,1vw)*1.4),19px)}
.after{background:#FFF4D6;color:#1F2A44;border:4px solid #E8961E;border-radius:18px;padding:8px 16px;width:min(1000px,100%);font-size:clamp(19px,calc(var(--vw,1vw)*1.8),25px)}
/* 뜻 만들기 */
.frameline{font-family:var(--display);font-size:clamp(24px,calc(var(--vw,1vw)*2.6),36px);text-align:center;background:var(--paper);border-radius:18px;padding:10px 16px;width:min(1100px,100%)}
.frameline input{font-family:var(--display);font-size:inherit;width:min(26ch,70%);border:0;border-bottom:4px dashed var(--acc);background:transparent;color:var(--acc);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-family:var(--body);font-size:clamp(16px,calc(var(--vw,1vw)*1.5),20px);border:3px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px}
.chip[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,var(--paper))}
.book{display:none;width:min(1100px,100%);border:4px solid var(--ok);border-radius:18px;background:var(--paper);padding:10px 16px;text-align:center}
.book.on{display:block}
.book b{font-family:var(--display);font-weight:400;font-size:clamp(22px,calc(var(--vw,1vw)*2.3),32px)}
.book mark{background:color-mix(in srgb,var(--ok) 25%,transparent);color:inherit;border-radius:6px;padding:0 3px}
/* 주장-근거-질문 */
.csq{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%}
.evi{display:flex;flex-wrap:wrap;gap:6px}
.evi button{font-family:var(--display);font-size:clamp(16px,calc(var(--vw,1vw)*1.5),20px);border:3px solid var(--line);background:var(--paper);border-radius:12px;padding:4px 10px}
.evi button[aria-pressed="true"]{border-color:#1F9E63;background:color-mix(in srgb,#1F9E63 18%,var(--paper))}
.qpick{width:min(1100px,100%);background:var(--paper);border:4px solid #E8961E;border-radius:18px;padding:4px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qpick select{flex:1;min-width:220px;font-family:var(--body);font-size:clamp(17px,calc(var(--vw,1vw)*1.6),21px);padding:6px;border-radius:10px;border:3px solid var(--line);background:var(--bg);color:var(--ink)}
.log{width:100%;display:grid;gap:6px}
.log div{background:var(--paper);border-left:10px solid #1F9E63;border-radius:10px;padding:6px 12px;font-size:clamp(16px,calc(var(--vw,1vw)*1.5),20px)}
/* 활동 안내 */
.task{width:min(1100px,100%);display:grid;gap:8px}
.task label{display:flex;gap:10px;align-items:center;background:var(--paper);border-radius:14px;padding:8px 14px;font-size:clamp(19px,calc(var(--vw,1vw)*1.8),25px);border:3px solid var(--line)}
.task input{width:26px;height:26px;accent-color:var(--ok)}
.task label.done{border-color:var(--ok);opacity:.8}
.tip{background:#FFF4D6;color:#1F2A44;border-radius:14px;padding:8px 14px;width:min(1100px,100%);font-size:clamp(17px,calc(var(--vw,1vw)*1.6),21px)}
/* 확인 */
.qz{width:min(1000px,100%);display:flex;flex-direction:column;gap:8px;align-items:center}
.qt{font-family:var(--display);font-size:clamp(23px,calc(var(--vw,1vw)*2.4),34px);text-align:center;background:var(--paper);border-radius:18px;padding:10px 16px;width:100%}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.opt{font-family:var(--body);font-size:clamp(19px,calc(var(--vw,1vw)*1.9),26px);border:4px solid var(--line);background:var(--paper);border-radius:16px;padding:8px 12px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--paper))}
.opt.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,var(--paper))}
/* 겹침 창 */
.overlay{position:fixed;inset:0;background:rgba(15,22,40,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.overlay.on{display:flex}
.panel{background:var(--paper);border-radius:24px;padding:clamp(14px,calc(var(--vw,1vw)*2),28px);width:min(1150px,calc(var(--vw,1vw)*96));max-height:calc(var(--vh,1vh)*92);overflow-y:auto;border-top:16px solid var(--pc,var(--ink))}
.panel h2{font-size:clamp(28px,calc(var(--vw,1vw)*3),42px);margin-bottom:6px}
.tpanel h3{font-size:clamp(20px,calc(var(--vw,1vw)*1.9),26px);color:#6A4FC9;margin:12px 0 4px}
.tpanel li,.tpanel p{font-size:clamp(17px,calc(var(--vw,1vw)*1.6),21px);line-height:1.55}
.qadd{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.qadd select,.qadd input{font-family:var(--body);font-size:clamp(17px,calc(var(--vw,1vw)*1.6),21px);padding:6px 10px;border:3px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.qadd input{flex:1;min-width:240px}
.qadd button{border:0;border-radius:10px;background:#E8961E;color:#fff;font-size:clamp(17px,calc(var(--vw,1vw)*1.6),21px);padding:4px 14px}
.stems{display:flex;flex-wrap:wrap;gap:6px}
.stems button{font-family:var(--body);font-size:clamp(15px,calc(var(--vw,1vw)*1.4),18px);border:2px dashed #E8961E;background:transparent;border-radius:999px;padding:2px 10px}
.qlist{display:grid;gap:8px;margin-top:10px}
.qi{border:3px solid var(--line);border-radius:14px;padding:8px 12px;display:grid;gap:4px;background:var(--bg)}
.qi.s1{border-color:#2F74E0}.qi.s2{border-color:var(--ok)}
.qi .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qi .ty{font-family:var(--display);font-size:14px;background:#E8961E;color:#fff;border-radius:999px;padding:1px 9px}
.qi .from{font-size:13px;color:var(--soft)}
.qi .q{font-size:clamp(18px,calc(var(--vw,1vw)*1.7),23px);flex:1}
.qi .stt{font-family:var(--display);font-size:15px;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:2px 10px}
.qi .ans{font-size:clamp(16px,calc(var(--vw,1vw)*1.5),20px);color:var(--ink)}
.qi input{font-family:var(--body);font-size:16px;padding:4px 8px;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
.picker{font-family:var(--display);font-size:clamp(90px,calc(var(--vw,1vw)*14),170px);text-align:center;line-height:1.1}

<script>
/* 큰 화면(전자칠판·모니터)에서는 크롬북 1366×680 화면을 비율 그대로 키워 보여 줌 */
(function(){var f=function(){var z=Math.min(innerWidth/1366,innerHeight/680);var d=document.documentElement,on=z>1.08;d.style.zoom=on?z.toFixed(3):'';d.style.setProperty('--vh',(innerHeight/(on?z:1)/100).toFixed(2)+'px');d.style.setProperty('--vw',(innerWidth/(on?z:1)/100).toFixed(2)+'px');d.classList.toggle('zlow',on&&innerHeight/z<=760&&innerWidth/z>=900)};f();addEventListener('resize',f)})();
const C={"file": "u1-l10.html", "topicKey": "u1t1", "lessonKey": "u1-l10", "short": "10차시", "soop": "P", "title": "🌈 생각을 펼쳐요 / 재미있게 확인해요", "sub": "3학년 1학기 사회 1단원 · 10차시 · 교과서 33~35쪽", "goal": "‘우리가 사는 곳의 여러 장소’에서 공부한 내용을 다양한 방법으로 정리해 봅시다.", "photos": {}, "notes0": "<h3>SOOP 탐구 흐름으로 다시 짠 까닭<\/h3><ul><li>이 차시는 주제 1의 <b>P(발표하기)<\/b>입니다. 주제 동안 모은 <b>질문 판<\/b>을 되돌아보며 아직 답을 못 찾은 질문에 모둠이 근거로 답해 발표하고, 그림일기·입체 모형으로 표현해 발표하고, <b>예전 생각-지금 생각<\/b>으로 장소와 장소감에 관한 생각의 변화를 돌아봅니다.<\/li><li>교과서 활동(생각을 펼쳐요 선택 1 그림일기·선택 2 입체 모형 33~34쪽, 재미있게 확인해요 35쪽, 얼마나 잘했을까 35쪽)은 그대로 합니다. 앞에 질문 판 발표를, 뒤에 예전 생각-지금 생각과 개념 확인을 붙였습니다.<\/li><li>질문 판: 8~9차시 ‘도전’에서 올린 질문과 ‘❓ 궁금해요 / 🔎 찾는 중’으로 남은 질문을 1단계에서 모둠별로 하나씩 맡아 답합니다. 기록하면 ‘🔎 찾는 중’으로 바뀌니, 발표를 듣고 반 전체가 동의하면 질문 판에서 ‘✅ 답 찾음’으로 바꿔 주세요.<\/li><li>흐름(40분): 질문 판 되돌아보기 7분 → 그림일기 살펴보기 3분 → 생각을 펼쳐요 15분 → 재미있게 확인해요 5분 → 예전 생각-지금 생각 6분 → 개념 확인 4분. 만들기에 시간이 모자라면 4단계(재미있게 확인해요)를 과제로 돌리거나 6단계를 줄이세요.<\/li><li>교과서 33~35쪽 · 지도서 68~69쪽<\/li><\/ul><h3>학습 목표<\/h3><p>‘우리가 사는 곳의 여러 장소’에서 공부한 내용을 다양한 방법으로 정리할 수 있다. (지도서 68쪽)<\/p><h3>준비물<\/h3><ul><li>선택 1: 색칠 도구 / 선택 2: 도화지, 색종이, 종이 상자, 가위, 풀, 색칠 도구 (교과서 33~34쪽)<\/li><\/ul><h3>성취 기준<\/h3><p>[4사01-01] 주변 여러 장소에서의 경험과 느낌을 다양한 방식으로 표현하고, 장소감을 나누며 서로 존중하는 태도를 지닌다.<\/p><h3>성취 수준<\/h3><ul><li><b>A<\/b> 주변 여러 장소에서의 경험과 느낌을 다양한 방식으로 표현하며 주변 장소에 관심을 가지고, 다른 사람과 장소감을 비교하며 서로 다른 장소감을 존중하는 태도를 가진다.<\/li><li><b>B<\/b> 주변 여러 장소에서의 경험과 느낌을 다양한 방식으로 표현하고, 다른 사람의 장소감을 관찰하며 서로 다른 장소감을 존중하는 태도를 가진다.<\/li><li><b>C<\/b> 주변 여러 장소에서의 경험과 느낌을 표현하고, 다른 사람의 장소감을 관찰하며 서로 다른 장소감의 차이를 발견할 수 있다.<\/li><\/ul><h3>주제 「지도상의 유의점」 (지도서 25쪽)<\/h3><ul><li>우리가 사는 곳의 범위는 생활권을 기반으로 하되 여가, 쇼핑을 위한 이동 및 학생의 경험 등 일상생활이 이루어지는 공간 범위를 고려한다.<\/li><li>삶의 터전에 관심을 두고 학생의 생활과 관련이 깊은 주변의 장소를 탐색하는 데 중점을 둔다.<\/li><li>학생들의 생활과 관련이 있는 장소를 활용하여 학생들이 공감하며 활동에 참여할 수 있도록 한다.<\/li><li>사람마다 장소에 관한 생각과 느낌이 다를 수 있음을 이해하고, 이를 존중할 수 있도록 지도하는 데 중점을 둔다.<\/li><li>여러 장소에서의 경험을 공유하는 과정에서 장소감의 차이를 이해하고 서로 존중하며, 주변의 장소를 알아가면서 이에 관한 관심을 심화하도록 한다.<\/li><\/ul><h3>지도서 대조 검증<\/h3><ul><li>1단계 교사 안내 ‘자료 1~4는 모두 「꼭! 기억해요」 문장’ → 자료 2(같을 수도 있고 다를 수도 있습니다)는 교과서 20쪽 본문이므로 출처를 바로잡음<\/li><li>1단계 🎯 함께 답할 질문이 ‘아직 답을 못 찾은 질문’이라는 제목과 달리 3차시·4~5차시에 이미 ‘✅ 답 찾음’이 된 두 질문이었음 → 8~9차시 ‘도전’ 예시 질문 두 개로 바꾸고 예상 반응을 맞춤<\/li><li>그 밖의 항목(차시명·학습 문제, 그림일기 두 편 원문, 입체 모형 순서·준비물, 재미있게 확인해요 ①~⑦ 정답·색과 ‘소방서’, 얼마나 잘했을까 세 문장, 개념 확인 정답)은 원문과 같음 (교과서 33~35쪽, 지도서 68~69쪽)<\/li><\/ul>", "steps": [{"k": "csq", "t": "질문 판 발표", "min": 7, "hd": "아직 답을 못 찾은 질문에 답해요", "ask": "모둠이 질문 하나를 맡아, 배운 내용을 근거로 답을 발표해요.", "qs": ["느낌이 다른 친구와 어떻게 이야기하면 좋을까?", "한 번도 안 가 본 장소에도 느낌이 생길까?"], "cards": [{"e": "🧺", "t": "여러 장소 이용하기", "d": "사람들은 필요에 따라 여러 장소를 이용하며 생활합니다.", "s": "교과서 17쪽"}, {"e": "🛝", "t": "같은 장소, 다른 생각", "d": "같은 장소에 관한 생각이나 느낌이 같을 수도 있고 다를 수도 있습니다.", "s": "교과서 20쪽"}, {"e": "🃏", "t": "여러 장소에서의 경험", "d": "우리는 여러 장소에서 서로 다른 경험을 할 수 있습니다.", "s": "교과서 22쪽"}, {"e": "🖼️", "t": "작품 전시회", "d": "장소에 관한 서로 다른 생각과 느낌을 이해하고 존중해야 합니다.", "s": "교과서 30쪽"}], "note": "<h3>진행<\/h3><ul><li>수업 전에 💬 질문 판을 열어 ‘❓ 궁금해요 / 🔎 찾는 중’ 질문을 모둠 수만큼 고릅니다. 🎯 목록에는 이 질문들이 자동으로 붙습니다.<\/li><li>모둠별로 주장 1개 + 근거(자료 번호 또는 우리가 한 활동) + 되묻기를 발표합니다(모둠당 1분 안쪽).<\/li><li>자료 1·3·4는 각 차시 「꼭! 기억해요」 문장 원문(교과서 17·22·30쪽), 자료 2는 교과서 20쪽 본문 원문입니다.<\/li><li>🎯 목록 첫 두 질문은 8~9차시 ‘도전’ 예시 질문입니다(재구성). 질문 판에 남은 ‘❓ 궁금해요 / 🔎 찾는 중’ 질문이 그 아래에 자동으로 붙습니다.<\/li><\/ul><h3>도입 발문과 예상 반응 (지도서 68쪽)<\/h3><ul><li>‘우리가 사는 곳의 여러 장소’에서 공부한 내용은 무엇인가요? → 우리가 사는 곳의 여러 장소를 살펴봤습니다. 여러 장소에서의 경험을 친구들과 나눴습니다. 여러 장소를 그림이나 책 등으로 표현하고 친구들과 이야기해 보았습니다. 친구들이 장소를 그린 그림, 여러 장소를 소개하는 책이나 신문 등을 보고, 같은 장소라도 사람에 따라 경험과 느낌이 다를 수 있다는 것을 알았습니다.<\/li><li>학습 문제: ‘우리가 사는 곳의 여러 장소’에서 공부한 내용을 다양한 방법으로 정리해 봅시다.<\/li><\/ul><h3>예상 반응 (재구성한 예시)<\/h3><ul><li>질문: 느낌이 다른 친구와 어떻게 이야기하면 좋을까? → 주장: 친구 느낌이 나와 달라도 끝까지 듣고 존중해요. 근거: 자료 4, 자료 2.<\/li><li>질문: 한 번도 안 가 본 장소에도 느낌이 생길까? → 주장: 친구 작품을 보고 가 보고 싶어졌어요. 근거: 8~9차시 전시회 붙임쪽지. (교사 참고: “장소감은 미디어, 문학 작품과 같은 매체 등을 통한 간접 경험으로 형성된다.” 지도서 43쪽 교수 학습 자료)<\/li><\/ul><h3>재구성한 점과 근거<\/h3><p>지도서 도입(공부한 내용 떠올리기)을 <b>질문 판 되돌아보기<\/b>로 바꾸었습니다. “학생들이 자유롭게 이야기할 수 있도록 편안한 분위기를 유도한다.” (지도서 68쪽) — 근거가 부족한 답도 받아 주고, 되묻기로 다시 생각하게 하세요.<\/p><h3>유의할 점<\/h3><p>느낌·좋아하는 장소에 관한 질문은 “사람마다 다를 수 있다”가 답이 될 수 있습니다. 한 가지 답으로 모으지 마세요.<\/p>"}, {"k": "cards", "t": "그림일기 보기", "min": 3, "hd": "교과서 그림일기를 살펴봐요", "ask": "글쓴이는 어떤 장소에서 무엇을 했고, 어떤 느낌이었을까요?", "cards": [{"t": "동네에 있는 산", "d": "어머니와 동네에 있는 산에서 산책했다. 산책하면서 학교에서 있었던 일과 저녁에 먹을 음식도 이야기 나눴다. 특히 산책하다가 본 우리 동네 모습이 장난감처럼 작게 보여서 신기했다. 나는 어머니와 함께 산책할 수 있는 산이 있어서 참 좋다.", "s": "교과서 33쪽 그림일기 ①", "e": "⛰️"}, {"e": "✏️", "t": "우리 동네 문구점", "d": "우리 동네 문구점은 보물 창고 같다. 갈 때마다 새로운 물건을 보다가 시간 가는 줄 모른다. 오늘도 학교 수업을 마치고 친구 생일 선물을 사러 갔다가 한참 있었다. 문구점은 늘 새롭고 재미있다.", "s": "교과서 33쪽 그림일기 ②"}], "qs": ["글쓴이가 그 장소에서 한 일은 무엇인가요?", "글쓴이는 그 장소를 어떻게 느끼나요?"], "note": "<h3>그림일기 원문 (교과서 33쪽)<\/h3><ul><li>① “어머니와 동네에 있는 산에서 산책했다. 산책하면서 학교에서 있었던 일과 저녁에 먹을 음식도 이야기 나눴다. 특히 산책하다가 본 우리 동네 모습이 장난감처럼 작게 보여서 신기했다. 나는 어머니와 함께 산책할 수 있는 산이 있어서 참 좋다.”<\/li><li>② “우리 동네 문구점은 보물 창고 같다. 갈 때마다 새로운 물건을 보다가 시간 가는 줄 모른다. 오늘도 학교 수업을 마치고 친구 생일 선물을 사러 갔다가 한참 있었다. 문구점은 늘 새롭고 재미있다.”<\/li><\/ul><h3>예상 반응<\/h3><ul><li>산: 한 일 — 어머니와 산책했어요. 학교에서 있었던 일과 저녁에 먹을 음식을 이야기했어요. 느낌 — 동네 모습이 장난감처럼 작게 보여서 신기했어요. 산이 있어서 참 좋아요.<\/li><li>문구점: 한 일 — 친구 생일 선물을 사러 갔어요. 느낌 — 보물 창고 같아요. 늘 새롭고 재미있어요.<\/li><\/ul><h3>유의할 점<\/h3><p>이 단계는 채점하지 않습니다. 글에 있는 문장(예: ‘동네 모습이 장난감처럼 작게 보여서 신기했다’)을 찾은 답은 모두 맞는 답입니다. 기존 차시 화면에서 이 문장을 오답으로 처리했다가 고친 적이 있으니(지도서 대조 검증) 발문으로만 다루세요.<\/p>"}, {"k": "task", "t": "생각을 펼쳐요", "min": 15, "hd": "둘 중 하나를 골라 만들고 발표해요", "ask": "선택 1 그림일기 또는 선택 2 입체 모형 (교과서 33~34쪽)", "list": ["📔 선택 1: 한 장소를 골라 경험과 느낌이 드러나게 그림일기를 만들어 발표해요.", "📦 선택 2-①: 모둠에서 기억에 남는 장소를 이야기해요.", "📦 선택 2-②: 표현할 장소를 나누어 맡아요.", "📦 선택 2-③: 맡은 장소를 도화지, 색종이, 종이 상자로 입체 모형으로 만들어요.", "📦 선택 2-④: 만든 장소들을 모아 알맞게 배치하고 꾸며요."], "tip": "친구가 발표할 때, 같은 장소에서 나는 어떤 경험을 했는지 떠올려 봐요.", "note": "<h3>선택 활동 1 그림일기 (교과서 33쪽, 지도서 69쪽)<\/h3><ul><li>“우리가 사는 곳의 여러 장소 가운데 한 장소를 골라 그림일기를 만들어 발표해 봅시다.” 준비물: 색칠 도구<\/li><li>“우리가 사는 곳의 여러 장소와 관련한 경험을 생각해 보고, 경험을 바탕으로 그림일기를 꾸미도록 지도한다.” “장소에 관한 생각과 느낌이 잘 드러나게 표현하도록 지도한다.”<\/li><li>“친구들이 그림일기를 발표할 때 같은 장소에서 자기는 어떤 경험을 했는지 떠올려 보도록 지도한다.” → 화면 도움말(💡)<\/li><\/ul><h3>선택 활동 2 입체 모형 (교과서 34쪽, 지도서 69쪽)<\/h3><ul><li>순서: ① 우리가 사는 곳에서 기억에 남는 장소를 이야기합니다. ② 표현할 장소를 나누어 맡습니다. ③ 각자 맡은 장소를 도화지나 색종이, 종이 상자 등을 이용해 입체 모형으로 만듭니다. ④ 만든 장소들을 모아 알맞게 배치하고 꾸밉니다. 준비물: 도화지, 색종이, 종이 상자, 가위, 풀, 색칠 도구<\/li><li>“입체 모형을 만들기 전에 다양한 장소에 관해 먼저 이야기를 나누도록 안내한다.” “장소의 특징이 잘 나타나도록 친구들과 역할을 나누어 입체 모형을 만들도록 한다.”<\/li><li>“가위나 칼 등의 도구를 사용할 때는 다치지 않도록 안전에 유의한다.”<\/li><\/ul><h3>발표(P)<\/h3><p>완성한 모둠(또는 개인)부터 🎲 발표자 뽑기로 발표합니다. 발표 틀: “제가 고른 장소는 ○○이에요. 거기서 ~을 했고, ~한 느낌이 들었어요.” 듣는 친구는 같은 장소에서 자기 경험을 한 가지 덧붙입니다.<\/p><h3>유의할 점<\/h3><p>그림일기에 가족과 함께한 경험을 쓰도록 강요하지 않고, 혼자 또는 친구와 한 경험도 충분하다고 안내합니다. 작품은 채점하지 않습니다.<\/p>"}, {"k": "sort", "t": "확인해요", "min": 5, "hd": "맞는 설명일까요, 틀린 설명일까요?", "ask": "①~⑦을 나눈 뒤, 교과서 35쪽 그림판을 색칠해요.", "bins": [{"k": "o", "n": "맞아요 ◯", "e": "⭕", "c": "#1F9E63"}, {"k": "x", "n": "틀려요 ✕", "e": "❌", "c": "#E0506B"}], "items": [{"k": "o", "e": "1️⃣", "x": "사람마다 장소에 관한 생각이 다를 수 있습니다.", "w": "맞아요. 사람마다 경험이 달라 생각도 다를 수 있어요. (그림판 빨간색)"}, {"k": "o", "e": "2️⃣", "x": "나와 친구의 장소에 관한 생각이 같을 수 있습니다.", "w": "맞아요. 생각이 같을 수도 있어요. (그림판 검은색)"}, {"k": "o", "e": "3️⃣", "x": "우리가 사는 곳에는 내가 모르는 장소도 있습니다.", "w": "맞아요. 친구 작품에서 처음 알게 된 장소도 있었어요. (그림판 노란색)"}, {"k": "x", "e": "4️⃣", "x": "사람들이 좋아하는 장소는 모두 같습니다.", "w": "틀려요. 좋아하는 장소는 사람마다 달라요. (그림판 흰색)"}, {"k": "x", "e": "5️⃣", "x": "장소를 표현하는 방법은 한 가지만 있습니다.", "w": "틀려요. 그림, 책, 신문 등 여러 방법이 있어요. (그림판 하늘색)"}, {"k": "o", "e": "6️⃣", "x": "장소에는 도서관, 공원, 산 등이 있습니다.", "w": "맞아요. (그림판 갈색)"}, {"k": "x", "e": "7️⃣", "x": "장소는 그림으로 표현하는 것이 가장 좋습니다.", "w": "틀려요. 어떤 방법이 가장 좋다고 정해져 있지 않아요. (그림판 파란색)"}], "after": "그림판을 색칠하면 무엇이 나타나나요? 민호가 가장 좋아하는 장소는 경찰서, 소방서, 버스 터미널 중 어디일까요?", "note": "<h3>진행 (교과서 35쪽)<\/h3><p>“장소에 관한 설명의 정답에 따라 그림판을 색칠하면 나타나는 그림을 참고하여 민호가 가장 좋아하는 장소에 ◯표 해 봅시다.” 화면에서 ①~⑦을 나누고, 설명 뒤 괄호의 색으로 교과서 그림판을 색칠합니다.<\/p><h3>정답 (교과서 35쪽)<\/h3><ul><li>① ◯ 빨간색 ② ◯ 검은색 ③ ◯ 노란색 ④ ✕ 흰색 ⑤ ✕ 하늘색 ⑥ ◯ 갈색 ⑦ ✕ 파란색<\/li><li>민호가 가장 좋아하는 장소: <b>소방서<\/b> (그림판에 소방차가 나타남)<\/li><\/ul><h3>유의할 점<\/h3><p>①~⑦은 교과서 문장 그대로이며 정 function renderQ(){const q=Q();$('qList').innerHTML=q.length?q.map((x,i)=>`<div class="qi s${x.s}"><div class="top"><span class="ty">${esc(x.ty)}</span><span class="q">${esc(x.t)}</span><span class="from">${esc(x.from)}</span><button class="stt" data-i="${i}">${STS[x.s]}</button><button class="stt" data-del="${i}" aria-label="지우기">✕</button></div>${x.s>0?`<input data-a="${i}" value="${esc(x.a)}" placeholder="찾은 답과 근거 (예: 자료 ②를 보니 …)">`:''}</div>`).join(''):'<p class="ask">아직 질문이 없어요. 첫 질문을 올려 보세요!</p>';
 $('qList').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const q=Q();q[+b.dataset.i].s=(q[+b.dataset.i].s+1)%3;setQ(q);renderQ()});
 $('qList').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const q=Q();q.splice(+b.dataset.del,1);setQ(q);renderQ()});
 $('qList').querySelectorAll('[data-a]').forEach(inp=>inp.onchange=()=>{const q=Q();q[+inp.dataset.a].a=inp.value;setQ(q)});}
$('qAdd').onclick=()=>{addQ($('qText').value,$('qType').value);$('qText').value=''};
$('qText').onkeydown=e=>{if(e.key==='Enter')$('qAdd').onclick()};
$('qbBtn').onclick=$('qb0').onclick=()=>{renderQ();openO('qbO')};
$('qPrint').onclick=()=>{const p=$('qbPanel');p.classList.add('printme');window.print();p.classList.remove('printme')};
$('qClear').onclick=()=>{if(confirm('질문 판을 모두 비울까요? (이 주제의 모든 차시에서 지워져요)')){setQ([]);renderQ()}};
(function(){const q=Q();if(!q.some(x=>x.t===C.topic.bq)){q.unshift({t:C.topic.bq,ty:'왜',s:0,a:'',from:'🌟 핵심 질문',id:1});setQ(q)}})();
qCount();
/* 발표자 뽑기 */
let drawn=LS.get('soopPick',[]);
function pkLeft(){const m=+$('pkMax').value||25;$('pkLeft').textContent=`아직 말하지 않은 친구 ${m-drawn.filter(n=>n<=m).length}명`}
$('pickBtn').onclick=()=>{pkLeft();openO('pkO')};
$('pkGo').onclick=()=>{const m=+$('pkMax').value||25;let pool=[];for(let i=1;i<=m;i++)if(!drawn.includes(i))pool.push(i);if(!pool.length){drawn=[];pool=[...Array(m)].map((_,i)=>i+1)}
 const n=pool[Math.floor(Math.random()*pool.length)];drawn.push(n);LS.set('soopPick',drawn);let k=0;const t=setInterval(()=>{$('pkN').textContent=pool[Math.floor(Math.random()*pool.length)]+'번';if(++k>10){clearInterval(t);$('pkN').textContent=n+'번';pkLeft()}},60)};
$('pkReset').onclick=()=>{drawn=[];LS.set('soopPick',drawn);$('pkN').textContent='?';pkLeft()};
/* 타이머 */
let T=null,left=0;function stopT(){clearInterval(T);T=null}
function showT(){$('tm').textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`}
$('timerBtn').onclick=()=>{if(T){stopT();return}left=left>0?left:C.steps[step].min*60;T=setInterval(()=>{left--;showT();if(left<=0){stopT();$('timerBtn').style.borderColor='var(--no)'}},1000);showT()};
/* 사진 */
function img(p,cls){const x=PH[p];return x?`<img src="${x.data}" alt="${esc(x.name)}" data-ph="${p}" ${cls?`class="${cls}"`:''}>`:''}
function wireImgs(){document.querySelectorAll('#body img[data-ph]').forEach(im=>im.onclick=()=>{const p=PH[im.dataset.ph];$('bvI').src=p.data;$('bvM').textContent=`${p.name} — ${p.title} / ${p.artist||'작자 미상'} / ${p.lic} / 위키미디어 공용`;$('bv').classList.add('on')})}
$('bvX').onclick=()=>$('bv').classList.remove('on');
/* 붙임쪽지 칸 */
function col(id,title,color,frame,opts={}){return `<div class="col${opts.cmp?' cmp':''}" style="--cc:${color}"><h3>${title}</h3>${frame?`<p class="frame">${esc(frame)}</p>`:''}<div class="notes" id="n-${id}"></div><div class="add"><input id="i-${id}" placeholder="${esc(opts.ph||frame||'생각을 써요')}"><button data-add="${id}">붙이기</button></div></div>`}
function drawNotes(id,toBoard){const arr=LS.get(LK+id,[]);const box=$('n-'+id);if(!box)return;
 box.innerHTML=arr.map((t,i)=>`<div class="note"><span>${esc(t)}</span><span>${toBoard?`<button class="up" data-up="${i}">질문 판에 ↑</button>`:''}<button class="x" data-x="${i}" aria-label="지우기">✕</button></span></div>`).join('');
 box.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{arr.splice(+b.dataset.x,1);LS.set(LK+id,arr);drawNotes(id,toBoard)});
 box.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{addQ(arr[+b.dataset.up],'그 밖에');b.textContent='올렸어요 ✓';b.disabled=true});}
function wireCols(ids,boardIds=[]){ids.forEach(id=>{const inp=$('i-'+id),btn=document.querySelector(`[data-add="${id}"]`);const f=()=>{const v=inp.value.trim();if(!v)return;const a=LS.get(LK+id,[]);a.push(v);LS.set(LK+id,a);inp.value='';drawNotes(id,boardIds.includes(id))};btn.onclick=f;inp.onkeydown=e=>{if(e.key==='Enter')f()};drawNotes(id,boardIds.includes(id))})}
/* 단계 그리기 */
function stepsBar(){$('steps').innerHTML=C.steps.map((s,i)=>`<button class="st ${i===step?'now':i<step?'done':''}" data-i="${i}">${i+1}. ${esc(s.t)}</button>`).join('');$('steps').querySelectorAll('.st').forEach(b=>b.onclick=()=>go(+b.dataset.i))}
function go(i){step=i;stopT();left=0;$('tm').textContent='--:--';$('timerBtn').style.borderColor='';show('lesson');render()}
$('prev').onclick=()=>step>0?go(step-1):show('cover');$('next').onclick=()=>step<C.steps.length-1?go(step+1):show('cover');
function render(){const s=C.steps[step];stepsBar();const r=ROUT[s.k]||['•',''];$('rt').textContent=`${r[0]} ${s.routine||r[1]} · ${s.min}분`;$('hd').textContent=s.hd||s.t;$('ask').textContent=s.ask||'';
 $('next').textContent=step<C.steps.length-1?'다음 →':'마치기 ✓';(R[s.k]||R.talk)(s,'s'+step);wireImgs();$('body').scrollTop=0}
const R={};
const bars=(d,unit,max,h)=>{const m=max||Math.max(...d.map(x=>x[1]));return `<div class="bars" style="--bh:${h}">${d.map(([l,v,fx])=>`<div class="bc"><div class="bw"><span class="bb${fx?' fx':''}" style="height:${(v/m*100).toFixed(1)}%"><span class="bv">${v}<i>${esc(unit||'')}</i></span></span></div><div class="bl">${esc(l)}</div></div>`).join('')}</div>`};
R.see=(s,id)=>{$('body').innerHTML=`<div class="split wrap">${s.chart?`<div class="chart"><div class="ct">${esc(s.chart.t)}</div>${bars(s.items.map(it=>[it.cap,it.v,it.fx]),s.chart.unit,s.chart.max,'clamp(140px,calc(var(--vh,1vh)*22),300px)')}<small>${esc(s.chart.src||'')}</small></div>`:`<div class="gal">${s.items.map(it=>`<div class="pic">${it.p?img(it.p):`<span class="e">${it.e}</span>`}<b>${esc(it.cap||'')}</b>${it.sub?`<small>${esc(it.sub)}</small>`:''}</div>`).join('')}</div>`}
 <div class="cols" style="--n:3">${col(id+'a','👀 보여요','#2F74E0',s.f?.[0]||'무엇이 보이나요?')}${col(id+'b','💭 생각해요','#6A4FC9',s.f?.[1]||'무엇이라고 생각하나요?')}${col(id+'c','❓ 궁금해요','#E8961E',s.f?.[2]||'무엇이 궁금한가요?',{ph:'질문을 써요'})}</div></div>`;
 wireCols([id+'a',id+'b',id+'c'],[id+'c'])};
R.sort=(s,id)=>{let deck=[...s.items],i=0,done=[];const bins=s.bins;
 const draw=()=>{if(i>=deck.length){$('body').innerHTML=`<div class="sorted" style="--n:${bins.length}">${bins.map(b=>`<div style="--cc:${b.c}"><b>${b.e} ${esc(b.n)}</b><br>${done.filter(d=>d.k===b.k).map(d=>'· '+esc(d.x)).join('<br>')}</div>`).join('')}</div>${s.after?`<div class="after">💬 ${esc(s.after)}</div>`:''}${s.col?`<div class="cols" style="--n:1;width:min(1000px,100%)">${col(id+'z',s.col,'#E8961E','',{ph:s.colph||'생각을 써요',cmp:1})}</div>`:''}`;if(s.col)wireCols([id+'z']);return}
  const it=deck[i];$('body').innerHTML=`<div class="deck"><p class="ask">${i+1} / ${deck.length}</p><div class="card1">${it.p?img(it.p):`<span class="e">${it.e}</span>`}<span class="x">${esc(it.x)}</span></div>
  <div class="bins" style="--n:${bins.length}">${bins.map(b=>`<button class="bin" data-k="${b.k}" style="--cc:${b.c}"><span class="e">${b.e}</span>${esc(b.n)}${b.c2?`<span class="c">${esc(b.c2)}</span>`:''}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`;wireImgs();
  document.querySelectorAll('.bin').forEach(b=>b.onclick=()=>{const fb=$('fb');const open=it.k==='*';const ok=open||b.dataset.k===it.k;
   fb.className='fb on '+(open?'open':ok?'ok':'no');fb.innerHTML=(open?'<b>생각이 다를 수 있어요.</b> ':ok?'<b>맞아요!</b> ':'<b>다시 생각해 봐요.</b> ')+esc(it.w||'')+(ok?` <button class="ghost" id="nx" style="margin-left:8px">다음 카드</button>`:'');
   if(ok){done.push({k:open?b.dataset.k:it.k,x:it.x});document.querySelectorAll('.bin').forEach(x=>x.disabled=true);$('nx').onclick=()=>{i++;draw()};$('nx').focus()}})};draw()};
R.define=(s,id)=>{const saved=LS.get(LK+id+'d','');$('body').innerHTML=`<div class="chips">${s.words.map(w=>`<button class="chip" aria-pressed="false">${esc(w)}</button>`).join('')}</div>
 <div class="frameline">${esc(s.frame[0])} <input id="dIn" value="${esc(saved)}" placeholder="우리 반 생각"> ${esc(s.frame[1])}</div>
 <button class="big-btn" id="dShow" style="font-size:clamp(19px,calc(var(--vw,1vw)*1.8),25px);padding:8px 24px">📖 ${esc(s.btn||'교과서 뜻과 비교하기')}</button>
 <div class="book" id="book"><small>${esc(s.bookLabel||'교과서 뜻')} (${esc(s.src)})</small><br><b>${s.book}</b></div>
 <div class="cols" style="--n:2">${col(id+'s','🤝 우리 뜻과 같은 점','#1F9E63','')}${col(id+'n','✨ 새로 알게 된 점','#2F74E0','')}</div>`;
 document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{c.setAttribute('aria-pressed',c.getAttribute('aria-pressed')==='true'?'false':'true');const inp=$('dIn');if(c.getAttribute('aria-pressed')==='true'){inp.value=(inp.value?inp.value+' ':'')+c.textContent;LS.set(LK+id+'d',inp.value)}});
 $('dIn').oninput=()=>LS.set(LK+id+'d',$('dIn').value);$('dShow').onclick=()=>{$('book').classList.add('on');$('book').scrollIntoView({block:'center',behavior:'smooth'})};wireCols([id+'s',id+'n'])};
R.cards=(s,id)=>{$('body').innerHTML=`<div class="gal wrap">${s.cards.map((c,i)=>`<div class="pic" style="border-color:${c.c||'var(--line)'}"><span class="num">자료 ${i+1}</span>${c.p?img(c.p):c.bars?'':`<span class="e">${c.e}</span>`}<b>${esc(c.t)}</b>${c.bars?`<div class="sm">${bars(c.bars,'',c.max,'clamp(110px,calc(var(--vh,1vh)*19),190px)')}</div>${c.unit?`<small>(단위: ${esc(c.unit)})</small>`:''}`:`<span style="font-size:clamp(15px,calc(var(--vw,1vw)*1.45),19px)">${esc(c.d)}</span>`}<small>${esc(c.s||'')}</small></div>`).join('')}</div>${s.qs?`<div class="after wrap">💬 ${s.qs.map(esc).join('<br>💬 ')}</div>`:''}`};
R.csq=(s,id)=>{const q=Q().filter(x=>x.s<2);const store=LS.get(LK+id+'log',[]);const nC=(s.cards||[]).length;
 $('body').innerHTML=`<div class="qpick"><b style="font-family:var(--display);font-weight:400">🎯 함께 답할 질문</b><select id="qSel">${[...new Set([...(s.qs||[]),...q.map(x=>x.t)])].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>
 ${nC?`<div class="mini wrap">${s.cards.map((c,i)=>c.bars?`<div class="m mb"><div style="flex:1;min-width:0"><span class="num">자료 ${i+1}</span> <b style="display:inline">${esc(c.t)}</b><div class="sm">${bars(c.bars,'',c.max,'clamp(92px,min(calc(var(--vh,1vh)*14),calc(var(--vw,1vw)*11)),160px)')}</div><small>${c.unit?`(단위: ${esc(c.unit)}) `:''}${esc(c.s||'')}</small></div></div>`:`<div class="m">${c.p?img(c.p):`<span class="e">${c.e}</span>`}<div><span class="num">자료 ${i+1}</span> <b style="display:inline">${esc(c.t)}</b><span class="d">${esc(c.d)}</span><small>${esc(c.s||'')}</small></div></div>`).join('')}</div>`:''}
 <div class="csq">
  <div class="col cmp" style="--cc:#2F74E0"><h3>🗣️ 주장</h3><p class="frame">나는 ~라고 생각해요.</p><textarea id="cl" rows="2" placeholder="나는 ~라고 생각해요." style="font-family:var(--body);font-size:clamp(17px,calc(var(--vw,1vw)*1.6),21px);border:3px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:6px"></textarea></div>
  <div class="col cmp" style="--cc:#1F9E63"><h3>📑 근거</h3><p class="frame">왜냐하면 자료 ○을 보면 ~이기 때문이에요.</p><div class="evi">${[...Array(nC)].map((_,i)=>`<button aria-pressed="false" data-e="${i+1}">자료 ${i+1}</button>`).join('')}</div><input id="ev" placeholder="왜냐하면 자료 ○을 보면 ~" style="font-family:var(--body);font-size:clamp(16px,calc(var(--vw,1vw)*1.5),20px);border:3px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:6px"></div>
  <div class="col cmp" style="--cc:#E8961E"><h3>❓ 되묻기</h3><p class="frame">친구에게 더 묻고 싶은 것은?</p><input id="bq" placeholder="예: 그럼 ~는 어떨까?" style="font-family:var(--body);font-size:clamp(16px,calc(var(--vw,1vw)*1.5),20px);border:3px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:6px"><button class="big-btn" id="csqSave" style="font-size:clamp(18px,calc(var(--vw,1vw)*1.7),23px);padding:6px 20px;align-self:flex-end">✔ 기록하기</button></div>

 <div class="log wrap" id="csqLog"></div>`;

 document.querySelectorAll('.evi button').forEach(b=>b.onclick=()=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true'));

 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===q.a;if(ok)sc++;document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add('right')});if(!ok)b.classList.add('wrong');
