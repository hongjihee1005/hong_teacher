<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🧩 생각을 펼쳐요 / 재미있게 확인해요</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>:root{
  --bg:#EAF1F8; --paper:#FFFFFF; --ink:#1F2A44; --soft:#4F5B75; --line:#CAD6E4;
  --ok:#1F9E63; --no:#D2453A; --acc:#2F74E0;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#162034;--paper:#22304C;--ink:#F2F5FB;--soft:#B7C3DB;--line:#3A4C74;}
}
:root[data-theme="dark"]{--bg:#162034;--paper:#22304C;--ink:#F2F5FB;--soft:#B7C3DB;--line:#3A4C74;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:26px;overflow:hidden}
button{font-family:var(--display);color:inherit;cursor:pointer}
button:focus-visible{outline:5px solid var(--acc);outline-offset:4px}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:clamp(14px,2vw,30px)}
.screen.on{display:flex}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0}
.title{font-size:clamp(52px,7vw,100px);line-height:1.1;text-align:center}
.lead{font-size:clamp(24px,2.4vw,34px);color:var(--soft);margin:0;text-align:center;word-break:keep-all}
.center-col{align-items:center;justify-content:center;gap:clamp(14px,2.2vh,28px);overflow-y:auto}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.row-label{font-family:var(--display);font-size:clamp(24px,2.2vw,32px)}
.seg{display:flex;border:3px solid var(--line);border-radius:18px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;font-size:clamp(22px,2vw,30px);padding:10px 20px;min-width:70px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.big-btn{font-size:clamp(32px,3.2vw,48px);padding:14px 50px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);box-shadow:0 6px 0 rgba(0,0,0,.25)}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.big-btn[disabled]{opacity:.35}
.ghost-btn{font-size:clamp(22px,2vw,30px);padding:10px 26px;border-radius:999px;border:3px solid var(--ink);background:transparent}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tools{display:flex;gap:10px;align-items:center}
.tool{font-size:24px;border:3px solid var(--line);background:var(--paper);border-radius:16px;padding:8px 16px}
.chip{font-family:var(--display);font-size:clamp(22px,2vw,30px);padding:6px 18px;border-radius:999px;background:var(--paper);border:3px solid var(--line)}
.chip.now{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip.win{border-color:#E8961E;background:#E8961E;color:#fff}
.scores{display:flex;gap:10px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(15,22,40,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.on{display:flex}
.panel{background:var(--paper);border-radius:28px;padding:clamp(24px,3vw,48px);width:min(1100px,94vw);max-height:92vh;overflow-y:auto;text-align:center;border-top:18px solid var(--pc,var(--ink))}
.panel h2{font-size:clamp(44px,5vw,72px);margin:0 0 10px}
.panel .why{font-size:clamp(28px,2.6vw,38px);line-height:1.55;margin:0 auto 22px;max-width:36em;word-break:keep-all}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}


.stagebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st{font-family:var(--display);cursor:pointer;font-size:clamp(19px,1.8vw,26px);padding:6px 14px;border-radius:999px;border:3px solid var(--line);background:var(--paper);color:var(--soft)}
.st.now{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.st.done{border-color:var(--ok);color:var(--ok)}
.goal{font-family:var(--display);font-size:clamp(20px,1.9vw,28px);color:var(--soft);text-align:center;margin:4px 0 0}
.body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:clamp(10px,1.6vh,20px);overflow-y:auto;padding:6px 0}
.hd{font-family:var(--display);font-size:clamp(30px,3.3vw,48px);text-align:center;margin:0}
.expq ul,.sumbox ul{margin:4px 0 0;padding-left:1.2em}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:6px}
.tnote{border:3px solid #6A4FC9;color:#6A4FC9;background:var(--paper);border-radius:16px;padding:8px 18px;font-size:clamp(19px,1.8vw,25px)}
.recall{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:min(1200px,96vw)}
.rc{position:relative;min-height:clamp(170px,23vh,250px);border:0;background:none;perspective:1200px;font-family:var(--body)}
.rc .in{position:absolute;inset:0;transition:transform .5s;transform-style:preserve-3d}
.rc.open .in{transform:rotateY(180deg)}
.rc .f{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.rc .front{background:var(--cc);color:#fff;font-family:var(--display);font-size:clamp(25px,2.6vw,36px)}
.rc .front span{font-size:clamp(46px,4.6vw,68px)}
.rc .front img,.card1 img.cphoto{border-radius:14px;object-fit:cover}
.rc .front img{width:100%;flex:1 1 0;min-height:0;height:auto;}
.rc .front{overflow:hidden;line-height:1.2}
.rc .front small{flex:none}
.card1 img.cphoto{width:clamp(150px,22vw,300px);aspect-ratio:4/3;border:3px solid var(--line);cursor:zoom-in}
.zoomhint{display:block;font-size:14px;color:var(--soft);text-align:center;margin-top:4px}
.bigview{position:fixed;inset:0;background:rgba(8,12,22,.95);display:none;align-items:center;justify-content:center;z-index:30;padding:6px}
.bigview.on{display:flex}
.bigview img{max-width:98vw;max-height:88vh;border-radius:12px}
.bigview .close{position:fixed;top:14px;right:16px;font-size:28px;border:0;border-radius:50%;width:60px;height:60px;background:rgba(255,255,255,.9);color:#1F2A44}
.bigview .meta{position:fixed;left:0;right:0;bottom:0;padding:10px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;text-align:center}
.bigview .meta b{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.4vw,32px);display:block}
.bigview .meta small{color:#dbe3f0;font-size:14px}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px;width:min(1250px,96vw)}
.ec{background:var(--paper);border-radius:20px;border-top:12px solid var(--cc);padding:12px 16px;text-align:left}
.ec img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;cursor:zoom-in;border:3px solid var(--line)}
.ec .num{font-family:var(--display);font-size:clamp(34px,3.6vw,52px);color:var(--cc);line-height:1.1}
.ec b{font-family:var(--display);font-weight:400;font-size:clamp(21px,2.1vw,28px);display:block;margin-top:6px}
.ec p{font-size:clamp(18px,1.8vw,24px);line-height:1.45;margin:4px 0 0}
.ec small{font-size:14px;color:var(--soft);display:block;margin-top:6px}
.expq{background:#FFF4D6;color:#1F2A44;border:4px solid #E8961E;border-radius:20px;padding:12px 20px;width:min(1250px,96vw);font-size:clamp(21px,2.1vw,30px);text-align:left}
.expq b{font-family:var(--display);font-weight:400;display:block;margin-bottom:4px}
.expq li{margin-bottom:4px}
.howbtn{border:3px solid #6A4FC9;color:#6A4FC9;background:var(--paper);border-radius:16px;padding:8px 20px;font-size:clamp(19px,1.8vw,25px)}
.lklist{display:grid;gap:12px;text-align:left;margin-bottom:18px}
.lkrow{display:flex;gap:14px;align-items:center;background:var(--bg);border-radius:16px;padding:12px 18px;text-decoration:none;color:inherit;border:3px solid var(--line)}
.lkrow:hover{border-color:var(--ink)}
.lkrow .e{font-size:clamp(30px,3vw,42px)}
.lkrow b{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.2vw,30px);display:block}
.lkrow small{color:var(--soft);font-size:clamp(17px,1.7vw,22px)}
.rc .back2{background:var(--paper);border:5px solid var(--cc);transform:rotateY(180deg);font-size:clamp(21px,2.1vw,29px)}
.qbox{background:#FFF4D6;color:#1F2A44;border:5px solid #E8961E;border-radius:26px;padding:clamp(16px,2.2vw,30px);width:min(1100px,94vw);text-align:center;font-family:var(--display);font-size:clamp(28px,3.1vw,46px);line-height:1.4}
.card1{width:min(1100px,92vw);background:var(--paper);border-radius:26px;border:4px solid var(--line);padding:clamp(16px,2.2vw,32px);display:flex;gap:clamp(16px,3vw,36px);align-items:center;justify-content:center}
.card1 .e{font-size:clamp(60px,7vw,110px);line-height:1;flex:none}
.card1 .x{font-family:var(--display);font-size:clamp(28px,3.4vw,50px);line-height:1.35}
.bins{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:clamp(10px,1.6vw,20px);width:min(1200px,96vw)}
.bin{border:0;background:var(--cc);color:#fff;border-radius:40px 40px 18px 18px;padding:clamp(14px,2vh,24px) 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 7px 0 rgba(0,0,0,.22)}
.bin .e{font-size:clamp(38px,4.4vw,66px);line-height:1}
.bin .n{font-size:clamp(24px,2.6vw,38px);text-align:center}
.bin .k{position:absolute;left:12px;bottom:8px;font-size:18px;opacity:.8}
.bin:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.22)}
.bin.lit{outline:6px solid var(--ink);outline-offset:4px}
.prob{width:min(1150px,95vw);background:var(--paper);border:5px solid var(--pc2);border-radius:24px;padding:clamp(12px,1.8vw,24px);display:flex;gap:18px;align-items:center}
.prob .e{font-size:clamp(44px,4.6vw,70px)}
.prob b{font-family:var(--display);font-weight:400;font-size:clamp(26px,2.8vw,40px);display:block;color:var(--pc2)}
.prob p{margin:4px 0 0;font-size:clamp(20px,2.1vw,30px)}
.ways{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(1200px,96vw)}
.way{border:4px solid var(--line);background:var(--paper);border-radius:18px;padding:10px 12px;font-family:var(--body);font-size:clamp(19px,1.9vw,26px);text-align:center;min-height:clamp(86px,11vh,132px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.way span{font-size:clamp(28px,2.8vw,40px)}
.way[aria-pressed="true"]{border-color:var(--ink);background:var(--bg);box-shadow:inset 0 0 0 4px var(--ink)}
.way.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--paper))}
.way.miss{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,var(--paper))}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:min(1150px,95vw)}
.sumbox{background:var(--paper);border-radius:22px;border-top:14px solid var(--cc);padding:16px 22px}
.sumbox b{font-family:var(--display);font-weight:400;font-size:clamp(25px,2.6vw,36px);display:block;margin-bottom:6px}
.sumbox li{font-size:clamp(21px,2.1vw,29px);line-height:1.5;margin-bottom:4px}
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(1000px,94vw)}
.opt2{border:4px solid var(--line);background:var(--paper);border-radius:18px;padding:12px 18px;font-family:var(--body);font-size:clamp(23px,2.4vw,33px)}
.opt2.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--paper))}
.opt2.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 14%,var(--paper))}
.fix{background:var(--bg);border-radius:18px;padding:12px 20px;font-size:clamp(23px,2.3vw,32px);margin:0 auto 18px;max-width:34em;text-align:left}
.promise{width:min(1100px,94vw);display:grid;gap:10px}
.promise div{background:var(--paper);border-radius:16px;padding:12px 20px;font-size:clamp(23px,2.2vw,32px);border-left:14px solid var(--ok)}
.tpanel{text-align:left}
.tpanel h3{font-family:var(--display);font-weight:400;font-size:clamp(24px,2.2vw,32px);margin:14px 0 6px;color:#6A4FC9}
.tpanel li,.tpanel p{font-size:clamp(20px,1.9vw,26px);line-height:1.55}

/* 크롬북(가로 1366×680)처럼 낮은 화면: 한 화면에 들어오도록 조금 촘촘하게 */
@media (max-height:760px) and (min-width:900px){
 .screen{padding:10px 20px}
 .body{gap:8px;padding:2px 0}
 .hd{font-size:clamp(26px,2.6vw,38px)}
 .goal{font-size:clamp(18px,1.6vw,24px);margin:0}
 .ec{padding:8px 12px;border-top-width:9px}
 .ec img{aspect-ratio:16/9}
 .ec .num{font-size:clamp(28px,2.8vw,42px)}
 .ec p{font-size:clamp(17px,1.5vw,22px)}
 .expq{padding:8px 16px;font-size:clamp(19px,1.7vw,25px)}
 .expq li{margin-bottom:0}
 .rc{min-height:clamp(150px,26vh,210px)}
 .card1{padding:12px 20px}
 .card1 .e{font-size:clamp(50px,5vw,80px)}
 .card1 .x{font-size:clamp(25px,2.6vw,40px)}
 .bin{padding:10px 8px}
 .bin .e{font-size:clamp(32px,3.4vw,50px)}
 .ways{grid-template-columns:repeat(5,1fr);gap:8px}
 .way{min-height:58px;padding:6px 10px;flex-direction:row;gap:8px;font-size:clamp(18px,1.6vw,23px)}
 .way span{font-size:clamp(24px,2.2vw,32px)}
 .prob{padding:8px 16px}
 .prob .e{font-size:clamp(36px,3.6vw,54px)}
 .prob b{font-size:clamp(23px,2.3vw,33px)}
 .prob p{font-size:clamp(18px,1.8vw,26px)}
 .sumbox{padding:10px 16px}
 .sumbox li{font-size:clamp(19px,1.7vw,25px);margin-bottom:2px}
 .qbox{padding:12px 20px}
 .promise div{padding:8px 16px;font-size:clamp(20px,1.9vw,28px)}
 .opt2{padding:8px 14px;font-size:clamp(21px,2vw,29px)}
 .foot{padding-top:2px}
}
@media (max-width:860px){.recall,.ways,.sum,.opts2,.bins{grid-template-columns:1fr 1fr}.way{min-height:72px;flex-direction:row;gap:8px}}

body,h1,h2,h3,h4,p,li,span,div,button,a,td,th,small,b,i{word-break:keep-all;overflow-wrap:break-word;line-break:strict}
.creditbar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;margin-top:16px}
.creditbar .madeby{width:100%}
.tolist{display:none;align-items:center;gap:8px;font-family:var(--display,sans-serif);font-size:clamp(20px,2vw,26px);
  text-decoration:none;color:inherit;border:3px solid var(--line,#ccc);background:var(--paper,#fff);border-radius:999px;padding:8px 22px}
.tolist.on{display:inline-flex}
.rel.on{display:grid!important}
.madeby{font-size:16px;color:var(--soft,#666);opacity:.85;text-align:center;font-family:var(--body,sans-serif)}

h1,h2,h3,h4,.title,.hd,.qt,.x,.n,.nm,.big,.lead,.sit,.ask,.qtext,.front .n,.slot b,.dc h3,.lk b,.rl b{text-wrap:balance}
p,li,small,.d,.ex,.why,.blurb,.ask2,.sub,.msg,.notice,.fix,.retry div,.opt,.opt2,.way,.mbox .n,.dc p,.lk small,.rl small{text-wrap:pretty}

@media (prefers-color-scheme:light){html:root:not([data-theme="dark"]){--bg:#F6F5F1;--paper:#FFFFFF;--ink:#141A26;--soft:#4B5465;--muted:#4B5465;--line:#E3E0D8;--warmline:#E3E0D8}}
html:root[data-theme="light"]{--bg:#F6F5F1;--paper:#FFFFFF;--ink:#141A26;--soft:#4B5465;--muted:#4B5465;--line:#E3E0D8;--warmline:#E3E0D8}
@media (prefers-color-scheme:dark){html:root:not([data-theme="light"]){--bg:#0E131B;--paper:#151C27;--ink:#E8ECF3;--soft:#A7B1C2;--muted:#A7B1C2;--line:#253042}}
html:root[data-theme="dark"]{--bg:#0E131B;--paper:#151C27;--ink:#E8ECF3;--soft:#A7B1C2;--muted:#A7B1C2;--line:#253042}
html body{-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
html h1,html h2,html h3{letter-spacing:-.025em}
html:root{--night:#1E2D4A;--night2:#4B5465;--pine:#5C9A7C;--pine-soft:#E6F3EC}
/* ── 수업 세트 공통 틀(첫 화면·진행 화면) 다듬기: 얇은 선, 부드러운 그림자, 정돈된 글자 크기 ── */
html body .title{font-size:clamp(34px,min(4.8vw,8.5vh),66px);font-weight:800;letter-spacing:-.035em;line-height:1.2}
html body .lead{font-size:clamp(17px,1.6vw,22px);font-weight:600;color:var(--soft);letter-spacing:-.01em}
html body .qbox{background:var(--hjs-soft,color-mix(in srgb,#2B4A7C 8%,var(--paper)));border:0;border-left:8px solid transparent;border-radius:20px;font-size:clamp(20px,2.1vw,30px)!important;font-weight:700;line-height:1.55;
 box-shadow:0 1px 2px rgba(80,55,30,.05),0 16px 32px -22px rgba(80,55,30,.4)}
html body .stagebar{gap:8px}
html body .st{border-width:1.5px;font-size:clamp(15px,1.35vw,19px);font-weight:600;padding:6px 14px;background:var(--paper)}
html body .st.now{font-weight:700}
html body .seg{border:1.5px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(80,55,30,.05)}
html body .seg button{font-size:clamp(17px,1.55vw,22px);font-weight:600;padding:9px 16px}
html body .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
html body .row-label{font-size:clamp(17px,1.6vw,22px);font-weight:700;color:var(--soft)}
html body .big-btn{font-size:clamp(22px,2.3vw,32px);font-weight:800;letter-spacing:-.01em;padding:14px 48px;
 box-shadow:0 2px 4px rgba(40,25,10,.12),0 14px 26px -12px rgba(40,25,10,.5)}
html body .big-btn:active{transform:translateY(2px);box-shadow:0 1px 2px rgba(40,25,10,.2)}
html body .mid-btn{font-size:clamp(18px,1.7vw,24px);font-weight:700;padding:11px 28px;box-shadow:0 2px 4px rgba(40,25,10,.12),0 10px 20px -12px rgba(40,25,10,.45)}
html body .mid-btn:active{transform:translateY(2px);box-shadow:none}
html body .ghost-btn{border:1.5px solid var(--line);background:var(--paper);font-size:clamp(17px,1.6vw,22px);font-weight:700;padding:10px 24px}
html body .tnote{border-width:1.5px;border-radius:999px;font-size:clamp(16px,1.5vw,20px);font-weight:700;padding:9px 18px}
html body .tool{border-width:1.5px;border-radius:12px;font-size:19px;padding:7px 12px}
html body .chip{border-width:1.5px;font-weight:600}
html body .tolist{border-width:1.5px;font-size:clamp(16px,1.5vw,19px);font-weight:700;padding:9px 18px}
html body .goal{font-size:clamp(16px,1.5vw,21px);font-weight:600}
html body .hd{font-weight:800;letter-spacing:-.03em;font-size:clamp(26px,2.8vw,42px);line-height:1.35}
html body .overlay{background:rgba(42,34,28,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
html body .panel{border:0;border-radius:24px;box-shadow:0 30px 60px -24px rgba(40,25,10,.5)}
html body .panel h2{font-size:clamp(30px,3.6vw,50px);font-weight:800;letter-spacing:-.03em}
html body .panel .why{font-size:clamp(20px,2.1vw,30px)}
html body :is(.card1,.book,.rec,.pw,.opt2,.oi,.mw,.mm,.wf,.ln,.lkrow,.bglog span){border-width:2px}
html body :is(.card1,.book,.rec,.sumbox,.talk .q,.fl,.promise div){box-shadow:0 1px 2px rgba(80,55,30,.05),0 12px 26px -20px rgba(80,55,30,.35)}
html body .wf :is(textarea,input){border-width:1.5px}
html body .ex{border-width:1.5px}
html body .card1 .x,html body .mw,html body .book .pg,html body .sumbox b{font-weight:700}
html body .hjfoot{border-top-width:1.5px}
html body:has(.screen.on:not(#cover)) #hj-home{display:none}
/* 선생님 버전(S.O.O.P.) 틀 */
html body .bq{border-width:2px;border-radius:20px;box-shadow:0 1px 2px rgba(80,55,30,.05),0 14px 28px -22px rgba(80,55,30,.4)}
html body .goalbox{border-width:0;border-left:8px solid transparent;background:var(--hjs-soft,color-mix(in srgb,#2B4A7C 8%,var(--paper)));border-radius:16px;font-weight:700}
html body .ghost{border-width:1.5px;font-weight:700}
html body .plan>*,html body .steps>*{border-width:1.5px}
html body .badge{font-weight:800}
html body .ask{font-weight:600}
/* 선 아이콘 */
html body .hj-i{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-.2em}
html body .hj-ic{display:inline-flex;align-items:center;justify-content:center;gap:.4em}
html body .hj-ionly{gap:0}
html body .tool.hj-hometool{border-radius:999px;padding:6px 15px 6px 12px;font-weight:700;font-size:17px;gap:6px}
/* 수업 세트 첫 화면 정리 */
html body .hj-cv{gap:clamp(12px,2vh,22px)!important}
html body .hj-cvtop{width:min(1100px,94vw);display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;min-height:0}
html body .hj-cvtop .tolist{margin:0}
html body .hj-cvpanel{width:min(1100px,94vw);background:var(--paper);border:1.5px solid var(--line);border-radius:24px;padding:clamp(16px,2vw,26px) clamp(18px,2.4vw,30px);
 display:grid;gap:clamp(12px,1.6vh,18px);box-shadow:0 1px 2px rgba(80,55,30,.05),0 18px 40px -28px rgba(80,55,30,.45);text-align:left}
html body .hj-cvpanel>.qbox,html body .hj-cvpanel>.goalbox,html body .hj-cvpanel>.bq,html body .hj-cvpanel>.map{width:auto!important;margin:0!important;box-shadow:none}
html body .hj-cvpanel>.qbox{text-align:left}
html body .hj-field{display:grid!important;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:8px 14px;justify-content:stretch!important;margin:0;
 padding-top:clamp(10px,1.4vh,16px);border-top:1.5px dashed var(--line)}
html body .hj-field>.stagebar,html body .hj-field>.plan{justify-content:flex-start!important;margin:0}
html body .hj-flabel{font-size:clamp(15px,1.35vw,18px)!important;font-weight:800;color:var(--soft);white-space:nowrap}
html body .hj-field.row>:nth-child(n+3){grid-column:2;font-size:clamp(14px,1.25vw,17px);color:var(--soft)}
html body .hj-field .seg{justify-self:start}
html body .hj-cvacts{gap:14px}
@media (max-width:720px){html body .hj-field{grid-template-columns:1fr}html body .hj-field.row>:nth-child(n+3){grid-column:1}}
html body .hj-field>*:not(.hj-flabel){justify-self:start;text-align:left;margin-left:0}
html body .hj-field>div>.seg{margin:0}
html body .hj-cvtop,html body .hj-cvpanel,html body .hj-cvacts{flex:none}
html body #cover{justify-content:safe center}
html body .hj-field #segTeam{justify-content:flex-start!important;align-items:flex-start!important;flex-direction:column;gap:6px!important}
html body .hj-field #segTeam-sub .row-label,html body .hj-field #segTeam~*{font-size:clamp(14px,1.25vw,17px)!important;font-weight:500;color:var(--soft)}
html body .hj-field .seg{justify-content:flex-start;width:auto}

/* 교사 안내 창 도구(인쇄·구글 문서·이메일) */
html body .hj-tbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px 0 4px;padding-top:18px;border-top:1px solid var(--line)}
html body .hj-tbar>button,html body .hj-mail button{display:inline-flex;align-items:center;gap:7px;font:700 16px/1.2 'Gowun Dodum',sans-serif;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;cursor:pointer}
html body .hj-tbar>button:hover,html body .hj-mail button:hover{background:var(--bg);border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
html body .hj-tbar .hj-i{width:18px;height:18px;flex:none}
html body .hj-mail{flex-basis:100%;display:grid;gap:8px;max-width:560px;margin:6px auto 0;text-align:left;background:var(--bg);border-radius:16px;padding:14px 16px}
html body .hj-mail[hidden]{display:none}
html body .hj-mail label{font-weight:700;font-size:16px}html body .hj-mail label small{font-weight:500;color:var(--soft);font-size:14px;margin-left:6px}
html body .hj-mail input{font:500 17px/1.4 'Gowun Dodum',sans-serif;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
html body .hj-mail div{display:flex;flex-wrap:wrap;gap:8px}html body .hj-mail p{margin:0;font-size:14px!important;color:var(--soft)}
html body .hj-toast{flex-basis:100%;margin:2px 0 0;min-height:1.3em;text-align:center;font-size:15px!important;color:var(--soft)}
@media print{
 body.hj-tprint>*:not(#tn){display:none!important}
 body.hj-tprint #tn{position:static!important;display:block!important;background:none!important;padding:0!important;inset:auto!important}
 body.hj-tprint #tn .panel{width:auto!important;max-height:none!important;overflow:visible!important;box-shadow:none!important;border:0!important;border-radius:0!important;padding:0!important;transform:none!important;animation:none!important}
 body.hj-tprint .hj-tbar,body.hj-tprint #tnClose{display:none!important}
 body.hj-tprint{background:#fff!important;color:#000}
 body.hj-tprint #tn .panel{padding:16mm!important}
}
/* 수업을 마쳤을 때 고르는 창 */
#hj-done{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:rgba(42,34,28,.38);backdrop-filter:blur(3px);animation:hjfade .2s ease}
@keyframes hjfade{from{opacity:0}to{opacity:1}}
#hj-done .hj-dp{width:min(560px,100%);background:var(--paper,#fff);color:var(--ink,#2A221C);border-radius:24px;padding:30px 28px 24px;text-align:center;box-shadow:0 30px 60px -24px rgba(40,25,10,.5);font-family:'Gowun Dodum',sans-serif;word-break:keep-all}
#hj-done .hj-dok{display:inline-grid;place-items:center;width:60px;height:60px;border-radius:18px;background:color-mix(in srgb,#7FB89A 22%,var(--paper,#fff));color:#3F7A5C}
#hj-done .hj-dok svg{width:32px;height:32px}
#hj-done h2{font-family:'Jua',sans-serif;font-size:clamp(26px,3vw,32px);margin:12px 0 4px;letter-spacing:-.03em}
#hj-done .hj-dl{margin:0 0 20px;color:var(--soft,#5C5047);font-size:17px}
#hj-done .hj-dn{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;text-align:left;text-decoration:none;color:#fff;background:var(--ink,#2A221C);border-radius:18px;padding:16px 20px}
#hj-done .hj-dn small{grid-column:1;font-size:14px;opacity:.75;font-weight:600}
#hj-done .hj-dn b{grid-column:1;font-size:clamp(18px,2vw,21px);line-height:1.4}
#hj-done .hj-dn svg{grid-column:2;grid-row:1/3;width:26px;height:26px}
#hj-done .hj-dn:hover{filter:brightness(1.15)}
#hj-done .hj-dlast{margin:0;padding:14px;border-radius:16px;background:var(--bg,#FFFCF8);color:var(--soft,#5C5047);font-size:17px}
#hj-done .hj-drow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
#hj-done .hj-db{flex:1 1 200px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 17px/1.2 'Gowun Dodum',sans-serif;color:var(--ink,#2A221C);background:var(--paper,#fff);border:1.5px solid var(--line,#EFE3D6);border-radius:999px;padding:12px 16px;text-decoration:none;cursor:pointer}
#hj-done .hj-db:hover{background:var(--bg,#FFFCF8)}
#hj-done .hj-db svg{width:20px;height:20px}
#hj-done :focus-visible{outline:3px solid #E0A458;outline-offset:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #hj-done .hj-dn{background:#F2EBE3;color:#221E1A}}
:root[data-theme="dark"] #hj-done .hj-dn{background:#F2EBE3;color:#221E1A}
html body .hj-pl{display:none}
@media print{body.hj-tprint .hj-pl{display:block;text-align:center;font-size:14px!important;color:#555;margin:0 0 4px}}
/* 사진 출처 줄이 화면 밖으로 넘치지 않게 */
html body #phc{white-space:normal!important;overflow-wrap:anywhere;max-width:min(1100px,100%);text-align:center;line-height:1.6;opacity:.85}
/* 홍지희 선생님 버전(SOOP) 첫 화면: 차분하고 읽기 쉽게 */
html body #cBadge{background:color-mix(in srgb,var(--sc) 14%,var(--paper));color:color-mix(in srgb,var(--sc) 78%,var(--ink));font-weight:700;font-size:clamp(15px,1.3vw,18px);padding:5px 14px;letter-spacing:-.01em}
html body #cover:has(#cBadge) .title{font-size:clamp(30px,min(4vw,7vh),52px);line-height:1.25}
html body #cBq{border:0;border-left:5px solid color-mix(in srgb,var(--sc) 55%,var(--paper));background:color-mix(in srgb,var(--sc) 6%,var(--paper));border-radius:16px;padding:14px 22px;text-align:left;box-shadow:none}
html body #cBq>*:first-child:not(b){font-size:15px!important;font-weight:700;color:var(--soft)}
html body #cBq b{display:block;font-weight:700;font-size:clamp(20px,2vw,27px);line-height:1.4;margin-top:2px}
html body #cGoal{border:0;border-left:5px solid transparent;background:var(--hjs-soft,color-mix(in srgb,#2B4A7C 8%,var(--paper)));color:var(--ink);border-radius:16px;padding:12px 22px;font-weight:700;font-size:clamp(18px,1.7vw,23px);text-align:left;box-shadow:none}
html body #cMap{gap:10px}
html body #cMap .mcol{border:1px solid var(--line);border-top:3px solid color-mix(in srgb,var(--mc) 60%,var(--paper));border-radius:14px;padding:12px 12px 10px;box-shadow:none}
html body #cMap .mcol h3{font-size:clamp(15px,1.3vw,17px);font-weight:800;color:color-mix(in srgb,var(--mc) 80%,var(--ink));margin:0 0 4px}
html body #cMap .mcol a,html body #cMap .mcol .cur{font-size:clamp(14px,1.2vw,16px);line-height:1.45;padding:5px 8px;border-radius:8px}
html body #cMap .mcol a{color:var(--soft)}html body #cMap .mcol a:hover{background:var(--bg);color:var(--ink)}
html body #cMap .mcol .cur{background:color-mix(in srgb,var(--mc) 13%,var(--paper));color:color-mix(in srgb,var(--mc) 70%,var(--ink))!important;font-weight:700}
/* 듣기 재생 막대 */
#hj-player{position:fixed;left:50%;bottom:clamp(84px,11vh,110px);transform:translateX(-50%);z-index:9000;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;
 max-width:calc(100vw - 24px);background:var(--paper,#fff);color:var(--ink,#2A221C);border:1px solid var(--line,#EFE3D6);border-radius:999px;padding:6px 6px 6px 16px;
 box-shadow:0 14px 34px -14px rgba(40,25,10,.4);font-family:'Gowun Dodum',sans-serif;word-break:keep-all}
#hj-player[hidden]{display:none}
#hj-player .hj-pl-l{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--soft,#5C5047);margin-right:4px}
#hj-player .hj-pl-l b{font-weight:700}
#hj-player .hj-i{width:18px;height:18px;flex:none}
#hj-player button{display:inline-flex;align-items:center;gap:6px;font:700 16px/1.2 'Gowun Dodum',sans-serif;color:var(--ink,#2A221C);background:var(--bg,#FFFCF8);border:1px solid var(--line,#EFE3D6);border-radius:999px;padding:9px 14px;cursor:pointer;min-height:42px}
#hj-player button:hover:not(:disabled){border-color:color-mix(in srgb,var(--ink,#2A221C) 30%,var(--line,#EFE3D6))}
#hj-player button:disabled{opacity:.4;cursor:default}
#hj-player [data-k=pp]{background:var(--ink,#2A221C);color:var(--paper,#fff);border-color:transparent}
#hj-player .hj-pl-x{padding:9px;background:none;border-color:transparent}
#hj-player[data-st=play] .hj-pl-l .hj-i{animation:hjpulse 1.2s ease-in-out infinite}
@keyframes hjpulse{50%{opacity:.35}}
@media print{#hj-player{display:none!important}}
/* 첫 화면 단추 배치: 교사용 도구는 위 오른편, 수업 시작은 가운데 홀로 */
html body .hj-cvtop{align-items:center}
html body .hj-cvtools{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
html body .hj-cvtools .hj-tool2{font-size:clamp(15px,1.25vw,17px)!important;padding:8px 14px!important;min-height:40px;border-width:1.5px!important;border-radius:999px!important;margin:0!important;box-shadow:none!important}
html body .hj-goRow{justify-content:center;margin-top:clamp(8px,1.5vh,18px)}
/* 크롬북처럼 낮은 화면에서도 '수업 시작'이 첫 화면 아래에 늘 보이게 (2026-10-02) */
html body #cover .hj-goRow{position:sticky;bottom:0;z-index:6;align-self:stretch;width:auto;margin-top:0;padding:14px 0 clamp(10px,2vh,18px);
 background:linear-gradient(to top,var(--bg) 62%,color-mix(in srgb,var(--bg) 0%,transparent))}
@media (max-height:760px) and (min-width:900px){
 html body #cover{padding-top:10px!important;padding-bottom:0!important}
 html body #cover .hj-cv{gap:10px!important}
 html body #cover .hj-cvpanel{padding:14px 22px!important;gap:10px!important}
 html body #cover .hj-cvpanel .qbox,html body #cover .hj-cvpanel .goalbox{padding-top:12px!important;padding-bottom:12px!important}
 html body #cover .hj-goRow .big-btn{padding-top:10px!important;padding-bottom:10px!important}
}
@media (max-width:640px){html body .hj-cvtools{margin-left:0;justify-content:flex-start}}
/* 첫 화면: 수업 흐름은 한 줄 이어진 막대, 활동 단위는 같은 폭의 막대로 */
html body .hj-field>*:not(.hj-flabel){justify-self:stretch!important;width:100%}
html body .hj-field>#plan,html body .hj-field>#cPlan,html body .hj-field>.stagebar,html body .hj-field>.plan{display:grid!important;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0!important;
 border:1.5px solid var(--line);border-radius:16px;background:var(--paper);overflow:hidden;box-shadow:0 1px 2px rgba(80,55,30,.05)}
html body .hj-field>#plan .st,html body .hj-field>#cPlan .st,html body .hj-field>.stagebar .st,html body .hj-field>.plan .st{
 display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;min-height:62px;margin:0!important;
 border:0!important;border-left:1px solid var(--line)!important;border-radius:0!important;background:none!important;box-shadow:none!important;padding:8px 6px!important;
 color:var(--ink)!important;text-align:center;line-height:1.3;font-size:clamp(15px,1.3vw,17px)!important;font-weight:700;cursor:pointer}
html body .hj-field>* .st:first-child{border-left:0!important}
html body .hj-field>* .st.brk{border-left:2px dashed color-mix(in srgb,var(--ink) 30%,var(--line))!important}
html body .hj-field>* .st:hover{background:var(--bg)!important}
html body .hj-field .st .hj-sn{font-size:13px;font-weight:800;color:var(--soft);letter-spacing:0}
html body .hj-field .st .hj-st{display:block;max-width:100%;word-break:keep-all;overflow-wrap:anywhere}
html body .hj-field .st small{font-size:12.5px;font-weight:600;color:var(--soft)}
html body .hj-field #segTeam{width:100%!important}
html body .hj-field #segTeam>.seg{display:grid!important;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);width:100%!important;border-radius:16px;overflow:hidden;background:var(--paper)}
html body .hj-field #segTeam>.seg button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;min-width:0;padding:8px 4px!important;
 font-size:clamp(15px,1.3vw,17px)!important;border-radius:0!important;border-left:1px solid var(--line)!important;line-height:1.2;white-space:nowrap}
html body .hj-field #segTeam>.seg button:first-child{border-left:0!important}
html body .hj-field #segTeam>.seg button .hj-em,html body .hj-field #segTeam>.seg button .hj-i{font-size:20px;width:20px;height:20px;line-height:1}
@media (max-width:720px){
 html body .hj-field>#plan,html body .hj-field>#cPlan,html body .hj-field>.stagebar,html body .hj-field>.plan,html body .hj-field #segTeam>.seg{grid-auto-flow:row;grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
 html body .hj-field>* .st,html body .hj-field #segTeam>.seg button{border-top:1px solid var(--line)!important}}
/* 과학 앱: 마지막 단계의 '수업 마치기' */
html body #hjEnd{display:none}
html body #hjEnd.on{display:inline-flex;align-items:center;gap:6px;background:var(--ink,#2A221C);color:var(--paper,#fff);border-color:transparent}
/* 진행 화면: 메뉴(위 단계·도구, 아래 단추)는 작고 가볍게, 수업 내용이 주인공 */
html body .screen:not(#cover) .topbar{gap:8px;padding-top:2px;padding-bottom:2px;min-height:0}
html body .screen:not(#cover) .topbar :is(.steps,.stagebar){gap:5px}
html body .screen:not(#cover) .topbar :is(.steps,.stagebar)>*{font-size:clamp(13px,1.05vw,15.5px)!important;padding:5px 11px!important;min-height:32px;border-width:1px!important;line-height:1.25}
html body .screen:not(#cover) .topbar .tools{gap:5px}
html body .screen:not(#cover) .topbar .tool{font-size:clamp(13px,1.05vw,15.5px)!important;padding:5px 10px!important;min-height:34px;border-width:1px!important;border-radius:999px!important}
html body .screen:not(#cover) .topbar .tool .hj-i{width:16px;height:16px}
html body .screen:not(#cover) .topbar .tool .n{font-size:12px;min-width:18px;height:18px;line-height:18px}
html body .screen:not(#cover) :is(.sthead .routine,.badge){font-size:clamp(13px,1.05vw,15px)!important;padding:3px 12px!important}
html body .screen:not(#cover) .foot{padding-top:6px;padding-bottom:6px;min-height:0}
html body .screen:not(#cover) .foot :is(.tnote,.ghost,.ghost-btn,#prev,#btnPrev){font-size:clamp(14px,1.15vw,16px)!important;padding:7px 14px!important;min-height:38px;border-width:1.5px!important}
html body .screen:not(#cover) .foot :is(#next,#btnNext,#btnNext2,.mid-btn,.big-btn){font-size:clamp(16px,1.4vw,19px)!important;padding:8px 20px!important;min-height:42px;box-shadow:0 6px 16px -10px rgba(40,25,10,.5)!important}
html body .screen:not(#cover) .foot .hj-i{width:17px;height:17px}
html body .screen:not(#cover) .stepno{font-size:13px}
/* 왼쪽 위 이동 단추 [홈 · 자료 목록] — 떠 있는 홈 단추 대신 */
html.hj-hasnav #hj-home{display:none!important}
html body .hj-nav{display:inline-flex;align-items:center;gap:6px;flex:none;margin:0}
html body .hj-nav a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font:700 clamp(14px,1.1vw,16px)/1.2 'Gowun Dodum',sans-serif;color:var(--ink,#2A221C);
 background:var(--paper,#fff);border:1.5px solid var(--line,#EFE3D6);border-radius:999px;padding:7px 14px 7px 11px;min-height:38px;white-space:nowrap}
html body .hj-nav a:hover{background:var(--bg,#FFFCF8);border-color:color-mix(in srgb,var(--ink,#2A221C) 25%,var(--line,#EFE3D6))}
html body .hj-nav .hj-i{width:17px;height:17px;flex:none}
html body .hj-nav.hj-dark{margin-right:14px}
html body .hj-nav.hj-dark a{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
html body .hj-nav.hj-dark a:hover{background:rgba(255,255,255,.22)}
html body .hj-navbar{display:flex;justify-content:flex-start;max-width:min(1200px,100%);margin:0 auto 10px;padding:10px 0 0}
body>nav .wrap>.hj-nav{margin-right:10px}
@media print{html body .hj-nav,html body .hj-navbar{display:none!important}}
/* 수학 앱 긴 문장 카드 */
html body .opts.hj-wide{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:12px}
html body .opts.hj-wide>.opt{max-width:none!important;width:auto!important;word-break:keep-all;text-wrap:pretty}
/* 학습 문제 안내 글자 */
html body #cover .hj-qlab{display:block;font-size:clamp(15px,1.35vw,19px)!important;font-weight:700;color:var(--soft);letter-spacing:-.01em;margin:0 0 4px;line-height:1.4}
html body #cover .hj-qlab .hj-em{font-size:.95em}
html body #cover .hj-qtxt{display:block}
html body #cGoal .hj-qtxt{font-size:clamp(20px,1.9vw,26px)}
/* 활동 단위 '기타' 입력칸은 다른 글자와 같은 크기로 */
html body .hj-field #segTeam input,html body .hj-field #segTeam textarea{font-size:clamp(15px,1.25vw,17px)!important;padding:8px 12px!important;min-height:0!important;height:auto!important;border-width:1.5px!important;border-radius:12px!important}
html body .hj-field #segTeam :is(span,small,p):not(.seg):not(.hj-em){font-size:clamp(14px,1.15vw,16px)!important}
/* 교사용 단추는 이동 단추와 같은 차분한 색 */
html body .hj-cvtools .hj-tool2{color:var(--ink)!important;background:var(--paper)!important;border:1.5px solid var(--line)!important;font-weight:700!important}
html body .hj-cvtools .hj-tool2:hover{background:var(--bg)!important;border-color:color-mix(in srgb,var(--ink) 25%,var(--line))!important}
html body .hj-cvtools .hj-tool2 .hj-i{color:var(--soft)}
html body .hj-cvtop .tolist{color:var(--ink);background:var(--paper);border:1.5px solid var(--line);font-size:clamp(14px,1.1vw,16px)!important;padding:7px 14px!important;min-height:38px}
/* 결과 화면 단추 */
html body .hj-retry{background:var(--paper)!important;color:var(--ink)!important;border:1.5px solid var(--line)!important;box-shadow:none!important;font-size:clamp(16px,1.4vw,19px)!important;padding:10px 20px!important}
html body .hj-rrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:6px auto 0}
html body .hj-rrow>*{margin:0!important}
html body .hj-gonext{display:inline-flex;align-items:center;gap:8px;font:700 clamp(17px,1.5vw,21px)/1.2 'Gowun Dodum',sans-serif;color:var(--paper,#fff);background:var(--ink,#2A221C);border:0;border-radius:999px;padding:12px 24px;cursor:pointer;box-shadow:0 8px 20px -12px rgba(40,25,10,.55)}
html body .hj-gonext .hj-i{width:20px;height:20px}
html body .hj-gonext:hover{filter:brightness(1.15)}
/* 진행 화면 아래 '교사 안내'도 차분한 색으로 */
html body .screen:not(#cover) .foot .tnote{color:var(--ink)!important;background:var(--paper)!important;border-color:var(--line)!important}
html body .screen:not(#cover) .foot .tnote .hj-i{color:var(--soft)}
html body #cover .row .tnote{color:var(--ink)!important;border-color:var(--line)!important}
/* 과학 앱(한 화면 보기): 메인과 같은 차분한 선·색 */
html:has(#ovBar){--navy:color-mix(in srgb,var(--ink) 22%,var(--line))}
html:has(#ovBar) body section{border:1px solid var(--line)!important;border-radius:20px;box-shadow:0 1px 2px rgba(80,55,30,.04),0 12px 28px -20px rgba(80,55,30,.25)}
html:has(#ovBar) body button:not(.right):not(.wrong):not(.sel):not(.on):not(.ok):not(.no){border-width:1.5px!important;border-color:var(--line)!important;border-radius:14px}

html body #lesson .foot :is(.tnote,.ghost,#prev){font-size:calc(16px / var(--hjz,1))!important;min-height:calc(38px / var(--hjz,1))!important;padding:calc(7px / var(--hjz,1)) calc(14px / var(--hjz,1))!important}
html body #lesson .foot #next{font-size:calc(19px / var(--hjz,1))!important;min-height:calc(42px / var(--hjz,1))!important;padding:calc(8px / var(--hjz,1)) calc(20px / var(--hjz,1))!important}
/* 수학 앱: 확인하기·다음 계단은 알맞은 크기로 */
html body main.lesson .big{font-size:clamp(18px,1.35vw,22px)!important;padding:.5em 1.5em!important;width:auto!important;min-width:0!important;box-shadow:0 3px 0 rgba(0,0,0,.15)!important}
html body main.lesson .side>.big{align-self:flex-end}
html body main.lesson .stair{font-size:clamp(16px,1.2vw,19px)!important;min-height:48px;padding-top:6px!important;padding-bottom:6px!important}
/* 우리 반 교실: '자세히'가 칸 밖으로 나가지 않게 */
html body .wg>h2{font-size:clamp(.98rem,1.05vw,1.15rem)!important;gap:.3rem!important}
html body .wg>h2 .ed{font-size:.82rem!important;padding:.15rem .5rem!important;min-height:1.75rem!important}
/* hidden으로 숨긴 것은 정말 숨기기(돋보기 결과가 처음부터 보이던 문제) */
html body [hidden]{display:none!important}
html body #zoom:not([hidden]),html body .zoom:not([hidden]){animation:hjzoom .45s cubic-bezier(.2,.8,.3,1.2)}
@keyframes hjzoom{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
/* 과학 한 화면 보기: 내용이 길면 칸이 늘어나고, 아래 막대가 내용을 가리지 않게 */
html body.ov main section.cur{height:auto!important;overflow:visible!important}
html body.ov{padding-bottom:calc(var(--hjbar,76px) + 28px)!important}
html body.ov main.wrap{padding-bottom:calc(var(--hjbar,76px) + 12px)!important}
/* 과학: 문제(질문)는 왼쪽 정렬 */
html body.ov section :is(#quiz,#perf,.qz)>div>p.jua,html body.ov section p.jua,html body.ov section #clue,
html body.ov section:has(#quiz,#perf,.qz) .fitbox>h3{text-align:left!important;text-wrap:pretty}
/* 사진 두 장이 한 칸에만 몰리던 것: 줄 전체를 쓰고 사진을 크게 */
html body .two>.hj-pgrid:only-child{grid-column:1/-1}
html body.ov .hj-pgrid .photo img{max-height:min(380px,44vh)!important;aspect-ratio:4/3!important}
@media (max-width:900px){html body.ov .hj-pgrid .photo img{max-height:none!important}}

/* 과학 '한 화면 보기' 앱: 크롬북처럼 낮은 가로 화면에서 여백만 줄여 한 화면에 더 담기 (글자 크기는 그대로, 2026-10-02) */
@media (orientation:landscape) and (max-height:760px){
 html:has(#ovBar) body.ov main{padding-top:0!important}
 html:has(#ovBar) body.ov main>section.cur{margin-top:4px!important;padding-top:8px!important;padding-bottom:8px!important}
 html:has(#ovBar) body.ov section.cur .stage{margin-bottom:2px!important;padding-top:1px!important;padding-bottom:1px!important}
 html:has(#ovBar) body.ov section.cur h2{margin-top:2px!important;margin-bottom:6px!important}
 html:has(#ovBar) body.ov section.cur h3{margin-top:8px!important;margin-bottom:6px!important}
 html:has(#ovBar) body.ov section.cur .fitbox>p{margin-top:4px!important;margin-bottom:8px!important}
 html:has(#ovBar) body.ov section.cur .lab{margin-top:8px!important;margin-bottom:8px!important}
 html:has(#ovBar) body.ov section.cur .tip,html:has(#ovBar) body.ov section.cur .fb{margin-top:6px!important}
 html:has(#ovBar) body.ov #ovBar{margin-top:4px!important;padding-top:4px!important;padding-bottom:4px!important}
}
/* 과학 앱 사진 모음(3장 이상): 낮은 가로 화면에서는 세 칸 카드로 */
@media (orientation:landscape) and (max-height:760px) and (min-width:1000px){
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3)){grid-template-columns:repeat(3,minmax(0,1fr))!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3))>.photo{grid-template-columns:1fr!important;align-items:start;margin:0!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3))>.photo img{height:auto;max-height:min(150px,21vh)!important;aspect-ratio:3/2!important}
}
/* 과학: 재료 고르기 탭(나무 막대·물 등)은 가운데 정렬 */
html body.ov section .tabs{justify-content:center}
/* 갤럭시탭 같은 세로 태블릿(가로 600~900px): 사진을 두 칸으로 놓아 한 화면에 담기 (2026-10-02) */
@media (min-width:600px) and (max-width:900px) and (orientation:portrait){
 html:has(#ovBar) body.ov .hj-pgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
 html:has(#ovBar) body.ov .hj-pgrid .photo img{max-height:min(320px,26vh)!important;aspect-ratio:4/3!important;object-fit:cover}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3)){grid-template-columns:repeat(2,minmax(0,1fr))!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3))>.photo{grid-template-columns:1fr!important;align-items:start;margin:0!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3))>.photo img{height:auto;max-height:min(180px,15vh)!important;aspect-ratio:3/2!important}
 html:has(#ovBar) body.ov section.cur figure.photo:not(.hj-pgrid *):not(.gallery *):not(.gal *) img{max-height:min(280px,22vh)!important;object-fit:cover;width:auto!important;max-width:100%;margin-left:auto;margin-right:auto;display:block}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(7)){grid-template-columns:repeat(3,minmax(0,1fr))!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(7))>.photo img{max-height:min(130px,11vh)!important}
 html:has(#ovBar) body.ov .lab>svg{max-height:24vh!important}
}
/* 크롬북처럼 낮은 가로 화면: 사진 많은 모음은 네 칸, 따로 놓인 사진은 낮게 (2026-10-02) */
@media (orientation:landscape) and (max-height:760px) and (min-width:1000px){
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(7)){grid-template-columns:repeat(4,minmax(0,1fr))!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(7))>.photo img{max-height:min(110px,15vh)!important}
 html:has(#ovBar) body.ov section.cur figure.photo:not(.hj-pgrid *):not(.gallery *):not(.gal *) img{max-height:min(200px,27vh)!important;object-fit:cover}
 html:has(#ovBar) body.ov .lab>svg{max-height:34vh!important}
}
/* ===== 과목 색 (2026-10-02): 다음·주요 단추, 지금 단계, 고른 것, 활동 이름표, 학습 문제 상자 =====
   html[data-hjsubj]는 content.js가 주소(/korean/ /math/ /social/ /science/)를 보고 붙인다 */
html[data-hjsubj="korean"]{--hjs:#C9463B}
html[data-hjsubj="math"]{--hjs:#B4610F}
html[data-hjsubj="social"]{--hjs:#2B6FB8}
html[data-hjsubj="science"]{--hjs:#1F8060}
html[data-hjsubj]{--hjs-soft:color-mix(in srgb,var(--hjs) 12%,var(--paper))}
html[data-hjsubj="korean"]{--hjs-ink:#B23A30}html[data-hjsubj="math"]{--hjs-ink:#9A520C}html[data-hjsubj="social"]{--hjs-ink:#24609F}html[data-hjsubj="science"]{--hjs-ink:#1A6E52}
@media (prefers-color-scheme:dark){html[data-hjsubj]:not([data-theme="light"]){--hjs-soft:color-mix(in srgb,var(--hjs) 24%,var(--paper));--hjs-ink:color-mix(in srgb,var(--hjs) 50%,#fff)}}
html[data-hjsubj][data-theme="dark"]{--hjs-soft:color-mix(in srgb,var(--hjs) 24%,var(--paper));--hjs-ink:color-mix(in srgb,var(--hjs) 50%,#fff)}
html[data-hjsubj]:not(#hjz):not(#hjz) body #ovBar #ovNext#ovNext,html[data-hjsubj]:not(#hjz):not(#hjz) body button.main.main,html[data-hjsubj]:not(#hjz):not(#hjz) body button[id^=btnNext][id^=btnNext],
html[data-hjsubj]:not(#hjz):not(#hjz) body #btnGo#btnGo,html[data-hjsubj]:not(#hjz):not(#hjz) body .hj-sc-go.hj-sc-go,html[data-hjsubj]:not(#hjz):not(#hjz) body #hjEnd#hjEnd,
html[data-hjsubj]:not(#hjz):not(#hjz) body #lesson .foot #next#next,html[data-hjsubj]:not(#hjz):not(#hjz) body #cover .big-btn.big-btn,html[data-hjsubj]:not(#hjz):not(#hjz) body .big-btn.big-btn:not(.ghost){background:var(--hjs)!important;color:#fff!important;border-color:transparent!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body :is(button.main,#ovNext,#hjEnd,.big-btn,[id^=btnNext],#next):disabled{background:color-mix(in srgb,var(--hjs) 35%,#fff)!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body nav a[style*="outline"]{outline:none!important;background:var(--hjs-soft)!important;color:var(--hjs-ink)!important;box-shadow:inset 0 0 0 2px var(--hjs)!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body .st.now.now{background:var(--hjs)!important;color:#fff!important;border-color:transparent!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body .seg button[aria-pressed="true"][aria-pressed="true"]{background:var(--hjs)!important;color:#fff!important;border-color:transparent!important}
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body button.on.on:not(.right):not(.wrong),html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body button.sel.sel:not(.right):not(.wrong){background:var(--hjs-soft)!important;border-color:var(--hjs)!important;color:var(--hjs-ink)!important}
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body .stage.stage.stage{background:var(--hjs-soft)!important;color:var(--hjs-ink)!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body :is(#cover .qbox,#cover .bq,#cover .goalbox,#hj-scover .hj-sc-goal){background:var(--hjs-soft)!important;border-left-color:transparent!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body main.lesson .big:not(:disabled){background:var(--hjs)!important;color:#fff!important;border-color:transparent!important}
/* 자료 출처 한 줄 */
html body .hj-src{font-size:13.5px!important;line-height:1.5;color:var(--muted);text-align:center;margin:10px auto 0;max-width:60em;word-break:keep-all}
/* 과학 한 화면 보기: 글의 위계 — 이름표·제목 한 줄, 활동 제목 크게, 안내 글 작게, 할 일 문장은 크게 */
html body.ov section .hj-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 12px;margin:0 0 6px}
html body.ov section .hj-head>.stage{display:inline-block!important;margin:0!important}
html body.ov section .hj-head>h2{margin:0!important}
html body.ov section .fitbox:has(> h3:not(.ovhide)) .hj-head>h2{font-size:clamp(17px,1.35vw,20px)!important;color:var(--soft)!important;font-weight:700!important}
html body.ov section .fitbox>h3{font-size:clamp(22px,1.9vw,28px)!important;font-weight:800!important;color:var(--ink)!important;margin:6px 0 4px!important}
html body.ov section .fitbox>p.hj-guide{font-size:clamp(16px,1.25vw,19px)!important;line-height:1.6;color:var(--soft)!important;max-width:52em;margin:2px auto 6px!important}
html body.ov section .fitbox>p.hj-guide b{color:var(--ink)}
html body.ov section .fitbox>p.hj-task{font-size:clamp(19px,1.6vw,24px)!important;font-weight:700!important;line-height:1.5;color:var(--ink)!important;text-align:left!important;
 background:var(--hjs-soft,#F3EEE6);border-left:6px solid var(--hjs,#8a7a66);border-radius:12px;padding:10px 16px!important;margin:6px 0 10px!important;text-wrap:pretty}
html body.ov section .fitbox>p.hj-task b{color:var(--hjs,var(--ink))}
/* 스스로 평가 표: 얼굴 칸은 좁게, 글 칸은 넓게 */
html body.ov section table td:has(> button){width:1%;white-space:nowrap}
/* 문제 보기(모든 교과): ①②③④ 번호, 보기가 모두 짧으면 가운데 정렬 / 문장이면 왼쪽 정렬 (content.js가 hj-short·hj-long을 붙임) */
@counter-style hjcirc{system:fixed;symbols:'①' '②' '③' '④' '⑤' '⑥' '⑦' '⑧' '⑨' '⑩';suffix:' '}
html body .hj-optg{counter-reset:hjo}
html body .hj-optg>button{counter-increment:hjo;display:flex!important;align-items:center;gap:.45em}
html body .hj-optg>button::before{content:counter(hjo,hjcirc);font-weight:800;color:var(--hjs,var(--ink));flex:none}
html body .hj-optg.hj-long>button{text-align:left!important;justify-content:flex-start!important;align-items:baseline!important;padding-left:18px!important;padding-right:16px!important}
html body .hj-optg.hj-short>button{text-align:center!important;justify-content:center!important}

/* 홍지희 버전: 활동 이름표 + 질문 제목 한 줄 */
html body #lesson .hj-head2{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 14px;margin:0 auto}
html body #lesson .hj-head2>.sthead{margin:0!important;flex:none}
html body #lesson .hj-head2>#hd{margin:0!important}
/* 홍지희 버전 첫 화면: 주제 프로젝트 지도 이름표, 오늘 표시 */
html body .hj-maplab{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:12px 0 6px;font-size:15px;color:var(--soft)}
html body .hj-maplab b{font-size:16.5px;color:var(--ink)}
html body .hj-maplab em{font-style:normal;font-weight:800;color:var(--hjs,var(--ink))}
html body #cMap .cur .hj-today{font-style:normal;display:inline-block;font-size:12.5px;font-weight:800;color:#fff;background:var(--hjs,#555);border-radius:999px;padding:1px 8px;margin-right:6px;vertical-align:1px}
/* 과학 앱 메뉴 자리 통일 (국어·사회와 같게) */
html.hj-scmenu body>nav .wrap{max-width:none!important;display:flex!important;align-items:center;gap:8px;flex-wrap:nowrap}
html.hj-scmenu body>nav .hj-sctools{margin-left:auto;display:flex;gap:6px;flex:none;padding-left:8px}
html.hj-scmenu body>nav .hj-sctools button{font-size:clamp(13.5px,1vw,15px)!important;min-height:34px!important;padding:5px 11px!important;border-radius:999px!important;background:var(--paper)!important;color:var(--ink)!important;border:1px solid var(--line)!important;white-space:nowrap}
html.hj-scmenu:has(#ovBar) #ovBar{position:fixed!important;left:0!important;right:0!important;bottom:0!important;width:auto!important;max-width:none!important;margin:0!important;transform:none!important;
 display:grid!important;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 22px 14px!important;background:linear-gradient(to top,var(--bg) 70%,transparent)!important;border:0!important;box-shadow:none!important;border-radius:0!important;pointer-events:none}
html.hj-scmenu #ovBar>*{pointer-events:auto}
html.hj-scmenu #ovBar #ovPos{grid-column:2;font-size:14px!important;color:var(--soft)}
html.hj-scmenu #ovBar .hj-pn{grid-column:3;justify-self:end;display:flex;gap:8px}
html.hj-scmenu #ovBar .hj-pn button{min-height:42px!important;font-size:clamp(15px,1.15vw,17px)!important;padding:8px 18px!important;border-radius:999px!important}
@media (max-width:820px){html.hj-scmenu body>nav .hj-sctools{position:fixed;left:10px;bottom:14px;z-index:30;padding:0;gap:4px}html.hj-scmenu body>nav .hj-sctools button{font-size:0!important;padding:8px 10px!important;min-height:40px!important}html.hj-scmenu body>nav .hj-sctools button .hj-i{width:18px;height:18px;margin:0}}
/* 번호 붙은 줄 내어쓰기 */
html body .hj-hang{display:flex!important;align-items:flex-start;gap:.35em}
html body .hj-hang>input{flex:none;margin-top:.15em}
html body .hj-hang>.hj-cn{flex:none;font-weight:700}
html body .hj-hang>.hj-ct{flex:1 1 auto;min-width:0}
html body .hj-hang .hj-paren{display:block;font-size:.92em;color:var(--soft)}
html body .hd>small.hj-sub2{display:block;margin-top:4px}
/* 사이트 '홈': 채운 집 모양 + 과목 색으로 눈에 띄게 (차시 처음 단추와 구분) */
html body .hj-nav a.hj-nh{background:#0F1C33!important;color:#fff!important;border-color:transparent!important}
html body .hj-nav a.hj-nh svg path{fill:currentColor;fill-opacity:.25}
/* 홍지희 버전: 위 메뉴줄과 본문 사이 여유 */
html body #lesson .topbar{margin-bottom:16px!important}
/* 홍지희 버전: 활동 내용이 아래로 처지지 않게 위쪽(질문 바로 아래)에 붙이고, 남는 공간은 아래로 */
html body #lesson .body{justify-content:flex-start!important}
html body #lesson .body>:first-child{margin-top:clamp(8px,3vh,36px)!important}
html body a.hj-homemini{display:inline-flex!important;align-items:center;gap:5px;text-decoration:none!important;background:#0F1C33!important;color:#fff!important;border:0!important;border-radius:999px;padding:5px 12px!important;min-height:34px;font:700 clamp(13.5px,1vw,15px)/1 Pretendard,sans-serif!important;white-space:nowrap}
html body a.hj-homemini .hj-i{width:16px;height:16px}
/* 보기에 긴 문장이 있으면 한 줄에 하나씩(가운데 폭에 맞춰) 보여 읽기 쉽게 */

/* 홍지희 버전 자료 카드: 제목 칸 · 가운데 사진 · 설명 · 출처 */
html body .mini .m.hj-v{flex-direction:column!important;align-items:stretch!important;gap:6px!important;padding:0 0 8px!important;overflow:hidden;text-align:center}
html body .mini .m.hj-v .hj-mh{background:color-mix(in srgb,var(--hjs,#888) 10%,var(--paper,#fff));border-bottom:2px solid color-mix(in srgb,var(--hjs,#888) 22%,var(--paper,#fff));padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
html body .mini .m.hj-v .hj-mh b{display:inline!important;font-size:clamp(15px,calc(var(--vw,1vw)*1.35),20px)!important}
html body .mini .m.hj-v .hj-mp{display:flex;justify-content:center;align-items:center;padding:2px 10px 0}
html body .mini .m.hj-v .hj-mp img{width:100%!important;height:clamp(84px,calc(var(--vh,1vh)*15),160px)!important;object-fit:cover;border-radius:10px}
html body .mini .m.hj-v .hj-mp .e{font-size:clamp(48px,calc(var(--vh,1vh)*9),84px)!important;width:auto!important;display:block!important;line-height:1.15}
html body .mini .m.hj-v .d{padding:0 10px;line-height:1.4}
html body :is(#lesson,#stage,#cover,main,body) .mini .m.hj-v small.hj-msrc{display:block;padding:0 10px;font-size:12.5px!important;line-height:1.3;color:var(--muted,var(--soft))}
html body .mini:has(.hj-v){grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))!important}
/* ===== 모든 교과 공통: 분류 카드(.card1)·분류 단추(.bins)·피드백(.fb) 너비와 색 통일 (2026-10-03) ===== */
html body .deck{width:min(1100px,94vw)!important;margin-left:auto;margin-right:auto;display:flex;flex-direction:column;align-items:stretch;gap:12px}

<script>const $=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let SOUND=true,actx=null;
function beep(kind){
  if(!SOUND) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const map={ok:[[660,'triangle'],[880,'triangle']],no:[[300,'square'],[220,'square']],tick:[[520,'sine']],win:[[523,'triangle'],[659,'triangle'],[784,'triangle'],[1047,'triangle']]};
    (map[kind]||map.tick).forEach(([f,t],i)=>{
      const o=actx.createOscillator(),g=actx.createGain(),s=actx.currentTime+i*.13;
      o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.0001,s);
      g.gain.exponentialRampToValueAtTime(.16,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.22);
      o.connect(g).connect(actx.destination);o.start(s);o.stop(s+.24);
    });
  }catch(e){}
}
function toggleFull(){try{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}catch(e){}}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));}
function openO(id){$(id).classList.add('on');}
function closeO(id){$(id).classList.remove('on');}
function wireTools(){
  document.querySelectorAll('[data-full]').forEach(b=>b.onclick=toggleFull);
  document.querySelectorAll('[data-sound]').forEach(b=>b.onclick=()=>{SOUND=!SOUND;document.querySelectorAll('[data-sound]').forEach(x=>x.textContent=SOUND?'🔊':'🔇');});
}
function seg(id,opts,get,set){
  const s=$(id);s.innerHTML='';
  opts.forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;b.setAttribute('aria-pressed',get()===v);b.onclick=()=>{set(v);seg(id,opts,get,set);};s.appendChild(b);});
}
/* 활동 단위(반·개별·짝·모둠·분단·번호순·기타) 공통 기능 */
let MODE='class',TEAMS=4,LINES=4,CLASSN=25,ETCNOTE='',TURN=0,SCORES=[];
const MODES=[['class','🏫 반'],['solo','🙋 개별'],['pair','👫 짝'],['group','👨‍👩‍👧 모둠'],['line','🪑 분단'],['number','🔢 번호순'],['etc','✏️ 기타']];
function teamSeg(id){
  const host=$(id); if(!host) return;
  host.classList.remove('seg');
  host.style.cssText='display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;border:0;background:none';
  host.innerHTML=`<span class="seg" id="${id}-m">${MODES.map(([k,l])=>`<button data-m="${k}" aria-pressed="${MODE===k}">${l}</button>`).join('')}</span><span id="${id}-sub"></span>`;
  host.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{MODE=b.dataset.m;teamSeg(id);});
  const sb=$(id+'-sub'); sb.style.cssText='display:inline-flex;gap:10px;align-items:center;flex-wrap:wrap';
  const numInput=(sid,val,max)=>`<input id="${sid}" type="number" min="2" max="${max}" value="${val}" style="width:4.5em;font-size:clamp(20px,2vw,28px);padding:6px 10px;border:3px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font-family:var(--body)">`;
  if(MODE==='group'){
    sb.innerHTML=`<span class="row-label">몇 모둠</span><span class="seg" id="${id}-n">${[2,3,4,5,6].map(v=>`<button data-n="${v}" aria-pressed="${TEAMS===v}">${v}</button>`).join('')}</span>`;
    sb.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{TEAMS=+b.dataset.n;teamSeg(id);});
  }else if(MODE==='line'){
    sb.innerHTML=`<span class="row-label">몇 분단</span><span class="seg" id="${id}-l">${[2,3,4,5,6].map(v=>`<button data-l="${v}" aria-pressed="${LINES===v}">${v}</button>`).join('')}</span>`;
    sb.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{LINES=+b.dataset.l;teamSeg(id);});
  }else if(MODE==='number'){
    sb.innerHTML=`<span class="row-label">우리 반</span>${numInput(id+'-c',CLASSN,40)}<span class="row-label">명 · 1번부터 차례로 답해요</span>`;
    $(id+'-c').oninput=()=>{CLASSN=Math.max(2,+$(id+'-c').value||25);};
  }else if(MODE==='etc'){
    sb.innerHTML=`<input id="${id}-e" type="text" placeholder="예: 두 모둠씩 짝지어 대결" value="${ETCNOTE.replace(/"/g,'&quot;')}" style="width:min(22em,60vw);font-size:clamp(19px,1.9vw,26px);padding:8px 14px;border:3px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);font-family:var(--body)">
      <span class="row-label" style="font-size:clamp(17px,1.6vw,22px);color:var(--soft)">선생님이 방법을 설명한 뒤 '다음'으로 진행해요</span>`;
    $(id+'-e').oninput=()=>{ETCNOTE=$(id+'-e').value;};
  }else{
    const t={class:'반 전체가 함께 답하고 점수를 모아요.',solo:'각자 생각하고 답해요. 점수는 매기지 않아요.',pair:'짝과 의논해서 답해요. 점수는 매기지 않아요.'}[MODE];
    sb.innerHTML=`<span class="row-label" style="font-size:clamp(18px,1.7vw,23px);color:var(--soft)">${t}</span>`;
  }
}
function unitName(){return MODE==='line'?'분단':'모둠';}
function teamCount(){
  if(MODE==='group')return TEAMS;
  if(MODE==='line')return LINES;
  return 1;
}
function usesTeams(){return MODE==='group'||MODE==='line';}
function noScore(){return MODE==='solo'||MODE==='pair'||MODE==='etc';}
function teamInit(){SCORES=Array(teamCount()).fill(0);TURN=0;}
function teamAdd(n){if(noScore())return;SCORES[TURN]=(SCORES[TURN]||0)+n;}
function teamNext(){
  if(usesTeams())TURN=(TURN+1)%teamCount();
  else if(MODE==='number')TURN=(TURN+1)%Math.max(2,CLASSN);
}
function teamChips(el){
  if(!el)return;el.className='scores';
  if(noScore()){el.innerHTML='';el.style.display='none';return;}
  el.style.display='flex';
  if(usesTeams()){el.innerHTML=SCORES.map((s,i)=>`<span class="chip ${i===TURN?'now':''}">${i+1}${unitName()} ${s}</span>`).join('');}
  else el.innerHTML=`<span class="chip now">⭐ ${SCORES[0]}점</span>`;
}
function teamTurn(){
  if(MODE==='solo')return '🙋 각자 생각해 보세요';
  if(MODE==='pair')return '👫 짝과 의논해 보세요';
  if(MODE==='class')return '🏫 반 전체가 함께 답해요';
  if(MODE==='number')return `🔢 지금은 ${TURN+1}번 차례예요`;
  if(MODE==='etc')return ETCNOTE?('✏️ '+ETCNOTE):'✏️ 선생님 안내에 따라 활동해요';
  return `🙋 지금은 ${TURN+1}${unitName()} 차례예요`;
}
function teamPodium(){
  if(noScore())return '';
  if(!usesTeams())return `<span class="chip win">⭐ ${SCORES[0]}점</span>`;
  const mx=Math.max(...SCORES);
  return SCORES.map((s,i)=>`<span class="chip ${s===mx?'win':''}">${i+1}${unitName()} ${s}점</span>`).join('');
}
function teamWinnerText(){
  if(MODE==='solo')return '각자 푼 문제를 공책과 맞춰 봐요.';
  if(MODE==='pair')return '짝과 함께 잘 해냈어요.';
  if(MODE==='etc')return '모두 수고했어요.';
  if(!usesTeams())return `우리 반 점수는 ${SCORES[0]}점이에요.`;
  const mx=Math.max(...SCORES),w=SCORES.map((s,i)=>s===mx?i+1:null).filter(Boolean);
  return `${w.join(', ')}${unitName()}이 가장 많은 점수를 얻었어요!`;
}

], "a": 0, "w": "과거에 사용하던 물건 중에서 소중하게 간직하는 것을 애장품이라고 해요."}, {"q": "옛날 사람들이 남긴 물건이나 건축물을 찾아내고 연구해 옛날 생활 모습을 알아내는 사람은?", "o": ["고고학자", "극장 화가", "안내양", "우체부"], "a": 0, "w": "고고학자는 옛날 물건과 건축물을 찾아내고 연구해요."}, {"q": "자료로 옛날 사람들의 생활 모습을 알아보려면 무엇을 확인해야 할까요?", "o": ["자료가 만들어진 때", "자료의 무게", "자료의 색깔", "자료를 산 가게"], "a": 0, "w": "자료로 알아보려면 그것이 만들어진 때를 확인해야 해요."}, {"q": "어떤 물품을 한자리에 모아 볼 수 있게 한 것을 무엇이라고 할까요?", "o": ["전시관", "타임캡슐", "우물", "비석"], "a": 0, "w": "어떤 물품을 한자리에 모아 볼 수 있게 한 것을 전시관이라고 해요."}], "final": {"hd": "🧩 주제 정리", "lines": ["오래된 물건, 자료, 증언으로 옛날 사람들의 생활 모습을 알 수 있어요.", "애장품에는 각자의 추억이 담겨 있고, 오래된 물건과 자료는 과거를 알려 주는 소중한 것이에요.", "타임캡슐, 노래, 전시관 등 여러 방법으로 과거의 모습을 남기고 보여 줄 수 있어요.", "다음 시간에는 지역 사람들의 옛 생활 모습을 어떻게 알 수 있는지 살펴봐요."]}, "notes": {"0": ["수업 준비", "<h3>학습 목표<\/h3><p>‘주변에서 만나는 과거의 모습’에서 공부한 내용을 다양한 방법으로 정리할 수 있다. (지도서 230쪽)<\/p><h3>흐름<\/h3><ul><li>도입 5분 → 생각을 펼쳐요(선택 활동 안내) 10분 → 활동 1 재미있게 확인해요 10분 → 활동 2 노랫말 짓기 준비 10분 → 정리 5분<\/li><li>교과서 115~117쪽 · 지도서 230~231쪽 · 수업 기법: 만들기, 돌아가며 말하기<\/li><li>선택 활동 1(타임캡슐)을 고른 반은 활동 2 시간을 타임캡슐 만들기에 쓰세요. 화면 활동 2는 선택 활동 2(노랫말)를 고른 반을 위한 준비 활동입니다.<\/li><\/ul><h3>준비물<\/h3><ul><li>선택 활동 1: 타임캡슐로 쓸 빈 병, 타임캡슐에 넣을 물건, 종이 (교과서 115쪽)<\/li><li>선택 활동 2: 「함께 걸어 좋은 길」(이경애 작사, 정보형 작곡) 노래 영상 QR (교과서 116쪽)<\/li><\/ul><h3>선택 활동 1 · 나만의 타임캡슐 (지도서 231쪽)<\/h3><ul><li>융합 교과: 사회, 미술 / 핵심 역량: 정보 활용 능력, 창의적 사고력<\/li><li>순서: ① 30년 후에 현재의 내 모습을 떠올릴 수 있는 물건과 그 물건을 준비한 까닭 쓰기 ② 준비한 물건을 빈 병에 넣고 종이에 필요한 내용(만든 날짜, 타임캡슐을 열 때, 주의 사항) 쓰기 ③ 병에 종이를 붙인 후 보관하기<\/li><li>지도 방법: 현재의 내 모습을 가장 잘 설명할 수 있는 물건들을 준비하게 하고, 그 까닭을 적도록 한다. / 넣을 물건의 크기를 고려하여 타임캡슐로 만들 빈 병을 준비하게 한다. / 타임캡슐의 겉모습을 꾸미는 것보다 넣을 물건을 잘 선택하는 것이 중요함을 지도한다.<\/li><li>예시 답안: 오카리나 — 삼촌이 선물로 주신 오카리나를 불면 저와 잘 놀아 주시는 삼촌 생각이 나서 기분이 좋아지기 때문입니다(교과서 115쪽) / 털실: 할머니가 생각나기 때문이다. / 열쇠고리: 집에 이사 온 날이 생각나기 때문이다. / 몽당연필: 내가 오랜 시간 아껴 쓴 연필이기 때문이다. (지도서 231쪽)<\/li><\/ul><h3>선택 활동 2 · 노랫말 바꾸어 부르기 (지도서 231쪽)<\/h3><ul><li>융합 교과: 사회, 음악 / 핵심 역량: 의사소통 및 협업 능력, 창의적 사고력<\/li><li>지도 방법: 옛날 사람들의 생활 모습을 보여 주는 물건에는 무엇이 있는지 생각하여 노랫말을 지어 보도록 지도한다. / 교과서에 제시된 내용을 활용하되, 교과서 외의 내용이 필요한 경우 인터넷을 활용하여 알아볼 수 있도록 한다.<\/li><li>예시: 교과서 116쪽 「부채와 화채」, 지도서 231쪽 「모시옷과 삼베옷」<\/li><\/ul><h3>성취 기준<\/h3><p>[4사02-02] 오래된 물건이나 자료들을 주변에서 찾아보고, 이를 통해 과거의 모습을 살펴볼 수 있음을 이해한다.<\/p><h3>성취 수준<\/h3><ul><li><b>A<\/b> 주변에서 오래된 물건이나 자료들을 찾아보며 과거의 모습을 탐색하고, 역사가 증거를 바탕으로 구성된다는 것을 추정할 수 있다.<\/li><li><b>B<\/b> 주변에서 오래된 물건이나 자료들을 찾아보고, 이들이 과거의 모습을 알려 주는 증거임을 짐작하여 설명할 수 있다.<\/li><li><b>C<\/b> 주변에서 과거의 모습을 살펴볼 수 있는 오래된 물건이나 자료들을 찾을 수 있다.<\/li><\/ul><h3>주제 「지도상의 유의점」 (지도서 187쪽)<\/h3><ul><li>오래된 물건, 자료, 증언 등은 학생들이 공감할 수 있는 친숙한 사례를 찾아 활용하도록 한다.<\/li><li>역사적 맥락을 고려하되, 되도록 현재와 가까운 과거의 자료를 제시해 학생들이 과거의 생활 모습을 쉽게 인식할 수 있게 한다.<\/li><li>과거에 관해 설명할 때 자기와 다른 자료를 선택한 친구를 존중하는 태도를 기를 수 있도록 한다.<\/li><\/ul><h3>주제의 평가 계획 (지도서 187쪽)<\/h3><ul><li>주변의 오래된 물건, 자료 등을 활용해 과거의 모습을 설명할 수 있다. — 구술 평가<\/li><li>다양한 자료를 활용하여 옛날 사람들의 생활 모습을 보여 주는 전시관을 꾸밀 수 있다. — 관찰 평가<\/li><li>오래된 물건, 자료, 증언 등을 소중히 여기는 태도를 기른다. — 관찰 평가<\/li><\/ul><h3>지도서 대조 검증<\/h3><ul><li>차시명·학습 문제·선택 활동·노랫말 예시(교과서 116쪽, 지도서 231쪽)·얼마나 잘했을까·유의점 대조 완료.<\/li><li>「재미있게 확인해요」 사다리 설명 하나를 교과서와 다르게 바꿔 두었던 것을 바로잡음: 교과서 117쪽 원문은 “우리 주변에는 옛 모습을 알려 주는 물건이 많습니다.”(○)인데 화면과 교사 안내 정답표에는 “…많지 않습니다.”(×)로 되어 있었음 → 교과서 문장과 정답(○)으로 되돌리고 정답표(○ 5개, × 4개)를 고침. 우승 트로피는 철수(교과서 축소본으로 확인).<\/li><\/ul>"], "1": ["① 도입 (5분)", "<h3>발문 (지도서 230쪽)<\/h3><p>‘주변에서 만나는 과거의 모습’에서 공부한 내용은 무엇인가요?<\/p><h3>예상 반응<\/h3><ul><li>우리 주변의 오래된 물건으로 옛날 사람들의 생활 모습을 살펴봤습니다. / 애장품의 뜻과 특징을 알아보았습니다. / 자료와 증언으로 옛날 사람들의 생활 모습을 살펴봤습니다. / 모둠별로 옛날 사람들의 생활 모습을 보여 주는 전시관을 꾸며 봤습니다.<\/li><\/ul><h3>유의할 점<\/h3><p>“학생들이 공부한 내용을 자유롭게 이야기할 수 있도록 허용적인 분위기를 만든다.” (지도서 230쪽)<\/p>"], "2": ["② 생각을 펼쳐요 (10분)", "<h3>진행<\/h3><ul><li>교과서 115~116쪽 두 가지 선택 활동을 소개하고, 반 또는 모둠별로 하나를 고릅니다.<\/li><li><b>돌아가며 말하기<\/b>로 타임캡슐에 넣을 물건이나 노랫말에 넣을 옛날 물건을 모읍니다.<\/li><\/ul><h3>유의할 점<\/h3><p>타임캡슐에 넣을 물건은 값비싼 물건이 아니어도 됨을 알려 주세요(지도서 예시: 털실, 열쇠고리, 몽당연필). 노랫말 원곡 가사는 교과서와 QR 영상으로 함께 봅니다.<\/p>"], "3": ["③ 활동 1 · 사다리 OX (10분)", "<h3>진행<\/h3><ul><li>교과서 117쪽 「재미있게 확인해요」: 사다리 속 설명을 읽고 옳은 설명 아래 가로 길을 색칠한 뒤 사다리를 타서 우승 트로피를 가져가는 어린이를 찾습니다. 화면에서는 같은 9개 설명을 ‘옳은 설명·틀린 설명’으로 나눕니다.<\/li><\/ul><h3>정답 (교과서 축소본, 지도서 231쪽)<\/h3><ul><li>○: 오래된 물건으로 과거의 생활 모습을 알 수 있습니다. / 일기는 과거의 모습을 알려 주는 자료입니다. / 옛날 신문에는 당시 사람들의 생각이 담겨 있습니다. / 우리 주변에는 옛 모습을 알려 주는 물건이 많습니다. / 오래된 사진을 보면 과거의 모습을 짐작할 수 있습니다.<\/li><li>×: 사진이 편지보다 더 중요한 자료입니다. / 집에 있는 물건으로는 과거의 모습을 알 수 없습니다. / 큰 물건일수록 옛 생활 모습을 더욱 잘 알 수 있습니다. / 옛날 생활 모습은 전시관으로만 보여 줄 수 있습니다.<\/li><li>우승 트로피를 가져가는 어린이: 철수<\/li><\/ul>"], "4": ["④ 활동 2 · 노랫말 짓기 (10분)", "<h3>진행<\/h3><ul><li>교과서 116쪽 선택 활동 2: 「함께 걸어 좋은 길」의 노랫말을 옛날 사람들의 생활 모습을 담은 내용으로 바꾸어 불러 봅니다.<\/li><li>화면 활동은 예시 노랫말 「부채와 화채」(교과서 116쪽)와 「모시옷과 삼베옷」(지도서 231쪽)에 나온 옛날 물건을 찾아보는 준비 활동입니다. 정답은 두 예시 노랫말에 나온 낱말만 골랐습니다.<\/li><\/ul><h3>지도서 예시 답안 「모시옷과 삼베옷」 (지도서 231쪽)<\/h3><p>반팔 옷을 입고도 여름에는 더운데 / 옛날 사람은 어떤 옷을 입고 다녔나 / 모시옷을 입거나 삼베옷을 입고서 / 더운 여름을 씩씩하게 이겨 냈다네<\/p><h3>유의할 점<\/h3><p>완성한 노랫말은 잘하고 못함을 가리지 말고, 옛날 생활 모습이 담겼는지를 중심으로 칭찬해 주세요. 타임캡슐을 고른 반은 이 시간에 타임캡슐을 완성합니다.<\/p>"], "5": ["⑤ 정리 (5분)", "<h3>얼마나 잘했을까 (교과서 117쪽) — 스스로 평가<\/h3><ul><li>주변에서 찾은 오래된 물건과 자료에 담긴 의미를 설명할 수 있습니다.<\/li><li>주변의 오래된 물건과 자료 등을 활용해 과거의 생활 모습을 알고, 이를 표현할 수 있습니다.<\/li><li>주변에서 볼 수 있는 오래된 물건과 자료의 소중함을 알게 됐습니다.<\/li><\/ul><h3>지도 방법 (지도서 231쪽)<\/h3><p>“‘주변에서 만나는 과거의 모습’을 공부한 후에 지식·이해, 과정·기능, 가치·태도에 어떤 변화가 있었는지 자기 평가를 하도록 안내한다.” “학생이 자신의 성취 수준을 별 두 개 이하로 표시하였다면 지도서에 있는 내용 정리를 활용하여 주요 내용을 되짚어 보도록 지도한다.”<\/p><h3>화면 퀴즈<\/h3><p>주제 2의 주요 용어(증언, 애장품, 고고학자, 자료가 만들어진 때, 전시관)를 정리합니다.<\/p><h3>다음 차시<\/h3><p>18차시: 지역 사람들의 옛 생활 모습을 어떻게 알 수 있을까요 (주제 3 「우리 지역 사람들의 달라진 생활 모습」 시작)<\/p>"]}};

(function(){

 function el(t,c,txt){var e=D.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
 function clean(t){return (t||'').replace(/[\u{1F000}-\u{1FAFF}☀-➿⬀-⯿⌀-⏿️‍]/gu,'').replace(/\s+/g,' ').trim()}

 function arrange(){var M=app.querySelector('main.lesson');if(!M||M.classList.contains('hs-ml'))return;

  /* v6 왼쪽 '수업 길'(2026-10-29): 탐구 질문·개념 정리·이 차시 + 세로 계단 목록(실제 계단 단추), 아래 막대 = 도구 · 이전/다음 계단 */

 /* 큰 화면: 앱 막대·단계 길·머리띠·오른쪽 판을 1280 기준으로 비례해 키움(활동은 앱이 스스로 맞춤) */

(function(){var D=document,H=D.documentElement;if(!D.getElementById('ovBar')||H.classList.contains('hs'))return;H.classList.add('hs-sci');
 /* v6 왼쪽 '수업 길'(2026-10-29 선생님: 과학 교과서도 같은 배치) — 쪽 나눔이 바뀌지 않게 본문 폭(1080px)을 줄이지 않는 자리에서만:
    넓은 화면(1340px~)은 펼치거나 접기(기기에 기억 hj-rail), 1150~1339px은 접힌 64px(펼치면 본문 위에 떠서 열림), 그보다 좁으면 없음(위 단계 탭 그대로).
    단계는 위 막대의 단계 탭을 그대로 누름(탭은 높이를 지키려고 감추기만 함) */
 var tabs=[].slice.call(D.querySelectorAll('body>nav .wrap>a[href^="#s"]'));if(!tabs.length)return;
 var NS='http://www.w3.org/2000/svg';function ico(d){var v=D.createElementNS(NS,'svg');v.setAttribute('viewBox','0 0 24 24');v.setAttribute('class','hs-ico');v.setAttribute('aria-hidden','true');var q=D.createElementNS(NS,'path');q.setAttribute('d',d);v.appendChild(q);return v}
 function el(t,c,x){var e=D.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
 var rail=el('aside','hs-srail'),fold=el('button','hs-fold');fold.type='button';rail.setAttribute('aria-label','수업 길');
 var goal=D.querySelector('main p.goal'),gt='';if(goal){var tmp=el('div');tmp.innerHTML=goal.innerHTML.replace(/<br\s*\/?>/gi,' ');gt=tmp.textContent.replace(/\s+/g,' ').replace(/^\s*🎯?\s*학습 목표\s*/,'').trim()}
 rail.appendChild(fold);
 if(gt){var g=el('div','hs-sgoal');g.appendChild(el('small','','학습 목표'));g.appendChild(el('p','',gt));rail.appendChild(g)}
 var list=el('ol','hs-slist'),items=tabs.map(function(a,i){var li=el('li'),b=el('button','hs-sst');b.type='button';b.title=(a.title||a.textContent).trim();

 function sync(){var cur=tabs.findIndex(function(a){return a.classList.contains('hj-cur')});items.forEach(function(b,i){b.classList.toggle('now',i===cur);b.classList.toggle('done',cur>-1&&i<cur);if(i===cur)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')})}

 function setR(c,save){H.classList.toggle('hs-rc',c);fold.setAttribute('aria-expanded',c?'false':'true');fold.title=c?'수업 길 펼치기':'수업 길 접기';fold.innerHTML='';fold.appendChild(ico(c?'M9 6l6 6-6 6':'M15 6l-6 6 6 6'));fold.appendChild(el('span','',c?'수업 길 펼치기':'수업 길 접기'));if(save)try{localStorage.setItem('hj-rail',c?'c':'')}catch(e){}}

 var nav=D.querySelector('body>nav'),tt=(D.title||'').split(/\s*·\s*/)[0].replace(/^\d+\.\s*/,'').trim();

/* 그 밖의 앱: 덮개가 본문 맨 위에 둔 [홈 · 자료 목록](.hj-navbar)을 남색 앱 막대로(맨 위 전체 폭) + 제목 */
(function(){var H=document.documentElement,D=document;
