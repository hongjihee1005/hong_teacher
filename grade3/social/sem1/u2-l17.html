<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🧩 생각을 펼쳐요 / 재미있게 확인해요</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>:root{
  --bg:#EAF1F8; --paper:#FFFFFF; --ink:#1F2A44; --soft:#4F5B75; --line:#CAD6E4;
  --ok:#1F9E63; --no:#D2453A; --acc:#2F74E0;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#162034;--paper:#22304C;--ink:#F2F5FB;--soft:#B7C3DB;--line:#3A4C74;}
}
:root[data-theme="dark"]{--bg:#162034;--paper:#22304C;--ink:#F2F5FB;--soft:#B7C3DB;--line:#3A4C74;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:26px;overflow:hidden}
button{font-family:var(--display);color:inherit;cursor:pointer}
button:focus-visible{outline:5px solid var(--acc);outline-offset:4px}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:clamp(14px,2vw,30px)}
.screen.on{display:flex}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0}
.title{font-size:clamp(52px,7vw,100px);line-height:1.1;text-align:center}
.lead{font-size:clamp(24px,2.4vw,34px);color:var(--soft);margin:0;text-align:center;word-break:keep-all}
.center-col{align-items:center;justify-content:center;gap:clamp(14px,2.2vh,28px);overflow-y:auto}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.row-label{font-family:var(--display);font-size:clamp(24px,2.2vw,32px)}
.seg{display:flex;border:3px solid var(--line);border-radius:18px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;font-size:clamp(22px,2vw,30px);padding:10px 20px;min-width:70px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.big-btn{font-size:clamp(32px,3.2vw,48px);padding:14px 50px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);box-shadow:0 6px 0 rgba(0,0,0,.25)}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.big-btn[disabled]{opacity:.35}
.ghost-btn{font-size:clamp(22px,2vw,30px);padding:10px 26px;border-radius:999px;border:3px solid var(--ink);background:transparent}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tools{display:flex;gap:10px;align-items:center}
.tool{font-size:24px;border:3px solid var(--line);background:var(--paper);border-radius:16px;padding:8px 16px}
.chip{font-family:var(--display);font-size:clamp(22px,2vw,30px);padding:6px 18px;border-radius:999px;background:var(--paper);border:3px solid var(--line)}
.chip.now{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip.win{border-color:#E8961E;background:#E8961E;color:#fff}
.scores{display:flex;gap:10px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(15,22,40,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.on{display:flex}
.panel{background:var(--paper);border-radius:28px;padding:clamp(24px,3vw,48px);width:min(1100px,94vw);max-height:92vh;overflow-y:auto;text-align:center;border-top:18px solid var(--pc,var(--ink))}
.panel h2{font-size:clamp(44px,5vw,72px);margin:0 0 10px}
.panel .why{font-size:clamp(28px,2.6vw,38px);line-height:1.55;margin:0 auto 22px;max-width:36em;word-break:keep-all}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}


.stagebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st{font-family:var(--display);cursor:pointer;font-size:clamp(19px,1.8vw,26px);padding:6px 14px;border-radius:999px;border:3px solid var(--line);background:var(--paper);color:var(--soft)}
.st.now{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.st.done{border-color:var(--ok);color:var(--ok)}
.goal{font-family:var(--display);font-size:clamp(20px,1.9vw,28px);color:var(--soft);text-align:center;margin:4px 0 0}
.body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:clamp(10px,1.6vh,20px);overflow-y:auto;padding:6px 0}
.hd{font-family:var(--display);font-size:clamp(30px,3.3vw,48px);text-align:center;margin:0}
.expq ul,.sumbox ul{margin:4px 0 0;padding-left:1.2em}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:6px}
.tnote{border:3px solid #6A4FC9;color:#6A4FC9;background:var(--paper);border-radius:16px;padding:8px 18px;font-size:clamp(19px,1.8vw,25px)}
.recall{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:min(1200px,96vw)}
.rc{position:relative;min-height:clamp(170px,23vh,250px);border:0;background:none;perspective:1200px;font-family:var(--body)}
.rc .in{position:absolute;inset:0;transition:transform .5s;transform-style:preserve-3d}
.rc.open .in{transform:rotateY(180deg)}
.rc .f{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.rc .front{background:var(--cc);color:#fff;font-family:var(--display);font-size:clamp(25px,2.6vw,36px)}
.rc .front span{font-size:clamp(46px,4.6vw,68px)}
.rc .front img,.card1 img.cphoto{border-radius:14px;object-fit:cover}
.rc .front img{width:100%;flex:1 1 0;min-height:0;height:auto;}
.rc .front{overflow:hidden;line-height:1.2}
.rc .front small{flex:none}
.card1 img.cphoto{width:clamp(150px,22vw,300px);aspect-ratio:4/3;border:3px solid var(--line);cursor:zoom-in}
.zoomhint{display:block;font-size:14px;color:var(--soft);text-align:center;margin-top:4px}
.bigview{position:fixed;inset:0;background:rgba(8,12,22,.95);display:none;align-items:center;justify-content:center;z-index:30;padding:6px}
.bigview.on{display:flex}
.bigview img{max-width:98vw;max-height:88vh;border-radius:12px}
.bigview .close{position:fixed;top:14px;right:16px;font-size:28px;border:0;border-radius:50%;width:60px;height:60px;background:rgba(255,255,255,.9);color:#1F2A44}
.bigview .meta{position:fixed;left:0;right:0;bottom:0;padding:10px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;text-align:center}
.bigview .meta b{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.4vw,32px);display:block}
.bigview .meta small{color:#dbe3f0;font-size:14px}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px;width:min(1250px,96vw)}
.ec{background:var(--paper);border-radius:20px;border-top:12px solid var(--cc);padding:12px 16px;text-align:left}
.ec img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;cursor:zoom-in;border:3px solid var(--line)}
.ec .num{font-family:var(--display);font-size:clamp(34px,3.6vw,52px);color:var(--cc);line-height:1.1}
.ec b{font-family:var(--display);font-weight:400;font-size:clamp(21px,2.1vw,28px);display:block;margin-top:6px}
.ec p{font-size:clamp(18px,1.8vw,24px);line-height:1.45;margin:4px 0 0}
.ec small{font-size:14px;color:var(--soft);display:block;margin-top:6px}
.expq{background:#FFF4D6;color:#1F2A44;border:4px solid #E8961E;border-radius:20px;padding:12px 20px;width:min(1250px,96vw);font-size:clamp(21px,2.1vw,30px);text-align:left}
.expq b{font-family:var(--display);font-weight:400;display:block;margin-bottom:4px}
.expq li{margin-bottom:4px}
.howbtn{border:3px solid #6A4FC9;color:#6A4FC9;background:var(--paper);border-radius:16px;padding:8px 20px;font-size:clamp(19px,1.8vw,25px)}
.lklist{display:grid;gap:12px;text-align:left;margin-bottom:18px}
.lkrow{display:flex;gap:14px;align-items:center;background:var(--bg);border-radius:16px;padding:12px 18px;text-decoration:none;color:inherit;border:3px solid var(--line)}
.lkrow:hover{border-color:var(--ink)}
.lkrow .e{font-size:clamp(30px,3vw,42px)}
.lkrow b{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.2vw,30px);display:block}
.lkrow small{color:var(--soft);font-size:clamp(17px,1.7vw,22px)}
.rc .back2{background:var(--paper);border:5px solid var(--cc);transform:rotateY(180deg);font-size:clamp(21px,2.1vw,29px)}
.qbox{background:#FFF4D6;color:#1F2A44;border:5px solid #E8961E;border-radius:26px;padding:clamp(16px,2.2vw,30px);width:min(1100px,94vw);text-align:center;font-family:var(--display);font-size:clamp(28px,3.1vw,46px);line-height:1.4}
.card1{width:min(1100px,92vw);background:var(--paper);border-radius:26px;border:4px solid var(--line);padding:clamp(16px,2.2vw,32px);display:flex;gap:clamp(16px,3vw,36px);align-items:center;justify-content:center}
.card1 .e{font-size:clamp(60px,7vw,110px);line-height:1;flex:none}
.card1 .x{font-family:var(--display);font-size:clamp(28px,3.4vw,50px);line-height:1.35}
.bins{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:clamp(10px,1.6vw,20px);width:min(1200px,96vw)}
.bin{border:0;background:var(--cc);color:#fff;border-radius:40px 40px 18px 18px;padding:clamp(14px,2vh,24px) 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 7px 0 rgba(0,0,0,.22)}
.bin .e{font-size:clamp(38px,4.4vw,66px);line-height:1}
.bin .n{font-size:clamp(24px,2.6vw,38px);text-align:center}
.bin .k{position:absolute;left:12px;bottom:8px;font-size:18px;opacity:.8}
.bin:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.22)}
.bin.lit{outline:6px solid var(--ink);outline-offset:4px}
.prob{width:min(1150px,95vw);background:var(--paper);border:5px solid var(--pc2);border-radius:24px;padding:clamp(12px,1.8vw,24px);display:flex;gap:18px;align-items:center}
.prob .e{font-size:clamp(44px,4.6vw,70px)}
.prob b{font-family:var(--display);font-weight:400;font-size:clamp(26px,2.8vw,40px);display:block;color:var(--pc2)}
.prob p{margin:4px 0 0;font-size:clamp(20px,2.1vw,30px)}
.ways{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(1200px,96vw)}
.way{border:4px solid var(--line);background:var(--paper);border-radius:18px;padding:10px 12px;font-family:var(--body);font-size:clamp(19px,1.9vw,26px);text-align:center;min-height:clamp(86px,11vh,132px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.way span{font-size:clamp(28px,2.8vw,40px)}
.way[aria-pressed="true"]{border-color:var(--ink);background:var(--bg);box-shadow:inset 0 0 0 4px var(--ink)}
.way.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--paper))}
.way.miss{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,var(--paper))}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:min(1150px,95vw)}
.sumbox{background:var(--paper);border-radius:22px;border-top:14px solid var(--cc);padding:16px 22px}
.sumbox b{font-family:var(--display);font-weight:400;font-size:clamp(25px,2.6vw,36px);display:block;margin-bottom:6px}
.sumbox li{font-size:clamp(21px,2.1vw,29px);line-height:1.5;margin-bottom:4px}
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(1000px,94vw)}
.opt2{border:4px solid var(--line);background:var(--paper);border-radius:18px;padding:12px 18px;font-family:var(--body);font-size:clamp(23px,2.4vw,33px)}
.opt2.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--paper))}
.opt2.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 14%,var(--paper))}
.fix{background:var(--bg);border-radius:18px;padding:12px 20px;font-size:clamp(23px,2.3vw,32px);margin:0 auto 18px;max-width:34em;text-align:left}
.promise{width:min(1100px,94vw);display:grid;gap:10px}
.promise div{background:var(--paper);border-radius:16px;padding:12px 20px;font-size:clamp(23px,2.2vw,32px);border-left:14px solid var(--ok)}
.tpanel{text-align:left}
.tpanel h3{font-family:var(--display);font-weight:400;font-size:clamp(24px,2.2vw,32px);margin:14px 0 6px;color:#6A4FC9}
.tpanel li,.tpanel p{font-size:clamp(20px,1.9vw,26px);line-height:1.55}

/* 크롬북(가로 1366×680)처럼 낮은 화면: 한 화면에 들어오도록 조금 촘촘하게 */
@media (max-height:760px) and (min-width:900px){
 .screen{padding:10px 20px}
 .body{gap:8px;padding:2px 0}
 .hd{font-size:clamp(26px,2.6vw,38px)}
 .goal{font-size:clamp(18px,1.6vw,24px);margin:0}
 .ec{padding:8px 12px;border-top-width:9px}
 .ec img{aspect-ratio:16/9}
 .ec .num{font-size:clamp(28px,2.8vw,42px)}
 .ec p{font-size:clamp(17px,1.5vw,22px)}
 .expq{padding:8px 16px;font-size:clamp(19px,1.7vw,25px)}
 .expq li{margin-bottom:0}
 .rc{min-height:clamp(150px,26vh,210px)}
 .card1{padding:12px 20px}
 .card1 .e{font-size:clamp(50px,5vw,80px)}
 .card1 .x{font-size:clamp(25px,2.6vw,40px)}
 .bin{padding:10px 8px}
 .bin .e{font-size:clamp(32px,3.4vw,50px)}
 .ways{grid-template-columns:repeat(5,1fr);gap:8px}
 .way{min-height:58px;padding:6px 10px;flex-direction:row;gap:8px;font-size:clamp(18px,1.6vw,23px)}
 .way span{font-size:clamp(24px,2.2vw,32px)}
 .prob{padding:8px 16px}
 .prob .e{font-size:clamp(36px,3.6vw,54px)}
 .prob b{font-size:clamp(23px,2.3vw,33px)}
 .prob p{font-size:clamp(18px,1.8vw,26px)}
 .sumbox{padding:10px 16px}
 .sumbox li{font-size:clamp(19px,1.7vw,25px);margin-bottom:2px}
 .qbox{padding:12px 20px}
 .promise div{padding:8px 16px;font-size:clamp(20px,1.9vw,28px)}
 .opt2{padding:8px 14px;font-size:clamp(21px,2vw,29px)}
 .foot{padding-top:2px}
}
@media (max-width:860px){.recall,.ways,.sum,.opts2,.bins{grid-template-columns:1fr 1fr}.way{min-height:72px;flex-direction:row;gap:8px}}

body,h1,h2,h3,h4,p,li,span,div,button,a,td,th,small,b,i{word-break:keep-all;overflow-wrap:break-word;line-break:strict}
.creditbar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;margin-top:16px}
.creditbar .madeby{width:100%}
.tolist{display:none;align-items:center;gap:8px;font-family:var(--display,sans-serif);font-size:clamp(20px,2vw,26px);
  text-decoration:none;color:inherit;border:3px solid var(--line,#ccc);background:var(--paper,#fff);border-radius:999px;padding:8px 22px}
.tolist.on{display:inline-flex}
.rel.on{display:grid!important}
.madeby{font-size:16px;color:var(--soft,#666);opacity:.85;text-align:center;font-family:var(--body,sans-serif)}

h1,h2,h3,h4,.title,.hd,.qt,.x,.n,.nm,.big,.lead,.sit,.ask,.qtext,.front .n,.slot b,.dc h3,.lk b,.rl b{text-wrap:balance}
p,li,small,.d,.ex,.why,.blurb,.ask2,.sub,.msg,.notice,.fix,.retry div,.opt,.opt2,.way,.mbox .n,.dc p,.lk small,.rl small{text-wrap:pretty}
</style><style id="hjfoot-css">.hjfoot{display:block;width:100%;flex-basis:100%;margin:40px 0 0;padding:16px 0 4px;border:0;border-top:3px solid var(--line,#CAD6E4);text-align:center;color:var(--soft,#4F5B75);font-family:var(--body,inherit);font-size:17px;line-height:1.7;word-break:keep-all;opacity:1}.hjfoot p{margin:2px 0;padding:0;border:0;background:none;font-size:inherit;color:inherit;text-align:center}</style><style id="hj-contact-css">.hj-contact{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px 12px;margin:8px 0 0;padding:0}.hj-contact a{display:inline-flex;align-items:center;gap:6px;color:var(--ink,#1F2A44);text-decoration:none;font-size:15px;line-height:1.2;background:var(--paper,#fff);border:2px solid var(--line,#CAD6E4);border-radius:999px;padding:5px 12px;white-space:nowrap}.hj-contact a:hover,.hj-contact a:focus-visible{border-color:var(--ink,#1F2A44);outline:0}.hj-contact svg{flex:none}#ovNavMade+.hj-contact{margin:0 0 0 8px;flex:none;flex-wrap:nowrap;gap:6px}#ovNavMade+.hj-contact a{font-size:13px;padding:3px 9px}@media print{.hj-contact a{border:0;padding:0}}</style><!--hj-ctheme--><style id="hj-ctheme">/* hj-ctheme · 수업 자료 페이지 공통: 글꼴을 Pretendard로, 바탕·글자색을 메뉴와 같은 밝고 따뜻한 톤으로 */
@font-face{font-family:'Jua';font-style:normal;font-weight:100 900;font-display:swap;
 src:url(https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2-subset/Pretendard-Bold.subset.woff2) format('woff2')}

 src:url(https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2-subset/Pretendard-Bold.subset.woff2) format('woff2')}
@media (prefers-color-scheme:light){html:root:not([data-theme="dark"]){--bg:#FFFCF8;--paper:#FFFFFF;--ink:#2A221C;--soft:#5C5047;--muted:#5C5047;--line:#EFE3D6;--warmline:#EFE3D6}}
html:root[data-theme="light"]{--bg:#FFFCF8;--paper:#FFFFFF;--ink:#2A221C;--soft:#5C5047;--muted:#5C5047;--line:#EFE3D6;--warmline:#EFE3D6}
@media (prefers-color-scheme:dark){html:root:not([data-theme="light"]){--bg:#221E1A;--paper:#2B2621;--ink:#F2EBE3;--soft:#C9BCB0;--muted:#C9BCB0;--line:#43392F}}
html:root[data-theme="dark"]{--bg:#221E1A;--paper:#2B2621;--ink:#F2EBE3;--soft:#C9BCB0;--muted:#C9BCB0;--line:#43392F}
html body{-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
html h1,html h2,html h3{letter-spacing:-.025em}
html:root{--night:#4A3A2E;--night2:#8A6A52;--pine:#5C9A7C;--pine-soft:#E6F3EC}
/* ── 수업 세트 공통 틀(첫 화면·진행 화면) 다듬기: 얇은 선, 부드러운 그림자, 정돈된 글자 크기 ── */
html body .title{font-size:clamp(34px,min(4.8vw,8.5vh),66px);font-weight:800;letter-spacing:-.035em;line-height:1.2}
html body .lead{font-size:clamp(17px,1.6vw,22px);font-weight:600;color:var(--soft);letter-spacing:-.01em}
html body .qbox{background:#FFF5E6;border:0;border-left:8px solid #F2B872;border-radius:20px;font-size:clamp(20px,2.1vw,30px)!important;font-weight:700;line-height:1.55;
 box-shadow:0 1px 2px rgba(80,55,30,.05),0 16px 32px -22px rgba(80,55,30,.4)}
@media (prefers-color-scheme:dark){html:root:not([data-theme="light"]) body .qbox{background:#3A3024;border-left-color:#C98A2A}}

<script>const $=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let SOUND=true,actx=null;
function beep(kind){
  if(!SOUND) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const map={ok:[[660,'triangle'],[880,'triangle']],no:[[300,'square'],[220,'square']],tick:[[520,'sine']],win:[[523,'triangle'],[659,'triangle'],[784,'triangle'],[1047,'triangle']]};
    (map[kind]||map.tick).forEach(([f,t],i)=>{
      const o=actx.createOscillator(),g=actx.createGain(),s=actx.currentTime+i*.13;
      o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.0001,s);
      g.gain.exponentialRampToValueAtTime(.16,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.22);
      o.connect(g).connect(actx.destination);o.start(s);o.stop(s+.24);
    });
  }catch(e){}
}
function toggleFull(){try{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}catch(e){}}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));}
function openO(id){$(id).classList.add('on');}
function closeO(id){$(id).classList.remove('on');}
function wireTools(){
  document.querySelectorAll('[data-full]').forEach(b=>b.onclick=toggleFull);
  document.querySelectorAll('[data-sound]').forEach(b=>b.onclick=()=>{SOUND=!SOUND;document.querySelectorAll('[data-sound]').forEach(x=>x.textContent=SOUND?'🔊':'🔇');});
}
function seg(id,opts,get,set){
  const s=$(id);s.innerHTML='';
  opts.forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;b.setAttribute('aria-pressed',get()===v);b.onclick=()=>{set(v);seg(id,opts,get,set);};s.appendChild(b);});
}
/* 활동 단위(반·개별·짝·모둠·분단·번호순·기타) 공통 기능 */
let MODE='class',TEAMS=4,LINES=4,CLASSN=25,ETCNOTE='',TURN=0,SCORES=[];
const MODES=[['class','🏫 반'],['solo','🙋 개별'],['pair','👫 짝'],['group','👨‍👩‍👧 모둠'],['line','🪑 분단'],['number','🔢 번호순'],['etc','✏️ 기타']];
function teamSeg(id){
  const host=$(id); if(!host) return;
  host.classList.remove('seg');
  host.style.cssText='display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;border:0;background:none';
  host.innerHTML=`<span class="seg" id="${id}-m">${MODES.map(([k,l])=>`<button data-m="${k}" aria-pressed="${MODE===k}">${l}</button>`).join('')}</span><span id="${id}-sub"></span>`;
  host.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{MODE=b.dataset.m;teamSeg(id);});
  const sb=$(id+'-sub'); sb.style.cssText='display:inline-flex;gap:10px;align-items:center;flex-wrap:wrap';
  const numInput=(sid,val,max)=>`<input id="${sid}" type="number" min="2" max="${max}" value="${val}" style="width:4.5em;font-size:clamp(20px,2vw,28px);padding:6px 10px;border:3px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font-family:var(--body)">`;
  if(MODE==='group'){
    sb.innerHTML=`<span class="row-label">몇 모둠</span><span class="seg" id="${id}-n">${[2,3,4,5,6].map(v=>`<button data-n="${v}" aria-pressed="${TEAMS===v}">${v}</button>`).join('')}</span>`;
    sb.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{TEAMS=+b.dataset.n;teamSeg(id);});
  }else if(MODE==='line'){
    sb.innerHTML=`<span class="row-label">몇 분단</span><span class="seg" id="${id}-l">${[2,3,4,5,6].map(v=>`<button data-l="${v}" aria-pressed="${LINES===v}">${v}</button>`).join('')}</span>`;
    sb.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{LINES=+b.dataset.l;teamSeg(id);});
  }else if(MODE==='number'){
    sb.innerHTML=`<span class="row-label">우리 반</span>${numInput(id+'-c',CLASSN,40)}<span class="row-label">명 · 1번부터 차례로 답해요</span>`;
    $(id+'-c').oninput=()=>{CLASSN=Math.max(2,+$(id+'-c').value||25);};
  }else if(MODE==='etc'){
    sb.innerHTML=`<input id="${id}-e" type="text" placeholder="예: 두 모둠씩 짝지어 대결" value="${ETCNOTE.replace(/"/g,'&quot;')}" style="width:min(22em,60vw);font-size:clamp(19px,1.9vw,26px);padding:8px 14px;border:3px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);font-family:var(--body)">
      <span class="row-label" style="font-size:clamp(17px,1.6vw,22px);color:var(--soft)">선생님이 방법을 설명한 뒤 '다음'으로 진행해요</span>`;
    $(id+'-e').oninput=()=>{ETCNOTE=$(id+'-e').value;};
  }else{
    const t={class:'반 전체가 함께 답하고 점수를 모아요.',solo:'각자 생각하고 답해요. 점수는 매기지 않아요.',pair:'짝과 의논해서 답해요. 점수는 매기지 않아요.'}[MODE];
    sb.innerHTML=`<span class="row-label" style="font-size:clamp(18px,1.7vw,23px);color:var(--soft)">${t}</span>`;
  }
}
function unitName(){return MODE==='line'?'분단':'모둠';}
function teamCount(){
  if(MODE==='group')return TEAMS;
  if(MODE==='line')return LINES;
  return 1;
}
function usesTeams(){return MODE==='group'||MODE==='line';}
function noScore(){return MODE==='solo'||MODE==='pair'||MODE==='etc';}
function teamInit(){SCORES=Array(teamCount()).fill(0);TURN=0;}
function teamAdd(n){if(noScore())return;SCORES[TURN]=(SCORES[TURN]||0)+n;}
function teamNext(){
  if(usesTeams())TURN=(TURN+1)%teamCount();
  else if(MODE==='number')TURN=(TURN+1)%Math.max(2,CLASSN);
}
function teamChips(el){
  if(!el)return;el.className='scores';
  if(noScore()){el.innerHTML='';el.style.display='none';return;}
  el.style.display='flex';
  if(usesTeams()){el.innerHTML=SCORES.map((s,i)=>`<span class="chip ${i===TURN?'now':''}">${i+1}${unitName()} ${s}</span>`).join('');}
  else el.innerHTML=`<span class="chip now">⭐ ${SCORES[0]}점</span>`;
}
function teamTurn(){
  if(MODE==='solo')return '🙋 각자 생각해 보세요';
  if(MODE==='pair')return '👫 짝과 의논해 보세요';
  if(MODE==='class')return '🏫 반 전체가 함께 답해요';
  if(MODE==='number')return `🔢 지금은 ${TURN+1}번 차례예요`;
  if(MODE==='etc')return ETCNOTE?('✏️ '+ETCNOTE):'✏️ 선생님 안내에 따라 활동해요';
  return `🙋 지금은 ${TURN+1}${unitName()} 차례예요`;
}
function teamPodium(){
  if(noScore())return '';
  if(!usesTeams())return `<span class="chip win">⭐ ${SCORES[0]}점</span>`;
  const mx=Math.max(...SCORES);
  return SCORES.map((s,i)=>`<span class="chip ${s===mx?'win':''}">${i+1}${unitName()} ${s}점</span>`).join('');
}
function teamWinnerText(){
  if(MODE==='solo')return '각자 푼 문제를 공책과 맞춰 봐요.';
  if(MODE==='pair')return '짝과 함께 잘 해냈어요.';
  if(MODE==='etc')return '모두 수고했어요.';
  if(!usesTeams())return `우리 반 점수는 ${SCORES[0]}점이에요.`;
  const mx=Math.max(...SCORES),w=SCORES.map((s,i)=>s===mx?i+1:null).filter(Boolean);

], "a": 0, "w": "과거에 사용하던 물건 중에서 소중하게 간직하는 것을 애장품이라고 해요."}, {"q": "옛날 사람들이 남긴 물건이나 건축물을 찾아내고 연구해 옛날 생활 모습을 알아내는 사람은?", "o": ["고고학자", "극장 화가", "안내양", "우체부"], "a": 0, "w": "고고학자는 옛날 물건과 건축물을 찾아내고 연구해요."}, {"q": "자료로 옛날 사람들의 생활 모습을 알아보려면 무엇을 확인해야 할까요?", "o": ["자료가 만들어진 때", "자료의 무게", "자료의 색깔", "자료를 산 가게"], "a": 0, "w": "자료로 알아보려면 그것이 만들어진 때를 확인해야 해요."}, {"q": "어떤 물품을 한자리에 모아 볼 수 있게 한 것을 무엇이라고 할까요?", "o": ["전시관", "타임캡슐", "우물", "비석"], "a": 0, "w": "어떤 물품을 한자리에 모아 볼 수 있게 한 것을 전시관이라고 해요."}], "final": {"hd": "🧩 주제 정리", "lines": ["오래된 물건, 자료, 증언으로 옛날 사람들의 생활 모습을 알 수 있어요.", "애장품에는 각자의 추억이 담겨 있고, 오래된 물건과 자료는 과거를 알려 주는 소중한 것이에요.", "타임캡슐, 노래, 전시관 등 여러 방법으로 과거의 모습을 남기고 보여 줄 수 있어요.", "다음 시간에는 지역 사람들의 옛 생활 모습을 어떻게 알 수 있는지 살펴봐요."]}, "notes": {"0": ["수업 준비", "<h3>학습 목표<\/h3><p>‘주변에서 만나는 과거의 모습’에서 공부한 내용을 다양한 방법으로 정리할 수 있다. (지도서 230쪽)<\/p><h3>흐름<\/h3><ul><li>도입 5분 → 생각을 펼쳐요(선택 활동 안내) 10분 → 활동 1 재미있게 확인해요 10분 → 활동 2 노랫말 짓기 준비 10분 → 정리 5분<\/li><li>교과서 115~117쪽 · 지도서 230~231쪽 · 수업 기법: 만들기, 돌아가며 말하기<\/li><li>선택 활동 1(타임캡슐)을 고른 반은 활동 2 시간을 타임캡슐 만들기에 쓰세요. 화면 활동 2는 선택 활동 2(노랫말)를 고른 반을 위한 준비 활동입니다.<\/li><\/ul><h3>준비물<\/h3><ul><li>선택 활동 1: 타임캡슐로 쓸 빈 병, 타임캡슐에 넣을 물건, 종이 (교과서 115쪽)<\/li><li>선택 활동 2: 「함께 걸어 좋은 길」(이경애 작사, 정보형 작곡) 노래 영상 QR (교과서 116쪽)<\/li><\/ul><h3>선택 활동 1 · 나만의 타임캡슐 (지도서 231쪽)<\/h3><ul><li>융합 교과: 사회, 미술 / 핵심 역량: 정보 활용 능력, 창의적 사고력<\/li><li>순서: ① 30년 후에 현재의 내 모습을 떠올릴 수 있는 물건과 그 물건을 준비한 까닭 쓰기 ② 준비한 물건을 빈 병에 넣고 종이에 필요한 내용(만든 날짜, 타임캡슐을 열 때, 주의 사항) 쓰기 ③ 병에 종이를 붙인 후 보관하기<\/li><li>지도 방법: 현재의 내 모습을 가장 잘 설명할 수 있는 물건들을 준비하게 하고, 그 까닭을 적도록 한다. / 넣을 물건의 크기를 고려하여 타임캡슐로 만들 빈 병을 준비하게 한다. / 타임캡슐의 겉모습을 꾸미는 것보다 넣을 물건을 잘 선택하는 것이 중요함을 지도한다.<\/li><li>예시 답안: 오카리나 — 삼촌이 선물로 주신 오카리나를 불면 저와 잘 놀아 주시는 삼촌 생각이 나서 기분이 좋아지기 때문입니다(교과서 115쪽) / 털실: 할머니가 생각나기 때문이다. / 열쇠고리: 집에 이사 온 날이 생각나기 때문이다. / 몽당연필: 내가 오랜 시간 아껴 쓴 연필이기 때문이다. (지도서 231쪽)<\/li><\/ul><h3>선택 활동 2 · 노랫말 바꾸어 부르기 (지도서 231쪽)<\/h3><ul><li>융합 교과: 사회, 음악 / 핵심 역량: 의사소통 및 협업 능력, 창의적 사고력<\/li><li>지도 방법: 옛날 사람들의 생활 모습을 보여 주는 물건에는 무엇이 있는지 생각하여 노랫말을 지어 보도록 지도한다. / 교과서에 제시된 내용을 활용하되, 교과서 외의 내용이 필요한 경우 인터넷을 활용하여 알아볼 수 있도록 한다.<\/li><li>예시: 교과서 116쪽 「부채와 화채」, 지도서 231쪽 「모시옷과 삼베옷」<\/li><\/ul><h3>성취 기준<\/h3><p>[4사02-02] 오래된 물건이나 자료들을 주변에서 찾아보고, 이를 통해 과거의 모습을 살펴볼 수 있음을 이해한다.<\/p><h3>성취 수준<\/h3><ul><li><b>A<\/b> 주변에서 오래된 물건이나 자료들을 찾아보며 과거의 모습을 탐색하고, 역사가 증거를 바탕으로 구성된다는 것을 추정할 수 있다.<\/li><li><b>B<\/b> 주변에서 오래된 물건이나 자료들을 찾아보고, 이들이 과거의 모습을 알려 주는 증거임을 짐작하여 설명할 수 있다.<\/li><li><b>C<\/b> 주변에서 과거의 모습을 살펴볼 수 있는 오래된 물건이나 자료들을 찾을 수 있다.<\/li><\/ul><h3>주제 「지도상의 유의점」 (지도서 187쪽)<\/h3><ul><li>오래된 물건, 자료, 증언 등은 학생들이 공감할 수 있는 친숙한 사례를 찾아 활용하도록 한다.<\/li><li>역사적 맥락을 고려하되, 되도록 현재와 가까운 과거의 자료를 제시해 학생들이 과거의 생활 모습을 쉽게 인식할 수 있게 한다.<\/li><li>과거에 관해 설명할 때 자기와 다른 자료를 선택한 친구를 존중하는 태도를 기를 수 있도록 한다.<\/li><\/ul><h3>주제의 평가 계획 (지도서 187쪽)<\/h3><ul><li>주변의 오래된 물건, 자료 등을 활용해 과거의 모습을 설명할 수 있다. — 구술 평가<\/li><li>다양한 자료를 활용하여 옛날 사람들의 생활 모습을 보여 주는 전시관을 꾸밀 수 있다. — 관찰 평가<\/li><li>오래된 물건, 자료, 증언 등을 소중히 여기는 태도를 기른다. — 관찰 평가<\/li><\/ul><h3>지도서 대조 검증<\/h3><ul><li>차시명·학습 문제·선택 활동·노랫말 예시(교과서 116쪽, 지도서 231쪽)·얼마나 잘했을까·유의점 대조 완료.<\/li><li>「재미있게 확인해요」 사다리 설명 하나를 교과서와 다르게 바꿔 두었던 것을 바로잡음: 교과서 117쪽 원문은 “우리 주변에는 옛 모습을 알려 주는 물건이 많습니다.”(○)인데 화면과 교사 안내 정답표에는 “…많지 않습니다.”(×)로 되어 있었음 → 교과서 문장과 정답(○)으로 되돌리고 정답표(○ 5개, × 4개)를 고침. 우승 트로피는 철수(교과서 축소본으로 확인).<\/li><\/ul>"], "1": ["① 도입 (5분)", "<h3>발문 (지도서 230쪽)<\/h3><p>‘주변에서 만나는 과거의 모습’에서 공부한 내용은 무엇인가요?<\/p><h3>예상 반응<\/h3><ul><li>우리 주변의 오래된 물건으로 옛날 사람들의 생활 모습을 살펴봤습니다. / 애장품의 뜻과 특징을 알아보았습니다. / 자료와 증언으로 옛날 사람들의 생활 모습을 살펴봤습니다. / 모둠별로 옛날 사람들의 생활 모습을 보여 주는 전시관을 꾸며 봤습니다.<\/li><\/ul><h3>유의할 점<\/h3><p>“학생들이 공부한 내용을 자유롭게 이야기할 수 있도록 허용적인 분위기를 만든다.” (지도서 230쪽)<\/p>"], "2": ["② 생각을 펼쳐요 (10분)", "<h3>진행<\/h3><ul><li>교과서 115~116쪽 두 가지 선택 활동을 소개하고, 반 또는 모둠별로 하나를 고릅니다.<\/li><li><b>돌아가며 말하기<\/b>로 타임캡슐에 넣을 물건이나 노랫말에 넣을 옛날 물건을 모읍니다.<\/li><\/ul><h3>유의할 점<\/h3><p>타임캡슐에 넣을 물건은 값비싼 물건이 아니어도 됨을 알려 주세요(지도서 예시: 털실, 열쇠고리, 몽당연필). 노랫말 원곡 가사는 교과서와 QR 영상으로 함께 봅니다.<\/p>"], "3": ["③ 활동 1 · 사다리 OX (10분)", "<h3>진행<\/h3><ul><li>교과서 117쪽 「재미있게 확인해요」: 사다리 속 설명을 읽고 옳은 설명 아래 가로 길을 색칠한 뒤 사다리를 타서 우승 트로피를 가져가는 어린이를 찾습니다. 화면에서는 같은 9개 설명을 ‘옳은 설명·틀린 설명’으로 나눕니다.<\/li><\/ul><h3>정답 (교과서 축소본, 지도서 231쪽)<\/h3><ul><li>○: 오래된 물건으로 과거의 생활 모습을 알 수 있습니다. / 일기는 과거의 모습을 알려 주는 자료입니다. / 옛날 신문에는 당시 사람들의 생각이 담겨 있습니다. / 우리 주변에는 옛 모습을 알려 주는 물건이 많습니다. / 오래된 사진을 보면 과거의 모습을 짐작할 수 있습니다.<\/li><li>×: 사진이 편지보다 더 중요한 자료입니다. / 집에 있는 물건으로는 과거의 모습을 알 수 없습니다. / 큰 물건일수록 옛 생활 모습을 더욱 잘 알 수 있습니다. / 옛날 생활 모습은 전시관으로만 보여 줄 수 있습니다.<\/li><li>우승 트로피를 가져가는 어린이: 철수<\/li><\/ul>"], "4": ["④ 활동 2 · 노랫말 짓기 (10분)", "<h3>진행<\/h3><ul><li>교과서 116쪽 선택 활동 2: 「함께 걸어 좋은 길」의 노랫말을 옛날 사람들의 생활 모습을 담은 내용으로 바꾸어 불러 봅니다.<\/li><li>화면 활동은 예시 노랫말 「부채와 화채」(교과서 116쪽)와 「모시옷과 삼베옷」(지도서 231쪽)에 나온 옛날 물건을 찾아보는 준비 활동입니다. 정답은 두 예시 노랫말에 나온 낱말만 골랐습니다.<\/li><\/ul><h3>지도서 예시 답안 「모시옷과 삼베옷」 (지도서 231쪽)<\/h3><p>반팔 옷을 입고도 여름에는 더운데 / 옛날 사람은 어떤 옷을 입고 다녔나 / 모시옷을 입거나 삼베옷을 입고서 / 더운 여름을 씩씩하게 이겨 냈다네<\/p><h3>유의할 점<\/h3><p>완성한 노랫말은 잘하고 못함을 가리지 말고, 옛날 생활 모습이 담겼는지를 중심으로 칭찬해 주세요. 타임캡슐을 고른 반은 이 시간에 타임캡슐을 완성합니다.<\/p>"], "5": ["⑤ 정리 (5분)", "<h3>얼마나 잘했을까 (교과서 117쪽) — 스스로 평가<\/h3><ul><li>주변에서 찾은 오래된 물건과 자료에 담긴 의미를 설명할 수 있습니다.<\/li><li>주변의 오래된 물건과 자료 등을 활용해 과거의 생활 모습을 알고, 이를 표현할 수 있습니다.<\/li><li>주변에서 볼 수 있는 오래된 물건과 자료의 소중함을 알게 됐습니다.<\/li><\/ul><h3>지도 방법 (지도서 231쪽)<\/h3><p>“‘주변에서 만나는 과거의 모습’을 공부한 후에 지식·이해, 과정·기능, 가치·태도에 어떤 변화가 있었는지 자기 평가를 하도록 안내한다.” “학생이 자신의 성취 수준을 별 두 개 이하로 표시하였다면 지도서에 있는 내용 정리를 활용하여 주요 내용을 되짚어 보도록 지도한다.”<\/p><h3>화면 퀴즈<\/h3><p>주제 2의 주요 용어(증언, 애장품, 고고학자, 자료가 만들어진 때, 전시관)를 정리합니다.<\/p><h3>다음 차시<\/h3><p>18차시: 지역 사람들의 옛 생활 모습을 어떻게 알 수 있을까요 (주제 3 「우리 지역 사람들의 달라진 생활 모습」 시작)<\/p>"]}};

function act1(){
