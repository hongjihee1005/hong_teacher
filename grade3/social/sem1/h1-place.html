<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🏡 여러 장소 우표첩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#EEF4EA; --paper:#FFFFFF; --ink:#23324A; --soft:#5A6A80; --line:#CFDCCB;
  --ok:#1F9E63; --no:#D2453A; --accent:#6A4FC9;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#18241C;--paper:#243329;--ink:#F1F5EF;--soft:#B8C6B8;--line:#3C5143;}
}
:root[data-theme="dark"]{--bg:#18241C;--paper:#243329;--ink:#F1F5EF;--soft:#B8C6B8;--line:#3C5143;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:clamp(22px,2.4vw,28px);line-height:1.5}
button{font-family:var(--display);color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
main{max-width:980px;margin:0 auto;padding:clamp(14px,3vw,36px)}
.screen{display:none}.screen.on{display:block}
h1,h2{font-family:var(--display);font-weight:400;margin:0}
h1{font-size:clamp(38px,5.6vw,64px);line-height:1.15}
h2{font-size:clamp(30px,4.2vw,46px)}
.sub{color:var(--soft);margin:6px 0 0;word-break:keep-all}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.homeb{border:3px solid var(--line);background:var(--paper);border-radius:14px;padding:6px 16px;font-size:22px}
.btn{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:12px 34px;font-size:clamp(26px,3vw,34px);box-shadow:0 5px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn[disabled]{opacity:.35}
.speak{border:3px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 14px;font-size:20px;vertical-align:middle}
.center{text-align:center}
.badge{display:inline-grid;place-items:center;width:1.2em;height:1.2em;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--display);font-size:.8em;line-height:1}
.album{margin-top:22px;display:grid;gap:18px}
.slot{display:flex;align-items:center;gap:18px;background:var(--paper);border:3px dashed var(--line);border-radius:22px;padding:16px 20px;text-align:left;width:100%;font-family:var(--body);font-size:inherit}
.slot .stamp{flex:none;width:clamp(84px,12vw,112px);aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:clamp(40px,6vw,56px);background:var(--bg);border:4px dashed var(--line);filter:grayscale(1);opacity:.55}
.slot.done{border-style:solid;border-color:var(--sc)}
.slot.done .stamp{filter:none;opacity:1;border:6px dotted var(--sc);background:var(--paper);transform:rotate(-6deg)}
.slot b{font-family:var(--display);font-weight:400;font-size:clamp(28px,3.6vw,38px);display:block}
.slot small{color:var(--soft);font-size:clamp(20px,2.2vw,24px)}
.slot .num{font-family:var(--display);font-size:22px;color:var(--soft)}
.reset{margin-top:16px;background:none;border:0;color:var(--soft);font-family:var(--body);font-size:18px;text-decoration:underline}
.flipgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:18px;margin:14px 0 22px}
.flip{position:relative;min-height:260px;border:0;padding:0;background:none;perspective:1200px;text-align:left;font-family:var(--body);font-size:inherit}
.flip .in{position:absolute;inset:0;transition:transform .5s;transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;padding:18px 22px;display:flex;flex-direction:column;justify-content:center}
.front{background:var(--cc);color:#fff;align-items:center;text-align:center}
.front .e{font-size:72px;line-height:1}
.front .n{font-family:var(--display);font-size:clamp(34px,4.4vw,46px)}
.front small{opacity:.9;font-size:20px}
.back{background:var(--paper);border:5px solid var(--cc);transform:rotateY(180deg);gap:6px}
.back b{font-family:var(--display);font-weight:400;font-size:clamp(28px,3.4vw,34px);color:var(--cc)}
.back .d{font-size:clamp(22px,2.6vw,27px);word-break:keep-all}
.back .ex{font-size:clamp(19px,2.2vw,22px);color:var(--soft);word-break:keep-all}
.prog{height:14px;background:var(--paper);border-radius:99px;overflow:hidden;border:2px solid var(--line);margin:4px 0 16px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.letter{background:var(--paper);border-radius:18px;padding:22px 24px;border:3px solid var(--line);position:relative;
  background-image:repeating-linear-gradient(135deg,#E0506B 0 14px,transparent 14px 28px,#2F74E0 28px 42px,transparent 42px 56px);background-size:100% 10px;background-repeat:no-repeat}
.letter .tag{display:inline-block;border:3px dashed var(--soft);color:var(--soft);border-radius:8px;padding:0 10px;font-family:var(--display);font-size:20px;transform:rotate(-3deg)}
.letter .row{display:flex;gap:16px;align-items:center;margin-top:8px}
.letter .e{font-size:clamp(60px,9vw,88px);line-height:1;flex:none}
.cimg{width:clamp(120px,20vw,220px);aspect-ratio:4/3;object-fit:cover;border-radius:14px;display:block;border:3px solid var(--line);cursor:zoom-in}
.zoomhint{display:block;font-size:14px;color:var(--soft);text-align:center;margin-top:4px}
.bigview{position:fixed;inset:0;background:rgba(8,12,22,.95);display:none;align-items:center;justify-content:center;z-index:30;padding:6px}
.bigview.on{display:flex}
.bigview img{max-width:98vw;max-height:88vh;border-radius:12px}
.bigview .close{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;font-size:28px;border:0;border-radius:50%;width:60px;height:60px;background:rgba(255,255,255,.9);color:#1F2A44}
.bigview .meta{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;text-align:center}
.bigview .meta b{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.4vw,32px);display:block}
.bigview .meta small{color:#dbe3f0;font-size:14px}
.phcredit{margin-top:22px;background:var(--paper);border-left:12px solid var(--accent);border-radius:14px;padding:12px 18px;font-size:15px;color:var(--soft);line-height:1.5}
.phcredit b{font-family:var(--display);font-weight:400;color:var(--accent);font-size:18px}
.letter .x{font-family:var(--display);font-size:clamp(28px,3.8vw,40px);line-height:1.35;word-break:keep-all}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:18px}
.mbox{border:0;background:var(--cc);color:#fff;border-radius:40px 40px 14px 14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.mbox .e{font-size:44px;line-height:1.1}.mbox .n{font-size:clamp(22px,2.8vw,28px);text-align:center;word-break:keep-all}
.mbox.dim{opacity:.3}
.mbox.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.msg{margin-top:16px;border-radius:16px;padding:14px 18px;display:none;word-break:keep-all}
.msg.on{display:block}
.msg.ok{background:color-mix(in srgb,var(--ok) 16%,var(--paper));border:3px solid var(--ok)}
.msg.no{background:color-mix(in srgb,var(--no) 12%,var(--paper));border:3px solid var(--no)}
.msg b{font-family:var(--display);font-weight:400;font-size:clamp(26px,3vw,32px);display:block}
.next{margin-top:14px;text-align:right}
.q{background:var(--paper);border-radius:18px;padding:22px 24px;border:3px solid var(--line)}
.q .qt{font-family:var(--display);font-size:clamp(28px,3.8vw,40px);line-height:1.35;word-break:keep-all}
.opts{display:grid;gap:12px;margin-top:16px}
.opts.ox{grid-template-columns:1fr 1fr}
.opt{border:3px solid var(--line);background:var(--paper);border-radius:16px;padding:12px 18px;font-size:clamp(24px,3vw,30px);text-align:left;word-break:keep-all}
.opts.ox .opt{font-size:clamp(56px,9vw,84px);text-align:center;padding:6px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--paper))}
.opt.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 14%,var(--paper))}
.result{text-align:center;padding:10px 0}
.result .big{font-size:96px;line-height:1.1}
.result .stars{font-size:52px;letter-spacing:6px}
.retry{margin-top:18px;background:var(--paper);border-radius:16px;padding:14px 18px;text-align:left}
.retry div{padding:8px 0;border-bottom:2px dashed var(--line);word-break:keep-all}
.retry div:last-child{border:0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

body,h1,h2,h3,h4,p,li,span,div,button,a,td,th,small,b,i{word-break:keep-all;overflow-wrap:break-word;line-break:strict}
.creditbar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;margin-top:16px}
.creditbar .madeby{width:100%}
.tolist{display:none;align-items:center;gap:8px;font-family:var(--display,sans-serif);font-size:clamp(20px,2vw,26px);
  text-decoration:none;color:inherit;border:3px solid var(--line,#ccc);background:var(--paper,#fff);border-radius:999px;padding:8px 22px}
.tolist.on{display:inline-flex}
.rel.on{display:grid!important}
.madeby{font-size:16px;color:var(--soft,#666);opacity:.85;text-align:center;font-family:var(--body,sans-serif)}

h1,h2,h3,h4,.title,.hd,.qt,.x,.n,.nm,.big,.lead,.sit,.ask,.qtext,.front .n,.slot b,.dc h3,.lk b,.rl b{text-wrap:balance}
p,li,small,.d,.ex,.why,.blurb,.ask2,.sub,.msg,.notice,.fix,.retry div,.opt,.opt2,.way,.mbox .n,.dc p,.lk small,.rl small{text-wrap:pretty}
</style>
<style id="hjfoot-css">.hjfoot{display:block;width:100%;flex-basis:100%;margin:40px 0 0;padding:16px 0 4px;border:0;border-top:3px solid var(--line,#CAD6E4);text-align:center;color:var(--soft,#4F5B75);font-family:var(--body,inherit);font-size:17px;line-height:1.7;word-break:keep-all;opacity:1}.hjfoot p{margin:2px 0;padding:0;border:0;background:none;font-size:inherit;color:inherit;text-align:center}</style><style id="hj-contact-css">.hj-contact{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px 12px;margin:8px 0 0;padding:0}.hj-contact a{display:inline-flex;align-items:center;gap:6px;color:var(--ink,#1F2A44);text-decoration:none;font-size:15px;line-height:1.2;background:var(--paper,#fff);border:2px solid var(--line,#CAD6E4);border-radius:999px;padding:5px 12px;white-space:nowrap}.hj-contact a:hover,.hj-contact a:focus-visible{border-color:var(--ink,#1F2A44);outline:0}.hj-contact svg{flex:none}#ovNavMade+.hj-contact{margin:0 0 0 8px;flex:none;flex-wrap:nowrap;gap:6px}#ovNavMade+.hj-contact a{font-size:13px;padding:3px 9px}@media print{.hj-contact a{border:0;padding:0}}</style><!--hj-ctheme--><style id="hj-ctheme">/* hj-ctheme · 수업 자료 페이지 공통: 글꼴을 Pretendard로, 바탕·글자색을 메뉴와 같은 밝고 따뜻한 톤으로 */
@font-face{font-family:'Jua';font-style:normal;font-weight:100 900;font-display:swap;
 src:url(https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2-subset/Pretendard-Bold.subset.woff2) format('woff2')}
@font-face{font-family:'Gowun Dodum';font-style:normal;font-weight:100 550;font-display:swap;
 src:url(https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2-subset/Pretendard-Regular.subset.woff2) format('woff2')}
@font-face{font-family:'Gowun Dodum';font-style:normal;font-weight:551 900;font-display:swap;
 src:url(https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2-subset/Pretendard-Bold.subset.woff2) format('woff2')}
@media (prefers-color-scheme:light){html:root:not([data-theme="dark"]){--bg:#FFFCF8;--paper:#FFFFFF;--ink:#2A221C;--soft:#5C5047;--muted:#5C5047;--line:#EFE3D6;--warmline:#EFE3D6}}
html:root[data-theme="light"]{--bg:#FFFCF8;--paper:#FFFFFF;--ink:#2A221C;--soft:#5C5047;--muted:#5C5047;--line:#EFE3D6;--warmline:#EFE3D6}
@media (prefers-color-scheme:dark){html:root:not([data-theme="light"]){--bg:#221E1A;--paper:#2B2621;--ink:#F2EBE3;--soft:#C9BCB0;--muted:#C9BCB0;--line:#43392F}}
html:root[data-theme="dark"]{--bg:#221E1A;--paper:#2B2621;--ink:#F2EBE3;--soft:#C9BCB0;--muted:#C9BCB0;--line:#43392F}
html body{-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
html h1,html h2,html h3{letter-spacing:-.025em}
html:root{--night:#4A3A2E;--night2:#8A6A52;--pine:#5C9A7C;--pine-soft:#E6F3EC}
/* ── 수업 세트 공통 틀(첫 화면·진행 화면) 다듬기: 얇은 선, 부드러운 그림자, 정돈된 글자 크기 ── */
html body .title{font-size:clamp(34px,min(4.8vw,8.5vh),66px);font-weight:800;letter-spacing:-.035em;line-height:1.2}
html body .lead{font-size:clamp(17px,1.6vw,22px);font-weight:600;color:var(--soft);letter-spacing:-.01em}
html body .qbox{background:#FFF5E6;border:0;border-left:8px solid #F2B872;border-radius:20px;font-size:clamp(20px,2.1vw,30px)!important;font-weight:700;line-height:1.55;
 box-shadow:0 1px 2px rgba(80,55,30,.05),0 16px 32px -22px rgba(80,55,30,.4)}
@media (prefers-color-scheme:dark){html:root:not([data-theme="light"]) body .qbox{background:#3A3024;border-left-color:#C98A2A}}
html:root[data-theme="dark"] body .qbox{background:#3A3024;border-left-color:#C98A2A}
html body .stagebar{gap:8px}
html body .st{border-width:1.5px;font-size:clamp(15px,1.35vw,19px);font-weight:600;padding:6px 14px;background:var(--paper)}
html body .st.now{font-weight:700}
html body .seg{border:1.5px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(80,55,30,.05)}
html body .seg button{font-size:clamp(17px,1.55vw,22px);font-weight:600;padding:9px 16px}
html body .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
html body .row-label{font-size:clamp(17px,1.6vw,22px);font-weight:700;color:var(--soft)}
html body .big-btn{font-size:clamp(22px,2.3vw,32px);font-weight:800;letter-spacing:-.01em;padding:14px 48px;
 box-shadow:0 2px 4px rgba(40,25,10,.12),0 14px 26px -12px rgba(40,25,10,.5)}
html body .big-btn:active{transform:translateY(2px);box-shadow:0 1px 2px rgba(40,25,10,.2)}
html body .mid-btn{font-size:clamp(18px,1.7vw,24px);font-weight:700;padding:11px 28px;box-shadow:0 2px 4px rgba(40,25,10,.12),0 10px 20px -12px rgba(40,25,10,.45)}
html body .mid-btn:active{transform:translateY(2px);box-shadow:none}
html body .ghost-btn{border:1.5px solid var(--line);background:var(--paper);font-size:clamp(17px,1.6vw,22px);font-weight:700;padding:10px 24px}
html body .tnote{border-width:1.5px;border-radius:999px;font-size:clamp(16px,1.5vw,20px);font-weight:700;padding:9px 18px}
html body .tool{border-width:1.5px;border-radius:12px;font-size:19px;padding:7px 12px}
html body .chip{border-width:1.5px;font-weight:600}
html body .tolist{border-width:1.5px;font-size:clamp(16px,1.5vw,19px);font-weight:700;padding:9px 18px}
html body .goal{font-size:clamp(16px,1.5vw,21px);font-weight:600}
html body .hd{font-weight:800;letter-spacing:-.03em;font-size:clamp(26px,2.8vw,42px);line-height:1.35}
html body .overlay{background:rgba(42,34,28,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
html body .panel{border:0;border-radius:24px;box-shadow:0 30px 60px -24px rgba(40,25,10,.5)}
html body .panel h2{font-size:clamp(30px,3.6vw,50px);font-weight:800;letter-spacing:-.03em}
html body .panel .why{font-size:clamp(20px,2.1vw,30px)}
html body :is(.card1,.book,.rec,.pw,.opt2,.oi,.mw,.mm,.wf,.ln,.lkrow,.bglog span){border-width:2px}
html body :is(.card1,.book,.rec,.sumbox,.talk .q,.fl,.promise div){box-shadow:0 1px 2px rgba(80,55,30,.05),0 12px 26px -20px rgba(80,55,30,.35)}
html body .wf :is(textarea,input){border-width:1.5px}
html body .ex{border-width:1.5px}
html body .card1 .x,html body .mw,html body .book .pg,html body .sumbox b{font-weight:700}
html body .hjfoot{border-top-width:1.5px}
html body:has(.screen.on:not(#cover)) #hj-home{display:none}

html body .goalbox{border-width:0;border-left:8px solid #F2B872;background:#FFF5E6;border-radius:16px;font-weight:700}
@media (prefers-color-scheme:dark){html:root:not([data-theme="light"]) body .goalbox{background:#3A3024;border-left-color:#C98A2A}}

html body .ghost{border-width:1.5px;font-weight:700}
html body .plan>*,html body .steps>*{border-width:1.5px}
html body .badge{font-weight:800}
html body .ask{font-weight:600}
/* 선 아이콘 */
html body .hj-i{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-.2em}
html body .hj-ic{display:inline-flex;align-items:center;justify-content:center;gap:.4em}
html body .hj-ionly{gap:0}

 display:grid;gap:clamp(12px,1.6vh,18px);box-shadow:0 1px 2px rgba(80,55,30,.05),0 18px 40px -28px rgba(80,55,30,.45);text-align:left}
html body .hj-cvpanel>.qbox,html body .hj-cvpanel>.goalbox,html body .hj-cvpanel>.bq,html body .hj-cvpanel>.map{width:auto!important;margin:0!important;box-shadow:none}

@media (max-width:720px){html body .hj-field{grid-template-columns:1fr}html body .hj-field.row>:nth-child(n+3){grid-column:1}}

html .hj-em{font-family:'HJ Emoji','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-weight:400;font-style:normal;font-synthesis:none;letter-spacing:0;-webkit-text-stroke:0;text-shadow:none}
/* 교사 안내 창 도구(인쇄·구글 문서·이메일) */
html body .hj-tbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px 0 4px;padding-top:18px;border-top:1px solid var(--line)}
html body .hj-tbar>button,html body .hj-mail button{display:inline-flex;align-items:center;gap:7px;font:700 16px/1.2 'Gowun Dodum',sans-serif;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;cursor:pointer}
html body .hj-tbar>button:hover,html body .hj-mail button:hover{background:var(--bg);border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
html body .hj-tbar .hj-i{width:18px;height:18px;flex:none}
html body .hj-mail{flex-basis:100%;display:grid;gap:8px;max-width:560px;margin:6px auto 0;text-align:left;background:var(--bg);border-radius:16px;padding:14px 16px}
html body .hj-mail[hidden]{display:none}
html body .hj-mail label{font-weight:700;font-size:16px}html body .hj-mail label small{font-weight:500;color:var(--soft);font-size:14px;margin-left:6px}
html body .hj-mail input{font:500 17px/1.4 'Gowun Dodum',sans-serif;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
html body .hj-mail div{display:flex;flex-wrap:wrap;gap:8px}html body .hj-mail p{margin:0;font-size:14px!important;color:var(--soft)}
html body .hj-toast{flex-basis:100%;margin:2px 0 0;min-height:1.3em;text-align:center;font-size:15px!important;color:var(--soft)}
@media print{
 body.hj-tprint>*:not(#tn){display:none!important}
 body.hj-tprint #tn{position:static!important;display:block!important;background:none!important;padding:0!important;inset:auto!important}
 body.hj-tprint #tn .panel{width:auto!important;max-height:none!important;overflow:visible!important;box-shadow:none!important;border:0!important;border-radius:0!important;padding:0!important;transform:none!important;animation:none!important}
 body.hj-tprint .hj-tbar,body.hj-tprint #tnClose{display:none!important}
 body.hj-tprint{background:#fff!important;color:#000}
 @page{margin:16mm 16mm}
}
/* 수업을 마쳤을 때 고르는 창 */
#hj-done{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:rgba(42,34,28,.38);backdrop-filter:blur(3px);animation:hjfade .2s ease}
@keyframes hjfade{from{opacity:0}to{opacity:1}}
#hj-done .hj-dp{width:min(560px,100%);background:var(--paper,#fff);color:var(--ink,#2A221C);border-radius:24px;padding:30px 28px 24px;text-align:center;box-shadow:0 30px 60px -24px rgba(40,25,10,.5);font-family:'Gowun Dodum',sans-serif;word-break:keep-all}
#hj-done .hj-dok{display:inline-grid;place-items:center;width:60px;height:60px;border-radius:18px;background:color-mix(in srgb,#7FB89A 22%,var(--paper,#fff));color:#3F7A5C}
#hj-done .hj-dok svg{width:32px;height:32px}
#hj-done h2{font-family:'Jua',sans-serif;font-size:clamp(26px,3vw,32px);margin:12px 0 4px;letter-spacing:-.03em}
#hj-done .hj-dl{margin:0 0 20px;color:var(--soft,#5C5047);font-size:17px}
#hj-done .hj-dn{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;text-align:left;text-decoration:none;color:#fff;background:var(--ink,#2A221C);border-radius:18px;padding:16px 20px}
#hj-done .hj-dn small{grid-column:1;font-size:14px;opacity:.75;font-weight:600}
#hj-done .hj-dn b{grid-column:1;font-size:clamp(18px,2vw,21px);line-height:1.4}
#hj-done .hj-dn svg{grid-column:2;grid-row:1/3;width:26px;height:26px}
#hj-done .hj-dn:hover{filter:brightness(1.15)}
#hj-done .hj-dlast{margin:0;padding:14px;border-radius:16px;background:var(--bg,#FFFCF8);color:var(--soft,#5C5047);font-size:17px}
#hj-done .hj-drow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
#hj-done .hj-db{flex:1 1 200px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 17px/1.2 'Gowun Dodum',sans-serif;color:var(--ink,#2A221C);background:var(--paper,#fff);border:1.5px solid var(--line,#EFE3D6);border-radius:999px;padding:12px 16px;text-decoration:none;cursor:pointer}
#hj-done .hj-db:hover{background:var(--bg,#FFFCF8)}
#hj-done .hj-db svg{width:20px;height:20px}
#hj-done :focus-visible{outline:3px solid #E0A458;outline-offset:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #hj-done .hj-dn{background:#F2EBE3;color:#221E1A}}
:root[data-theme="dark"] #hj-done .hj-dn{background:#F2EBE3;color:#221E1A}
html body .hj-pl{display:none}
@media print{body.hj-tprint .hj-pl{display:block;text-align:center;font-size:14px!important;color:#555;margin:0 0 4px}}
/* 사진 출처 줄이 화면 밖으로 넘치지 않게 */
html body #phc{white-space:normal!important;overflow-wrap:anywhere;max-width:min(1100px,100%);text-align:center;line-height:1.6;opacity:.85}
/* 홍지희 선생님 버전(SOOP) 첫 화면: 차분하고 읽기 쉽게 */
html body #cBadge{background:color-mix(in srgb,var(--sc) 14%,var(--paper));color:color-mix(in srgb,var(--sc) 78%,var(--ink));font-weight:700;font-size:clamp(15px,1.3vw,18px);padding:5px 14px;letter-spacing:-.01em}
html body #cover:has(#cBadge) .title{font-size:clamp(30px,min(4vw,7vh),52px);line-height:1.25}
html body #cBq{border:0;border-left:5px solid color-mix(in srgb,var(--sc) 55%,var(--paper));background:color-mix(in srgb,var(--sc) 6%,var(--paper));border-radius:16px;padding:14px 22px;text-align:left;box-shadow:none}
html body #cBq>*:first-child:not(b){font-size:15px!important;font-weight:700;color:var(--soft)}
html body #cBq b{display:block;font-weight:700;font-size:clamp(20px,2vw,27px);line-height:1.4;margin-top:2px}
html body #cGoal{border:0;border-left:5px solid #E8B36A;background:#FFF6E8;color:var(--ink);border-radius:16px;padding:12px 22px;font-weight:700;font-size:clamp(18px,1.7vw,23px);text-align:left;box-shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #cGoal{background:#3A3024}}
:root[data-theme="dark"] #cGoal{background:#3A3024}

const $=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const BIN=Object.fromEntries(CFG.bins.map(b=>[b.k,b]));
const PH=CFG.photos||{};
const icon=(c)=>c.p&&PH[c.p]?`<img class="cimg" src="${PH[c.p].data}" alt="${PH[c.p].name}" data-ph="${c.p}"><span class="zoomhint">🔍 눌러서 크게</span>`:(c.e?c.e:`<span class="badge">${c.x.trim()[0]}</span>`);
let ST={s1:false,s2:false,s3:0};
try{const v=JSON.parse(localStorage.getItem(CFG.key)||'null');if(v)ST={...ST,...v};}catch(e){}
function save(){try{localStorage.setItem(CFG.key,JSON.stringify(ST));}catch(e){}}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.9;speechSynthesis.speak(u);}catch(e){}}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0);try{speechSynthesis.cancel();}catch(e){}}
document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>{renderHome();show('home');});
$('hTitle').textContent=CFG.title;document.title=CFG.title+' - 집에서 공부하기';
$('s2Ask').textContent=CFG.ask;
function renderHome(){
  const stars=ST.s3?'⭐'.repeat(ST.s3):'';
  const items=[
    {id:'s1',done:ST.s1,e:'📖',c:'#2F74E0',t:'뜻 알아보기',d:'중요한 낱말의 뜻을 카드로 알아봐요.'},
    {id:'s2',done:ST.s2,e:'📮',c:'#E0506B',t:'분류 연습',d:CFG.s2desc+' 틀리면 한 번 더 기회가 있어요.'},
    {id:'s3',done:ST.s3>0,e:'🏅',c:'#E8961E',t:'확인 퀴즈',d:ST.s3?`받은 별 ${stars} · 다시 풀어 별을 더 모아 보세요.`:'10문제를 풀고 별을 받아요.'}
  ];
  $('album').innerHTML=items.map((it,i)=>`<button class="slot ${it.done?'done':''}" style="--sc:${it.c}" data-go="${it.id}">
    <span class="stamp">${it.e}</span><span><span class="num">${i+1}단계 ${it.done?'· 우표 받음':''}</span><b>${it.t}</b><small>${it.d}</small></span></button>`).join('');
  const pk=Object.keys(PH);
  document.querySelectorAll('.phcredit').forEach(e=>e.remove());
  if(pk.length)$('album').insertAdjacentHTML('afterend',`<div class="phcredit"><b>사진 출처</b> · 위키미디어 공용에서 자유롭게 쓸 수 있는 사진이에요.<br>${pk.map(k=>`${PH[k].name} — ${PH[k].title} / ${PH[k].artist||'작자 미상'} / ${PH[k].lic}`).join('<br>')}</div>`);
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>({s1:startS1,s2:startS2,s3:startS3})[b.dataset.go]());
}
$('btnReset').onclick=()=>{if(confirm('모은 우표를 모두 지우고 처음부터 할까요?')){ST={s1:false,s2:false,s3:0};save();renderHome();}};
function startS1(){
  const seen=new Set();
  $('flips').innerHTML=CFG.concepts.map((c,i)=>`<button class="flip" style="--cc:${c.c}" data-i="${i}" aria-label="${c.n} 카드 뒤집기">
    <span class="in"><span class="face front"><span class="e">${c.e}</span><span class="n">${c.n}</span><small>눌러서 뜻 보기</small></span>
    <span class="face back"><b>${c.e} ${c.n}</b><span class="d">${c.d}</span><span class="ex">${c.ex||''}</span></span></span></button>`).join('');
  $('btnS1Done').disabled=true;
  document.querySelectorAll('.flip').forEach(f=>f.onclick=()=>{
    f.classList.toggle('open');const c=CFG.concepts[+f.dataset.i];
    if(f.classList.contains('open')){speak(`${c.n}. ${c.d}`);seen.add(f.dataset.i);}
    if(seen.size===CFG.concepts.length)$('btnS1Done').disabled=false;
  });
  show('s1');
}
$('btnS1Done').onclick=()=>{ST.s1=true;save();result('📖','뜻 알아보기 우표를 받았어요!','이제 ② 분류 연습을 해 볼까요?');};
let L={deck:[],i:0,tries:0,first:0,miss:[]};
function startS2(){
  const pools=CFG.bins.map(b=>shuffle(CFG.cards.filter(c=>c.c===b.k)));
  const deck=[];let n=0;const total=Math.min(12,CFG.cards.length);
  while(deck.length<total){const p=pools[n%pools.length];if(p.length)deck.push(p.pop());n++;}
  L={deck:shuffle(deck),i:0,tries:0,first:0,miss:[]};
  $('boxes').innerHTML=CFG.bins.map(b=>`<button class="mbox" style="--cc:${b.c}" data-k="${b.k}"><span class="e">${b.e}</span><span class="n">${b.n}</span></button>`).join('');
  document.querySelectorAll('.mbox').forEach(b=>b.onclick=()=>pick(b));
  show('s2');showLetter();
}
function showLetter(){
  const c=L.deck[L.i];L.tries=0;
  $('lTag').textContent=c.t||CFG.tag;$('lTag').style.display=(c.t||CFG.tag)?'inline-block':'none';
  $('lE').innerHTML=icon(c);
  const im=$('lE').querySelector('.cimg');
  if(im)im.onclick=()=>{const p=PH[im.dataset.ph];$('bvI').src=p.data;$('bvT').textContent=p.name;
    $('bvS').textContent=`${p.title} / ${p.artist||'작자 미상'} / ${p.lic} / 위키미디어 공용`;$('bv').classList.add('on');};$('lX').textContent=c.x;
  $('s2Count').textContent=`${L.i+1} / ${L.deck.length}`;$('s2Bar').style.width=(L.i/L.deck.length*100)+'%';
  $('lMsg').className='msg';$('btnL').style.display='none';
  document.querySelectorAll('.mbox').forEach(b=>{b.disabled=false;b.classList.remove('dim');});
}
$('lSpeak').onclick=()=>speak(L.deck[L.i].x);
function pick(b){
  const c=L.deck[L.i],ok=b.dataset.k===c.c,m=$('lMsg'),bin=BIN[c.c];L.tries++;
  if(ok){if(L.tries===1)L.first++;m.className='msg on ok';m.innerHTML=`<b>딩동! ${bin.n}, 맞아요 🎉</b>${c.w}`;finishLetter();speak('맞아요! '+c.w);}
