<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🛠️ 쓰임새에 맞는 물질로 물체 설계하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#EAF1F8;--paper:#FFFFFF;--ink:#1F2A44;--soft:#4F5B75;--line:#CAD6E4;
  --ok:#1F9E63;--no:#D2453A;--acc:#2F74E0;--note:#FFF4C2;--note-ink:#3B3200;
  --S:#E0506B;--O1:#2F74E0;--O2:#6A4FC9;--P:#1F9E63;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#162034;--paper:#22304C;--ink:#F2F5FB;--soft:#B7C3DB;--line:#3A4C74;--note:#4A4420;--note-ink:#FFF6CC}}
:root[data-theme="dark"]{--bg:#162034;--paper:#22304C;--ink:#F2F5FB;--soft:#B7C3DB;--line:#3A4C74;--note:#4A4420;--note-ink:#FFF6CC}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:clamp(19px,1.9vw,24px);line-height:1.45;overflow:hidden}
body,h1,h2,h3,p,li,span,div,button,a,small,b,label{word-break:keep-all;overflow-wrap:break-word;line-break:strict}
h1,h2,h3,.hd,.ttl{text-wrap:balance} p,li,small{text-wrap:pretty}
button{font-family:var(--display);color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:4px solid var(--acc);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:clamp(10px,1.6vw,24px)}
.screen.on{display:flex}
/* 표지 */
#cover{overflow-y:auto;align-items:center;gap:14px}
#cover .inner{width:min(1100px,100%);display:flex;flex-direction:column;gap:14px;align-items:center;margin:auto 0}
.badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);color:#fff;border-radius:999px;padding:4px 16px;font-size:clamp(17px,1.6vw,22px);background:var(--sc)}
.title{font-size:clamp(34px,4.6vw,64px);text-align:center;line-height:1.15}
.lead{color:var(--soft);text-align:center;margin:0;font-size:clamp(18px,1.7vw,23px)}
.bq{width:100%;background:var(--paper);border:4px solid var(--sc);border-radius:22px;padding:12px 20px;text-align:center}
.bq small{display:block;color:var(--soft);font-size:clamp(15px,1.4vw,19px)}
.bq b{font-family:var(--display);font-weight:400;font-size:clamp(24px,2.6vw,36px)}
.goalbox{background:#FFF4D6;color:#1F2A44;border:4px solid #E8961E;border-radius:18px;padding:8px 20px;font-family:var(--display);font-size:clamp(21px,2.1vw,30px);text-align:center}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.mcol{background:var(--paper);border-radius:16px;border-top:10px solid var(--mc);padding:8px 10px}
.mcol h3{font-size:clamp(17px,1.6vw,21px);color:var(--mc)}
.mcol a,.mcol span.cur{display:block;font-size:clamp(15px,1.35vw,18px);color:var(--ink);text-decoration:none;padding:3px 6px;border-radius:8px;margin-top:3px}
.mcol a:hover{background:var(--bg)}
.mcol .cur{background:var(--mc);color:#fff!important;font-family:var(--display)}
.plan{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.big-btn{font-size:clamp(24px,2.4vw,34px);padding:10px 40px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);box-shadow:0 5px 0 rgba(0,0,0,.25)}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.ghost{font-size:clamp(17px,1.6vw,22px);padding:8px 18px;border-radius:999px;border:3px solid var(--ink);background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
/* 수업 화면 */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.steps{display:flex;gap:5px;align-items:center;flex:1;min-width:0;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.st{flex:none;font-family:var(--display);font-size:clamp(14px,1.2vw,18px);padding:4px 10px;border-radius:999px;border:3px solid var(--line);background:var(--paper);color:var(--soft)}
.st.now{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.st.done{border-color:var(--ok);color:var(--ok)}
.tools{display:flex;gap:5px;align-items:center;flex:none}
.tool{font-size:clamp(15px,1.3vw,19px);border:3px solid var(--line);background:var(--paper);border-radius:14px;padding:4px 9px;white-space:nowrap}
.tool.qb{border-color:#E8961E}
.tool .n{display:inline-block;min-width:1.5em;border-radius:999px;background:#E8961E;color:#fff;font-size:.8em;padding:0 5px;margin-left:4px}
.sthead{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.routine{font-family:var(--display);font-size:clamp(15px,1.35vw,19px);background:var(--sc);color:#fff;border-radius:999px;padding:3px 12px}
.hd{font-family:var(--display);font-size:clamp(26px,2.8vw,40px);text-align:center;margin:0}
.ask{color:var(--soft);text-align:center;margin:0;font-size:clamp(17px,1.6vw,22px)}
.body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;padding:6px 2px}
.wrap{width:min(1240px,100%)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:6px}
.tnote{border:3px solid #6A4FC9;color:#6A4FC9;background:var(--paper);border-radius:14px;padding:6px 14px;font-size:clamp(16px,1.5vw,21px)}
/* 붙임쪽지 칸 */
.cols{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:10px;width:100%}
.col{background:var(--paper);border-radius:18px;border-top:10px solid var(--cc);padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-height:170px}
.col h3{font-size:clamp(20px,2vw,27px);color:var(--cc);display:flex;align-items:center;gap:6px}
.col .frame{font-size:clamp(14px,1.3vw,17px);color:var(--soft);margin:0}
.notes{display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow-y:auto;flex:1}
.note{background:var(--note);color:var(--note-ink);border-radius:10px;padding:6px 10px;font-size:clamp(17px,1.6vw,22px);display:flex;gap:6px;align-items:flex-start;justify-content:space-between}
.note .x{border:0;background:none;font-size:15px;opacity:.6;padding:0 2px}
.note .up{border:0;background:#E8961E;color:#fff;border-radius:8px;font-size:13px;padding:2px 6px;white-space:nowrap}
.add{display:flex;gap:6px}
.add input{flex:1;min-width:0;font-family:var(--body);font-size:clamp(17px,1.6vw,21px);padding:6px 10px;border:3px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.add button{border:0;border-radius:10px;background:var(--cc);color:#fff;font-size:clamp(16px,1.5vw,20px);padding:4px 12px}
/* 보기 자료 */
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px;width:100%}
.pic{background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--body)}
.pic img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px}
.pic .e{font-size:clamp(46px,5vw,70px);line-height:1.2}
.pic b{font-family:var(--display);font-weight:400;font-size:clamp(18px,1.7vw,23px)}
.pic small{color:var(--soft);font-size:clamp(14px,1.3vw,17px)}
.pic .num{font-family:var(--display);background:var(--ink);color:var(--bg);border-radius:999px;padding:0 10px;font-size:15px;align-self:flex-start}
.split{display:flex;flex-direction:column;gap:10px;width:100%}
.split .gal{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.split .pic img{aspect-ratio:16/9;max-height:17vh}.split .pic .e{font-size:clamp(40px,4vw,56px)}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:8px;width:100%}
.mini .m{display:flex;gap:10px;align-items:center;background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:6px 10px;text-align:left}
.mini .m img{width:96px;height:72px;object-fit:cover;border-radius:10px;flex:none;cursor:zoom-in}
.mini .m .e{font-size:40px;flex:none;width:60px;text-align:center}
.mini .m b{font-family:var(--display);font-weight:400;font-size:clamp(17px,1.6vw,21px);display:block}
.mini .m span.d{font-size:clamp(14px,1.3vw,17px);display:block}
.mini .m small{font-size:12px;color:var(--soft)}
.mini .num{font-family:var(--display);background:var(--ink);color:var(--bg);border-radius:999px;padding:0 8px;font-size:14px}
.col.cmp{min-height:0}.col.cmp .notes{max-height:14vh}
/* 분류 */
.deck{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.card1{width:min(900px,100%);background:var(--paper);border:4px solid var(--line);border-radius:22px;padding:12px 20px;display:flex;gap:16px;align-items:center;justify-content:center}
.card1 .e{font-size:clamp(50px,5vw,80px);line-height:1}
.card1 img{width:clamp(130px,16vw,220px);aspect-ratio:4/3;object-fit:cover;border-radius:12px}
.card1 .x{font-family:var(--display);font-size:clamp(24px,2.6vw,38px)}
.bins{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:10px;width:min(1000px,100%)}
.bin{border:0;background:var(--cc);color:#fff;border-radius:30px 30px 14px 14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 rgba(0,0,0,.2);font-size:clamp(21px,2.2vw,31px)}
.bin .e{font-size:clamp(30px,3.2vw,46px)}
.bin .c{font-family:var(--body);font-size:15px;opacity:.9}
.fb{width:min(900px,100%);border-radius:16px;padding:8px 16px;font-size:clamp(18px,1.7vw,23px);display:none}
.fb.on{display:block}.fb.ok{background:color-mix(in srgb,var(--ok) 18%,var(--paper));border:3px solid var(--ok)}
.fb.no{background:color-mix(in srgb,var(--no) 12%,var(--paper));border:3px solid var(--no)}
.fb.open{background:color-mix(in srgb,#E8961E 16%,var(--paper));border:3px solid #E8961E}
.sorted{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:10px;width:min(1000px,100%)}
.sorted div{background:var(--paper);border-radius:14px;border-top:8px solid var(--cc);padding:6px 10px;font-size:clamp(15px,1.4vw,19px)}
.after{background:#FFF4D6;color:#1F2A44;border:4px solid #E8961E;border-radius:18px;padding:8px 16px;width:min(1000px,100%);font-size:clamp(19px,1.8vw,25px)}
/* 뜻 만들기 */
.frameline{font-family:var(--display);font-size:clamp(24px,2.6vw,36px);text-align:center;background:var(--paper);border-radius:18px;padding:10px 16px;width:min(1100px,100%)}
.frameline input{font-family:var(--display);font-size:inherit;width:min(26ch,70%);border:0;border-bottom:4px dashed var(--acc);background:transparent;color:var(--acc);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-family:var(--body);font-size:clamp(16px,1.5vw,20px);border:3px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px}
.chip[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,var(--paper))}
.book{display:none;width:min(1100px,100%);border:4px solid var(--ok);border-radius:18px;background:var(--paper);padding:10px 16px;text-align:center}
.book.on{display:block}
.book b{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.3vw,32px)}
.book mark{background:color-mix(in srgb,var(--ok) 25%,transparent);color:inherit;border-radius:6px;padding:0 3px}
/* 주장-근거-질문 */
.csq{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%}
.evi{display:flex;flex-wrap:wrap;gap:6px}
.evi button{font-family:var(--display);font-size:clamp(16px,1.5vw,20px);border:3px solid var(--line);background:var(--paper);border-radius:12px;padding:4px 10px}
.evi button[aria-pressed="true"]{border-color:#1F9E63;background:color-mix(in srgb,#1F9E63 18%,var(--paper))}
.qpick{width:min(1100px,100%);background:var(--paper);border:4px solid #E8961E;border-radius:18px;padding:4px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qpick select{flex:1;min-width:220px;font-family:var(--body);font-size:clamp(17px,1.6vw,21px);padding:6px;border-radius:10px;border:3px solid var(--line);background:var(--bg);color:var(--ink)}
.log{width:100%;display:grid;gap:6px}
.log div{background:var(--paper);border-left:10px solid #1F9E63;border-radius:10px;padding:6px 12px;font-size:clamp(16px,1.5vw,20px)}
/* 활동 안내 */
.task{width:min(1100px,100%);display:grid;gap:8px}
.task label{display:flex;gap:10px;align-items:center;background:var(--paper);border-radius:14px;padding:8px 14px;font-size:clamp(19px,1.8vw,25px);border:3px solid var(--line)}
.task input{width:26px;height:26px;accent-color:var(--ok)}
.task label.done{border-color:var(--ok);opacity:.8}
.tip{background:#FFF4D6;color:#1F2A44;border-radius:14px;padding:8px 14px;width:min(1100px,100%);font-size:clamp(17px,1.6vw,21px)}
/* 확인 */
.qz{width:min(1000px,100%);display:flex;flex-direction:column;gap:8px;align-items:center}
.qt{font-family:var(--display);font-size:clamp(23px,2.4vw,34px);text-align:center;background:var(--paper);border-radius:18px;padding:10px 16px;width:100%}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.opt{font-family:var(--body);font-size:clamp(19px,1.9vw,26px);border:4px solid var(--line);background:var(--paper);border-radius:16px;padding:8px 12px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--paper))}
.opt.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,var(--paper))}
/* 겹침 창 */
.overlay{position:fixed;inset:0;background:rgba(15,22,40,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.overlay.on{display:flex}
.panel{background:var(--paper);border-radius:24px;padding:clamp(14px,2vw,28px);width:min(1150px,96vw);max-height:92vh;overflow-y:auto;border-top:16px solid var(--pc,var(--ink))}
.panel h2{font-size:clamp(28px,3vw,42px);margin-bottom:6px}
.tpanel h3{font-size:clamp(20px,1.9vw,26px);color:#6A4FC9;margin:12px 0 4px}
.tpanel li,.tpanel p{font-size:clamp(17px,1.6vw,21px);line-height:1.55}
.qadd{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.qadd select,.qadd input{font-family:var(--body);font-size:clamp(17px,1.6vw,21px);padding:6px 10px;border:3px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.qadd input{flex:1;min-width:240px}
.qadd button{border:0;border-radius:10px;background:#E8961E;color:#fff;font-size:clamp(17px,1.6vw,21px);padding:4px 14px}
.stems{display:flex;flex-wrap:wrap;gap:6px}
.stems button{font-family:var(--body);font-size:clamp(15px,1.4vw,18px);border:2px dashed #E8961E;background:transparent;border-radius:999px;padding:2px 10px}
.qlist{display:grid;gap:8px;margin-top:10px}
.qi{border:3px solid var(--line);border-radius:14px;padding:8px 12px;display:grid;gap:4px;background:var(--bg)}
.qi.s1{border-color:#2F74E0}.qi.s2{border-color:var(--ok)}
.qi .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qi .ty{font-family:var(--display);font-size:14px;background:#E8961E;color:#fff;border-radius:999px;padding:1px 9px}
.qi .from{font-size:13px;color:var(--soft)}
.qi .q{font-size:clamp(18px,1.7vw,23px);flex:1}
.qi .stt{font-family:var(--display);font-size:15px;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:2px 10px}
.qi .ans{font-size:clamp(16px,1.5vw,20px);color:var(--ink)}
.qi input{font-family:var(--body);font-size:16px;padding:4px 8px;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
.picker{font-family:var(--display);font-size:clamp(90px,14vw,170px);text-align:center;line-height:1.1}
.bigview{position:fixed;inset:0;background:rgba(8,12,22,.95);display:none;align-items:center;justify-content:center;z-index:30}
.bigview.on{display:flex}.bigview img{max-width:96vw;max-height:84vh;border-radius:12px}
.bigview .meta{position:fixed;left:0;right:0;bottom:0;padding:8px 14px;color:#fff;text-align:center;font-size:15px;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.bigview .close{position:fixed;top:12px;right:14px;width:56px;height:56px;border-radius:50%;border:0;font-size:26px;background:#fff;color:#1F2A44}
.creditbar{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px;width:100%}
.tolist{display:none;font-family:var(--display);font-size:clamp(17px,1.6vw,21px);text-decoration:none;color:inherit;border:3px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 18px}
.tolist.on{display:inline-flex}
.hjfoot{display:block;width:100%;margin:14px 0 0;padding:10px 0 2px;border-top:3px solid var(--line);text-align:center;color:var(--soft);font-size:16px;line-height:1.7}
.hjfoot p{margin:2px 0}
.pcredit{font-size:13px;color:var(--soft);text-align:center;margin:0}
@media (max-height:760px) and (min-width:900px){
  .notes{max-height:24vh}.col{min-height:140px}.pic img{aspect-ratio:16/10}
  .hd{font-size:clamp(24px,2.4vw,34px)}.sthead{margin:0}.ask{font-size:17px}.col .frame{display:none}
}
@media (max-width:900px){
  .cols,.csq{grid-template-columns:1fr}.split{grid-template-columns:1fr}.map{grid-template-columns:1fr 1fr}
  .opts{grid-template-columns:1fr}.notes{max-height:22vh}
}
@media print{
  body{overflow:visible;background:#fff;color:#000}.screen{position:static;display:none}
  .overlay{display:none!important}#qbPanel.printme{display:block!important;position:static;background:#fff}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== 과학 탐구 단계 ===== */
.labwrap{width:min(1180px,100%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.labwrap .task{width:100%}
.labwrap .task{gap:5px}
.labwrap .task label{font-size:clamp(16px,1.45vw,20px);padding:4px 10px;border-width:2px}
.labwrap .task input{width:22px;height:22px;flex:none}
.labr,.labl{display:grid;gap:8px}
.labl2{margin:0;font-size:clamp(15px,1.3vw,18px);color:var(--soft)}
.tnote2{margin:2px 0 0;font-size:clamp(15px,1.3vw,18px);color:var(--soft)}
@media (max-width:900px),(orientation:portrait){.labwrap{grid-template-columns:minmax(0,1fr)}}
.safe{background:#FDE7EA;color:#5A1320;border:3px solid #E0506B;border-radius:14px;padding:6px 12px;font-size:clamp(15px,1.35vw,19px)}
.labgo{display:inline-block;text-decoration:none;font-size:clamp(16px,1.4vw,19px);padding:4px 14px}
table.rec{width:100%;border-collapse:collapse;background:var(--paper);border-radius:14px;overflow:hidden}
table.rec th,table.rec td{border:2px solid var(--line);padding:4px 6px;font-size:clamp(16px,1.5vw,20px);text-align:center;word-break:keep-all}
table.rec thead th{background:var(--sc,#2F74E0);color:#fff;font-family:var(--display);font-weight:400}
table.rec tbody th{background:var(--bg);font-family:var(--display);font-weight:400}

/* ===== 넓은 교실 화면 정렬 (2026.9.29 선생님 의견: 가운데 떠 있음·너비 제각각·사진 작음) ===== */
/* 1) 내용은 위쪽부터 채우고, 모든 덩어리를 같은 너비로 맞춤 */
#lesson .body{justify-content:flex-start;padding-top:clamp(6px,1.4vh,18px)}
#lesson .body>*{width:min(1320px,100%)!important;max-width:100%}
#lesson .hd,#lesson .ask{width:min(1320px,100%);margin-left:auto;margin-right:auto}
#lesson .ask{font-size:clamp(17px,1.5vw,22px);color:var(--ink);opacity:.8}
/* 2) 사진 보기: 왼쪽에 사진 2×2 크게, 오른쪽에 붙임쪽지 세 칸을 위아래로 */
#lesson .split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:stretch}
#lesson .split .gal{grid-template-columns:repeat(2,minmax(0,1fr));align-content:start}
#lesson .split .pic img{aspect-ratio:auto;width:100%;height:clamp(110px,21vh,320px);object-fit:cover;max-height:none;cursor:zoom-in}

#lesson .split .cols{grid-template-columns:1fr!important}
#lesson .split .col{min-height:0}
#lesson .split .notes{max-height:12vh}
.zoomhint{font-size:clamp(14px,1.2vw,17px);color:var(--soft);text-align:center;grid-column:1/-1;margin:0}
@media (max-width:900px),(orientation:portrait){#lesson .split{grid-template-columns:1fr}}
/* 3) 자료 카드·분류 카드 사진도 조금 크게 */
#lesson .gal:not(.split .gal) .pic img{aspect-ratio:auto;height:clamp(100px,19vh,300px);max-height:none;object-fit:cover}
#lesson .card1 img{width:clamp(150px,20vw,360px)}
/* 4) 결론 문장 칸 */
#lesson .frameline input{width:min(30ch,80%)}
#lesson .frameline input::placeholder{color:var(--soft);opacity:.7;font-size:.8em}
#lesson .split .pic{padding:5px;gap:2px}
#lesson .split .pic b{font-size:clamp(17px,1.5vw,22px)}
#lesson .split .col{padding:6px 10px;gap:4px}
@media (max-height:800px) and (orientation:landscape){
 #lesson .split .pic img,#lesson .split .pic .e{height:clamp(90px,17vh,200px)}
 #lesson .split .pic b{display:none}
 #lesson .split .pic small{font-size:clamp(15px,1.3vw,18px);color:var(--ink)}
 #lesson .split .col h3{font-size:clamp(18px,1.6vw,22px)}
 #lesson .split .notes{max-height:9vh}
}

 #lesson .split .pic img,#lesson .split .pic .e{height:clamp(110px,17vh,260px)}
 #lesson .split .cols{grid-template-columns:repeat(3,minmax(0,1fr))!important}
}

/* ===== 2026.9.29 2차 다듬기: 사진 수에 맞춘 배치 · 큰 교실 화면 · 칸 너비 ===== */
/* 사진 보기: 사진이 1~3장이면 빈칸 없이 채움 (1장·2장은 더 크게, 3장이면 마지막 사진을 가로로 길게) */
#lesson .split .gal .pic:only-of-type{grid-column:1/-1}
#lesson .split .pic img{object-fit:contain;background:color-mix(in srgb,var(--ink) 6%,var(--paper))}
/* 사진 3장: 한 줄에 세 장, 길쭉한 사진도 잘리지 않게 */
#lesson .split .gal:has(.pic:nth-of-type(3)):not(:has(.pic:nth-of-type(4))){grid-template-columns:repeat(3,minmax(0,1fr))}

/* 교실 화면(1920×1080 등 큰 화면): 본문 전체를 키워 멀리서도 보이게 */

html body .overlay{background:rgba(42,34,28,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
html body .panel{border:0;border-radius:24px;box-shadow:0 30px 60px -24px rgba(40,25,10,.5)}
html body .panel h2{font-size:clamp(30px,3.6vw,50px);font-weight:800;letter-spacing:-.03em}
html body .panel .why{font-size:clamp(20px,2.1vw,30px)}
html body :is(.card1,.book,.rec,.pw,.opt2,.oi,.mw,.mm,.wf,.ln,.lkrow,.bglog span){border-width:2px}
html body :is(.card1,.book,.rec,.sumbox,.talk .q,.fl,.promise div){box-shadow:0 1px 2px rgba(80,55,30,.05),0 12px 26px -20px rgba(80,55,30,.35)}
html body .wf :is(textarea,input){border-width:1.5px}
html body .ex{border-width:1.5px}
html body .card1 .x,html body .mw,html body .book .pg,html body .sumbox b{font-weight:700}
html body .hjfoot{border-top-width:1.5px}
html body:has(.screen.on:not(#cover)) #hj-home{display:none}
/* 선생님 버전(S.O.O.P.) 틀 */
html body .bq{border-width:2px;border-radius:20px;box-shadow:0 1px 2px rgba(80,55,30,.05),0 14px 28px -22px rgba(80,55,30,.4)}
html body .goalbox{border-width:0;border-left:8px solid #F2B872;background:#FFF5E6;border-radius:16px;font-weight:700}
@media (prefers-color-scheme:dark){html:root:not([data-theme="light"]) body .goalbox{background:#3A3024;border-left-color:#C98A2A}}
html:root[data-theme="dark"] body .goalbox{background:#3A3024;border-left-color:#C98A2A}
html body .ghost{border-width:1.5px;font-weight:700}
html body .plan>*,html body .steps>*{border-width:1.5px}
html body .badge{font-weight:800}
html body .ask{font-weight:600}
/* 선 아이콘 */
html body .hj-i{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-.2em}
html body .hj-ic{display:inline-flex;align-items:center;justify-content:center;gap:.4em}
html body .hj-ionly{gap:0}
html body .tool.hj-hometool{border-radius:999px;padding:6px 15px 6px 12px;font-weight:700;font-size:17px;gap:6px}
/* 수업 세트 첫 화면 정리 */
html body .hj-cv{gap:clamp(12px,2vh,22px)!important}
html body .hj-cvtop{width:min(1100px,94vw);display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;min-height:0}
html body .hj-cvtop .tolist{margin:0}
html body .hj-cvpanel{width:min(1100px,94vw);background:var(--paper);border:1.5px solid var(--line);border-radius:24px;padding:clamp(16px,2vw,26px) clamp(18px,2.4vw,30px);
 display:grid;gap:clamp(12px,1.6vh,18px);box-shadow:0 1px 2px rgba(80,55,30,.05),0 18px 40px -28px rgba(80,55,30,.45);text-align:left}
html body .hj-cvpanel>.qbox,html body .hj-cvpanel>.goalbox,html body .hj-cvpanel>.bq,html body .hj-cvpanel>.map{width:auto!important;margin:0!important;box-shadow:none}
html body .hj-cvpanel>.qbox{text-align:left}
html body .hj-field{display:grid!important;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:8px 14px;justify-content:stretch!important;margin:0;
 padding-top:clamp(10px,1.4vh,16px);border-top:1.5px dashed var(--line)}
html body .hj-field>.stagebar,html body .hj-field>.plan{justify-content:flex-start!important;margin:0}
html body .hj-flabel{font-size:clamp(15px,1.35vw,18px)!important;font-weight:800;color:var(--soft);white-space:nowrap}
html body .hj-field.row>:nth-child(n+3){grid-column:2;font-size:clamp(14px,1.25vw,17px);color:var(--soft)}
html body .hj-field .seg{justify-self:start}
html body .hj-cvacts{gap:14px}
@media (max-width:720px){html body .hj-field{grid-template-columns:1fr}html body .hj-field.row>:nth-child(n+3){grid-column:1}}
html body .hj-field>*:not(.hj-flabel){justify-self:start;text-align:left;margin-left:0}
html body .hj-field>div>.seg{margin:0}
html body .hj-cvtop,html body .hj-cvpanel,html body .hj-cvacts{flex:none}
html body #cover{justify-content:safe center}
html body .hj-field #segTeam{justify-content:flex-start!important;align-items:flex-start!important;flex-direction:column;gap:6px!important}
html body .hj-field #segTeam-sub .row-label,html body .hj-field #segTeam~*{font-size:clamp(14px,1.25vw,17px)!important;font-weight:500;color:var(--soft)}
html body .hj-field .seg{justify-content:flex-start;width:auto}

html .hj-em{font-family:'HJ Emoji','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-weight:400;font-style:normal;font-synthesis:none;letter-spacing:0;-webkit-text-stroke:0;text-shadow:none}
/* 교사 안내 창 도구(인쇄·구글 문서·이메일) */
html body .hj-tbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px 0 4px;padding-top:18px;border-top:1px solid var(--line)}
html body .hj-tbar>button,html body .hj-mail button{display:inline-flex;align-items:center;gap:7px;font:700 16px/1.2 'Gowun Dodum',sans-serif;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;cursor:pointer}
html body .hj-tbar>button:hover,html body .hj-mail button:hover{background:var(--bg);border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
html body .hj-tbar .hj-i{width:18px;height:18px;flex:none}
html body .hj-mail{flex-basis:100%;display:grid;gap:8px;max-width:560px;margin:6px auto 0;text-align:left;background:var(--bg);border-radius:16px;padding:14px 16px}
html body .hj-mail[hidden]{display:none}
html body .hj-mail label{font-weight:700;font-size:16px}html body .hj-mail label small{font-weight:500;color:var(--soft);font-size:14px;margin-left:6px}
html body .hj-mail input{font:500 17px/1.4 'Gowun Dodum',sans-serif;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
html body .hj-mail div{display:flex;flex-wrap:wrap;gap:8px}html body .hj-mail p{margin:0;font-size:14px!important;color:var(--soft)}
html body .hj-toast{flex-basis:100%;margin:2px 0 0;min-height:1.3em;text-align:center;font-size:15px!important;color:var(--soft)}
@media print{
 body.hj-tprint>*:not(#tn){display:none!important}
 body.hj-tprint #tn{position:static!important;display:block!important;background:none!important;padding:0!important;inset:auto!important}
 body.hj-tprint #tn .panel{width:auto!important;max-height:none!important;overflow:visible!important;box-shadow:none!important;border:0!important;border-radius:0!important;padding:0!important;transform:none!important;animation:none!important}
 body.hj-tprint .hj-tbar,body.hj-tprint #tnClose{display:none!important}
 body.hj-tprint{background:#fff!important;color:#000}
 body.hj-tprint #tn .panel{padding:16mm!important}
}
/* 수업을 마쳤을 때 고르는 창 */
#hj-done{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:rgba(42,34,28,.38);backdrop-filter:blur(3px);animation:hjfade .2s ease}
@keyframes hjfade{from{opacity:0}to{opacity:1}}

/* 글쓰기 도구 막대 */
html body .wbar{display:flex!important;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:6px auto 4px}
html body .wbar .hj-wg{display:inline-flex;align-items:center;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:3px;box-shadow:0 1px 2px rgba(80,55,30,.05)}
html body .wbar .hj-wg .tool{border:0!important;background:none!important;box-shadow:none!important;border-radius:10px!important;font-size:clamp(14px,1.15vw,16px)!important;padding:7px 12px!important;min-height:36px}
html body .wbar .hj-wg .tool:hover{background:var(--bg)!important}
html body .wbar .hj-wg .tool+.tool{border-left:1px solid var(--line)!important;border-radius:0 10px 10px 0!important}
html body .wbar .wcount{font-size:clamp(14px,1.15vw,16px)!important;font-weight:700;color:var(--soft);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}
/* 과학 앱 첫 화면 머리 + 위 탭 줄 정리 */
html body .hj-lhead{text-align:center;margin:0 0 10px}
html body .hj-linfo{margin:0;font-size:clamp(15px,1.3vw,18px);font-weight:700;color:var(--soft)}
html body .hj-ltitle{margin:4px 0 0;font-size:clamp(28px,3vw,42px);font-weight:800;letter-spacing:-.03em;line-height:1.25;color:var(--ink)}
html:has(#ovBar) body>nav #ovNavMade,html:has(#ovBar) body>nav .wrap>.hj-contact{display:none!important}
html:has(#ovBar) body>nav a{font-size:clamp(14px,1.05vw,16px)!important;padding:5px 12px!important}
html:has(#ovBar) body .steps span{font-size:clamp(14px,1.1vw,16px)!important;padding:4px 12px!important;border-width:1px!important}
/* 과학 앱 첫 화면 */
#hj-scover{display:none}
html.hj-sc-on #hj-scover{display:block;position:fixed;left:0;right:0;bottom:0;top:var(--hj-navh,72px);z-index:40;overflow:auto;background:var(--bg);padding:clamp(16px,3vh,36px) 16px 40px}
html.hj-sc-on #ovBar{display:none!important}
#hj-scover .hj-sc-in{width:min(1100px,100%);margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,1.8vh,20px)}
#hj-scover .hj-sc-info{margin:0;font-size:clamp(15px,1.35vw,19px);font-weight:700;color:var(--soft);text-align:center}
#hj-scover .hj-sc-title{margin:0;font-size:clamp(32px,min(4.6vw,8vh),60px);font-weight:800;letter-spacing:-.035em;line-height:1.2;text-align:center;text-wrap:balance}
#hj-scover .hj-cvpanel{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,2.2vw,28px);display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(80,55,30,.04),0 14px 30px -22px rgba(80,55,30,.3)}
#hj-scover .hj-sc-goal{margin:0;text-align:left;background:#FFF6E8;border:0;border-left:5px solid #E8B36A;border-radius:16px;padding:16px 22px;font-size:clamp(21px,2.1vw,30px);font-weight:700;line-height:1.4;box-shadow:none}
#hj-scover .hj-sc-goal .hj-qlab{display:block;font-size:clamp(15px,1.35vw,19px);font-weight:700;color:var(--soft);margin-bottom:4px}
#hj-scover .hj-field{border-top:1px dashed var(--line);padding-top:14px}
#hj-scover .big-btn{font:800 clamp(22px,2vw,28px)/1.2 'Gowun Dodum',sans-serif;color:var(--paper)!important;background:var(--ink)!important;border:0!important;border-radius:999px!important;padding:14px 40px;cursor:pointer;box-shadow:0 10px 24px -12px rgba(40,25,10,.55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #hj-scover .hj-sc-goal{background:#3A3024}}
/* 과학 앱 아래 막대: 작고 가볍게 */
html:has(#ovBar) #ovBar{padding:5px 8px!important;gap:6px!important}
html:has(#ovBar) #ovBar button{font-size:clamp(14px,1.1vw,16px)!important;padding:6px 13px!important;min-height:36px!important}
html:has(#ovBar) #ovBar .pos{font-size:clamp(14px,1.1vw,16px)!important}
html:has(#ovBar) #ovBar .hj-i{width:16px;height:16px}
/* 과학 앱 한 화면 보기: 기본 글자 조금 작게 */
html.hj-hasnav:has(#ovBar) body.ov main{font-size:.94em}
/* 사회·국어 진행 화면: 넓은 화면에서 글자와 카드를 더 크게 */
html body #stage #body{width:min(1560px,96vw);max-width:none}
html body #stage .hd{font-size:clamp(28px,min(3.1vw,6.2vh),54px)!important;line-height:1.3}
html body #stage .recall{width:100%;gap:clamp(12px,1.4vw,24px)}
html body #stage .rc{min-height:clamp(180px,30vh,340px)}
html body #stage .rc .front{font-size:clamp(24px,min(2.5vw,5vh),42px)!important}
html body #stage .rc .back2{font-size:clamp(20px,min(2.05vw,4.2vh),34px)!important}
html body #stage #body>.qbox{width:min(1400px,100%);font-size:clamp(22px,min(2.2vw,4.6vh),38px)!important}
html body #stage .goal{font-size:clamp(15px,1.25vw,20px)}
html body #stage #body{margin-left:auto!important;margin-right:auto!important}
html body #stage .recall{justify-content:center;margin-left:auto;margin-right:auto}
/* 과학 앱 위 탭 줄 더 얇게, 안쪽 '이전/다음 단계'는 아래 막대로 합침 */
html:has(#ovBar) body>nav{border-bottom-width:1px!important}
html:has(#ovBar) body>nav .wrap{padding-top:6px!important;padding-bottom:6px!important;gap:5px!important;min-height:0!important}
html:has(#ovBar) body>nav a{font-size:clamp(13px,.95vw,15px)!important;padding:4px 11px!important;min-height:0!important;line-height:1.35!important}
html:has(#ovBar) body>nav .hj-nav a{min-height:32px;padding:4px 11px 4px 9px}
html.hj-merge-steps section .hj-innernav{display:none!important}
/* 과학 앱 실험 화면 배치 다듬기 */
html:has(#ovBar) body .card{justify-content:center!important;text-align:center}
html:has(#ovBar) body .vs{align-items:stretch}
html:has(#ovBar) body .vs>b{align-self:center}
html:has(#ovBar) body .lab>svg{display:block;width:min(100%,980px)!important;max-height:44vh;margin-left:auto;margin-right:auto}
html:has(#ovBar) body .lab>.row{justify-content:center}
html:has(#ovBar) body .gallery{gap:10px!important}
html:has(#ovBar) body .gallery .photo{display:grid;grid-template-columns:minmax(120px,32%) 1fr;align-items:center;margin:8px 0 0}
html:has(#ovBar) body .gallery .photo img{width:100%;height:100%;max-height:150px;object-fit:cover;aspect-ratio:auto!important}
html:has(#ovBar) body .gallery .photo figcaption{padding:8px 12px!important;font-size:clamp(14px,1.1vw,17px)!important;text-align:left}
html:has(#ovBar) body .photo{border-width:1px!important;border-color:var(--line)!important}
html:has(#ovBar) body .hj-gonext{margin-left:8px}
html:has(#ovBar) body button.hj-retry{background:var(--paper)!important;color:var(--ink)!important}
html:has(#ovBar) body span.hj-rrow{display:inline-flex;gap:8px;margin:0 0 0 auto}
html:has(#ovBar) body span.hj-rrow .hj-gonext{margin-left:0}
/* 이동 단추 묶음은 위치 표시일 뿐: 앱의 nav 꾸밈(밑줄·고정)을 받지 않게 */
html body nav.hj-nav{border:0!important;position:static!important;background:none!important;box-shadow:none!important;padding:0!important;top:auto!important}
/* ===== 화면 배치(모든 교과) ===== */
/* 과학 한 화면 보기: 좌우 여백, 제목·질문은 가운데, 설명은 왼쪽 */
html body.ov main.wrap{max-width:min(1280px,100%)!important;margin-left:auto!important;margin-right:auto!important}
html body.ov section .fitbox>.stage{display:table;margin-left:auto;margin-right:auto}
html body.ov section .fitbox>:is(h2,h3){text-align:center;text-wrap:balance}
html body.ov section .fitbox>p:not(.fb){text-align:center;text-wrap:balance}
html body.ov section :is(.row,.order,.two,.vs,.gauge){justify-content:center}
html body.ov section .fb{text-align:left}
html body.ov section .pick{max-width:1100px;margin-left:auto;margin-right:auto}
/* 사진: 사진 왼쪽 크게, 설명 오른쪽 */
html body.ov .photo{display:grid!important;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:center;max-width:1100px;margin-left:auto!important;margin-right:auto!important}
html body.ov .photo img{width:100%!important;height:auto!important;max-height:min(340px,38vh)!important;aspect-ratio:auto!important;object-fit:cover}
html body.ov .photo figcaption{padding:12px 18px!important;font-size:clamp(16px,1.3vw,20px)!important;line-height:1.55;text-align:left}
html body.ov .photo .cr{font-size:clamp(12px,.9vw,14px)!important;margin-top:6px}
html body.ov .gallery{grid-template-columns:1fr!important;max-width:1100px;margin-left:auto;margin-right:auto}
html body.ov .gallery .photo img{max-height:min(220px,26vh)!important}
html:has(#ovBar) body .gallery .photo{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
/* 국어·사회 진행 화면: 너무 넓게 퍼지지 않게 */
html body #stage #body{width:min(1240px,94vw)!important}
/* 홍지희 선생님 버전 진행 화면 */
html body #lesson .body{width:min(1360px,94vw);max-width:none;margin-left:auto;margin-right:auto}
/* 수학 앱: 가운데 정렬된 넓이 */
html body main.lesson{max-width:min(1480px,100%)!important}
html body.ov section :is(#quiz,#perf,.qz)>div>p.jua,html body.ov section p.jua{text-align:center;text-wrap:balance}
html body.ov section .pick:has(>:nth-child(3):last-child){grid-template-columns:repeat(3,minmax(0,1fr))!important}
html body.ov .photo img{max-height:min(260px,28vh)!important}
html body.ov .gallery .photo img{max-height:min(190px,22vh)!important}
html body.ov main.wrap{max-width:min(1120px,100%)!important}
/* 모든 교과 같은 본문 폭: 눈이 좌우로 너무 오가지 않게 1240px 안팎 */
html body.ov main.wrap{max-width:min(1240px,100%)!important}
html body #lesson .body{width:min(1240px,94vw)!important}
html body .hj-navbar{position:relative;z-index:60}
html body .topbar>.hj-nav{margin-right:10px}
/* 본문 폭 최종: 수학 앱의 활동 칸과 비슷한 1080~1120px. 눈이 좌우로 덜 움직이게 */
html body.ov main.wrap{max-width:min(1080px,100%)!important}
html body #stage #body{width:min(1120px,94vw)!important}
html body #lesson .body{width:min(1120px,94vw)!important}
/* 국어: 자체 확대(최대 약 1.3배)가 있으므로 바탕 폭을 좁혀, 확대 뒤에도 1150px 안팎 */
html body #stage #bodyWrap>#body{width:min(880px,94vw)!important}
html body.ov .hj-pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:1080px;margin:10px auto 0}
html body.ov .hj-pgrid .photo{display:block!important;margin:0!important}
html body.ov .hj-pgrid .photo img{width:100%!important;max-height:min(230px,26vh)!important;object-fit:cover}
html body.ov .hj-pgrid .photo figcaption{font-size:clamp(14px,1.1vw,17px)!important}
html body.ov .photo img{max-height:min(210px,22vh)!important}
html body.ov .photo{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
/* 너무 작은 글자 막기: 출처·쪽수 같은 작은 글도 13.5px 이상 */
html body :is(#lesson,#stage,#cover) small:not(.hj-contact *){font-size:max(13.5px,.8em)!important}
html body .tool .n{font-size:13px!important;min-width:20px;height:20px;line-height:20px}
/* 진행 화면 위 줄: 단계가 많아도 도구 단추와 겹치지 않게(단계 줄만 옆으로 밀기) */
html body .screen:not(#cover) .topbar{flex-wrap:nowrap}
html body .screen:not(#cover) .topbar>:is(.steps,.stagebar){flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap!important}
html body .screen:not(#cover) .topbar>:is(.steps,.stagebar)::-webkit-scrollbar{display:none}
html body .screen:not(#cover) .topbar>:is(.steps,.stagebar)>*{flex:none}
html body .screen:not(#cover) .topbar>.tools{flex:none}
/* 진행 화면 안의 넓은 블록이 본문 폭을 넘지 않게(잘림 방지) */
html body #stage #body>*{max-width:100%!important}
html body #stage #body :is(.exp,.expq,.recall,.talk,.exs,.cmp,.grid2,.grid3){width:100%!important;max-width:100%!important}
html body #lesson .cols{grid-template-columns:repeat(var(--n,3),minmax(0,1fr))!important}
html body #lesson .col{min-width:0}
html body #lesson .col :is(input,textarea){min-width:0;width:100%}
html body #lesson .col .row,html body #lesson .col form{display:flex;gap:6px;min-width:0}
html body #lesson .body{max-width:100%}
html body .wg>h2{white-space:nowrap!important;flex-wrap:nowrap!important;text-wrap:nowrap!important}
html body .wg>h2 .ed{flex:none;font-size:.88rem!important;padding:.2rem .65rem!important;min-height:1.9rem}
/* ===== 폰·패드 세로 화면 ===== */
@media (max-width:820px){
 html body .screen:not(#cover) .topbar{flex-wrap:wrap!important;row-gap:6px}
 html body .screen:not(#cover) .topbar>:is(.steps,.stagebar){flex:1 1 100%;order:2}
 html body .screen:not(#cover) .topbar>.tools{flex:1 1 100%;order:1;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px}
 html body .screen.on>.topbar>.hj-nav{order:0}
 html body header.top{flex-wrap:wrap!important;row-gap:6px;height:auto!important}
 html body header.top .brand{min-width:0;flex:1 1 auto;white-space:normal}
 html body header.top .brand .long{display:none!important}
 html body header.top>.hj-nav{flex:1 1 100%}
 html body .tools{flex-wrap:wrap}
 html body :is(h1,h2,h3,.title,.hd,.ask,.qbox,.lead,p,li,b,span,button,a,td,th,label,small){word-break:keep-all;overflow-wrap:break-word}
}
@media (max-width:480px){
 html body #cover .title,html body #hj-scover .hj-sc-title{font-size:clamp(24px,7vw,32px)!important}
 html body #stage .hd,html body .screen .hd{font-size:clamp(21px,6vw,28px)!important}
 html body .hj-nav a span{font-size:13.5px}
 html body .hj-cvtools .hj-tool2{padding:6px 10px!important}
}
html body .bv i{font-size:max(13px,1em)}
@media (max-width:480px){html body #stage .rc{min-height:150px!important}html body #stage .rc .front img{max-height:90px;object-fit:cover}}
@media (max-width:600px){
 html body .labgrid,html body .lab2,html body .two{grid-template-columns:1fr!important}
 html body .pick{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))!important}
 html body.ov .photo,html:has(#ovBar) body .gallery .photo{grid-template-columns:1fr!important}
 html body.ov .hj-pgrid,html body .gallery{grid-template-columns:1fr!important}
 html body .vs{grid-template-columns:1fr!important}
 html body .vs>b{justify-self:center}
}
@media (max-width:600px){
 html body.ov .gal,html body .card2-wrap{grid-template-columns:1fr!important}
 html body.ov .card2 .pick,html body.ov section .pick.one{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))!important}
}
html body .hj-field>.hj-multi{grid-auto-flow:row!important}
html body .hj-field>.hj-multi .st,html body .hj-field .hj-multi>button{border-top:1px solid var(--line)!important}
html body .hj-field>.hj-multi .st:nth-child(-n+20){border-left:1px solid var(--line)!important}
@media (max-width:900px){html body.ov .gallery,html body.ov .hj-pgrid{grid-template-columns:1fr!important}}
/* 단계 줄이 넘치면 오른쪽 끝을 흐리게: 옆으로 밀어 더 볼 수 있다는 표시 */
html body .screen:not(#cover) .topbar>:is(.steps,.stagebar).hj-ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
html body .card2 .pick{grid-template-columns:repeat(auto-fill,minmax(124px,1fr))!important}
html body .card2 .pick button{padding:.4em .5em!important}
@media (max-width:600px){html body #lesson .cols{grid-template-columns:1fr!important}html body #lesson .col{min-height:0!important}}
html body .wg>h2 .ed{margin-left:auto!important;white-space:nowrap}
html body .wg>h2{min-width:0;overflow:hidden}
/* ===== 메뉴 단추 크기 통일(모든 교과) ===== */
/* 이동 단추 [홈·자료 목록] */
html body .hj-nav a{min-height:36px!important;font-size:clamp(14.5px,1.05vw,16px)!important}
/* 과학 아래 막대: 국어·사회 아래 단추와 같은 크기 */
html:has(#ovBar) #ovBar button{font-size:clamp(15px,1.15vw,17px)!important;min-height:40px!important;padding:7px 15px!important}
html:has(#ovBar) #ovBar .pos{font-size:clamp(15px,1.15vw,17px)!important}
/* 홍지희 버전은 화면 전체를 키우므로(zoom) 단추만 원래 크기로 */
html body #lesson .topbar .tool{font-size:calc(15.5px / var(--hjz,1))!important;min-height:calc(34px / var(--hjz,1))!important;padding:calc(5px / var(--hjz,1)) calc(10px / var(--hjz,1))!important}
html body #lesson .foot :is(.tnote,.ghost,#prev){font-size:calc(16px / var(--hjz,1))!important;min-height:calc(38px / var(--hjz,1))!important;padding:calc(7px / var(--hjz,1)) calc(14px / var(--hjz,1))!important}
html body #lesson .foot #next{font-size:calc(19px / var(--hjz,1))!important;min-height:calc(42px / var(--hjz,1))!important;padding:calc(8px / var(--hjz,1)) calc(20px / var(--hjz,1))!important}
/* 수학 앱: 확인하기·다음 계단은 알맞은 크기로 */
html body main.lesson .big{font-size:clamp(18px,1.35vw,22px)!important;padding:.5em 1.5em!important;width:auto!important;min-width:0!important;box-shadow:0 3px 0 rgba(0,0,0,.15)!important}
html body main.lesson .side>.big{align-self:flex-end}
html body main.lesson .stair{font-size:clamp(16px,1.2vw,19px)!important;min-height:48px;padding-top:6px!important;padding-bottom:6px!important}
/* 우리 반 교실: '자세히'가 칸 밖으로 나가지 않게 */
html body .wg>h2{font-size:clamp(.98rem,1.05vw,1.15rem)!important;gap:.3rem!important}
html body .wg>h2 .ed{font-size:.82rem!important;padding:.15rem .5rem!important;min-height:1.75rem!important}
/* hidden으로 숨긴 것은 정말 숨기기(돋보기 결과가 처음부터 보이던 문제) */
html body [hidden]{display:none!important}
html body #zoom:not([hidden]),html body .zoom:not([hidden]){animation:hjzoom .45s cubic-bezier(.2,.8,.3,1.2)}
@keyframes hjzoom{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
/* 과학 한 화면 보기: 내용이 길면 칸이 늘어나고, 아래 막대가 내용을 가리지 않게 */
html body.ov main section.cur{height:auto!important;overflow:visible!important}
html body.ov{padding-bottom:calc(var(--hjbar,76px) + 28px)!important}
html body.ov main.wrap{padding-bottom:calc(var(--hjbar,76px) + 12px)!important}
/* 과학: 문제(질문)는 왼쪽 정렬 */
html body.ov section :is(#quiz,#perf,.qz)>div>p.jua,html body.ov section p.jua,html body.ov section #clue,
html body.ov section:has(#quiz,#perf,.qz) .fitbox>h3{text-align:left!important;text-wrap:pretty}
/* 사진 두 장이 한 칸에만 몰리던 것: 줄 전체를 쓰고 사진을 크게 */
html body .two>.hj-pgrid:only-child{grid-column:1/-1}
html body.ov .hj-pgrid .photo img{max-height:min(380px,44vh)!important;aspect-ratio:4/3!important}

 "<h3>이 차시에서 아이들이 직접 하는 것<\/h3><ul><li><b>설계 기준을 아이들이 먼저 고릅니다<\/b>(쓰임새, 물질의 종류와 성질, 실제로 쓸 수 있는지, 출처). 지도서 도입 발문 “물체를 새롭게 설계한다면 무엇을 고려해야 할까요?”(159쪽)와 수행 평가 2번(164쪽)을 카드 고르기로 바꾸었습니다.<\/li><li><b>물질 선택의 근거는 우리가 실험으로 알아낸 성질<\/b>입니다. 2차시 막대 실험(투명한 정도, 긁히는 정도, 물에 뜨는 정도)과 3~6차시에서 알아낸 것을 자료 카드로 다시 보고, 부분마다 “이 물질을 고른 까닭”을 성질로 씁니다.<\/li><li><b>근거로 설명 → 동료 평가 자료판<\/b>: 설계를 “알아낸 성질 → 그래서 이 부분을 이 물질로”의 모양으로 설명하고, 발표 뒤 반 친구들의 평가를 모둠별로 모아 봅니다.<\/li><li>흐름(80분): 보기-생각하기 5분 → 설계 기준 6분 → 알아낸 성질 다시 보기 5분 → 설계 계획 8분 → 조사하고 물질 고르기 10분 → 글과 그림으로 설계 20분 → 근거로 설명 8분 → 발표·동료 평가 12분 → 개념 확인 3분 → 칭찬 댓글 3분 (지도서 수업 흐름: 도입 5분·계획하기 30분·해 보기 30분·나누기 15분, 159쪽)<\/li><li>『과학』 32~33쪽 · 『실험관찰』 18~19쪽 · 지도서 158~165쪽<\/li><\/ul><h3>학습 목표 (지도서 158쪽)<\/h3><ul><li>물질의 성질과 쓰임새를 고려한 물체를 설계할 수 있다.<\/li><\/ul><h3>차시 구성 의도 (지도서 158쪽)<\/h3><ul><li>물질의 성질을 이용하여 일상생활에 필요한 물체를 쓰임새에 맞게 설계해 보는 활동으로 과학의 창의성과 문제 해결의 개방성을 기를 수 있도록 한다.<\/li><li>직접 설계한 물체가 물질의 어떤 성질을 이용한 제품인지 쓰임새와 관련지어 설명하는 과정에서 물체와 물질을 종합적으로 이해할 수 있게 한다.<\/li><\/ul><h3>준비물 (지도서 158쪽)<\/h3><ul><li>모둠별: 스마트 기기 / 개인별: 그림 도구<\/li><li>준비물 길잡이: 다양한 생각을 펼칠 수 있도록 흰 종이, 붙임쪽지, 그림 도구 등을 준비하여 자유롭게 의견을 표현하게 할 수 있다. 발표 자료는 스케치북에 알기 쉽게 나타내도록 한다(159쪽).<\/li><\/ul><h3>지도상의 유의점 (지도서 158쪽)<\/h3><ul><li>지금까지 배운 물체와 물질에 관한 내용을 정리하고 이를 적용하여 직접 물체를 설계하고 설명하도록 한다.<\/li><li>토의 및 조사 과정에 적극적으로 참여하도록 격려한다.<\/li><li>검색한 자료의 출처를 반드시 밝히도록 지도한다.<\/li><\/ul><h3>차시 평가 (지도서 160쪽)<\/h3><ul><li>평가 목표: 물질의 성질과 쓰임새를 고려하여 설계한 물체의 특징을 설명할 수 있다. 평가 방법: 관찰 평가, 서술·논술 평가, 자기 평가·동료 평가<\/li><li>지식·이해 — 상: 물체의 쓰임새에 적합한 물질의 종류와 성질을 정확하게 설명할 수 있다. / 중: 설명할 수 있다. / 하: 설명하는 데 어려워한다.<\/li><li>과정·기능 — 상: 물체의 특징이 잘 드러나도록 구체적으로 설계했다. / 중: 특징이 드러나도록 설계했다. / 하: 설계하는 데 어려워한다.<\/li><li>가치·태도 — 상: 창의적으로 생각했으며 창의적으로 소개했다. / 중: 창의적으로 생각했으며 일반적인 방법으로 소개했다. / 하: 창의적인 생각을 어려워했다.<\/li><li>피드백: 물체의 쓰임새와 물질의 성질을 연관 짓는 데 어려움이 있는 학생은 『과학』 20쪽, 21쪽, 23쪽, 27쪽, 29쪽을 다시 읽어 보게 한다(이 앱의 ‘알아낸 성질 다시 보기’ 단계).<\/li><\/ul><h3>성취기준<\/h3><p>[4과05-03] 다양한 물질의 성질을 이용하여 쓰임새 있는 물체를 설계할 수 있다.<\/p><h3>단원 지도상의 유의점 (지도서 106쪽)<\/h3><ul><li>이 단원은 물질의 성질과 물질의 상태를 합친 단원으로, 물질이라는 주제를 중심으로 통합적, 유기적으로 지도해야 한다.<\/li><li>학교, 가정 등 주변의 다양한 장소와 상황에서 경험한 물체와 물질을 관찰하고 분류하는 활동을 통해 물질이 가진 여러 가지 성질을 자연스럽게 이해하도록 지도한다.<\/li><li>학습자의 수준을 고려하여 한 가지 물질이 여러 가지 상태로 존재한다는 것은 다루지 않는다.<\/li><li>물체의 설계 활동은 일상생활에서 사용할 수 있는 물체를 기초적인 아이디어 수준에서 설계하고, 물체의 쓰임새에 적합한 성질을 지닌 물질을 이용하는 데 중점을 두고 지도한다.<\/li><\/ul>", "steps": [{"k": "see", "t": "사진 보기", "min": 5, "hd": "물체를 쓰다가 불편했던 적이 있나요?", "ask": "사진 속 물체를 쓸 때 불편했던 점을 떠올려 보여요 · 생각해요 · 궁금해요 칸에 써요.", "items": [{"p": "lockers", "cap": "사진 ①", "sub": "사물함"}, {"p": "hanger", "cap": "사진 ②", "sub": "옷걸이"}, {"p": "sneakers", "cap": "사진 ③", "sub": "운동화"}], "f": ["~은 ~할 때 불편해요.", "~을 다른 물질로 바꾸면 좋을 것 같아요.", "어떻게 하면 ~을 더 편리하게 할 수 있을까?"], "note": "<h3>발문 (지도서 159쪽 도입)<\/h3><ul><li>일상생활에서 물체를 사용한 경험을 이야기해 봅시다. 그 물체를 사용할 때 불편한 점은 무엇이었나요?<\/li><li>물체를 새롭게 설계한다면 무엇을 고려해야 할까요?<\/li><\/ul><h3>예상 반응 (지도서 159쪽)<\/h3><ul><li>사물함을 사용할 때 문을 열지 않으면 내용물이나 정리 정도를 알 수 없어 불편했습니다.<\/li><li>운동화를 갈아 신을 때 운동화 끈이 잘 늘어나지 않아 운동화 끈을 풀거나 묶기 어렵고 불편했습니다.<\/li><\/ul><h3>지도 길잡이 (지도서 159쪽)<\/h3><p>다양한 물체를 사용하면서 편리했던 경험이나 불편했던 경험을 이야기하는 시간을 충분히 제공한다. 옷걸이(미끄러지지 않는 옷걸이)는 『실험관찰』 추가 예시(162쪽)에 나옵니다.<\/p>"}, {"k": "design", "t": "설계 기준", "min": 6, "hd": "물체를 새롭게 설계할 때 무엇을 생각해야 할까요?", "ask": "설계할 때 생각할 것과 모둠에서 정하는 방법을 고른 뒤 ‘생각 확인하기’를 눌러요.", "parts": [{"q": "① 설계할 때 꼭 생각할 것은? (여러 개 골라요)", "items": [{"x": "물체의 쓰임새", "ok": true, "w": "물체가 어디에, 어떻게 쓰일지 생각해야 해요. (지도서 159쪽)"}, {"x": "물체를 이루는 물질의 종류와 성질", "ok": true, "w": "쓰임새에 알맞은 성질을 가진 물질을 골라야 해요. (지도서 159쪽)"}, {"x": "실제로 쓸 수 있는지", "ok": true, "w": "실현할 수 없는 생각보다 실제로 쓸 수 있는 물체를 계획해요. (지도서 159쪽)"}, {"x": "조사한 자료의 출처", "ok": true, "w": "검색한 자료는 출처를 반드시 밝혀요. (지도서 158쪽)"}, {"x": "가장 비싼 물질인지", "ok": false, "w": "비싼 물질보다 쓰임새에 알맞은 성질을 가진 물질이 중요해요."}, {"x": "물질의 성질은 생각하지 않기", "ok": false, "w": "새로운 쓰임새에 알맞은 물질의 성질을 꼭 생각해야 해요. (지도서 164쪽 수행 평가)"}]}, {"q": "② 모둠에서 설계할 물체를 어떻게 정할까요? (여러 개 골라요)", "items": [{"x": "쓰면서 불편했던 경험 떠올리기", "ok": true, "w": "불편했던 점에서 필요한 쓰임새가 나와요. (지도서 159쪽)"}, {"x": "모둠 친구들의 생각을 합치거나 고치기", "ok": true, "w": "서로의 아이디어를 합치거나 수정 보완해 가장 좋은 설계를 만들어요. (지도서 159쪽)"}, {"x": "한 사람 생각대로 바로 정하기", "ok": false, "w": "모둠원들의 아이디어를 종합하여 의견을 나눈 뒤 정해요. (지도서 159쪽)"}]}], "btn": "생각 확인하기", "note": "<h3>발문 (지도서 159쪽)<\/h3><ul><li>물체를 새롭게 설계한다면 무엇을 고려해야 할까요?<\/li><li>생활 속에서 새롭게 설계할 물체를 모둠별로 정해 볼까요?<\/li><\/ul><h3>예상 반응 (지도서 159쪽)<\/h3><ul><li>물체의 쓰임새를 고려해야 합니다.<\/li><li>물체를 이루는 물질의 종류와 성질을 고려해야 합니다.<\/li><\/ul><h3>지도 길잡이 (지도서 159쪽)<\/h3><ul><li>모둠원들의 아이디어를 종합하여 의견을 나눈 뒤 각자의 방법을 합치거나 수정 보완해 가장 창의적이고 구체적인 방법으로 설계할 수 있도록 지도한다. 그러기 위해서는 서로의 아이디어를 공유하는 시간을 충분히 주어야 한다.<\/li><li>실현 불가능한 아이디어보다는 실제로 사용될 가능성이 있는 물체를 계획해 보도록 지도한다.<\/li><li>검색한 자료를 선택적으로 활용하고, 출처를 반드시 밝히도록 지도한다.<\/li><\/ul><h3>수행 평가 2 (지도서 164쪽)<\/h3><p>설계 과정: ㉢ 불편한 점에 관해 생각해 본다 → ㉡ 다양한 디자인과 쓰임새를 조사해 본다 → ㉣ 쓰임새에 적합한 물질의 종류와 성질을 고려하여 설계한다 → ㉠ 설계한 내용을 공유하고 수정한다. 옳지 않은 것: ㉤ 새로운 쓰임새에 알맞은 물질의 성질은 고려할 필요가 없다.<\/p>"}, {"k": "cards", "t": "알아낸 성질", "min": 5, "hd": "지금까지 알아낸 물질의 성질을 다시 봐요", "ask": "자료 카드를 읽고, 우리 모둠 물체에 쓸 만한 성질을 찾아봐요.", "cards": [{"e": "<svg style=\"width:min(200px,90%);height:auto\" viewBox=\"0 0 120 34\" role=\"img\" aria-hidden=\"true\"><rect x=\"4\" y=\"9\" width=\"112\" height=\"16\" rx=\"3\" fill=\"#C98B4E\" stroke=\"#7A4A1E\" stroke-width=\"2\"/><path d=\"M10 14 q25 -3 50 0 t50 0 M10 20 q30 3 60 0 t40 0\" stroke=\"#8A5527\" stroke-width=\"1.6\" fill=\"none\"/><\/svg>", "t": "나무", "d": "고유의 무늬와 향이 있고, 대부분 물에 떠요. 사포에 긁혀요.", "s": "2차시 막대 실험 · 지도서 117쪽"}, {"e": "<svg style=\"width:min(200px,90%);height:auto\" viewBox=\"0 0 120 34\" role=\"img\" aria-hidden=\"true\"><rect x=\"4\" y=\"9\" width=\"112\" height=\"16\" rx=\"3\" fill=\"#9AA3AD\" stroke=\"#4E565F\" stroke-width=\"2\"/><rect x=\"8\" y=\"11\" width=\"104\" height=\"4\" rx=\"2\" fill=\"#E6EBF0\" opacity=\".9\"/><\/svg>", "t": "금속(철)", "d": "광택이 있고 단단해서 잘 긁히지 않아요.", "s": "2차시 막대 실험 · 지도서 117쪽"}, {"e": "<svg style=\"width:min(200px,90%);height:auto\" viewBox=\"0 0 120 34\" role=\"img\" aria-hidden=\"true\"><rect x=\"4\" y=\"9\" width=\"112\" height=\"16\" rx=\"3\" fill=\"#CFE3EA\" stroke=\"#5F8FA0\" stroke-width=\"2\"/><rect x=\"10\" y=\"12\" width=\"40\" height=\"3\" rx=\"1.5\" fill=\"#fff\"/><rect x=\"4\" y=\"9\" width=\"112\" height=\"16\" rx=\"3\" fill=\"none\" stroke=\"#5FA9BC\" stroke-width=\"2\" stroke-dasharray=\"0\"/><\/svg>", "t": "유리", "d": "투명해서 안이 보이고 물에 젖지 않지만, 충격에 깨지기 쉬워요.", "s": "2차시 막대 실험 · 지도서 117쪽"}, {"e": "<svg style=\"width:min(200px,90%);height:auto\" viewBox=\"0 0 120 34\" role=\"img\" aria-hidden=\"true\"><rect x=\"4\" y=\"9\" width=\"112\" height=\"16\" rx=\"3\" fill=\"#F6E7A8\" stroke=\"#B99A2E\" stroke-width=\"2\"/><rect x=\"10\" y=\"12\" width=\"96\" height=\"3\" rx=\"1.5\" fill=\"#FFF8DA\"/><\/svg>", "t": "플라스틱", "d": "비교적 가볍고 단단하며, 여러 가지 색깔과 모양으로 만들 수 있어요.", "s": "지도서 117·118쪽"}, {"e": "<svg style=\"width:min(200px,90%);height:auto\" viewBox=\"0 0 120 34\" role=\"img\" aria-hidden=\"true\"><ellipse cx=\"60\" cy=\"17\" rx=\"50\" ry=\"11\" fill=\"none\" stroke=\"#A9443A\" stroke-width=\"5\"/><\/svg>", "t": "고무", "d": "잘 늘어났다가 원래대로 돌아오고, 잘 미끄러지지 않아요.", "s": "지도서 123·164쪽 · 『실험관찰』 18쪽"}], "qs": ["우리 모둠 물체의 어느 부분에 어떤 성질이 필요할까요?"], "note": "<h3>지도서 근거<\/h3><ul><li>2차시 정리 예상 반응(117쪽): 나무는 고유의 향과 무늬가 있고, 대부분 물에 뜨는 성질이 있습니다. 금속은 대부분 광택이 있고, 나무나 플라스틱보다 표면이 단단하여 잘 긁히지 않습니다. 유리는 투명하고 물에 젖지 않지만, 충격에 의해 깨지기 쉽습니다. 플라스틱은 다른 물질에 비해 비교적 가볍고 단단하며, 색깔과 모양이 다양한 물체를 만들 수 있습니다.<\/li><li>고무: 잘 늘어나는 고무의 성질을 이용해 고무줄을 만듭니다(2차시 과정안 적용, 123쪽). 쉽게 늘어나고 다시 원래 상태로 돌아오는 성질(164쪽 수행 평가). 잘 미끄러지지 않고 잘 잡히는 손잡이(『실험관찰』 18쪽 예시, 162쪽).<\/li><li>피드백(160쪽): 쓰임새와 물질의 성질을 연관 짓는 데 어려움이 있는 학생은 『과학』 20쪽, 21쪽, 23쪽, 27쪽, 29쪽을 다시 읽어 보게 한다.<\/li><\/ul><h3>진행 팁<\/h3><p>카드는 아이들이 이미 실험으로 확인한 내용을 다시 보는 것입니다. 우리 반 2차시 자료판 결과가 카드와 달랐다면(예: 가라앉은 플라스틱 막대) 우리 반 결과를 근거로 쓰게 하세요.<\/p>"}, {"k": "talk", "t": "설계 계획", "routine": "설계 계획 세우기", "min": 8, "hd": "우리 모둠이 설계할 물체를 정해요", "ask": "설계할 물체, 불편했던 점, 필요한 쓰임새를 정해 칸에 붙여요. 『실험관찰』 18쪽에도 써요.", "cols": ["🧩 설계할 물체", "😣 불편했던 점", "✨ 필요한 쓰임새"], "frames": ["우리 모둠은 ~을 설계할 거예요.", "~할 때 ~해서 불편했어요.", "~하면 좋겠어요."], "note": "<h3>교과서 순서 (『과학』 33쪽 계획하기 · 『실험관찰』 18쪽)<\/h3><ol><li>생활 속에서 새롭게 설계할 물체를 모둠별로 정해 봅시다.<\/li><li>선택한 물체를 사용할 때 불편했던 점이나 필요한 쓰임새를 이야기해 봅시다.<\/li><li>설계할 물체에 필요한 물질의 성질과 쓰임새를 스마트 기기로 조사해 봅시다. (다음 단계)<\/li><\/ol><h3>예상 반응 (지도서 159·162쪽)<\/h3><ul><li>교실에서 항상 사용하는 사물함을 설계해 보고 싶습니다.<\/li><li>불편했던 점: 문을 열어야만 사물함 안에 들어 있는 물건이나 정리 상태를 알 수 있습니다. 필요한 쓰임새: 문을 열지 않아도 사물함 안을 확인할 수 있으면 좋겠습니다.<\/li><\/ul><h3>지도 길잡이 (지도서 162쪽)<\/h3><p>사물함 외에 옷걸이, 모래시계, 운동화, 쓰레기통 등 주변에서 쉽게 볼 수 있고 사용 중인 물체를 떠올려 보고, 설계할 물체를 정하도록 지도한다. 선택한 물체와 관련된 경험을 떠올려 사용할 때 불편한 점을 쓰고, 이와 관련하여 필요한 점을 쓰도록 지도한다.<\/p>"}, {"k": "lab", "t": "물질 고르기", "routine": "조사하고 물질 고르기", "min": 10, "hd": "부분마다 알맞은 물질을 골라요", "ask": "물체를 부분으로 나누고, 부분마다 필요한 성질에 맞는 물질과 고른 까닭을 표에 써요.", "list": ["① 스마트 기기로 비슷한 물체의 모양과 쓰임새를 찾아봐요.", "② 설계할 물체를 부분으로 나누어요.", "③ 부분마다 필요한 성질을 정하고 알맞은 물질을 골라요.", "④ 고른 까닭을 알아낸 물질의 성질로 써요.", "⑤ 찾은 자료의 출처를 적어요."], "table": {"corner": "부분", "cols": ["어느 부분?", "어떤 물질?", "고른 까닭(물질의 성질)"], "rows": ["①", "②", "③", "④"], "ph": ["부분 이름", "물질 이름", "이 물질은 ~해서"], "note": "『실험관찰』 18쪽 표에도 써요."}, "link": {"href": "../sem2/u1-6.html", "label": "설계 스튜디오 열기 (교과서 버전 앱)", "note": "부분마다 물질을 골라 보며 연습할 때 써요."}, "note": "<h3>교과서 순서 (『과학』 33쪽 계획하기 3 · 『실험관찰』 18쪽)<\/h3><p>설계할 물체에 필요한 물질의 성질과 쓰임새를 스마트 기기로 조사해 봅시다. 조사하는 동안: 예를 들어 사물함을 선택한 경우 ‘새로운 사물함’, ‘편리한 사물함’과 같이 검색해 볼 수 있습니다.<\/p><h3>예시 답 (지도서 162쪽)<\/h3><ul><li>사물함 — 유리: 투명하여 창으로 내부 확인 / 고무: 미끄러지지 않고 잘 잡히는 손잡이 / 플라스틱: 가볍고 단단한 몸통 / 금속: 단단하여 문과 몸통을 잇는 고리<\/li><li>미끄러지지 않는 옷걸이 — 고무: 옷이 걸리는 부분으로 옷이 흘러내리지 않는다 / 철(금속): 고리 부분과 본체로 단단하다 / 나무: 옷이 걸리는 받침 부분으로 고유한 무늬와 향이 있다<\/li><\/ul><h3>진행 팁<\/h3><p>‘고른 까닭’ 칸은 앞 단계 자료 카드의 성질과 이어서 쓰게 하세요(예: “유리는 투명해서 안이 보이니까”). 이 칸이 다음 ‘근거로 설명’의 재료가 됩니다.<\/p>"}, {"k": "task", "t": "설계하기", "routine": "글과 그림으로 설계하기", "min": 20, "hd": "글과 그림으로 물체를 설계해요", "ask": "『실험관찰』 19쪽에 모둠 스케치를 하고, 스케치북에 발표 자료를 만들어요. 한 일에 ☑ 표시해요.", "list": ["① 설계할 물체의 이름을 지어요.", "② 전체 모습과 부분을 그림으로 그려요.", "③ 부분마다 물질 이름과 성질을 써넣어요.", "④ 쓰임새와 물질의 성질을 이어서 설명하는 글을 써요.", "⑤ 발표할 사람과 순서를 정해요."], "tip": "실제로 만들지는 않아요. 부분마다 왜 그 물질로 했는지 자세히 써요.", "note": "<h3>교과서 순서 (『과학』 32~33쪽 해 보기 · 『실험관찰』 19쪽)<\/h3><p>조사한 내용을 바탕으로 물체를 구체적으로 설계해 봅시다. ① 설계할 물체의 이름을 씁니다. ② 설계할 물체의 쓰임새와 관련 있는 물질의 성질을 정리합니다. ③ 적합한 물질의 종류를 씁니다. ④ 글과 그림으로 물체를 표현해 봅시다.<\/p><h3>교과서 예시 (『과학』 32쪽)<\/h3><ul><li>예시 1 문을 열지 않아도 안이 보이는 사물함: 플라스틱 — 가볍고 단단한 상자 모양 몸통 / 유리 — 안이 보이는 투명한 창 / 고무 — 잘 미끄러지지 않는 손잡이 / 금속 — 몸통과 문을 튼튼하게 이어 주는 고리<\/li><li>예시 2 똑똑, 화분 물 공급 장치: 금속 — 튼튼해 여러 번 열고 닫을 수 있는 뚜껑 / 플라스틱 — 가볍고 투명한 몸통 / 고무 — 물에 젖지 않고 물이 새지 않도록 하는 마개 / 나무 — 고유의 무늬가 있으며, 아래로 물이 천천히 새어 나오는 지지대<\/li><\/ul><h3>지도 길잡이 (지도서 159·163쪽)<\/h3><ul><li>학생들이 물체를 설계하는 것을 어려워할 경우 다양한 예시를 안내한다.<\/li><li>실제로 만들지는 않지만 각 부분의 원리 및 재료 등에 관한 설명을 자세히 쓰게 하고, 전체와 부분의 모습을 그림으로 나타내도록 지도한다.<\/li><li>『실험관찰』 19쪽에는 모둠에서 의논한 내용을 스케치하도록 하고, 발표할 자료는 스케치북에 알기 쉽게 구체적으로 나타내도록 지도한다. 『실험관찰』 양식이나 공간을 자유롭게 변형하여 사용할 수 있음을 안내한다.<\/li><li>디지털 활용(161쪽): 인포그래픽, 포스터 만들기 애플리케이션으로 설계한 물체의 광고지를 만들어 공유할 수 있다.<\/li><\/ul>"}, {"k": "claim", "t": "근거로 설명", "min": 8, "hd": "우리 설계를 근거로 설명해요", "ask": "알아낸 성질 단추를 눌러 근거 칸에 넣고, 그래서 어느 부분을 어떤 물질로 만들었는지 써요. 다 쓰면 설명 예와 견줘요.", "evTitle": "지금까지 알아낸 물질의 성질", "evs": ["나무: 고유의 무늬와 향이 있고 대부분 물에 떠요", "금속: 단단해서 잘 긁히지 않아요", "유리: 투명해서 안이 보여요", "플라스틱: 가볍고 여러 색깔·모양으로 만들 수 있어요", "고무: 잘 늘어나고 잘 미끄러지지 않아요"], "f1": "알아낸 성질:", "f2": "그래서 우리 물체는", "ph": "~ 부분을 ~로 만들어 ~할 수 있어요.", "btn": "설계 설명 예와 비교하기", "bookLabel": "설계 설명 예", "src": "지도서 160쪽 발표 예 · 『과학』 32쪽 예시 1", "book": "제가 설계한 물체는 ‘문을 열지 않아도 안이 보이는 사물함’입니다. 사물함의 몸체는 가볍고 단단한 플라스틱이고, 사물함 문에 투명한 유리창을 넣어 문을 열지 않고도 사물함 안을 들여다 볼 수 있게 했습니다. 문과 본체는 금속으로 튼튼하게 연결하고, 손잡이는 고무로 설계하여 미끄러지지 않고 잘 잡히도록 했습니다.", "note": "<h3>발문 (지도서 160쪽 나누기)<\/h3><ul><li>설계한 물체 그림을 학급 공유 플랫폼에 올리고, 물질의 성질과 물체의 쓰임새에 맞게 소개해 볼까요?<\/li><\/ul><h3>예상 반응 (지도서 160쪽)<\/h3><p>제가 설계한 물체는 ‘똑똑, 화분 물 공급 장치’입니다. 화분의 흙에 꽂아 두면 직접 물을 주지 않아도 물을 자동으로 공급해 주는 장치입니다. 물이 들어 있는 몸통은 가볍고 다양한 모양으로 만들 수 있는 플라스틱을 사용하였으며 안이 보이도록 투명하게 설계했습니다. 뚜껑은 튼튼한 금속을 사용하고, 마개는 고무를 사용해 물이 새지 않도록 했습니다. 그리고 흙에 꽂아 물이 공급되는 지지대 부분은 나무로 만들어 물이 조금씩 새어 나오도록 했습니다.<\/p><h3>지도 길잡이 (지도서 160쪽)<\/h3><p>『실험관찰』 19쪽의 평가 기준을 생각하며 설계한 물체를 소개하게 한다. 설계한 물체의 성질과 장점을 부각한 4줄~5줄 정도의 광고 자료를 만들어 공유할 수도 있다. 이 단계에서 쓴 설명이 발표 원고가 됩니다.<\/p>"}, {"k": "board", "t": "발표·평가", "min": 12, "g": "peer", "hd": "설계한 물체를 소개하고 서로 평가해요", "ask": "한 모둠이 소개하면, 반 친구들의 의견을 모아 그 모둠 칸을 눌러요. 다 하면 ‘반 전체’를 봐요.", "after": "친구 설계에서 칭찬할 점과 궁금한 점을 질문해요. 발표를 잘 듣고 주의 깊게 봐요.", "note": "<h3>진행 방법<\/h3><ul><li>모둠마다 1분 30초 안팎으로 소개하고, 반 친구들이 기준마다 엄지 위(잘했어요)·옆(더 다듬어요)으로 표시합니다. 많은 쪽을 그 모둠 칸에 넣습니다.<\/li><li>세 기준은 『실험관찰』 19쪽 함께 평가하기(설계한 물체의 쓰임새와 물질의 성질을 관련지어 설명했나요? 여러 가지 물질의 성질을 이용하여 물체를 설계했나요?)와 지도서 159쪽(실제로 사용될 가능성)에서 가져왔습니다.<\/li><li>‘반 전체’는 우리 반 설계들이 어느 기준을 잘 지켰는지 보여 줍니다. ‘더 다듬어요’가 많은 기준은 다 함께 고칠 방법을 이야기하세요.<\/li><\/ul><h3>지도 길잡이 (지도서 160쪽)<\/h3><p>친구가 만든 설계도에서 잘된 점을 찾아 칭찬하고, 친구들이 발표할 때 경청하도록 지도한다. 상황에 따라 온라인 플랫폼을 이용하여 공유하고 발표를 진행할 수 있다.<\/p>"}, {"k": "check", "t": "개념 확인", "min": 3, "hd": "확인해 봐요", "ask": "문제를 읽고 알맞은 답을 눌러요.", "items": [{"q": "쉽게 늘어나고 줄어드는 운동화 끈을 만들려면 어떤 물질이 알맞을까요?", "o": ["고무", "유리", "나무"], "a": 0, "w": "고무는 다른 물질에 비해 쉽게 늘어나고 다시 원래 상태로 돌아오는 성질이 있어요. (지도서 164쪽 수행 평가 1)"}, {"q": "물체를 설계할 때 옳지 않은 생각은?", "o": ["새로운 쓰임새에 알맞은 물질의 성질은 생각하지 않아도 돼요.", "쓰임새에 알맞은 물질의 종류와 성질을 생각해요.", "불편했던 점을 먼저 떠올려요."], "a": 0, "w": "쓰임새에 알맞은 물질의 성질을 꼭 생각해야 해요. (지도서 164쪽 수행 평가 2)"}, {"q": "설계하려고 조사한 내용은 어떻게 해야 할까요?", "o": ["출처를 반드시 밝혀요.", "출처를 밝힐 필요가 없어요.", "친구 것을 내 것이라고 해요."], "a": 0, "w": "조사한 내용은 출처를 반드시 밝혀야 해요. (지도서 164쪽 수행 평가 3)"}], "note": "<h3>지도서 근거<\/h3><p>세 문항 모두 지도서 164쪽 수행 평가 활동지(운동화 끈의 불편한 점에 관한 친구들의 대화)에서 가져왔습니다. 1번 정답 ‘고무’, 2번 옳지 않은 것 ㉤, 3번 잘못 이야기한 친구 3 → “조사한 내용은 출처를 반드시 밝혀야 해.”<\/p>"}, {"k": "talk", "t": "칭찬 댓글", "min": 3, "hd": "친구 설계에 칭찬 댓글을 남겨요", "ask": "친구 설계에서 칭찬할 점과 궁금한 점을 바르고 고운 말로 써요.", "cols": ["👏 칭찬할 점", "❓ 궁금한 점"], "frames": ["~을 ~로 만든 생각이 좋아요.", "~은 왜 ~로 만들었나요?"], "toBoard": true, "note": "<h3>지도서 근거<\/h3><p>『과학』 33쪽 나누기 2: 친구가 소개한 물체에서 칭찬할 점을 댓글로 남겨 봅시다. 예상 반응(지도서 160쪽): 유리의 투명한 성질과 물이 흘러내리는 성질을 잘 나타냈어. 지도 길잡이(163쪽): 인상 깊은 부분이나 좋은 아이디어를 칭찬하는 댓글을 남기게 한다.<\/p><h3>더 알아보기 (지도서 161쪽 보충 자료)<\/h3><p>버려지는 물질을 재탄생시키는 업사이클링(플라스틱 방앗간, 신문지로 만든 의자 등)을 소개하며 다음 차시(새로운 물질 신소재)로 이어 갈 수 있습니다.<\/p>"}], "topic": {"key": "sci32u1", "name": "1단원 물체와 물질", "bq": "물체를 만들 때 왜 그 물질을 고를까? 물질의 성질은 어떻게 알아낼 수 있을까?", "map": [{"s": "S", "f": "u1-l2.html", "n": "2차시", "t": "네 가지 막대의 성질을 비교하라!"}, {"s": "O1", "f": "u1-l3.html", "n": "3차시", "t": "같은 물질로 이루어진 물체를 찾아라!"}, {"s": "S", "f": "u1-l4.html", "n": "4차시", "t": "물질의 세 가지 상태를 알아볼까?"}, {"s": "O1", "f": "u1-l56.html", "n": "5~6차시", "t": "고체, 액체, 기체는 어떻게 다를까?"}, {"s": "O2", "f": "u1-l7.html", "n": "7차시", "t": "물질의 상태를 나타내는 사진을 찾아라!"}, {"s": "P", "f": "u1-l89.html", "n": "8~9차시", "t": "쓰임새에 맞는 물질로 물체 설계하기"}]}};

/* 🔮 예상하기: 결과를 예상하고 까닭을 붙임쪽지로 써요. key가 같으면 뒤의 '예상과 결과 비교' 단계에서 불러와요. */

 <div class="cols wrap" style="--n:2">${col('pr'+k+'a','🔮 내 예상','#6A4FC9',f[0]||'~될 것 같아요.')}${col('pr'+k+'b','💡 그렇게 생각한 까닭','#2F74E0',f[1]||'왜냐하면 ~ 때문이에요.')}</div>${s.tip?`<div class="tip">💡 ${esc(s.tip)}</div>`:''}`;
 document.querySelectorAll('.chip[data-o]').forEach(c=>c.onclick=()=>{const inp=$('i-pr'+k+'a');inp.value=c.dataset.o;inp.focus()});

R.lab=(s,id)=>{const st=LS.get(LK+id+'t',[]);const tb=LS.get(LK+id+'tb',{});const T=s.table;

 const tbl=T?`<table class="rec"><thead><tr><th>${esc(T.corner||'')}</th>${T.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${T.rows.map((r,ri)=>`<tr><th>${esc(r)}</th>${T.cols.map((c,ci)=>`<td><input data-c="${ri}_${ci}" value="${esc(tb[ri+'_'+ci]||'')}" placeholder="${esc((T.ph&&T.ph[ci])||'')}"></td>`).join('')}</tr>`).join('')}</tbody></table>${T.note?`<p class="tnote2">${esc(T.note)}</p>`:''}`:'';
 $('body').innerHTML=`<div class="labwrap"><div class="labl"><div class="task">${s.list.map((t,i)=>`<label class="${st[i]?'done':''}"><input type="checkbox" data-t="${i}" ${st[i]?'checked':''}> ${esc(t)}</label>`).join('')}</div>${safe}</div><div class="labr">${tbl}${link}</div></div>`;
 document.querySelectorAll('[data-t]').forEach(c=>c.onchange=()=>{st[+c.dataset.t]=c.checked;LS.set(LK+id+'t',st);c.parentElement.classList.toggle('done',c.checked)});
 document.querySelectorAll('table.rec input').forEach(inp=>inp.oninput=()=>{tb[inp.dataset.c]=inp.value;LS.set(LK+id+'tb',tb)})};
/* ⚖️ 예상과 결과 비교: 앞에서 쓴 예상을 불러와 실제 결과와 견줘요 */

 $('body').innerHTML=`<div class="prev wrap"><b>🔮 우리가 한 예상</b> ${pa.length?pa.map(x=>`<span class="pv">${esc(x)}</span>`).join(''):'<span class="ask" style="display:inline">(예상하기 단계에서 쓴 쪽지가 여기에 나와요)</span>'}${pb.length?`<br><b>💡 까닭</b> ${pb.map(x=>`<span class="pv">${esc(x)}</span>`).join('')}`:''}</div>
 <div class="cols wrap" style="--n:3">${col(id+'a','📋 실제 결과','#1F9E63',f[0]||'실험해 보니 ~했어요.')}${col(id+'b','⚖️ 예상과 같은 점·다른 점','#E8961E',f[1]||'예상과 ~이 같았어요/달랐어요.')}${col(id+'c','🤔 왜 그럴까?','#E0506B',f[2]||'그 까닭은 ~인 것 같아요.')}</div>${s.after?`<div class="after wrap">💬 ${esc(s.after)}</div>`:''}`;
 wireCols([id+'a',id+'b',id+'c'],[id+'c'])};

/* ===== 3-2 과학 홍지희 선생님 버전: 실험·탐구 단계 (2026.10) =====
   design 🧭 실험 설계 · pgrid 🔮 예상 표 · board 📊 우리 반 자료판 · gcmp ⚖️ 예상과 우리 반 결과 · claim ✍️ 근거로 결론
   표 정의 C.grids[g] = {corner, rows:[{n, svg?}], cols:[...]}. 열(cols)은 세 가지 모양:
   ① 두 보기 {n, o:'보여요', x:'안 보여요', ev?}  → 칸 값 'o' | 'x'
   ② 여러 보기 {n, opts:['고체','액체','기체'], ev?} → 칸 값 '0' | '1' | '2' …
   ③ 측정값 {n, type:'num', unit?:'', ev?, sum?:true(반 전체에서 모두 더한 값도 보여 줌)}      → 칸 값 숫자 글자(예상 표에서는 '더 큼/더 작음'을 묻지 않고 빈칸으로 둠)
   표 전체: pl:'계획'(‘예상’ 대신 쓸 이름), rl:'친구들이 찾은 답'(‘결과’ 대신 쓸 이름) */
Object.assign(ROUT,{design:['🧭','실험 설계하기'],pgrid:['🔮','예상하기'],board:['📊','우리 반 자료판'],gcmp:['⚖️','예상과 결과 비교하기'],claim:['✍️','근거로 결론 만들기']});
const GDEF=C.grids||{};
const NG=()=>C.groups||6;
function rowHead(r){return `<span class="rh">${r.svg?`<span class="rsv">${r.svg}</span>`:''}<span>${esc(r.n)}</span></span>`}
const isNum=c=>c.type==='num';
function opts(c){return c.opts?c.opts.map((t,i)=>({v:String(i),t})):[{v:'o',t:c.o},{v:'x',t:c.x}]}
function cellLab(c,v){if(isNum(c))return v===''||v==null?'?':v+(c.unit||'');const o=opts(c).find(x=>x.v===v);return o?o.t:'?'}
function nextV(c,v){const o=opts(c);const i=o.findIndex(x=>x.v===v);return i<0?o[0].v:(i+1<o.length?o[i+1].v:'')}
function gTable(G,vals,o={}){/* 누를 수 있는 표 (측정값 열은 숫자 칸) */
 return `<table class="rec gt"><thead><tr><th>${esc(G.corner||'')}</th>${G.cols.map(c=>`<th>${esc(c.n)}${isNum(c)&&c.unit?` <small>(${esc(c.unit)})</small>`:''}</th>`).join('')}</tr></thead><tbody>${G.rows.map((r,ri)=>`<tr><th>${rowHead(r)}</th>${G.cols.map((c,ci)=>{const k=ri+'_'+ci;const v=vals[k]||'';
  if(isNum(c))return o.pred?`<td class="na">—</td>`:`<td><input class="gn" data-c="${k}" inputmode="decimal" value="${esc(v)}" placeholder="숫자"></td>`;
  return `<td><button class="gc v${esc(v)}" data-c="${k}">${esc(cellLab(c,v))}</button></td>`}).join('')}</tr>`).join('')}</tbody></table>`}
function wireG(store,save,G){document.querySelectorAll('button.gc[data-c]').forEach(b=>b.onclick=()=>{const k=b.dataset.c;const c=G.cols[+k.split('_')[1]];const n=nextV(c,store[k]||'');store[k]=n;save();b.className='gc v'+n;b.textContent=cellLab(c,n)});
 document.querySelectorAll('input.gn[data-c]').forEach(inp=>inp.oninput=()=>{store[inp.dataset.c]=inp.value.replace(/[^0-9.]/g,'');save()})}
function jo(w,a,b){const c=w.charCodeAt(w.length-1)-0xAC00;return w+(c>=0&&c<11172&&c%28?a:b)}
function hasData(gv){return gv&&Object.values(gv).some(x=>x!==''&&x!=null)}
/* 반 전체 집계: 보기 열은 보기별 모둠 수·많은 쪽, 측정값 열은 모둠 값 목록·가장 작은 값·가장 큰 값 */
function boardData(key){return LS.get(LK+'bd'+key,{})}
function tally(key,G){const d=boardData(key);const out={};let ng=0;for(let g=1;g<=NG();g++)if(hasData(d['g'+g]))ng++;
 G.rows.forEach((r,ri)=>G.cols.forEach((c,ci)=>{const k=ri+'_'+ci;const vals=[];for(let g=1;g<=NG();g++){const v=(d['g'+g]||{})[k];if(v!==''&&v!=null)vals.push(v)}
  if(isNum(c)){const ns=vals.map(Number).filter(x=>!isNaN(x));out[k]={num:true,list:ns,min:ns.length?Math.min(...ns):null,max:ns.length?Math.max(...ns):null,sum:Math.round(ns.reduce((a,b)=>a+b,0)*100)/100,n:ns.length,split:false,maj:''};return}
  const cnt={};vals.forEach(v=>cnt[v]=(cnt[v]||0)+1);const ks=Object.keys(cnt);let maj='';if(ks.length){const mx=Math.max(...ks.map(x=>cnt[x]));const top=ks.filter(x=>cnt[x]===mx);maj=top.length===1?top[0]:'tie'}
  out[k]={cnt,n:vals.length,maj,split:ks.length>1}}));return {cells:out,ng}}
/* 🧭 실험 설계: 질문마다 카드를 고르고 '생각 확인하기'로 까닭을 봐요 */
R.design=(s,id)=>{const sel=LS.get(LK+id+'sel',{});
 $('body').innerHTML=s.parts.map((p,pi)=>`<div class="dpart"><div class="dq">${esc(p.q)}</div><div class="dcards">${p.items.map((it,ii)=>{const k=pi+'_'+ii;return `<button class="dc" aria-pressed="${sel[k]?'true':'false'}" data-k="${k}">${it.svg?`<span class="dsv">${it.svg}</span>`:''}${esc(it.x)}</button>`}).join('')}</div><div class="dfb" id="dfb${pi}"></div></div>`).join('')+`<p class="dwhy" id="dwhy"></p>`
 +`<div class="row-c"><button class="big-btn" id="dChk" style="font-size:clamp(18px,1.7vw,23px);padding:6px 22px">🔎 ${esc(s.btn||'생각 확인하기')}</button></div>${s.col?`<div class="cols wrap" style="--n:1">${col(id+'z',s.col,'#2F74E0','',{ph:s.colph||'생각을 써요'})}</div>`:''}`;
 let checked=false;const strip=w=>(w||'').replace(/\s*\([^()]*쪽\)\s*$/,'');
 document.querySelectorAll('.dc').forEach(b=>b.onclick=()=>{const [pi,ii]=b.dataset.k.split('_').map(Number);
  if(checked){const it=s.parts[pi].items[ii];$('dwhy').innerHTML=`💬 <b>${esc(it.x)}</b> — ${esc(strip(it.w))}`;$('dwhy').classList.add('on');return}
  const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);sel[b.dataset.k]=on;LS.set(LK+id+'sel',sel)});
 $('dChk').onclick=()=>{checked=true;$('dChk').textContent='🔁 다시 고르기';$('dChk').onclick=()=>R.design(s,id);s.parts.forEach((p,pi)=>{const msgs=[];p.items.forEach((it,ii)=>{const on=!!sel[pi+'_'+ii];const b=document.querySelector(`.dc[data-k="${pi}_${ii}"]`);b.classList.remove('good','bad','miss');
   if(on&&it.ok===true)b.classList.add('good');if(on&&it.ok===false)b.classList.add('bad');if(!on&&it.ok===true&&!p.free)b.classList.add('miss');
   if(((on&&it.ok!==true)||(!on&&it.ok===true&&!p.free))&&it.w)msgs.push(`<li class="${on?(it.ok===false?'bad':'good'):'miss'}">${on?(it.ok===false?'🤔':'👍'):'➕'} <b>${esc(it.x)}</b> — ${esc(strip(it.w))}</li>`)});
  $('dfb'+pi).innerHTML=msgs.length?`<ul>${msgs.join('')}</ul>`:'<ul><li class="good">👍 잘 골랐어요!</li></ul>';$('dfb'+pi).classList.add('on')});$('dwhy').innerHTML='💬 카드를 누르면 그 까닭이 여기에 나와요.';$('dwhy').classList.add('on')};
 if(s.col)wireCols([id+'z'])};
/* 🔮 예상 표: 칸을 눌러 예상을 골라요(누를 때마다 바뀜). 측정값 열은 비워 두고, 까닭은 붙임쪽지로 */
R.pgrid=(s,id)=>{const G=GDEF[s.g];const v=LS.get(LK+'pg'+s.g,{});const c0=G.cols.find(c=>!isNum(c));const o0=c0?opts(c0):[];
 $('body').innerHTML=`<div class="gwrap"><div>${gTable(G,v,{pred:1})}${c0?`<p class="tnote2">칸을 누를 때마다 ${o0.map(x=>'‘'+esc(x.t)+'’').join(' → ')} → 처음으로 바뀌어요.</p>`:''}</div><div class="cols" style="--n:1">${col('pg'+s.g+'r',`💡 그렇게 ${G.pl?esc(G.pl)+'한':'예상한'} 까닭`,'#2F74E0','',{ph:s.ph||'왜냐하면 ~ 때문이에요.'})}</div></div>${s.tip?`<div class="tip">💡 ${esc(s.tip)}</div>`:''}`;
 wireG(v,()=>LS.set(LK+'pg'+s.g,v),G);wireCols(['pg'+s.g+'r'])};
/* 📊 우리 반 자료판: 모둠마다 결과를 넣고, '반 전체'에서 모아 봐요 */
function sumCell(c,t){
 if(t.num){if(!t.n)return '<span class="cnt">—</span>';const W=Math.max(1,...[t.max]);return `<div class="nlist">${t.list.map(x=>`<span>${x}</span>`).join('')}</div><div class="cnt">${c.sum?`모두 더하면 <b class="m">${t.sum}${esc(c.unit||'')}</b> · `:''}가장 작은 값 <b>${t.min}</b> · 가장 큰 값 <b>${t.max}</b>${esc(c.unit||'')}</div>`}
 if(!t.n)return '<span class="cnt">—</span>';const os=opts(c);const pal=['#2F74E0','#B08B6E','#1F9E63','#E8961E','#6A4FC9'];
 return `<div class="bar">${os.map((o,i)=>t.cnt[o.v]?`<span style="flex:${t.cnt[o.v]};background:${pal[i%pal.length]}"></span>`:'').join('')}</div><div class="cnt">${os.map(o=>`<b class="${t.maj===o.v?'m':''}">${esc(o.t)} ${t.cnt[o.v]||0}</b>`).join(' · ')}${t.split?' ⚠️':''}</div>`}
R.board=(s,id)=>{const G=GDEF[s.g];const d=boardData(s.g);let cur=LS.get(LK+id+'cur','g1');
 const draw=()=>{const tabs=[...Array(NG())].map((_,i)=>{const g='g'+(i+1);const has=hasData(d[g]);return `<button class="bt ${cur===g?'on':''} ${has?'has':''}" data-g="${g}">${i+1}모둠${has?' ✓':''}</button>`}).join('')+`<button class="bt all ${cur==='all'?'on':''}" data-g="all">📊 반 전체</button>`;
  let main;
  if(cur==='all'){const T=tally(s.g,G);

(function(){var NS='http://www.w3.org/2000/svg';

 function fitBubble(t){if(t.dataset.hjFit)return;t.dataset.hjFit='1';var p=t.previousElementSibling,box=null;for(var i=0;i<3&&p;i++,p=p.previousElementSibling){if(p.tagName==='rect'){box=p;break}}if(!box)return;

   var cy=b.y+b.height/2;if(cy<ry||cy>ry+rh||b.x<rx-4||b.x>rx+rw)return;var anchor=t.getAttribute('text-anchor')||'start';var room=anchor==='middle'?rw-12:(rx+rw-6)-b.x;if(b.width<=room+1)return;

(function(){var SEL='h1,h2,h3,h4,.hd,.ask,.title,.lead,.big,.sit,.qtext,.hj-sc-title,.hj-sc-goal,p.jua,.goal,.q,.clue,#clue,.qbox,.bq,.goalbox',RX=/[^,.!?⁣]+(?:[,.!?]+|⁣|$)/g;

   - 안내 글(상황 설명)은 작게, 마지막 '~골라요/~써 봐요' 같은 할 일 문장은 크게 따로 */
(function(){if(!document.body.classList.contains('ov')&&!document.getElementById('ovBar'))return;
 var VERB=/(골라요|골라 봐요|고르세요|써요|써 봐요|써 보세요|적어요|적어 봐요|눌러요|눌러 봐요|눌러 보세요|찾아요|찾아 봐요|찾아보세요|세어 봐요|옮겨요|옮겨 봐요|답해요|넣어요|넣어 봐요|표시해요|말해 봐요|맞혀요|맞혀 봐요|이어요|이어 봐요|정해요|그려요|그려 봐요|만들어 봐요|비교해 봐요|분류해 봐요|나누어 봐요|살펴봐요|살펴보세요|관찰해요|관찰해 봐요|확인해요|확인해 봐요|예상해 봐요|생각해 봐요|정리해 봐요)[.!]?$/;
 function copyState(from,to){for(var k in from.dataset)to.dataset[k]=from.dataset[k];if(from.classList.contains('ovhide'))to.classList.add('ovhide')}
 function run(){document.querySelectorAll('main section').forEach(function(sec){var b=sec.querySelector(':scope > .fitbox')||sec;
  var st=b.querySelector(':scope > .stage'),h2=b.querySelector(':scope > h2');
  if(st&&h2&&st.nextElementSibling===h2&&!st.closest('.hj-head')){var hd=document.createElement('div');hd.className='hj-head';hd.dataset.always='1';st.before(hd);hd.appendChild(st);hd.appendChild(h2)}
  b.querySelectorAll(':scope > p').forEach(function(p){if(p.dataset.hjp||p.matches('.fb,.tip,.jua,.goal,.hj-src')||p.id)return;p.dataset.hjp='1';
   var h=p.innerHTML.trim(),txt=p.textContent.trim();if(txt.length<8)return;
   var cut=-1,re=/[.!?]\s+(?=[^<>]*(?:<|$))/g,m;while(m=re.exec(h))cut=m.index+1;
   if(cut>0){var last=h.slice(cut).trim(),tmp=document.createElement('div');tmp.innerHTML=last;

    p.classList.add('hj-guide');return}
   if(VERB.test(txt))p.classList.add('hj-task');else p.classList.add('hj-guide')})})}
