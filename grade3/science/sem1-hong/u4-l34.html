<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🔍 배추흰나비의 한살이를 관찰해 볼까?</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#EAF1F8;--paper:#FFFFFF;--ink:#1F2A44;--soft:#4F5B75;--line:#CAD6E4;
  --ok:#1F9E63;--no:#D2453A;--acc:#2F74E0;--note:#FFF4C2;--note-ink:#3B3200;
  --S:#E0506B;--O1:#2F74E0;--O2:#6A4FC9;--P:#1F9E63;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#162034;--paper:#22304C;--ink:#F2F5FB;--soft:#B7C3DB;--line:#3A4C74;--note:#4A4420;--note-ink:#FFF6CC}}
:root[data-theme="dark"]{--bg:#162034;--paper:#22304C;--ink:#F2F5FB;--soft:#B7C3DB;--line:#3A4C74;--note:#4A4420;--note-ink:#FFF6CC}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:clamp(19px,1.9vw,24px);line-height:1.45;overflow:hidden}
body,h1,h2,h3,p,li,span,div,button,a,small,b,label{word-break:keep-all;overflow-wrap:break-word;line-break:strict}
h1,h2,h3,.hd,.ttl{text-wrap:balance} p,li,small{text-wrap:pretty}
button{font-family:var(--display);color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:4px solid var(--acc);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:clamp(10px,1.6vw,24px)}
.screen.on{display:flex}
/* 표지 */
#cover{overflow-y:auto;align-items:center;gap:14px}
#cover .inner{width:min(1100px,100%);display:flex;flex-direction:column;gap:14px;align-items:center;margin:auto 0}
.badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);color:#fff;border-radius:999px;padding:4px 16px;font-size:clamp(17px,1.6vw,22px);background:var(--sc)}
.title{font-size:clamp(34px,4.6vw,64px);text-align:center;line-height:1.15}
.lead{color:var(--soft);text-align:center;margin:0;font-size:clamp(18px,1.7vw,23px)}
.bq{width:100%;background:var(--paper);border:4px solid var(--sc);border-radius:22px;padding:12px 20px;text-align:center}
.bq small{display:block;color:var(--soft);font-size:clamp(15px,1.4vw,19px)}
.bq b{font-family:var(--display);font-weight:400;font-size:clamp(24px,2.6vw,36px)}
.goalbox{background:#FFF4D6;color:#1F2A44;border:4px solid #E8961E;border-radius:18px;padding:8px 20px;font-family:var(--display);font-size:clamp(21px,2.1vw,30px);text-align:center}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.mcol{background:var(--paper);border-radius:16px;border-top:10px solid var(--mc);padding:8px 10px}
.mcol h3{font-size:clamp(17px,1.6vw,21px);color:var(--mc)}
.mcol a,.mcol span.cur{display:block;font-size:clamp(15px,1.35vw,18px);color:var(--ink);text-decoration:none;padding:3px 6px;border-radius:8px;margin-top:3px}
.mcol a:hover{background:var(--bg)}
.mcol .cur{background:var(--mc);color:#fff!important;font-family:var(--display)}
.plan{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.big-btn{font-size:clamp(24px,2.4vw,34px);padding:10px 40px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);box-shadow:0 5px 0 rgba(0,0,0,.25)}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.ghost{font-size:clamp(17px,1.6vw,22px);padding:8px 18px;border-radius:999px;border:3px solid var(--ink);background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
/* 수업 화면 */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.steps{display:flex;gap:5px;align-items:center;flex:1;min-width:0;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.st{flex:none;font-family:var(--display);font-size:clamp(14px,1.2vw,18px);padding:4px 10px;border-radius:999px;border:3px solid var(--line);background:var(--paper);color:var(--soft)}
.st.now{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.st.done{border-color:var(--ok);color:var(--ok)}
.tools{display:flex;gap:5px;align-items:center;flex:none}
.tool{font-size:clamp(15px,1.3vw,19px);border:3px solid var(--line);background:var(--paper);border-radius:14px;padding:4px 9px;white-space:nowrap}
.tool.qb{border-color:#E8961E}
.tool .n{display:inline-block;min-width:1.5em;border-radius:999px;background:#E8961E;color:#fff;font-size:.8em;padding:0 5px;margin-left:4px}
.sthead{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.routine{font-family:var(--display);font-size:clamp(15px,1.35vw,19px);background:var(--sc);color:#fff;border-radius:999px;padding:3px 12px}
.hd{font-family:var(--display);font-size:clamp(26px,2.8vw,40px);text-align:center;margin:0}
.ask{color:var(--soft);text-align:center;margin:0;font-size:clamp(17px,1.6vw,22px)}
.body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;padding:6px 2px}
.wrap{width:min(1240px,100%)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:6px}
.tnote{border:3px solid #6A4FC9;color:#6A4FC9;background:var(--paper);border-radius:14px;padding:6px 14px;font-size:clamp(16px,1.5vw,21px)}
/* 붙임쪽지 칸 */
.cols{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:10px;width:100%}
.col{background:var(--paper);border-radius:18px;border-top:10px solid var(--cc);padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-height:170px}
.col h3{font-size:clamp(20px,2vw,27px);color:var(--cc);display:flex;align-items:center;gap:6px}
.col .frame{font-size:clamp(14px,1.3vw,17px);color:var(--soft);margin:0}
.notes{display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow-y:auto;flex:1}
.note{background:var(--note);color:var(--note-ink);border-radius:10px;padding:6px 10px;font-size:clamp(17px,1.6vw,22px);display:flex;gap:6px;align-items:flex-start;justify-content:space-between}
.note .x{border:0;background:none;font-size:15px;opacity:.6;padding:0 2px}
.note .up{border:0;background:#E8961E;color:#fff;border-radius:8px;font-size:13px;padding:2px 6px;white-space:nowrap}
.add{display:flex;gap:6px}
.add input{flex:1;min-width:0;font-family:var(--body);font-size:clamp(17px,1.6vw,21px);padding:6px 10px;border:3px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.add button{border:0;border-radius:10px;background:var(--cc);color:#fff;font-size:clamp(16px,1.5vw,20px);padding:4px 12px}
/* 보기 자료 */
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px;width:100%}
.pic{background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--body)}
.pic img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px}
.pic .e{font-size:clamp(46px,5vw,70px);line-height:1.2}
.pic b{font-family:var(--display);font-weight:400;font-size:clamp(18px,1.7vw,23px)}
.pic small{color:var(--soft);font-size:clamp(14px,1.3vw,17px)}
.pic .num{font-family:var(--display);background:var(--ink);color:var(--bg);border-radius:999px;padding:0 10px;font-size:15px;align-self:flex-start}
.split{display:flex;flex-direction:column;gap:10px;width:100%}
.split .gal{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.split .pic img{aspect-ratio:16/9;max-height:17vh}.split .pic .e{font-size:clamp(40px,4vw,56px)}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:8px;width:100%}
.mini .m{display:flex;gap:10px;align-items:center;background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:6px 10px;text-align:left}
.mini .m img{width:96px;height:72px;object-fit:cover;border-radius:10px;flex:none;cursor:zoom-in}
.mini .m .e{font-size:40px;flex:none;width:60px;text-align:center}
.mini .m b{font-family:var(--display);font-weight:400;font-size:clamp(17px,1.6vw,21px);display:block}
.mini .m span.d{font-size:clamp(14px,1.3vw,17px);display:block}
.mini .m small{font-size:12px;color:var(--soft)}
.mini .num{font-family:var(--display);background:var(--ink);color:var(--bg);border-radius:999px;padding:0 8px;font-size:14px}
.col.cmp{min-height:0}.col.cmp .notes{max-height:14vh}
/* 분류 */
.deck{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.card1{width:min(900px,100%);background:var(--paper);border:4px solid var(--line);border-radius:22px;padding:12px 20px;display:flex;gap:16px;align-items:center;justify-content:center}
.card1 .e{font-size:clamp(50px,5vw,80px);line-height:1}
.card1 img{width:clamp(130px,16vw,220px);aspect-ratio:4/3;object-fit:cover;border-radius:12px}
.card1 .x{font-family:var(--display);font-size:clamp(24px,2.6vw,38px)}
.bins{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:10px;width:min(1000px,100%)}
.bin{border:0;background:var(--cc);color:#fff;border-radius:30px 30px 14px 14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 rgba(0,0,0,.2);font-size:clamp(21px,2.2vw,31px)}
.bin .e{font-size:clamp(30px,3.2vw,46px)}
.bin .c{font-family:var(--body);font-size:15px;opacity:.9}
.fb{width:min(900px,100%);border-radius:16px;padding:8px 16px;font-size:clamp(18px,1.7vw,23px);display:none}
.fb.on{display:block}.fb.ok{background:color-mix(in srgb,var(--ok) 18%,var(--paper));border:3px solid var(--ok)}
.fb.no{background:color-mix(in srgb,var(--no) 12%,var(--paper));border:3px solid var(--no)}
.fb.open{background:color-mix(in srgb,#E8961E 16%,var(--paper));border:3px solid #E8961E}
.sorted{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:10px;width:min(1000px,100%)}
.sorted div{background:var(--paper);border-radius:14px;border-top:8px solid var(--cc);padding:6px 10px;font-size:clamp(15px,1.4vw,19px)}
.after{background:#FFF4D6;color:#1F2A44;border:4px solid #E8961E;border-radius:18px;padding:8px 16px;width:min(1000px,100%);font-size:clamp(19px,1.8vw,25px)}
/* 뜻 만들기 */
.frameline{font-family:var(--display);font-size:clamp(24px,2.6vw,36px);text-align:center;background:var(--paper);border-radius:18px;padding:10px 16px;width:min(1100px,100%)}
.frameline input{font-family:var(--display);font-size:inherit;width:min(26ch,70%);border:0;border-bottom:4px dashed var(--acc);background:transparent;color:var(--acc);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-family:var(--body);font-size:clamp(16px,1.5vw,20px);border:3px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px}
.chip[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,var(--paper))}
.book{display:none;width:min(1100px,100%);border:4px solid var(--ok);border-radius:18px;background:var(--paper);padding:10px 16px;text-align:center}
.book.on{display:block}
.book b{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.3vw,32px)}
.book mark{background:color-mix(in srgb,var(--ok) 25%,transparent);color:inherit;border-radius:6px;padding:0 3px}
/* 주장-근거-질문 */
.csq{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%}
.evi{display:flex;flex-wrap:wrap;gap:6px}
.evi button{font-family:var(--display);font-size:clamp(16px,1.5vw,20px);border:3px solid var(--line);background:var(--paper);border-radius:12px;padding:4px 10px}
.evi button[aria-pressed="true"]{border-color:#1F9E63;background:color-mix(in srgb,#1F9E63 18%,var(--paper))}
.qpick{width:min(1100px,100%);background:var(--paper);border:4px solid #E8961E;border-radius:18px;padding:4px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qpick select{flex:1;min-width:220px;font-family:var(--body);font-size:clamp(17px,1.6vw,21px);padding:6px;border-radius:10px;border:3px solid var(--line);background:var(--bg);color:var(--ink)}
.log{width:100%;display:grid;gap:6px}
.log div{background:var(--paper);border-left:10px solid #1F9E63;border-radius:10px;padding:6px 12px;font-size:clamp(16px,1.5vw,20px)}
/* 활동 안내 */
.task{width:min(1100px,100%);display:grid;gap:8px}
.task label{display:flex;gap:10px;align-items:center;background:var(--paper);border-radius:14px;padding:8px 14px;font-size:clamp(19px,1.8vw,25px);border:3px solid var(--line)}
.task input{width:26px;height:26px;accent-color:var(--ok)}
.task label.done{border-color:var(--ok);opacity:.8}
.tip{background:#FFF4D6;color:#1F2A44;border-radius:14px;padding:8px 14px;width:min(1100px,100%);font-size:clamp(17px,1.6vw,21px)}
/* 확인 */
.qz{width:min(1000px,100%);display:flex;flex-direction:column;gap:8px;align-items:center}
.qt{font-family:var(--display);font-size:clamp(23px,2.4vw,34px);text-align:center;background:var(--paper);border-radius:18px;padding:10px 16px;width:100%}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.opt{font-family:var(--body);font-size:clamp(19px,1.9vw,26px);border:4px solid var(--line);background:var(--paper);border-radius:16px;padding:8px 12px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--paper))}
.opt.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,var(--paper))}
/* 겹침 창 */
.overlay{position:fixed;inset:0;background:rgba(15,22,40,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.overlay.on{display:flex}
.panel{background:var(--paper);border-radius:24px;padding:clamp(14px,2vw,28px);width:min(1150px,96vw);max-height:92vh;overflow-y:auto;border-top:16px solid var(--pc,var(--ink))}
.panel h2{font-size:clamp(28px,3vw,42px);margin-bottom:6px}
.tpanel h3{font-size:clamp(20px,1.9vw,26px);color:#6A4FC9;margin:12px 0 4px}
.tpanel li,.tpanel p{font-size:clamp(17px,1.6vw,21px);line-height:1.55}
.qadd{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.qadd select,.qadd input{font-family:var(--body);font-size:clamp(17px,1.6vw,21px);padding:6px 10px;border:3px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.qadd input{flex:1;min-width:240px}
.qadd button{border:0;border-radius:10px;background:#E8961E;color:#fff;font-size:clamp(17px,1.6vw,21px);padding:4px 14px}
.stems{display:flex;flex-wrap:wrap;gap:6px}
.stems button{font-family:var(--body);font-size:clamp(15px,1.4vw,18px);border:2px dashed #E8961E;background:transparent;border-radius:999px;padding:2px 10px}
.qlist{display:grid;gap:8px;margin-top:10px}
.qi{border:3px solid var(--line);border-radius:14px;padding:8px 12px;display:grid;gap:4px;background:var(--bg)}
.qi.s1{border-color:#2F74E0}.qi.s2{border-color:var(--ok)}
.qi .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qi .ty{font-family:var(--display);font-size:14px;background:#E8961E;color:#fff;border-radius:999px;padding:1px 9px}
.qi .from{font-size:13px;color:var(--soft)}
.qi .q{font-size:clamp(18px,1.7vw,23px);flex:1}
.qi .stt{font-family:var(--display);font-size:15px;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:2px 10px}
.qi .ans{font-size:clamp(16px,1.5vw,20px);color:var(--ink)}
.qi input{font-family:var(--body);font-size:16px;padding:4px 8px;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
.picker{font-family:var(--display);font-size:clamp(90px,14vw,170px);text-align:center;line-height:1.1}
.bigview{position:fixed;inset:0;background:rgba(8,12,22,.95);display:none;align-items:center;justify-content:center;z-index:30}
.bigview.on{display:flex}.bigview img{max-width:96vw;max-height:84vh;border-radius:12px}
.bigview .meta{position:fixed;left:0;right:0;bottom:0;padding:8px 14px;color:#fff;text-align:center;font-size:15px;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.bigview .close{position:fixed;top:12px;right:14px;width:56px;height:56px;border-radius:50%;border:0;font-size:26px;background:#fff;color:#1F2A44}
.creditbar{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px;width:100%}
.tolist{display:none;font-family:var(--display);font-size:clamp(17px,1.6vw,21px);text-decoration:none;color:inherit;border:3px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 18px}
.tolist.on{display:inline-flex}
.hjfoot{display:block;width:100%;margin:14px 0 0;padding:10px 0 2px;border-top:3px solid var(--line);text-align:center;color:var(--soft);font-size:16px;line-height:1.7}
.hjfoot p{margin:2px 0}
.pcredit{font-size:13px;color:var(--soft);text-align:center;margin:0}
@media (max-height:760px) and (min-width:900px){
  .notes{max-height:24vh}.col{min-height:140px}.pic img{aspect-ratio:16/10}
  .hd{font-size:clamp(24px,2.4vw,34px)}.sthead{margin:0}.ask{font-size:17px}.col .frame{display:none}
}
@media (max-width:900px){
  .cols,.csq{grid-template-columns:1fr}.split{grid-template-columns:1fr}.map{grid-template-columns:1fr 1fr}
  .opts{grid-template-columns:1fr}.notes{max-height:22vh}
}
@media print{
  body{overflow:visible;background:#fff;color:#000}.screen{position:static;display:none}
  .overlay{display:none!important}#qbPanel.printme{display:block!important;position:static;background:#fff}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== 과학 탐구 단계 ===== */
.labwrap{width:min(1180px,100%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.labwrap .task{width:100%}
.labwrap .task{gap:5px}
.labwrap .task label{font-size:clamp(16px,1.45vw,20px);padding:4px 10px;border-width:2px}
.labwrap .task input{width:22px;height:22px;flex:none}
.labr,.labl{display:grid;gap:8px}
.labl2{margin:0;font-size:clamp(15px,1.3vw,18px);color:var(--soft)}
.tnote2{margin:2px 0 0;font-size:clamp(15px,1.3vw,18px);color:var(--soft)}
@media (max-width:900px),(orientation:portrait){.labwrap{grid-template-columns:minmax(0,1fr)}}
.safe{background:#FDE7EA;color:#5A1320;border:3px solid #E0506B;border-radius:14px;padding:6px 12px;font-size:clamp(15px,1.35vw,19px)}
.labgo{display:inline-block;text-decoration:none;font-size:clamp(16px,1.4vw,19px);padding:4px 14px}
table.rec{width:100%;border-collapse:collapse;background:var(--paper);border-radius:14px;overflow:hidden}
table.rec th,table.rec td{border:2px solid var(--line);padding:4px 6px;font-size:clamp(16px,1.5vw,20px);text-align:center;word-break:keep-all}
table.rec thead th{background:var(--sc,#2F74E0);color:#fff;font-family:var(--display);font-weight:400}
table.rec tbody th{background:var(--bg);font-family:var(--display);font-weight:400}

#lesson .gal:not(.split .gal) .pic img{aspect-ratio:auto;height:clamp(100px,19vh,300px);max-height:none;object-fit:cover}

html .hj-em{font-family:'HJ Emoji','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-weight:400;font-style:normal;font-synthesis:none;letter-spacing:0;-webkit-text-stroke:0;text-shadow:none}
/* 교사 안내 창 도구(인쇄·구글 문서·이메일) */
html body .hj-tbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px 0 4px;padding-top:18px;border-top:1px solid var(--line)}
html body .hj-tbar>button,html body .hj-mail button{display:inline-flex;align-items:center;gap:7px;font:700 16px/1.2 'Gowun Dodum',sans-serif;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;cursor:pointer}
html body .hj-tbar>button:hover,html body .hj-mail button:hover{background:var(--bg);border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
html body .hj-tbar .hj-i{width:18px;height:18px;flex:none}
html body .hj-mail{flex-basis:100%;display:grid;gap:8px;max-width:560px;margin:6px auto 0;text-align:left;background:var(--bg);border-radius:16px;padding:14px 16px}
html body .hj-mail[hidden]{display:none}
html body .hj-mail label{font-weight:700;font-size:16px}html body .hj-mail label small{font-weight:500;color:var(--soft);font-size:14px;margin-left:6px}
html body .hj-mail input{font:500 17px/1.4 'Gowun Dodum',sans-serif;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
html body .hj-mail div{display:flex;flex-wrap:wrap;gap:8px}html body .hj-mail p{margin:0;font-size:14px!important;color:var(--soft)}
html body .hj-toast{flex-basis:100%;margin:2px 0 0;min-height:1.3em;text-align:center;font-size:15px!important;color:var(--soft)}
@media print{
 body.hj-tprint>*:not(#tn){display:none!important}
 body.hj-tprint #tn{position:static!important;display:block!important;background:none!important;padding:0!important;inset:auto!important}
 body.hj-tprint #tn .panel{width:auto!important;max-height:none!important;overflow:visible!important;box-shadow:none!important;border:0!important;border-radius:0!important;padding:0!important;transform:none!important;animation:none!important}
 body.hj-tprint .hj-tbar,body.hj-tprint #tnClose{display:none!important}
 body.hj-tprint{background:#fff!important;color:#000}
 body.hj-tprint #tn .panel{padding:16mm!important}
}
/* 수업을 마쳤을 때 고르는 창 */
#hj-done{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:rgba(42,34,28,.38);backdrop-filter:blur(3px);animation:hjfade .2s ease}
@keyframes hjfade{from{opacity:0}to{opacity:1}}
#hj-done .hj-dp{width:min(560px,100%);background:var(--paper,#fff);color:var(--ink,#2A221C);border-radius:24px;padding:30px 28px 24px;text-align:center;box-shadow:0 30px 60px -24px rgba(40,25,10,.5);font-family:'Gowun Dodum',sans-serif;word-break:keep-all}
#hj-done .hj-dok{display:inline-grid;place-items:center;width:60px;height:60px;border-radius:18px;background:color-mix(in srgb,#7FB89A 22%,var(--paper,#fff));color:#3F7A5C}
#hj-done .hj-dok svg{width:32px;height:32px}
#hj-done h2{font-family:'Jua',sans-serif;font-size:clamp(26px,3vw,32px);margin:12px 0 4px;letter-spacing:-.03em}
#hj-done .hj-dl{margin:0 0 20px;color:var(--soft,#5C5047);font-size:17px}
#hj-done .hj-dn{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;text-align:left;text-decoration:none;color:#fff;background:var(--ink,#2A221C);border-radius:18px;padding:16px 20px}
#hj-done .hj-dn small{grid-column:1;font-size:14px;opacity:.75;font-weight:600}
#hj-done .hj-dn b{grid-column:1;font-size:clamp(18px,2vw,21px);line-height:1.4}
#hj-done .hj-dn svg{grid-column:2;grid-row:1/3;width:26px;height:26px}
#hj-done .hj-dn:hover{filter:brightness(1.15)}
#hj-done .hj-dlast{margin:0;padding:14px;border-radius:16px;background:var(--bg,#FFFCF8);color:var(--soft,#5C5047);font-size:17px}
#hj-done .hj-drow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
#hj-done .hj-db{flex:1 1 200px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 17px/1.2 'Gowun Dodum',sans-serif;color:var(--ink,#2A221C);background:var(--paper,#fff);border:1.5px solid var(--line,#EFE3D6);border-radius:999px;padding:12px 16px;text-decoration:none;cursor:pointer}
#hj-done .hj-db:hover{background:var(--bg,#FFFCF8)}
#hj-done .hj-db svg{width:20px;height:20px}
#hj-done :focus-visible{outline:3px solid #E0A458;outline-offset:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #hj-done .hj-dn{background:#F2EBE3;color:#221E1A}}
:root[data-theme="dark"] #hj-done .hj-dn{background:#F2EBE3;color:#221E1A}
html body .hj-pl{display:none}
@media print{body.hj-tprint .hj-pl{display:block;text-align:center;font-size:14px!important;color:#555;margin:0 0 4px}}
/* 사진 출처 줄이 화면 밖으로 넘치지 않게 */
html body #phc{white-space:normal!important;overflow-wrap:anywhere;max-width:min(1100px,100%);text-align:center;line-height:1.6;opacity:.85}
/* 홍지희 선생님 버전(SOOP) 첫 화면: 차분하고 읽기 쉽게 */
html body #cBadge{background:color-mix(in srgb,var(--sc) 14%,var(--paper));color:color-mix(in srgb,var(--sc) 78%,var(--ink));font-weight:700;font-size:clamp(15px,1.3vw,18px);padding:5px 14px;letter-spacing:-.01em}
html body #cover:has(#cBadge) .title{font-size:clamp(30px,min(4vw,7vh),52px);line-height:1.25}
html body #cBq{border:0;border-left:5px solid color-mix(in srgb,var(--sc) 55%,var(--paper));background:color-mix(in srgb,var(--sc) 6%,var(--paper));border-radius:16px;padding:14px 22px;text-align:left;box-shadow:none}
html body #cBq>*:first-child:not(b){font-size:15px!important;font-weight:700;color:var(--soft)}
html body #cBq b{display:block;font-weight:700;font-size:clamp(20px,2vw,27px);line-height:1.4;margin-top:2px}
html body #cGoal{border:0;border-left:5px solid #E8B36A;background:#FFF6E8;color:var(--ink);border-radius:16px;padding:12px 22px;font-weight:700;font-size:clamp(18px,1.7vw,23px);text-align:left;box-shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #cGoal{background:#3A3024}}
:root[data-theme="dark"] #cGoal{background:#3A3024}
html body #cMap{gap:10px}

html body #stage .hd{font-size:clamp(28px,min(3.1vw,6.2vh),54px)!important;line-height:1.3}
html body #stage .recall{width:100%;gap:clamp(12px,1.4vw,24px)}
html body #stage .rc{min-height:clamp(180px,30vh,340px)}
html body #stage .rc .front{font-size:clamp(24px,min(2.5vw,5vh),42px)!important}
html body #stage .rc .back2{font-size:clamp(20px,min(2.05vw,4.2vh),34px)!important}
html body #stage #body>.qbox{width:min(1400px,100%);font-size:clamp(22px,min(2.2vw,4.6vh),38px)!important}
html body #stage .goal{font-size:clamp(15px,1.25vw,20px)}
html body #stage #body{margin-left:auto!important;margin-right:auto!important}
html body #stage .recall{justify-content:center;margin-left:auto;margin-right:auto}
/* 과학 앱 위 탭 줄 더 얇게, 안쪽 '이전/다음 단계'는 아래 막대로 합침 */
html:has(#ovBar) body>nav{border-bottom-width:1px!important}
html:has(#ovBar) body>nav .wrap{padding-top:6px!important;padding-bottom:6px!important;gap:5px!important;min-height:0!important}
html:has(#ovBar) body>nav a{font-size:clamp(13px,.95vw,15px)!important;padding:4px 11px!important;min-height:0!important;line-height:1.35!important}
html:has(#ovBar) body>nav .hj-nav a{min-height:32px;padding:4px 11px 4px 9px}
html.hj-merge-steps section .hj-innernav{display:none!important}
/* 과학 앱 실험 화면 배치 다듬기 */
html:has(#ovBar) body .card{justify-content:center!important;text-align:center}
html:has(#ovBar) body .vs{align-items:stretch}
html:has(#ovBar) body .vs>b{align-self:center}
html:has(#ovBar) body .lab>svg{display:block;width:min(100%,980px)!important;max-height:44vh;margin-left:auto;margin-right:auto}
html:has(#ovBar) body .lab>.row{justify-content:center}
html:has(#ovBar) body .gallery{gap:10px!important}
html:has(#ovBar) body .gallery .photo{display:grid;grid-template-columns:minmax(120px,32%) 1fr;align-items:center;margin:8px 0 0}
html:has(#ovBar) body .gallery .photo img{width:100%;height:100%;max-height:150px;object-fit:cover;aspect-ratio:auto!important}
html:has(#ovBar) body .gallery .photo figcaption{padding:8px 12px!important;font-size:clamp(14px,1.1vw,17px)!important;text-align:left}
html:has(#ovBar) body .photo{border-width:1px!important;border-color:var(--line)!important}
html:has(#ovBar) body .hj-gonext{margin-left:8px}
html:has(#ovBar) body button.hj-retry{background:var(--paper)!important;color:var(--ink)!important}
html:has(#ovBar) body span.hj-rrow{display:inline-flex;gap:8px;margin:0 0 0 auto}
html:has(#ovBar) body span.hj-rrow .hj-gonext{margin-left:0}
/* 이동 단추 묶음은 위치 표시일 뿐: 앱의 nav 꾸밈(밑줄·고정)을 받지 않게 */
html body nav.hj-nav{border:0!important;position:static!important;background:none!important;box-shadow:none!important;padding:0!important;top:auto!important}
/* ===== 화면 배치(모든 교과) ===== */
/* 과학 한 화면 보기: 좌우 여백, 제목·질문은 가운데, 설명은 왼쪽 */
html body.ov main.wrap{max-width:min(1280px,100%)!important;margin-left:auto!important;margin-right:auto!important}
html body.ov section .fitbox>.stage{display:table;margin-left:auto;margin-right:auto}
html body.ov section .fitbox>:is(h2,h3){text-align:center;text-wrap:balance}
html body.ov section .fitbox>p:not(.fb){text-align:center;text-wrap:balance}
html body.ov section :is(.row,.order,.two,.vs,.gauge){justify-content:center}
html body.ov section .fb{text-align:left}
html body.ov section .pick{max-width:1100px;margin-left:auto;margin-right:auto}
/* 사진: 사진 왼쪽 크게, 설명 오른쪽 */
html body.ov .photo{display:grid!important;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:center;max-width:1100px;margin-left:auto!important;margin-right:auto!important}
html body.ov .photo img{width:100%!important;height:auto!important;max-height:min(340px,38vh)!important;aspect-ratio:auto!important;object-fit:cover}
html body.ov .photo figcaption{padding:12px 18px!important;font-size:clamp(16px,1.3vw,20px)!important;line-height:1.55;text-align:left}
html body.ov .photo .cr{font-size:clamp(12px,.9vw,14px)!important;margin-top:6px}
html body.ov .gallery{grid-template-columns:1fr!important;max-width:1100px;margin-left:auto;margin-right:auto}
html body.ov .gallery .photo img{max-height:min(220px,26vh)!important}
html:has(#ovBar) body .gallery .photo{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
/* 국어·사회 진행 화면: 너무 넓게 퍼지지 않게 */
html body #stage #body{width:min(1240px,94vw)!important}
/* 홍지희 선생님 버전 진행 화면 */
html body #lesson .body{width:min(1360px,94vw);max-width:none;margin-left:auto;margin-right:auto}
/* 수학 앱: 가운데 정렬된 넓이 */
html body main.lesson{max-width:min(1480px,100%)!important}
html body.ov section :is(#quiz,#perf,.qz)>div>p.jua,html body.ov section p.jua{text-align:center;text-wrap:balance}
html body.ov section .pick:has(>:nth-child(3):last-child){grid-template-columns:repeat(3,minmax(0,1fr))!important}
html body.ov .photo img{max-height:min(260px,28vh)!important}
html body.ov .gallery .photo img{max-height:min(190px,22vh)!important}
html body.ov main.wrap{max-width:min(1120px,100%)!important}
/* 모든 교과 같은 본문 폭: 눈이 좌우로 너무 오가지 않게 1240px 안팎 */
html body.ov main.wrap{max-width:min(1240px,100%)!important}
html body #lesson .body{width:min(1240px,94vw)!important}
html body .hj-navbar{position:relative;z-index:60}
html body .topbar>.hj-nav{margin-right:10px}
/* 본문 폭 최종: 수학 앱의 활동 칸과 비슷한 1080~1120px. 눈이 좌우로 덜 움직이게 */
html body.ov main.wrap{max-width:min(1080px,100%)!important}
html body #stage #body{width:min(1120px,94vw)!important}
html body #lesson .body{width:min(1120px,94vw)!important}
/* 국어: 자체 확대(최대 약 1.3배)가 있으므로 바탕 폭을 좁혀, 확대 뒤에도 1150px 안팎 */
html body #stage #bodyWrap>#body{width:min(1000px,94vw)!important}
html body.ov .hj-pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:1080px;margin:10px auto 0}
html body.ov .hj-pgrid .photo{display:block!important;margin:0!important}
html body.ov .hj-pgrid .photo img{width:100%!important;max-height:min(230px,26vh)!important;object-fit:cover}
html body.ov .hj-pgrid .photo figcaption{font-size:clamp(14px,1.1vw,17px)!important}
html body.ov .photo img{max-height:min(210px,22vh)!important}
html body.ov .photo{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
/* 너무 작은 글자 막기: 출처·쪽수 같은 작은 글도 13.5px 이상 */
html body :is(#lesson,#stage,#cover) small:not(.hj-contact *){font-size:max(13.5px,.8em)!important}
html body .tool .n{font-size:13px!important;min-width:20px;height:20px;line-height:20px}
/* 진행 화면 위 줄: 단계가 많아도 도구 단추와 겹치지 않게(단계 줄만 옆으로 밀기) */
html body .screen:not(#cover) .topbar{flex-wrap:nowrap}
html body .screen:not(#cover) .topbar>:is(.steps,.stagebar){flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap!important}
html body .screen:not(#cover) .topbar>:is(.steps,.stagebar)::-webkit-scrollbar{display:none}
html body .screen:not(#cover) .topbar>:is(.steps,.stagebar)>*{flex:none}
html body .screen:not(#cover) .topbar>.tools{flex:none}
/* 진행 화면 안의 넓은 블록이 본문 폭을 넘지 않게(잘림 방지) */
html body #stage #body>*{max-width:100%!important}
html body #stage #body :is(.exp,.expq,.recall,.talk,.exs,.cmp,.grid2,.grid3){width:100%!important;max-width:100%!important}
html body #lesson .cols{grid-template-columns:repeat(var(--n,3),minmax(0,1fr))!important}
html body #lesson .col{min-width:0}
html body #lesson .col :is(input,textarea){min-width:0;width:100%}
html body #lesson .col .row,html body #lesson .col form{display:flex;gap:6px;min-width:0}
html body #lesson .body{max-width:100%}
html body .wg>h2{white-space:nowrap!important;flex-wrap:nowrap!important;text-wrap:nowrap!important}
html body .wg>h2 .ed{flex:none;font-size:.88rem!important;padding:.2rem .65rem!important;min-height:1.9rem}
/* ===== 폰·패드 세로 화면 ===== */
@media (max-width:820px){
 html body .screen:not(#cover) .topbar{flex-wrap:wrap!important;row-gap:6px}
 html body .screen:not(#cover) .topbar>:is(.steps,.stagebar){flex:1 1 100%;order:2}
 html body .screen:not(#cover) .topbar>.tools{flex:1 1 100%;order:1;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px}
 html body .screen.on>.topbar>.hj-nav{order:0}
 html body header.top{flex-wrap:wrap!important;row-gap:6px;height:auto!important}
 html body header.top .brand{min-width:0;flex:1 1 auto;white-space:normal}
 html body header.top .brand .long{display:none!important}
 html body header.top>.hj-nav{flex:1 1 100%}
 html body .tools{flex-wrap:wrap}
 html body :is(h1,h2,h3,.title,.hd,.ask,.qbox,.lead,p,li,b,span,button,a,td,th,label,small){word-break:keep-all;overflow-wrap:break-word}
}
@media (max-width:480px){
 html body #cover .title,html body #hj-scover .hj-sc-title{font-size:clamp(24px,7vw,32px)!important}
 html body #stage .hd,html body .screen .hd{font-size:clamp(21px,6vw,28px)!important}
 html body .hj-nav a span{font-size:13.5px}
 html body .hj-cvtools .hj-tool2{padding:6px 10px!important}
}
html body .bv i{font-size:max(13px,1em)}
@media (max-width:480px){html body #stage .rc{min-height:150px!important}html body #stage .rc .front img{max-height:90px;object-fit:cover}}
@media (max-width:600px){
 html body .labgrid,html body .lab2,html body .two{grid-template-columns:1fr!important}
 html body .pick{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))!important}
 html body.ov .photo,html:has(#ovBar) body .gallery .photo{grid-template-columns:1fr!important}
 html body.ov .hj-pgrid,html body .gallery{grid-template-columns:1fr!important}
 html body .vs{grid-template-columns:1fr!important}
 html body .vs>b{justify-self:center}
}
@media (max-width:600px){
 html body.ov .gal,html body .card2-wrap{grid-template-columns:1fr!important}
 html body.ov .card2 .pick,html body.ov section .pick.one{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))!important}
}
html body .hj-field>.hj-multi{grid-auto-flow:row!important}
html body .hj-field>.hj-multi .st,html body .hj-field .hj-multi>button{border-top:1px solid var(--line)!important}
html body .hj-field>.hj-multi .st:nth-child(-n+20){border-left:1px solid var(--line)!important}
@media (max-width:900px){html body.ov .gallery,html body.ov .hj-pgrid{grid-template-columns:1fr!important}}
/* 단계 줄이 넘치면 오른쪽 끝을 흐리게: 옆으로 밀어 더 볼 수 있다는 표시 */
html body .screen:not(#cover) .topbar>:is(.steps,.stagebar).hj-ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
html body .card2 .pick{grid-template-columns:repeat(auto-fill,minmax(124px,1fr))!important}
html body .card2 .pick button{padding:.4em .5em!important}
@media (max-width:600px){html body #lesson .cols{grid-template-columns:1fr!important}html body #lesson .col{min-height:0!important}}
html body .wg>h2 .ed{margin-left:auto!important;white-space:nowrap}
html body .wg>h2{min-width:0;overflow:hidden}
/* ===== 메뉴 단추 크기 통일(모든 교과) ===== */
/* 이동 단추 [홈·자료 목록] */
html body .hj-nav a{min-height:36px!important;font-size:clamp(14.5px,1.05vw,16px)!important}
/* 과학 아래 막대: 국어·사회 아래 단추와 같은 크기 */
html:has(#ovBar) #ovBar button{font-size:clamp(15px,1.15vw,17px)!important;min-height:40px!important;padding:7px 15px!important}
html:has(#ovBar) #ovBar .pos{font-size:clamp(15px,1.15vw,17px)!important}
/* 홍지희 버전은 화면 전체를 키우므로(zoom) 단추만 원래 크기로 */
html body #lesson .topbar .tool{font-size:calc(15.5px / var(--hjz,1))!important;min-height:calc(34px / var(--hjz,1))!important;padding:calc(5px / var(--hjz,1)) calc(10px / var(--hjz,1))!important}
html body #lesson .foot :is(.tnote,.ghost,#prev){font-size:calc(16px / var(--hjz,1))!important;min-height:calc(38px / var(--hjz,1))!important;padding:calc(7px / var(--hjz,1)) calc(14px / var(--hjz,1))!important}
html body #lesson .foot #next{font-size:calc(19px / var(--hjz,1))!important;min-height:calc(42px / var(--hjz,1))!important;padding:calc(8px / var(--hjz,1)) calc(20px / var(--hjz,1))!important}
/* 수학 앱: 확인하기·다음 계단은 알맞은 크기로 */
html body main.lesson .big{font-size:clamp(18px,1.35vw,22px)!important;padding:.5em 1.5em!important;width:auto!important;min-width:0!important;box-shadow:0 3px 0 rgba(0,0,0,.15)!important}
html body main.lesson .side>.big{align-self:flex-end}
html body main.lesson .stair{font-size:clamp(16px,1.2vw,19px)!important;min-height:48px;padding-top:6px!important;padding-bottom:6px!important}
/* 우리 반 교실: '자세히'가 칸 밖으로 나가지 않게 */
html body .wg>h2{font-size:clamp(.98rem,1.05vw,1.15rem)!important;gap:.3rem!important}
html body .wg>h2 .ed{font-size:.82rem!important;padding:.15rem .5rem!important;min-height:1.75rem!important}
/* hidden으로 숨긴 것은 정말 숨기기(돋보기 결과가 처음부터 보이던 문제) */
html body [hidden]{display:none!important}
html body #zoom:not([hidden]),html body .zoom:not([hidden]){animation:hjzoom .45s cubic-bezier(.2,.8,.3,1.2)}
@keyframes hjzoom{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
/* 과학 한 화면 보기: 내용이 길면 칸이 늘어나고, 아래 막대가 내용을 가리지 않게 */
html body.ov main section.cur{height:auto!important;overflow:visible!important}
html body.ov{padding-bottom:calc(var(--hjbar,76px) + 28px)!important}
html body.ov main.wrap{padding-bottom:calc(var(--hjbar,76px) + 12px)!important}
/* 과학: 문제(질문)는 왼쪽 정렬 */
html body.ov section :is(#quiz,#perf,.qz)>div>p.jua,html body.ov section p.jua,html body.ov section #clue,
html body.ov section:has(#quiz,#perf,.qz) .fitbox>h3{text-align:left!important;text-wrap:pretty}
/* 사진 두 장이 한 칸에만 몰리던 것: 줄 전체를 쓰고 사진을 크게 */
html body .two>.hj-pgrid:only-child{grid-column:1/-1}
html body.ov .hj-pgrid .photo img{max-height:min(380px,44vh)!important;aspect-ratio:4/3!important}
@media (max-width:900px){html body.ov .hj-pgrid .photo img{max-height:none!important}}

/* 과학 '한 화면 보기' 앱: 크롬북처럼 낮은 가로 화면에서 여백만 줄여 한 화면에 더 담기 (글자 크기는 그대로, 2026-10-02) */
@media (orientation:landscape) and (max-height:760px){
 html:has(#ovBar) body.ov main{padding-top:0!important}
 html:has(#ovBar) body.ov main>section.cur{margin-top:4px!important;padding-top:8px!important;padding-bottom:8px!important}
 html:has(#ovBar) body.ov section.cur .stage{margin-bottom:2px!important;padding-top:1px!important;padding-bottom:1px!important}
 html:has(#ovBar) body.ov section.cur h2{margin-top:2px!important;margin-bottom:6px!important}
 html:has(#ovBar) body.ov section.cur h3{margin-top:8px!important;margin-bottom:6px!important}
 html:has(#ovBar) body.ov section.cur .fitbox>p{margin-top:4px!important;margin-bottom:8px!important}
 html:has(#ovBar) body.ov section.cur .lab{margin-top:8px!important;margin-bottom:8px!important}
 html:has(#ovBar) body.ov section.cur .tip,html:has(#ovBar) body.ov section.cur .fb{margin-top:6px!important}
 html:has(#ovBar) body.ov #ovBar{margin-top:4px!important;padding-top:4px!important;padding-bottom:4px!important}
}
/* 과학 앱 사진 모음(3장 이상): 낮은 가로 화면에서는 세 칸 카드로 */
@media (orientation:landscape) and (max-height:760px) and (min-width:1000px){
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3)){grid-template-columns:repeat(3,minmax(0,1fr))!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3))>.photo{grid-template-columns:1fr!important;align-items:start;margin:0!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3))>.photo img{height:auto;max-height:min(150px,21vh)!important;aspect-ratio:3/2!important}
}
/* 과학: 재료 고르기 탭(나무 막대·물 등)은 가운데 정렬 */
html body.ov section .tabs{justify-content:center}
/* 갤럭시탭 같은 세로 태블릿(가로 600~900px): 사진을 두 칸으로 놓아 한 화면에 담기 (2026-10-02) */
@media (min-width:600px) and (max-width:900px) and (orientation:portrait){
 html:has(#ovBar) body.ov .hj-pgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
 html:has(#ovBar) body.ov .hj-pgrid .photo img{max-height:min(320px,26vh)!important;aspect-ratio:4/3!important;object-fit:cover}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3)){grid-template-columns:repeat(2,minmax(0,1fr))!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3))>.photo{grid-template-columns:1fr!important;align-items:start;margin:0!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(3))>.photo img{height:auto;max-height:min(180px,15vh)!important;aspect-ratio:3/2!important}
 html:has(#ovBar) body.ov section.cur figure.photo:not(.hj-pgrid *):not(.gallery *):not(.gal *) img{max-height:min(280px,22vh)!important;object-fit:cover;width:auto!important;max-width:100%;margin-left:auto;margin-right:auto;display:block}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(7)){grid-template-columns:repeat(3,minmax(0,1fr))!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(7))>.photo img{max-height:min(130px,11vh)!important}
 html:has(#ovBar) body.ov .lab>svg{max-height:24vh!important}
}
/* 크롬북처럼 낮은 가로 화면: 사진 많은 모음은 네 칸, 따로 놓인 사진은 낮게 (2026-10-02) */
@media (orientation:landscape) and (max-height:760px) and (min-width:1000px){
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(7)){grid-template-columns:repeat(4,minmax(0,1fr))!important}
 html:has(#ovBar) body.ov .gallery:has(>.photo:nth-child(7))>.photo img{max-height:min(110px,15vh)!important}
 html:has(#ovBar) body.ov section.cur figure.photo:not(.hj-pgrid *):not(.gallery *):not(.gal *) img{max-height:min(200px,27vh)!important;object-fit:cover}
 html:has(#ovBar) body.ov .lab>svg{max-height:34vh!important}
}
/* ===== 과목 색 (2026-10-02): 다음·주요 단추, 지금 단계, 고른 것, 활동 이름표, 학습 문제 상자 =====
   html[data-hjsubj]는 content.js가 주소(/korean/ /math/ /social/ /science/)를 보고 붙인다 */
html[data-hjsubj="korean"]{--hjs:#C9463B}
html[data-hjsubj="math"]{--hjs:#B4610F}
html[data-hjsubj="social"]{--hjs:#2B6FB8}
html[data-hjsubj="science"]{--hjs:#1F8060}
html[data-hjsubj]{--hjs-soft:color-mix(in srgb,var(--hjs) 14%,#fff)}
html[data-hjsubj]:not(#hjz):not(#hjz) body #ovBar #ovNext#ovNext,html[data-hjsubj]:not(#hjz):not(#hjz) body button.main.main,html[data-hjsubj]:not(#hjz):not(#hjz) body button[id^=btnNext][id^=btnNext],
html[data-hjsubj]:not(#hjz):not(#hjz) body #btnGo#btnGo,html[data-hjsubj]:not(#hjz):not(#hjz) body .hj-sc-go.hj-sc-go,html[data-hjsubj]:not(#hjz):not(#hjz) body #hjEnd#hjEnd,
html[data-hjsubj]:not(#hjz):not(#hjz) body #lesson .foot #next#next,html[data-hjsubj]:not(#hjz):not(#hjz) body #cover .big-btn.big-btn,html[data-hjsubj]:not(#hjz):not(#hjz) body .big-btn.big-btn:not(.ghost){background:var(--hjs)!important;color:#fff!important;border-color:transparent!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body :is(button.main,#ovNext,#hjEnd,.big-btn,[id^=btnNext],#next):disabled{background:color-mix(in srgb,var(--hjs) 35%,#fff)!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body nav a[style*="outline"]{outline:none!important;background:var(--hjs-soft)!important;color:var(--hjs)!important;box-shadow:inset 0 0 0 2px var(--hjs)!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body .st.now.now{background:var(--hjs)!important;color:#fff!important;border-color:transparent!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body .seg button[aria-pressed="true"][aria-pressed="true"]{background:var(--hjs)!important;color:#fff!important;border-color:transparent!important}
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body button.on.on:not(.right):not(.wrong),html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body button.sel.sel:not(.right):not(.wrong){background:var(--hjs-soft)!important;border-color:var(--hjs)!important;color:var(--hjs)!important}
html[data-hjsubj]:not(#hjz):not(#hjz):has(#ovBar) body .stage.stage.stage{background:var(--hjs-soft)!important;color:var(--hjs)!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body :is(#cover .qbox,#cover .bq,#cover .goalbox,#hj-scover .hj-sc-goal){background:var(--hjs-soft)!important;border-left-color:var(--hjs)!important}
html[data-hjsubj]:not(#hjz):not(#hjz) body main.lesson .big:not(:disabled){background:var(--hjs)!important;color:#fff!important;border-color:transparent!important}
/* 자료 출처 한 줄 */
html body .hj-src{font-size:13.5px!important;line-height:1.5;color:var(--muted);text-align:center;margin:10px auto 0;max-width:60em;word-break:keep-all}
/* 과학 한 화면 보기: 글의 위계 — 이름표·제목 한 줄, 활동 제목 크게, 안내 글 작게, 할 일 문장은 크게 */
html body.ov section .hj-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 12px;margin:0 0 6px}
html body.ov section .hj-head>.stage{display:inline-block!important;margin:0!important}
html body.ov section .hj-head>h2{margin:0!important}
html body.ov section .fitbox:has(> h3:not(.ovhide)) .hj-head>h2{font-size:clamp(17px,1.35vw,20px)!important;color:var(--soft)!important;font-weight:700!important}
html body.ov section .fitbox>h3{font-size:clamp(22px,1.9vw,28px)!important;font-weight:800!important;color:var(--ink)!important;margin:6px 0 4px!important}
html body.ov section .fitbox>p.hj-guide{font-size:clamp(16px,1.25vw,19px)!important;line-height:1.6;color:var(--soft)!important;max-width:52em;margin:2px auto 6px!important}
html body.ov section .fitbox>p.hj-guide b{color:var(--ink)}
html body.ov section .fitbox>p.hj-task{font-size:clamp(19px,1.6vw,24px)!important;font-weight:700!important;line-height:1.5;color:var(--ink)!important;text-align:left!important;
 background:var(--hjs-soft,#F3EEE6);border-left:6px solid var(--hjs,#8a7a66);border-radius:12px;padding:10px 16px!important;margin:6px 0 10px!important;text-wrap:pretty}
html body.ov section .fitbox>p.hj-task b{color:var(--hjs,var(--ink))}
/* 스스로 평가 표: 얼굴 칸은 좁게, 글 칸은 넓게 */
html body.ov section table td:has(> button){width:1%;white-space:nowrap}
/* 문제 보기(모든 교과): ①②③④ 번호, 보기가 모두 짧으면 가운데 정렬 / 문장이면 왼쪽 정렬 (content.js가 hj-short·hj-long을 붙임) */
@counter-style hjcirc{system:fixed;symbols:'①' '②' '③' '④' '⑤' '⑥' '⑦' '⑧' '⑨' '⑩';suffix:' '}
html body .hj-optg{counter-reset:hjo}
html body .hj-optg>button{counter-increment:hjo;display:flex!important;align-items:center;gap:.45em}
html body .hj-optg>button::before{content:counter(hjo,hjcirc);font-weight:800;color:var(--hjs,var(--ink));flex:none}
html body .hj-optg.hj-long>button{text-align:left!important;justify-content:flex-start!important;align-items:baseline!important;padding-left:18px!important;padding-right:16px!important}
html body .hj-optg.hj-short>button{text-align:center!important;justify-content:center!important}

/* 홍지희 버전: 활동 이름표 + 질문 제목 한 줄 */
html body #lesson .hj-head2{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 14px;margin:0 auto}
html body #lesson .hj-head2>.sthead{margin:0!important;flex:none}
html body #lesson .hj-head2>#hd{margin:0!important}
/* 홍지희 버전 첫 화면: 주제 프로젝트 지도 이름표, 오늘 표시 */
html body .hj-maplab{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:12px 0 6px;font-size:15px;color:var(--soft)}
html body .hj-maplab b{font-size:16.5px;color:var(--ink)}
html body .hj-maplab em{font-style:normal;font-weight:800;color:var(--hjs,var(--ink))}
html body #cMap .cur .hj-today{font-style:normal;display:inline-block;font-size:12.5px;font-weight:800;color:#fff;background:var(--hjs,#555);border-radius:999px;padding:1px 8px;margin-right:6px;vertical-align:1px}
/* 과학 앱 메뉴 자리 통일 (국어·사회와 같게) */
html.hj-scmenu body>nav .wrap{max-width:none!important;display:flex!important;align-items:center;gap:8px;flex-wrap:nowrap}
html.hj-scmenu body>nav .hj-sctools{margin-left:auto;display:flex;gap:6px;flex:none;padding-left:8px}
html.hj-scmenu body>nav .hj-sctools button{font-size:clamp(13.5px,1vw,15px)!important;min-height:34px!important;padding:5px 11px!important;border-radius:999px!important;background:var(--paper)!important;color:var(--ink)!important;border:1px solid var(--line)!important;white-space:nowrap}
html.hj-scmenu:has(#ovBar) #ovBar{position:fixed!important;left:0!important;right:0!important;bottom:0!important;width:auto!important;max-width:none!important;margin:0!important;transform:none!important;
 display:grid!important;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 22px 14px!important;background:linear-gradient(to top,var(--bg) 70%,transparent)!important;border:0!important;box-shadow:none!important;border-radius:0!important;pointer-events:none}
html.hj-scmenu #ovBar>*{pointer-events:auto}
html.hj-scmenu #ovBar #ovPos{grid-column:2;font-size:14px!important;color:var(--soft)}
html.hj-scmenu #ovBar .hj-pn{grid-column:3;justify-self:end;display:flex;gap:8px}
html.hj-scmenu #ovBar .hj-pn button{min-height:42px!important;font-size:clamp(15px,1.15vw,17px)!important;padding:8px 18px!important;border-radius:999px!important}
@media (max-width:820px){html.hj-scmenu body>nav .hj-sctools{position:fixed;left:10px;bottom:14px;z-index:30;padding:0;gap:4px}html.hj-scmenu body>nav .hj-sctools button{font-size:0!important;padding:8px 10px!important;min-height:40px!important}html.hj-scmenu body>nav .hj-sctools button .hj-i{width:18px;height:18px;margin:0}}
/* 번호 붙은 줄 내어쓰기 */
html body .hj-hang{display:flex!important;align-items:flex-start;gap:.35em}
html body .hj-hang>input{flex:none;margin-top:.15em}
html body .hj-hang>.hj-cn{flex:none;font-weight:700}
html body .hj-hang>.hj-ct{flex:1 1 auto;min-width:0}
html body .hj-hang .hj-paren{display:block;font-size:.92em;color:var(--soft)}
html body .hd>small.hj-sub2{display:block;margin-top:4px}
/* 사이트 '홈': 채운 집 모양 + 과목 색으로 눈에 띄게 (차시 처음 단추와 구분) */
html body .hj-nav a.hj-nh{background:var(--hjs,#2A221C)!important;color:#fff!important;border-color:transparent!important}
html body .hj-nav a.hj-nh svg path{fill:currentColor;fill-opacity:.25}
/* 홍지희 버전: 위 메뉴줄과 본문 사이 여유 */
html body #lesson .topbar{margin-bottom:16px!important}
/* 홍지희 버전: 활동 내용이 아래로 처지지 않게 위쪽(질문 바로 아래)에 붙이고, 남는 공간은 아래로 */
html body #lesson .body{justify-content:flex-start!important}
html body #lesson .body>:first-child{margin-top:clamp(8px,3vh,36px)!important}
html body a.hj-homemini{display:inline-flex!important;align-items:center;gap:5px;text-decoration:none!important;background:var(--hjs,#2A221C)!important;color:#fff!important;border:0!important;border-radius:999px;padding:5px 12px!important;min-height:34px;font:700 clamp(13.5px,1vw,15px)/1 Pretendard,sans-serif!important;white-space:nowrap}
html body a.hj-homemini .hj-i{width:16px;height:16px}
/* 보기에 긴 문장이 있으면 한 줄에 하나씩(가운데 폭에 맞춰) 보여 읽기 쉽게 */

/* 홍지희 버전 자료 카드: 제목 칸 · 가운데 사진 · 설명 · 출처 */
html body .mini .m.hj-v{flex-direction:column!important;align-items:stretch!important;gap:6px!important;padding:0 0 8px!important;overflow:hidden;text-align:center}
html body .mini .m.hj-v .hj-mh{background:color-mix(in srgb,var(--hjs,#888) 10%,var(--paper,#fff));border-bottom:2px solid color-mix(in srgb,var(--hjs,#888) 22%,var(--paper,#fff));padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
html body .mini .m.hj-v .hj-mh b{display:inline!important;font-size:clamp(15px,calc(var(--vw,1vw)*1.35),20px)!important}
html body .mini .m.hj-v .hj-mp{display:flex;justify-content:center;align-items:center;padding:2px 10px 0}
html body .mini .m.hj-v .hj-mp img{width:100%!important;height:clamp(84px,calc(var(--vh,1vh)*15),160px)!important;object-fit:cover;border-radius:10px}
html body .mini .m.hj-v .hj-mp .e{font-size:clamp(48px,calc(var(--vh,1vh)*9),84px)!important;width:auto!important;display:block!important;line-height:1.15}
html body .mini .m.hj-v .d{padding:0 10px;line-height:1.4}
html body :is(#lesson,#stage,#cover,main,body) .mini .m.hj-v small.hj-msrc{display:block;padding:0 10px;font-size:12.5px!important;line-height:1.3;color:var(--muted,var(--soft))}
html body .mini:has(.hj-v){grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))!important}
/* ===== 모든 교과 공통: 분류 카드(.card1)·분류 단추(.bins)·피드백(.fb) 너비와 색 통일 (2026-10-03) ===== */
html body .deck{width:min(1100px,94vw)!important;margin-left:auto;margin-right:auto;display:flex;flex-direction:column;align-items:stretch;gap:12px}
html body .deck>.card1,html body .deck>.bins,html body .deck>.fb{width:100%!important;max-width:none!important;box-sizing:border-box;margin-left:0!important;margin-right:0!important}
html body .card1,html body .bins{width:min(1100px,94vw)!important;box-sizing:border-box}
html body .deck>.ask{margin:0;text-align:center}
/* 분류 단추: 원색을 톤 다운, 모서리·그림자 통일 */
html body .bin{background:color-mix(in srgb,var(--cc,#888) 72%,#6d655d)!important;color:#fff!important;border:0!important;border-radius:18px!important;box-shadow:0 4px 0 color-mix(in srgb,var(--cc,#888) 55%,#3d3631)!important}
/* 분류 단추 이름은 가로·세로 모두 가운데 (2026-10-09, bin 가운데) */
html body .bin{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important}
html body .bin:hover:not(:disabled){filter:brightness(1.05)}
html body .bin:disabled{opacity:.55;box-shadow:none!important;transform:translateY(3px)}
html body .bin.lit{opacity:1!important;outline:4px solid color-mix(in srgb,var(--cc,#888) 40%,#fff);outline-offset:2px}
/* 국어 기억 카드 앞면도 같은 톤 */
html body .rc .front{background:color-mix(in srgb,var(--cc,#888) 72%,#6d655d)!important}
/* 피드백 띠: 카드와 같은 흰 바탕 + 왼쪽 색 줄 + 오른쪽 '다음' 단추 */
html body .fb.on{display:flex!important;align-items:center;gap:10px 14px;flex-wrap:wrap;background:var(--paper,#fff)!important;border:2px solid var(--line,#e8dccb)!important;border-left:8px solid var(--ok,#1F9E63)!important;border-radius:16px!important;padding:12px 16px 12px 18px!important;box-shadow:0 1px 2px rgba(80,55,30,.05),0 12px 26px -20px rgba(80,55,30,.35);font-size:clamp(17px,1.6vw,22px);line-height:1.5;text-align:left;color:var(--ink)}
html body .fb.on.no{border-left-color:var(--no,#D64C5A)!important}
html body .fb.on.open{border-left-color:#C9862A!important}
html body .fb.on b{color:var(--ok,#1F9E63)}html body .fb.on.no b{color:var(--no,#D64C5A)}html body .fb.on.open b{color:#B07020}
html body .fb.on #nx,html body .fb.on button{margin-left:auto!important;background:var(--hjs,#555)!important;color:#fff!important;border:0!important;border-radius:999px!important;padding:8px 20px!important;font-weight:800!important;font-size:clamp(16px,1.5vw,20px)!important;box-shadow:0 3px 0 color-mix(in srgb,var(--hjs,#555) 60%,#000)!important;white-space:nowrap}
/* ===== 수학: 머리줄을 밝게(오른쪽 위 글자가 보이게), 계단 이동 단추 한 줄 (2026-10-03) ===== */
html[data-hjsubj="math"] body header.top{background:color-mix(in srgb,#B4610F 7%,#FFFBF4)!important;color:#3A2E25!important;border-bottom:2px solid color-mix(in srgb,#B4610F 22%,#FFFBF4)!important;box-shadow:none!important}
html[data-hjsubj="math"] body header.top .brand,html[data-hjsubj="math"] body header.top .who{color:#3A2E25!important}
html[data-hjsubj="math"] body header.top .chip{background:#fff!important;color:#3A2E25!important;border:1.5px solid color-mix(in srgb,#B4610F 25%,#e8dccb)!important;font-weight:700}
html[data-hjsubj="math"] body header.top .chip.btn:hover{background:color-mix(in srgb,#B4610F 8%,#fff)!important}
html[data-hjsubj="math"] body header.top .hj-nav .hj-lbtn{color:#3A2E25!important;background:#fff!important;border-color:color-mix(in srgb,#B4610F 25%,#e8dccb)!important}
html body main .actions:has(.hj-nextst){display:flex!important;flex-wrap:wrap;align-items:center;gap:.6em}
html body main .actions:has(.hj-nextst)>*{order:5}
html body main .actions:has(.hj-nextst)>button.big:not(.hj-prevst):not(.hj-nextst){order:1}
html body main.lesson .actions:has(.hj-nextst)>button.big.hj-prevst,html body main .actions:has(.hj-nextst)>.hj-prevst{order:2;margin-left:auto!important;background:#fff!important;color:#3A2E25!important;border:2px solid var(--line,#e8dccb)!important;box-shadow:none!important}
html body main .actions:has(.hj-nextst)>.hj-nextst{order:3}
html body main .actions:has(.hj-nextst)>.hj-prevst::before{content:'← ';}
html body main .actions:has(.hj-nextst)>.hj-nextst::after{content:' →';}
/* 단계 표시 통일: 동그라미 번호 + 지금 단계만 이름 */
html body .screen:not(#cover) .topbar .st[data-hjst]:not(.now) .hj-stt{display:none}
html body .screen:not(#cover) .topbar .st[data-hjst]:not(.now){padding-left:9px!important;padding-right:9px!important;min-width:32px}
html body .st[data-hjst] .hj-stt,html body .hj-sttabs>a[data-hjst] .hj-stt{margin-left:.35em}
html body .hj-sttabs>a[data-hjst]:not(.hj-cur) .hj-stt{display:none}
html body .hj-sttabs>a[data-hjst]{min-width:30px;text-align:center}
html body .hj-sttabs>a[data-hjst].hj-cur{background:var(--hjs,#1F8060)!important;color:#fff!important;outline:0!important;border-color:transparent!important;font-weight:700}
/* 수업 진행 화면에서는 이메일·유튜브 줄을 숨김(첫 화면에만) — 과학 앱 한 화면 보기 */
html body.ov>.hj-contact,html body.ov>p.made,html body.ov>.made{display:none!important}

/* 2026-10-03 선생님 요청: 수업 앱(첫 화면·진행 화면)에는 이메일·유튜브 줄을 숨김. 메뉴 페이지(첫 화면~학기 목록)에는 그대로 보임(메뉴는 이 덮개를 쓰지 않음). 우리 반 교실(class)은 제외 */

 두 차시는 4단원 <b>O(개념 구축하기)<\/b>입니다. 배추흰나비가 자라는 순서와 단계별 특징(한눈에 쏙)을 먼저 알려 주지 않고, <b>예상(알은 어떻게 달라질까?) → 단계별 관찰 기록(관찰 일지) → 예상과 결과 비교<\/b>를 거쳐 <b>우리 반 결론<\/b>을 만든 뒤 「과학」 90~93쪽 문장과 견줍니다.<\/li><li>관찰은 약 한 달에 걸쳐 이루어집니다(지도서 346쪽). 화면의 두 ‘관찰하고 기록하기’ 단계는 한 번에 끝내지 말고, 알·애벌레가 있을 때(전개 1)와 번데기·어른벌레가 있을 때(전개 2)에 나누어 쓰거나, 수업 밖 관찰 기록을 모아 정리하는 시간으로 쓰세요. 직접 보기 어려운 장면(알에서 애벌레가 나오는 모습, 날개돋이)은 영상이나 교과서 버전 앱으로 봅니다.<\/li><li>개념 구축 사고 루틴: <b>⚖️ 같은 점·다른 점<\/b>으로 알과 애벌레를 견주고(「과학」 91쪽 정리해요), <b>🗂️ 어느 단계일까?<\/b>로 네 단계의 생김새·움직임을 정리합니다(「과학」 93쪽 정리해요).<\/li><li>차시 목표, 교과서 관찰 활동(관찰해요 1~3, 정리해요), 한눈에 쏙, 형성 평가, 과정 중심 평가(수행 평가 활동지)는 그대로입니다.<\/li><li>흐름(80분): 사진 보기 5분 → 예상하기 5분 → 알·애벌레 관찰 16분 → 같은 점·다른 점 6분 → 번데기·어른벌레 관찰 16분 → 예상과 결과 비교 7분 → 어느 단계일까? 8분 → 우리 반 결론 7분 → 개념 확인 5분 → 오늘의 질문 5분 (지도서: 도입 5분·전개 65분·정리 10분)<\/li><li>「과학」 90~93쪽 · 「실험관찰」 54~57쪽 · 지도서 346~357쪽<\/li><\/ul><h3>학습 목표 (지도서 346쪽)<\/h3><ul><li>배추흰나비의 한살이를 관찰하고 글과 그림으로 표현할 수 있다.<\/li><li>배추흰나비알, 애벌레, 번데기, 어른벌레의 특징을 설명할 수 있다.<\/li><\/ul><h3>준비물 (지도서 346쪽)<\/h3><ul><li>알·애벌레 관찰: 모둠별 배추흰나비알, 배추흰나비 애벌레, 스마트 기기 / 개인별 돋보기, 자, 그림 도구<\/li><li>번데기·어른벌레 관찰: 모둠별 배추흰나비 번데기, 배추흰나비 어른벌레, 스마트 기기 / 개인별 돋보기, 자, 그림 도구<\/li><li>수업 전에 알이 잎에 붙어 있는지 확인하고, 이미 부화했거나 없는 경우 사진과 영상을 활용한다. 애벌레가 먹이를 먹지 않는 시기가 오면 나뭇가지처럼 몸을 고정할 수 있는 도구를 꽂아 주어 번데기를 쉽게 관찰할 수 있게 한다.<\/li><\/ul><h3>지도상의 유의점 (지도서 346~347쪽)<\/h3><ul><li>배추흰나비 한살이 관찰은 약 한 달에 걸쳐 이루어지므로 융통성 있게 수업 시간을 재구성하여 운영한다.<\/li><li>배추흰나비알에서 애벌레가 나오는 모습, 허물을 벗는 모습, 번데기가 되는 모습, 번데기에서 어른벌레가 나오는 모습 등은 관찰하기 쉽지 않으므로 관련 영상을 미리 준비해 활용한다.<\/li><li>번데기가 먹이를 먹거나 이동하지 않을 뿐, 가끔 제자리에서 꿈틀거리는 모습을 볼 수 있으므로 번데기가 죽은 상태가 아님을 안내한다.<\/li><li>꿀물에 적신 스펀지 또는 얇게 자른 오렌지를 어른벌레의 먹이로 제공하면 조금 더 시간을 두고 관찰할 수 있다. 관찰이 끝난 뒤 어른벌레는 자연으로 돌려보내 생명을 아끼고 존중하는 자세를 갖도록 한다.<\/li><li>안전: 배추흰나비알, 애벌레, 번데기, 어른벌레를 손으로 만지지 않도록 지도한다.<\/li><\/ul><h3>차시 평가 (지도서 350쪽)<\/h3><ul><li>평가 목표: 배추흰나비의 한살이를 관찰하여 글과 그림으로 표현할 수 있다. · 평가 방법: 관찰 평가, 실험·실습 평가, 포트폴리오 평가<\/li><li>지식·이해 상: 알, 애벌레, 번데기, 어른벌레의 특징을 설명할 수 있다. / 중: 일부만 설명할 수 있다. / 하: 설명하기 어려워한다.<\/li><li>과정·기능 상: 한살이를 관찰하고 글과 그림으로 자세히 표현할 수 있다. / 중: 표현할 수 있다. / 하: 표현하는 것을 어려워한다.<\/li><li>가치·태도 상: 배추흰나비 기르기에 흥미를 가지고 즐겁게 참여했다.<\/li><li>피드백: 어려워하는 학생은 관찰의 주안점을 다시 짚어 주고 「과학」 90~93쪽과 배추흰나비 영상을 보며 글과 그림을 보완하게 합니다.<\/li><\/ul><h3>과정 중심 평가 (지도서 356~357쪽 수행 평가 활동지)<\/h3><p>① 사진 (가)~(라)를 단계에 맞게 쓰고 순서대로 나열하기(알-애벌레-번데기-어른벌레), ② (가) 알에 대한 설명 두 가지 고르기(움직이지 않는다, 길쭉하고 주름진 옥수수 모양이다), ③ 애벌레·번데기 비교 표에서 옳지 않은 것 고쳐 쓰기(㉣ → 번데기는 한곳에 붙어 이동하지 않는다). 평가상의 유의점: 한살이 단계를 순서대로 알고 있는지 확인하고, 단계별 특징을 비교하여 설명할 수 있는지에 주안점을 둔다. 9단계 ‘개념 확인’에 ①과 형성 평가를 넣었습니다.<\/p><h3>성취기준<\/h3><p>[4과04-01] 동물의 한살이를 직접 관찰하고, 관찰한 내용을 글과 그림으로 표현할 수 있다.<\/p><h3>단원 지도상의 유의점 (지도서 332쪽)<\/h3><ul><li>배추흰나비의 한살이 관찰에는 시간이 많이 소요되므로 학습이 시작되기 전에 배추흰나비알을 미리 채집하거나 준비하도록 한다.<\/li><li>동물의 한살이 관찰을 통해 동물에 관한 관심과 호기심을 증대시키는 것도 중요한 목표이므로 동물을 직접 관찰하는 활동을 권장하며, 보조 학습 자료로 영상이나 누리망을 활용할 수 있다.<\/li><li>배추흰나비의 한살이 수업은 배추흰나비 한살이 정도에 맞추어 융통성 있게 수업 시간을 재구성할 수 있으며, 수업 외 시간에도 배추흰나비를 꾸준히 관찰하도록 지도한다.<\/li><li>생명의 소중함을 알고 배추흰나비알, 애벌레, 번데기, 어른벌레를 함부로 다루지 않도록 지도한다.<\/li><li>씨가 싹 트는 데 필요한 조건은 물과 온도로 한정하고, 식물이 자라는 데 필요한 조건은 물과 햇빛으로 한정한다.<\/li><li>생물의 범위는 동물과 식물로 한정하여 다룬다. 식물의 한살이 유형은 한해살이와 여러해살이로 구분하며, 두해살이식물은 여러해살이식물에 포함하여 지도한다.<\/li><\/ul><h3>이 버전에서 함께 지키는 것<\/h3><ul><li>동물의 계통을 나타내는 용어는 쓰지 않고(지도서 382쪽), 지도서에 없는 용어도 쓰지 않습니다. 동물은 ‘알을 낳는 동물’, ‘새끼를 낳는 동물’로만 나눕니다.<\/li><li>번데기는 ‘움직임이 없다’가 아니라 ‘이동하지 않는다’고 말합니다(지도서 349쪽).<\/li><li>배추흰나비는 손으로 만지지 않고, 관찰 뒤에는 손을 씻으며, 어른벌레는 관찰한 뒤 자연으로 보냅니다(지도서 341, 347, 349쪽).<\/li><\/ul>", "steps": [{"k": "see", "t": "사진 보기", "min": 5, "hd": "배추흰나비 애벌레는 무슨 색깔일까요?", "ask": "두 애벌레 사진을 견주어 보고, 👀 보여요 · 💭 생각해요 · ❓ 궁금해요 칸에 한 가지씩 써서 붙여요.", "items": [{"p": "newborn", "cap": "사진 ①", "sub": "알에서 갓 나온 애벌레"}, {"p": "big", "cap": "사진 ②", "sub": "크게 자란 애벌레"}], "f": ["사진 ①의 애벌레는 ~색이에요.", "색깔이 다른 까닭은 ~인 것 같아요.", "왜 ~할까?"], "note": "<h3>발문<\/h3><ul><li>배추흰나비 애벌레는 무슨 색깔일까요?<\/li><li>배추흰나비 애벌레 몸의 색깔이 다른 까닭은 무엇일까요?<\/li><\/ul><h3>예상 반응 (지도서 348쪽)<\/h3><ul><li>알에서 갓 나온 애벌레는 연한 노란색입니다. 작은 애벌레는 연한 초록색이고, 큰 애벌레는 초록색입니다.<\/li><li>알에서 갓 나온 애벌레는 알의 색깔과 비슷하게 연한 노란색인 것 같습니다. 초록색 잎을 먹 ①~④에 그림과 함께 써요."}, "link": {"href": "../sem1/u4-2.html", "label": "가상 관찰실 열기 (교과서 버전 앱)", "note": "알이 없거나 직접 보기 어려운 장면을 볼 때 써요."}, "note": "<h3>예상 결과 (지도서 348, 352~353쪽)<\/h3><ul><li>알 — 생김새: 길쭉하고 주름진 옥수수 모양으로, 노란색입니다. 크기는 약 1 mm입니다. / 움직임: 움직이지 않습니다.<\/li><li>알에서 애벌레가 나오는 모습: 알의 색깔이 연해지면서 알 속에서 애벌레의 움직임이 보입니다. 애벌레가 알껍데기를 뚫고 나온 뒤 알껍데기를 갉아 먹습니다.<\/li><li>애벌레 — 생김새: 알에서 갓 나왔을 때는 연한 노란색이고, 잎을 먹고 자라면서 초록색으로 변합니다. 긴 원통 모양으로, 몸이 여러 마디로 나뉘어 있고 털로 덮여 있습니다. 자라는 동안 네 번 허물을 벗으면서 몸의 크기가 커집니다. 크기는 약 2 mm~30 mm입니다. / 움직임: 기어서 움직입니다. 잎을 갉아 먹거나 똥을 누고 이동합니다.<\/li><\/ul><h3>지도 길잡이 (지도서 348, 352~353쪽)<\/h3><ul><li>알은 잎 뒷면에 붙어 있는 경우가 많으나 잎 앞면과 줄기에 붙어 있는 경우도 있으므로 자세히 살펴보게 한다.<\/li><li>알에서 애벌레가 나오는 모습은 직접 관찰하기 어려우므로 「과학」 90쪽 사진이나 관련 영상을 활용한다. 알에서 나온 애벌레가 알껍데기를 갉아 먹는 것은 영양분을 보충하고, 흔적을 없애 다른 동물로부터 자신을 보호하기 위해서다.<\/li><li>애벌레는 가장 오랜 기간 관찰하는 단계이므로 여러 번 관찰해 크기 변화를 기록하게 한다. 크기가 눈에 띄게 차이 나거나 허물이 보이는 시점에 관찰 일지를 쓰면 좋다.<\/li><li>「과학」 91쪽 수학 도우미: 1 mm는 1 cm를 똑같이 10칸으로 나누었을 때 작은 눈금 한 칸의 길이입니다.<\/li><\/ul><h3>안전 (지도서 348쪽)<\/h3><p>관찰 중 잎에서 떨어진 애벌레는 손으로 만지지 않고, 잎, 나뭇가지 등을 가까이 대 주어 스스로 올라오도록 한다. 어려우면 교사가 물에 젖은 붓으로 다시 케일 화분에 올릴 수 있다.<\/p><h3>활동 후 (지도서 353쪽)<\/h3><p>관찰한 뒤 케일 화분을 다시 사육 망에 넣어 번데기와 어른벌레가 될 때까지 기른다. 시든 케일 잎과 애벌레의 똥은 교사의 안내에 따라 치운다.<\/p>"}, {"k": "venn", "t": "같은 점·다른 점", "min": 6, "hd": "배추흰나비알과 애벌레를 견주어요", "ask": "관찰 1에서 쓴 표를 보며 생김새와 움직임을 견주어요. 한쪽만 그런 점은 양쪽 칸에, 둘 다 그런 점은 가운데 칸에 써요.", "a": "🥚 알", "b": "🐛 애벌레", "fa": "알은 ~", "fs": "둘 다 ~", "fb": "애벌레는 ~", "after": "알과 애벌레 중에서 크기가 달라지는 것은 무엇이었나요? 어떻게 커졌나요?", "note": "<h3>발문<\/h3><ul><li>배추흰나비알과 애벌레의 생김새, 움직임을 비교하여 이야기해 볼까요? (「과학」 91쪽 정리해요)<\/li><\/ul><h3>예상 반응 (지도서 348쪽)<\/h3><ul><li>알은 길쭉하고 주름진 옥수수 모양이고, 애벌레는 긴 원통 모양으로 마디가 있습니다.<\/li><li>알은 노란색이고, 애벌레는 연한 노란색이다가 자라면서 초록색으로 변합니다.<\/li><li>알은 크기가 변하지 않지만, 애벌레는 허물을 벗으면서 몸의 크기가 커집니다.<\/li><li>알은 움직이지 않지만, 애벌레는 잎을 갉아 먹거나 똥을 누고 기어서 움직입니다.<\/li><\/ul><h3>지도서 근거<\/h3><p>“한살이 단계를 관찰하는 기준으로 생김새와 움직임을 제시하였으나 이 외에 다른 비교 기준도 가능하다.” (지도서 353쪽) 같은 점 칸에는 ‘케일 잎에 있다’, ‘배추흰나비의 한살이 단계다’ 같은 답이 나올 수 있습니다. 붙임쪽지는 채점하지 않습니다.<\/p>", "hints": [["알은 움직이지 않고 잎에 붙어 있어요.", "알은 길쭉한 모양이고 세로 줄무늬가 있어요."], ["둘 다 배추 잎 위에서 볼 수 있어요.", "둘 다 크기가 작아서 돋보기로 보면 잘 보여요."], ["애벌레는 잎을 갉아 먹으며 점점 커져요.", "애벌레는 몸에 털이 있고 기어서 움직여요."]]}, {"k": "lab", "t": "번데기·어른벌레 관찰", "min": 16, "hd": "관찰 2 · 배추흰나비 번데기와 어른벌레를 관찰해요", "ask": "돋보기와 자로 관찰하며 한 일에 ☑ 표시해요. 관찰한 것을 표에 쓰고, 「실험관찰」 관찰 일지에 그림도 그려요.", "list": ["① 번데기가 어디에 붙어 있는지 찾아요. (사육 망 귀퉁이, 화분 가장자리도 봐요.)", "② 번데기의 모양, 색깔, 크기를 관찰해요.", "③ 번데기가 투명해지면 한 번 더 관찰해요.", "④ 번데기에서 어른벌레가 나오는 모습을 영상으로 봐요.", "⑤ 어른벌레의 몸, 날개, 다리를 관찰해요.", "⑥ 관찰한 뒤 어른벌레를 자연으로 보내요."], "safe": ["번데기와 어른벌레를 손으로 만지지 않아요.", "번데기를 건드리거나 옮기지 않아요.", "관찰이 끝나면 손을 씻어요."], "table": {"corner": "관찰한 것", "cols": ["모양과 색깔", "크기", "움직임"], "rows": ["🟢 번데기", "🟢 투명해진 번데기", "🦋 어른벌레"], "ph": ["어떤 모양? 무슨 색?", "약 ○ mm", "움직일까? 이동할까?"], "note": "「실험관찰」 56~57쪽 관찰 일지 ⑤~⑧에 그림과 함께 써요."}, "link": {"href": "../sem1/u4-2.html", "label": "가상 관찰실 열기 (교과서 버전 앱)", "note": "날개돋이처럼 직접 보기 어려운 장면을 볼 때 써요."}, "note": "<h3>예상 결과 (지도서 349, 354~355쪽)<\/h3><ul><li>번데기 — 생김새: 가운데가 볼록하고 양쪽 끝이 뾰족합니다. 크기는 약 25 mm입니다. 처음에는 초록색이다가 주변과 비슷하게 색깔이 변합니다. 몸에 털이 없고 여러 개의 마디가 있습니다. / 움직임: 한곳에 붙어 있습니다. 이동하지 않습니다.<\/li><li>번데기에서 어른벌레가 나오는 모습: 번데기의 표면이 점점 투명해지고 어른벌레의 모습이 보입니다. 번데기의 등 부분이 갈라지며 어른벌레의 머리부터 나옵니다. 몸 전체가 빠져나온 뒤 젖은 날개를 서서히 펼치며 말립니다.<\/li><li>어른벌레 — 생김새: 몸은 머리, 가슴, 배로 구분됩니다. 머리에는 더듬이와 눈이 한 쌍씩 있고, 대롱 모양의 입이 있습니다. 가슴에는 날개 두 쌍과 다리 세 쌍이 있습니다. 연한 노란빛을 띠는 흰색 날개에 검은 무늬가 있습니다. / 움직임: 날개를 움직여 날아다닙니다.<\/li><\/ul><h3>지도 길잡이 (지도서 349, 354~355쪽)<\/h3><ul><li>허물을 네 번 벗은 애벌레가 먹는 것을 멈추고 묽은 똥을 누기 시작하면 번데기가 될 위치를 찾는 시점이므로 자세히 관찰한다.<\/li><li><b>번데기가 된 직후나 외부 충격이 있는 경우 꿈틀거리는 모습을 볼 수 있으므로, ‘움직임이 없다.’라고 하지 않고 ‘이동하지 않는다.’라고 지도한다.<\/b> (지도서 349쪽) 표의 흐린 글도 ‘움직일까? 이동할까?’로 두었습니다.<\/li><li>번데기를 관찰하는 시점은 색깔이 주변과 비슷하게 변한 때와 날개돋이를 앞둔 때로 하면 특징을 잘 볼 수 있다. 날개돋이는 학교에서 관찰하기 어려우므로 영상 자료나 타임랩스 촬영(지도서 351쪽)을 활용한다.<\/li><li>어른벌레는 날아다니거나 날개를 접고 앉아 자세히 관찰하기 어려우므로 「과학」 93쪽 사진과 그림으로 생김새를 확인하게 한다. 어른벌레는 케일 잎을 먹을 수 없고 사육 망이 좁으므로 관찰이 끝난 뒤 학교 화단에 풀어 준다.<\/li><\/ul><h3>안전과 활동 후 (지도서 347, 349, 355쪽)<\/h3><p>번데기와 어른벌레를 손으로 만지지 않는다. 번데기에서 어른벌레가 나올 때 건드리거나 위치를 옮기는 등 자극을 주지 않는다. 어른벌레를 날려 준 뒤에는 교사의 안내에 따라 사육 환경을 정리한다.<\/p>"}, {"k": "pvr", "t": "예상과 결과 비교", "min": 7, "key": "P1", "hd": "예상과 관찰 결과를 견주어 봐요", "ask": "위에 우리가 한 예상이 있어요. 관찰한 결과를 쓰고, 예상과 같았는지 달랐는지 써요.", "f": ["관찰해 보니 ~는 ~했어요.", "예상과 ~이 같았어요/달랐어요.", "그 까닭은 ~인 것 같아요."], "after": "번데기는 먹지도 않고 이동하지도 않았어요. 번데기는 살아 있는 걸까요?", "note": "<h3>발문<\/h3><ul><li>애벌레는 어떻게 커졌나요? 번데기는 어떻게 지냈나요?<\/li><li>예상과 결과가 달랐던 친구는 무엇이 달랐나요?<\/li><\/ul><h3>예상 반응 (지도서 348~349쪽)<\/h3><ul><li>애벌레는 잎을 먹고 자라며 네 번 허물을 벗으면서 몸의 크기가 커졌습니다.<\/li><li>번데기는 한곳에 붙어 있고 이동하지 않았습니다.<\/li><\/ul><h3>유의점<\/h3><p>‘번데기는 살아 있을까?’에는 “번데기가 먹이를 먹거나 이동하지 않을 뿐, 가끔 제자리에서 꿈틀거리는 모습을 볼 수 있으므로 번데기가 죽은 상태가 아님을 안내한다.”(지도서 347쪽)로 답합니다. 예상 쪽지는 앞 단계에서 쓴 것이 자동으로 위에 나옵니다.<\/p>", "hints": [["관찰해 보니 애벌레는 잎을 먹으며 점점 커졌어요.", "관찰해 보니 번데기는 먹지도 움직이지도 않았어요."], ["애벌레가 커질 거라는 예상과 같았어요.", "번데기도 기어 다닐 거라고 예상했는데 달랐어요."], ["그 까닭은 애벌레가 허물을 벗으면서 몸이 커지기 때문인 것 같아요.", "그 까닭은 번데기 속에서 어른벌레가 될 준비를 하기 때문인 것 같아요."]]}, {"k": "sort", "t": "어느 단계일까?", "min": 8, "routine": "한살이 단계 나누기", "hd": "이 모습은 한살이의 어느 단계일까요?", "ask": "카드에 적힌 생김새나 움직임을 읽고, 알맞은 단계를 눌러요.", "bins": [{"k": "e", "n": "알", "e": "🥚", "c": "#E8961E"}, {"k": "l", "n": "애벌레", "e": "🐛", "c": "#6A4FC9"}, {"k": "p", "n": "번데기", "e": "🟢", "c": "#1F9E63"}, {"k": "a", "n": "어른벌레", "e": "🦋", "c": "#2F74E0"}], "items": [{"k": "e", "e": "🌽", "x": "길쭉하고 주름진 옥수수 모양이에요.", "w": "알은 노란색의 길쭉하고 주름진 모양이에요. (「과학」 90쪽)"}, {"k": "l", "e": "🔎", "x": "몸이 여러 마디로 나뉘고 털로 덮여 있어요.", "w": "애벌레는 몸이 여러 마디로 나뉘어 있고 털로 덮여 있어요. (「과학」 90쪽)"}, {"k": "p", "e": "🏔️", "x": "가운데가 볼록하고 양쪽 끝이 뾰족해요.", "w": "번데기는 가운데가 볼록하고 양쪽 끝이 뾰족해요. (지도서 349쪽)"}, {"k": "a", "e": "🧐", "x": "가슴에 날개 두 쌍과 다리 세 쌍이 있어요.", "w": "어른벌레의 몸은 머리, 가슴, 배로 구분되고, 가슴에 날개 두 쌍과 다리 세 쌍이 있어요. (「과학」 93쪽)"}, {"k": "l", "e": "📏", "x": "허물을 벗으면서 몸의 크기가 커져요.", "w": "애벌레는 자라는 동안 허물을 벗으면서 몸의 크기가 커져요. (「과학」 90쪽)"}, {"k": "e", "e": "⏸️", "x": "움직이지 않고, 크기도 변하지 않아요.", "w": "알은 움직이지 않고 크기가 변하지 않아요. (지도서 348쪽)"}, {"k": "a", "e": "💨", "x": "날개를 움직여 날아다녀요.", "w": "어른벌레는 날개를 움직여 날아다녀요. (지도서 349쪽)"}, {"k": "p", "e": "📍", "x": "한곳에 붙어 이동하지 않고, 점점 주변과 비슷한 색깔로 변해요.", "w": "번데기는 한곳에 붙어 이동하지 않고, 점점 주변과 비슷한 색깔로 변해요. 가끔 제자리에서 꿈틀거리기도 해요. (「과학」 92쪽, 지도서 347, 349쪽)"}], "after": "번데기와 어른벌레는 무엇이 가장 크게 다른가요?", "col": "🔎 내가 관찰 일지에 더 쓴 특징", "colph": "~는 ~했어요.", "note": "<h3>발문<\/h3><ul><li>배추흰나비 번데기와 어른벌레의 생김새, 움직임을 비교하여 이야기해 볼까요? (「과학」 93쪽 정리해요)<\/li><li>배추흰나비처럼 몸이 머리, 가슴, 배의 세 부분으로 구분되고, 다리가 세 쌍인 동물을 무엇이라고 할까요? (예상 반응: 곤충이라고 합니다. 지도서 349쪽)<\/li><\/ul><h3>예상 반응 (지도서 349쪽)<\/h3><ul><li>번데기는 가운데가 볼록하고 양쪽 끝이 뾰족하며, 어른벌레는 몸이 머리, 가슴, 배로 구분되고 날개와 다리, 입과 더듬이가 있습니다.<\/li><li>번데기는 한곳에 붙어 이동하지 않지만, 어른벌레는 날개를 움직여 날아다닙니다.<\/li><\/ul><h3>지도서 근거<\/h3><p>카드의 특징은 「과학」 90~93쪽과 지도서 348~349쪽 예상 반응입니다. 이 단계는 관찰한 특징을 단계별로 정리하는 활동이며, 한살이의 순서는 다음 단계(우리 반 결론)에서 아이들이 씁니다. 아래 칸은 채점하지 않습니다.<\/p>"}, {"k": "define", "t": "우리 반 결론", "min": 7, "hd": "배추흰나비의 한살이를 한 문장으로 써요", "ask": "관찰한 순서를 떠올려 낱말 카드를 눌러 빈칸에 넣어 문장을 완성해요. 다 쓰면 ‘교과서 문장과 비교하기’를 눌러요.", "words": ["알에서", "애벌레가 나와", "허물을 벗으며 자라고", "번데기가 되고", "어른벌레가 나와", "다시 알을 낳아요"], "frame": ["배추흰나비는", ""], "btn": "교과서 문장과 비교하기", "bookLabel": "교과서 문장", "src": "「과학」 90~93쪽", "book": "배추흰나비알에서 나온 애벌레는 자라는 동안 허물을 벗으면서 몸의 크기가 커집니다. 네 번 허물을 벗은 애벌레는 번데기가 되고, 시간이 지나면 번데기의 등 부분이 갈라지면서 어른벌레가 나옵니다. 어른벌레가 된 배추흰나비는 암컷과 수컷이 짝짓기를 한 뒤에 알을 낳아 대를 이어 갑니다.<br>📌 한눈에 쏙: 배추흰나비의 한살이는 알 - (애벌레) - (번데기) - 어른벌레의 순으로 이루어집니다.", "note": "<h3>발문<\/h3><ul><li>배추흰나비의 한살이는 어떻게 이루어지나요?<\/li><\/ul><h3>예상 반응 (지도서 349쪽)<\/h3><ul><li>배추흰나비알에서 애벌레가 나옵니다.<\/li><li>배추흰나비 애벌레는 허물을 벗으며 자라고 한곳에 붙어 번데기가 됩니다.<\/li><li>시간이 지나면 배추흰나비 번데기에서 어른벌레가 나옵니다.<\/li><\/ul><h3>지도서 근거<\/h3><p>교과서 문장은 「과학」 90쪽·92~93쪽 개념 설명을 줄인 것과 93쪽 한눈에 쏙 ①(정답 ‘애벌레’, ‘번데기’, 지도서 349쪽)입니다. 「과학」 93쪽 도우미의 ‘곤충’(몸이 머리, 가슴, 배 세 부분으로 구분되고 다리가 세 쌍인 동물)도 이때 함께 짚어 줄 수 있습니다.<\/p><h3>유의점<\/h3><p>‘다시 알을 낳아요’ 카드는 2차시에 만든 ‘한살이’의 뜻(자라서 다음 알을 낳는 과정)과 잇기 위해 넣었습니다. 지도서에 없는 용어로 한살이의 종류를 나누지 않습니다.<\/p>", "hints": [["알에서 애벌레가 나와 허물을 벗으며 자라요.", "알에서 애벌레가 나와 잎을 먹으며 자라요."]]}, {"k": "check", "t": "개념 확인
