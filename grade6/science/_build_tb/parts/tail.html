<script>
(function(){
  const main=document.querySelector('main'); if(!main) return;
  const secs=[...main.querySelectorAll(':scope > section')]; if(!secs.length) return;
  const bar=document.getElementById('ovBar'), made=document.getElementById('ovMade'), dlg=document.getElementById('ovHomeBox');
  main.appendChild(bar); main.appendChild(made);
  let on=true, si=0;
  /* 활동을 작은 화면으로 나눈다: 소제목 + 내용 높이 기준 */
  const steps=[]; let TARGET=640;
  function buildSteps(){
    steps.length=0;
    { const nv=document.querySelector('nav'); TARGET=Math.max(280, Math.min(900, innerHeight-((nv&&nv.offsetHeight)||0)-250)); }
    secs.forEach(sec=>{ const kids=[...box(sec).children].filter(e=>e.id!=='ovBar'&&e.id!=='ovMade');
      /* 묶음(unit) 만들기: 그림(lab)과 바로 뒤의 조작 단추는 함께 둔다 */
      const units=[]; let i=0;
      const isStart=e=>!(e.dataset&&e.dataset.glue)&&isStart0(e), isStart0=e=>e.tagName==='H3'||(e.tagName==='P'&&!e.classList.contains('tip'))||e.tagName==='DETAILS'||(e.tagName==='DIV'&&/\b(lab|gallery|warn)\b/.test(e.className)&&e.offsetHeight>0)||(e.tagName==='LABEL'&&e.offsetHeight>100)||(e.tagName==='DIV'&&e.children.length===1&&e.firstElementChild.matches('figure.photo'))||(e.matches&&e.matches('figure.photo'));
      while(i<kids.length){ const el=kids[i];
        if(!el.dataset.alwaysSet && (el.tagName==='H2'||el.classList.contains('stage'))){ el.dataset.always='1'; el.dataset.alwaysSet='1'; i++; continue; }
        const u=[el]; i++;
        while(i<kids.length && !isStart(kids[i])){ u.push(kids[i]); i++; }
        units.push(u); }
      /* 소제목(h3)만 화면 끝에 남지 않게 바로 뒤 묶음과 붙인다 */
      for(let ui=units.length-2; ui>=0; ui--){ if(units[ui].length===1&&units[ui][0].tagName==='H3'){ units.splice(ui,2,units[ui].concat(units[ui+1])); } }
      /* 문제 여러 개가 한 칸에 모인 곳(형성·수행 평가)은 문제마다 나눈다 */
      box(sec).querySelectorAll('[data-deep]>*').forEach(e=>{ delete e.dataset.part; e.classList.remove('ovhide'); });
      for(let ui=units.length-1; ui>=0; ui--){ const u=units[ui], k=u.findIndex(e=>e.matches&&e.matches('#quiz,#perf,#dex.cards,#surf.cards')), c=u[k];
        if(c && c.children.length>=2 && c.getBoundingClientRect().height>TARGET*0.6){
          c.dataset.deep='1'; delete c.dataset.part; const pre=u.slice(0,k), post=u.slice(k+1), ch=[...c.children].map(x=>[x]);
          if(pre.length) ch[0]=pre.concat(ch[0]); if(post.length) ch[ch.length-1]=ch[ch.length-1].concat(post);
          units.splice(ui,1,...ch); } }
      /* 묶음을 높이 기준으로 담기 */
      let part=0, acc=0, first=true;
      units.forEach(u=>{ const h=u.reduce((a,e)=>a+(e.getBoundingClientRect().height||0),0);
        const isHead=u[0].tagName==='H3';
        if(!first && ((isHead && acc>180) || (acc>160 && acc+h>TARGET))){ part++; acc=0; }
        u.forEach(e=>e.dataset.part=part); acc+=h; first=false; });
      const nums=[...kids,...box(sec).querySelectorAll('[data-deep]>*')].filter(e=>e.dataset.part!==undefined).map(e=>+e.dataset.part);
      const maxp=nums.length?Math.max(...nums):0;
      for(let p=0;p<=maxp;p++) steps.push({sec,p}); });
  }
  buildSteps();
  /* 내용이 짧으면 화면 높이에 맞춰 키운다 */
  function box(sec){ let d=sec.querySelector(':scope > .fitbox'); if(d) return d;
    d=document.createElement('div'); d.className='fitbox';
    const keep=[...sec.children]; keep.forEach(e=>d.appendChild(e)); sec.appendChild(d); return d; }
  function grow(){ const st=steps[si]; if(!st) return; const sec=st.sec, b=box(sec);
    if(!on){ b.style.transform='none'; b.style.width='100%'; b.style.marginLeft=''; sec.style.height=''; return; }
    b.style.transform='none'; b.style.width='100%'; b.style.marginLeft=''; sec.style.height='';
    const top=sec.getBoundingClientRect().top;
    const barH=(document.getElementById('ovBar')||{offsetHeight:0}).offsetHeight;
    const avail=window.innerHeight - top - barH - 26;
    const MIN=b.querySelector(':scope>[data-glue]:not(.ovhide)')?0.7:0.85; let h=b.offsetHeight; if(h<20||avail<160) return;
    let k=Math.min(1.5, Math.max(MIN, avail/h));
    for(let pass=0; pass<4 && Math.abs(k-1)>0.02; pass++){
      b.style.width=(100/k)+'%'; b.style.marginLeft=((1-1/k)*50)+'%'; b.style.marginRight='0'; b.style.transform='scale('+k+')';
      const vis=b.offsetHeight*k;
      if(vis<=avail) break;
      k=Math.max(MIN, k*avail/vis); if(k<1&&vis<=avail) break;
    }
    if(Math.abs(k-1)>0.02){ b.style.width=(100/k)+'%'; b.style.marginLeft=((1-1/k)*50)+'%'; b.style.transform='scale('+k+')'; sec.style.height=(b.offsetHeight*k+14)+'px'; sec.style.overflow='visible'; }
    else { b.style.width='100%'; b.style.marginLeft=''; b.style.transform='none'; sec.style.height=''; }
  }
  addEventListener('resize',()=>setTimeout(grow,80));
  addEventListener('load',()=>setTimeout(grow,150));
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>setTimeout(grow,150));
  function label(st){ const h3=[...box(st.sec).children].find(e=>e.tagName==='H3'&&+e.dataset.part===st.p);
    const h2=st.sec.querySelector('h2'); return h3?h3.textContent.trim():(h2?h2.textContent.trim():''); }
  function show(i){ si=Math.max(0,Math.min(steps.length-1,i)); const st=steps[si];
    secs.forEach(s=>s.classList.toggle('cur',s===st.sec));
    [...box(st.sec).children].forEach(el=>{ if(el.dataset.always) return;
      el.classList.toggle('ovhide', el.dataset.part!==undefined && +el.dataset.part!==st.p); });
    box(st.sec).querySelectorAll('[data-deep]>*').forEach(el=>el.classList.toggle('ovhide', el.dataset.part!==undefined && +el.dataset.part!==st.p));
    document.getElementById('ovPos').textContent=(si+1)+' / '+steps.length;
    document.getElementById('ovPrev').disabled=si===0;
    document.getElementById('ovNext').disabled=si===steps.length-1;
    const a=document.querySelector('nav a[href="#'+st.sec.id+'"]');
    document.querySelectorAll('nav a').forEach(x=>x.style.outline='');
    if(a){ a.style.outline='3px solid var(--sun)'; a.scrollIntoView({block:'nearest',inline:'center'}); }
    window.scrollTo(0,0); grow(); setTimeout(grow,150);
  }
  function setOn(v){ on=v; document.body.classList.toggle('ov',on);
    document.getElementById('ovFull').textContent=on?'📜 전체':'🖥️ 한 화면';
    if(on) show(si);
    else secs.forEach(s=>{ s.classList.remove('cur'); s.style.height=''; const b=s.querySelector(':scope > .fitbox'); if(b){ b.style.transform='none'; b.style.width='100%'; b.style.marginLeft=''; [...b.children].forEach(el=>el.classList.remove('ovhide')); b.querySelectorAll('[data-deep]>*').forEach(el=>el.classList.remove('ovhide')); } }); }
  function buildList(){ const L=document.getElementById('ovList'); L.innerHTML='';
    steps.forEach((st,n)=>{ const b=document.createElement('button'); const stg=st.sec.querySelector('.stage');
      b.innerHTML='<small>'+(stg?stg.textContent:'')+'</small><br>'+(n+1)+'. '+label(st);
      const a=document.querySelector('nav a[href="#'+st.sec.id+'"]'); if(a&&a.classList.contains('done')) b.classList.add('done');
      b.onclick=()=>{ dlg.classList.remove('open'); if(!on) setOn(true); show(n); };
      L.appendChild(b); }); }
  document.getElementById('ovHome').onclick=()=>{ buildList(); dlg.classList.add('open'); };
  document.getElementById('ovClose').onclick=()=>dlg.classList.remove('open');
  document.getElementById('ovStart').onclick=()=>{ dlg.classList.remove('open'); if(!on) setOn(true); show(0); };
  dlg.addEventListener('click',e=>{ if(e.target===dlg) dlg.classList.remove('open'); });
  document.getElementById('ovPrev').onclick=()=>show(si-1);
  document.getElementById('ovNext').onclick=()=>show(si+1);
  document.getElementById('ovFull').onclick=()=>setOn(!on);
  document.querySelectorAll('nav a').forEach(a=>a.addEventListener('click',e=>{ if(!on) return;
    const id=a.getAttribute('href').slice(1); const n=steps.findIndex(x=>x.sec.id===id); if(n>=0){ e.preventDefault(); show(n); } }));
  addEventListener('keydown',e=>{ if(!on||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    if(e.key==='ArrowRight') show(si+1); if(e.key==='ArrowLeft') show(si-1); });
  const nw=document.querySelector('nav .wrap');
  if(nw && !document.getElementById('ovNavMade')){ const sp=document.createElement('span'); sp.id='ovNavMade'; sp.textContent='만든 사람: 초등교사 홍지희'; nw.appendChild(sp); var hc=document.querySelector('.hj-contact'); if(hc) nw.appendChild(hc.cloneNode(true)); }
  const hp=document.querySelector('header .wrap p');
  if(hp && !/홍지희/.test(hp.textContent)) hp.insertAdjacentHTML('beforeend',' · 만든 사람: 초등교사 홍지희');
  function rebuild(){ const cur=steps[si], sec=cur?cur.sec:null;
    secs.forEach(s=>{ s.classList.add('cur'); s.style.height=''; const b=s.querySelector(':scope > .fitbox'); if(b){ b.style.transform='none'; b.style.width='100%'; b.style.marginLeft=''; [...b.children].forEach(e=>e.classList.remove('ovhide')); b.querySelectorAll('[data-deep]>*').forEach(e=>e.classList.remove('ovhide')); } });
    buildSteps();
    let n=sec?steps.findIndex(x=>x.sec===sec):0; if(n<0) n=0; show(n); }
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>setTimeout(rebuild,60));
  addEventListener('load',()=>setTimeout(rebuild,100));
  /* 한 화면 보기에서는 폭 제한을 풀어 사진을 크게 본다 */
  secs.forEach(sec=>sec.querySelectorAll('[style*="width:min("]').forEach(el=>{ el.dataset.ovw=el.getAttribute('style'); }));
  function widen(v){ secs.forEach(sec=>sec.querySelectorAll('[data-ovw]').forEach(el=>{
      el.setAttribute('style', v ? el.dataset.ovw.replace(/width:min\([^)]*\)/,'width:100%') : el.dataset.ovw); })); }
  const _setOn=setOn; setOn=function(v){ widen(v); _setOn(v); };
  setOn(true);
})();
</script>

<style id="biCss">
.bw{white-space:nowrap;display:inline-block;vertical-align:middle}
.bw input{font-family:"Jua",sans-serif;font-size:1.25em;text-align:center;padding:.05em .3em;margin:0 .15em;border:3px solid var(--sea,#1c6fa8);border-radius:10px;background:var(--paper,#fff);color:var(--ink,#222);min-height:2.1em;vertical-align:middle}
.bw input::placeholder{color:#9aa9b2;opacity:1}
.bw input.ok{border-color:#16804a;background:#dcf5e5;color:#0d5a31}
.bw input.no{border-color:#c2332c;background:#fde2df}
.biShow{margin-left:8px}
</style>
<script>
/* 한눈에 쏙 빈칸: 학생이 직접 써넣고 확인하기 */
(function(){
  const CFG=/*CFG*/[];
  const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  const cho=w=>[...w].map(c=>{const k=c.charCodeAt(0)-44032; return k>=0&&k<11172?CHO[Math.floor(k/588)]:c;}).join('');
  const norm=v=>v.replace(/\s/g,'').replace(/[.。!?]/g,'');
  CFG.forEach(cfg=>{
    const btn=document.getElementById(cfg.btn); if(!btn||btn.dataset.bi) return; btn.dataset.bi='1';
    const orig=btn.onclick;
    /* 빈칸 상자 모으기, 붙어 있는 상자는 한 낱말로 */
    const items=Object.keys(cfg.ans).map(id=>{const el=document.getElementById(id); return el?{box:el.closest('.blank')||el,a:cfg.ans[id]}:null;}).filter(Boolean);
    const groups=[];
    items.forEach(it=>{ const g=groups[groups.length-1];
      if(g && (g.boxes.includes(it.box))){ g.a+=it.a; return; }
      if(g){ let n=g.boxes[g.boxes.length-1].nextSibling; while(n&&n.nodeType===3&&!n.textContent.trim()) n=n.nextSibling;
        if(n===it.box){ g.boxes.push(it.box); g.a+=it.a; return; } }
      groups.push({boxes:[it.box],a:it.a}); });
    groups.forEach(g=>{
      const alt=(cfg.alt||{})[g.a]; g.ok=v=>{ v=norm(v); return v===g.a || (alt&&new RegExp(alt).test(v)); };
      const w=document.createElement('span'); w.className='bw';
      const inp=document.createElement('input'); inp.type='text'; inp.autocomplete='off'; inp.setAttribute('aria-label','빈칸에 알맞은 낱말');
      inp.placeholder=cho(g.a); inp.style.width=(Math.max(2,g.a.length)*1.15+1.2)+'em';
      w.appendChild(inp); g.boxes[0].before(w); g.boxes.forEach(b=>b.style.display='none'); g.inp=inp;
      const tail=g.boxes[g.boxes.length-1].nextSibling;
      if(tail&&tail.nodeType===3){ const m=tail.textContent.match(/^\S+/); if(m){ w.appendChild(document.createTextNode(m[0])); tail.textContent=tail.textContent.slice(m[0].length); } }
      inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); btn.click(); } });
      inp.addEventListener('input',()=>inp.classList.remove('no'));
    });
    const row=btn.closest('.row')||btn.parentNode;
    let fbEl=row.nextElementSibling; if(!(fbEl&&fbEl.classList.contains('fb'))) fbEl=null;
    const say=(m,cls)=>{ if(!fbEl) return; fbEl.textContent=m; fbEl.className='fb '+cls; };
    let tries=0, solved=false;
    const showBtn=document.createElement('button'); showBtn.textContent='👀 정답 보기'; showBtn.className='biShow'; showBtn.hidden=true; btn.after(showBtn);
    function finish(){ solved=true; groups.forEach(g=>{ g.inp.readOnly=true; g.inp.classList.remove('no'); g.inp.classList.add('ok'); });
      btn.disabled=true; showBtn.hidden=true; if(orig) orig.call(btn); }
    btn.textContent='✅ 확인하기';
    btn.onclick=()=>{ if(solved) return;
      if(groups.some(g=>!g.inp.value.trim())){ say('빈칸에 알맞은 낱말을 써 보세요. 칸 안의 글자는 첫소리 힌트예요.','info'); (groups.find(g=>!g.inp.value.trim()).inp).focus(); return; }
      const bad=groups.filter(g=>!g.ok(g.inp.value));
      groups.forEach(g=>g.inp.classList.toggle('ok',g.ok(g.inp.value)));
      if(!bad.length){ finish(); return; }
      tries++; bad.forEach(g=>g.inp.classList.add('no'));
      say((groups.length>1?'빨간 칸을 ':'')+'다시 생각해 봐요. 첫소리 힌트: '+bad.map(g=>cho(g.a)).join(', ')+(tries>=2?' · 어려우면 ‘정답 보기’를 눌러요.':''),'no');
      if(tries>=2) showBtn.hidden=false; };
    showBtn.onclick=()=>{ groups.forEach(g=>g.inp.value=g.a); finish(); };
  });
})();
</script>

<style id="ovFit">
/* 크롬북 가로 화면: 큰 그림은 화면 높이에 맞춰 줄이기 */
body.ov .fitbox>svg,body.ov .fitbox>div:not(.lab)>svg,body.ov .mapBox svg{max-height:min(42vh,360px)}
body.ov .photo img,body.ov figure img{max-height:min(240px,34vh)}

  body.ov .pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center;margin:4px 0}

  body.ov .player{width:100%!important;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);column-gap:16px;align-items:center}
  body.ov .player>*{grid-column:2}
  body.ov .player>svg{grid-column:1;grid-row:1/span 6;max-height:min(58vh,460px)!important;width:100%!important;height:auto}

</style>
<script>
/* 크롬북 가로 화면: 그림과 사진(또는 목록·표)을 나란히 */
(function(){
  const isPhoto=e=>e&&((e.matches('figure.photo'))||(e.tagName==='DIV'&&e.children.length===1&&e.firstElementChild.matches('figure.photo')));
  const okNext=e=>e&&(isPhoto(e)||e.tagName==='UL'||e.matches('table.rtable'));
  document.querySelectorAll('main>section').forEach(sec=>{
    const box=sec.querySelector(':scope>.fitbox')||sec;
    [...box.children].forEach(el=>{
      const a=el.tagName==='svg'&&!el.closest('.lab');
      const b=el.matches('div.lab')&&el.offsetHeight>0;
      const nx=el.nextElementSibling;
      if(!(a&&okNext(nx)) && !(b&&isPhoto(nx))) return;
      if(el.parentNode.classList.contains('pair')) return;
      const w=document.createElement('div'); w.className='pair'; el.before(w); w.appendChild(el); w.appendChild(nx);
    });
  });
  window.dispatchEvent(new Event('resize'));
})();
</script>
<style id="ovStick">
/* 답이 늘어나도 아래 메뉴가 늘 보이게 */
body.ov #ovBar{position:sticky;bottom:max(8px,env(safe-area-inset-bottom,0px));z-index:15}
</style>
<script>
/* 피드백 글이 나타나거나 숨은 내용이 열리면 한 화면 크기를 다시 맞춘다 */
(function(){ const m=document.querySelector('main'); if(!m||!window.MutationObserver) return;
  let tm=0; const kick=()=>{ clearTimeout(tm); tm=setTimeout(()=>window.dispatchEvent(new Event('resize')),60); };
  new MutationObserver(kick).observe(m,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['hidden','open']});
})();
</script>
